site_name: Azure AI-103 Study Notes
site_description: Personal study notes, quizzes and mind maps for Microsoft AI-103 (Developing AI Apps and Agents on Azure)
site_url: https://khuongdo.github.io/azure-ai-103/
repo_url: https://github.com/khuongdo/azure-ai-103

# docs/official holds local copies of Microsoft material: keep it out of the public site
exclude_docs: |
  official/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

nav:
  - Home: index.md
  - Study:
    - study/index.md
    - Overview:
      - Summary: study/overview/summary.md
      - Azure services map: study/overview/azure-services-overview.md
    - Deep dives:
      - Best practices overview: study/deep-dives/best-practices-and-real-world-scenarios.md
      - Retrieval and grounding: study/deep-dives/rag-retrieval-and-grounding.md
      - Agent safety and identity: study/deep-dives/agent-safety-and-identity.md
      - Capacity, cost, throttling: study/deep-dives/capacity-cost-and-throttling.md
      - Platform, network, reliability: study/deep-dives/platform-network-and-reliability.md
      - Observability and lifecycle: study/deep-dives/observability-and-agent-lifecycle.md
    - Quizzes:
      - Retrieval and grounding: study/quizzes/rag-retrieval-and-grounding-quiz.md
      - Agent safety and identity: study/quizzes/agent-safety-and-identity-quiz.md
      - Capacity, cost, throttling: study/quizzes/capacity-cost-and-throttling-quiz.md
      - Platform, network, reliability: study/quizzes/platform-network-and-reliability-quiz.md
      - Observability and lifecycle: study/quizzes/observability-and-agent-lifecycle-quiz.md
    - Practice tests:
      - Practice test 1 review: study/practice-tests/practice-test-1-review.md
    - Mind maps:
      - Mind maps: study/mind-maps/mindmap.md

markdown_extensions:
  - admonition
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

