markdown_extensions:
  - nl2br
  - admonition
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

