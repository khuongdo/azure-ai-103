site_name: Azure AI-103 Study Notes
site_description: Personal study notes, quizzes and mind maps for Microsoft AI-103 (Developing AI Apps and Agents on Azure)
site_url: https://khuongdo.github.io/azure-ai-103/
repo_url: https://github.com/khuongdo/azure-ai-103

# docs/official holds local copies of Microsoft material: keep it out of the public site
exclude_docs: |
  official/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

nav:
  - Home: index.md
  - Start here:
    - Study hub: study/index.md
    - Syllabus and study plan: study/course/index.md
    - Coverage matrix: study/course/coverage-matrix.md
    - Exam summary: study/overview/summary.md
    - Azure services map: study/overview/azure-services-overview.md
    - Best practices overview: study/deep-dives/best-practices-and-real-world-scenarios.md
  - "1. Plan and manage":
    - Lessons:
      - Model and service selection: study/deep-dives/model-and-service-selection.md
