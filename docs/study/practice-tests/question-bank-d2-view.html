<script>window.MOCK_EXAM = {"id": "bank-d2", "title": "Question bank: Implement generative AI and agentic solutions", "shortTitle": "Domain 2 bank", "description": "160 questions from mock exams 1 to 10, all in the domain \"Implement generative AI and agentic solutions\" (30-35% of the exam).", "defaultMinutes": 384, "domains": [{"id": 2, "name": "Implement generative AI and agentic solutions", "weight": "30-35%", "count": 160}], "questions": [{"d": 2, "q": "A trace shows that a tool call fails twice with a time-out and succeeds on the third attempt, in many conversations. Latency is high but answers are correct. Where should the team invest?", "o": [{"t": "In removing tracing to speed up responses", "c": false, "e": "Tracing is how the problem was found."}, {"t": "In a bigger language model", "c": false, "e": "The model is working correctly."}, {"t": "In reliability at the tool or the downstream service, because the pattern shows intermittent tool failure", "c": true, "e": "Retries followed by success identify an unreliable tool."}, {"t": "In a lower temperature", "c": false, "e": "Temperature is unrelated to tool time-outs."}], "concept": "Trace patterns point to the layer that needs work. \"Retries then success\" means intermittent tool failure. The agent is doing the right thing, but the tool or the service behind it is unreliable, so latency rises and cost grows through repeated calls.\n\nFixes belong at the tool: add timeouts and retries with backoff inside the tool, make the downstream service more reliable, cache stable results, and return status quickly for long work. In a function-calling agent, remember that runs expire 10 minutes after creation, so slow work should return a status immediately and be polled.\n\nTo measure, use the Tool Call Success evaluator (did the call technically succeed?) and watch time-outs on the `execute_tool` spans in the dashboard.\n\nChoose the layer by the pattern: model, prompt, tool or network.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/observability/concepts/trace-agent-concept", "https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/agent-evaluators"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 2, "q": "Users ask a very specific question about one clause. The answer is in a chunk that ranks 5th, but the application passes only `top_k = 3` chunks to the model, which answers \"not found\". What should you try first?", "o": [{"t": "Disable the prompt rule \"say you don't know\"", "c": false, "e": "This would make the model guess."}, {"t": "Raise `top_k` so that the right chunk reaches the prompt, and add keyword matching with hybrid search if exact names matter", "c": true, "e": "A very low `top_k` drops the right chunk before generation."}, {"t": "Increase `max_output_tokens`", "c": false, "e": "The prompt is missing the evidence, not the answer budget."}, {"t": "Change the embedding model", "c": false, "e": "This requires re-embedding and the chunk was already found."}], "concept": "RAG answers are limited by what reaches the prompt. `top_k` is the number of retrieved chunks that you pass to the model. If the right chunk is rank 5 and you pass only 3, the model never sees it and correctly (from its point of view) says \"not found\". The failure is in retrieval, not in generation.\n\nFirst try: raise `top_k` (for example to 5 to 10), watching the extra tokens and the risk of distractors. If the question contains exact names, clause numbers or codes, add keyword matching with hybrid search so the chunk ranks higher. A reranker can also move the right chunk up before you cut the list.\n\n`max_output_tokens` limits the answer length. Changing the embedding model requires re-indexing and is not the first step. Removing \"say you don't know\" would let the model guess, which is worse.\n\nCheck with the Retrieval and Document Retrieval metrics on a labeled question set.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-ranking"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A developer uses `client.responses.parse(...)` with a Pydantic model and Structured Outputs. In some cases `output_parsed` is empty, although no exception occurred. What should the code do before reading the parsed value?", "o": [{"t": "Increase `top_p` to 1.5", "c": false, "e": "This is not a valid fix."}, {"t": "Assume the schema is wrong and delete required fields", "c": false, "e": "Refusals are not caused by required fields."}, {"t": "Check for a refusal in the response, because the model can refuse a request instead of returning the object", "c": true, "e": "Learn says to always check for refusals before reading the parsed value."}, {"t": "Remove `strict` from the schema", "c": false, "e": "Strict mode is what guarantees the shape when the model answers."}], "concept": "Structured Outputs make the model follow a JSON Schema, but the model can still refuse a request, for example for safety reasons. In that case there is no object matching your schema. If your code reads the parsed value without checking, it may get nothing or fail later.\n\nThe practice from Learn: always check for refusals before reading the parsed value. In Python, pass a Pydantic model as `text_format` to `responses.parse` and the SDK builds the schema and returns a parsed object. Authenticate with Microsoft Entra ID rather than a key.\n\nAlso remember what strict output does and does not do: it guarantees shape, not truth. Unsupported keywords such as `pattern` or `minLength` need validation in your own code, and the combination with function calling needs `strict: true` and `parallel_tool_calls` set to false.\n\nTreat the content as untrusted until validated.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/structured-outputs"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "In the Responses API, which statement describes how to continue a multi-turn interaction?", "o": [{"t": "Store the state in the system prompt", "c": false, "e": "Prompts are not a state store."}, {"t": "Resend the whole history in every request because the service stores nothing", "c": false, "e": "A conversation or `previous_response_id` avoids resending the history."}, {"t": "Create a new agent version for every user message", "c": false, "e": "Versions are for changes to the agent, not for turns."}, {"t": "Continue from a previous response with `previous_response_id`, or use a conversation object that stores messages, tool calls and tool outputs", "c": true, "e": "A response is one execution. A conversation persists items across turns."}], "concept": "A multi-turn interaction needs state: the earlier messages, tool calls and tool outputs. With the Responses API you have two ways to continue.\n\nOption 1: chain responses. Pass `previous_response_id` with the id of the last response, and the service links the new request to the earlier context. Option 2: use a conversation object. You create a conversation, send requests with its id, and the service stores the messages, tool calls and tool outputs in it, so the history is durable and shared across requests.\n\nYou do not have to resend the whole history in each request, and creating a new agent version for each message is wrong, because agent versions describe configuration, not conversation state. Putting state into the system prompt wastes tokens and mixes data with instructions.\n\nRemember that conversation data is user data: apply access checks so a user can only continue their own conversation.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/runtime-components"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "A guardrail for an agent should inspect what the agent proposes to send to a tool (the tool name and arguments), and stop the action if it would send sensitive data. Which intervention point and behavior apply?", "o": [{"t": "User input, with annotate only", "c": false, "e": "User input is scanned before the model runs and does not see the tool arguments the agent creates."}, {"t": "Output, with annotate only", "c": false, "e": "Output is the final answer. Annotate-only does not block."}, {"t": "Tool call, with annotate and block: the call is not executed and the agent stops until there is another user input", "c": true, "e": "This point scans what the agent proposes to send to a tool. It is preview and for agents only."}, {"t": "Tool response, which stops the model from reading files", "c": false, "e": "Tool response scans what a tool sends back."}], "concept": "A guardrail control has a risk, an intervention point and an action. The four intervention points are user input, tool call, tool response and output.\n\nThe tool call intervention point examines what the agent proposes to send to a tool: the tool name and the arguments, before the tool runs. If the arguments contain sensitive data, the control with annotate and block action stops the call. The call is not executed, and the agent stops until there is another user input.\n\nThe user input point sees only what the user typed. The output point sees only the final answer, after the tool already ran. The tool response point checks what comes back from a tool, which helps against indirect attacks but does not control what is sent out.\n\nTool call and tool response intervention points are Preview and work for tools that support moderation. Combine them with least privilege in the tool itself.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A Foundry orchestrator agent must call another team's agent that exposes an A2A endpoint. In the setup, what is the first step?", "o": [{"t": "Publish the remote agent as a hosted container image", "c": false, "e": "The remote agent only needs an A2A-compatible endpoint."}, {"t": "Create a project connection of category `RemoteA2A` that targets the remote agent's base URI, with authentication", "c": true, "e": "The tool then points to this connection."}, {"t": "Create a Cosmos DB container for each remote agent", "c": false, "e": "Data containers are not required for the connection."}, {"t": "Add an embedding model deployment", "c": false, "e": "Embeddings are unrelated to A2A calls."}], "concept": "The A2A (agent-to-agent) tool lets a Foundry agent call any A2A-compatible endpoint, including another Foundry agent exposed as one. The sequence has four steps. First, create a project connection of category `RemoteA2A`, whose target is the remote agent's base URI, with authentication (for a Foundry target: the A2A base path and the audience `https://ai.azure.com`). Second, add an `A2ATool` to the orchestrator agent, pointing to that connection; the orchestrator reads the remote agent card to learn what the remote agent can do. Third, run the orchestrator; when the question fits, it calls the remote agent. Fourth, the orchestrator writes the final answer and keeps managing the conversation.\n\nA missing connection or wrong authentication shows up as call failures. Check with the trace or run output that the tool call happened.\n\nThe pattern keeps one agent in control, and each specialist call is auditable.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/agent-to-agent"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "In a trace review, a booking agent calls the right tool, but the `check_in` argument is written as \"next Friday\" instead of an ISO date, which the API rejects. Which evaluator targets exactly this problem?", "o": [{"t": "Tool Input Accuracy", "c": true, "e": "It checks that every parameter is correct: grounded, right type and format, required fields present, no extras and a sensible value."}, {"t": "Task Navigation Efficiency", "c": false, "e": "It compares the sequence of tool steps with an expected sequence and needs ground truth."}, {"t": "Tool Selection", "c": false, "e": "It checks whether the right tools were chosen, which was already correct here."}, {"t": "Customer Satisfaction", "c": false, "e": "It rates the overall user experience, not argument formats."}], "concept": "Process evaluators look at each step of an agent run. Tool Selection asks whether the agent chose the needed tools without unnecessary ones. Tool Call Accuracy asks whether the right tools were used with the right parameters and no redundancy. Tool Input Accuracy zooms in on parameters: grounded in the conversation, correct type and format, required fields present, no extras and sensible values. Tool Output Utilization asks whether the agent used the result correctly. Tool Call Success asks whether the call technically succeeded.\n\nIn the scenario the tool choice was right, but one argument had the wrong format, which is exactly what Tool Input Accuracy examines.\n\nThe fix in the agent is usually a clearer schema and description with an example of the format, plus `strict` validation.\n\nPick the narrowest evaluator to locate the cause; composite evaluators tell you that something failed, components tell you what.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/agent-evaluators"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 2, "q": "A retrieval team compares chunking strategies for two content types: highly structured product specification tables and long narrative customer stories. Which guidance on overlap fits?", "o": [{"t": "Never use overlap, because it only creates duplicates", "c": false, "e": "Overlap prevents an answer from being cut in half at a boundary, at the cost of extra storage and embedding calls."}, {"t": "Use more overlap for structured data and none for narrative text", "c": false, "e": "This reverses the guidance."}, {"t": "Use less overlap for highly structured data and more overlap for conversational or narrative text", "c": true, "e": "Narrative text depends on context across boundaries, while structured data usually stands alone."}, {"t": "Use the same maximum overlap for every content type", "c": false, "e": "The guidance differs by content type."}], "concept": "Chunking cuts text into pieces to stay under model token limits, to avoid one vector blurring many topics, and to return a focused passage to the model. The documented starting point is 512 tokens with 25% overlap (128 tokens).\n\nOverlap is a trade-off. It repeats part of the previous chunk so that an idea that crosses a boundary is still intact in one chunk. This costs extra storage and embedding calls: with a 10,000-token document, 512-token chunks and 128 overlap, you get about 26 chunks instead of about 20.\n\nThe decision guide: larger chunks with overlap for questions about specific facts; less overlap for highly structured data; more overlap for conversational or narrative text; chunk by section for documents with headings; use semantic chunking with Content Understanding Markdown when you need meaning-preserving chunks across pages.\n\nAlways measure with retrieval evaluators on your own questions.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-chunk-documents"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A team wants to authenticate an agent to a downstream service with its agent identity instead of storing secrets. Which tool types does agent identity authentication currently support?", "o": [{"t": "Every built-in tool, including all grounding tools", "c": false, "e": "Other tools may use key-based auth or OAuth identity passthrough."}, {"t": "Only the Code Interpreter tool", "c": false, "e": "It is not the supported set."}, {"t": "MCP and A2A tools", "c": true, "e": "Agent identity authentication currently works with these two."}, {"t": "Only function tools run by the application", "c": false, "e": "Function tools run in your code, with your credentials."}], "concept": "Foundry gives each agent a Microsoft Entra agent identity so tools can authenticate without secrets in prompts or code. At runtime there are four stages: the blueprint authenticates through a federated credential that trusts the project's managed identity; Entra issues a token for the specific agent identity; Agent Service requests an access token whose audience is the downstream service (for example `https://storage.azure.com`); and the call is made with that token, and the target checks the role assignments of the agent identity.\n\nSupport is limited today: agent identity authentication works with MCP and A2A tools. Other tools may use key-based authentication or OAuth identity passthrough; check each tool's documentation.\n\nTwo common failures: the wrong audience (it must be the service's resource identifier, not the URL of your MCP server) and roles on the wrong identity (the agent identity, not the managed identity, needs the role on the target).\n\nAccess can be delegated (on behalf of a signed-in user) or application-only (client credentials).", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/agent-identity"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A developer gets 403 from the project endpoint when running a local script. `az login` succeeded, and the endpoint format is correct. What should be checked first?", "o": [{"t": "That the model name is used instead of the deployment name", "c": false, "e": "That causes a 404 on the model, not a 403."}, {"t": "That the signed-in account has the Foundry User role on the project and belongs to the right tenant, for example with `az account show`", "c": true, "e": "A missing role or wrong tenant are the typical causes of 401 and 403."}, {"t": "That the temperature is below 1", "c": false, "e": "Parameters do not cause authorization failures."}, {"t": "That the embedding endpoint is the project endpoint", "c": false, "e": "Embedding problems give different errors."}], "concept": "The first call to the Foundry SDK has predictable failure points. Get the project endpoint (`https://<resource>.services.ai.azure.com/api/projects/<project>`), give yourself a role (Foundry User to use a project, Foundry Project Manager to manage it), sign in locally with `az login`, and create the client with `DefaultAzureCredential` so that it is keyless.\n\nLearn's troubleshooting hints: 401 or 403 means a missing role or the wrong tenant, so run `az account show` and verify the role on the project; 404 on the model means you used the model name instead of the deployment name; endpoint errors mean a wrong URL format or a custom subdomain not applied; embeddings failing on the project client means you should use the `/openai/v1` endpoint; and an empty output from a reasoning model means the token cap was consumed by reasoning.\n\nIn Azure, replace `az login` with a managed identity.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/sdk-overview"], "ref": ["foundry-sdk-and-generative-apps"]}, {"d": 2, "q": "You build a RAG assistant. Sometimes it invents an answer when the retrieved context does not contain the information. Which prompt design reduces this most directly?", "o": [{"t": "Increase the temperature so that the model is more creative", "c": false, "e": "This increases invention."}, {"t": "Remove the retrieved context to keep the prompt short", "c": false, "e": "Without context the model answers from memory."}, {"t": "Ask the model to \"never hallucinate\" in capital letters", "c": false, "e": "A vague instruction is weak. A concrete rule with an allowed fallback works better."}, {"t": "Give the model an \"out\": instruct it to answer only from the context and to reply \"not found\" when the answer is missing, and repeat the instruction at the end", "c": true, "e": "An explicit safe answer avoids invented ones, and repeating key instructions near the end uses the recency effect."}], "concept": "Language models try to be helpful, so when the context lacks the answer they often produce a plausible one. This is a hallucination.\n\nThe most direct prompt fix is to give the model an \"out\": a clear, allowed way to say it does not know. For example: \"Answer only from the context below. If the answer is not in the context, reply `not found`.\" Repeating the rule at the end of the prompt helps because models pay extra attention to the most recent text, so a rule buried at the top of a long prompt can fade.\n\nIncreasing temperature makes invention more likely. Removing the context removes the facts and makes things worse. Writing \"never hallucinate\" in capitals is not a mechanism; the model needs a concrete alternative behavior.\n\nAlso test it: include evaluation cases where the answer is absent and check that the model says \"not found\", for example with a groundedness evaluator.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering"], "ref": ["prompt-engineering-parameters-and-reflection"]}, {"d": 2, "q": "In an agent evaluation, the team wants to know whether the tool calls technically succeeded (no API errors or time-outs), separate from whether the right tool was chosen. Which evaluator measures this?", "o": [{"t": "Task Adherence", "c": false, "e": "It checks whether the agent followed system instructions and policy."}, {"t": "Tool Call Success", "c": true, "e": "It checks whether each tool call technically succeeded."}, {"t": "Tool Selection", "c": false, "e": "It checks whether the needed tools were chosen and unnecessary ones were avoided."}, {"t": "Intent Resolution", "c": false, "e": "It checks whether the agent understood what the user wanted."}], "concept": "Agent evaluators are grouped into two views. System evaluators judge the whole outcome: Task Completion (did it finish), Task Adherence (did it follow the rules), Intent Resolution (did it understand the user) and Customer Satisfaction. Process evaluators judge each step: Tool Call Accuracy, Tool Selection, Tool Input Accuracy, Tool Output Utilization and Tool Call Success.\n\nThe questions differ: Tool Selection asks \"was this the right tool?\". Tool Input Accuracy asks \"were the arguments correct?\". Tool Output Utilization asks \"did the agent use the result well?\". Tool Call Success asks \"did the call technically work?\", so it catches API errors and time-outs.\n\nSplitting the view helps diagnosis. If the system score is low, the process evaluators tell you which step failed.\n\nMost of these evaluators are AI-assisted: another model acts as the judge.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/agent-evaluators"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 2, "q": "After a configuration change, the Text Split skill produces thousands of very small chunks, and answers lose context. The skill is set to `sentences` mode. What change fits the goal of focused but contextual chunks?", "o": [{"t": "Keep `sentences` mode and raise the temperature", "c": false, "e": "Temperature is a generation setting and does not change chunking."}, {"t": "Switch to a smaller embedding model", "c": false, "e": "The size of the model does not change chunk size."}, {"t": "Use the OCR skill instead of Text Split", "c": false, "e": "OCR reads text from images and does not chunk text."}, {"t": "Use `pages` mode with a suitable `maximumPageLength` and a `pageOverlapLength` that is less than half of it", "c": true, "e": "Pages combine several sentences into chunks of a chosen size."}], "concept": "The Text Split skill has two modes. `sentences` makes one sentence per chunk, which creates thousands of tiny chunks that carry little context. `pages` makes chunks of several sentences up to a maximum length. Suggested starting values for character-based chunking are `maximumPageLength` 2000 characters and `pageOverlapLength` 500.\n\nThe overlap must be less than half of the maximum length. Measure real token counts before you choose, because an overlap that is too large relative to short pages can end up as no overlap at all.\n\nChunk size is a trade-off. Too large means blurry meaning and cost; too small means lost context; cutting a rule in the middle breaks the answer. Overlap protects boundaries but increases storage and embedding calls.\n\nTo verify, read some chunks yourself and run retrieval evaluators on test questions.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-chunk-documents"], "ref": ["rag-retrieval-and-grounding", "azure-ai-search-configuration"]}, {"d": 2, "q": "A developer follows a quickstart that uses `AIProjectClient(endpoint=..., credential=...)` and `project.get_openai_client()`, but the installed package is `azure-ai-projects==1.0.0`. Errors such as \"method not found\" appear. What is the cause?", "o": [{"t": "The 1.x line targets Foundry classic. The code needs the 2.x line (Python 3.10 or later) for the new Foundry", "c": true, "e": "Mixing the classic and new SDK versions is a common cause of missing methods."}, {"t": "The OpenAI SDK must be removed", "c": false, "e": "The Foundry samples use the OpenAI client returned from the project."}, {"t": "`DefaultAzureCredential` cannot be used with the SDK", "c": false, "e": "It is the recommended keyless credential."}, {"t": "The project must be converted to a hub-based project", "c": false, "e": "Hub-based projects are the classic experience."}], "concept": "The `azure-ai-projects` Python package has two major lines. Version 1.x targets the earlier (classic) Foundry experience. Version 2.x targets the new Foundry, with `AIProjectClient` and `get_openai_client()`, agents with versions, and the Responses API. The 2.x line needs Python 3.10 or later.\n\nA quickstart written for the new Foundry calls methods that do not exist in 1.0.0, so Python raises errors such as \"method not found\" or attribute errors. Check the installed version with `pip show azure-ai-projects` and upgrade to 2.x.\n\nWhy the other explanations fail: the OpenAI SDK is needed, because `get_openai_client()` returns an OpenAI-compatible client; hub-based projects are the classic model, the opposite of the fix; and `DefaultAzureCredential` is the standard keyless way to authenticate and works with the SDK.\n\nLesson: when sample code and errors disagree, first compare the package version with the version the article was written for.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/sdk-overview"], "ref": ["foundry-sdk-and-generative-apps"]}, {"d": 2, "q": "A team adds tool call and tool response controls to an agent whose only tool is a custom in-house tool of a type that is not on the moderated-tool list. The controls never fire. Why?", "o": [{"t": "Tool call and tool response controls work only with tools that support moderation, such as Azure AI Search, Azure Functions, OpenAPI, SharePoint grounding, Fabric Data Agent, Bing grounding, Bing Custom Search and Browser Automation", "c": true, "e": "For other tools those controls do nothing."}, {"t": "They run only after midnight UTC", "c": false, "e": "There is no such schedule."}, {"t": "They require Provisioned deployments", "c": false, "e": "Deployment type is unrelated."}, {"t": "Those controls apply only to models, never to agents", "c": false, "e": "They apply to agents (Preview)."}], "concept": "Guardrails can be attached at four intervention points: user input, tool call, tool response and output. User input and output are generally available for models. Tool call (what the agent proposes to send to a tool) and tool response (what a tool returns, before it is added to memory or shown) are Preview and apply to agents.\n\nThere is a support limit: these two controls work only with tools that support moderation. Learn lists Azure AI Search, Azure Functions, OpenAPI, SharePoint grounding, Fabric Data Agent, Bing grounding, Bing Custom Search and Browser Automation. For other tools those controls do nothing, so the guardrail seems to be \"not working\".\n\nAlso remember that guardrails apply to agents built in Foundry Agent Service, not to other agents merely registered elsewhere, and that each intervention point adds roughly 50 to 100 ms.\n\nWhere a tool cannot be moderated, enforce limits in code and with permissions.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/intervention-points", "https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "An agentic retrieval request must be fast and cheap for simple lookups, but still handle complex questions when needed. Which setting controls whether an LLM plans subqueries?", "o": [{"t": "The chunk overlap", "c": false, "e": "Overlap is an indexing setting."}, {"t": "The number of replicas of the search service", "c": false, "e": "Replicas add capacity but do not change planning."}, {"t": "The retrieval reasoning effort: `minimal` skips LLM query planning, and `low` (the default) or `medium` use an LLM to split the question into subqueries", "c": true, "e": "Lower effort reduces cost and latency."}, {"t": "The vector profile name", "c": false, "e": "It selects an algorithm for a vector field."}], "concept": "Agentic retrieval can plan its own queries, but planning costs time and money. The retrieval reasoning effort controls this.\n\nWith `minimal` effort, the service skips LLM query planning: it runs the query directly across the knowledge sources and returns grounding data. That is fast and cheap, good for simple lookups. With `low` (the default) or `medium` effort, an LLM reads the question and conversation, splits the question into focused subqueries, runs them in parallel and merges the results, which handles complex multi-part questions better.\n\nReplicas affect capacity and availability, chunk overlap affects how documents are split at indexing time, and a vector profile name selects an algorithm for a field. None of them switches the planning step.\n\nDesign idea: route by difficulty. Use minimal for short keyword-like queries and a higher effort when the question has several parts or depends on earlier turns.\n\nNote that planning and synthesis are available in the preview API version, not in the GA minimal mode.", "src": ["https://learn.microsoft.com/en-us/azure/search/agentic-retrieval-overview"], "ref": ["azure-ai-search-configuration", "rag-retrieval-and-grounding"]}, {"d": 2, "q": "You need to measure the recall of an approximate nearest-neighbor (HNSW) vector index. Which approach is documented?", "o": [{"t": "Use `euclidean` instead of `cosine`", "c": false, "e": "The metric must match the embedding model. Changing it does not measure recall."}, {"t": "Run exhaustive KNN queries on the same data to create a ground-truth set, then compare the HNSW results with it", "c": true, "e": "Exhaustive KNN scans all vectors for exact results, so it is the ground truth for measuring HNSW recall."}, {"t": "Raise `efConstruction` to 1,000 and assume recall is 100%", "c": false, "e": "Tuning parameters improves recall but does not measure it."}, {"t": "Enable the semantic ranker and compare scores", "c": false, "e": "The ranker scores relevance of text, not the recall of a vector index."}], "concept": "KNN (k-nearest neighbors) means finding the k items most similar to a query. In vector search, each document is stored as a list of numbers (an embedding), and the query is turned into the same kind of list. KNN compares the query with every stored vector, measures the distance to each, and returns the k closest. Because it checks everything, the result is exact. The cost is that it gets slow as the collection grows to millions of vectors.\n\nHNSW (Hierarchical Navigable Small World) is a faster way to find nearby vectors that accepts a small chance of error. It builds a graph in which each vector links to some of its neighbors, arranged in layers. The top layer has a few long-range links, like highways between cities, and the lower layers have more short-range links, like local streets. To search, the algorithm enters at the top, hops to whichever linked vector is closest to the query, and drops down a layer whenever it gets stuck. This skips most of the vectors, so it is much faster. Because it follows links instead of checking everything, it can occasionally miss a true nearest neighbor. That is why it is called approximate.\n\nHow they relate. KNN is the exact method and is the reference answer. HNSW is the fast approximate method used in practice. Recall measures how often HNSW finds the same neighbors that exact KNN finds. In this question, you run both on the same data, treat the KNN results as the correct answers, and see how many of them HNSW also returns.\n\nA simple way to remember it: KNN checks every house in town to find the closest one, and HNSW uses a map of highways and streets to get near it quickly and then checks the nearby houses, which is usually close enough.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-ranking"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A product owner wants users to see a short explanation of how a reasoning model reached its answer. A developer suggests prompting the model to dump its internal thoughts. Which approach is supported?", "o": [{"t": "Switch to the Chat Completions API because it returns reasoning text", "c": false, "e": "The reasoning summary parameter is available through the Responses API only."}, {"t": "Request a reasoning summary with the `reasoning.summary` parameter through the Responses API", "c": true, "e": "This is the supported way to expose a summary of the reasoning."}, {"t": "Read the reasoning tokens from the usage data", "c": false, "e": "Usage reports only the number of reasoning tokens, not their content."}, {"t": "Add a prompt asking the model to repeat its hidden chain of thought word for word", "c": false, "e": "This is unsupported, may violate the Acceptable Use Policy and can lead to throttling."}], "concept": "Reasoning tokens are not shown to you. The response reports how many were used (`reasoning_tokens` in the token details), but not what they say. This is by design.\n\nIf a product needs to show a rationale, Learn gives one supported route: the reasoning summary, requested with `reasoning.summary` in the Responses API. The model returns a condensed explanation that is safe to show.\n\nEverything else is risky. Prompts that try to extract the raw reasoning are unsupported, may violate the Acceptable Use Policy and can lead to throttling. Counting tokens tells you cost, not content.\n\nAlso remember the budget: reasoning tokens count against `max_output_tokens`, so allow enough room or the response may come back incomplete with no visible answer.\n\nRule: a summary is requested; raw thinking is not extracted.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning"], "ref": ["model-and-service-selection", "prompt-engineering-parameters-and-reflection"]}, {"d": 2, "q": "A banking agent has a `transfer_money` tool. Policy says transfers above $500 need human approval. Which implementation is the most robust?", "o": [{"t": "Give the tool a broad role in case it needs more access later", "c": false, "e": "Over-privileged identities increase the damage of an attack."}, {"t": "Rely on the output guardrail to block large amounts", "c": false, "e": "A content guardrail checks harmful content, not business limits."}, {"t": "Add the rule to the system prompt and trust the model", "c": false, "e": "The prompt can be bypassed by a jailbreak or hidden instructions."}, {"t": "Enforce the limit and the approval inside the tool in code, with logging of approvals, and give the tool's identity least privilege", "c": true, "e": "Prompts guide and code enforces. An attacker cannot talk their way around code."}], "concept": "Language models are persuadable, so rules that protect money or data must not rely on persuasion. A prompt is guidance. Code and permissions are enforcement.\n\nFor `transfer_money`, the limit and the approval step must live in the tool itself: if the amount is over $500 and no approval is attached, the function refuses, whatever the model or any injected text says. Log each approval with who approved it and when. Give the identity that runs the tool only the permissions it needs (least privilege), so even a bug cannot do more.\n\nAn instruction in the system prompt can be overridden by prompt injection or a clever user. An output guardrail detects harmful content, not the amount in a transfer. A broad role \"just in case\" violates least privilege.\n\nThis is defense in depth: the model may suggest an action, the tool checks the rules, and permissions limit the damage.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A guardrail has a Violence control in annotate-only mode. The response annotation shows `detected: true, filtered: false`. What does it mean?", "o": [{"t": "The content was safe", "c": false, "e": "Safe content is annotated but never filtered and is not flagged as detected."}, {"t": "The content was blocked", "c": false, "e": "A blocked item has `filtered: true`."}, {"t": "The content was detected at or above the threshold but allowed through; annotate mode is useful for tuning false positives before turning blocking on", "c": true, "e": "`detected` means seen, `filtered` means blocked."}, {"t": "The guardrail is not assigned", "c": false, "e": "Then there would be no annotation."}], "concept": "A guardrail control can take different actions. In annotate-only mode the service evaluates the content and reports the result in the response annotations, but does not block.\n\nThe annotation `detected: true, filtered: false` says: the content was detected at or above the severity threshold, but it was not filtered, because the mode is annotate only, so it passed through. If `filtered` were true, it would have been blocked.\n\nAnnotate mode is useful for tuning. You run it on real traffic, look at what would have been caught, and find false positives and false negatives before you turn blocking on. This avoids breaking the user experience with a threshold that is too strict.\n\nThe content was not blocked, the guardrail is assigned (otherwise there would be no annotation), and `detected: true` means it was not simply safe.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A developer prepares a JSONL file to run the Groundedness evaluator on a RAG app. Three chunks were retrieved for each question. How should the row be shaped?", "o": [{"t": "One row with `query`, `context` as a single string (join the chunks with a blank line, `\\n\\n`) and `response`", "c": true, "e": "Groundedness works best with all three fields, and context is a plain string."}, {"t": "Only `query`, because the judge retrieves its own context", "c": false, "e": "The judge needs the supplied context."}, {"t": "`context` as a list of three separate JSON objects without a string", "c": false, "e": "The format expects a plain string."}, {"t": "Only `response`, because groundedness does not need the context", "c": false, "e": "The context is the reference for the check."}], "concept": "Groundedness checks whether the answer stays inside the context. It is the fabrication detector and measures precision. To score it, the evaluator needs to see the context that the model was given. The data format is a JSONL row with `query`, `context` and `response`. The `context` is a plain string, so several chunks are joined, for example with `\\n\\n`. The query is optional but helps.\n\nFor agents, the evaluator can read the context from tool call results.\n\nScore patterns guide diagnosis. High retrieval and low groundedness means the model invents despite good context (stricter prompt, lower temperature). High groundedness and low completeness means the answer is faithful but partial (raise `top_k`). Low relevance means the model answers a different question.\n\nGroundedness Pro (Preview) is a stricter variant that returns True or False using Azure AI Content Safety.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A team asks when the semantic ranker is charged. They run many diagnostic queries with `search=*` and many production queries with `queryType=semantic` and a non-empty search string. Which queries generate semantic ranker charges?", "o": [{"t": "Only queries with `queryType=semantic` and a non-empty search string", "c": true, "e": "The semantic ranker is a billed feature charged for those queries; an empty search is not charged."}, {"t": "No queries, because the semantic ranker is free in every plan", "c": false, "e": "It is billed, with a monthly allowance on the free plan."}, {"t": "Only queries that return captions", "c": false, "e": "Charging depends on the query type and search string, not on captions."}, {"t": "All queries, including `search=*`", "c": false, "e": "An empty search is not charged."}], "concept": "The semantic ranker is a second-stage reranker. It takes the top 50 results of BM25 or Reciprocal Rank Fusion, builds a summary string of up to 2,048 tokens for each from the fields of the semantic configuration, and scores each from 0 to 4 in `@search.rerankerScore`. It can also return captions and answers, which are always text copied from your index.\n\nIt is a billed feature. Charges apply when `queryType=semantic` and the search string is not empty. An empty search such as `search=*` is not charged. The free plan has a monthly allowance.\n\nBecause it only reorders what retrieval already found, it cannot rescue a document that is not in the first 50. Field order in the semantic configuration matters, since long text is trimmed. It works best on prose.\n\nDo not set very fine thresholds on the reranker score: the distribution can shift with model updates.", "src": ["https://learn.microsoft.com/en-us/azure/search/semantic-search-overview"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A developer wants a classifier prompt to follow a labeling style the model gets wrong when given only instructions. They add three labeled sample inputs and outputs after the system message. What is this approach called, and how long does the effect last?", "o": [{"t": "Zero-shot prompting, because no examples are involved", "c": false, "e": "Zero-shot means no examples."}, {"t": "Fine-tuning, which permanently changes the model weights", "c": false, "e": "Examples in a prompt do not train the model."}, {"t": "Reinforcement training that persists across all customers", "c": false, "e": "Prompt examples do not affect other customers or later calls."}, {"t": "Few-shot prompting, which conditions the model for that call only; nothing is learned permanently", "c": true, "e": "Examples steer the current request and do not change the model."}], "concept": "In a prompt, examples are input and output pairs. With no example, the technique is zero-shot. With one, it is one-shot. With several, it is few-shot. They show the model the pattern you want, for example a label set or a format.\n\nThe effect is local: examples condition the model for this call only, and nothing is learned permanently. In the Chat API they appear as sample user and assistant turns after the system message. Choose examples that show edge cases, and note that their order can matter.\n\nFew-shot examples improve consistency of format, vocabulary and style, but they do not guarantee schema validity or factual correctness. For a guaranteed shape, add Structured Outputs.\n\nFine-tuning is different: it changes model behavior with training data, has training and hosting costs, and must be repeated when the base model changes. It is the last rung of the improvement ladder: prompt, ground, better model, then fine-tune.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering"], "ref": ["prompt-engineering-parameters-and-reflection", "model-and-service-selection"]}, {"d": 2, "q": "A team plans to call a remote agent through the Foundry A2A tool. Which TWO statements are correct?", "o": [{"t": "The tool supports image and audio exchange", "c": false, "e": "It is text only."}, {"t": "The `a2a` tool type (protocol 1.0) is GA, while `a2a_preview` (protocol 0.3) stays in preview", "c": true, "e": "Use the GA type for production work."}, {"t": "The tool is limited to text modality and does not support streaming", "c": true, "e": "Plan the interaction accordingly."}, {"t": "Streaming responses are supported", "c": false, "e": "Streaming is not supported."}, {"t": "A2A needs no connection or authentication", "c": false, "e": "A project connection with authentication is part of the setup."}], "concept": "Agent2Agent (A2A) is a protocol for agents to call one another. Foundry's A2A tool exists in two protocol versions: the `a2a` tool type uses protocol 1.0 and is generally available, while `a2a_preview` uses protocol 0.3 and stays in preview.\n\nThe tool has limits. It is limited to text modality, so it does not support image and audio exchange, and it does not support streaming responses; the caller waits for the full response. It needs a project connection with authentication to the remote agent, so the claim that no connection is needed is wrong.\n\nDesign consequence: use A2A for text-based delegation between agents, and consider the latency of non-streamed answers in your user experience. Use GA where you can for production.\n\nWhen you read exam options, watch for words like \"GA\", \"preview\", \"text only\" and \"streaming\", which often decide the answer.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/agent-to-agent"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "A security team sets up the credential for an agent identity blueprint. Which credential type does Learn recommend?", "o": [{"t": "A federated credential with a managed identity, which stores no secret", "c": true, "e": "The blueprint trusts the project's managed identity through federation."}, {"t": "A client secret that never expires", "c": false, "e": "Secrets need rotation, and an unexpiring one increases risk."}, {"t": "A certificate stored in the repository", "c": false, "e": "Certificates need lifecycle management and must not be in source control."}, {"t": "A shared API key", "c": false, "e": "Keys bypass role-based access control."}], "concept": "An agent identity blueprint is a template for agent identities in Microsoft Entra. It needs a credential to prove itself when it requests tokens.\n\nA federated credential establishes trust between the blueprint and a managed identity: Entra accepts tokens issued for the managed identity, and Azure handles issuing and rotating them. There is no secret to store, leak or rotate. That is why Learn recommends it.\n\nA client secret that never expires is a long-lived secret and the worst choice. A certificate stored in the repository leaks to everyone with repo access. A shared API key is not a blueprint credential and gives no per-identity audit trail.\n\nRule: prefer workload identity and federation to secrets; where secrets are unavoidable, keep them in Key Vault with short lifetimes and rotation.\n\nMemory aid: a federated credential is a letter of introduction from a trusted friend; a secret is a password that someone can copy.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/overview"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A team evaluates an agent whose main tool is Azure AI Search and wants to use `tool_call_accuracy` and `groundedness` in its evaluation. What does Learn advise?", "o": [{"t": "Use them freely, because all evaluators support all tools", "c": false, "e": "Learn lists limited support for several tool types."}, {"t": "Disable evaluation until the tool is deprecated", "c": false, "e": "Evaluation should continue with suitable evaluators."}, {"t": "Avoid these evaluators for that tool because support is limited, and use evaluators that fully support the tool types such as File Search, function tools and MCP", "c": true, "e": "Agent evaluators fully support File Search, function tools, MCP and knowledge-based MCP."}, {"t": "Replace the Azure AI Search tool with Code Interpreter", "c": false, "e": "Code Interpreter is also on the limited-support list."}], "concept": "Evaluators are not equally supported for every tool. Agent evaluators fully support File Search, function tools, MCP and knowledge-based MCP. For Azure AI Search, Bing grounding, SharePoint, Code Interpreter, Fabric Data Agent and Web Search, Learn advises avoiding `tool_call_accuracy`, Tool Input Accuracy, Tool Output Utilization, Tool Call Success and `groundedness`, because support is limited.\n\nThis does not mean you cannot evaluate those agents. You can use system-level evaluators such as Task Completion, Task Adherence and Intent Resolution, safety evaluators, and custom evaluators for domain rules, and review traces for the process.\n\nWhy this is exam-relevant: a low or odd score may come from limited support rather than from a bad agent. Check the support table before trusting a metric.\n\nAlso remember that most evaluators are AI-assisted and use a judge model deployment.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/agent-evaluators"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 2, "q": "A published agent has no custom guardrail assigned, but its model deployment has a custom guardrail with Violence set to Medium. What guardrail applies to the agent?", "o": [{"t": "The agent inherits the model deployment's guardrail", "c": true, "e": "Without an agent-level guardrail, the agent uses the model's."}, {"t": "The agent merges the model guardrail with a new empty one automatically", "c": false, "e": "There is no merging; an agent guardrail fully replaces the model's."}, {"t": "The agent always uses `Microsoft.DefaultV2` regardless of the model", "c": false, "e": "DefaultV2 is the default for models, and inheritance applies when the agent has none."}, {"t": "The agent runs with no guardrail until one is assigned", "c": false, "e": "It inherits the model's guardrail by default."}], "concept": "A guardrail is a named collection of controls. Each control is made of a risk, an intervention point and an action. A guardrail can be assigned to models and to agents.\n\nAssignment rules: `Microsoft.DefaultV2` is the default guardrail for models. A custom guardrail on the agent wins. If the agent has none, it inherits the guardrail of its model deployment. When an agent has its own guardrail, it fully replaces the model's: nothing is merged. A model's setting of High on user input does not carry over to an agent whose own guardrail says Low or defines no tool controls.\n\nThis is the most tested rule. Always check which guardrail is effective for the agent and not just for the model, and remember that guardrails apply to agents built in Foundry Agent Service, not to other agents merely registered elsewhere.\n\nRisks that agents do not support yet silently do nothing for the agent.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview", "https://learn.microsoft.com/en-us/azure/foundry/guardrails/intervention-points"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A workflow must send the same customer request to a legal agent, a finance agent and a technical agent at the same time, then merge their answers. Which Microsoft Agent Framework orchestration pattern fits?", "o": [{"t": "Magentic", "c": false, "e": "Magentic is a planner-led pattern for open-ended tasks, which is more than a fixed parallel fan-out."}, {"t": "Sequential", "c": false, "e": "Sequential passes the output of one agent to the next, so the agents would not run at the same time."}, {"t": "Handoff", "c": false, "e": "Handoff transfers control from one agent to another, so only one agent works at a time."}, {"t": "Concurrent", "c": true, "e": "Concurrent orchestration fans one input out to several agents in parallel and aggregates the results."}], "concept": "Microsoft Agent Framework offers several orchestration patterns for multiple agents. They differ in how work flows.\n\nSequential runs agents one after another, passing the result along (a pipeline). Concurrent sends the same input to several agents at the same time and then aggregates their answers. Handoff lets control pass from one agent to another depending on the situation, as in a support desk that transfers a case. Magentic uses a manager that plans and assigns tasks to specialists dynamically.\n\nThe scenario sends one request to a legal agent, a finance agent and a technical agent at the same time and merges the results. That is fan-out and fan-in, which is the concurrent pattern. The benefit is lower total time, because the three agents work in parallel.\n\nCost reminder: each extra agent adds model calls, so use multiple agents only when specialist roles clearly help.", "src": ["https://learn.microsoft.com/en-us/agent-framework/workflows/orchestrations/"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "An answer generator drafts reports, and errors are costly. The team designs a reflection loop. Which description is correct?", "o": [{"t": "Generate a draft, critique it against explicit criteria, revise using the critique, and stop after a fixed number of rounds or when the criteria pass; check objective criteria (valid JSON, citation present) with code instead of a model", "c": true, "e": "Each round adds a call, so reflection trades cost and latency for quality."}, {"t": "Use the reflection loop for every request, because it has no cost", "c": false, "e": "Each round is another call."}, {"t": "Critique without explicit criteria", "c": false, "e": "Vague critique gives vague improvements."}, {"t": "Generate, then repeat generation indefinitely until the model says it is satisfied", "c": false, "e": "A loop needs a stop rule."}], "concept": "A reflection loop improves quality by having the model review its own work. The steps are: generate a draft; critique it against explicit criteria (for example \"every claim has a citation, tone is formal, length under 300 words\"); revise using the critique; and stop after a fixed number of rounds (often one or two) or when the criteria pass.\n\nExplicit criteria are essential. Without them the critique is vague and the model may praise itself or change things randomly. Objective criteria such as valid JSON or the presence of a citation should be checked by code, which is cheaper and more reliable than asking a model.\n\nA loop that repeats until the model says it is happy can run forever and burn tokens. Reflection is not free: each round is another model call with more tokens and latency, so use it only where errors are costly, like these reports.\n\nMemory aid: write, review with a checklist, fix, and stop on time.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering"], "ref": ["prompt-engineering-parameters-and-reflection"]}, {"d": 2, "q": "In an agent evaluation, Intent Resolution scores are low for a booking assistant. Transcripts show the agent often answers a different question than the user asked, even though its tool calls succeed. What does the score tell you?", "o": [{"t": "The tool calls are technically failing", "c": false, "e": "Tool Call Success covers that, and it is fine here."}, {"t": "The agent misunderstands what the user wants, so improve instructions, examples or clarification behavior", "c": true, "e": "Intent Resolution measures whether the agent understood the user's goal."}, {"t": "The model deployment is out of quota", "c": false, "e": "Quota would cause 429 errors, not misunderstanding."}, {"t": "The memory store is full", "c": false, "e": "Memory is not the cause of misread intent."}], "concept": "Agent evaluators give you separate questions. Intent Resolution asks: did the agent understand what the user wanted? Task Adherence asks: did it follow the system instructions and policy? Task Completion asks: did it finish with a usable deliverable? Customer Satisfaction asks whether the user would be happy. The process evaluators look at tools.\n\nA low Intent Resolution score with successful tool calls tells you the problem is understanding, not execution. Common remedies are clearer instructions that restate what the agent should ask when the request is ambiguous, few-shot examples of tricky requests, and a clarifying question before acting.\n\nCompare with the neighbors: a low Task Adherence means the agent knew the goal but broke a rule; low Tool Selection means it knew the goal but chose the wrong tool.\n\nRead system evaluators first to see the outcome, then process evaluators to find the step.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/agent-evaluators"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 2, "q": "An app uses `AIProjectClient` with the project endpoint. Chat calls work, but a call that creates embeddings through the same endpoint fails. What should you do?", "o": [{"t": "Create the embeddings through the OpenAI-compatible endpoint `https://<resource>.openai.azure.com/openai/v1/`", "c": true, "e": "The project endpoint does not currently route embedding requests, so embeddings use the `/openai/v1` endpoint."}, {"t": "Grant the Foundry Project Manager role to the caller", "c": false, "e": "The call fails because of routing, not because of a missing role. A role problem would give 401 or 403."}, {"t": "Convert the project to a hub-based project", "c": false, "e": "Hub-based projects are the classic experience, and the current guidance targets Foundry resources and projects."}, {"t": "Switch the embedding deployment to Provisioned", "c": false, "e": "The deployment type does not change which endpoint routes embedding calls."}], "concept": "A Foundry project exposes more than one endpoint, and each one speaks a different set of APIs.\n\nThe project endpoint (`https://<resource>.services.ai.azure.com/api/projects/<project>`) is used by `AIProjectClient` for project features: agents, connections, evaluations and the OpenAI-compatible client. Model calls such as chat and responses can be reached from the project client's OpenAI-compatible client. Some calls, such as embeddings in this scenario, go to the resource's OpenAI-compatible endpoint, `https://<resource>.openai.azure.com/openai/v1/`.\n\nSo the symptom \"chat works but embeddings fail on the same endpoint\" points to calling the wrong endpoint for that operation, not to permissions or deployment types. The fix is to create an OpenAI client that points to the `/openai/v1/` endpoint and authenticate it with the same Entra credential (using the token scope for Cognitive Services).\n\nThe other options are unrelated: hub-based projects are the older model, provisioned only changes billing and capacity, and Project Manager is a management role.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/sdk-overview"], "ref": ["foundry-sdk-and-generative-apps"]}, {"d": 2, "q": "A retrieval-heavy prompt is hitting the context limit. The retrieved data is a list of product attributes for 40 items. Which space-saving tip from the guidance fits best?", "o": [{"t": "Duplicate the data at the start and at the end", "c": false, "e": "This doubles the token use."}, {"t": "Spell every number in words", "c": false, "e": "This can use more tokens, not fewer."}, {"t": "Add many consecutive spaces to align columns", "c": false, "e": "Consecutive spaces cost tokens."}, {"t": "Present tabular data compactly, for example as a table, and trim retrieved context to what matters", "c": true, "e": "Tables are compact for tabular data, and prompts compete for the context window."}], "concept": "A model has a context window, and everything in the prompt competes for it: instructions, examples, retrieved context, conversation history and the answer (for reasoning models, also hidden reasoning). Tokens cost money and add latency, so space efficiency matters.\n\nLearn's tips: tables are compact for tabular data; consecutive spaces cost tokens; spelling out a month can use fewer tokens than a fully numeric date; and trimming retrieved context to what matters helps most. For retrieval, keep the best few chunks that fit a token budget instead of everything.\n\nWhen tokens per minute becomes the bottleneck, shrink the prompt first (shorter system prompt, fewer or smaller chunks, a summary of old turns) before asking for more quota or moving to provisioned capacity. Check the split between input and output tokens with metrics.\n\nPrompt caching also lowers cost if the stable prefix is at least 1,024 tokens.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering", "https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/prompt-caching"], "ref": ["prompt-engineering-parameters-and-reflection", "capacity-cost-and-throttling"]}, {"d": 2, "q": "A team ingests long contracts and finds that the end of each contract never influences search. The embedding model accepts 8,191 tokens, and the contracts have 20,000 tokens. What is happening and what is the fix?", "o": [{"t": "The index is too large for HNSW", "c": false, "e": "The symptom is about token limits."}, {"t": "The vector profile is missing", "c": false, "e": "A missing profile would reject documents, not truncate them."}, {"t": "Text beyond the input limit is cut off silently, so chunk the contracts before embedding", "c": true, "e": "Chunking keeps each embedded piece under the limit and focused."}, {"t": "The semantic ranker deletes the end of documents", "c": false, "e": "The cut happens at embedding time."}], "concept": "Embedding models have an input limit measured in tokens. This one accepts 8,191 tokens. A contract with 20,000 tokens is longer, so text beyond the limit is cut off silently (or rejected, depending on the path). The vector then represents only the first part of the contract, and the end of each contract never influences search.\n\nThe fix is to chunk the contracts before embedding: split them into pieces (a documented start is 512 tokens with 25% overlap), embed each chunk, and index the chunks, ideally with a field that links back to the parent document. Every part of the contract then has its own vector.\n\nThe semantic ranker does not delete text. HNSW can handle large indexes, so size is not the reason. A missing vector profile would make queries fail, not cut the text.\n\nMemory aid: a mug holds 300 ml. Pouring a litre does not make the mug bigger; use several mugs.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-chunk-documents"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A developer granted a role on a Key Vault to the Foundry project's managed identity. The agent called a protected MCP server successfully while testing. After the agent was published, every tool call fails with 403. What is the most likely cause?", "o": [{"t": "The wrong embedding model is configured", "c": false, "e": "Embeddings have nothing to do with authorization on a tool."}, {"t": "The model deployment reached its quota", "c": false, "e": "Quota would cause 429 responses, not 403 from the tool."}, {"t": "The agent version was deleted during publishing", "c": false, "e": "Versions are immutable and are not deleted by publishing."}, {"t": "The published agent has a distinct agent identity that has no role assignments yet", "c": true, "e": "Unpublished agents share the project identity. Publishing creates a new identity, so permissions must be granted again."}], "concept": "Identity decides who an agent is when it calls other resources. Unpublished agents in a project share the project's managed identity. When you publish an agent, it receives its own distinct agent identity.\n\nRole assignments belong to an identity. The Key Vault role was given to the shared project identity, so tests worked. After publishing, the calls come from the new agent identity, which has no role, so the protected resource answers 403 (authenticated but not allowed). The roles of the shared identity do not transfer.\n\nThe fix is to grant the minimum required role to the new agent identity on each resource it uses, and to make this step part of the publishing checklist. A smoke test on the published endpoint should follow.\n\nThe other causes would give different symptoms: quota gives 429, a deleted agent version gives 404, and a wrong embedding model gives poor search results.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/overview"], "ref": ["agent-safety-and-identity", "observability-and-agent-lifecycle"]}, {"d": 2, "q": "In a hybrid query, exact product codes in the keyword results matter more than meaning for this catalog, but the vector results still help. How can you adjust the balance without removing either query?", "o": [{"t": "Switch the vector field to Euclidean distance", "c": false, "e": "The metric affects vector scoring, not the balance between keyword and vector lists."}, {"t": "Add an `orderby` clause on the product code", "c": false, "e": "An explicit sort overrides relevance ranking, which defeats hybrid ranking."}, {"t": "Lower the weight (multiplier below 1.0) of the vector query, or raise it for the opposite effect", "c": true, "e": "Vector queries can be weighted; a value above 1.0 raises importance and below 1.0 lowers it."}, {"t": "Increase the RRF constant k from 60 to 600 in the query", "c": false, "e": "The constant is part of the documented formula and is not tuned like this in the query."}], "concept": "A hybrid query contains a full-text query and one or more vector queries. They run in parallel, and each produces its own ranked list. Because BM25 scores and vector similarity scores are on different scales, Reciprocal Rank Fusion merges them by rank position only, with the formula 1 / (rank + k) summed over the lists, where k is 60.\n\nTo change how much each list counts, you can set a weight on a vector query. A multiplier above 1.0 raises its importance; below 1.0 lowers it; the default is 1.0.\n\nNever add `orderby` to a hybrid query unless you want to throw away relevance: it overrides the ranking. The k in RRF (60) is also not the same thing as the k nearest neighbors in a vector query.\n\nRule: tune the weights, not the sort order.", "src": ["https://learn.microsoft.com/en-us/azure/search/hybrid-search-overview", "https://learn.microsoft.com/en-us/azure/search/hybrid-search-ranking"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "You add tool call and tool response controls to an agent's guardrail. Which TWO statements are correct?", "o": [{"t": "They are GA for agents and models alike", "c": false, "e": "Tool call and tool response controls are preview and for agents only."}, {"t": "Each intervention point adds roughly 50 to 100 ms of latency", "c": true, "e": "It depends on content length and the number of controls."}, {"t": "They replace the need to enforce limits in tool code", "c": false, "e": "Prompts and filters guide, while code and permissions enforce."}, {"t": "They scan every tool, including all MCP servers", "c": false, "e": "Only tools that support moderation are covered."}, {"t": "They work only with tools that support moderation, such as Azure AI Search, Azure Functions, OpenAPI, SharePoint grounding, Fabric Data Agent, Bing grounding, Bing Custom Search and Browser Automation", "c": true, "e": "For other tools these controls do nothing."}], "concept": "Tool call and tool response intervention points inspect what goes into a tool and what comes back. They are Preview, and they only take effect for tools that support moderation, such as Azure AI Search, Azure Functions, OpenAPI, SharePoint grounding, Fabric Data Agent, Bing grounding, Bing Custom Search and Browser Automation. They do not scan every tool, so MCP servers and Code Interpreter are not guaranteed to be covered.\n\nEach intervention point adds a small cost in time: roughly 50 to 100 ms of latency per intervention point. Add them where the risk justifies it.\n\nThey do not replace limits in tool code. A guardrail detects patterns, while a limit such as \"transfers over $500 need approval\" is a business rule that you enforce in the tool and with permissions.\n\nMemory aid: guardrails are airport scanners at some gates, not every gate; the tool still needs its own lock.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A knowledge base holds 4,000 vectors. Users demand the exact nearest neighbors and the team does not want to spend vector index size quota on an approximate graph. Which algorithm should the vector field use?", "o": [{"t": "BM25", "c": false, "e": "It is the keyword scoring algorithm and does not apply to vector fields."}, {"t": "HNSW", "c": false, "e": "It is approximate and keeps all vectors in memory, so it uses vector index quota; it is meant for large or volatile data."}, {"t": "Reciprocal Rank Fusion", "c": false, "e": "It merges ranked lists in hybrid search; it is not a vector algorithm."}, {"t": "Exhaustive KNN", "c": true, "e": "It scans all vectors, returns exact results and uses no vector index quota, which is fine at small to medium size."}], "concept": "Vector search finds the \"k nearest neighbors\" of a query vector. There are two ways to do it. Exhaustive KNN compares the query with every vector, so it gives the exact answer, but gets slower as the data grows. HNSW (Hierarchical Navigable Small World) builds a layered graph at indexing time and walks it from coarse to fine levels, so it is fast but approximate and keeps vectors in memory, which uses the vector index size quota.\n\nFor a small data set, the exact scan is fast enough and spends no quota. For millions of vectors, HNSW is the usual choice for high recall and low latency.\n\nExhaustive KNN is also used to build a ground-truth set to measure the recall of an HNSW index.\n\nBM25 is for keywords, and RRF merges lists in hybrid queries. Neither is a vector algorithm.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-overview", "https://learn.microsoft.com/en-us/azure/search/vector-search-ranking"], "ref": ["rag-retrieval-and-grounding", "azure-ai-search-configuration"]}, {"d": 2, "q": "A RAG evaluation shows a high Retrieval score but a low Groundedness score. What does this pattern indicate, and what should you do?", "o": [{"t": "Search returns poor chunks. Change the chunk size", "c": false, "e": "Poor chunks would lower the Retrieval score, which is high here."}, {"t": "Search returns good context but the model adds facts that are not in it. Tighten the prompt (\"answer only from the context, say you don't know\"), lower the temperature or use a stronger model", "c": true, "e": "High retrieval means the evidence is fine. Low groundedness means the answer goes beyond the evidence, which is a generation problem."}, {"t": "The answers are faithful but incomplete. Raise `top_k`", "c": false, "e": "That pattern is high groundedness with low completeness, not low groundedness."}, {"t": "The model answers a different question. Rewrite the query", "c": false, "e": "That pattern shows up as low relevance, not low groundedness."}], "concept": "RAG quality is measured in stages, so you can tell which stage is broken.\n\nRetrieval measures whether the search returned relevant context for the query. Groundedness measures whether every claim in the answer is supported by that context (precision). Response Completeness measures whether the answer includes the expected facts (recall). Relevance measures whether the answer addresses the question.\n\nHigh Retrieval means the right context reached the model. Low Groundedness means the answer contains statements that are not in that context. The search part works; the generation part invents content. So tighten the instructions (\"answer only from the context; if the answer is not there, say you don't know\"), lower the temperature, or use a stronger model, then re-run the same test set.\n\nThe other patterns point elsewhere: poor chunks would show low Retrieval; faithful but incomplete answers show high Groundedness and low Completeness; answering a different question shows low Relevance.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A developer must choose the correct project endpoint format for the Foundry SDK. Which one is it?", "o": [{"t": "`https://login.microsoftonline.com/<tenant>`", "c": false, "e": "This is an authentication authority, not a project endpoint."}, {"t": "`https://<resource>.openai.azure.com/openai/v1/`", "c": false, "e": "This is the OpenAI-compatible endpoint."}, {"t": "`https://<resource>.services.ai.azure.com/api/projects/<project>`", "c": true, "e": "This is the project endpoint, and a custom subdomain replaces `<resource>` if used."}, {"t": "A connection string with `Endpoint=...;Key=...`", "c": false, "e": "Hub-based projects used connection strings, and current SDKs no longer accept them."}], "concept": "Foundry has several endpoints, and SDKs expect a specific one.\n\nThe Foundry project endpoint has the form `https://<resource>.services.ai.azure.com/api/projects/<project>`. `AIProjectClient` uses it for agents, connections, evaluations and for obtaining an OpenAI-compatible client.\n\n`https://<resource>.openai.azure.com/openai/v1/` is the OpenAI-compatible endpoint of the resource, used by the OpenAI SDK for model calls. A connection string with `Endpoint=...;Key=...` is a pattern used by some other services and not the Foundry project endpoint, and it would also bring a key into the picture. `https://login.microsoftonline.com/<tenant>` is the Microsoft Entra sign-in authority that issues tokens; you do not call it as the project endpoint.\n\nKeep the endpoint in configuration (an environment variable) and authenticate with `DefaultAzureCredential`.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/sdk-overview"], "ref": ["foundry-sdk-and-generative-apps"]}, {"d": 2, "q": "A team asks in which order to add capabilities to a new customer agent. Which order follows the recommended build order?", "o": [{"t": "Publish first, test later", "c": false, "e": "Publishing before testing exposes users to problems."}, {"t": "Memory first, then a single tool", "c": false, "e": "Memory is useful after repeated users appear and the base works."}, {"t": "Multiple agents first, tools later", "c": false, "e": "Orchestration adds complexity before the basics work."}, {"t": "One agent with one or two tools and a golden test set, then retrieval, then memory, then approvals for risky tools, then tracing and evaluators, and only then multiple agents", "c": true, "e": "Add complexity step by step and measure after each."}], "concept": "Complexity should be added in small, measurable steps. Every added capability brings cost, latency and new failure modes, so earn each one.\n\nThe recommended order: (1) one agent with one or two tools and a golden test set, so you have a baseline. (2) Add retrieval if the agent lacks knowledge. (3) Add memory if repeated users need personalization. (4) Add approvals for risky tools. (5) Add tracing and evaluators for operations and regression. (6) Only then consider multiple agents, when specialist roles or parallel work clearly help.\n\nStarting with multiple agents creates coordination problems before you know that a single agent fails. Memory first, with no tool, lacks purpose. Publishing before testing leaves users as the testers.\n\nMemory aid: learn to walk before you run a relay race.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/overview"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "A research agent browses the web. A page returns hidden text that tells the agent to behave differently, and the team does not want that text to be saved into the agent's memory. Which control addresses this?", "o": [{"t": "An output control for harmful text", "c": false, "e": "It checks the final answer, after the poisoned content may already have influenced the agent."}, {"t": "A guardrail control for indirect attacks at the tool response point, set to annotate and block", "c": true, "e": "The agent stops immediately and the malicious content is not saved in memory."}, {"t": "A user input control for jailbreaks", "c": false, "e": "It scans the user's prompt, not content that returns from a tool."}, {"t": "A higher temperature", "c": false, "e": "Randomness does not filter content."}], "concept": "Foundry guardrails can be attached at four points: user input, tool call, tool response and output. They defend against different attacks. User input covers jailbreaks typed by the user. Tool call checks what the agent proposes to send to a tool. Output checks the final answer. Tool response checks the full content a tool returns before it is added to memory or shown to the user.\n\nHidden instructions inside a web page, file or API result are an indirect prompt injection, and the entry point is the tool response. With annotate and block at that point, the agent stops immediately and the malicious content is not saved in the agent's memory, so it cannot steer the agent later.\n\nThe tool call and tool response controls are Preview, work for agents only, and only for tools that support moderation (for example Azure AI Search, Azure Functions, OpenAPI and Bing grounding).", "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/intervention-points", "https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A hybrid search with a security filter returns zero results for one user, although the same query without the filter returns relevant documents. The filter uses a `groupIds` field populated at ingestion. What should the team verify first?", "o": [{"t": "That the semantic ranker is disabled", "c": false, "e": "The ranker does not remove documents because of a filter."}, {"t": "That the access information was collected at ingestion and the filter expression matches the stored field values for that user", "c": true, "e": "A filter that matches nothing removes all results, so the permission field and expression are the first suspects."}, {"t": "That the index uses exhaustive KNN", "c": false, "e": "The algorithm does not change filter logic."}, {"t": "That the embedding model has more dimensions", "c": false, "e": "Dimensions do not decide filter matches."}], "concept": "In the online RAG pipeline, retrieval runs a keyword query and a vector query in parallel, then applies filters (department, region, date) and security trimming so that only chunks the user may read are returned. Each method returns a ranked list.\n\nA common failure is \"filters removing everything\". The cause is usually in the data: access information (who may read each chunk) must be collected at ingestion, because it cannot be added later without re-reading the source. If the field is empty or has different values than the filter expects, the result is empty.\n\nHow to check: run the query without the filter, inspect a few documents' permission fields, and run the filter alone in the portal before involving any language mode
