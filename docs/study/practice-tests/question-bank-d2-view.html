 its form."}, {"t": "Instructions", "c": false, "e": "What the model should do."}, {"t": "Supporting content", "c": true, "e": "Context that influences the output but is not the target of the task."}, {"t": "Primary content", "c": false, "e": "The text being transformed, such as the paragraph to summarize."}], "concept": "Learn splits a prompt into five components, and not all are needed every time. Instructions say what to do. Primary content is the text being transformed or analyzed, for example the paragraph to translate. Examples are input and output pairs; none means zero-shot, one means one-shot, several means few-shot. A cue is the start of the answer that steers its form, for example \"Key Points:\". Supporting content is context that influences the output but is not the target, such as the current date, user preferences or \"my important topics\".\n\nIn the Chat API, instructions go in the system message, and few-shot examples are sample user and assistant turns after it.\n\nKnowing the vocabulary helps in questions: \"give the model a starting phrase\" is a cue; \"the text to summarize\" is primary content; \"today's date and user preferences\" is supporting content.\n\nKeep prompts compact: they compete for the context window.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering"], "ref": ["prompt-engineering-parameters-and-reflection"]}, {"d": 2, "q": "A prompt asks the model for search queries but returns several queries when you need exactly one. Which prompt technique from the Microsoft guidance fixes this with the least change?", "o": [{"t": "Prime the output with a cue, for example ending the prompt with \"One possible search query is:\"", "c": true, "e": "A cue is the start of the answer. It steers the form of the output, here to a single query."}, {"t": "Set `top_p` and `temperature` to the maximum", "c": false, "e": "This makes output more random."}, {"t": "Add 20 few-shot examples of unrelated tasks", "c": false, "e": "Unrelated examples add tokens and do not constrain the output form."}, {"t": "Switch the deployment to Batch", "c": false, "e": "Batch is a billing and latency choice. It does not change the answer shape."}], "concept": "Priming the output means starting the model's answer for it. You end the prompt with the first words of the desired response, so the model continues in that format instead of choosing its own.\n\nHere the prompt asks for search queries and the model lists several. Ending the prompt with a cue such as \"One possible search query is:\" makes the natural continuation a single query. This is a small change, with no extra examples and no change of parameters.\n\nFew-shot examples are a different technique, they show input and output pairs. They can help, but 20 examples of unrelated tasks add cost and noise. Setting `top_p` and `temperature` to the maximum increases randomness, which makes extra queries more likely. Switching to Batch does not change the format.\n\nMemory aid: priming is like giving a speaker the first word of the sentence; they will usually finish it the way you wanted.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering"], "ref": ["prompt-engineering-parameters-and-reflection"]}, {"d": 2, "q": "A composite agent evaluator such as Output Quality fails for a conversation, and the team does not know which aspect caused the failure. Which approach helps?", "o": [{"t": "Lower the threshold of every component to 1", "c": false, "e": "This lets almost anything pass."}, {"t": "Look at the component results, because the composite passes only if every applicable component passes", "c": true, "e": "Components such as groundedness, task adherence and task completion reveal the cause."}, {"t": "Re-run the same evaluator ten times and average the failures", "c": false, "e": "Repetition does not explain which component failed."}, {"t": "Treat the composite as a single score and ignore details", "c": false, "e": "This hides the cause."}], "concept": "Some evaluators batch several checks into one judge call. Output Quality (Preview) batches fluency, coherence, intent resolution, task adherence, groundedness and task completion. Tool Use Quality (Preview) batches the five tool evaluators. The primary composite result passes only if every applicable component passes, so one failing component fails the whole.\n\nThat makes composites good for a quick gate and poor for diagnosis. To find the cause, open the component results: which component failed? A failing task adherence points to instructions or policy; a failing groundedness points to retrieval or the prompt; a failing tool component points to a specific step.\n\nEvaluators return Pass or Fail, or a 1 to 5 score converted by a threshold (default 3). Most are AI-assisted, using a judge model deployment.\n\nNote that Quality Grader is deprecated.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/agent-evaluators", "https://learn.microsoft.com/en-us/azure/foundry/concepts/built-in-evaluators"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 2, "q": "A scheduling agent should only reach calendar data that the signed-in user is allowed to see. Which access pattern fits?", "o": [{"t": "A shared API key stored in the agent instructions", "c": false, "e": "Keys bypass role-based access and secrets do not belong in prompts."}, {"t": "Anonymous access to the calendar API", "c": false, "e": "There is no per-user access control."}, {"t": "Client credentials with a broad application role", "c": false, "e": "This gives the agent its own authority, which can exceed the user's permissions."}, {"t": "On-behalf-of (delegated, attended) access, so the agent can only reach what the user can reach", "c": true, "e": "The agent acts for the signed-in user and is limited by that user's permissions."}], "concept": "Agents can act in two ways. With client credentials (application permissions) the agent acts as itself, with whatever rights the application has. With on-behalf-of (delegated) access, the agent acts for the signed-in user: the user's token is exchanged for a token for the downstream API, and the API sees the user's identity and applies the user's permissions.\n\nFor a scheduling agent that should only reach calendar data that the user is allowed to see, delegated (attended) access is the right pattern: the agent cannot exceed the user's rights, and audit logs show the user.\n\nA broad application role would let the agent read every calendar, so a prompt injection or a bug could expose other people's data. A shared API key in the instructions leaks a secret to the model and logs. Anonymous access removes protection.\n\nUse application (unattended) identities only for background tasks that are not tied to a person, and keep their rights minimal.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/overview"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A prompt for a non-reasoning model asks it to decide which of three suppliers is cheapest including shipping, and the answers contain arithmetic mistakes. The team wants the model to show intermediate steps and end with a parseable line. Which technique and format fit?", "o": [{"t": "Use the same instruction for a reasoning model and request raw hidden reasoning", "c": false, "e": "Chain of thought is for non-reasoning models, and extracting hidden reasoning is unsupported."}, {"t": "Raise the temperature to 2", "c": false, "e": "More randomness makes arithmetic worse."}, {"t": "Chain of thought: ask for step-by-step reasoning first and a final line in a fixed format such as `ANSWER is: <name>`", "c": true, "e": "It reduces errors for non-reasoning models and makes review easier."}, {"t": "Ask for the answer only, with no steps, to save tokens", "c": false, "e": "Skipping steps increases the risk of arithmetic errors."}], "concept": "Chain of thought means asking the model to reason step by step before giving the final answer. For non-reasoning models it can reduce errors, because each step is generated and then used by the next, and it makes the output easier to review. Use a fixed format for the final answer, such as \"ANSWER is: <name>\", so that your code can parse it.\n\nDo not use this technique with reasoning models. They produce hidden reasoning tokens by themselves, and Learn recommends short, goal-oriented prompts for them. Extracting hidden reasoning by any means other than the reasoning summary parameter is unsupported and may violate the Acceptable Use Policy.\n\nFor exact arithmetic, a better design may use a tool: let the model call a function that does the calculation in code, then explain the result. That follows the principle of using rules and code for exact decisions.\n\nAlways test the prompt on examples that include edge cases.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering", "https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning"], "ref": ["prompt-engineering-parameters-and-reflection"]}, {"d": 2, "q": "A test shows that the correct document is retrieved by hybrid search but sits at position 30, so it never reaches the model's prompt. The team wants to improve ordering without changing the content. Which step addresses this?", "o": [{"t": "Add the semantic ranker, which rereads the top results and reorders them by how well they answer the question", "c": true, "e": "Reranking moves the best answer to the front, provided it is within the first 50 results."}, {"t": "Add more chunks to the prompt until position 30 fits", "c": false, "e": "This raises cost and noise."}, {"t": "Change the embedding model without re-embedding", "c": false, "e": "This breaks vector consistency."}, {"t": "Remove the keyword part of the hybrid query", "c": false, "e": "This reduces exact matching and does not specifically fix ordering."}], "concept": "Retrieval produces a candidate list, and rank decides what reaches the model. In hybrid search, Reciprocal Rank Fusion merges the keyword list and the vector list by rank position. The result can still have the best answer at position 30.\n\nThe semantic ranker is a second-stage reranker. It takes the top 50 results, builds a summary of each from the fields of the semantic configuration (title, keywords, content), and scores each from 0 to 4 for how well it answers the query. The best ones move to the front.\n\nIts limit is important: it only reorders what retrieval already found. If the right document is not in the first 50, it cannot rescue it, which is why guidance sets the vector `k` to 50.\n\nTo measure the benefit, compare the rank of the right document before and after, using Document Retrieval metrics on a labeled set.", "src": ["https://learn.microsoft.com/en-us/azure/search/semantic-search-overview", "https://learn.microsoft.com/en-us/azure/search/hybrid-search-overview"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "The agent optimizer (Preview) proposes new instructions and tool descriptions that score better in its own tests. The team wants to deploy them immediately. What does the guidance say?", "o": [{"t": "Delete the previous version to save space", "c": false, "e": "Versions are immutable and are needed for rollback."}, {"t": "Publish at once because the optimizer is always right", "c": false, "e": "It is Preview and its output is only a suggestion."}, {"t": "Treat the output as a suggestion, save it as a new version, and re-evaluate before publishing", "c": true, "e": "The optimizer's proposals still need your own evaluation gate."}, {"t": "Skip evaluation because the optimizer already evaluated", "c": false, "e": "Your own dataset and safety checks are required."}], "concept": "The agent optimizer (Preview) evaluates behavior and automatically proposes better instructions, skills, tool descriptions and model choices. It is step 7 of the agent lifecycle: choose type, create and test, add tools and data, save versions, trace, evaluate, optimize, publish, and monitor.\n\nLearn advises treating its output as a suggestion to test. The safe process is the usual change process: make the change in a new version, run your evaluation suite against the old and the new versions, promote only if scores do not regress, publish, monitor, and keep the old version for rollback.\n\nVersions are immutable, so a rejected suggestion costs nothing. Pin the model version, because a silent model change alters behavior.\n\nPreview features can change, and you should state clearly in design documents which parts rely on them.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/development-lifecycle"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 2, "q": "A team migrates a classification prompt from a chat model to a reasoning model. The old prompt has a long role description and \"think step by step\" instructions. What does Microsoft guidance recommend?", "o": [{"t": "Ask the model to output its raw reasoning", "c": false, "e": "Extracting reasoning other than through the reasoning summary setting is unsupported."}, {"t": "Set `temperature` to 2 to encourage more thinking", "c": false, "e": "Randomness does not control reasoning depth."}, {"t": "Keep the long prompt and add more examples of reasoning", "c": false, "e": "More scaffolding is not recommended for reasoning models."}, {"t": "Keep the prompt short and goal-oriented, use the developer message, control cost with `reasoning_effort` and token caps, and drop the classic step-by-step technique", "c": true, "e": "These techniques are not recommended for reasoning models."}], "concept": "Reasoning models are trained to think before answering. Their guidance differs from classic chat models.\n\nKeep the prompt short and goal-oriented: say what you want and the constraints, not how to think. Use the developer message for instructions where it is supported. Do not add \"think step by step\"; the model already does that internally, and extra scaffolding can lower quality or waste tokens. Control the cost and time of thinking with `reasoning_effort` and a cap on output tokens (which include reasoning tokens). Do not ask for the raw reasoning, and note that temperature is often not configurable.\n\nA long role description is an old habit from chat models. Adding more reasoning examples repeats the old technique. Temperature 2 only adds randomness and is not a way to get more thinking.\n\nMemory aid: tell an expert the goal, not each step of how to do their job.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning"], "ref": ["prompt-engineering-parameters-and-reflection", "model-and-service-selection"]}, {"d": 2, "q": "A RAG assistant should answer only when retrieval confidence is high and otherwise reply \"not found\". Semantic ranker scores range from 0 to 4. Which design is most appropriate?", "o": [{"t": "Use `orderby` to put the best document first", "c": false, "e": "Explicit sorting overrides relevance ranking."}, {"t": "Always answer and rely on a polite tone", "c": false, "e": "Low-confidence answers would still be shown."}, {"t": "Apply a score threshold on the reranker score (kept coarse, because score distributions can shift slightly) and return \"not found\" below it", "c": true, "e": "A relevance threshold raises precision at the cost of recall."}, {"t": "Set a very fine threshold such as 3.2137", "c": false, "e": "Scores can shift slightly with infrastructure or model updates, so fine-grained thresholds are fragile."}], "concept": "The semantic ranker gives each result a reranker score from 0 to 4. A threshold on this score is a simple confidence rule: if the best passage scores below the cut-off, there is probably no good answer, and the assistant replies \"not found\" instead of guessing.\n\nKeep the threshold coarse, for example 2.0 or 2.5. Score distributions can shift slightly as the model, the index or the data change, so a very fine value such as 3.2137 gives false precision and breaks easily. Test the cut-off on labeled questions, including questions with no answer, and tune the balance between wrongly refusing and wrongly answering.\n\nAlways answering and relying on tone invites hallucination. `orderby` sorts results but does not tell you whether the best one is good enough.\n\nMemory aid: set the pass mark at a round number and check it on real papers, not at 3.2137.", "src": ["https://learn.microsoft.com/en-us/azure/search/semantic-search-overview"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A bank wants customers to talk to a prompt agent by voice, with natural interruptions, using the same agent definition as the text channel. Which agent type is intended for this?", "o": [{"t": "A hosted agent written only to transcribe files", "c": false, "e": "Hosted agents are custom code in a container, not specifically voice."}, {"t": "A voice-based prompt agent, which adds real-time speech through Voice Live", "c": true, "e": "It extends a prompt agent with voice."}, {"t": "A workflow agent with no speech support", "c": false, "e": "Workflows orchestrate agents; they do not provide speech."}, {"t": "A batch transcription job", "c": false, "e": "It transcribes recorded audio asynchronously."}], "concept": "Foundry offers several agent types. A prompt agent is configuration only: instructions, a model and tools. A voice-based prompt agent adds real-time speech through Voice Live. A hosted agent is your own code in a container, for example built with the Microsoft Agent Framework, used when you need custom orchestration or protocols. Workflows orchestrate several agents declaratively.\n\nChoosing the type is the first step of the agent lifecycle. The advice is to pick the simplest type that meets the need, because choosing wrongly early means a rewrite later.\n\nVoice Live is a managed WebSocket API for speech-to-speech conversation. It bundles speech to text, a model, text to speech, noise suppression, echo cancellation and interruption and end-of-turn detection. Monitoring cards for voice agents need Application Insights, and evaluation of voice agents supports full-conversation runs only.\n\nTelephony is possible through Teams Phone extensibility or Twilio, not direct SIP.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/development-lifecycle", "https://learn.microsoft.com/en-us/azure/ai-services/speech-service/voice-live"], "ref": ["observability-and-agent-lifecycle", "speech-solutions"]}, {"d": 2, "q": "A guardrail has an indirect attack control, yet an attack hidden in a web page that an agent retrieves was not detected. Which TWO checks does the troubleshooting guidance suggest first?", "o": [{"t": "Check the annotation: `detected` and `filtered` flags show whether the content was seen but allowed (annotate mode)", "c": true, "e": "`detected: true` with `filtered: false` means it was seen but not blocked."}, {"t": "Disable tool responses so that no content is retrieved", "c": false, "e": "This breaks the agent's purpose rather than diagnosing the control."}, {"t": "Increase the temperature so the model ignores hidden text", "c": false, "e": "Temperature is not a defense."}, {"t": "Check that the guardrail is assigned to the agent, and that the control is placed at the intervention point where the attack enters (tool response, not only user input)", "c": true, "e": "A control at the wrong point or an unassigned guardrail does nothing for that path."}, {"t": "Remove the guardrail and use only a longer system prompt", "c": false, "e": "Prompts can be bypassed."}], "concept": "A shield that does not detect has three common causes. First, the guardrail is not assigned to the agent. Second, the control is not at the right intervention point: user prompt attacks enter at user input, while document (indirect) attacks enter through content the agent reads, so they must be scanned at the tool response point as well as at user input. Third, the control is in annotate mode, which flags but does not block.\n\nAnnotations carry `detected` and `filtered`. `detected: true, filtered: false` means \"seen but allowed\". Annotate mode is useful for tuning false positives before turning blocking on.\n\nAnother cause is a risk that agents do not support yet: it silently does not take effect for the agent, although it works for models using the same guardrail. An agent's guardrail also fully replaces its model's guardrail.\n\nCheck assignment, point, mode and risk support, in that order.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/intervention-points", "https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/content-filter-prompt-shields"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A team states that Structured Outputs with `strict: true` make their extraction always correct. Which statement is accurate?", "o": [{"t": "They work with every feature, including parallel tool calls", "c": false, "e": "Parallel tool calls are not supported."}, {"t": "They guarantee that every value is factually correct", "c": false, "e": "They guarantee shape only."}, {"t": "They remove the need for any evaluation", "c": false, "e": "Evaluation is still needed."}, {"t": "Structured Outputs make the output always match the schema, but they do not make the content true, so evaluate the facts separately", "c": true, "e": "Schema validity and factual correctness are different properties."}], "concept": "Structured Outputs with `strict: true` constrain the form of the response: the JSON follows your schema, with the right fields and types, and you never receive invalid JSON. They say nothing about the truth of the values. A model can return a perfectly valid object with a wrong total or an invented date.\n\nSo you still need evaluation of content: check against ground truth, run groundedness checks against the source document, validate business rules in code (totals add up, dates are plausible), and keep human review for critical values.\n\nStructured Outputs also have compatibility limits. For example, they require `parallel_tool_calls` to be false for function calling, they support only a subset of JSON Schema, and they are not supported with Foundry Agent Service.\n\nMemory aid: a form with all boxes correctly filled in can still contain wrong answers.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/structured-outputs"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A team is deciding how to trace its agents. Which TWO statements about tracing support are correct?", "o": [{"t": "Tracing is generally available for prompt and hosted agents, while workflow and external agents are Preview", "c": true, "e": "GA status differs by agent type."}, {"t": "Traces appear in the portal for anyone, with no role needed", "c": false, "e": "A Log Analytics reader role is needed to view traces."}, {"t": "Frameworks such as LangChain, LangGraph, the OpenAI Agents SDK and the Microsoft Agent Framework are supported", "c": true, "e": "Traces can come from these frameworks with the right instrumentation."}, {"t": "Tracing is available only for hosted agents", "c": false, "e": "It is also GA for prompt agents."}, {"t": "Tracing needs no Application Insights resource", "c": false, "e": "The project must be connected to Application Insights."}], "concept": "Tracing needs three things: the project connected to an Application Insights resource, the right access (a Log Analytics reader role to view traces in the portal), and instrumentation in code for your framework. If traces do not appear, check the connection, the permission and the instrumentation, in that order.\n\nStatus: tracing is generally available for prompt agents and hosted agents; workflow agents and external agents are Preview. Supported frameworks include LangChain, LangGraph, the OpenAI Agents SDK and the Microsoft Agent Framework.\n\nWhat a trace captures: user inputs and agent outputs, tool calls and results, token consumption, durations and latencies, retries and costs. The telemetry cost depends on Application Insights volume, and retention and sampling follow your configuration.\n\nRemember to prefer GA features for production and to flag preview ones.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/observability/concepts/trace-agent-concept"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 2, "q": "A travel agent uses a memory store. Each customer's memories must be isolated from other customers without hard-coding customer IDs in the agent definition. How should you configure the memory search tool?", "o": [{"t": "Put the customer ID in the agent instructions", "c": false, "e": "Instructions are not an isolation mechanism, and the ID would need to change for every call."}, {"t": "Use a static scope such as `shared` for all users", "c": false, "e": "A static scope is only appropriate when per-user isolation is not needed."}, {"t": "Set `scope` to `{{$userId}}` so the service resolves the signed-in user on each call", "c": true, "e": "Each scope is an isolated collection, and the placeholder gives per-user isolation without fixed IDs."}, {"t": "Rely on conversation thread storage instead of a memory store", "c": false, "e": "Thread storage covers one conversation. It does not keep durable facts across sessions."}], "concept": "A memory store keeps long-term facts about users across conversations. The `scope` parameter divides the store into separate collections, and each scope is isolated from the others.\n\nPer-user isolation needs one scope per user. You could pass the user ID yourself on each call, but when the memory search tool is attached to an agent the value `{{$userId}}` is a placeholder: the service resolves the identity of the signed-in end user on every call. The agent definition stays the same for everyone, and each customer only reads and writes their own memories.\n\nA static scope such as `shared` puts everyone's memories in one pool, which leaks personal data between customers. Writing a customer ID into the instructions hard-codes one user into a shared agent. Thread (conversation) storage keeps one conversation's history, not durable user facts.\n\nAlso remember privacy: set retention, support deletion, and do not store secrets in memory.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/what-is-memory"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "A model sometimes omits the required `order_id` argument when it calls your function tool, and sometimes sends extra properties. The schema only lists `properties`. Which changes reduce these errors?", "o": [{"t": "Move the schema into the system prompt as prose", "c": false, "e": "A formal schema with required fields is more reliable."}, {"t": "Increase `max_output_tokens`", "c": false, "e": "Output length does not control argument shape."}, {"t": "Add `required: [\"order_id\"]` and `additionalProperties: false`, set `strict=True`, and give the parameter a clear description with an example", "c": true, "e": "The schema and descriptions are all the model knows about the function. Strict mode validates the call."}, {"t": "Switch the deployment to Batch", "c": false, "e": "Batch does not affect function-call accuracy."}], "concept": "A function tool definition is a contract. The model reads the JSON Schema of the parameters to decide what to send. A schema that only lists `properties` is loose: the model may omit a parameter, or send extra ones, because nothing says otherwise.\n\nTighten it in four ways. Add `required: [\"order_id\"]` so the field is mandatory. Add `additionalProperties: false` so unknown fields are not allowed. Set `strict=True` so the model's arguments are constrained to the schema. And write a clear description for the parameter with an example, such as \"Order number, for example 4711\". These steps remove most missing or extra arguments.\n\nIncreasing `max_output_tokens` is unrelated. Describing the schema in the prompt as prose is weaker than a real schema. Batch is a deployment type for offline jobs.\n\nEven with strict mode, validate the values in your function before using them (is this order owned by the user?).", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "A developer edits an agent in the portal playground and tests it for an hour, but never saves it. The team then tries to view the conversation history, monitor the agent and run a full evaluation, and cannot. What is the reason?", "o": [{"t": "Unsaved changes are temporary; saving creates an immutable version (`name:version`), which is needed for history, monitoring and full evaluation", "c": true, "e": "Without a saved version the platform has nothing stable to attach history and evaluations to."}, {"t": "The playground disables all features for one hour", "c": false, "e": "There is no such behavior."}, {"t": "Evaluations only work on hosted agents", "c": false, "e": "Evaluations work for prompt agents as well."}, {"t": "The agent name must first be changed to include a version number", "c": false, "e": "A saved agent's name cannot change; the version is created by saving."}], "concept": "The agent lifecycle in Foundry has nine steps: choose the type, create and test, add tools and data, save versions, debug with tracing, evaluate, optimize (Preview, hosted agents), publish, and monitor and iterate.\n\nSaving is the step that makes the rest possible. Every save creates a new, immutable version identified as `<agent_name>:<version>`. You can compare setup, chat output and YAML between versions and send requests to a specific version, which makes rollout and rollback controlled. Without saving you cannot see conversation history, monitor performance or run full evaluations. A saved agent's name cannot change.\n\nA tool that needs authentication must also be configured successfully before you can save, so a half-configured tool does not fail later in production.\n\nThe order matters: trace before evaluate, evaluate before publish, and monitor after publish.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/development-lifecycle"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 2, "q": "A trace of a booking agent shows that one `execute_tool` span takes eight seconds, while the model spans take under one second each. Where should the team look first?", "o": [{"t": "The downstream API behind that tool, which is slow, so optimize or cache it", "c": true, "e": "The span timing isolates the delay to the tool call, not to the model."}, {"t": "The model deployment, which should be moved to Provisioned", "c": false, "e": "The model spans are fast, so more model capacity will not help."}, {"t": "The embedding model used by memory", "c": false, "e": "Memory operations have their own spans and show no delay here."}, {"t": "The guardrail, which should be removed", "c": false, "e": "Guardrails add roughly 50 to 100 ms per intervention point, not eight seconds."}], "concept": "A trace records one request as a tree of spans. A span is one operation with a start time, an end time and attributes. In the OpenTelemetry GenAI conventions that Foundry uses, `invoke_agent` is an agent call, `plan` is task decomposition, `execute_tool` is a tool call, and there are spans for memory operations.\n\nReading durations is the quickest way to find the slow part. If the model spans are short and one `execute_tool` span is long, the delay is in the downstream system that the tool calls. The fix is to optimize that API, cache its results or add a timeout.\n\nCompare with the other patterns: an expected tool that is never called means the agent chose not to use it, so improve the tool description; the same tool called again and again suggests a loop.\n\nMatch the symptom in the trace to the tool or layer before changing capacity.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/observability/concepts/trace-agent-concept"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 2, "q": "A remote MCP server exposes 40 tools. The agent should be able to use only three read-only tools, and any write operation must be approved by a person. Which TWO settings should you use?", "o": [{"t": "Disabling guardrails so that the agent is faster", "c": false, "e": "This removes a protection and does not restrict tools."}, {"t": "`allowed_tools` listing the three read-only tools", "c": true, "e": "It limits which of the server's tools are exposed to the agent."}, {"t": "Placing the MCP server API key in the instructions", "c": false, "e": "Secrets do not belong in prompts, and the key does not restrict tools."}, {"t": "A system prompt that says \"do not call the other tools\"", "c": false, "e": "Prompts guide behavior but can be bypassed. Enforce limits in configuration and permissions."}, {"t": "`require_approval=\"always\"` on the MCP tool", "c": true, "e": "A person approves each call before it runs."}], "concept": "MCP (Model Context Protocol) lets an agent use tools hosted on a remote server. A server can expose many tools, but an agent should only get the ones it needs: least privilege.\n\n`allowed_tools` is an allow-list. Only the tools named in it are visible to the agent, so the other 37 cannot be called, whatever the model or a prompt injection tries. `require_approval=\"always\"` makes the service stop before each call and return an approval request; your application shows it to a person and sends back approve or reject. Together they restrict what can be called and who must say yes.\n\nA system prompt asking the model not to call other tools is advice, and advice can be overridden. Disabling guardrails removes protection. Putting a key in the instructions exposes a secret to the model and to logs.\n\nHow it relates: allow-list for scope, approval for human control, and enforce limits again inside the server for defense in depth.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview"], "ref": ["building-agents-with-foundry", "agent-safety-and-identity"]}, {"d": 2, "q": "An identity administrator wants an inventory of all agent identities, with Conditional Access, ownership and expiry governance. Where is this managed?", "o": [{"t": "In the Speech portal", "c": false, "e": "It is unrelated."}, {"t": "In the Microsoft Entra admin center (Agent ID)", "c": true, "e": "Agent identities are Entra objects that can be governed there."}, {"t": "In a Cosmos DB account", "c": false, "e": "It stores agent state."}, {"t": "In the model catalog", "c": false, "e": "The catalog lists models."}], "concept": "Organizations need central governance over identities, including agent identities. Microsoft Entra Agent ID is the capability in the Microsoft Entra admin center for managing agent identities.\n\nThere an identity administrator can see an inventory of agent identities, apply Conditional Access policies (rules based on risk, location, device and so on), assign ownership and sponsors, and govern expiry and access reviews so abandoned agents do not keep access forever.\n\nThe model catalog is for models. A Cosmos DB account stores data, not identity governance. The Speech portal manages speech resources.\n\nWhy this matters: agents are non-human identities that can accumulate permissions. Without inventory, owners and expiry, they become orphaned accounts, a classic security risk.\n\nMemory aid: the identity admin centre is the HR department for both humans and agents.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/overview"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A team compares the `a2a` and `a2a_preview` tool types for production use. Which TWO statements are correct?", "o": [{"t": "The A2A tool currently supports text modality only and no streaming", "c": true, "e": "These are documented limits."}, {"t": "`a2a_preview` replaced `a2a` as the GA version", "c": false, "e": "The reverse is true: `a2a` is GA."}, {"t": "The `a2a` tool type (protocol 1.0) is generally available, while `a2a_preview` (protocol 0.3) stays in preview", "c": true, "e": "GA features are preferred for production."}, {"t": "Both tool types support streaming and image inputs", "c": false, "e": "Streaming and non-text inputs are not supported."}, {"t": "The classic Connected Agents tool is the recommended replacement for A2A", "c": false, "e": "Connected Agents is not available in the new Foundry Agent Service."}], "concept": "In the new Foundry Agent Service, the replacements for the old Connected Agents tool are the A2A tool and workflows. The A2A tool type comes in two versions: `a2a`, protocol 1.0, which is generally available; and `a2a_preview`, protocol 0.3, which stays in preview. Prefer GA features for production, and mark preview ones clearly.\n\nLimits to remember: the A2A tool supports text modality only, with no streaming. If the use case needs images or streaming responses between agents, the tool is not a fit yet.\n\nThe target of an A2A tool can be any A2A-compatible endpoint, including another Foundry agent exposed as one. A workflow can orchestrate several agents declaratively (sequential, group chat, human-in-the-loop).\n\nOlder practice material may still talk about \"connected agents\" or `agent.as_tool`. Pick the option that matches the product named in the question.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/agent-to-agent"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "You create a memory store for an agent that should remember each customer's preferred name and dietary restriction across sessions. Which statement is correct?", "o": [{"t": "Enable `user_profile_enabled`; creating the store needs a chat model deployment and an embedding model deployment", "c": true, "e": "User profile memory keeps preferences and facts about the user. The store uses a chat model and an embedding model."}, {"t": "Store the preferences in the agent instructions", "c": false, "e": "Instructions are shared by all users and cannot hold per-user facts."}, {"t": "Memory needs no model deployments, because it is a plain database", "c": false, "e": "Memory extraction and consolidation use models."}, {"t": "Enable only `chat_summary_enabled`, which stores structured user facts", "c": false, "e": "Chat summaries are distilled topics or threads, not user profile facts."}], "concept": "A memory store holds long-term knowledge extracted from conversations, so an agent can remember users across sessions. It has options, and each option adds a kind of memory.\n\nUser profile memory (`user_profile_enabled`) stores stable facts about a person, such as a preferred name or a dietary restriction. Chat summary memory (`chat_summary_enabled`) stores summaries of conversations, not structured user facts. Preferences like a name and a diet are profile facts, so enable user profile memory.\n\nMemory is not a plain database. The service uses a chat model to extract and update memories and an embedding model to search them, so creating a store needs a chat model deployment and an embedding model deployment. Storing preferences in the agent instructions would apply the same facts to every user.\n\nPrivacy points: set retention, scope per user, support deletion, and do not store secrets.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/what-is-memory"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "A team migrates a prompt to a reasoning model. The old prompt told the model to \"think step by step\" and listed a long procedure. Results get slower and no better. What does the guidance recommend?", "o": [{"t": "Add a longer chain-of-thought with many examples", "c": false, "e": "This adds tokens and cost without helping a model that reasons by itself."}, {"t": "Lower `max_output_tokens` so the model thinks less", "c": false, "e": "A low cap can make the response incomplete because reasoning tokens count against it."}, {"t": "Remove step-by-step coaching, keep the prompt short and goal-oriented, and use a developer message", "c": true, "e": "Classic chain-of-thought prompting is not recommended for reasoning models, which already reason internally."}, {"t": "Ask the model to print its hidden reasoning in full", "c": false, "e": "Extracting hidden reasoning by prompt tricks is unsupported and may violate the Acceptable Use Policy."}], "concept": "A reasoning model produces hidden thinking tokens before the visible answer. Those tokens are billed as output and share the context window. Because the model already reasons, prompts that coach it step by step often waste tokens.\n\nLearn recommends short, goal-oriented prompts for reasoning models, with the instructions in a developer message (which plays the role of the system message). You control the depth of thinking with `reasoning_effort` and the cap with `max_output_tokens`, which covers reasoning plus the answer together.\n\nDo not try to pull the raw reasoning out with prompt tricks: it is unsupported, may violate the Acceptable Use Policy and can lead to throttling. If you need a visible rationale, request a reasoning summary through the Responses API.\n\nMemory aid: tell a reasoning model the goal, not the method.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning", "https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering"], "ref": ["prompt-engineering-parameters-and-reflection", "model-and-service-selection"]}, {"d": 2, "q": "A team switches the query-time embedding deployment from `text-embedding-3-small` to `text-embedding-3-large`. The index is unchanged. Vector search quality collapses. What is the cause?", "o": [{"t": "The chunk overlap is too small", "c": false, "e": "Overlap affects how rules are cut across chunks, not the compatibility of embeddings."}, {"t": "`efSearch` is too low", "c": false, "e": "This tunes the recall of approximate search. It cannot repair vectors from different models."}, {"t": "The semantic ranker is not enabled", "c": false, "e": "The ranker reorders results. It does not fix incompatible vectors."}, {"t": "Index vectors and query vectors must come from the same embedding model and dimensions; re-embed the content or revert the query model", "c": true, "e": "Vectors from different models are not comparable. Changing the model means re-embedding every chunk."}], "concept": "An embedding model converts text into a vector, and the vector only has meaning inside that model's own \"space\". Two different models are like two different maps with different coordinates: distance on one map says nothing about the other.\n\nWhen documents were embedded with `text-embedding-3-small` and queries are embedded with `text-embedding-3-large`, every query vector lives in another space (and may have a different number of dimensions). The comparison still runs, because the index has no way to know, but the ranking becomes close to random. That is why quality collapses without any error message.\n\nFix: use the same model and the same dimensions for indexing and querying. If you want the larger model, re-embed all documents and update the vectorizer and the vector field dimensions; otherwise revert the query model.\n\nNot related: `efSearch` tunes the HNSW search effort, the semantic ranker re-orders results, and chunk overlap affects how text is split.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-ranking"], "ref": ["rag-retrieval-and-grounding", "azure-ai-search-configuration"]}, {"d": 2, "q": "A refund workflow says \"refunds over $200 need approval\". A developer asks whether to enforce this with a prompt instruction or in code. What does the hybrid LLM-and-rules pattern recommend?", "o": [{"t": "Let the model decide whether the rule applies", "c": false, "e": "Business limits need deterministic enforcement."}, {"t": "Enforce the rule only in the prompt", "c": false, "e": "Prompts can be bypassed."}, {"t": "Remove the rule and rely on evaluators after the fact", "c": false, "e": "Evaluators detect problems later, and do not stop a refund."}, {"t": "Enforce the rule in code, use the model for language tasks such as classifying the message and drafting the reply, and validate the model's JSON against a schema", "c": true, "e": "Rules are exact and auditable, and models are good at language."}], "concept": "The hybrid LLM-and-rules pattern splits work by strength. Rules in code are exact, testable and cannot be talked out of their behavior. Language models are good at understanding and generating language.\n\nFor the refund workflow: the model classifies the customer's message and drafts the reply; the model returns JSON that your code validates against a schema; and the rule \"refunds over $200 need approval\" is enforced in code, which routes the case to a human when the amount exceeds the limit.\n\nA prompt-only rule can be overridden by a clever message or by injected text. Letting the model decide whether the rule applies makes the policy probabilistic. Removing the rule and relying on evaluators after the fact finds mistakes after the money has gone.\n\nMemory aid: the model writes the letter; the code decides whether it is allowed to be sent.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering"], "ref": ["prompt-engineering-parameters-and-reflection", "agent-safety-and-identity"]}, {"d": 2, "q": "A 6,000-token document is chunked into 400-token chunks with 100 tokens of overlap, so each chunk starts 300 tokens after the previous one. About how many chunks are produced?", "o": [{"t": "15", "c": false, "e": "This ignores overlap (6,000 / 400)."}, {"t": "19", "c": false, "e": "This forgets the first chunk (ceil(18.67) only)."}, {"t": "20", "c": true, "e": "ceil((6,000 - 400) / 300) + 1 = ceil(18.67) + 1 = 19 + 1 = 20."}, {"t": "21", "c": false, "e": "This adds one chunk too many."}], "concept": "Chunking cuts text into pieces that fit the embedding model and keep topics focused. Overlap repeats part of the previous chunk so ideas that cross a boundary stay together. The stride is the chunk size minus the overlap.\n\nHere: stride = 400 - 100 = 300 tokens. The first chunk covers tokens 0 to 400. Each following chunk moves 300 tokens ahead. The last chunk must reach token 6,000, so the number of strides needed after the first chunk is ceil((6,000 - 400) / 300) = ceil(18.67) = 19. Add the first chunk: 20 chunks. Without overlap you would have 6,000 / 400 = 15 chunks, so overlap here costs about 33% more chunks, with more storage and more embedding calls.\n\nThe documented starting point is 512 tokens with 25% overlap (128 tokens). A 10,000-token document gives about 26 chunks at that setting.\n\nMeasure real token counts before choosing, and read some chunks yourself.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-chunk-documents"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A hosted agent must not send data to arbitrary internet destinations, even if it is tricked. Which control helps?", "o": [{"t": "Network egress controls, an allow-list of outbound destinations (preview) for hosted agents", "c": true, "e": "An allow-list limits data exfiltration."}, {"t": "A longer system prompt", "c": false, "e": "Prompts do not block network connections."}, {"t": "A higher `temperature`", "c": false, "e": "It does not restrict traffic."}, {"t": "A larger `max_output_tokens`", "c": false, "e": "It does not restrict traffic."}], "concept": "A tricked model might try to send data to an attacker's server. Prompts and temperature cannot prevent that, but the network can. If the hosted agent can only reach an approved list of destinations, the exfiltration attempt fails even when the model has been manipulated.\n\nNetwork egress controls for hosted agents include an allow-list of outbound destinations (preview). You list the domains and services the agent legitimately needs, such as your API, your search service and Microsoft Entra, and everything else is blocked.\n\nA higher temperature, a longer system prompt and a larger `max_output_tokens` do not restrict where data can go. They are model settings, not network controls.\n\nThis is defense in depth: guardrails reduce the chance of a successful attack, least privilege reduces what the agent can do, and egress controls reduce where it can send data.\n\nMemory aid: even if the prisoner is persuaded to escape, the locked perimeter still holds.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A trace shows the same search tool called eight times in a row with almost identical arguments before the agent finally answers. What does this pattern most likely indicate, and what is the fix?", "o": [{"t": "A slow downstream API, so cache its results", "c": false, "e": "Durations would be long on a single span, not repeated calls."}, {"t": "A loop or a poor stop condition; tighten the instructions and limit the tools", "c": true, "e": "Repeated calls signal that the agent does not know when it has enough information."}, {"t": "The agent chose not to use the tool, so improve its description", "c": false, "e": "The tool was used, many times."}, {"t": "An intermittent tool failure, so add retries inside the agent", "c": false, "e": "Retries followed by success show failures; repeated successful calls show a loop."}], "concept": "A trace is a tree of spans. Reading its shape tells you what happened. If an expected tool is never called, the agent chose not to use it, so improve the tool description or instructions. If the right tool is called with wrong arguments, argument extraction is poor: fix the schema, add examples and check Tool Input Accuracy. If one `execute_tool` span takes eight seconds, a downstream API is slow. If the same tool is called repeatedly, there is a loop or a poor stop condition. If there are retries and then success, the tool fails intermittently and needs reliability work.\n\nFor a loop, tighten the instructions about when to stop (\"after one search, answer unless the results are empty\"), and keep the set of tools small so that overlapping tools do not cause repeated attempts.\n\nAdd a test case for this conversation to the evaluation set so a future version cannot regress.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/observability/concepts/trace-agent-concept"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 2, "q": "A remote MCP server gives an agent tools that can change data. Compliance requires that a person approves every MCP tool call before it runs. Which setting implements this?", "o": [{"t": "Disable tracing so approvals are not logged", "c": false, "e": "Approvals should be logged for high-risk actions."}, {"t": "Set `allowed_tools` to an empty list", "c": false, "e": "It limits which tools are exposed; an empty list would expose none or does not implement approval."}, {"t": "Raise the temperature to reduce risky calls", "c": false, "e": "Randomness is not a control."}, {"t": "Set `require_approval` to `always` for the MCP tool", "c": true, "e": "This requires approval for each call."}], "concept": "Remote Model Context Protocol (MCP) servers expose tools to agents. The risks: a server may expose many tools, tool descriptions and results come from a third party, and some tools change data.\n\nTwo settings control exposure and approval. `allowed_tools` limits which tools of the server the agent can use (for example only three read-only tools out of forty). `require_approval=\"always\"` requires a person to approve each call. Treat tool descriptions and results from remote servers as untrusted. Log approvals for high-risk actions.\n\nIn the Microsoft Agent Framework, `@tool(approval_mode=...)` controls approval for function tools. Learn's sample uses `never_require` for brevity and says to use `always_require` in production for human-in-the-loop.\n\nLayering matters: enforce limits in code and permissions, because prompts can be bypassed.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/model-context-protocol", "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling"], "ref": ["agent-safety-and-identity", "building-agents-with-foundry"]}, {"d": 2, "q": "In an OpenTelemetry-based trace of an agent, an engineer wants to see exactly which arguments the model passed to a tool, to debug wrong inputs. Which span attribute holds this information?", "o": [{"t": "`invoke_workflow`", "c": false, "e": "It is a span name for a workflow, not an attribute."}, {"t": "`plan`", "c": false, "e": "It is a span name for task decomposition."}, {"t": "`gen_ai.tool.definitions`", "c": false, "e": "It records the tool definitions, not the arguments of one call."}, {"t": "`gen_ai.tool.call.arguments`", "c": true, "e": "It records the arguments of a tool call; the result is in `gen_ai.tool.call.result`."}], "concept": "A trace is a tree of spans. A span is one operation with start and end time and attributes, which are key-value metadata. Foundry uses the OpenTelemetry GenAI semantic conventions (status: Development, so they may change). Standard spans include `invoke_agent` (an agent call, nestable for agent-to-agent), `plan` (task decomposition), `invoke_workflow`, `execute_tool` and memory operations.\n\nUseful attributes: `gen_ai.tool.definitions` (the tools offered), `gen_ai.tool.call.arguments` (the arguments of a call) and `gen_ai.tool.call.result` (the result).\n\nWhen the right tool is called with wrong arguments, argument extraction is poor: fix the schema, add examples and check the Tool Input Accuracy evaluator. When a tool is never called, improve its description.\n\nBe careful about privacy: arguments and results may contain personal data, so redact or minimize them and restrict access.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/observability/concepts/trace-agent-concept"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 2, "q": "An application wants to check a user's chat message and three retrieved web pages for attacks before building the prompt, without using a guardrail attached to a model. Which call fits?", "o": [{"t": "The standalone Azure AI Content Safety Prompt Shields API, passing the `userPrompt` and up to five `documents`, and reading `attackDetected` for each", "c": true, "e": "It scans both attack families in one call and returns a verdict per input."}, {"t": "The semantic ranker with captions", "c": false, "e": "It reorders search results and does not detect attacks."}, {"t": "Image generation with `n=3`", "c": false, "e": "It creates images and does not scan text."}, {"t": "Batch transcription", "c": false, "e": "It converts audio to text."}], "concept": "Azure AI Content Safety offers a standalone Prompt Shields API. You can use it without attaching a guardrail to a model deployment, which is useful when you want to check content before building the prompt.\n\nYou send the `userPrompt` (the user's message) and up to five `documents` (for example the retrieved web pages). The response says, for the user prompt and for each document, whether an attack was detected (`attackDetected`). The user prompt check looks for user prompt attacks such as jailbreaks, while the document checks look for indirect attacks hidden in content.\n\nBased on the result, your application blocks, removes or flags the content before it reaches the model.\n\nImage generation with `n=3` creates images. Batch transcription handles audio files. The semantic ranker with captions reorders search results. None of them detects prompt attacks.\n\nRemember that detection is probabilistic; combine it with least privilege and approval for sensitive actions.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A prompt contains instructions, a very long retrieved context and a user question. The model often follows the question but ignores the instruction to answer only from the context. Which low-cost change should you test first?", "o": [{"t": "Switch to a model with a smaller context window", "c": false, "e": "A smaller window may cut the context and does not address the ignored instruction."}, {"t": "Increase the temperature to 1.5", "c": false, "e": "Higher randomness makes instruction following less reliable."}, {"t": "Remove all instructions and rely on the model's defaults", "c": false, "e": "This removes the only guidance about using the context."}, {"t": "Repeat the key instruction after the context and the question", "c": true, "e": "Models show recency bias, so restating the rule near the end of the prompt often improves compliance."}], "concept": "A model continues text with what is most likely to follow. In a long prompt, text near the end tends to have more influence. This is called recency bias. If an important rule sits only at the top, followed by thousands of tokens of context, the model may give it less weight.\n\nA simple fix is to repeat the key instruction at the end, after the context and the question: \"Answer only from the CONTEXT, otherwise reply 'not found'.\" Learn notes that for newer chat models the effect of ordering was small in its test, so you should measure it on your own examples before and after the change.\n\nOther cheap prompt tools are giving the model an \"out\" (a safe answer when the information is missing), using clear separators between instructions and data, and asking for citations.\n\nChange one thing at a time and re-run your test set.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering"], "ref": ["prompt-engineering-parameters-and-reflection"]}, {"d": 2, "q": "A company has a large code base that uses the OpenAI Python SDK and wants to move it to Azure with the fewest changes, using Microsoft Entra ID instead of keys. Which approach fits?", "o": [{"t": "Point the OpenAI client at `https://<resource>.openai.azure.com/openai/v1/` and use an Entra token provider as the credential", "c": true, "e": "The OpenAI-compatible endpoint exposes the full OpenAI API surface, and tokens are preferred over keys."}, {"t": "Keep API keys because Entra is not supported on this endpoint", "c": false, "e": "Entra ID tokens are supported and preferred."}, {"t": "Use the Speech SDK against the Speech endpoint", "c": false, "e": "It is for speech scenarios."}, {"t": "Rewrite everything with the Foundry project endpoint and the Agent Framework", "c": false, "e": "This is more work than the requirement needs."}], "concept": "Azure OpenAI supports an OpenAI-compatible API at the path `/openai/v1/`. That means code written with the OpenAI Python SDK can run on Azure with minimal changes: you create the client with `base_url` set to `https://<resource>.openai.azure.com/openai/v1/` and a credential, and your calls (`responses.create`, `chat.completions.create`) stay the same. The model parameter is now your deployment name.\n\nFor keyless access, use Microsoft Entra ID. `azure-identity` offers a token provider (`get_bearer_token_provider`) for the scope `https://cognitiveservices.azure.com/.default`, which you pass as the API key callable to the client. The token is short-lived and tied to an identity.\n\nRewriting to the project endpoint and Agent Framework is more work than needed. The Speech SDK is for speech. The claim that Entra is not supported on this endpoint is false.\n\nRule: fewest changes = keep the SDK, change the base URL and the credential.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/sdk-overview"], "ref": ["foundry-sdk-and-generative-apps"]}, {"d": 2, "q": "A model returns two `function_call` items in one response because it needs two functions. What should the application do?", "o": [{"t": "Restart the conversation", "c": false, "e": "This loses context and does not solve the problem."}, {"t": "Run both functions and return all results, each with its own `call_id`, in the follow-up call", "c": true, "e": "Returning only some of several parallel calls leaves the run incomplete."}, {"t": "Merge both outputs into one string with one `call_id`", "c": false, "e": "Each output must carry the `call_id` of its call."}, {"t": "Run only the first function and ignore the second", "c": false, "e": "The model needs both results."}], "concept": "A model can request several functions in one response. Each request is a separate `function_call` item with its own `call_id`. The application must answer every one of them: run each function and send back a `function_call_output` item for each `call_id`, in the follow-up call.\n\nIf you run only the first, the second call stays unanswered, and the model cannot continue properly (it may return an error or an incomplete result). Merging both outputs into one string with a single `call_id` breaks the matching between request and result. Restarting the conversation loses the context and does not satisfy the pending calls.\n\nPractical tips: run independent functions in parallel to save time, validate arguments for each, apply authorization checks to each, and remember that the whole run expires 10 minutes after creation.\n\nMemory aid: two orders on one ticket need two delivery notes, each with its own order number.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "An agent calls a protected MCP server with its agent identity. Role assignments on the target resource are correct, but the call fails. The token request used the URL of the MCP server as the audience. What is the cause?", "o": [{"t": "The audience must be the downstream service's resource identifier (for example `https://storage.azure.com`), not the URL of your MCP server", "c": true, "e": "A wrong audience fails even when role-based access control is correct."}, {"t": "Guardrails block all tool calls", "c": false, "e": "A guardrail does not change the token audience."}, {"t": "The model deployment has too little quota", "c": false, "e": "Quota would cause 429 responses."}, {"t": "The managed identity needs the role instead of the agent identity", "c": false, "e": "The managed identity authenticates the blueprint. The agent identity needs the role."}], "concept": "When an agent calls a protected service, it gets an access token from Microsoft Entra ID. A token is issued for one audience, the resource that is meant to accept it.\n\nRole assignments answer \"is this identity allowed?\". The audience answers \"is this token meant for this service?\". If the audience is the URL of the MCP server, the downstream Azure service (for example Storage) receives a token meant for another service and rejects it, even though roles are right. The audience must be the resource identifier of the downstream service, such as `https://storage.azure.com`.\n\nThe identity is correct (the agent identity holds the role). Quota would give 429, and guardrails would give a content-safety block, not an authorization failure.\n\nDebug order for \"role is right but it still fails\": which identity is calling, what audience is in the token, what scope is the role assigned at.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/overview"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "Retrieval evaluators show low scores. Reading sample chunks, you find that each chunk covers many unrelated topics and ranks poorly for specific questions. Which step is at fault and what is the fix?", "o": [{"t": "Logging: store more traces", "c": false, "e": "Logs help diagnose but do not change retrieval."}, {"t": "Chunking: the chunks are too large and their meaning is blurred; tune the size and overlap (for example start from 512 tokens with 25% overlap)", "c": true, "e": "Large chunks produce a vector that blends topics and a prompt full of noise."}, {"t": "Generation: lower the temperature", "c": false, "e": "Generation cannot fix poor retrieval."}, {"t": "Reranking: disable the semantic ranker", "c": false, "e": "The ranker cannot rescue a chunk that blurs meaning."}], "concept": "When retrieval quality is low, find which stage fails. Reading sample chunks is the right first diagnostic step. Here each chunk mixes many unrelated topics. An embedding of such a chunk is an average of several meanings, so it does not match any specific question strongly. It then ranks poorly.\n\nThe fault is chunking. Reduce the chunk size, split by sections or headings, and add overlap so boundary facts are kept. A documented starting point is 512 tokens with 25% overlap; then tune using retrieval metrics on labeled questions.\n\nLowering temperature affects generation, which is not where the problem is. Disabling the semantic ranker removes a helpful stage. Storing more traces helps debugging but does not change retrieval.\n\nMemory aid: one chunk, one topic. A chunk that is a whole chapter is a bag of unrelated things.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-chunk-documents"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A team wants to compare retrieval settings (vector vs semantic, `top_k`, chunk size) and choose the best one using human-labeled relevance judgments. Which evaluator supports this parameter sweep?", "o": [{"t": "Tool Call Success", "c": false, "e": "It checks technical success of tool calls."}, {"t": "Document Retrieval, which scores ranking against ground-truth labels with metrics such as NDCG and Max Relevance", "c": true, "e": "It requires ground-truth labels and is meant for parameter sweeps."}, {"t": "Groundedness", "c": false, "e": "It checks that answers stay inside the context."}, {"t": "Relevance", "c": false, "e": "It checks whether the answer addresses the question."}], "concept": "To choose between retrieval settings with confidence, you need labeled ground truth: for each test query, which documents are relevant and how relevant.\n\nDocument Retrieval is the evaluator that uses such labels. It scores the ranking of the retrieved documents against human relevance judgments, with metrics such as NDCG (normalized discounted cumulative gain, which rewards putting the most relevant documents near the top) and Max Relevance. You run the same labeled queries with different settings (vector or semantic, different `top_k`, different chunk sizes) and compare the scores, which is a parameter sweep.\n\nGroundedness and Relevance look at the final answer, not at the ranking of documents. Tool Call Success is for agent tool calls.\n\nMemory aid: Retrieval-type evaluators ask \"did we find the right pages?\"; groundedness asks \"did the answer stay on those pages?\".", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A relevance evaluation of a RAG assistant passes, yet a reviewer finds an answer that contains an invented date. Why did the evaluation not catch it, and which evaluator should be added?", "o": [{"t": "Add Response Completeness, which detects invented facts", "c": false, "e": "Completeness is recall of expected facts, not precision."}, {"t": "Add Document Retrieval, which checks the final answer", "c": false, "e": "It evaluates ranking against labels, not the answer text."}, {"t": "Relevance checks whether the answer addresses the question and can pass an answer that is fabricated; add Groundedness, which checks that claims stay inside the retrieved context", "c": true, "e": "Relevance and groundedness measure different things. Groundedness is the fabrication detector."}, {"t": "Relevance always fails on fabricated answers, so the reviewer is wrong", "c": false, "e": "A fluent, on-topic answer can score high on relevance."}], "concept": "Different RAG evaluators answer different questions, so a pass on one does not prove the others.\n\nRelevance asks whether the answer addresses the question. An answer can be perfectly on topic and still contain an invented date; it still passes Relevance. Groundedness asks whether every claim in the answer is supported by the retrieved context. An invented date has no support in the context, so Groundedness fails it. That is the evaluator to add.\n\nResponse Completeness checks whether expected information is present (recall), not whether something extra is false. Document Retrieval evaluates the retrieval step using labeled documents, not the final answer.\n\nUse them together: Retrieval (did we find the right context), Groundedness (is the answer faithful), Completeness (is it complete) and Relevance (does it answer the question).\n\nMemory aid: relevance = on topic; groundedness = on the facts.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A latency budget allows about 250 ms of extra overhead for safety checks. The team plans guardrail controls at the user input point and the output point of a model deployment. Using the documented per-point overhead, what is a reasonable expectation?", "o": [{"t": "No overhead, because the content filter is part of the network", "c": false, "e": "Each intervention point adds latency."}, {"t": "About 5 ms in total, because guardrails run in parallel for free", "c": false, "e": "The documented overhead is much higher."}, {"t": "About 100 to 200 ms in total, since each intervention point adds roughly 50 to 100 ms", "c": true, "e": "Two points at 50 to 100 ms each fit within the 250 ms budget."}, {"t": "About 2 seconds in total, because each point calls a large model", "c": false, "e": "This is far above the documented range."}], "concept": "Guardrails can be attached at four intervention points: user input, tool call, tool response and output. Each point adds latency, roughly 50 to 100 ms per point, depending on content length and the number of controls.\n\nFor a model deployment with controls at input and output, the overhead is about 2 x 50 = 100 ms at best and 2 x 100 = 200 ms at worst, so 100 to 200 ms. That fits inside a 250 ms budget. For an agent that also scans every tool call and tool response, the number of scanned points grows with the number of tool calls, and the overhead grows too.\n\nThis is a design trade-off: more intervention points give more protection but add latency, so apply the points that match the real attack paths.\n\nTool call and tool response controls are Preview, apply to agents, and only for tools that support moderation.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/intervention-points", "https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A team improves a prompt by editing five things at once: wording, examples, the output format, the temperature and the model. The score rises, and nobody knows why. Which approach does the prompt-improvement loop recommend?", "o": [{"t": "Write a test set first, record a baseline, change one thing at a time, and keep a change only if the metric improves", "c": true, "e": "Single changes show cause and effect, and the baseline gives a reference."}, {"t": "Tune only on the examples you can see in the prompt", "c": false, "e": "This overfits to the visible examples."}, {"t": "Skip refusals in the test set to keep the score high", "c": false, "e": "A test for refusals is part of a good set."}, {"t": "Keep all five changes because the score went up", "c": false, "e": "You cannot tell which change helped or hurt, and some may fail on other inputs."}], "concept": "Prompt engineering is experimental work, so it needs a method. The loop has six steps. First, write the test: 30 to 50 real inputs with expected outcomes, including a few that should be refused. Second, run the simple prompt and record the baseline. Third, change one thing, such as adding an \"out\", adding two examples or adding a cue. Fourth, re-run and compare, keeping the change only if the metric improves. Fifth, review failures by hand, since each failure suggests the next change. Sixth, lock the prompt in version control together with its test results.\n\nIf you change five things together, you cannot tell which one helped, and one may have hidden a regression. Tuning on the visible examples only also overfits.\n\nCommon mistakes: no test for refusals, several changes at once, and judging by a few hand-picked examples.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering"], "ref": ["prompt-engineering-parameters-and-reflection"]}, {"d": 2, "q": "A memory store keeps both `user_profile_enabled` facts and `chat_summary_enabled` summaries for an assistant. Which TWO statements about how they should be retrieved are correct?", "o": [{"t": "User profile items should be re-extracted on every message and never stored", "c": false, "e": "The store keeps them for later retrieval."}, {"t": "Both types must be retrieved at the end of every conversation only", "c": false, "e": "This does not match the guidance."}, {"t": "Chat summaries are retrieved dynamically, based on the current conversation", "c": true, "e": "They depend on the topic being discussed."}, {"t": "Chat summaries are retrieved once at deployment time of the model", "c": false, "e": "They are retrieved per conversation, not at deployment."}, {"t": "User profile items (preferences and facts) are retrieved once at the start of a conversation", "c": true, "e": "They are stable facts that personalize the whole conversation."}], "concept": "A memory store keeps durable knowledge that an agent extracts from conversations. After a conversation the system extracts items worth keeping, consolidates duplicates and conflicts with a language model, stores them partitioned by scope, and retrieves them at run time through the memory search tool or the store APIs.\n\nThere are different memory types. `user_profile_enabled` keeps preferences and facts about the user, such as a preferred name or a dietary restriction. Retrieve them once at the start of a conversation. `chat_summary_enabled` keeps distilled summaries of topics or threads. Retrieve them dynamically, based on the current conversation. `procedural_memory_enabled` appears in the latest preview.\n\nCreating a store needs a chat model deployment and an embedding model deployment. Use one store per agent, set `scope` to `{{$userId}}` for per-user isolation, and set `default_ttl_seconds` for retention.\n\nMemory is Preview, so check current limits.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/memory-usage", "https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/what-is-memory"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "A tool call control with annotate and block fires because the agent proposes to send a customer's card number to a tool. What happens?", "o": [{"t": "The tool runs, and the card number is removed from the log only", "c": false, "e": "The call is blocked before it runs."}, {"t": "The tool call is not executed, and the agent stops until there is another user input", "c": true, "e": "This is the documented behavior for annotate and block at the tool call point."}, {"t": "The agent retries the same call ten times automatically", "c": false, "e": "Retry is not documented behavior."}, {"t": "The control deletes the agent", "c": false, "e": "Controls do not delete agents."}], "concept": "Guardrails can inspect an agent at four points. The tool call point scans what the agent proposes to send to a tool, meaning the tool name and arguments. It defends against an agent about to send harmful or sensitive data, or to take an unintended action. It is a Preview feature for agents.\n\nWhen a tool call control is set to annotate and block and it fires, the tool call is not executed and the agent stops until there is another user input. This prevents the harmful call and leaves the next step to the user or the application.\n\nCompare with the tool response point: when it fires with annotate and block, the agent stops immediately and the malicious content is not saved in the agent's memory.\n\nRemember the limits: these controls work only with tools that support moderation (for example Azure AI Search, Azure Functions, OpenAPI, SharePoint grounding, Fabric Data Agent, Bing grounding and Browser Automation), and each point adds about 50 to 100 ms.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/intervention-points"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A Foundry agent must call another team's agent that is exposed as an A2A endpoint. What is the setup?", "o": [{"t": "Create a project connection of category `RemoteA2A` to the remote agent's base URI with authentication, then add an `A2ATool` that points to the connection", "c": true, "e": "The orchestrator reads the remote agent card and calls it as a tool."}, {"t": "Add a `FunctionTool` and return the remote agent's answer as `function_call_output`", "c": false, "e": "This is a client-side function pattern, not the A2A tool."}, {"t": "Copy the remote agent's instructions into the local agent", "c": false, "e": "This duplicates the agent instead of calling it."}, {"t": "Use the classic Connected Agents tool", "c": false, "e": "It is not available in the new Foundry Agent Service."}], "concept": "A2A (Agent2Agent) is an open protocol that lets one agent call another over HTTP, even if they were built by different teams or with different frameworks. Foundry supports it through the A2A tool.\n\nThe setup has two parts. First create a project connection of category `RemoteA2A` that holds the remote agent's base URI and its authentication, so credentials are managed in one place. Then add an `A2ATool` to your agent that points to the connection. The local agent can then call the remote agent like a tool and receive its response, while keeping control of the conversation.\n\nA `FunctionTool` would require you to write the glue code and return the answer as `function_call_output`. The classic Connected Agents tool is not available in the new Foundry Agent Service. Copying the remote agent's instructions duplicates and loses the remote agent's tools and data.\n\nRemember to secure the connection with least privilege.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/agent-to-agent"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "A RAG pipeline ingests scanned PDFs. Search returns nothing for content that is clearly on the pages, and the extracted text of those files is empty. Which step failed and what is the fix?", "o": [{"t": "Reranking: enable the semantic ranker", "c": false, "e": "The ranker reorders results that exist. Here the content was never extracted."}, {"t": "Generation: lower the temperature", "c": false, "e": "Generation cannot use text that was never indexed."}, {"t": "Text extraction: a scanned PDF has no text layer, so add OCR (or Content Understanding / Document Intelligence Layout) to the pipeline", "c": true, "e": "Without OCR there is nothing to chunk or embed. Checking the extracted text of a few real files finds this quickly."}, {"t": "Embedding: switch to `text-embedding-3-large`", "c": false, "e": "A better embedding model cannot embed text that does not exist."}], "concept": "RAG pipelines have stages: extract text, chunk, embed, index, retrieve, rerank, generate. If an ea
