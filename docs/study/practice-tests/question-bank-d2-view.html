l.\n\nFilters and facets work in hybrid queries. With the semantic ranker you probably want post-filtering; test both.", "src": ["https://learn.microsoft.com/en-us/azure/search/hybrid-search-overview", "https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-create-index"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A developer uses the Microsoft Agent Framework and marks a refund function with `@tool(approval_mode=\"never_require\")`, copied from a quickstart. Before production, a reviewer asks for human-in-the-loop control on refunds. What should change?", "o": [{"t": "Use `always_require` for tools that change data, so a person approves each call", "c": true, "e": "Learn's sample uses never_require for brevity and says to use always_require in production for human-in-the-loop."}, {"t": "Keep `never_require` and add a sentence to the prompt asking the model to be careful", "c": false, "e": "A prompt does not enforce approval."}, {"t": "Remove the refund tool and ask users to refund manually", "c": false, "e": "This removes the capability instead of controlling it."}, {"t": "Increase `max_output_tokens`", "c": false, "e": "Output length does not control approval."}], "concept": "Tools that act in the world need approval controls. In the Microsoft Agent Framework, a function tool declares an approval mode. `never_require` lets the agent run it without asking, which is convenient in samples. `always_require` pauses the run so that a person can approve or reject the call, which is human-in-the-loop.\n\nLearn's function calling sample says to use `always_require` in production. Apply it to tools with side effects: refunds, payments, access grants, sending messages. For low-risk read-only tools, approval can be skipped to avoid delay.\n\nCombine approval with other layers: the tool enforces limits in code (for example refunds over $200 need approval), the identity has least privilege, tool call controls in the guardrail inspect what is about to be sent, and the trace stores who approved and when.\n\nPrinciple: prompts guide; code and permissions enforce.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling", "https://learn.microsoft.com/en-us/azure/foundry/agents/overview"], "ref": ["agent-safety-and-identity", "building-agents-with-foundry"]}, {"d": 2, "q": "A hybrid search returns three documents. Reciprocal Rank Fusion uses `score = sum of 1 / (rank + k)` with k = 60. Document A ranks 1st in the keyword list and 5th in the vector list. Document B ranks 2nd in the keyword list and 1st in the vector list. Document C ranks 3rd in the keyword list and is not in the vector list. What is the final order?", "o": [{"t": "B, A, C", "c": true, "e": "B = 1/62 + 1/61 = 0.03252, A = 1/61 + 1/65 = 0.03178, C = 1/63 = 0.01587. A document that is high in both lists wins."}, {"t": "C, B, A", "c": false, "e": "C appears in only one list and scores about half as much."}, {"t": "A, B, C", "c": false, "e": "A was first in the keyword list, but B scores higher because it is high in both lists."}, {"t": "A, C, B", "c": false, "e": "B's score is not the lowest, since it ranks 1st in the vector list."}], "concept": "Reciprocal Rank Fusion (RRF) merges ranked lists. Each document gets a score from each list where it appears: 1 / (rank + k), with k = 60 in the question. The scores are added, and documents are sorted by the sum.\n\nDocument A: 1st in keywords = 1/61 = 0.01639, 5th in vectors = 1/65 = 0.01538, sum = 0.03177.\nDocument B: 2nd in keywords = 1/62 = 0.01613, 1st in vectors = 1/61 = 0.01639, sum = 0.03252.\nDocument C: 3rd in keywords = 1/63 = 0.01587, absent from the vector list = 0, sum = 0.01587.\n\nOrder: B (0.03252), A (0.03177), C (0.01587).\n\nLesson: RRF rewards documents that are high in both lists. A is first in one list, but only fifth in the other, so B, which is first and second, beats it narrowly. A document found by one method only (C) still appears, but with a lower score.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-ranking"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A developer wants the model to return a text field that must match a regular expression and have a minimum length, using strict Structured Outputs. What should they do?", "o": [{"t": "Switch to JSON mode, which enforces patterns", "c": false, "e": "JSON mode only guarantees valid JSON."}, {"t": "Add `pattern` and `minLength` to the schema and trust the service to enforce them", "c": false, "e": "They are not supported in strict mode."}, {"t": "Increase the temperature so the model varies the text", "c": false, "e": "Randomness does not enforce patterns."}, {"t": "Enforce `pattern` and `minLength` in application code, because these keywords are not supported in the strict schema subset", "c": true, "e": "Unsupported keywords include `minLength`, `maxLength`, `pattern`, `format`, `minimum` and `maximum`."}], "concept": "Structured Outputs in strict mode support only a subset of JSON Schema. The reason is that the service compiles the schema into constraints for decoding, and not every keyword can be compiled.\n\nKeywords such as `pattern` (regular expression) and `minLength` are not supported in the strict subset, so the service does not enforce them. If you add them and trust the service, invalid values still appear. The correct design validates these business rules in application code: after parsing, check the regex and the length, and retry or reject if they fail.\n\nJSON mode only guarantees valid JSON, not patterns. Increasing temperature makes values less predictable.\n\nSummary of the contract: the schema gives structure (fields, types, enums, required), and your code gives value rules (patterns, ranges, cross-field checks).\n\nMemory aid: the schema guarantees the shape of the box; you inspect what is inside.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/structured-outputs"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "An enterprise search assistant must return only documents that the signed-in user is allowed to read. A developer proposes adding \"only show documents the user may read\" to the system prompt. What is the better design?", "o": [{"t": "Rerank with the semantic ranker so that private documents rank low", "c": false, "e": "Ranking is not authorization."}, {"t": "Apply security trimming at retrieval: filter on access information stored with each chunk, so unauthorized content never reaches the model", "c": true, "e": "Access information is collected when content is ingested, and filters are applied at query time."}, {"t": "Lower the temperature", "c": false, "e": "It does not enforce access."}, {"t": "Keep the prompt rule and trust the model", "c": false, "e": "A prompt rule can be bypassed, and the content has already reached the model."}], "concept": "Who may see a document is an access control problem, and access control must be enforced by code and data, not by a request to the model.\n\nA rule in the prompt is advice. If unauthorized chunks reach the model, it can quote them, summarize them, or be tricked into revealing them. The secure design is security trimming at retrieval: store access information with each chunk (for example group IDs or ACLs), and add a filter to every query based on the signed-in user's identity and groups, so unauthorized content is never returned by the search. In Azure AI Search this is a filter on a security field, or the permission-aware features for supported sources.\n\nThe semantic ranker only changes order; private documents would still be returned. Temperature has no effect on authorization.\n\nMemory aid: do not hand the secret to the model and ask it to keep quiet. Never hand it over.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-security-built-in"], "ref": ["rag-retrieval-and-grounding", "azure-ai-search-configuration"]}, {"d": 2, "q": "A knowledge assistant's instruction says \"Do not fabricate information\", but reviewers still find invented facts. Which instruction change is more effective?", "o": [{"t": "Remove the retrieved context", "c": false, "e": "The model then relies on memory."}, {"t": "Ask for inline citations next to each claim, so an invented statement needs a false claim and a false citation, and checking becomes easy", "c": true, "e": "Citations make fabrication harder and verification simple. Closer citations work better than a list at the end."}, {"t": "Raise the temperature", "c": false, "e": "This increases invention."}, {"t": "Repeat \"do not fabricate\" ten times", "c": false, "e": "Weak instructions do not become stronger by repetition."}], "concept": "\"Do not fabricate\" is a wish, not a mechanism. The model still tries to be helpful and can invent facts, and repeating the wish ten times does not give it a new ability.\n\nAsking for inline citations changes the task. Each claim must come with a reference to a source passage, for example `[doc2]`. To invent a fact the model would also have to invent a matching citation, which is harder and easier to catch. A reviewer (or an automated check) can look at the citation and verify the claim quickly. Missing citation is a clear signal to reject a statement.\n\nRemoving the retrieved context removes the facts and makes invention more likely. Raising the temperature increases randomness.\n\nCombine it with an \"out\" (\"if the sources do not contain the answer, say you don't know\") and a groundedness evaluation.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering"], "ref": ["prompt-engineering-parameters-and-reflection"]}, {"d": 2, "q": "All vectors in an index are normalized to unit length. The team wants the same ranking as cosine similarity with slightly faster computation. Which similarity metric should the vector field use?", "o": [{"t": "`dotProduct`", "c": true, "e": "For normalized vectors it gives the same ranking as cosine and is slightly faster."}, {"t": "`euclidean` with unnormalized vectors", "c": false, "e": "It measures straight-line distance and is a different metric."}, {"t": "`hamming` for text embeddings", "c": false, "e": "It is not one of the three listed metrics."}, {"t": "`bm25`", "c": false, "e": "It is the keyword scoring algorithm, not a vector metric."}], "concept": "A similarity metric defines how \"close\" two vectors are. Azure AI Search offers `cosine`, `dotProduct` and `euclidean`. Cosine compares direction, and is the usual choice for Azure OpenAI embeddings. Dot product is equal to cosine for normalized vectors (length 1) and slightly faster, because it skips a normalization step. Euclidean measures straight-line distance.\n\nFor cosine, the reported vector score is 1 / (1 + cosine_distance), ranging from 0.333 to 1.0 and decreasing as similarity gets worse.\n\nChoosing a metric is separate from choosing an algorithm. HNSW is approximate and fast; exhaustive KNN is exact and uses no vector index quota. A field indexed for HNSW can be queried exhaustively with `exhaustive: true`.\n\nRule: use the metric that matches how the embedding model was trained, and keep it consistent between index and query.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-ranking", "https://learn.microsoft.com/en-us/azure/search/vector-search-overview"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "Which TWO statements correctly describe the two Prompt Shields attack families?", "o": [{"t": "Prompt Shields scan only the model's final output", "c": false, "e": "They scan user input and documents or tool responses, not only the output."}, {"t": "A document attack is written by the end user in the chat box", "c": false, "e": "That would be a user prompt attack."}, {"t": "A document (indirect) attack comes from content the agent reads, such as documents, web pages and tool results", "c": true, "e": "A third party hides instructions in content that the agent processes, so it is scanned at tool responses as well."}, {"t": "Spotlighting is a feature of Prompt Shields for agents", "c": false, "e": "Spotlighting is a preview feature for models through Chat Completions and is not available for agents."}, {"t": "A user prompt attack comes from the user and is scanned at user input", "c": true, "e": "The user tries to override system instructions or safety training, for example by role-play or encoding tricks."}], "concept": "Prompt Shields detect two families of attacks on language models.\n\nA user prompt attack is written by the user, who tries to override the rules or the system prompt (a jailbreak). It is scanned at the user input. A document attack, also called indirect attack, is hidden in content that the model reads from elsewhere: documents, web pages, emails or tool results. The user may be innocent. For agents, such content arrives at the tool response intervention point.\n\nTherefore a document attack is not typed in the chat box by the end user, and Prompt Shields do not only scan the final output. Spotlighting is a related Preview technique that marks documents as less trusted by base64-encoding them, but it applies to models through Chat Completions and not to agents.\n\nMemory aid: user prompt attack = the customer attacks you; document attack = a stranger leaves a booby-trapped note in the paperwork the customer hands you.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A process needs several agents in a declared order, with a human approval step before the final answer. The team prefers declarative orchestration rather than writing the control logic. Which Foundry feature fits?", "o": [{"t": "A single prompt agent with a longer instruction", "c": false, "e": "One agent cannot declare a multi-agent order with approval steps."}, {"t": "The classic Connected Agents tool", "c": false, "e": "It is not available in the new Foundry Agent Service."}, {"t": "An embedding model deployment", "c": false, "e": "Embeddings represent text as vectors and do not orchestrate agents."}, {"t": "A workflow, which orchestrates several agents in patterns such as sequential, group chat and human-in-the-loop", "c": true, "e": "Workflows are declarative orchestration in the new Foundry Agent Service."}], "concept": "Multi-agent solutions need a way to pass work between agents and keep control. In the new Foundry Agent Service the replacements for the classic Connected Agents tool are the A2A tool and workflows.\n\nThe A2A tool lets a Foundry agent call any A2A-compatible endpoint, including another Foundry agent exposed as one. Workflows are declarative orchestration of several agents: sequential, group chat and human-in-the-loop. A workflow is the better match when the order and the approval step are part of the design.\n\nIn hosted agents written with the Microsoft Agent Framework you can also expose one agent as a function tool of another, in process, and long-running workflows can resume from checkpoints.\n\nPractice material may still call the pattern \"connected agents\". Choose the option that matches the product the question names.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/workflow", "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/agent-to-agent"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "A developer is tuning randomness for a data-extraction prompt. Which TWO statements are correct?", "o": [{"t": "Change either `temperature` or `top_p`, but not both", "c": true, "e": "Both parameters control randomness in different ways. Changing both makes the effect hard to predict."}, {"t": "Always change both `temperature` and `top_p` for the best result", "c": false, "e": "Learn advises changing one of them, not both."}, {"t": "`max_output_tokens` controls how random the output is", "c": false, "e": "It only caps the length of the output (and, for reasoning models, the reasoning tokens)."}, {"t": "A low temperature (for example about 0.2) suits focused, concrete output such as extraction", "c": true, "e": "Lower temperature gives more consistent output. Higher values (about 0.7) suit varied text such as stories."}, {"t": "Setting temperature to 2 gives the most deterministic output", "c": false, "e": "A higher temperature gives more randomness, not less."}], "concept": "Randomness in text generation is controlled by sampling parameters.\n\nTemperature rescales the model's probabilities for the next token. A low value (about 0 to 0.3) makes it pick the most likely tokens, so output is focused and repeatable, which suits extraction and classification. A high value makes it more varied and creative. Top_p (nucleus sampling) limits the choice to the smallest set of tokens whose probabilities add up to p. Both parameters change the same thing from different angles, so the guidance is to change one of them and leave the other at its default.\n\nTemperature 2 is the opposite of deterministic: it is the most random. `max_output_tokens` is only a length cap and has nothing to do with randomness. Reasoning models may ignore or restrict these parameters, so check the model page.\n\nMemory aid: temperature is how adventurous the model is when picking words; top_p is how long the menu of allowed words is. Turn one knob, not both.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering"], "ref": ["prompt-engineering-parameters-and-reflection"]}, {"d": 2, "q": "A memory store keeps user profile facts. The privacy officer wants the extractor to avoid age, financial information, precise location and credentials, and old entries to expire automatically. Which settings apply?", "o": [{"t": "A shared static scope for all users", "c": false, "e": "It removes isolation."}, {"t": "`chat_summary_enabled` set to false", "c": false, "e": "This disables summaries, not sensitive profile data."}, {"t": "Put the rules in the system prompt only", "c": false, "e": "The extractor needs its own guidance, and prompts do not control retention."}, {"t": "`user_profile_details` with instructions on what to avoid, and `default_ttl_seconds` for retention", "c": true, "e": "These settings tell the extractor what not to store and set a default lifetime for new entries."}], "concept": "Memory stores personal facts, so they need privacy controls built in.\n\n`user_profile_details` is a setting where you tell the extractor what to focus on and what to avoid. You can write instructions such as \"do not store age, financial information, precise location or credentials\". The extractor then skips those details when it builds memories. `default_ttl_seconds` sets a default time to live for new entries, so old memories expire automatically, which supports data minimization and retention rules.\n\nSetting `chat_summary_enabled` to false only disables summary memory. A shared static scope puts everyone's memories together, which is worse for privacy. Rules only in the system prompt are weak, because the extraction is a separate step.\n\nAlso scope memory per user, support deletion requests, and treat retrieved memories as untrusted context.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/what-is-memory"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "A team builds integrated vectorization and uses a custom skill, behind a web API, to create embeddings during indexing. Which vectorizer must the vector profile use to embed query text at search time?", "o": [{"t": "An Azure OpenAI vectorizer with a different embedding model", "c": false, "e": "A different model makes query and index vectors incompatible."}, {"t": "A custom Web API vectorizer that calls the same embedding model as the skill", "c": true, "e": "The vectorizer type should match the embedding skill, and both must use the same model."}, {"t": "No vectorizer, because query vectors are created by the semantic ranker", "c": false, "e": "The ranker does not create vectors."}, {"t": "An Azure Vision vectorizer", "c": false, "e": "That one pairs with the Azure Vision multimodal embedding skill."}], "concept": "Integrated vectorization adds vector encoding at indexing time and at query time with no separate pipeline. At indexing, a skillset chunks the text and an embedding skill creates the vectors. At query time, a vectorizer defined in the index and assigned to the vector field through a vector profile turns the query text into a vector.\n\nThe two must use the same embedding model. The pairs are: Azure OpenAI Embedding skill with the Azure OpenAI vectorizer; a custom skill with a Custom Web API vectorizer; the Azure Vision multimodal skill (preview) with the Azure Vision vectorizer; and an Azure Machine Learning skill from the catalog with the Foundry model catalog vectorizer (preview).\n\nIf the two sides differ, queries and documents live in different vector spaces, and retrieval quality collapses.\n\nA complete vector field needs the `vectorSearch` profile, the field's `vectorSearchProfile` and the right `dimensions`.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-integrated-vectorization", "https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-create-index"], "ref": ["azure-ai-search-configuration"]}, {"d": 2, "q": "Which TWO statements about the Azure AI Search semantic ranker are true?", "o": [{"t": "It is free for every query", "c": false, "e": "It is a billed feature when `queryType=semantic` is used with a non-empty search string."}, {"t": "It reranks only the top 50 results of the initial ranking", "c": true, "e": "It is a second-stage reranker. If the right document is not in the first 50, it cannot be rescued."}, {"t": "It scores documents from 0 to 4 in `@search.rerankerScore`", "c": true, "e": "A score of 4 means highly relevant and a complete answer; 0 means irrelevant."}, {"t": "Its captions and answers are written by a generative model", "c": false, "e": "Captions and answers are verbatim text copied from your index."}, {"t": "It searches the whole index and can add documents that retrieval missed", "c": false, "e": "It only reorders results that retrieval already found."}], "concept": "The semantic ranker is a second-stage re-ranker in Azure AI Search.\n\nFirst stage: BM25, vector or hybrid retrieval produces a ranked list. Second stage: the semantic ranker takes only the top 50 results of that list and re-scores them with a language-understanding model, so it improves the order, not the recall. A relevant document at position 80 is never seen by it. Each re-ranked result gets `@search.rerankerScore` from 0 to 4 (higher is more relevant). It can also return captions (key sentences) and answers, which are extracted from the document text, not generated by a model.\n\nIt is a billed feature (a free monthly allowance exists, then usage-based), so \"free for every query\" is wrong. Because it cannot add documents the first stage missed, improving first-stage retrieval (chunking, hybrid search, `k`) is part of using it well.\n\nMemory aid: the ranker is a judge who re-orders the finalists; it does not recruit new contestants.", "src": ["https://learn.microsoft.com/en-us/azure/search/semantic-search-overview"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "An agent has a function tool `get_order_status(order_id)`. Security reviews the code that runs when the model returns a `function_call`. Which TWO practices follow the guidance?", "o": [{"t": "Return the full database row, including internal secrets, so the model has more context", "c": false, "e": "Tool output must not contain secrets; return only what the model needs."}, {"t": "Run the function with a least-privilege identity and require explicit confirmation for actions that change data", "c": true, "e": "This limits damage if the arguments or the model's decision are wrong."}, {"t": "Pass the raw argument string directly into a database query for speed", "c": false, "e": "This invites injection and invalid values."}, {"t": "Skip returning `function_call_output` and let the agent guess the result", "c": false, "e": "The app must return the output with the same `call_id`."}, {"t": "Parse and validate the arguments before use, because the model's arguments are untrusted input", "c": true, "e": "A model can produce unexpected values, and an attacker can influence them through content."}], "concept": "A function tool is only a request: the model returns a `function_call` item with a name, JSON `arguments` and a `call_id`. Your application executes the function and returns a `function_call_output` with the same `call_id`. Because your code does the work, your code also owns the safety.\n\nLearn's guidance: treat arguments and outputs as untrusted input and validate them before use; do not put secrets in tool output; use least privilege for the identity that your code uses; avoid side effects unless intended; and require explicit confirmation for actions that change data. In the Agent Framework, approval modes such as `always_require` support human-in-the-loop for production.\n\nWhy untrusted: the model decides the arguments, and an attacker can influence the model through documents or messages.\n\nRuns also expire 10 minutes after creation, so slow work should return a status and be polled.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling"], "ref": ["building-agents-with-foundry", "agent-safety-and-identity"]}, {"d": 2, "q": "A RAG evaluation shows high Retrieval and high Groundedness scores, but the Relevance score is low: answers are faithful to the context yet do not address what the user asked. Which fix fits best?", "o": [{"t": "Lower the embedding dimensions", "c": false, "e": "Dimensions affect vectors and not the question being answered."}, {"t": "Replace the semantic ranker with BM25 only", "c": false, "e": "Ranking is not the issue here."}, {"t": "Improve query understanding, for example rewrite the query with conversation history, and tighten the prompt so the model answers the actual question", "c": true, "e": "Low relevance means the model answers a different question."}, {"t": "Raise `top_k` to 100 for completeness", "c": false, "e": "That addresses missing facts, not answers to the wrong question."}], "concept": "The score pattern across evaluators tells you where the system fails. Retrieval asks whether the retrieved chunks are relevant to the query. Groundedness asks whether the answer stays inside the context (precision). Relevance asks whether the answer addresses the question. Response Completeness asks whether expected facts are missing (recall).\n\nHere retrieval and groundedness are high, so the right content was found and the answer follows it. Low relevance means the answer addresses something else. A typical cause is that a follow-up such as \"and for phones?\" was searched without context, or the prompt does not tell the model to focus on the user's question.\n\nFixes: fold conversation history into the query, rewrite the query, and refine the prompt.\n\nCompare with other patterns: retrieval low means better chunking, hybrid search or OCR; retrieval high but groundedness low means a stricter prompt or lower temperature; groundedness high but completeness low means higher `top_k`.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A team evaluates Spotlighting (Preview) to reduce the effect of hidden instructions in third-party documents. Which TWO statements are correct?", "o": [{"t": "It is off by default, available through Chat Completions, and not available for agents", "c": true, "e": "These are the documented limits."}, {"t": "It adds no tokens, because base64 text is shorter than the original", "c": false, "e": "Base64 increases length, so more tokens are used and the input limit may be exceeded."}, {"t": "It is enabled automatically for every agent in Foundry Agent Service", "c": false, "e": "It is not available for agents."}, {"t": "It marks third-party documents as lower trust by base64-encoding them, which increases the token count", "c": true, "e": "Encoding makes the model less likely to treat the text as instructions, at the cost of more tokens."}, {"t": "It removes the need for any other protection against injection", "c": false, "e": "It is one layer, and other controls remain needed."}], "concept": "Indirect (document) attacks hide instructions in content the model reads. Prompt Shields detect such attacks. Spotlighting (Preview) is a different, complementary technique: it transforms third-party documents so the model recognizes them as data of lower trust. The transformation is base64 encoding.\n\nCosts and limits: there is no direct fee, but base64 increases the token count, so cost rises and the input may exceed the limit. It is available only through Chat Completions, it is off by default, and it is not available for agents. The model may also mention that content is \"base64 encoded\" in its answer.\n\nIt is not a replacement for the other layers: structure the prompt, scan with Prompt Shields, limit tool permissions and keep humans in the loop for sensitive actions.\n\nStandalone Prompt Shields API: it takes a `userPrompt` and up to five `documents` and returns `attackDetected` for each.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/content-filter-prompt-shields"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A solution needs an orchestrator agent that delegates sub-tasks to specialist agents, keeps control of the conversation, and writes the final answer, with each specialist call auditable. Which design fits in the new Foundry Agent Service?", "o": [{"t": "Use the classic Connected Agents tool", "c": false, "e": "Learn states that it is not available in the new Foundry Agent Service."}, {"t": "Put all specialist instructions in one very long system prompt", "c": false, "e": "This is one agent, not an orchestration, and it grows hard to maintain and audit."}, {"t": "Let the specialist agent answer the user directly", "c": false, "e": "This removes the orchestrator's control over the final answer."}, {"t": "Call the specialists as tools from the orchestrator, using the A2A tool or a workflow", "c": true, "e": "The orchestrator stays in control and every call to a specialist appears in the run output and trace."}], "concept": "In multi-agent designs one agent can use another as a building block. There are two shapes: hand-off, where control moves to the other agent, and agent-as-tool, where the orchestrator keeps control.\n\nIn the agent-as-tool pattern the orchestrator calls a specialist like a tool, receives its response, and writes the final answer itself. The specialist never talks to the user directly. Because each call is a separate tool call, it appears in the trace and can be audited. In the new Foundry Agent Service you do this with the A2A tool (Agent2Agent protocol, which is GA) or with a workflow. The old Connected Agents tool is not available in the new service.\n\nA specialist that answers the user directly breaks \"orchestrator keeps control\". One giant system prompt removes the separation of roles and the audit trail.\n\nUse this pattern when specialist roles clearly help; otherwise a single agent with tools or plain code is simpler and cheaper.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/agent-to-agent"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "A team adds the semantic ranker to a hybrid query. The guidance suggests a specific value for the vector query `k` so the right document is not missed by the reranker. What is it, and why?", "o": [{"t": "Leave `k` at 0 because the ranker retrieves its own documents", "c": false, "e": "It does not retrieve; it reorders."}, {"t": "Set vector `k` to 50, because the semantic ranker only reorders the top 50 results that retrieval already found", "c": true, "e": "A document outside the first 50 cannot be rescued."}, {"t": "Set `k` to 1,000 because the ranker scores everything", "c": false, "e": "It only takes the top 50."}, {"t": "Set `k` to 3 to keep the reranker fast", "c": false, "e": "A low value may exclude the right document."}], "concept": "The semantic ranker is a second-stage reranker that sits after BM25 or Reciprocal Rank Fusion. It takes only the top 50 results, builds a summary string of up to 2,048 tokens for each from the semantic configuration (title up to 128 tokens, keywords up to 128 tokens and content for the remaining tokens), and scores each from 0 to 4 in `@search.rerankerScore`. It can return captions and answers, which are always text copied from your index.\n\nBecause it only reorders what retrieval already found, retrieval must give it the right candidates. That is why the hybrid guidance sets the vector `k` to 50: the vector side then contributes up to 50 candidates for reranking.\n\nAlso: field order in the semantic configuration matters because long text is trimmed; the ranker works best on prose, not on short codes or numeric data; and it is billed for queries with `queryType=semantic` and a non-empty search string.\n\nMemory aid: the ranker is a judge; retrieval chooses who enters the courtroom.", "src": ["https://learn.microsoft.com/en-us/azure/search/semantic-search-overview", "https://learn.microsoft.com/en-us/azure/search/hybrid-search-overview"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "After Friday's change, a support agent gets worse. Traces of failing conversations show the `search_orders` tool is no longer called. What should the team do first to find the cause?", "o": [{"t": "Compare the previous and new agent versions with identical inputs and review the instruction changes, then run evaluators on both versions", "c": true, "e": "Versions are immutable, so a comparison shows exactly what changed."}, {"t": "Turn off guardrails permanently", "c": false, "e": "Nothing suggests guardrails caused the change."}, {"t": "Increase the number of model replicas", "c": false, "e": "Capacity is not the cause when the tool is simply not called."}, {"t": "Delete the agent and create a new one with a different name", "c": false, "e": "This loses the history and the evidence."}], "concept": "Match the symptom to the tool. In this case: open traces of failing conversations (the tool is no longer called); compare versions, since each saved change is an immutable version and you can compare setup, chat output and YAML; run evaluators on both versions (Tool Selection fails on the new one and Task Completion drops); roll back by directing traffic to the previous version while fixing; and prevent recurrence by adding the failing prompts to the test suite and making evaluation a required check before publish.\n\nThe likely finding is that the new instructions removed the line that told the agent to look up orders.\n\nDo not guess at infrastructure causes when traces show behavior. And do not delete versions: their history is your evidence.\n\nRemember that Foundry does not provide canary routing, so build a routing layer to send a small share of traffic to the new version first.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/development-lifecycle", "https://learn.microsoft.com/en-us/azure/foundry/observability/concepts/trace-agent-concept"], "ref": ["observability-and-agent-lifecycle", "cicd-for-foundry-projects"]}, {"d": 2, "q": "An engineer tries to add a function definition to a Foundry agent in the portal and cannot find the option. What is the situation?", "o": [{"t": "The agent type does not support functions", "c": false, "e": "Prompt agents support function tools."}, {"t": "The portal cannot add, edit or remove function definitions; use the SDK or REST API. The portal can run an agent that already has them, but it does not execute your function", "c": true, "e": "Function tools are defined in code and executed by your application."}, {"t": "The function must be written in the system prompt", "c": false, "e": "Prompts do not define callable functions."}, {"t": "A Provisioned deployment is required", "c": false, "e": "Deployment type is unrelated."}], "concept": "The Foundry portal is a good place to run and test agents, but it has limits for tools. It cannot add, edit or remove function definitions. A function tool is a contract between your application code and the model, and your app must run the code when the model asks. So function definitions are created with the SDK or the REST API, in the same code base that implements the functions.\n\nThe portal can run an agent that already has function definitions, but it does not execute your function. A call to the function will therefore appear as a pending `function_call` that nobody fulfills.\n\nThe agent type does support functions. A provisioned deployment is not required. Writing the function in the system prompt does not register a callable tool.\n\nPractice: keep agent definitions, including tool schemas, in source control and deploy them from a pipeline.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "A legal-tech app needs a strict check of whether each claim in an answer is consistent with the provided context, returned as True or False and powered by Azure AI Content Safety. Which evaluator fits?", "o": [{"t": "Document Retrieval", "c": false, "e": "It scores ranking quality against human labels, not answer consistency."}, {"t": "Relevance", "c": false, "e": "It checks whether the answer addresses the question and can pass even when facts are invented."}, {"t": "Groundedness Pro (Preview)", "c": true, "e": "It checks strict consistency with the context and returns True or False using Azure AI Content Safety."}, {"t": "Response Completeness (Preview)", "c": false, "e": "It measures recall of expected facts and needs ground truth."}], "concept": "RAG quality has several separate questions, and each has its own evaluator. Retrieval asks whether the retrieved chunks are relevant to the query. Document Retrieval compares ranking with human labels. Groundedness asks whether the answer stays inside the context, which is precision and the fabrication detector. Relevance asks whether the answer addresses the question. Response Completeness asks whether expected facts are missing, which is recall.\n\nGroundedness Pro is a stricter, Preview variant. It is powered by Azure AI Content Safety and returns True or False instead of a 1 to 5 score.\n\nA useful pattern: relevance can pass even when the answer contains invented facts, because it only checks that the answer is on topic. Groundedness catches the invention.\n\nMemory aid: groundedness is precision, completeness is recall.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A product manager expects the semantic ranker's \"answers\" feature to write a fluent new paragraph that combines facts from several documents. What does the feature actually return?", "o": [{"t": "Captions and answers that are verbatim passages copied from your index; no generative model writes them", "c": true, "e": "They are extracted text with highlights."}, {"t": "Newly generated text produced by a large language model", "c": false, "e": "They are not generated."}, {"t": "A translated version of the documents", "c": false, "e": "Translation is a separate service."}, {"t": "A numeric relevance score only, with no text", "c": false, "e": "Captions and answers are text passages; the score is separate."}], "concept": "The semantic ranker can return two text features. Captions are verbatim highlighted passages from a document that best match the query. Answers are passages that directly answer a question-like query. Both are always text copied from your index; no generative model writes them.\n\nIf you need a fluent paragraph that combines information from several sources, you need a generation step: pass the top retrieved chunks to a chat model with instructions to answer only from the sources and cite them. That is RAG. In agentic retrieval, answer synthesis uses a model (in the preview version), and Azure OpenAI bills tokens for it.\n\nSemantic ranking adds a reranker score from 0 to 4 and is a billed feature when `queryType=semantic` and the search string is not empty. Query rewrite (Preview) can expand one query into up to 10 variants.\n\nDecide whether you need extraction (semantic captions) or generation (a model).", "src": ["https://learn.microsoft.com/en-us/azure/search/semantic-search-overview", "https://learn.microsoft.com/en-us/azure/search/agentic-retrieval-overview"], "ref": ["rag-retrieval-and-grounding", "azure-ai-search-configuration"]}, {"d": 2, "q": "A team plans to rely on Structured Outputs to guarantee argument shape for function tools in agents running in Foundry Agent Service, and they tell the security reviewers that no further validation is needed. What is wrong?", "o": [{"t": "Structured Outputs are not supported with Foundry Agent Service, so the application must validate arguments itself", "c": true, "e": "Learn lists Agent Service and bring-your-own-data scenarios as unsupported for this guarantee."}, {"t": "Validation is only needed for images, not for tools", "c": false, "e": "Tool arguments are untrusted input."}, {"t": "Agents never produce function arguments", "c": false, "e": "Function tools produce arguments in a `function_call`."}, {"t": "Nothing is wrong, because strict mode works everywhere", "c": false, "e": "It is not supported in Agent Service."}], "concept": "Structured Outputs with `strict: true` guarantee that output matches a JSON Schema in the places where the feature is supported. Learn lists a restriction: it is not supported with Foundry Agent Service or bring-your-own-data scenarios. In those environments the application must validate arguments itself.\n\nFor function tools in Agent Service the schema still helps: set `required` fields, `additionalProperties: False` and `strict=True` in the tool definition to improve the arguments, as the function-calling guide shows. But treat arguments and outputs as untrusted input and validate them before use.\n\nWhen Structured Outputs are available (for example direct Responses API calls), remember the strict subset rules: all fields required, null for optional, `additionalProperties: false`, limits of 100 properties and 5 levels, and unsupported keywords such as `pattern`.\n\nNever present a model guarantee as a security control.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/structured-outputs", "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling"], "ref": ["rag-retrieval-and-grounding", "building-agents-with-foundry"]}, {"d": 2, "q": "An agent function that exports a large report takes 15 minutes. The run expires before the app can send the function output. What is the recommended design?", "o": [{"t": "Add the output to the system prompt", "c": false, "e": "The output does not exist yet and prompts are not a data channel."}, {"t": "Increase the run timeout to 30 minutes in the agent definition", "c": false, "e": "The 10-minute expiry is not configurable as described."}, {"t": "Return a status immediately from the function and poll for the result separately; runs expire 10 minutes after creation", "c": true, "e": "The 10-minute limit applies to total elapsed time, so slow work must be decoupled from the run."}, {"t": "Make the function tool server-side", "c": false, "e": "Function tools always run in your application."}], "concept": "A function tool run has a time limit: a run expires 10 minutes after it was created. The 10 minutes covers the total elapsed time, not just the function.\n\nA function that takes 15 minutes cannot fit. The recommended design is to make the function return a status immediately, for example a job ID and \"running\", so the model can tell the user that the report has started. The work continues elsewhere (a queue, a worker, a background function), and the application checks it later with a second function such as `get_report_status`, or notifies the user when the file is ready.\n\nYou cannot raise the limit in the agent definition. Making the tool \"server-side\" does not change that your function is slow. Putting the output in the system prompt does not run the export at all.\n\nMemory aid: do not wait at the counter for a 15-minute job; take a ticket and come back.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "You design chunking for a 10,000-token document before embedding. Which TWO statements are correct?", "o": [{"t": "Chunking is unnecessary because embedding models accept unlimited input", "c": false, "e": "Embedding models have input limits, for example 8,191 tokens for `text-embedding-3-small`."}, {"t": "A documented starting point is 512 tokens with 25% overlap (128 tokens)", "c": true, "e": "This is the recommended starting point to test on your own data."}, {"t": "Overlap prevents an answer from being cut in half at a chunk boundary, at the cost of more chunks and embedding calls", "c": true, "e": "With a 384-token stride the document produces about 26 chunks instead of about 20 without overlap."}, {"t": "One vector for the whole document gives the best retrieval", "c": false, "e": "A single vector blurs many topics together."}, {"t": "Larger chunks are always better because they keep more context", "c": false, "e": "Large chunks blur meaning, cost more and may exceed token limits."}], "concept": "Chunking splits long documents into pieces before embedding. An embedding model has an input limit, and a single vector for a whole document blurs many topics into one point, so retrieval is poor.\n\nMicrosoft's documented starting point is chunks of 512 tokens with 25% overlap, which is 128 tokens shared between neighboring chunks. Overlap repeats the end of one chunk at the start of the next, so a fact or sentence that falls on a boundary appears whole in at least one chunk. The trade-off is more chunks, more embedding calls and a larger index. Tune size and overlap with your own questions and evaluation scores.\n\n\"Larger is always better\" is false: big chunks dilute the meaning and cost more tokens in the prompt. \"One vector per document\" and \"no chunking\" fail on long files.\n\nFor a 10,000-token document at 512 tokens with 128 overlap, each new chunk moves forward by 384 tokens, which gives about 26 chunks.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-chunk-documents"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "Which TWO statements are correct when you use function calling together with Structured Outputs?", "o": [{"t": "Check for a refusal before reading the parsed value", "c": true, "e": "The model can refuse, and the parsed value is then not your schema."}, {"t": "Set `strict: true` on the function and set `parallel_tool_calls` to `false`", "c": true, "e": "Structured outputs do not support parallel tool calls."}, {"t": "Structured Outputs work with Foundry Agent Service, so no argument validation is needed", "c": false, "e": "They are not supported with Foundry Agent Service, so validate arguments yourself."}, {"t": "The output order is random", "c": false, "e": "Output follows the order of the schema."}, {"t": "Keywords such as `minLength` and `pattern` are enforced by the service", "c": false, "e": "They are unsupported in the strict subset. Validate those rules in code."}], "concept": "Function calling and Structured Outputs can be combined, so the arguments for a function always follow the schema.\n\nTwo settings matter. Set `strict: true` on the function definition so the arguments match the schema. Strict function calling requires `parallel_tool_calls` to be `false`, because parallel calls are not compatible with the schema guarantee. Second, when the model declines to answer for safety reasons, the response contains a refusal instead of the parsed content, so check for a refusal before you read the parsed value.\n\nStructured Outputs are not supported with Foundry Agent Service, so you must still validate arguments yourself there. Keywords such as `minLength` and `pattern` are not enforced by the service, so validate those constraints in your own code. Property order follows the schema order, not random order.\n\nMemory aid: strict on, parallel off, check refusal first, and still validate business rules in code.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/structured-outputs"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A prompt agent with a `FunctionTool` receives the question \"Where is order 4711?\". The response contains an output item of type `function_call`, but the user never receives a final answer. What must the application do?", "o": [{"t": "Increase the run timeout of the agent", "c": false, "e": "The agent is waiting for the tool output. More time does not produce it."}, {"t": "Call `create_version` again with `strict=False`", "c": false, "e": "Changing the tool definition does not execute the function."}, {"t": "Run the function and send a `function_call_output` item with the same `call_id` in a follow-up `responses.create` call", "c": true, "e": "A function tool is only a request. Your code must execute it and return the result so the model can write the answer."}, {"t": "Wait for the agent service to execute the function", "c": false, "e": "Function tools run in your application. Only hosted tools such as file search run on the service."}], "concept": "A function tool is a request, not an execution. The model can decide that it needs a function and describe the call (name and JSON arguments), but it cannot run your code.\n\nThe loop has five steps. The app sends the user message. The response contains an output item of type `function_call` with a `call_id` and `arguments`. The application parses the arguments, runs the real function (and checks authorization), and sends back a `function_call_output` item that carries the same `call_id`. The model then uses the result to produce the final text answer.\n\nIf the application stops after step two, the user sees nothing, which is exactly the symptom here. Remember that a run waiting for function output expires after about ten minutes, so slow work should return a status and be polled.\n\nThe service does not execute your function, increasing a timeout does not help, and `strict` only controls whether the arguments must follow the schema.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "You define a strict Structured Outputs schema for an extraction task. Which TWO statements about the strict schema rules are correct?", "o": [{"t": "A regular expression can be enforced with the `pattern` keyword", "c": false, "e": "Keywords such as `pattern`, `minLength` and `maximum` are not supported, so validate them in code."}, {"t": "Output order is random and cannot follow the schema", "c": false, "e": "Output follows the order of the schema."}, {"t": "The root object can be an `anyOf`", "c": false, "e": "The root cannot be `anyOf`."}, {"t": "Every property must be listed in `required`, and an optional field is expressed by allowing `null` in its type", "c": true, "e": "In strict mode all fields are required, and optional fields use a union with null."}, {"t": "Every object needs `additionalProperties: false`", "c": true, "e": "This is a mandatory rule for strict schemas."}], "concept": "Asking for JSON in a prompt can still produce extra prose, a missing field or a wrong type. JSON mode only guarantees valid JSON, not your schema. Structured Outputs with `strict: true` makes the model follow the JSON Schema you provide.\n\nTo do that, the schema must stay inside a supported subset. All fields must be listed as required. To make a field optional you allow null in its type, for example `[\"string\", \"null\"]`. Every object needs `additionalProperties: false`. There are limits of 100 properties and 5 levels of nesting, and the root cannot be `anyOf`. Many validation keywords (`pattern`, `minLength`, `maxLength`, `minimum`, `maximum`, `format`, `minItems` and others) are not supported, so check them in your own code. The output follows the order of the schema.\n\nStrict output guarantees shape, not truth: the values can still be wrong.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/structured-outputs"], "ref": ["rag-retrieval-and-grounding", "foundry-sdk-and-generative-apps"]}, {"d": 2, "q": "You add a Groundedness control to a guardrail that is assigned to both a model deployment and an agent. The control works for the model but never blocks anything for the agent. Why?", "o": [{"t": "The agent's temperature is too low", "c": false, "e": "Temperature does not affect a guardrail."}, {"t": "Guardrails need a separate Azure Policy to run", "c": false, "e": "Guardrails are assigned directly."}, {"t": "Groundedness is not yet supported for agents; a control with an unsupported risk silently does not take effect for the agent", "c": true, "e": "Groundedness applies to models only, while the same guardrail still works for models."}, {"t": "The agent uses a Provisioned deployment", "c": false, "e": "Deployment type does not matter."}], "concept": "A guardrail is a list of controls. Not every risk is supported on every target. Groundedness checks whether an answer is supported by the context, and it is not yet supported for agents. When you add a control with an unsupported risk to an agent's guardrail, there is no error: it silently does not take effect for the agent. It works for the model deployment because the model supports it.\n\nThis is a common trap: you see a control in the guardrail and assume protection exists. Always check the supported risks for the target in the documentation, and test with real examples to confirm blocking happens.\n\nTemperature of the agent does not influence this, Provisioned deployment type is irrelevant, and guardrails do not need Azure Policy to run.\n\nFor agents, you can still measure groundedness with the evaluators in your evaluation pipeline, which is a different tool.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A developer copies a sample that calls `project.agents.create_version(...)` but the installed package raises \"attribute not found\". `pip list` shows `azure-ai-projects==1.0.0`. What is the most likely cause?", "o": [{"t": "The package is the 1.x release for Foundry classic, while the sample targets the new Foundry which needs 2.x", "c": true, "e": "Versions 1.x and 2.x target different experiences, and mixing them causes missing methods."}, {"t": "The agent name contains a hyphen", "c": false, "e": "Names are not the reason a method is missing from the client."}, {"t": "The model deployment is Global Standard", "c": false, "e": "Deployment type does not affect which methods exist in the SDK."}, {"t": "The project endpoint must be replaced by a connection string", "c": false, "e": "Current SDKs no longer accept connection strings; project endpoints are used."}], "concept": "The Foundry SDK for Python is `azure-ai-projects`. Its major version marks which Foundry experience it targets: 1.x is Foundry classic and 2.x is the new Foundry. The new version needs Python 3.10 or later. The OpenAI package is installed together with it.\n\nWhen you follow a sample written for 2.x with a 1.x package, methods and classes that the sample expects simply do not exist. The symptom is \"method not found\" or a missing import, not an authentication error.\n\nThe related change you should know: hub-based projects used a connection string, while Foundry projects use a project endpoint of the form `https://<resource>.services.ai.azure.com/api/projects/<project>`. Current SDKs do not accept connection strings.\n\nFirst check: `pip show azure-ai-projects` and compare with the sample's requirement.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/sdk-overview"], "ref": ["foundry-sdk-and-generative-apps"]}, {"d": 2, "q": "The semantic configuration of an index lists the fields `title`, `keywords` and `content`. Long documents produce poor reranking because the useful text is at the end of a long field. Which statement about the semantic ranker input is correct?", "o": [{"t": "The ranker needs vectors in every field", "c": false, "e": "It does not require vector fields."}, {"t": "Field order never matters", "c": false, "e": "Field order matters because of trimming."}, {"t": "A summary string of up to 2,048 tokens is built from the configured fields (title up to 128, keywords up to 128, then content), so field order matters and the most informative fields should come first", "c": true, "e": "Long text is trimmed, and the ranker works best on prose."}, {"t": "The ranker reads the full text of every document, however long", "c": false, "e": "Input is limited to 2,048 tokens."}], "concept": "The semantic ranker does not read whole documents. It builds a summary string from the fields listed in the semantic configuration and sends that to the language-understanding model. The summary is limited to 2,048 tokens: roughly up to 128 tokens from the title, up to 128 from keywords, and the rest from the content field (and other fields in the order given).\n\nBecause of this budget, the order of fields matters. Put the most informative fields first. In a long `content` field the useful text at the end may be truncated and never seen by the ranker. Fix by improving the source of text: chunk long documents into smaller documents or sections so each chunk fits the budget, and place a short summary in an early field.\n\nThe ranker does not read the full text of every document, field order does matter, and it does not need vectors in the fields.\n\nMemory aid: the ranker reads the front page and the headline, not the whole newspaper.", "src": ["https://learn.microsoft.com/en-us/azure/search/semantic-search-overview"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A hybrid query merges keyword and vector rankings with Reciprocal Rank Fusion, `score = sum of 1/(rank + k)` with k = 60. Document X ranks 1st in the keyword list and 10th in the vector list. Document Y ranks 4th in the keyword list and 2nd in the vector list. Which statement is correct?", "o": [{"t": "X scores about 0.0318 and Y about 0.0307", "c": false, "e": "The scores are swapped."}, {"t": "Y is ranked above X: Y scores about 0.0318 and X about 0.0307", "c": true, "e": "1/64 + 1/62 = 0.0318; 1/61 + 1/70 = 0.0307."}, {"t": "X is ranked above Y because it is first in the keyword list", "c": false, "e": "RRF rewards documents that rank well in several lists."}, {"t": "They tie at 0.0312", "c": false, "e": "The scores are different."}], "concept": "BM25 scores and vector similarity scores are on different scales, so hybrid search cannot add them. Reciprocal Rank Fusion ignores raw scores and uses only the rank in each list: score(document) = sum over each list of 1 / (rank + k), with k = 60.\n\nCompute for X: keyword rank 1 gives 1/61 = 0.016393; vector rank 10 gives 1/70 = 0.014286; total 0.030679. For Y: keyword rank 4 gives 1/64 = 0.015625; vector rank 2 gives 1/62 = 0.016129; total 0.031754. Y wins by a small margin because it is high in both lists, while X is excellent in one and mediocre in the other.\n\nA document found by only one method scores about half as much. The k = 60 here is not the k of \"k nearest neighbors\" in a vector query. Hybrid scores are small numbers that are meaningful only for ordering.\n\nDo not add `orderby`, since it overrides relevance.", "src": ["https://learn.microsoft.com/en-us/azure/search/hybrid-search-ranking", "https://learn.microsoft.com/en-us/azure/search/hybrid-search-overview"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A team wants a model to answer questions about current inventory. Instead of relying on the model's memory, the prompt technique allows the model to stop and request a search, then continues with the results. Which prompt technique and Foundry feature implement this?", "o": [{"t": "Few-shot examples only, because they store inventory permanently", "c": false, "e": "Examples condition the model for one call and do not store data."}, {"t": "A longer temperature schedule", "c": false, "e": "Temperature does not supply facts."}, {"t": "Prime the output with a cue such as \"Key Points:\"", "c": false, "e": "A cue steers form, not the source of facts."}, {"t": "Affordances (tools): in Foundry, tools and function calling let the model request a search that your system or the service runs", "c": true, "e": "The model asks for a tool, receives the result and answers."}], "concept": "Models do not know your live data. One of the prompt techniques is to use affordances, meaning tools the model can use. The simple form is a text protocol: the model emits something like `SEARCH(\"query\")`, the program stops, runs the search, pastes the results back and asks for the answer. In Foundry the same idea is implemented properly with tools and function calling: the model returns a `function_call` with a name and arguments, your application (or the service, for hosted tools) executes it, and the result goes back.\n\nCompare with other techniques. A cue primes the beginning of the answer. Few-shot examples teach format and conditioning for the current call only. Grounding context supplies data in the prompt, which is the basis of RAG. Break the task down splits a hard task into steps.\n\nFor live data, tools or retrieval are the right choice, and the answer should cite its sources.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering", "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling"], "ref": ["prompt-engineering-parameters-and-reflection", "building-agents-with-foundry"]}, {"d": 2, "q": "A function tool call returns `arguments` that fail JSON parsing in the application, or contain values of the wrong type. Which TWO actions follow the troubleshooting guidance?", "o": [{"t": "Fix the parameter types and mark fields as required in the schema, and use `strict: true`", "c": true, "e": "A precise schema with required fields and strict mode reduces malformed arguments."}, {"t": "Handle parse errors in the application and treat arguments as untrusted input", "c": true, "e": "The app must be defensive, because the arguments are produced by a model."}, {"t": "Remove the schema so that the model has more freedom", "c": false, "e": "The schema is what guides the arguments."}, {"t": "Switch to a model without tool support", "c": false, "e": "The model would not call tools at all."}, {"t": "Ignore errors and pass the raw string to the function", "c": false, "e": "This invites failures and security problems."}], "concept": "In function calling, the model returns a `function_call` item with a name, `arguments` as a JSON string and a `call_id`. Your application parses the string, runs the function, and sends back a `function_call_output` with the same `call_id`.\n\nLearn's troubleshooting table for argument problems: arguments not valid JSON means a schema mismatch, so fix types and `required` fields and handle parse errors; required fields missing means the schema does not enforce them, so add `required` and use `strict: true`; wrong parameters mean an ambiguous description, so clarify with examples.\n\nThe schema should also set `additionalProperties: False`. Every parameter should have a clear description with an example such as \"Order number, e.g. 4711\".\n\nBecause the model creates the arguments, the application must validate them before use.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "An evaluation dataset contains full multi-turn conversations in a `messages` array. The team wants one score for the whole interaction rather than a score per assistant reply. Which setting does this?", "o": [{"t": "Set the evaluation level to conversation (`evaluation_level`), instead of turn-level", "c": true, "e": "Turn-level scores one response; conversation-level scores the whole interaction."}, {"t": "Use the deprecated Quality Grader", "c": false, "e": "It is deprecated."}, {"t": "Remove the tool messages from the array", "c": false, "e": "Tool messages are part of the conversation."}, {"t": "Convert each conversation into a single query string", "c": false, "e": "This loses the structure of the interaction."}], "concept": "Evaluation datasets have two shapes. Rows can contain `query` and `response` (and optionally `tool_definitions`), or a full `messages` array with the roles `system`, `user`, `assistant` and `tool`, including tool calls and results.\n\nThe evaluation level decides what is scored. Turn-level scores one response. Conversation-level scores the whole interaction, using the `evaluation_level` setting. Choose conversation-level when success depends on the whole interaction (the problem was solved, the user was not frustrated); choose turn-level when you want to locate a weak reply.\n\nEvaluators return Pass or Fail, or a score from 1 to 5 converted by a threshold (default 3). Most are AI-assisted and use a judge deployment (`deployment_name`).\n\nFor voice agents, evaluation currently supports full-conversation runs only. Quality Grader is deprecated.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/agent-evaluators"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 2, "q": "A team wants a guardrail control for an agent that only flags problematic content (annotate) without blocking, to tune false positives. What does the documentation say about the available actions?", "o": [{"t": "Both models and agents support only a third action called quarantine", "c": false, "e": "No such action is documented."}, {"t": "Agents support annotate-only, while models support only block", "c": false, "e": "This reverses the support."}, {"t": "Actions cannot be changed after a guardrail is created", "c": false, "e": "Actions are part of each control."}, {"t": "Annotate (flag without blocking) is for models; agents currently support annotate and block", "c": true, "e": "The annotate-only action is not available for agents."}], "concept": "A control chooses an action when its risk is detected. Annotate adds a flag to the response without blocking; it is available for models. Annotate and block stops the content; agents currently support annotate and block.\n\nAnnotations carry `detected` and `filtered` flags. `detected: true, filtered: false` means the content was seen but allowed, which is what annotate-only mode produces. This is useful on a model deployment to tune false positives before turning blocking on.\n\nFor agents, tuning needs another approach: test on a model deployment with the same guardrail first, use evaluation datasets with realistic prompts, and then apply annotate and block on the agent.\n\nBehavior of the block action: a tool call control with annotate and block means the tool call is not executed and the agent stops until there is another user input; a tool response control stops the agent immediately and does not save the content to memory.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview", "https://learn.microsoft.com/en-us/azure/foundry/guardrails/intervention-points"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A RAG evaluation shows high Groundedness (answers stay inside the context) but low Response Completeness (expected facts are missing). What should you do?", "o": [{"t": "Replace the evaluator with Relevance", "c": false, "e": "Relevance can pass an incomplete answer and would hide the gap."}, {"t": "Lower the temperature to zero", "c": false, "e": "The answers already follow the context. Temperature does not add missing facts."}, {"t": "Improve recall: raise `top_k`, tune chunking or use larger chunks so the needed facts reach the prompt", "c": true, "e": "The answer is faithful but partial, so the missing facts were not retrieved or not selected."}, {"t": "Add a rule \"say you don't know\"", "c": false, "e": "This reduces invention, which is already low here."}], "concept": "Two RAG metrics describe opposite errors, and you fix them in opposite directions.\n\nGroundedness is a precision-like measure: does the answer contain only claims supported by the context? High groundedness means no invention. Response Completeness is a recall-like measure: does the answer contain all the expected facts? Low completeness means information is missing.\n\nHigh groundedness with low completeness says: the model is faithful, but it did not receive (or did not use) the needed facts. So the problem is on the retrieval side. Raise `top_k` so more passages are passed, tune chunking so facts are not split apart, or use larger chunks, and check whether the search finds the right documents in the first place.\n\nLowering temperature or adding \"say you don't know\" reduces invention, which is already low. Replacing the evaluator does not change the system.\n\nMemory aid: groundedness = \"no extra\", completeness = \"nothing missing\".", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A product search must find items when users type exact SKU codes such as `SKU-48213-B` and also when they describe the product in natural language. Which retrieval approach should you use in Azure AI Search?", "o": [{"t": "Exhaustive KNN with no text query", "c": false, "e": "Exhaustive KNN is an exact vector scan. It still has no keyword matching for codes."}, {"t": "Vector search only", "c": false, "e": "Embeddings treat `SKU-48213-B` and `SKU-48231-B` as almost identical, so exact codes are matched poorly."}, {"t": "Hybrid search (keyword plus vector) with the semantic ranker", "c": true, "e": "Keyword matching finds exact codes, vectors find paraphrases, Reciprocal Rank Fusion merges the lists, and the semantic ranker reorders the top results by meaning."}, {"t": "Keyword search only", "c": false, "e": "BM25 cannot see that \"canine\" and \"dog\" are related, so natural-language descriptions are missed."}], "concept": "Search engines use two different ways of matching, and each has a blind spot.\n\nKeyword (full-text, BM25) search matches the actual words. It is excellent for exact strings such as a SKU `SKU-48213-B`, but it misses synonyms and paraphrases. Vector search turns text into embeddings (lists of numbers that represent meaning) and finds items that are close in meaning. It is excellent for natural language, but similar-looking codes get nearly the same vector, so exact codes can be mixed up.\n\nHybrid search runs both queries in parallel and merges the two ranked lists with Reciprocal Rank Fusion (RRF). Then the semantic ranker can re-rank the top results with a language-understanding model for a better final order. This combination covers both user behaviors in the question.\n\nVector only fails the code queries, keyword only fails the descriptions, and exhaustive KNN with no text query is just a precise vector search, with the same weakness.", "src": ["https://learn.microsoft.com/en-us/azure/search/semantic-search-overview"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A search request uses query rewrite (Preview) with the semantic ranker. What does the feature do, and what should the team remember about its status?", "o": [{"t": "It translates the index into another language", "c": false, "e": "This is not its purpose."}, {"t": "It is generally available and billed per document", "c": false, "e": "It is Preview."}, {"t": "It can expand one query into up to 10 variants to improve recall, and it is Preview", "c": true, "e": "The feature broadens the query set and should be marked as Preview."}, {"t": "It rewrites the documents in the index permanently", "c": false, "e": "It changes the query, not the documents."}], "concept": "Retrieval quality often depends on how the question is phrased. Users type short or vague queries, or use different words from the documents. Query rewrite (Preview) in semantic search can expand one query into up to 10 variants, which broadens what the engine looks for.\n\nA related, more powerful idea is agentic retrieval, where an LLM splits a complex question into focused subqueries, runs them in parallel against knowledge sources and semantically reranks each. At low or medium reasoning effort the LLM does query planning; at minimal it is skipped. The GA REST version `2026-04-01` covers minimal, extractive retrieval, while `2026-08-01-preview` adds LLM planning, answer synthesis and multi-turn messages.\n\nFor production, prefer GA features and mark preview ones. Measure the effect with labeled queries and Document Retrieval metrics, because more variants can add cost and noise.\n\nChoose classic hybrid search for simple lookups and agentic retrieval for multi-part questions.", "src": ["https://learn.microsoft.com/en-us/azure/search/semantic-search-overview", "https://learn.microsoft.com/en-us/azure/search/agentic-retrieval-overview"], "ref": ["rag-retrieval-and-grounding", "azure-ai-search-configuration"]}, {"d": 2, "q": "A team wants hosted agents and multi-agent systems written in code (Python or .NET) that run in Foundry as hosted agents. Which SDK or framework should they use?", "o": [{"t": "OpenAI SDK for images", "c": false, "e": "It is for image calls."}, {"t": "Speech SDK", "c": false, "e": "It is for speech scenarios."}, {"t": "Foundry Tools SDK for Content Safety", "c": false, "e": "It is for content safety calls."}, {"t": "Microsoft Agent Framework", "c": true, "e": "It provides agents, graph-based workflows, middleware, tools and MCP clients, and its workflows can run in Foundry as a hosted agent."}], "concept": "Microsoft Agent Framework is the open-source SDK for building agents and multi-agent systems in code, in Python and .NET. It provides agents, tools, workflows with checkpoints, and orchestration patterns such as sequential, concurrent, handoff and Magentic. Agents built with it can run in Foundry as hosted agents, so Foundry provides the runtime and you provide the code.\n\nThe Speech SDK is for speech recognition and synthesis. The Foundry Tools SDK for Content Safety checks content. The OpenAI SDK for images generates images. None of them orchestrates agents.\n\nA useful comparison: a prompt agent needs no code (model, instructions, tools); a hosted agent runs your code; Agent Framework is a way to write that code.\n\nChoose code-first orchestration when you need control that configuration cannot express, such as custom steps, parallel work, approvals and checkpoints.", "src": ["https://learn.microsoft.com/en-us/agent-framework/overview/agent-framework-overview"], "ref": ["foundry-sdk-and-generative-apps", "building-agents-with-foundry"]}, {"d": 2, "q": "Which TWO statements about few-shot examples are correct?", "o": [{"t": "They guarantee factual correctness of the output", "c": false, "e": "They improve format and consistency, not truth."}, {"t": "They permanently fine-tune the deployment", "c": false, "e": "Fine-tuning is a separate training process."}, {"t": "The order of examples can matter, and examples should show edge cases", "c": true, "e": "Examples shape the pattern the model continues, so their choice and order affect the result."}, {"t": "They are required for reasoning models", "c": false, "e": "Classic techniques such as these are not recommended for reasoning models."}, {"t": "They condition the model for the current call only and nothing is learned permanently", "c": true, "e": "Examples are part of the prompt, so they do not change the model."}], "concept": "Few-shot prompting adds a few examples of input and output to the prompt, so the model imitates the pattern. It is also called in-context learning.\n\nThe examples condition the model for the current call only. Nothing is stored, nothing is learned permanently, and the deployment is unchanged. That is the difference from fine-tuning, which changes the model's weights through training.\n\nPractical points: the order of examples can influence the answer (the last examples often have more weight), and examples should include edge cases, not only easy ones, so the model sees the boundaries. Examples improve format and style but do not guarantee facts; a model can copy the format and still be wrong.\n\nReasoning models usually work well with short, goal-oriented prompts, and heavy few-shot prompting is not required for them.\n\nMemory aid: few-shot is showing a new employee three sample cases before the shift. Fine-tuning is sending them to training school.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering"], "ref": ["prompt-engineering-parameters-and-reflection"]}, {"d": 2, "q": "A long prompt contains instructions, a lengthy retrieved context and a user question, and the model sometimes ignores the rule at the top. Which two prompt-design practices help?", "o": [{"t": "Use random capitalization to draw attention", "c": false, "e": "It does not provide structure."}, {"t": "Put the rule only in the middle of the context", "c": false, "e": "This is the least visible position."}, {"t": "Remove all separators to save tokens", "c": false, "e": "Separators clarify structure and can serve as stop conditions."}, {"t": "Use clear separators or labeled sections (Markdown or XML), and repeat the key instruction at the end of the prompt", "c": true, "e": "Models show recency bias, and clear syntax separates instructions from data."}], "concept": "A long prompt has several parts, and models do not weigh every part equally. Text in the middle of a long context can be overlooked, and rules at the very top can fade.\n\nTwo practices help. Use clear separators: label sections with Markdown headings or XML-like tags such as `<instructions>`, `<context>` and `<question>`, so the model can tell instructions from data. And repeat the key instruction at the end of the prompt, close to where the answer starts, because models pay extra attention to recent text.\n\nPutting the rule only in the middle of the context hides it among the data. Removing separators saves a few tokens but mixes instructions and data, which also raises injection risk. Random capitalization is not a technique.\n\nStructure also helps security: marking retrieved content as data makes it easier to tell the model not to follow instructions inside it.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering"], "ref": ["prompt-engineering-parameters-and-reflection"]}, {"d": 2, "q": "A prompt includes the current date, the user's stated preferences and a list of favorite topics. These help the model personalize its answer but are not themselves the text to be transformed. According to Learn's five components of a prompt, what are they called?", "o": [{"t": "Cue", "c": false, "e": "The start of the answer that steers
