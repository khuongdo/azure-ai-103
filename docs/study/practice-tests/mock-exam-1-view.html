oring it together with the original keeps the SSN. Confidence scores or language codes contain no useful transcript.\n\nPipeline order matters: detect and redact first, then summarize, analyze and store. Everything downstream is then safer to keep and share.\n\nCheck quality with a labeled sample: recall for PII matters most, because a missed number is worse than an over-redaction.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A team starts a new project that needs sentiment analysis and document summarization. A colleague proposes the Azure Language sentiment and summarization features. What should you advise?", "o": [{"t": "Use Custom Translator for sentiment", "c": false, "e": "Custom Translator trains translation systems, not sentiment."}, {"t": "Wait until 2029 and then migrate", "c": false, "e": "Starting on a feature that is already scheduled to retire creates avoidable rework."}, {"t": "Use a Foundry model with a clear prompt and structured output, because these Language features retire on March 31, 2029 and new projects are directed to Foundry models", "c": true, "e": "The features still work until the date, but Learn directs new work to Foundry models."}, {"t": "Use the Language features, because they are the only supported option", "c": false, "e": "Microsoft's direction for new projects is Foundry models."}], "concept": "Microsoft Learn states that several older Azure Language features, for example sentiment analysis and summarization, retire on March 31, 2029, and directs new projects to Foundry models.\n\nA Foundry model (an LLM) handles these tasks with a prompt. For stable results, define the task and labels in the prompt, ask for structured output with a fixed JSON schema (for example `sentiment` as an enum and a short `summary`), set a low temperature, and evaluate against a labeled sample. This also gives you flexibility: new categories, languages and custom rules are a prompt change.\n\nStarting a new project on a feature with a known retirement date creates migration work later, so waiting until 2029 is not a plan. Custom Translator is for machine translation, not sentiment.\n\nExisting apps keep working until the retirement date, but new work should use the recommended path.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A smart-home assistant receives the utterance \"Turn off the living room lights\". You need to extract the intent `TurnOff` and the entity `Room = living room`. Which Azure Language capability is designed for this?", "o": [{"t": "Key phrase extraction", "c": false, "e": "It returns main concepts but not intents or typed entities."}, {"t": "Language detection", "c": false, "e": "It identifies the language of the text only."}, {"t": "Conversational language understanding (CLU)", "c": true, "e": "CLU predicts the intent of an utterance and extracts entities. It does not execute the action."}, {"t": "Custom question answering", "c": false, "e": "It answers questions from a knowledge base of FAQs and documents."}], "concept": "Conversational language understanding (CLU) turns a short user message into something a program can act on. It predicts an intent (what the user wants) and extracts entities (the details).\n\nFor \"Turn off the living room lights\" the intent is `TurnOff` and the entity is `Room = living room`. You define intents and entities, label example utterances, train a model, deploy it and call the prediction API. The result returns the top intent with confidence and the list of entities. Your code then maps the intent to an action, for example calling the lights service for the living room.\n\nCustom question answering matches a question to a stored answer in a knowledge base (an FAQ). Key phrase extraction lists the important phrases of a text. Language detection returns the language code. None of them returns an intent with entities.\n\nMemory aid: intent is the verb of the sentence (\"turn off\"); entities are the nouns and details (\"living room lights\").", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A contact center must transcribe thousands of stereo call recordings stored in Blob Storage and label which speaker said what. Results can arrive later. Which approach should you use?", "o": [{"t": "Text to speech with a custom voice", "c": false, "e": "Text to speech creates audio from text."}, {"t": "Batch transcription with diarization enabled on mono audio", "c": true, "e": "Batch transcription is asynchronous and built for many or long files. Diarization needs mono audio, so convert the stereo files first."}, {"t": "Fast transcription, one synchronous call per file", "c": false, "e": "Fast transcription returns results immediately for a single file. For thousands of archived files where results can arrive later, asynchronous batch transcription is the better fit."}, {"t": "Real-time speech recognition with the Speech SDK", "c": false, "e": "Real-time recognition is meant for live audio and commands, not for archives."}], "concept": "Speech to text has three common modes.\n\nReal-time recognition processes a live audio stream and returns text as it arrives. Fast transcription is a synchronous API that returns the transcript of one file quickly, without the batch queue. Batch transcription is asynchronous: you submit many files (for example a Blob container), the service processes them in the background, and results are written to storage. When the results can arrive later and the volume is large, batch is the right choice.\n\nDiarization labels who spoke. It works on mono audio: the service separates speakers (two speakers with `diarizationEnabled`, three or more with min and max speaker counts). If the recording is stereo with each speaker on a separate channel, you can instead transcribe the channels separately, since the channel already identifies the speaker.\n\nText to speech goes in the opposite direction, from text to audio.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/batch-transcription-create"], "ref": ["speech-solutions"]}, {"d": 4, "q": "Product names in your recordings are often misheard by the base speech model. You also use batch transcription for the work. What is the recommended approach?", "o": [{"t": "Measure the word error rate (WER) of the base model on real audio; if it is high, train a custom speech model. Batch transcription does not need a deployed custom endpoint", "c": true, "e": "Custom speech improves recognition for domain vocabulary. WER tells you whether training is worthwhile, and batch transcription can use the custom model without a hosted endpoint."}, {"t": "Always deploy a custom endpoint, because batch transcription requires one", "c": false, "e": "Batch transcription is the exception that does not need a deployed endpoint."}, {"t": "Use speech translation with two target languages", "c": false, "e": "Translation does not fix misheard words."}, {"t": "Switch to text to speech with SSML phonemes", "c": false, "e": "SSML is for speech synthesis, not recognition."}], "concept": "Custom speech lets you adapt recognition to your vocabulary, accents and noise by training on your own audio and text. It costs training time and, for real-time use, a hosted endpoint.\n\nA good process is measure first. Word error rate (WER) is the share of words that are wrong (substitutions, deletions, insertions) compared with a human reference transcript. Compute WER of the base model on real recordings. If it is low, you are done; if product names push it high, a lightweight step such as a phrase list may fix it, and if not, train a custom model.\n\nBatch transcription can use a custom model without a deployed endpoint, so you do not pay for hosting just to process files. A real-time application, by contrast, needs a deployed endpoint.\n\nText to speech with SSML phonemes controls pronunciation of output, not recognition. Speech translation changes language and does not repair misheard names.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/custom-speech-overview"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A developer calls the latest GA version of the Translator text translation API (`2026-06-06`) and wants to use an LLM deployment instead of standard neural machine translation. Which statement is correct?", "o": [{"t": "LLM translation allows 1,000 array elements per request", "c": false, "e": "That limit is for NMT. LLM translation allows 50 elements."}, {"t": "The request body uses an `inputs` array, the response returns a `value` array, and LLM translation needs a Foundry resource", "c": true, "e": "These are the changes in `2026-06-06` compared with v3.0."}, {"t": "The request body is a plain top-level array as in v3.0, and any Translator resource works for LLM translation", "c": false, "e": "The new version uses `inputs` and `value`, and LLM translation requires a Foundry resource."}, {"t": "LLM translation is available only through Custom Translator", "c": false, "e": "Custom Translator trains NMT systems. LLM translation is a model choice in the translate call."}], "concept": "Azure Translator has a REST text translation API. The latest GA version, `2026-06-06`, changed the shape of the messages compared with v3.0: the request uses an `inputs` array and the response returns a `value` array. v3.0 still exists and keeps its older shape.\n\nThe new version also lets you choose the translation model: standard neural machine translation (NMT) or a supported LLM deployment. LLM translation needs a Foundry resource, and it supports extras such as tone (formal, informal, neutral) and gender controls. The limits differ too: NMT allows up to 1,000 array elements per request, LLM only 50.\n\nBilling differs as well: NMT is billed per source character, LLM per input and output token. A sensible design keeps high-volume baseline traffic on NMT and sends to an LLM only where tone or context matters.\n\nCustom Translator trains custom NMT models; it is a separate feature and not the only door to LLM translation.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/overview"], "ref": ["translation"]}, {"d": 4, "q": "A voice assistant reads order confirmations aloud with Azure AI Speech. You must slow down only the phrase \"ships tomorrow\" and add a short pause after it. What should you use?", "o": [{"t": "SSML with a `prosody` element for the rate and a `break` element for the pause", "c": true, "e": "SSML is XML that controls synthesis. `prosody` changes rate, pitch and volume, and `break` inserts pauses."}, {"t": "Batch transcription with diarization", "c": false, "e": "This converts audio to text and has no effect on synthesis."}, {"t": "A custom speech model trained on order data", "c": false, "e": "Custom speech improves recognition (speech to text), not how text is spoken."}, {"t": "A lower `temperature` value on the synthesis request", "c": false, "e": "Temperature is a model sampling parameter and does not control speaking rate."}], "concept": "SSML (Speech Synthesis Markup Language) is an XML format that controls how text to speech sounds: voice, speed, pitch, pauses and pronunciation. You send SSML instead of plain text.\n\nTo change only a phrase you wrap it in a `<prosody>` element with a `rate` attribute (for example slower), and add a `<break time=\"500ms\"/>` element where you want a pause. Everything outside the element keeps the default delivery.\n\nWhy the others fail: a custom speech model is for recognition (speech to text), not for how output sounds; batch transcription with diarization turns audio into text; and `temperature` belongs to language models, not to speech synthesis.\n\nExample:\n```xml\n<speak version=\"1.0\" xml:lang=\"en-US\"><voice name=\"...\">Your order <prosody rate=\"-20%\">ships tomorrow<\/prosody><break time=\"400ms\"/>.<\/voice><\/speak>\n```\nMemory aid: SSML is stage directions for the voice actor.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/text-to-speech"], "ref": ["speech-solutions"]}, {"d": 5, "q": "Legal staff delete `contract-17.pdf` from a blob container, but Azure AI Search still returns the document. The indexer runs every 10 minutes. Why, and what is the fix?", "o": [{"t": "The indexer schedule is too slow. Run it every minute", "c": false, "e": "A faster schedule does not detect deletions."}, {"t": "Enable a high water mark change detection policy", "c": false, "e": "That policy is for databases such as Azure SQL, not for blobs."}, {"t": "Enable the enrichment cache", "c": false, "e": "The cache saves skill costs and does not remove documents."}, {"t": "Blob indexers do not detect deletions. Use a soft-delete detection policy (for example a custom `IsDeleted` metadata value), run the indexer, then delete the blob", "c": true, "e": "Changed blobs are detected by their timestamp, but deleted blobs leave orphan documents unless a deletion detection policy is configured before the first run."}], "concept": "An Azure AI Search indexer is a crawler that reads a data source and updates an index. It is good at finding new and changed items, but it does not notice that something disappeared. If a blob is deleted, nothing tells the indexer, so the search document remains.\n\nChange detection and deletion detection are different policies. High water mark detects changed rows in a database by a column that only increases. For blobs, the way to remove documents is a soft-delete detection policy: add a metadata property such as `IsDeleted`, define the policy with that column name and the marker value, set the property to true on the blob first, run the indexer so it removes the search document, and only then delete the blob.\n\nRunning the indexer more often still never sees a missing blob, and the enrichment cache only saves skill work.\n\nMemory aid: the indexer reads the guest list, so you must cross a name out before you remove the guest.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-indexer-overview"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "An indexer must process scanned PDFs and MP3 recordings. Compliance requires that all processing stays inside the indexer pipeline. Which skillset design fits?", "o": [{"t": "Text Split skill only", "c": false, "e": "It chunks existing text. It cannot read images or audio."}, {"t": "Transcribe the audio outside the pipeline and load only the text", "c": false, "e": "This breaks the requirement that all processing stays in the indexer."}, {"t": "The built-in Translation skill for the MP3 files", "c": false, "e": "The Translation skill takes text, not audio."}, {"t": "The OCR skill for scanned pages with `imageAction` set to `generateNormalizedImages`, and a custom Web API skill that calls Azure Speech for the audio", "c": true, "e": "OCR reads scanned images, and no built-in skill turns audio into text, so a custom skill wraps the speech call."}], "concept": "A skillset is a pipeline of enrichment steps that an indexer runs while it processes each document. The steps write their results into an in-memory enrichment tree.\n\nFor scanned PDFs, the OCR skill reads text from images. The indexer must generate page images, which you control with `imageAction: generateNormalizedImages`. For audio, there is no built-in skill that turns MP3 into text. To keep everything inside the indexer, add a custom Web API skill: it sends the audio reference to an endpoint (for example a function that calls Azure Speech) and returns the transcript, which you map to a node and then to an index field.\n\nThe Translation skill takes text, not audio. Transcribing outside the pipeline breaks the compliance rule. A Text Split skill only chunks text that already exists.\n\nHow it relates: built-in skills for what Microsoft provides, custom Web API skills for the rest, all inside one repeatable pipeline.", "src": ["https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-ocr", "https://learn.microsoft.com/en-us/azure/search/cognitive-search-custom-skill-web-api"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "You created an index with a field `contentVector` of type `Collection(Edm.Single)`. Documents are rejected and vector queries fail. The vector search section defines an HNSW algorithm and a profile. Which two settings on the field should you check first?", "o": [{"t": "`facetable` and `filterable`", "c": false, "e": "They control facets and filters, not vector search."}, {"t": "`retrievable` and `sortable`", "c": false, "e": "These control returning and sorting values and have no role in vector configuration."}, {"t": "`analyzer` and `synonymMaps`", "c": false, "e": "They apply to text fields, not vectors."}, {"t": "`vectorSearchProfile` referencing the profile, and `dimensions` equal to the embedding model's output size", "c": true, "e": "A vector field needs a profile on the field and the correct number of dimensions. A mismatch makes the indexer reject documents."}], "concept": "A vector field stores embeddings in an index. Two settings make it usable.\n\n`dimensions` must equal the exact output length of the embedding model, for example 1536 for text-embedding-ada-002 or the dimension you configured for text-embedding-3. If it does not match, documents are rejected. `vectorSearchProfile` links the field to a profile in the vector search section, which names the algorithm (HNSW for approximate search, or exhaustive KNN for exact search) and optionally a vectorizer that turns query text into vectors at query time.\n\nThe type `Collection(Edm.Single)` is correct for vectors, but the type alone is not enough: without a profile the field does not know how to be searched, and without matching dimensions the data does not fit.\n\n`retrievable`, `sortable`, `analyzer`, `synonymMaps`, `facetable` and `filterable` are text-field settings and do not define how vectors work.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-create-index"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "In a Content Understanding custom analyzer you define three fields: the invoice number exactly as printed, a category chosen from a fixed list, and a two-sentence summary. Which TWO method assignments are correct?", "o": [{"t": "Summary: `classify`", "c": false, "e": "Classification selects from a fixed list. A summary is free text."}, {"t": "Invoice number: `generate`", "c": false, "e": "Generation can reinterpret or invent values. Use `extract` for values that exist in the file."}, {"t": "Category from a fixed list: `classify` with an `enum`", "c": true, "e": "`classify` picks one of the allowed values."}, {"t": "Category: `extract`", "c": false, "e": "Extract copies a value from the content and does not choose among categories."}, {"t": "Invoice number: `extract`; summary: `generate`", "c": true, "e": "`extract` returns the value as it appears in the content and `generate` creates free text such as a summary."}], "concept": "A Content Understanding analyzer defines what to extract. Each field in its schema has a method, which tells the service how to get the value.\n\n`extract` copies a value as it appears in the content, with its source location and confidence. Use it for the invoice number printed on the page. `classify` chooses one value from a fixed list that you define with an `enum`. Use it for a category. `generate` writes new text from the content, such as a short summary or description.\n\nSo the correct pairs are: invoice number is `extract`, category is `classify` with an enum, summary is `generate`. Using `generate` for the invoice number risks the model rewriting or hallucinating it; using `extract` for a category cannot work because the category is not written in the document; `classify` cannot produce free text.\n\nMemory aid: extract = copy, classify = pick from a menu, generate = write.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "You create a Content Understanding analyzer and set `models.completion` to the name of your deployment `chat-prod`. Analysis fails. What is the problem?", "o": [{"t": "Analyzers cannot use LLM deployments", "c": false, "e": "Content Understanding uses model deployments for generation and embedding."}, {"t": "The analyzer id contains upper-case letters", "c": false, "e": "Naming style is not the cause described here."}, {"t": "The analyzer must use the Document Intelligence Read model", "c": false, "e": "This is a different service and is not required."}, {"t": "The `models` property takes model names from the catalog, which the service maps to deployments connected at resource level; it does not take deployment names", "c": true, "e": "Analyzer definitions reference model names, and the deployments are connected on the resource."}], "concept": "In a Content Understanding analyzer, the `models` property selects which language models the analyzer uses, for example a completion model and an embedding model.\n\nThe values are model names from the catalog (for example `gpt-4.1`), not the names of your deployments. At the resource level you connect the Content Understanding resource to your Foundry deployments once. The service then maps each model name to the deployment you connected. So `chat-prod` is a name that the service does not know as a model, and the analyzer definition is invalid.\n\nHow to debug: check the model names against the supported list, check the default deployments configured on the resource, check region and quota, then retry creation.\n\nThe other answers do not apply: analyzers can use LLM deployments, the Read model is unrelated, and upper-case letters in an analyzer ID are not the issue here.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "An accounts-payable team processes standard supplier invoices. They need deterministic, structured output for known fields with confidence scores, and they do not need summaries or reasoning. Which tool is the best fit?", "o": [{"t": "A video analyzer", "c": false, "e": "Video analyzers are for video content."}, {"t": "Azure AI Search skillset with Text Split", "c": false, "e": "Text Split chunks text. It does not extract invoice fields."}, {"t": "Document Intelligence prebuilt invoice model", "c": true, "e": "It is built for standard invoices and gives stable structured output with confidence."}, {"t": "Content Understanding agentic mode", "c": false, "e": "It is a preview mode for evidence-based answers, with more tokens and time, which is more than the task needs."}], "concept": "Document Intelligence and Content Understanding both extract data from documents, but they have different strengths.\n\nDocument Intelligence is a deterministic, specialized service. Prebuilt models (invoice, receipt, ID document and more) are trained for specific document types. For a standard supplier invoice it returns known fields (vendor, invoice number, dates, line items, totals) with a confidence score and location for each, in a predictable shape, at a predictable cost. No prompt is needed.\n\nContent Understanding is LLM-powered and multimodal: flexible schemas, summaries, reasoning across pages, video and audio. Agentic mode adds multi-step reasoning, which is more than a standard invoice needs. A video analyzer is for video. An AI Search skillset with Text Split prepares text for retrieval and does not extract invoice fields.\n\nRule of thumb: when the document type is known and the fields are fixed, use the narrowest tool, Document Intelligence prebuilt; use Content Understanding when content varies or you need generation and reasoning.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/document/overview"], "ref": ["content-understanding-and-document-intelligence"]}]};</script>
