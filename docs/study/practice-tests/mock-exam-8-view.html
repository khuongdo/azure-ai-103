: ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/text-to-speech"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A call-center application used a custom speech model through a deployed custom endpoint. Months later, the endpoint stops working although nobody changed it. Which fact from the custom speech guidance explains this?", "o": [{"t": "Models and endpoints are fixed until you change them but have a limited lifetime, so retrain or redeploy before expiry", "c": true, "e": "Custom models and endpoints expire under the model and endpoint lifecycle."}, {"t": "Endpoints stop when the word error rate drops below 5%", "c": false, "e": "WER does not stop endpoints."}, {"t": "Custom endpoints are billed per word and stop at a spending limit", "c": false, "e": "This is not the documented behavior."}, {"t": "Custom speech works only with batch transcription, which has no endpoint", "c": false, "e": "Custom models also work for real-time speech to text and speech translation."}], "concept": "Custom speech improves recognition for your vocabulary, accents and noise conditions. The workflow is: create a project, upload test data, train, inspect quality, measure with word error rate, and deploy to a custom endpoint. Batch transcription is an exception: it does not need a deployed endpoint, which saves hosting cost.\n\nModels and endpoints are stable once created, but have a limited lifetime. When a model reaches the end of its lifetime, the endpoint that uses it stops working. Check the model and endpoint lifecycle information, record expiry dates, and plan retraining and redeployment before then.\n\nA custom model works for real-time speech to text, speech translation and batch. When vocabularies differ strongly between areas of one domain, several custom models are recommended.\n\nPut expiry dates in your operations calendar and alert before they arrive.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/custom-speech-overview"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A custom conversational language understanding (CLU) model trained on labeled utterances confuses two similar intents in production. Which factor does the guidance describe as the main driver of accuracy for the custom path?", "o": [{"t": "The quality and coverage of the labeled utterances, so add and correct labels for the confusing intents", "c": true, "e": "Data labeling quality is the main driver of accuracy."}, {"t": "The resolution of the audio input", "c": false, "e": "CLU works with text utterances."}, {"t": "The number of replicas of the search service", "c": false, "e": "CLU does not use search replicas."}, {"t": "The length of the project name", "c": false, "e": "Names do not affect accuracy."}], "concept": "Conversational language understanding predicts the intent of an utterance and extracts entities. It does not perform actions. There are two paths. The LLM-powered quick deploy path: define the schema with intents and descriptions, deploy, and predict intents and prebuilt entities. The custom machine-learned path: define the schema, label utterances, train, view the evaluation, improve, deploy and predict.\n\nIn the custom path, the quality of the labeled data drives the result. If two intents (for example \"cancel order\" and \"return item\") overlap, add varied, correctly labeled examples for each, check the evaluation view for confusion, and retrain.\n\nFor an enterprise bot with a calendar skill (CLU) and an FAQ (custom question answering), an orchestration workflow routes the utterance to the right project.\n\nRetirement note: CLU retires from Azure Language on March 31, 2029, and new projects are directed to Foundry models.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A router uses Azure Language detection on very short chat messages such as \"ok\" or \"ja/yes\". It frequently returns low-confidence results. What is the correct handling?", "o": [{"t": "Increase the search service replicas", "c": false, "e": "Replicas are unrelated."}, {"t": "Treat low-confidence results as uncertain, for example by falling back to the user's profile language or asking, because mixed or very short text lowers confidence", "c": true, "e": "The confidence score is part of the output and should drive a rule."}, {"t": "Ignore the confidence score and always trust the first result", "c": false, "e": "Short text is exactly where the score matters."}, {"t": "Replace language detection with sentiment analysis", "c": false, "e": "Sentiment does not identify language."}], "concept": "Language detection returns, for each document, the language name, an ISO code (for example fr) and a confidence score. \"Bonjour tout le monde\" returns fr with confidence 1.0. Mixed-language or very short text lowers confidence.\n\nThe score exists so that your application can act on uncertainty. Typical rules: above a threshold, route automatically; below it, use another signal such as the browser or profile language, ask the user, or use a longer piece of context such as the last few messages.\n\nLanguage detection is one of the core Azure Language capabilities without a retirement notice, together with PII detection, named entity recognition and text analytics for health.\n\nDetect the language before routing, translating or choosing a model, and log the confidence so that you can tune thresholds.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 5, "q": "A custom Web API skill returns responses, but the indexer drops some records. Which TWO causes fit the documented behavior?", "o": [{"t": "The response was not JSON with a `values` array containing the same records", "c": true, "e": "The skill contract requires `application/json` with `values`."}, {"t": "The enrichment tree had too many nodes", "c": false, "e": "This is not named as a cause for dropped records."}, {"t": "The `batchSize` was set to the default of 1000", "c": false, "e": "The default is valid."}, {"t": "The endpoint returned a `recordId` that was not in the request, or the same `recordId` twice", "c": true, "e": "Records with unknown or duplicate IDs are dropped."}, {"t": "The skill used HTTPS instead of HTTP", "c": false, "e": "Only HTTPS is allowed."}], "concept": "A custom Web API skill lets the indexer call your code once per batch of documents. The indexer sends JSON with a `values` array; each item has a unique `recordId` and a `data` object whose fields are the inputs you declared. Your endpoint must reply with `application/json` and a `values` array of the same records, each with `recordId`, `data`, `errors` and `warnings` (both may be null).\n\nIf a returned record has an unknown or duplicate `recordId`, the indexer drops it. If the response is not shaped like this, the whole batch can fail.\n\nSettings to remember: only HTTPS; timeout default 30 seconds, minimum 1, maximum 230; `batchSize` default 1000; `degreeOfParallelism` default 5 (range 1 to 10). The indexer retries twice on 502, 503 and 429.\n\nCheck results with the indexer execution history and a debug session; treat inputs as untrusted data from documents.", "src": ["https://learn.microsoft.com/en-us/azure/search/cognitive-search-custom-skill-web-api"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A blob index uses one-to-many indexing, where one blob creates many search documents. The team configures a soft-delete deletion detection policy, but deleted blobs' child documents remain. What is the documented limitation and the workaround?", "o": [{"t": "The policy does not work for one-to-many indexing; delete those documents through the index API", "c": true, "e": "Deletion detection is not supported for this indexing pattern."}, {"t": "The policy works only on Mondays", "c": false, "e": "There is no such rule."}, {"t": "The high water mark policy handles it automatically", "c": false, "e": "That policy is for database change detection."}, {"t": "The policy needs a higher indexer schedule", "c": false, "e": "Schedule does not change the limitation."}], "concept": "Indexers detect new and changed blobs automatically by comparing the last-modified timestamp, but they do not detect deletions. A deleted blob leaves an orphan document in the index unless a deletion detection policy is set: native blob soft delete, or a custom metadata key such as `IsDeleted` with a `SoftDeleteColumnDeletionDetectionPolicy`. Set the policy before the first indexer run.\n\nOne limit matters in this scenario: the policy does not work for one-to-many indexing. When one blob produces many documents (for example one per chunk through index projections), the indexer cannot map a deleted blob to its child documents, so you must delete those documents through the index API.\n\nA practical design: remove the search documents first with the API, then delete the file.\n\nA high water mark is a change-detection policy for databases like Azure SQL and Cosmos DB, not a blob deletion fix.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-how-to-index-azure-blob-changed-deleted"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A Content Understanding analyzer generates a summary field. After the team attaches a deployment with a strict guardrail, the summary values are sometimes empty while the extracted content is still available. What is the most likely cause?", "o": [{"t": "The summary field uses the `extract` method", "c": false, "e": "A summary is generated and would use `generate`; the method is not the cause here."}, {"t": "The analyzer ID contains uppercase characters", "c": false, "e": "IDs do not blank out values."}, {"t": "`enableOcr` is set to true", "c": false, "e": "OCR does not suppress generated fields."}, {"t": "Guardrails on the model deployment can suppress generated values, although the content stays available", "c": true, "e": "The troubleshooting notes list this effect."}], "concept": "Content Understanding uses model deployments you connect to the resource: the analyzer's `models` setting uses model names from the catalog, and the service maps them to deployments (completion and embedding). Generated fields use the completion model.\n\nBecause the deployment is a normal Foundry model deployment, its guardrail applies to the content the model produces. A strict guardrail can suppress generated values, for example if the model's output is flagged. The content extracted from the file (Markdown, OCR text, layout) stays available, which is why the symptom is \"fields empty but content fine\".\n\nOther common problems: a model deployment not connected, using a deployment name where a model name is required, an `extract` field without source and confidence estimation, and deep nesting hurting accuracy.\n\nCheck the guardrail annotations on the deployment, and tune the thresholds for this use case.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference", "https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "A Content Understanding schema for loan documents nests objects and arrays six levels deep. Field accuracy is poor and results are hard to use. What does the guidance suggest?", "o": [{"t": "Use only the `generate` method for every field", "c": false, "e": "The method should match the field, and nesting remains the problem."}, {"t": "Disable normalization of dates and numbers", "c": false, "e": "Normalization helps, and it is not the cause here."}, {"t": "Add more levels to give the model more structure", "c": false, "e": "More nesting makes extraction harder."}, {"t": "Flatten the schema and avoid nesting deeper than about two to three levels", "c": true, "e": "Deep nesting hurts accuracy."}], "concept": "A `fieldSchema` lists the fields an analyzer should return. Types include `string`, `number`, `boolean`, `date`, `object` and `array`. Each field has a `description`, which acts as a mini-prompt, and a method: `extract` for values as written, `classify` for a fixed enum and `generate` for interpretation or summary.\n\nThe guidance is to avoid nesting deeper than two to three levels. A deep tree of objects in arrays is harder for the model to fill consistently, and hard for downstream code to use. Prefer flat fields, or split into a top-level array of simple objects, and run a second analyzer for sections that need their own schema.\n\nValues such as dates and numbers are normalized automatically. Use `estimateFieldSourceAndConfidence` to get confidence and grounding, and route low-confidence values to human review.\n\nValidate on labeled samples before scaling up.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "A team calls the GA REST version `2026-04-01` of agentic retrieval and expects the model to plan sub-queries and synthesize an answer, but only minimal, extractive retrieval happens. What explains this?", "o": [{"t": "Reasoning effort is ignored when it is `low`", "c": false, "e": "At `low` or `medium`, an LLM does query planning in the version that supports it."}, {"t": "The knowledge base must be deleted first", "c": false, "e": "Deleting is not needed to use features."}, {"t": "GA `2026-04-01` covers minimal, extractive retrieval; LLM query planning, answer synthesis and non-minimal effort need `2026-08-01-preview`", "c": true, "e": "The planning and synthesis features are in the preview version."}, {"t": "Planning is available only for videos", "c": false, "e": "Agentic retrieval is a search feature for knowledge bases."}], "concept": "Agentic retrieval is a multi-query pipeline for complex questions. The app calls a knowledge base with a retrieve action and conversation history. At low or medium reasoning effort an LLM splits the question into focused subqueries; at minimal this step is skipped. The default effort is low. The subqueries run in parallel against knowledge sources, each is semantically reranked, and the merged content is returned with optional references and an activity log.\n\nThe API version decides which features exist. REST `2026-04-01` is GA for generally available source types with minimal, extractive retrieval. `2026-08-01-preview` adds LLM query planning, answer synthesis, non-minimal effort and multi-turn messages.\n\nSo a team on the GA version sees only minimal retrieval. To use planning and synthesis, move to the preview version and accept preview risk.\n\nRemember to prefer GA features for production and to mark preview ones clearly.", "src": ["https://learn.microsoft.com/en-us/azure/search/agentic-retrieval-overview", "https://learn.microsoft.com/en-us/azure/search/agentic-retrieval-how-to-migrate"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "An indexer pipeline with several skills runs without errors, yet the index contains unexpected content in one field. The team wants to see the intermediate results of the enriched document, node by node. Which tool should they use?", "o": [{"t": "A debug session, which shows the enriched tree of the pipeline", "c": true, "e": "It lets you inspect intermediate skill outputs and the paths they use."}, {"t": "The Azure Monitor metrics chart for token usage", "c": false, "e": "Metrics show volumes, not the enriched tree."}, {"t": "The semantic ranker", "c": false, "e": "It reorders search results and does not show pipeline internals."}, {"t": "A larger indexer schedule", "c": false, "e": "Timing does not reveal content."}], "concept": "During an indexer run, skills build an enriched document, a tree of intermediate results such as `/document/content`, OCR text, chunks, or the output of a custom skill at its `targetName`. Output field mappings then choose which nodes go into which index fields.\n\nWhen the result looks wrong but there are no errors, you need to see the tree. Debug sessions show the enriched tree and the outputs of each skill, so you can check whether a node exists, what it contains and whether an output field mapping targets it. After changing the pipeline, reset the indexer before re-running so that the new definition applies.\n\nComplement this with the indexer execution history for skill errors, and with a query against the index to confirm the final fields.\n\nDebug first at the node, then at the mapping, then at the index field.", "src": ["https://learn.microsoft.com/en-us/azure/search/cognitive-search-concept-intro", "https://learn.microsoft.com/en-us/azure/search/search-indexer-overview"], "ref": ["azure-ai-search-configuration"]}]};</script>
