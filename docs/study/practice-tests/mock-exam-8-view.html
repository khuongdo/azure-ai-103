<div id="app"></div>
<script>window.MOCK_EXAM = {"id": "mock-8", "title": "AI-103 Mock Exam 8", "shortTitle": "Mock exam 8", "description": "Full-length mock exam with 50 scenario questions. This test is built around symptoms and diagnosis: error codes, silent failures, network and identity problems, traces, evaluators, retrieval symptoms, media request errors, speech and translation operations and indexer pipelines. Each question gives a symptom and asks for the cause or the fix.", "defaultMinutes": 120, "domains": [{"id": 1, "name": "Plan and manage an Azure AI solution", "weight": "25-30%", "count": 14}, {"id": 2, "name": "Implement generative AI and agentic solutions", "weight": "30-35%", "count": 16}, {"id": 3, "name": "Implement computer vision solutions", "weight": "10-15%", "count": 7}, {"id": 4, "name": "Implement text analysis solutions", "weight": "10-15%", "count": 7}, {"id": 5, "name": "Implement information extraction solutions", "weight": "10-15%", "count": 6}], "questions": [{"d": 1, "q": "A client application sends requests to a model endpoint and receives HTTP 431. The network, the quota and the credentials are all fine. Which cause fits this status code?", "o": [{"t": "The deployment name does not exist", "c": false, "e": "That gives a not-found style error, not 431."}, {"t": "The tokens-per-minute limit was exceeded", "c": false, "e": "That gives HTTP 429."}, {"t": "The request carries more than 10 custom headers", "c": true, "e": "A request may carry at most 10 custom headers; more returns HTTP 431."}, {"t": "The key or token is invalid", "c": false, "e": "That gives 401."}], "concept": "HTTP status codes tell you which layer failed, so learn the common ones. 401 means a bad or missing credential. 403 means valid credentials but the operation or configuration is not allowed. 429 means a rate limit (tokens or requests per minute) was exceeded. 431 means the request has too many custom headers: the limit is 10. 503 can appear during peaks, so monitor 429 and 503 together.\n\nThe 431 case is easy to cause with a gateway or a proxy that adds many tracing or routing headers. The fix is to send ten or fewer custom headers.\n\nOther fixed limits worth remembering: 100 Foundry resources per region per subscription, 250 projects per resource and 32 model deployments per resource.\n\nWhen you see an unusual status code, check the troubleshooting table before changing capacity.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/quotas-limits"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "A team tries to create a deployment of a model with the Batch deployment type, but the type is not offered for that model in the chosen region. What is the correct way to resolve this?", "o": [{"t": "Restart the Foundry resource", "c": false, "e": "This does not change which types a model supports."}, {"t": "Enable key-based authentication", "c": false, "e": "Authentication does not control available deployment types."}, {"t": "Check the availability of the model by deployment type and region, then pick a supported type or region", "c": true, "e": "Not every model supports every deployment type in every region."}, {"t": "Request a quota increase until the type appears", "c": false, "e": "Quota does not add a deployment type to a model."}], "concept": "A deployment type is a combination of billing and processing scope: Standard, Provisioned, Batch, Developer and Priority, each with Global, Data Zone or regional variants. Models differ in which combinations they support. Geography-based types usually arrive last for new models, and there is no guaranteed availability date.\n\nWhen the portal or an API says the type is not available, the cause is nearly always availability, not permission or quota. The troubleshooting table lists it as \"deployment type unavailable: the model does not support that type; check availability by type and region\".\n\nCheck the model card's Deployments tab and the regions. Then decide: choose another type (for example Global Standard), another region, or another model.\n\nThe quota page shows the limit by scope; if it shows 0 available, move quota or request an increase. That is a different symptom.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types", "https://learn.microsoft.com/en-us/azure/foundry/foundry-models/quotas-limits"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "A back-end service calls a reasoning model without streaming. Complex requests fail after exactly 60 seconds with a client timeout, although the service responds correctly in tests with a longer timeout. What is the best fix?", "o": [{"t": "Set the client timeout explicitly, since reasoning models can take much longer (up to about 29 minutes), and tune it to your traffic", "c": true, "e": "Library defaults may not match the service, and reasoning happens before the first output token."}, {"t": "Disable reasoning by lowering the temperature", "c": false, "e": "Temperature does not control reasoning, and the effort setting is the relevant control."}, {"t": "Add more custom headers to keep the connection alive", "c": false, "e": "This risks HTTP 431 and does not extend timeouts."}, {"t": "Switch the deployment to Batch for interactive use", "c": false, "e": "Batch is asynchronous with a 24-hour target and is not for live responses."}], "concept": "Client timeouts are your responsibility. Learn's guidance: non-reasoning streaming calls up to 60 seconds; non-streaming calls or reasoning models up to 29 minutes, set lower and tuned to your traffic. Set them explicitly, because a library default may not match the service.\n\nReasoning models generate and summarize all reasoning tokens before the first visible output token, so even a streaming call shows a long wait at the start. The `reasoning_effort` parameter controls how many reasoning tokens are produced, so a lower effort shortens the wait for tasks that do not need deep thinking.\n\nTo decide a good timeout, log latency percentiles for a day. Pick a value above the 95th percentile and keep user-facing interfaces responsive with progress messages.\n\nFor work that can wait, use a Batch deployment, not a longer timeout.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/quotas-limits", "https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning"], "ref": ["capacity-cost-and-throttling", "model-and-service-selection"]}, {"d": 1, "q": "Operations has an alert for HTTP 429 but users still report failures at peak hours that the alert does not catch. Dashboards show many 503 responses. What should the team change?", "o": [{"t": "Lower the prompt length to 10 tokens", "c": false, "e": "The cause is capacity at peak, and this makes the application unusable."}, {"t": "Ignore 503 because only 429 is related to load", "c": false, "e": "503 is part of the peak-load picture."}, {"t": "Disable alerts to avoid noise", "c": false, "e": "This removes visibility."}, {"t": "Monitor 429 and 503 together, and add a gateway or capacity measures for the peaks", "c": true, "e": "503 can also appear during peaks, so throttling and overload are watched as a pair."}], "concept": "Two statuses show load problems. 429 means you exceeded a limit (tokens or requests per minute) and the right reaction is retry with exponential backoff, honor the Retry-After header, ramp load gradually and add quota. 503 can appear when the service is under pressure during peaks. Learn advises monitoring both together.\n\nFor production, a single deployment is not enough. Foundry does not load-balance or fail over model deployments for you. Put a gateway such as Azure API Management in front for routing, health checks and circuit breaking across deployments or regions. Prefer Data Zone or Global deployment types for resilience, use spillover from provisioned to standard, and keep models in the same region as the agents.\n\nMetrics are in Azure Monitor: chart total calls, filter by status code and split by `ModelDeploymentName`.\n\nAlert design: cover every status that means \"user did not get an answer\".", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/quotas-limits", "https://learn.microsoft.com/en-us/azure/foundry/how-to/high-availability-resiliency"], "ref": ["capacity-cost-and-throttling", "platform-network-and-reliability"]}, {"d": 1, "q": "An app sends a 5,000-token shared policy prefix on every request. Cache hits are high during the day, but the first request after a quiet night is slow and costly, and a staging environment in another subscription never benefits from the production cache. Which statement explains both observations?", "o": [{"t": "Caches are shared across all subscriptions of a tenant", "c": false, "e": "They are not shared between subscriptions."}, {"t": "In-memory prompt caches are usually cleared after 5 to 10 minutes of inactivity, and caches are not shared between Azure subscriptions", "c": true, "e": "Idle time clears the cache, and each subscription has its own cache."}, {"t": "Caching only works on Provisioned deployments", "c": false, "e": "It applies to Standard deployments as well, with a discount on cached input."}, {"t": "Prompt caching is permanent once a prefix is seen", "c": false, "e": "In-memory caches are cleared after inactivity and always within one hour of last use."}], "concept": "Prompt caching keeps processed input tokens temporarily, so a request that starts with the same content as an earlier one is cheaper and faster. It requires a prompt of at least 1,024 tokens whose first 1,024 tokens are identical, with further hits in 128-token increments on GPT-5.5 and earlier. It changes only latency and cost, never the output.\n\nLifetime rules: in-memory caches are usually cleared after 5 to 10 minutes of inactivity and always within one hour of last use. Extended retention on selected models can keep prefixes up to 24 hours. Caches are not shared between Azure subscriptions.\n\nSo the first call after a quiet period is a miss, and a staging subscription warms its own cache. Check the `cached_tokens` value in `prompt_tokens_details`.\n\nPut stable content first (system message, tool definitions, reference text) and variable content last.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/prompt-caching"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "In a network-secured setup, the Agents page in the Foundry portal shows a timeout when loading, although the model deployments work. Which cause is most likely?", "o": [{"t": "The agent has too many versions", "c": false, "e": "Versions do not cause a network timeout."}, {"t": "The guardrail is in annotate-only mode", "c": false, "e": "Guardrail mode affects content decisions."}, {"t": "The model deployment is Global Standard", "c": false, "e": "Deployment type does not affect the Agents page."}, {"t": "The portal cannot reach Azure Cosmos DB, because of a missing private endpoint or DNS configuration", "c": true, "e": "The Agents page reads agent data from Cosmos DB, and unreachable private resources cause timeouts."}], "concept": "In the standard agent setup, conversations, agent definitions and run state live in your Azure Cosmos DB account, files in Storage and vector stores in Azure AI Search. With network isolation, all of these are reached through private endpoints, and names must resolve to private IPs through linked private DNS zones.\n\nThe symptom \"timeout loading the Agents page\" points to Cosmos DB: either its private endpoint is missing, or the DNS zone `privatelink.documents.azure.com` is not linked, or the person's network cannot reach the private endpoint. The model deployments can still work because they use a different path.\n\nTo diagnose, run `nslookup` from a machine in the network. A private IP means DNS is right. To use the portal against a locked-down project, use a VPN gateway, ExpressRoute, or Azure Bastion to a jump box inside the network.\n\nName resolution failures are the most common private networking problem.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "Creating the capability host for a standard agent setup fails with an error about connections. The team supplied a Cosmos DB account and a Storage account. What is the most likely missing piece?", "o": [{"t": "A second Foundry resource in another region", "c": false, "e": "The three data resources are required, not another Foundry resource."}, {"t": "A Provisioned model deployment", "c": false, "e": "Capacity does not affect the capability host."}, {"t": "The Azure AI Search resource, because a network-secured standard setup requires all three bring-your-own resources", "c": true, "e": "Cosmos DB, Storage and AI Search are all needed."}, {"t": "A public IP address for the agent runtime", "c": false, "e": "The goal is the opposite: private networking."}], "concept": "The standard agent setup puts your agent data in your own resources: conversations, agent definitions and run state in Azure Cosmos DB for NoSQL, uploaded files in Azure Storage and vector stores for file search in Azure AI Search. A network-secured standard setup requires all three. If one is missing, creation of the capability host fails with an error about connections.\n\nThis is listed in the troubleshooting symptoms: \"Capability host creation error about connections: one of the three BYO resources is missing\".\n\nOther setup facts: keep the Azure OpenAI resource, the Foundry account and the project in the same region; the Foundry resource must be in the same region as the virtual network; the agent subnet is delegated to `Microsoft.App/environments` and dedicated to one Foundry resource; and the provisioning identity and the runtime identity need different roles.\n\nCheck the list of three resources first when a creation error mentions connections.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/use-your-own-resources", "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A team decommissions a test environment and tries to delete its virtual network. The delete fails because the agent subnet still has a service association link. What is the correct order of cleanup?", "o": [{"t": "Delete the virtual network first and the Foundry resource afterward", "c": false, "e": "The subnet cannot be deleted while the link exists."}, {"t": "Remove the private DNS zones and retry", "c": false, "e": "DNS zones are unrelated to the association link."}, {"t": "Purge the Foundry resource first, and then delete the virtual network", "c": true, "e": "Otherwise the subnet keeps the service association link."}, {"t": "Delete only the Cosmos DB account", "c": false, "e": "The link belongs to the Foundry resource, not Cosmos DB."}], "concept": "When agent runtime is injected into a delegated subnet, the Foundry resource creates a service association link on that subnet. Azure will not delete a subnet that still has such a link.\n\nThe documented cleanup order is: purge the Foundry resource before deleting the virtual network. Deleting a Foundry resource normally soft-deletes it, so a purge is needed to release the subnet.\n\nRemember related rules for the subnet: it is dedicated to one Foundry resource (it cannot be shared), delegated to `Microsoft.App/environments`, uses a private address range with a recommended size of /24, and must not overlap with peered networks.\n\nWhen you design infrastructure as code for temporary environments, include the purge step in the teardown script so repeated create-and-destroy cycles do not fail.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A new project's agents cannot use several features and fail without clear errors. The team granted the developers Foundry User, but nothing was assigned to the project's own managed identity. What should they do?", "o": [{"t": "Delete and recreate the project", "c": false, "e": "This is unnecessary, and the new identity would again need the role."}, {"t": "Give the developers the Owner role at subscription scope", "c": false, "e": "Developer roles do not fix a missing role for the project identity."}, {"t": "Give the project's managed identity the Foundry User role on the Foundry resource", "c": true, "e": "Some features fail silently when the project identity lacks this role."}, {"t": "Switch every connection to API keys", "c": false, "e": "Keys bypass role-based access control and are not the recommended fix."}], "concept": "Foundry roles apply to people and also to identities used by the platform. Each project has a managed identity, and agents in the project use it to reach resources. The rule is: give the project's managed identity the Foundry User role on the Foundry resource too, or some features fail silently.\n\n\"Silently\" is the key word: the portal does not always show a clear authorization error, so the symptom is features that do not work.\n\nThe roles at a glance: Foundry Agent Consumer (call agents only), Foundry User (build and test), Foundry Project Manager (publish agents and assign Foundry User), Foundry Account Owner (accounts and models) and Foundry Owner (all).\n\nDesign tip: use a user-assigned managed identity for projects when role assignments must survive project recreation. And remember that provisioning and runtime use different identities with different roles.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry"], "ref": ["platform-network-and-reliability", "agent-safety-and-identity"]}, {"d": 1, "q": "A platform engineer runs `az role assignment create` to give the Foundry account's managed identity the \"Cosmos DB Built-in Data Reader\" role on a Cosmos DB account. The command fails to grant data access. What is the correct approach?", "o": [{"t": "Use `az cosmosdb sql role assignment create`, because it is a Cosmos DB data-plane role, not an Azure RBAC role", "c": true, "e": "Cosmos DB data-plane roles are assigned with the Cosmos CLI."}, {"t": "Enable local key authentication instead", "c": false, "e": "Keys are not the recommended approach and bypass role control."}, {"t": "Retry `az role assignment create` with the Owner role", "c": false, "e": "The data-plane role is not an Azure RBAC role, so Owner does not apply."}, {"t": "Assign the role to the developer, not to the identity", "c": false, "e": "The runtime identity needs the data-plane role."}], "concept": "Azure has two layers of access control. The control plane (Azure RBAC) manages resources: creating or deleting an account. The data plane governs reading and writing the data. Cosmos DB for NoSQL has its own data-plane role system, and its roles such as \"Cosmos DB Built-in Data Reader\" are assigned with `az cosmosdb sql role assignment create`, not with `az role assignment create`.\n\nFor bring-your-own resources, two identities are involved. The person or pipeline that provisions needs roles such as Storage Blob Data Contributor and Cosmos DB Operator. The Foundry account's or project's managed identity needs data-plane roles at runtime. A very common failure is granting only the first set.\n\nSymptom: provisioning succeeds, but agents fail when they try to read or write data.\n\nCheck which layer the role belongs to before choosing the command.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/use-your-own-resources"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "An evaluation gate in a pipeline sometimes passes and sometimes fails for the same agent version, with a small dataset of 15 cases and an LLM judge. What is the most likely cause and the right response?", "o": [{"t": "The pipeline needs a lower threshold so that it always passes", "c": false, "e": "Lowering the gate hides regressions."}, {"t": "The agent code changes every time the pipeline runs", "c": false, "e": "The version is the same, so the code does not change."}, {"t": "Evaluation cannot be repeatable, so remove the gate", "c": false, "e": "Gates can be made stable with a better dataset."}, {"t": "Judge variance with a tiny sample; run the evaluation twice and widen the dataset", "c": true, "e": "A small sample and judge variability make results noisy."}], "concept": "An evaluation gate is a pass or fail decision that blocks a release. For it to be useful it must be stable. Learn's troubleshooting lists the causes: a flaky gate comes from judge variance and a tiny sample. Most evaluators are AI-assisted, so a judge model scores each case, and a judge can vary a little from run to run.\n\nPractical fixes: run the evaluation twice and compare, widen the dataset (keep a small fast set for pull requests and the full set for release candidates), and use confidence intervals when comparing versions. A gate should combine an absolute floor, a rule relative to the baseline, must-pass cases and a budget.\n\nThe opposite problem, a gate that always passes, comes from a dataset that is too easy or too small: add real failures from production.\n\nVersion the dataset with the code.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluation-github-action", "https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/azure-developer-cli-evaluation"], "ref": ["cicd-for-foundry-projects"]}, {"d": 1, "q": "Three months after launch, a team notices that its pipeline gate has passed on every single release, even though users report regressions. Which action addresses the root cause?", "o": [{"t": "Remove the must-pass cases so the gate is simpler", "c": false, "e": "This makes the gate weaker."}, {"t": "Raise the judge model's temperature to make scores vary", "c": false, "e": "Randomness makes results noisy and does not improve coverage."}, {"t": "Add failing conversations from production as new test cases and examine the confidence intervals, because the dataset is probably too easy or too small", "c": true, "e": "Each production incident becomes a test case that the gate must pass."}, {"t": "Evaluate only the first message of every conversation", "c": false, "e": "This narrows coverage further."}], "concept": "A gate is only as good as its test data. If the dataset contains only polite, easy, familiar questions, every release looks fine. The symptom \"gate always passes\" in Learn's troubleshooting table has the cause \"dataset too easy or too small\", and the check is to add failures from production and look at the confidence interval.\n\nGood dataset hygiene: version the dataset with the code; add every production incident as a new test case; keep a small fast set (about a dozen cases) for every pull request and the full set for release candidates; include must-pass scenarios such as a refund limit or a privacy request.\n\nA worked example in the lesson: production task adherence is 4.6 and a candidate scores 4.4 with a 95% interval of 4.3 to 4.5. The interval lies entirely below the baseline, so the gate should fail even though 4.4 is above an absolute floor of 4.0.\n\nUse both an absolute and a relative rule.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluation-github-action", "https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/azure-developer-cli-evaluation"], "ref": ["cicd-for-foundry-projects"]}, {"d": 1, "q": "A locked-down environment includes jump boxes and self-hosted build agents with direct access to the data plane of the Foundry project. The security team asks whether their activity needs logging. What does the guidance say?", "o": [{"t": "No, because only end-user activity matters", "c": false, "e": "Privileged paths are the ones that most need an audit trail."}, {"t": "Yes, log activity on jump boxes and build agents, because they have direct data-plane access", "c": true, "e": "These hosts can reach data without passing the normal application path."}, {"t": "Only log them if keys are enabled", "c": false, "e": "Logging does not depend on key use."}, {"t": "Only log model token counts", "c": false, "e": "Token counts do not show who touched the data plane."}], "concept": "Monitoring is not only about model calls. In a locked-down environment, administrators reach the project through VPN, ExpressRoute or a jump box (for example with Azure Bastion), and pipelines run on self-hosted runners inside the network. These machines have direct data-plane access.\n\nLearn's guidance is to log activity on jump boxes and build agents. Together with diagnostic settings to Log Analytics (who called which deployment and when, with KQL), Azure Monitor alerts and Defender for AI services alerts on jailbreak attempts and data leakage, this gives an audit trail.\n\nRemember the log categories for Foundry Models: RequestResponse, Trace and Audit, and the roles Monitoring Reader to view and Monitoring Contributor to configure.\n\nCollecting logs costs money, so choose categories deliberately, but never skip the privileged paths.", "src": ["https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat", "https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/monitor-models"], "ref": ["observability-and-agent-lifecycle", "platform-network-and-reliability"]}, {"d": 1, "q": "A compliance officer asks to enable content filtering on an embedding model deployment, so that harmful input texts are blocked before they are vectorized. What is the correct answer?", "o": [{"t": "Use a Provisioned deployment, which filters embeddings automatically", "c": false, "e": "Deployment type does not add filtering."}, {"t": "Enable the Violence control on the embedding deployment guardrail", "c": false, "e": "Embedding deployments do not support content filtering."}, {"t": "Convert the embedding into text and send it to the model", "c": false, "e": "Embeddings are numeric vectors and cannot be converted back to meaningful text for filtering."}, {"t": "Content filtering is not available for embedding models; screen the text earlier with Azure AI Content Safety if needed", "c": true, "e": "Learn lists embedding and time-series models as not supported for content filtering."}], "concept": "Content filtering is built into serverless model deployments and can be customized. There are exceptions that Learn calls out: filtering is not available for embedding models and time-series models. Also, if you call a serverless model through an API that is not the Azure OpenAI SDK surface, you do not get filtering unless you add Azure AI Content Safety yourself.\n\nFor an embedding pipeline, put the safety check before the embedding call: scan the text with Content Safety, or filter documents at ingestion, then embed. Remember also that retrieved text is untrusted when it later reaches a chat model, so the indirect attack control at the tool response point and prompt structure matter there.\n\nAn embedding is just a list of numbers, so there is no readable output to filter.\n\nPlan filtering at the stages that produce or consume text: ingestion, prompt, tool response and output.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/foundry-models-overview", "https://learn.microsoft.com/en-us/azure/ai-services/content-safety/overview"], "ref": ["model-and-service-selection", "responsible-ai-governance"]}, {"d": 2, "q": "A function tool call returns `arguments` that fail JSON parsing in the application, or contain values of the wrong type. Which TWO actions follow the troubleshooting guidance?", "o": [{"t": "Fix the parameter types and mark fields as required in the schema, and use `strict: true`", "c": true, "e": "A precise schema with required fields and strict mode reduces malformed arguments."}, {"t": "Handle parse errors in the application and treat arguments as untrusted input", "c": true, "e": "The app must be defensive, because the arguments are produced by a model."}, {"t": "Remove the schema so that the model has more freedom", "c": false, "e": "The schema is what guides the arguments."}, {"t": "Switch to a model without tool support", "c": false, "e": "The model would not call tools at all."}, {"t": "Ignore errors and pass the raw string to the function", "c": false, "e": "This invites failures and security problems."}], "concept": "In function calling, the model returns a `function_call` item with a name, `arguments` as a JSON string and a `call_id`. Your application parses the string, runs the function, and sends back a `function_call_output` with the same `call_id`.\n\nLearn's troubleshooting table for argument problems: arguments not valid JSON means a schema mismatch, so fix types and `required` fields and handle parse errors; required fields missing means the schema does not enforce them, so add `required` and use `strict: true`; wrong parameters mean an ambiguous description, so clarify with examples.\n\nThe schema should also set `additionalProperties: False`. Every parameter should have a clear description with an example such as \"Order number, e.g. 4711\".\n\nBecause the model creates the arguments, the application must validate them before use.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "A developer gets 403 from the project endpoint when running a local script. `az login` succeeded, and the endpoint format is correct. What should be checked first?", "o": [{"t": "That the model name is used instead of the deployment name", "c": false, "e": "That causes a 404 on the model, not a 403."}, {"t": "That the signed-in account has the Foundry User role on the project and belongs to the right tenant, for example with `az account show`", "c": true, "e": "A missing role or wrong tenant are the typical causes of 401 and 403."}, {"t": "That the temperature is below 1", "c": false, "e": "Parameters do not cause authorization failures."}, {"t": "That the embedding endpoint is the project endpoint", "c": false, "e": "Embedding problems give different errors."}], "concept": "The first call to the Foundry SDK has predictable failure points. Get the project endpoint (`https://<resource>.services.ai.azure.com/api/projects/<project>`), give yourself a role (Foundry User to use a project, Foundry Project Manager to manage it), sign in locally with `az login`, and create the client with `DefaultAzureCredential` so that it is keyless.\n\nLearn's troubleshooting hints: 401 or 403 means a missing role or the wrong tenant, so run `az account show` and verify the role on the project; 404 on the model means you used the model name instead of the deployment name; endpoint errors mean a wrong URL format or a custom subdomain not applied; embeddings failing on the project client means you should use the `/openai/v1` endpoint; and an empty output from a reasoning model means the token cap was consumed by reasoning.\n\nIn Azure, replace `az login` with a managed identity.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/sdk-overview"], "ref": ["foundry-sdk-and-generative-apps"]}, {"d": 2, "q": "A RAG evaluation shows high Retrieval and high Groundedness scores, but the Relevance score is low: answers are faithful to the context yet do not address what the user asked. Which fix fits best?", "o": [{"t": "Lower the embedding dimensions", "c": false, "e": "Dimensions affect vectors and not the question being answered."}, {"t": "Replace the semantic ranker with BM25 only", "c": false, "e": "Ranking is not the issue here."}, {"t": "Improve query understanding, for example rewrite the query with conversation history, and tighten the prompt so the model answers the actual question", "c": true, "e": "Low relevance means the model answers a different question."}, {"t": "Raise `top_k` to 100 for completeness", "c": false, "e": "That addresses missing facts, not answers to the wrong question."}], "concept": "The score pattern across evaluators tells you where the system fails. Retrieval asks whether the retrieved chunks are relevant to the query. Groundedness asks whether the answer stays inside the context (precision). Relevance asks whether the answer addresses the question. Response Completeness asks whether expected facts are missing (recall).\n\nHere retrieval and groundedness are high, so the right content was found and the answer follows it. Low relevance means the answer addresses something else. A typical cause is that a follow-up such as \"and for phones?\" was searched without context, or the prompt does not tell the model to focus on the user's question.\n\nFixes: fold conversation history into the query, rewrite the query, and refine the prompt.\n\nCompare with other patterns: retrieval low means better chunking, hybrid search or OCR; retrieval high but groundedness low means a stricter prompt or lower temperature; groundedness high but completeness low means higher `top_k`.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A test shows that the correct document is retrieved by hybrid search but sits at position 30, so it never reaches the model's prompt. The team wants to improve ordering without changing the content. Which step addresses this?", "o": [{"t": "Add the semantic ranker, which rereads the top results and reorders them by how well they answer the question", "c": true, "e": "Reranking moves the best answer to the front, provided it is within the first 50 results."}, {"t": "Add more chunks to the prompt until position 30 fits", "c": false, "e": "This raises cost and noise."}, {"t": "Change the embedding model without re-embedding", "c": false, "e": "This breaks vector consistency."}, {"t": "Remove the keyword part of the hybrid query", "c": false, "e": "This reduces exact matching and does not specifically fix ordering."}], "concept": "Retrieval produces a candidate list, and rank decides what reaches the model. In hybrid search, Reciprocal Rank Fusion merges the keyword list and the vector list by rank position. The result can still have the best answer at position 30.\n\nThe semantic ranker is a second-stage reranker. It takes the top 50 results, builds a summary of each from the fields of the semantic configuration (title, keywords, content), and scores each from 0 to 4 for how well it answers the query. The best ones move to the front.\n\nIts limit is important: it only reorders what retrieval already found. If the right document is not in the first 50, it cannot rescue it, which is why guidance sets the vector `k` to 50.\n\nTo measure the benefit, compare the rank of the right document before and after, using Document Retrieval metrics on a labeled set.", "src": ["https://learn.microsoft.com/en-us/azure/search/semantic-search-overview", "https://learn.microsoft.com/en-us/azure/search/hybrid-search-overview"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A hybrid search with a security filter returns zero results for one user, although the same query without the filter returns relevant documents. The filter uses a `groupIds` field populated at ingestion. What should the team verify first?", "o": [{"t": "That the semantic ranker is disabled", "c": false, "e": "The ranker does not remove documents because of a filter."}, {"t": "That the access information was collected at ingestion and the filter expression matches the stored field values for that user", "c": true, "e": "A filter that matches nothing removes all results, so the permission field and expression are the first suspects."}, {"t": "That the index uses exhaustive KNN", "c": false, "e": "The algorithm does not change filter logic."}, {"t": "That the embedding model has more dimensions", "c": false, "e": "Dimensions do not decide filter matches."}], "concept": "In the online RAG pipeline, retrieval runs a keyword query and a vector query in parallel, then applies filters (department, region, date) and security trimming so that only chunks the user may read are returned. Each method returns a ranked list.\n\nA common failure is \"filters removing everything\". The cause is usually in the data: access information (who may read each chunk) must be collected at ingestion, because it cannot be added later without re-reading the source. If the field is empty or has different values than the filter expects, the result is empty.\n\nHow to check: run the query without the filter, inspect a few documents' permission fields, and run the filter alone in the portal before involving any language model.\n\nFilters and facets work in hybrid queries. With the semantic ranker you probably want post-filtering; test both.", "src": ["https://learn.microsoft.com/en-us/azure/search/hybrid-search-overview", "https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-create-index"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A team embeds whole 15,000-token chapters using `text-embedding-3-small` and notices that content at the end of every chapter is never found, with no error. What is the cause?", "o": [{"t": "The model's input limit is 8,191 tokens, so longer text is cut off silently; chunk the content before embedding", "c": true, "e": "Text over the token limit is truncated, so the end never influences the vector."}, {"t": "The model refuses long inputs with a clear error message", "c": false, "e": "The failure is silent in this scenario."}, {"t": "The semantic ranker removes the final 7,000 tokens", "c": false, "e": "The ranker works after retrieval and is unrelated to embedding input."}, {"t": "Vector search ignores the end of every document by design", "c": false, "e": "This is not how vector search works."}], "concept": "Embedding models have an input limit; for `text-embedding-3-small` it is 8,191 tokens. Text beyond the limit may be cut off silently, which means the part after the limit has no effect on the vector. A 15,000-token chapter would lose about 6,800 tokens at the end.\n\nChunking solves this. It keeps each piece under the limit, avoids one vector blurring many topics, and returns a focused passage to the language model. The documented starting point is 512 tokens with 25% overlap (128 tokens). Keep a pointer from each chunk to its source document, page and section.\n\nSymptoms of this problem: relevant content exists but is never retrieved, especially the later parts of long documents. The check is to compare the token count of a document with the model's limit.\n\nAlso use the same embedding model and dimensions for chunks now and for questions later.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-chunk-documents", "https://learn.microsoft.com/en-us/azure/search/vector-search-overview"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "After a configuration change, the Text Split skill produces thousands of very small chunks, and answers lose context. The skill is set to `sentences` mode. What change fits the goal of focused but contextual chunks?", "o": [{"t": "Keep `sentences` mode and raise the temperature", "c": false, "e": "Temperature is a generation setting and does not change chunking."}, {"t": "Switch to a smaller embedding model", "c": false, "e": "The size of the model does not change chunk size."}, {"t": "Use the OCR skill instead of Text Split", "c": false, "e": "OCR reads text from images and does not chunk text."}, {"t": "Use `pages` mode with a suitable `maximumPageLength` and a `pageOverlapLength` that is less than half of it", "c": true, "e": "Pages combine several sentences into chunks of a chosen size."}], "concept": "The Text Split skill has two modes. `sentences` makes one sentence per chunk, which creates thousands of tiny chunks that carry little context. `pages` makes chunks of several sentences up to a maximum length. Suggested starting values for character-based chunking are `maximumPageLength` 2000 characters and `pageOverlapLength` 500.\n\nThe overlap must be less than half of the maximum length. Measure real token counts before you choose, because an overlap that is too large relative to short pages can end up as no overlap at all.\n\nChunk size is a trade-off. Too large means blurry meaning and cost; too small means lost context; cutting a rule in the middle breaks the answer. Overlap protects boundaries but increases storage and embedding calls.\n\nTo verify, read some chunks yourself and run retrieval evaluators on test questions.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-chunk-documents"], "ref": ["rag-retrieval-and-grounding", "azure-ai-search-configuration"]}, {"d": 2, "q": "A guardrail has an indirect attack control, yet an attack hidden in a web page that an agent retrieves was not detected. Which TWO checks does the troubleshooting guidance suggest first?", "o": [{"t": "Check the annotation: `detected` and `filtered` flags show whether the content was seen but allowed (annotate mode)", "c": true, "e": "`detected: true` with `filtered: false` means it was seen but not blocked."}, {"t": "Disable tool responses so that no content is retrieved", "c": false, "e": "This breaks the agent's purpose rather than diagnosing the control."}, {"t": "Increase the temperature so the model ignores hidden text", "c": false, "e": "Temperature is not a defense."}, {"t": "Check that the guardrail is assigned to the agent, and that the control is placed at the intervention point where the attack enters (tool response, not only user input)", "c": true, "e": "A control at the wrong point or an unassigned guardrail does nothing for that path."}, {"t": "Remove the guardrail and use only a longer system prompt", "c": false, "e": "Prompts can be bypassed."}], "concept": "A shield that does not detect has three common causes. First, the guardrail is not assigned to the agent. Second, the control is not at the right intervention point: user prompt attacks enter at user input, while document (indirect) attacks enter through content the agent reads, so they must be scanned at the tool response point as well as at user input. Third, the control is in annotate mode, which flags but does not block.\n\nAnnotations carry `detected` and `filtered`. `detected: true, filtered: false` means \"seen but allowed\". Annotate mode is useful for tuning false positives before turning blocking on.\n\nAnother cause is a risk that agents do not support yet: it silently does not take effect for the agent, although it works for models using the same guardrail. An agent's guardrail also fully replaces its model's guardrail.\n\nCheck assignment, point, mode and risk support, in that order.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/intervention-points", "https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/content-filter-prompt-shields"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A team adds tool call and tool response controls to an agent whose only tool is a custom in-house tool of a type that is not on the moderated-tool list. The controls never fire. Why?", "o": [{"t": "Tool call and tool response controls work only with tools that support moderation, such as Azure AI Search, Azure Functions, OpenAPI, SharePoint grounding, Fabric Data Agent, Bing grounding, Bing Custom Search and Browser Automation", "c": true, "e": "For other tools those controls do nothing."}, {"t": "They run only after midnight UTC", "c": false, "e": "There is no such schedule."}, {"t": "They require Provisioned deployments", "c": false, "e": "Deployment type is unrelated."}, {"t": "Those controls apply only to models, never to agents", "c": false, "e": "They apply to agents (Preview)."}], "concept": "Guardrails can be attached at four intervention points: user input, tool call, tool response and output. User input and output are generally available for models. Tool call (what the agent proposes to send to a tool) and tool response (what a tool returns, before it is added to memory or shown) are Preview and apply to agents.\n\nThere is a support limit: these two controls work only with tools that support moderation. Learn lists Azure AI Search, Azure Functions, OpenAPI, SharePoint grounding, Fabric Data Agent, Bing grounding, Bing Custom Search and Browser Automation. For other tools those controls do nothing, so the guardrail seems to be \"not working\".\n\nAlso remember that guardrails apply to agents built in Foundry Agent Service, not to other agents merely registered elsewhere, and that each intervention point adds roughly 50 to 100 ms.\n\nWhere a tool cannot be moderated, enforce limits in code and with permissions.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/intervention-points", "https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A trace shows the same search tool called eight times in a row with almost identical arguments before the agent finally answers. What does this pattern most likely indicate, and what is the fix?", "o": [{"t": "A slow downstream API, so cache its results", "c": false, "e": "Durations would be long on a single span, not repeated calls."}, {"t": "A loop or a poor stop condition; tighten the instructions and limit the tools", "c": true, "e": "Repeated calls signal that the agent does not know when it has enough information."}, {"t": "The agent chose not to use the tool, so improve its description", "c": false, "e": "The tool was used, many times."}, {"t": "An intermittent tool failure, so add retries inside the agent", "c": false, "e": "Retries followed by success show failures; repeated successful calls show a loop."}], "concept": "A trace is a tree of spans. Reading its shape tells you what happened. If an expected tool is never called, the agent chose not to use it, so improve the tool description or instructions. If the right tool is called with wrong arguments, argument extraction is poor: fix the schema, add examples and check Tool Input Accuracy. If one `execute_tool` span takes eight seconds, a downstream API is slow. If the same tool is called repeatedly, there is a loop or a poor stop condition. If there are retries and then success, the tool fails intermittently and needs reliability work.\n\nFor a loop, tighten the instructions about when to stop (\"after one search, answer unless the results are empty\"), and keep the set of tools small so that overlapping tools do not cause repeated attempts.\n\nAdd a test case for this conversation to the evaluation set so a future version cannot regress.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/observability/concepts/trace-agent-concept"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 2, "q": "A trace shows that a tool call fails twice with a time-out and succeeds on the third attempt, in many conversations. Latency is high but answers are correct. Where should the team invest?", "o": [{"t": "In removing tracing to speed up responses", "c": false, "e": "Tracing is how the problem was found."}, {"t": "In a bigger language model", "c": false, "e": "The model is working correctly."}, {"t": "In reliability at the tool or the downstream service, because the pattern shows intermittent tool failure", "c": true, "e": "Retries followed by success identify an unreliable tool."}, {"t": "In a lower temperature", "c": false, "e": "Temperature is unrelated to tool time-outs."}], "concept": "Trace patterns point to the layer that needs work. \"Retries then success\" means intermittent tool failure. The agent is doing the right thing, but the tool or the service behind it is unreliable, so latency rises and cost grows through repeated calls.\n\nFixes belong at the tool: add timeouts and retries with backoff inside the tool, make the downstream service more reliable, cache stable results, and return status quickly for long work. In a function-calling agent, remember that runs expire 10 minutes after creation, so slow work should return a status immediately and be polled.\n\nTo measure, use the Tool Call Success evaluator (did the call technically succeed?) and watch time-outs on the `execute_tool` spans in the dashboard.\n\nChoose the layer by the pattern: model, prompt, tool or network.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/observability/concepts/trace-agent-concept", "https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/agent-evaluators"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 2, "q": "After Friday's change, a support agent gets worse. Traces of failing conversations show the `search_orders` tool is no longer called. What should the team do first to find the cause?", "o": [{"t": "Compare the previous and new agent versions with identical inputs and review the instruction changes, then run evaluators on both versions", "c": true, "e": "Versions are immutable, so a comparison shows exactly what changed."}, {"t": "Turn off guardrails permanently", "c": false, "e": "Nothing suggests guardrails caused the change."}, {"t": "Increase the number of model replicas", "c": false, "e": "Capacity is not the cause when the tool is simply not called."}, {"t": "Delete the agent and create a new one with a different name", "c": false, "e": "This loses the history and the evidence."}], "concept": "Match the symptom to the tool. In this case: open traces of failing conversations (the tool is no longer called); compare versions, since each saved change is an immutable version and you can compare setup, chat output and YAML; run evaluators on both versions (Tool Selection fails on the new one and Task Completion drops); roll back by directing traffic to the previous version while fixing; and prevent recurrence by adding the failing prompts to the test suite and making evaluation a required check before publish.\n\nThe likely finding is that the new instructions removed the line that told the agent to look up orders.\n\nDo not guess at infrastructure causes when traces show behavior. And do not delete versions: their history is your evidence.\n\nRemember that Foundry does not provide canary routing, so build a routing layer to send a small share of traffic to the new version first.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/development-lifecycle", "https://learn.microsoft.com/en-us/azure/foundry/observability/concepts/trace-agent-concept"], "ref": ["observability-and-agent-lifecycle", "cicd-for-foundry-projects"]}, {"d": 2, "q": "A developer uses `client.responses.parse(...)` with a Pydantic model and Structured Outputs. In some cases `output_parsed` is empty, although no exception occurred. What should the code do before reading the parsed value?", "o": [{"t": "Increase `top_p` to 1.5", "c": false, "e": "This is not a valid fix."}, {"t": "Assume the schema is wrong and delete required fields", "c": false, "e": "Refusals are not caused by required fields."}, {"t": "Check for a refusal in the response, because the model can refuse a request instead of returning the object", "c": true, "e": "Learn says to always check for refusals before reading the parsed value."}, {"t": "Remove `strict` from the schema", "c": false, "e": "Strict mode is what guarantees the shape when the model answers."}], "concept": "Structured Outputs make the model follow a JSON Schema, but the model can still refuse a request, for example for safety reasons. In that case there is no object matching your schema. If your code reads the parsed value without checking, it may get nothing or fail later.\n\nThe practice from Learn: always check for refusals before reading the parsed value. In Python, pass a Pydantic model as `text_format` to `responses.parse` and the SDK builds the schema and returns a parsed object. Authenticate with Microsoft Entra ID rather than a key.\n\nAlso remember what strict output does and does not do: it guarantees shape, not truth. Unsupported keywords such as `pattern` or `minLength` need validation in your own code, and the combination with function calling needs `strict: true` and `parallel_tool_calls` set to false.\n\nTreat the content as untrusted until validated.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/structured-outputs"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A team plans to rely on Structured Outputs to guarantee argument shape for function tools in agents running in Foundry Agent Service, and they tell the security reviewers that no further validation is needed. What is wrong?", "o": [{"t": "Structured Outputs are not supported with Foundry Agent Service, so the application must validate arguments itself", "c": true, "e": "Learn lists Agent Service and bring-your-own-data scenarios as unsupported for this guarantee."}, {"t": "Validation is only needed for images, not for tools", "c": false, "e": "Tool arguments are untrusted input."}, {"t": "Agents never produce function arguments", "c": false, "e": "Function tools produce arguments in a `function_call`."}, {"t": "Nothing is wrong, because strict mode works everywhere", "c": false, "e": "It is not supported in Agent Service."}], "concept": "Structured Outputs with `strict: true` guarantee that output matches a JSON Schema in the places where the feature is supported. Learn lists a restriction: it is not supported with Foundry Agent Service or bring-your-own-data scenarios. In those environments the application must validate arguments itself.\n\nFor function tools in Agent Service the schema still helps: set `required` fields, `additionalProperties: False` and `strict=True` in the tool definition to improve the arguments, as the function-calling guide shows. But treat arguments and outputs as untrusted input and validate them before use.\n\nWhen Structured Outputs are available (for example direct Responses API calls), remember the strict subset rules: all fields required, null for optional, `additionalProperties: false`, limits of 100 properties and 5 levels, and unsupported keywords such as `pattern`.\n\nNever present a model guarantee as a security control.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/structured-outputs", "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling"], "ref": ["rag-retrieval-and-grounding", "building-agents-with-foundry"]}, {"d": 2, "q": "A composite agent evaluator such as Output Quality fails for a conversation, and the team does not know which aspect caused the failure. Which approach helps?", "o": [{"t": "Lower the threshold of every component to 1", "c": false, "e": "This lets almost anything pass."}, {"t": "Look at the component results, because the composite passes only if every applicable component passes", "c": true, "e": "Components such as groundedness, task adherence and task completion reveal the cause."}, {"t": "Re-run the same evaluator ten times and average the failures", "c": false, "e": "Repetition does not explain which component failed."}, {"t": "Treat the composite as a single score and ignore details", "c": false, "e": "This hides the cause."}], "concept": "Some evaluators batch several checks into one judge call. Output Quality (Preview) batches fluency, coherence, intent resolution, task adherence, groundedness and task completion. Tool Use Quality (Preview) batches the five tool evaluators. The primary composite result passes only if every applicable component passes, so one failing component fails the whole.\n\nThat makes composites good for a quick gate and poor for diagnosis. To find the cause, open the component results: which component failed? A failing task adherence points to instructions or policy; a failing groundedness points to retrieval or the prompt; a failing tool component points to a specific step.\n\nEvaluators return Pass or Fail, or a 1 to 5 score converted by a threshold (default 3). Most are AI-assisted, using a judge model deployment.\n\nNote that Quality Grader is deprecated.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/agent-evaluators", "https://learn.microsoft.com/en-us/azure/foundry/concepts/built-in-evaluators"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 2, "q": "In an agent evaluation, Intent Resolution scores are low for a booking assistant. Transcripts show the agent often answers a different question than the user asked, even though its tool calls succeed. What does the score tell you?", "o": [{"t": "The tool calls are technically failing", "c": false, "e": "Tool Call Success covers that, and it is fine here."}, {"t": "The agent misunderstands what the user wants, so improve instructions, examples or clarification behavior", "c": true, "e": "Intent Resolution measures whether the agent understood the user's goal."}, {"t": "The model deployment is out of quota", "c": false, "e": "Quota would cause 429 errors, not misunderstanding."}, {"t": "The memory store is full", "c": false, "e": "Memory is not the cause of misread intent."}], "concept": "Agent evaluators give you separate questions. Intent Resolution asks: did the agent understand what the user wanted? Task Adherence asks: did it follow the system instructions and policy? Task Completion asks: did it finish with a usable deliverable? Customer Satisfaction asks whether the user would be happy. The process evaluators look at tools.\n\nA low Intent Resolution score with successful tool calls tells you the problem is understanding, not execution. Common remedies are clearer instructions that restate what the agent should ask when the request is ambiguous, few-shot examples of tricky requests, and a clarifying question before acting.\n\nCompare with the neighbors: a low Task Adherence means the agent knew the goal but broke a rule; low Tool Selection means it knew the goal but chose the wrong tool.\n\nRead system evaluators first to see the outcome, then process evaluators to find the step.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/agent-evaluators"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 3, "q": "An image generation call fails with `InvalidPayload`. According to the error table, which fields should the team check first?", "o": [{"t": "The guardrail threshold for Violence", "c": false, "e": "Safety blocks return `contentFilter`, not `InvalidPayload`."}, {"t": "The `prompt`, `size` and `n` fields of the request", "c": true, "e": "`InvalidPayload` indicates a bad value in those fields."}, {"t": "The quota page of the subscription", "c": false, "e": "Quota problems return 429."}, {"t": "The firewall rules of the Storage account", "c": false, "e": "Storage firewalls cause different errors."}], "concept": "Error codes help you place the problem. For image generation, Learn lists: `contentFilter` when the safety system blocks a prompt or an output (change the prompt, do not retry the same text); `DeploymentNotFound` when the deployment name is wrong; 401 for bad credentials; 429 for quota (retry with exponential backoff); `content_policy_violation` for a policy problem (modify the prompt); and `InvalidPayload` for a bad `prompt`, `size` or `n`.\n\nValid values: `n` is 1 to 10; `size` for the gpt-image-1 family is 1024x1024, 1024x1536 or 1536x1024, and for GPT-Image-2 and the Sunburst and Flare models custom sizes follow rules (multiples of 16, long edge at most 3,840 pixels, aspect ratio between 1:3 and 3:1, total pixels between 655,360 and 8,294,400).\n\nLog the full request for failed calls so that invalid values are easy to see.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"], "ref": ["image-and-video-generation"]}, {"d": 3, "q": "A batch job fans out many image requests and receives HTTP 429 from the deployment. Which TWO actions fit the guidance?", "o": [{"t": "Queue the work and retry with exponential backoff instead of sending all requests at once", "c": true, "e": "The default quota is about 5 images per minute per deployment, so bursts are throttled."}, {"t": "Spread the load over several deployments or request more quota", "c": true, "e": "Capacity is limited per deployment, and quota can be increased by request."}, {"t": "Resend the same request in a tight loop until it succeeds", "c": false, "e": "This increases throttling."}, {"t": "Switch to a smaller prompt, because prompt length sets the image quota", "c": false, "e": "Quota is counted in images per minute, not prompt length."}, {"t": "Disable content safety to speed up processing", "c": false, "e": "Safety filtering is not a quota control and should stay on."}], "concept": "A quota is a ceiling on how much work a deployment accepts per minute. For the gpt-image models the default is about 5 images per minute per deployment. A job that needs 600 variants therefore needs about 120 minutes on a single deployment, and a design that assumes instant results will time out.\n\nWhen 429 appears, plan for it: put the requests in a queue, retry with exponential backoff, ramp up gradually, spread across deployments, request more quota, or use off-hours queues. Store prompts, parameters and model versions so retries are reproducible, and alert on quota errors and filter blocks.\n\nFor draft work, use `low` or `medium` quality to reduce cost, and render finals at `high`.\n\nNever fan out 100 parallel requests, and never keep safety on pause to gain speed.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"], "ref": ["image-and-video-generation", "capacity-cost-and-throttling"]}, {"d": 3, "q": "A Sora 2 job ends with the status `failed`. The web application currently shows the user a blank page. How should the backend handle this status?", "o": [{"t": "Poll the same job forever until it changes", "c": false, "e": "Final states do not change."}, {"t": "Treat `failed` as `succeeded` and download the file", "c": false, "e": "There is no file to download."}, {"t": "Create thousands of identical jobs at once", "c": false, "e": "This risks throttling and repeated failures."}, {"t": "Log the error and decide whether to retry or alert, and tell the user that the video could not be created", "c": true, "e": "`failed` and `cancelled` are final states that need a decision."}], "concept": "A video generation job moves through states until it reaches a final one: `succeeded`, `failed` or `cancelled`. Polling continues until one of these is returned.\n\nOn `succeeded`, the backend reads `generations` and downloads the file. On `failed` or `cancelled`, it logs the error, then decides: retry (if the error is temporary), change the prompt (if moderation blocked it) or alert an operator. The user must be told, because a silent failure looks like a bug.\n\nA production design stores the job ID so that a restart does not lose it, polls with a delay rather than in a tight loop, and uses a queue with a worker that notifies the user when the job is done.\n\nAzure applies input and output moderation to media generation, so a failure can come from a safety block.\n\nSora 2 is Preview, so check current limits.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/video-generation"], "ref": ["image-and-video-generation"]}, {"d": 3, "q": "A vision-capable chat model cannot read the small serial numbers printed on an uploaded equipment photo. The model replies with plausible but wrong digits. What is the recommended first improvement?", "o": [{"t": "Convert the photo to text with a translation service", "c": false, "e": "Translator does not read images."}, {"t": "Provide a higher-resolution image (or a crop of the label) and instruct the model to say when text is not readable", "c": true, "e": "Unreadable small text needs better input, and an explicit \"out\" prevents guessed digits."}, {"t": "Ask the model to always provide an answer, even if unsure", "c": false, "e": "This increases invented details."}, {"t": "Increase the temperature to get more varied digits", "c": false, "e": "More randomness increases wrong answers."}], "concept": "Vision-capable models answer questions about images, but they can invent details that are not visible. Typical causes are unreadable small text, a low-resolution image, or a prompt that forces an answer.\n\nImprovements: provide a higher-resolution image or crop the region that matters; tell the model to describe only what is visible and to say \"not readable\" or \"not visible\" when it cannot read something; and for critical values (serial numbers, amounts), verify with a purpose-built OCR step such as Document Intelligence Read or Content Understanding, which return text with confidence.\n\nAlso check that the image URL is reachable by the service: a private Blob needs a managed identity with a blob read role or a SAS URL.\n\nWhere the cost of an error is high, add a human review.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/gpt-with-vision"], "ref": ["multimodal-understanding"]}, {"d": 3, "q": "A Content Understanding video analyzer produces poor transcripts for recordings in several languages. The audio quality is good. Which configuration should the team review?", "o": [{"t": "Set the spoken language (`locales`) where applicable, because an unset language lowers transcript quality", "c": true, "e": "The analyzer transcribes speech and benefits from the correct locale."}, {"t": "Turn on `enableBarcode` for videos", "c": false, "e": "Barcode reading applies to documents."}, {"t": "Use a document analyzer instead", "c": false, "e": "Document analyzers do not process video."}, {"t": "Set `tableFormat` to markdown", "c": false, "e": "This is a document table setting."}], "concept": "Stage 1 of Content Understanding video processing is content extraction. It produces a transcript with speaker diarization and multilingual support, key frames and shot detection. Only speech is transcribed, not music or sound effects.\n\nTranscript quality depends on the language setting. When the spoken language is not set, quality can drop, so set `locales` where applicable. Other limits matter too: about one frame per second is sampled and frames are resized to 512x512, so very fast actions can be missed.\n\nFor libraries in many languages, group videos by language and configure locales per group, and evaluate with a few labeled samples.\n\nOutput is Markdown (the transcript as WEBVTT and key frames) plus JSON for fields and segments. `prebuilt-videoSearch` produces per-segment records for retrieval.\n\nVersion the analyzer, because changing the schema forces reprocessing.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/overview"], "ref": ["multimodal-understanding"]}, {"d": 3, "q": "A video analyzer splits ad breaks and program content, but the segment boundaries are inconsistent from one video to another. The content category description is \"interesting parts\". What should the team change?", "o": [{"t": "Set `enableSegment` to false and expect segments", "c": false, "e": "This turns segmentation off."}, {"t": "Write a more specific natural-language description of the category, because vague descriptions give inconsistent boundaries", "c": true, "e": "Segmentation follows the category description."}, {"t": "Add a second content category for video", "c": false, "e": "Video supports only one content category."}, {"t": "Reduce the video frame rate to 0.1 fps", "c": false, "e": "Frame rate is fixed by the service, about 1 fps."}], "concept": "Segmentation splits a video into logical chunks based on a natural-language description of a content category. With `enableSegment: true`, the analyzer uses the description to decide where a segment starts and ends. For video only one content category is supported, and segmentation uses tokens (cost).\n\nA vague description such as \"interesting parts\" leaves the model to guess, and the guesses differ between videos. A precise description names what defines a segment: \"an advertisement break that begins with a brand logo or jingle and ends when the program resumes\".\n\nTest the description on a small labeled set of videos, compare the boundaries with human judgment, and refine. Remember the other limitations: about one frame per second is sampled, so very fast actions may be missed.\n\nVersion the analyzer and batch backfills when you change it.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/overview", "https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"], "ref": ["multimodal-understanding"]}, {"d": 3, "q": "A team uses a Content Understanding image analyzer to extract the full text of scanned multi-page contracts and gets poor results. Which statement explains this?", "o": [{"t": "Contracts cannot be analyzed by any Azure service", "c": false, "e": "Document analyzers and Document Intelligence handle them."}, {"t": "Only video analyzers can read scanned pages", "c": false, "e": "Video analyzers process video."}, {"t": "Image analyzers are the preferred choice for contracts", "c": false, "e": "They are designed for photos and visual characteristics."}, {"t": "Image analyzers are not optimized for text-primary analysis; use a document analyzer or Document Intelligence for pages of text", "c": true, "e": "Learn says to use a document analyzer for text-heavy pages."}], "concept": "Content Understanding has analyzers for different content types. Image analyzers (base `prebuilt-image`, `prebuilt-imageSearch` for retrieval descriptions) extract visual characteristics and return the same fields for every image through a field schema, for example counting empty shelf slots or rating a condition. Learn says they are not optimized for text-primary analysis.\n\nPages of text, such as contracts, are the job of document analyzers (`prebuilt-document`, `prebuilt-documentSearch` for Markdown optimized for retrieval) or of Document Intelligence Read and Layout. These handle OCR, layout, tables and structure and return Markdown or fields.\n\nA simple routing rule: photos of things go to an image analyzer; pages of text go to a document analyzer; video goes to a video analyzer; mixed content can be classified first and routed.\n\nUse the narrowest tool for the content type.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/image/overview", "https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers"], "ref": ["multimodal-understanding", "content-understanding-and-document-intelligence"]}, {"d": 4, "q": "An integration team receives different HTTP errors from the Translator service. Which TWO mappings between status code and likely cause are correct?", "o": [{"t": "429 means the rate limit was exceeded; 400 means an invalid payload or unsupported language", "c": true, "e": "These are also documented."}, {"t": "403 always means the key has expired", "c": false, "e": "403 means valid credentials with an unsupported operation or configuration."}, {"t": "400 means the service is down for maintenance", "c": false, "e": "400 relates to the request content."}, {"t": "401 means a bad or missing key; 403 means valid credentials but an unsupported operation or configuration", "c": true, "e": "These are the documented meanings."}, {"t": "401 means the rate limit was exceeded", "c": false, "e": "That is 429."}], "concept": "Translator troubleshooting starts with the status code. 401: the key or token is bad or missing, so check the header `Ocp-Apim-Subscription-Key` or the bearer token. 403: the credentials are valid, but the operation or configuration is not permitted, for example using an access token when a private endpoint is enabled (a custom endpoint is required), or an operation that the resource does not support. 429: the rate limit was exceeded, so back off and retry. 400: the payload is invalid or the language is unsupported.\n\nRequest limits also cause 400-type problems: for NMT a request can hold up to 1,000 array elements of up to 50,000 characters each; for LLM translation, 50 elements of up to 5,000 characters.\n\nUse Microsoft Entra ID with managed identity for keyless authentication in enterprises.\n\nAlways log the status code and the response body together.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/overview", "https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/reference/v3/reference"], "ref": ["translation"]}, {"d": 4, "q": "A localization pipeline sends 2,000 short text segments in one Translate request that uses standard neural machine translation (NMT). The request is rejected. What is the likely limit, and what is the fix?", "o": [{"t": "NMT accepts only 10 elements; send 200 requests", "c": false, "e": "The limit is 1,000, not 10."}, {"t": "There is no limit, so wait and retry", "c": false, "e": "The limit exists and retrying will not change it."}, {"t": "The LLM path accepts 5,000 elements, so switch to it", "c": false, "e": "The LLM path is stricter, with 50 elements."}, {"t": "NMT accepts up to 1,000 array elements per request, so split the batch into two requests", "c": true, "e": "2,000 exceeds the limit of 1,000 elements."}], "concept": "The Translate operation in the `2026-06-06` API takes an `inputs` array and returns a `value` array. The limits depend on the model path. With NMT (neural machine translation), you can send up to 1,000 array elements, each up to 50,000 characters. With an LLM deployment, you can send up to 50 elements, each up to 5,000 characters. LLM translation needs a Foundry resource.\n\nBilling also differs: NMT is billed per source character; LLM translation is billed per input and output token.\n\nA sensible decision is to keep high-volume baseline traffic on NMT and send text to an LLM only where tone, context or adaptive behavior matters. LLM options include tone (formal, informal, neutral), gender and adaptive custom translation with up to five reference translations.\n\nFor large jobs, chunk the array, handle each response, and keep a cache keyed by the source hash.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/overview"], "ref": ["translation"]}, {"d": 4, "q": "A team submitted batch transcription jobs with the default settings. A week later, the transcript files are gone from the output location, although the jobs had succeeded. Which setting explains this?", "o": [{"t": "`languageIdentification`, which limits file age", "c": false, "e": "It selects the spoken language among candidates."}, {"t": "`destinationContainerUrl`, which expires every Sunday", "c": false, "e": "The container does not expire on its own."}, {"t": "`diarizationEnabled`, which deletes results after speakers are labeled", "c": false, "e": "Diarization labels speakers and does not delete files."}, {"t": "`timeToLiveHours`, which controls how long results are kept (from 6 hours to 31 days)", "c": true, "e": "Results are deleted after the time-to-live."}], "concept": "Batch transcription is asynchronous: you submit a job, wait for it by polling or a webhook, and read result files that contain text, timestamps and speaker labels. Job options include diarization, language identification (2 to 10 candidate locales), a `destinationContainerUrl` inside `properties`, and `timeToLiveHours`.\n\n`timeToLiveHours` sets how long the service keeps the results, between 6 hours and 31 days. After that time, the results are deleted. If you need the transcripts permanently, copy them to your own storage right after the job completes, or write them to your own container with `destinationContainerUrl` and manage retention yourself.\n\nOther common batch failures are diarization on stereo files (it needs mono), more than 10 candidate locales, and wrong storage permissions.\n\nDesign the pipeline so that a webhook triggers the copy and indexing step.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/batch-transcription-create"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A developer sends SSML for text to speech that contains the text `Terms & Conditions apply`. The synthesis request fails with an XML error. What is the likely cause?", "o": [{"t": "SSML does not allow the word Terms", "c": false, "e": "Words are not the problem."}, {"t": "The voice is in the wrong region only if it is an HD voice", "c": false, "e": "Region problems return different errors."}, {"t": "The `&` character is not escaped, and SSML is XML", "c": true, "e": "Special characters such as `&` must be escaped (for example as `&amp;`)."}, {"t": "SSML requires all text to be uppercase", "c": false, "e": "There is no such rule."}], "concept": "SSML (Speech Synthesis Markup Language) is XML that controls speech: rate, pitch and volume with `prosody`, pauses with `break`, pronunciation with `phoneme` and lexicons, voice or style changes inside one document, and the language for multilingual voices.\n\nBecause SSML is XML, the text inside it must follow XML rules. A raw `&` or `<` breaks the document. Escape them as `&amp;` and `&lt;`. Typical SSML failures: a tag that is not supported for the chosen voice (some tags are not supported for HD voices, personal voices and embedded voices), a wrong voice name for the region, and unescaped characters.\n\nBilling counts characters, including SSML markup except `<speak>` and `<voice>`, so verbose markup costs money.\n\nValidate the SSML as XML before sending it.", "src"
