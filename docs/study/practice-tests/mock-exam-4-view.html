<div id="app"></div>
<script>window.MOCK_EXAM = {"id": "mock-4", "title": "AI-103 Mock Exam 4", "shortTitle": "Mock exam 4", "description": "Full-length mock exam with 50 scenario questions. This test leans toward troubleshooting and security: reasoning-model settings, virtual network rules, quota and TPM limits, CI/CD pipelines, guardrail behavior, Speech and Translator customization, and Azure AI Search security.", "defaultMinutes": 120, "domains": [{"id": 1, "name": "Plan and manage an Azure AI solution", "weight": "25-30%", "count": 14}, {"id": 2, "name": "Implement generative AI and agentic solutions", "weight": "30-35%", "count": 16}, {"id": 3, "name": "Implement computer vision solutions", "weight": "10-15%", "count": 7}, {"id": 4, "name": "Implement text analysis solutions", "weight": "10-15%", "count": 7}, {"id": 5, "name": "Implement information extraction solutions", "weight": "10-15%", "count": 6}], "questions": [{"d": 1, "q": "A voice assistant uses a reasoning model for short intent classification, and users complain about a long pause before every answer. Accuracy is already high. Which change reduces latency the most?", "o": [{"t": "Set `reasoning_effort` to `none` for this latency-critical task", "c": true, "e": "Reasoning models produce hidden reasoning tokens before the first visible token. A lower effort (or `none`) removes most of that wait."}, {"t": "Move the deployment to Batch", "c": false, "e": "Batch is asynchronous with a 24-hour target."}, {"t": "Increase `max_output_tokens` to 100,000", "c": false, "e": "A larger cap does not make the model faster."}, {"t": "Add \"think step by step\" to the prompt", "c": false, "e": "This adds tokens and is not recommended for reasoning models."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning"], "ref": ["model-and-service-selection", "capacity-cost-and-throttling"]}, {"d": 1, "q": "A product team plans to run a production workload on a model labeled Preview because it has the best benchmark results. Which risk should you point out, based on the model lifecycle?", "o": [{"t": "Models move from Preview to GA, then Deprecated and Retired; production workloads need a GA model and a replacement plan, with notices and pinned versions", "c": true, "e": "When a model retires, deployments stop working, as happened with `dall-e-3` on March 4, 2026."}, {"t": "Benchmarks are invalid for Preview models", "c": false, "e": "Benchmarks exist but do not replace testing on your own data."}, {"t": "Preview models cannot be deployed in Foundry", "c": false, "e": "They can be deployed, but they are not meant for production."}, {"t": "Preview models are always more expensive than GA models", "c": false, "e": "Price is not the lifecycle risk."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/foundry-models-overview"], "ref": ["model-and-service-selection"]}, {"d": 1, "q": "You prepare the virtual network subnet for agent runtime injection in a Foundry resource. Which TWO requirements apply?", "o": [{"t": "The subnet is delegated to `Microsoft.App/environments` and is dedicated to this Foundry resource", "c": true, "e": "Missing delegation causes provisioning failures, and the agent subnet cannot be shared between Foundry resources."}, {"t": "The subnet overlaps with the peered on-premises network", "c": false, "e": "Overlapping ranges with peered networks are not allowed."}, {"t": "The subnet is a /29 range", "c": false, "e": "A /24 is recommended and the minimum for portal injection is /27."}, {"t": "The Foundry resource is in the same region as the virtual network", "c": true, "e": "Other resources may be elsewhere, but the Foundry resource must match the VNet region."}, {"t": "The subnet is shared with the application's virtual machines to save address space", "c": false, "e": "The agent subnet is dedicated per Foundry resource."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A team plans hosted agents in a locked-down environment. After the Foundry account was created, they try to add network injection and find that it cannot be added. What is the rule?", "o": [{"t": "Hosted agents do not support any network configuration", "c": false, "e": "They support it, at account creation."}, {"t": "It is only possible with a new subscription", "c": false, "e": "The restriction is about account creation, not subscriptions."}, {"t": "For hosted agents, network injection must be set when the Foundry account is first created", "c": true, "e": "It cannot be added later, so plan the network design before creating the account."}, {"t": "Network injection can be added at any time in the portal", "c": false, "e": "Learn states that it must be set at creation for hosted agents."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A chat application hits its tokens-per-minute limit at peak. Metrics show that most tokens are input tokens: a long system prompt, ten retrieved chunks and the full chat history are sent with every call. What should you do first?", "o": [{"t": "Increase `max_output_tokens`", "c": false, "e": "Output is not the problem here."}, {"t": "Retry every request three times", "c": false, "e": "More requests add more tokens and make throttling worse."}, {"t": "Buy Provisioned capacity immediately", "c": false, "e": "This is a larger commitment before checking the cheaper fix."}, {"t": "Shrink the prompt: shorten the system prompt, send fewer or smaller chunks and summarize old turns", "c": true, "e": "Prompt tokens are most of the traffic, and trimming them is cheaper than quota or PTU."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/quotas-limits"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "A new deployment fails, and the Quota page shows 0 available for the model and deployment type. Another deployment in the subscription holds quota but is unused. What should you do?", "o": [{"t": "Move quota from the unused deployment, or submit a quota increase request", "c": true, "e": "Both are documented ways to get more limit. Requests are evaluated individually."}, {"t": "Buy a reservation", "c": false, "e": "A reservation is a discount and does not add quota."}, {"t": "Add more custom headers to the request", "c": false, "e": "More than 10 custom headers returns HTTP 431."}, {"t": "Wait for the quota to reset at midnight", "c": false, "e": "Quota is an allocation, not a daily counter."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/quotas-limits"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "A security team wants alerts when users try to jailbreak the company's AI services or when data may be leaking from them. Which service provides this?", "o": [{"t": "Microsoft Defender for AI services", "c": true, "e": "It raises alerts on jailbreak attempts and data leakage."}, {"t": "Azure Policy", "c": false, "e": "It enforces configuration rules and does not detect attacks."}, {"t": "Azure Bastion", "c": false, "e": "It gives secure remote access to virtual machines."}, {"t": "Content provenance detection", "c": false, "e": "It checks where content came from."}], "src": ["https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat"], "ref": ["platform-network-and-reliability", "agent-safety-and-identity"]}, {"d": 1, "q": "You want to evaluate whether an agent used its tools efficiently compared with an expected sequence of tool calls, accepting `exact_match`, `in_order_match` or `any_order_match`. Which evaluator and prerequisite apply?", "o": [{"t": "Intent Resolution, which needs a judge deployment only", "c": false, "e": "It checks whether the agent understood the user's intent."}, {"t": "Customer Satisfaction, which compares with the system prompt", "c": false, "e": "It rates helpfulness, tone and resolution from the user's view."}, {"t": "Tool Call Success, which needs no data", "c": false, "e": "It checks only whether a call technically succeeded."}, {"t": "Task Navigation Efficiency, which needs ground truth (the expected sequence)", "c": true, "e": "It compares the agent's tool steps with an expected sequence."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/agent-evaluators"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 1, "q": "Operations wants a live view of token consumption, latency, error rates and quality scores for production agents, with alerts when outputs fail quality thresholds. What should they use?", "o": [{"t": "The CI pipeline logs", "c": false, "e": "They show build results, not production behavior."}, {"t": "The Foundry observability dashboard integrated with Application Insights, plus Azure Monitor alerts", "c": true, "e": "It shows operational metrics and quality scores in real time and supports alerts."}, {"t": "Only the model catalog benchmarks", "c": false, "e": "Benchmarks describe models, not your production traffic."}, {"t": "A one-time evaluation before launch", "c": false, "e": "It does not monitor production."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/observability"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 1, "q": "A GitHub Actions pipeline deploys a hosted agent with the Azure Developer CLI. Which TWO practices follow the guidance?", "o": [{"t": "Skip evaluation because deployment succeeded", "c": false, "e": "The pipeline should fail the run when scores fall below thresholds."}, {"t": "Store a service principal secret in the repository", "c": false, "e": "This is exactly what OIDC avoids."}, {"t": "Run deployment manually from a laptop to stay flexible", "c": false, "e": "A pipeline gives repeatability and review."}, {"t": "Authenticate with GitHub OIDC federated credentials so that no secret is stored", "c": true, "e": "Federated credentials remove stored secrets."}, {"t": "Use a concurrency group so that two runs never deploy at the same time", "c": true, "e": "It serializes deployments."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/set-up-ci-cd-cli"], "ref": ["cicd-for-foundry-projects"]}, {"d": 1, "q": "A team wants to compare two agent versions with statistical confidence in a GitHub workflow and is worried about the cost of repeated evaluations. Which guidance applies to the evaluation GitHub Action?", "o": [{"t": "Pass only the agent name without a version", "c": false, "e": "Agents are identified as `agent-name:version`."}, {"t": "List both agents as `name:version`; the first is the baseline by default; do not run it on every commit, to control cost", "c": true, "e": "Learn advises against running it on every commit and suggests running full evaluations on release candidates."}, {"t": "It cannot compare agents", "c": false, "e": "Listing several agents compares them, with confidence intervals and pairwise comparisons."}, {"t": "Run it on every commit with the full dataset", "c": false, "e": "It increases cost."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluation-github-action"], "ref": ["cicd-for-foundry-projects"]}, {"d": 1, "q": "A music-lyrics assistant must be checked for output that reproduces copyrighted song lyrics, recipes or published articles. Which evaluator should you add?", "o": [{"t": "Code Vulnerability", "c": false, "e": "It looks for insecure patterns in generated code."}, {"t": "Ungrounded Attributes", "c": false, "e": "It detects inferring protected traits not present in the context."}, {"t": "Indirect Attack", "c": false, "e": "It detects hidden instructions in content."}, {"t": "Protected Materials", "c": true, "e": "It detects copyrighted text or code in the output, including lyrics, articles and recipes."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators"], "ref": ["responsible-ai-governance"]}, {"d": 1, "q": "Which statement about the risk and safety evaluators for harm categories (hate and unfairness, sexual, violence, self-harm) is correct?", "o": [{"t": "Scores range from 0 to 7, the default threshold is 3, and a case passes if the score is less than or equal to the threshold", "c": true, "e": "A defect is a score above the threshold."}, {"t": "Scores range from 1 to 5 and 3 fails", "c": false, "e": "The 1 to 5 range belongs to many LLM-judge quality evaluators."}, {"t": "Scores are 0 or 1 only", "c": false, "e": "The harm evaluators return severity scores."}, {"t": "A case passes only if the score is higher than the threshold", "c": false, "e": "The direction is reversed. A lower score is safer."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators"], "ref": ["responsible-ai-governance"]}, {"d": 1, "q": "A line-of-business application only needs to call published agent endpoints. Developers should be able to build in the project, and one lead should publish agents. Which role assignment follows least privilege?", "o": [{"t": "The Azure AI Developer role for the application", "c": false, "e": "This role is not recommended for Foundry projects."}, {"t": "Foundry Agent Consumer for the application, Foundry User for developers and Foundry Project Manager for the lead", "c": true, "e": "Consumer calls agents only, User builds in a project, and Project Manager can publish agents."}, {"t": "Foundry Owner for everyone", "c": false, "e": "This gives broad privileges to all."}, {"t": "Foundry Account Owner for developers", "c": false, "e": "Account Owner manages accounts and models but cannot build in projects."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry"], "ref": ["agent-safety-and-identity", "platform-network-and-reliability"]}, {"d": 2, "q": "A team wants hosted agents and multi-agent systems written in code (Python or .NET) that run in Foundry as hosted agents. Which SDK or framework should they use?", "o": [{"t": "OpenAI SDK for images", "c": false, "e": "It is for image calls."}, {"t": "Speech SDK", "c": false, "e": "It is for speech scenarios."}, {"t": "Foundry Tools SDK for Content Safety", "c": false, "e": "It is for content safety calls."}, {"t": "Microsoft Agent Framework", "c": true, "e": "It provides agents, graph-based workflows, middleware, tools and MCP clients, and its workflows can run in Foundry as a hosted agent."}], "src": ["https://learn.microsoft.com/en-us/agent-framework/overview/agent-framework-overview"], "ref": ["foundry-sdk-and-generative-apps", "building-agents-with-foundry"]}, {"d": 2, "q": "A prompt for a non-reasoning model asks it to decide which of three suppliers is cheapest after tax. Answers are sometimes wrong. Which technique should you add?", "o": [{"t": "Raise the temperature to 1.5", "c": false, "e": "More randomness reduces consistency."}, {"t": "Remove all instructions", "c": false, "e": "The model needs clear instructions."}, {"t": "Chain of thought: ask for step-by-step reasoning before the final answer, in a fixed format such as \"ANSWER is: <name>\"", "c": true, "e": "It reduces errors and makes review easier on non-reasoning models."}, {"t": "Use `reasoning_effort=max` on the same non-reasoning model", "c": false, "e": "This setting belongs to reasoning models."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering"], "ref": ["prompt-engineering-parameters-and-reflection"]}, {"d": 2, "q": "A fact-checking tool asks the model to \"fact-check this paragraph\" and the results are shallow. Which prompt-design change does Microsoft guidance suggest?", "o": [{"t": "Increase `max_output_tokens`", "c": false, "e": "A larger cap does not change how the task is structured."}, {"t": "Tell the model never to be wrong", "c": false, "e": "This is vague and has no effect."}, {"t": "Break the task into two steps: first extract the factual claims, then write a search query for each claim", "c": true, "e": "Each step is easier to perform and to inspect."}, {"t": "Make the prompt a single very long sentence", "c": false, "e": "Complexity hurts clarity."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering"], "ref": ["prompt-engineering-parameters-and-reflection"]}, {"d": 2, "q": "A knowledge assistant's instruction says \"Do not fabricate information\", but reviewers still find invented facts. Which instruction change is more effective?", "o": [{"t": "Remove the retrieved context", "c": false, "e": "The model then relies on memory."}, {"t": "Ask for inline citations next to each claim, so an invented statement needs a false claim and a false citation, and checking becomes easy", "c": true, "e": "Citations make fabrication harder and verification simple. Closer citations work better than a list at the end."}, {"t": "Raise the temperature", "c": false, "e": "This increases invention."}, {"t": "Repeat \"do not fabricate\" ten times", "c": false, "e": "Weak instructions do not become stronger by repetition."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering"], "ref": ["prompt-engineering-parameters-and-reflection"]}, {"d": 2, "q": "Retrieval evaluators show low scores. Reading sample chunks, you find that each chunk covers many unrelated topics and ranks poorly for specific questions. Which step is at fault and what is the fix?", "o": [{"t": "Logging: store more traces", "c": false, "e": "Logs help diagnose but do not change retrieval."}, {"t": "Chunking: the chunks are too large and their meaning is blurred; tune the size and overlap (for example start from 512 tokens with 25% overlap)", "c": true, "e": "Large chunks produce a vector that blends topics and a prompt full of noise."}, {"t": "Generation: lower the temperature", "c": false, "e": "Generation cannot fix poor retrieval."}, {"t": "Reranking: disable the semantic ranker", "c": false, "e": "The ranker cannot rescue a chunk that blurs meaning."}], "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-chunk-documents"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A RAG assistant should answer only when retrieval confidence is high and otherwise reply \"not found\". Semantic ranker scores range from 0 to 4. Which design is most appropriate?", "o": [{"t": "Use `orderby` to put the best document first", "c": false, "e": "Explicit sorting overrides relevance ranking."}, {"t": "Always answer and rely on a polite tone", "c": false, "e": "Low-confidence answers would still be shown."}, {"t": "Apply a score threshold on the reranker score (kept coarse, because score distributions can shift slightly) and return \"not found\" below it", "c": true, "e": "A relevance threshold raises precision at the cost of recall."}, {"t": "Set a very fine threshold such as 3.2137", "c": false, "e": "Scores can shift slightly with infrastructure or model updates, so fine-grained thresholds are fragile."}], "src": ["https://learn.microsoft.com/en-us/azure/search/semantic-search-overview"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "Which similarity metric should you configure for a vector field that holds Azure OpenAI embeddings in Azure AI Search?", "o": [{"t": "`cosine`", "c": true, "e": "It is the recommended metric for Azure OpenAI embeddings. The vector score for cosine is `1 / (1 + cosine_distance)`."}, {"t": "Any metric, because the result is the same", "c": false, "e": "The metric must match how the embedding model was trained."}, {"t": "`hamming`", "c": false, "e": "It is for binary vectors."}, {"t": "`jaccard`", "c": false, "e": "It is a set similarity, not a vector metric in this configuration."}], "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-ranking"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A developer wants the model to return a text field that must match a regular expression and have a minimum length, using strict Structured Outputs. What should they do?", "o": [{"t": "Switch to JSON mode, which enforces patterns", "c": false, "e": "JSON mode only guarantees valid JSON."}, {"t": "Add `pattern` and `minLength` to the schema and trust the service to enforce them", "c": false, "e": "They are not supported in strict mode."}, {"t": "Increase the temperature so the model varies the text", "c": false, "e": "Randomness does not enforce patterns."}, {"t": "Enforce `pattern` and `minLength` in application code, because these keywords are not supported in the strict schema subset", "c": true, "e": "Unsupported keywords include `minLength`, `maxLength`, `pattern`, `format`, `minimum` and `maximum`."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/structured-outputs"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "An engineer tries to add a function definition to a Foundry agent in the portal and cannot find the option. What is the situation?", "o": [{"t": "The agent type does not support functions", "c": false, "e": "Prompt agents support function tools."}, {"t": "The portal cannot add, edit or remove function definitions; use the SDK or REST API. The portal can run an agent that already has them, but it does not execute your function", "c": true, "e": "Function tools are defined in code and executed by your application."}, {"t": "The function must be written in the system prompt", "c": false, "e": "Prompts do not define callable functions."}, {"t": "A Provisioned deployment is required", "c": false, "e": "Deployment type is unrelated."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "A memory store keeps user profile facts. The privacy officer wants the extractor to avoid age, financial information, precise location and credentials, and old entries to expire automatically. Which settings apply?", "o": [{"t": "A shared static scope for all users", "c": false, "e": "It removes isolation."}, {"t": "`chat_summary_enabled` set to false", "c": false, "e": "This disables summaries, not sensitive profile data."}, {"t": "Put the rules in the system prompt only", "c": false, "e": "The extractor needs its own guidance, and prompts do not control retention."}, {"t": "`user_profile_details` with instructions on what to avoid, and `default_ttl_seconds` for retention", "c": true, "e": "These settings tell the extractor what not to store and set a default lifetime for new entries."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/what-is-memory"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "A team asks in which order to add capabilities to a new customer agent. Which order follows the recommended build order?", "o": [{"t": "Publish first, test later", "c": false, "e": "Publishing before testing exposes users to problems."}, {"t": "Memory first, then a single tool", "c": false, "e": "Memory is useful after repeated users appear and the base works."}, {"t": "Multiple agents first, tools later", "c": false, "e": "Orchestration adds complexity before the basics work."}, {"t": "One agent with one or two tools and a golden test set, then retrieval, then memory, then approvals for risky tools, then tracing and evaluators, and only then multiple agents", "c": true, "e": "Add complexity step by step and measure after each."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/overview"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "An agent worker looks up its agent by name at startup and creates it only if the lookup returns 404. Later, a call with the stored agent ID returns 404 although the ID worked yesterday. What is the correct handling?", "o": [{"t": "Rename the agent in the portal", "c": false, "e": "A saved agent's name cannot change, and renaming does not restore it."}, {"t": "Increase the deployment quota", "c": false, "e": "Quota errors are 429, not 404."}, {"t": "Treat the 404 for a previously valid ID as terminal: the agent was deleted, so recreate it (get-or-create) instead of retrying in a loop", "c": true, "e": "Retrying a deleted resource never succeeds. Define agents as code so they can be recreated reliably."}, {"t": "Retry with exponential backoff until the agent reappears", "c": false, "e": "Backoff is for throttling, and a deleted agent does not return."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/development-lifecycle"], "ref": ["observability-and-agent-lifecycle", "building-agents-with-foundry"]}, {"d": 2, "q": "A guardrail has a Violence control in annotate-only mode. The response annotation shows `detected: true, filtered: false`. What does it mean?", "o": [{"t": "The content was safe", "c": false, "e": "Safe content is annotated but never filtered and is not flagged as detected."}, {"t": "The content was blocked", "c": false, "e": "A blocked item has `filtered: true`."}, {"t": "The content was detected at or above the threshold but allowed through; annotate mode is useful for tuning false positives before turning blocking on", "c": true, "e": "`detected` means seen, `filtered` means blocked."}, {"t": "The guardrail is not assigned", "c": false, "e": "Then there would be no annotation."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "You add a Groundedness control to a guardrail that is assigned to both a model deployment and an agent. The control works for the model but never blocks anything for the agent. Why?", "o": [{"t": "The agent's temperature is too low", "c": false, "e": "Temperature does not affect a guardrail."}, {"t": "Guardrails need a separate Azure Policy to run", "c": false, "e": "Guardrails are assigned directly."}, {"t": "Groundedness is not yet supported for agents; a control with an unsupported risk silently does not take effect for the agent", "c": true, "e": "Groundedness applies to models only, while the same guardrail still works for models."}, {"t": "The agent uses a Provisioned deployment", "c": false, "e": "Deployment type does not matter."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "You add tool call and tool response controls to an agent's guardrail. Which TWO statements are correct?", "o": [{"t": "They are GA for agents and models alike", "c": false, "e": "Tool call and tool response controls are preview and for agents only."}, {"t": "Each intervention point adds roughly 50 to 100 ms of latency", "c": true, "e": "It depends on content length and the number of controls."}, {"t": "They replace the need to enforce limits in tool code", "c": false, "e": "Prompts and filters guide, while code and permissions enforce."}, {"t": "They scan every tool, including all MCP servers", "c": false, "e": "Only tools that support moderation are covered."}, {"t": "They work only with tools that support moderation, such as Azure AI Search, Azure Functions, OpenAPI, SharePoint grounding, Fabric Data Agent, Bing grounding, Bing Custom Search and Browser Automation", "c": true, "e": "For other tools these controls do nothing."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A long-running Microsoft Agent Framework workflow must survive a process restart and resume from where it stopped. What should you use?", "o": [{"t": "Increase the model's context window", "c": false, "e": "Context size is not workflow state."}, {"t": "Workflow checkpoints, saved at the end of each superstep, resumed from a `checkpoint_id`, with Azure Cosmos DB as the production store", "c": true, "e": "A checkpoint captures executor state, pending messages and shared state."}, {"t": "Keep the state in a local variable", "c": false, "e": "It is lost on restart."}, {"t": "Use a higher `temperature`", "c": false, "e": "It does not preserve state."}], "src": ["https://learn.microsoft.com/en-us/agent-framework/workflows/checkpoints"], "ref": ["building-agents-with-foundry"]}, {"d": 3, "q": "A request for a photorealistic image of a minor is blocked by the image generation service. Which statement is correct?", "o": [{"t": "Photorealistic images of minors are blocked by default; access needs a request form (enterprise-tier customers are auto-approved)", "c": true, "e": "This is a built-in responsible AI control."}, {"t": "The request must be sent with `output_format=JPEG`", "c": false, "e": "The format is not related."}, {"t": "The block is a quota error that will clear after a few minutes", "c": false, "e": "This is a policy block, not a quota error."}, {"t": "The block disappears when you set `quality` to `low`", "c": false, "e": "Quality does not affect the policy."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"], "ref": ["image-and-video-generation", "responsible-ai-for-multimodal-content"]}, {"d": 3, "q": "A designer asks for a logo with a transparent background and a small file for the web. Which TWO statements about gpt-image output options are correct?", "o": [{"t": "JPEG output supports a transparent background", "c": false, "e": "JPEG has no alpha channel."}, {"t": "`output_compression` (0 to 100) applies to JPEG only", "c": true, "e": "It does not change PNG output."}, {"t": "WEBP output is supported with `output_compression`", "c": false, "e": "WEBP is not supported."}, {"t": "The response returns a URL valid for one hour", "c": false, "e": "The gpt-image models return base64 in `b64_json`."}, {"t": "Transparent backgrounds need PNG output", "c": true, "e": "`background` can be `transparent` only with PNG."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"], "ref": ["image-and-video-generation"]}, {"d": 3, "q": "An e-commerce team wants to merge a product photo and three style reference images into one edited image. Which limits apply to the image edit endpoint?", "o": [{"t": "A mask with any size", "c": false, "e": "The mask must match the input dimensions."}, {"t": "Up to 16 input images in `image[]`, each under 50 MB and PNG or JPG; the mask must have the same dimensions as the input", "c": true, "e": "These are the documented edit limits."}, {"t": "Any image format, including WEBP and TIFF", "c": false, "e": "The documented formats are PNG and JPG."}, {"t": "Only one image per request, under 4 MB", "c": false, "e": "Multiple images are supported."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"], "ref": ["image-and-video-generation"]}, {"d": 3, "q": "A Content Understanding analyzer for ads uses `enableSegment: true` to split videos into \"ads\" and \"game play\" segments. The team asks for three categories. What applies?", "o": [{"t": "Video supports up to 200 categories", "c": false, "e": "The 200-category limit is for document classification."}, {"t": "Segmentation works only for audio", "c": false, "e": "It works for video here."}, {"t": "For video only one content category is supported, and segmentation uses tokens, so it adds cost", "c": true, "e": "Video segmentation takes a single natural-language category description."}, {"t": "Segmentation is free and unlimited", "c": false, "e": "It uses tokens."}], "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/overview"], "ref": ["multimodal-understanding", "content-understanding-and-document-intelligence"]}, {"d": 3, "q": "A vision chat model describes details in a photo that are not actually visible (for example the brand of a blurry product). Which prompt change reduces this?", "o": [{"t": "Remove the question text", "c": false, "e": "The model needs a clear task."}, {"t": "Instruct it to describe only what is visible and to say \"not visible\" when something cannot be seen", "c": true, "e": "Giving the model an out reduces invented details. For small text, also provide a higher-resolution image."}, {"t": "Raise the temperature", "c": false, "e": "This increases invented details."}, {"t": "Ask it to guess brands from context", "c": false, "e": "Guessing increases errors."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/gpt-with-vision"], "ref": ["multimodal-understanding"]}, {"d": 3, "q": "A legacy application uses Image Analysis 4.0 for captions, tags and OCR. What should the team plan?", "o": [{"t": "Migration to Custom Translator", "c": false, "e": "That is a translation service."}, {"t": "No action, because retirement dates never apply to Azure features", "c": false, "e": "Retirement notices do apply."}, {"t": "Migration toward vision-capable models or Content Understanding before Image Analysis 4.0 retires on September 25, 2028", "c": true, "e": "It still works until then, but new work should use models or Content Understanding."}, {"t": "Immediate removal, because the feature is already retired", "c": false, "e": "It retires in 2028."}], "src": ["https://learn.microsoft.com/en-us/azure/ai-services/computer-vision/how-to/call-analyze-image-40"], "ref": ["multimodal-understanding"]}, {"d": 3, "q": "A team filters only the text prompt before sending it to an image generator and ships the images directly. Reviewers find an image with unwanted content produced from a harmless prompt. What is the gap?", "o": [{"t": "Image severity uses a scale from 0 to 100", "c": false, "e": "Image severity uses 0, 2, 4 and 6."}, {"t": "Filters must apply on both sides: the prompt going in and the generated media coming out", "c": true, "e": "A harmless prompt can still produce a flagged image, so the output needs its own filter and review."}, {"t": "The prompt filter threshold should be higher", "c": false, "e": "The input was harmless, so the gap is on the output side."}, {"t": "Filtering is not needed for images", "c": false, "e": "Content safety classifies text and images."}], "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/harm-categories"], "ref": ["responsible-ai-for-multimodal-content"]}, {"d": 4, "q": "Which feature is listed among the core Azure Language capabilities without a retirement notice, so it remains a good choice for a new project that must find and mask social security numbers?", "o": [{"t": "PII detection", "c": true, "e": "It is listed as a core feature, together with language detection, named entity recognition and text analytics for health."}, {"t": "Key phrase extraction", "c": false, "e": "It retires on March 31, 2029."}, {"t": "Conversational language understanding", "c": false, "e": "It retires on March 31, 2029."}, {"t": "Sentiment analysis", "c": false, "e": "It retires on March 31, 2029."}], "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "An insurer must extract policy numbers like `POL-2026-00417` from claim emails. The prebuilt NER categories (Person, Location, Organization, DateTime, Quantity) do not include them. Which option fits?", "o": [{"t": "Language detection", "c": false, "e": "It identifies languages only."}, {"t": "Sentiment analysis", "c": false, "e": "It labels sentiment."}, {"t": "Custom named entity recognition trained on labeled examples", "c": true, "e": "Use custom NER when prebuilt categories do not cover what you need."}, {"t": "Prebuilt NER with a larger confidence threshold", "c": false, "e": "The category does not exist, so a threshold does not help."}], "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A team wants to start with conversational language understanding quickly, with no labeled data. Which path is documented?", "o": [{"t": "Use batch transcription", "c": false, "e": "It converts audio to text."}, {"t": "Train a custom model first, then define the schema", "c": false, "e": "The custom path defines the schema first, then labels and trains."}, {"t": "Use Custom question answering because it extracts intents", "c": false, "e": "It answers questions from a knowledge base."}, {"t": "The LLM-powered quick deploy: define the schema with intent descriptions, deploy, then predict intents and prebuilt entities", "c": true, "e": "It skips labeling and training. The custom machine-learned path needs labeled utterances and training."}], "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A batch transcription job must label speakers in a meeting with 6 participants, using mono audio. Which setting should you use?", "o": [{"t": "Diarization with minimum and maximum speaker counts (up to 35 speakers) instead of the simple two-speaker setting", "c": true, "e": "`diarizationEnabled` handles two speakers, and min/max settings handle three or more on mono audio."}, {"t": "Stereo audio with diarization", "c": false, "e": "Diarization needs mono audio."}, {"t": "`diarizationEnabled` only", "c": false, "e": "It is for two speakers."}, {"t": "Text to speech with six voices", "c": false, "e": "It produces audio and does not label speakers in a recording."}], "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/batch-transcription-create"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A call-center app translates live speech into four languages at the same time with the Speech service. Which statement is correct?", "o": [{"t": "Speech translation supports unlimited targets with no extra cost", "c": false, "e": "There is a limit of two direct targets."}, {"t": "Only Translator document translation can handle live audio", "c": false, "e": "Document translation handles files."}, {"t": "Speech translation cannot be used with custom speech models", "c": false, "e": "Custom speech models can be used with speech translation."}, {"t": "The Speech service translates directly into two target languages; for more, use a Foundry (multi-service) resource, where translation fees apply for each language beyond the second", "c": true, "e": "This is the documented limit for speech translation."}], "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/speech-translation"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A team has a large parallel corpus of English and German product text from a stable domain and wants a custom neural machine translation system that can be measured by BLEU. Which option fits?", "o": [{"t": "Adaptive custom translation with five pairs", "c": false, "e": "It adapts an LLM from 5 to 10,000 aligned pairs, which is not a trained NMT system."}, {"t": "Glossary only", "c": false, "e": "A glossary maps fixed terms and does not train a model."}, {"t": "Transliterate", "c": false, "e": "It converts script, not languages."}, {"t": "Custom Translator, which trains a custom NMT system from parallel documents and reports a BLEU score", "c": true, "e": "Gains of 5 to 10 BLEU points are common with suitable data."}], "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/custom-translator/overview"], "ref": ["translation"]}, {"d": 4, "q": "A voice team uses HD voices and wants to use all SSML tags they used with standard neural voices. What should they know?", "o": [{"t": "Some SSML tags are not supported for HD voices, personal voices and embedded voices, so test the markup with the chosen voice", "c": true, "e": "This is a documented limitation."}, {"t": "HD voices cannot be used with SSML at all", "c": false, "e": "Some SSML tags are supported."}, {"t": "SSML is only for speech recognition", "c": false, "e": "SSML controls speech synthesis."}, {"t": "All SSML tags work identically for all voices", "c": false, "e": "This is not true for HD voices."}], "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/text-to-speech"], "ref": ["speech-solutions"]}, {"d": 5, "q": "An indexer reads rows from Azure SQL Database. After the first run, edited rows are not picked up by later runs. What should you check?", "o": [{"t": "The vector profile", "c": false, "e": "It is unrelated to row changes."}, {"t": "The number of replicas", "c": false, "e": "Replicas affect concurrency."}, {"t": "Change detection must be enabled for Azure SQL and Cosmos DB sources (for example a high water mark policy); it is automatic only for blobs", "c": true, "e": "Without it, every run rereads everything or misses changes."}, {"t": "The semantic ranker", "c": false, "e": "It does not affect indexer change detection."}], "src": ["https://learn.microsoft.com/en-us/azure/search/search-indexer-overview"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A RAG index must return the whole parent document when a chunk matches, while search runs over chunks. Which feature supports this pattern?", "o": [{"t": "Index projections, which create a secondary index of chunks while the parent index holds the whole document", "c": true, "e": "Matches in chunks return the parent, which is good for chat and RAG."}, {"t": "The enrichment cache", "c": false, "e": "It reuses skill outputs."}, {"t": "Knowledge store tables", "c": false, "e": "They are for analytics outputs."}, {"t": "A synonym map", "c": false, "e": "It expands search terms."}], "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-integrated-vectorization"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A security review of Azure AI Search asks which controls you must configure yourself. Which TWO are correct?", "o": [{"t": "TLS 1.2/1.3 on port 443 and 256-bit AES at rest", "c": false, "e": "These are built in and need no action."}, {"t": "Restrict network access with an IP firewall or a private endpoint", "c": true, "e": "Network access is something you configure."}, {"t": "Resource logs record which user ran each query", "c": false, "e": "Resource logs record operations and query text but not user identity."}, {"t": "Prefer Microsoft Entra ID with role-based access control over API keys, and connect indexers to data sources with a managed identity", "c": true, "e": "Keyless, role-based access is the recommended pattern."}, {"t": "Search data is used by Microsoft to train models", "c": false, "e": "Microsoft does not use your data to train models."}], "src": ["https://learn.microsoft.com/en-us/azure/search/search-security-built-in"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A team wants agentic retrieval with LLM-based query planning, answer synthesis and non-minimal reasoning effort. The GA REST version `2026-04-01` is used. What should they know?", "o": [{"t": "The GA version covers minimal, extractive retrieval; LLM query planning, answer synthesis, non-minimal effort and multi-turn messages come with `2026-08-01-preview`", "c": true, "e": "Choose the API version that matches the needed features, and remember that preview features can change."}, {"t": "GA `2026-04-01` already includes all features", "c": false, "e": "The preview version adds the advanced ones."}, {"t": "Agentic retrieval needs no language model", "c": false, "e": "Planning and synthesis use an Azure OpenAI model."}, {"t": "Query planning is always skipped", "c": false, "e": "At `low` or `medium` effort an LLM plans subqueries; `minimal` skips it."}], "src": ["https://learn.microsoft.com/en-us/azure/search/agentic-retrieval-overview"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A team analyzes only digital (not scanned) PDFs with a Content Understanding document analyzer and wants faster processing. Which configuration change helps?", "o": [{"t": "Set `returnDetails` to true", "c": false, "e": "It makes the response bigger."}, {"t": "Set `enableOcr` to false, because digital PDFs already contain text", "c": true, "e": "OCR defaults to true for scans and can be disabled for digital PDFs to go faster."}, {"t": "Turn on `enableFigureAnalysis`", "c": false, "e": "It is off by default and adds processing."}, {"t": "Set `enableLayout` to true", "c": false, "e": "It is already the default and adds structure, not speed."}], "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "A company has its own internal claim form that no prebuilt model recognizes, with the same layout every time. They can provide labeled sample forms. Which Document Intelligence option fits?", "o": [{"t": "A video analyzer", "c": false, "e": "It is for video."}, {"t": "The prebuilt invoice model", "c": false, "e": "It is designed for invoices."}, {"t": "Read only", "c": false, "e": "It returns text but not named fields."}, {"t": "A custom model trained on labeled examples of the form", "c": true, "e": "Custom models are for your own forms. Prebuilt models cover invoices, receipts and IDs."}], "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/document/overview"], "ref": ["content-understanding-and-document-intelligence"]}]};</script>
