 data and has no BLEU training report. Transliterate converts scripts.\n\nMemory aid: Custom Translator is the language school with exams (BLEU); adaptive is a cheat sheet of examples.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/custom-translator/overview"], "ref": ["translation"]}, {"d": 4, "q": "A voice team uses HD voices and wants to use all SSML tags they used with standard neural voices. What should they know?", "o": [{"t": "Some SSML tags are not supported for HD voices, personal voices and embedded voices, so test the markup with the chosen voice", "c": true, "e": "This is a documented limitation."}, {"t": "HD voices cannot be used with SSML at all", "c": false, "e": "Some SSML tags are supported."}, {"t": "SSML is only for speech recognition", "c": false, "e": "SSML controls speech synthesis."}, {"t": "All SSML tags work identically for all voices", "c": false, "e": "This is not true for HD voices."}], "concept": "SSML (Speech Synthesis Markup Language) controls speech synthesis: voice, rate, pitch, pauses, pronunciation, styles. Not every feature is available on every voice type.\n\nStandard neural voices support a broad set of SSML tags. HD voices, personal voices and embedded voices (voices that run on a device) do not support some tags. So if a team moves from standard neural voices to HD voices, some of the markup they relied on can be ignored or fail.\n\nThe right practice: check the documentation for the chosen voice type, and test the markup with that voice by listening to the result. Keep a small set of test sentences that exercise each tag.\n\nHD voices can be used with SSML, and SSML is for synthesis (text to speech), not for recognition.\n\nMemory aid: different instruments read the same sheet music a little differently; play it on the instrument you will perform with.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/text-to-speech"], "ref": ["speech-solutions"]}, {"d": 5, "q": "An indexer reads rows from Azure SQL Database. After the first run, edited rows are not picked up by later runs. What should you check?", "o": [{"t": "The vector profile", "c": false, "e": "It is unrelated to row changes."}, {"t": "The number of replicas", "c": false, "e": "Replicas affect concurrency."}, {"t": "Change detection must be enabled for Azure SQL and Cosmos DB sources (for example a high water mark policy); it is automatic only for blobs", "c": true, "e": "Without it, every run rereads everything or misses changes."}, {"t": "The semantic ranker", "c": false, "e": "It does not affect indexer change detection."}], "concept": "An indexer needs to know which source records are new or changed. For Azure Blob Storage this is automatic, because blobs have a last-modified timestamp that the indexer uses.\n\nFor Azure SQL Database and Azure Cosmos DB, change detection must be enabled by you. For SQL, you use a change detection policy such as a high water mark column (a column that only increases, such as a rowversion or timestamp) or SQL integrated change tracking. Without a policy, after the first run the indexer may not know which rows changed, so edited rows are not picked up as expected.\n\nThe semantic ranker, a vector profile and replicas are query-side features and do not affect which rows the indexer reads.\n\nRemember that deletions need a separate deletion detection policy (a soft-delete column), because change detection does not find removed rows.\n\nMemory aid: the high water mark is the line where the tide reached last time.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-indexer-overview"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A RAG index must return the whole parent document when a chunk matches, while search runs over chunks. Which feature supports this pattern?", "o": [{"t": "Index projections, which create a secondary index of chunks while the parent index holds the whole document", "c": true, "e": "Matches in chunks return the parent, which is good for chat and RAG."}, {"t": "The enrichment cache", "c": false, "e": "It reuses skill outputs."}, {"t": "Knowledge store tables", "c": false, "e": "They are for analytics outputs."}, {"t": "A synonym map", "c": false, "e": "It expands search terms."}], "concept": "In RAG you often search small chunks but want to answer with larger context. Chunks give precise matching. The whole parent document (or section) gives the model enough context to answer.\n\nIndex projections solve this in Azure AI Search. A skillset splits each parent document into chunks and projects the chunks into a secondary index as separate documents, each with a field that points to the parent. The parent index keeps one record per whole document. Search runs over the chunk index; after a hit you use the parent key to fetch the parent document or its metadata.\n\nA knowledge store writes enriched data to storage for analytics and does not serve queries. The enrichment cache avoids repeated work during reruns. A synonym map expands search terms.\n\nMemory aid: look up the chapter in the index at the back of the book, then open the whole book at that page.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-integrated-vectorization"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A security review of Azure AI Search asks which controls you must configure yourself. Which TWO are correct?", "o": [{"t": "TLS 1.2/1.3 on port 443 and 256-bit AES at rest", "c": false, "e": "These are built in and need no action."}, {"t": "Restrict network access with an IP firewall or a private endpoint", "c": true, "e": "Network access is something you configure."}, {"t": "Resource logs record which user ran each query", "c": false, "e": "Resource logs record operations and query text but not user identity."}, {"t": "Prefer Microsoft Entra ID with role-based access control over API keys, and connect indexers to data sources with a managed identity", "c": true, "e": "Keyless, role-based access is the recommended pattern."}, {"t": "Search data is used by Microsoft to train models", "c": false, "e": "Microsoft does not use your data to train models."}], "concept": "Azure AI Search security has controls that Microsoft provides by default, and controls that you configure.\n\nProvided: encrypted traffic (TLS 1.2 or 1.3 on port 443) and encryption at rest with 256-bit AES. Search content is not used by Microsoft to train models. These are not tasks for you.\n\nConfigured by you: authentication and authorization (prefer Microsoft Entra ID with role-based access control over API keys, and connect indexers to data sources with a managed identity so no connection string with a secret is needed), and network access (an IP firewall or a private endpoint). You also decide about logging: resource logs for queries are available when you enable diagnostic settings, but they do not identify users by default.\n\nSo the two correct statements are the Entra ID with managed identity and the network restriction.\n\nMemory aid: the hotel provides the lock on the door; you decide who gets the key and which corridors are open.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-security-built-in"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A team wants agentic retrieval with LLM-based query planning, answer synthesis and non-minimal reasoning effort. The GA REST version `2026-04-01` is used. What should they know?", "o": [{"t": "The GA version covers minimal, extractive retrieval; LLM query planning, answer synthesis, non-minimal effort and multi-turn messages come with `2026-08-01-preview`", "c": true, "e": "Choose the API version that matches the needed features, and remember that preview features can change."}, {"t": "GA `2026-04-01` already includes all features", "c": false, "e": "The preview version adds the advanced ones."}, {"t": "Agentic retrieval needs no language model", "c": false, "e": "Planning and synthesis use an Azure OpenAI model."}, {"t": "Query planning is always skipped", "c": false, "e": "At `low` or `medium` effort an LLM plans subqueries; `minimal` skips it."}], "concept": "Agentic retrieval in Azure AI Search is available in a GA version and in newer preview versions, and the capabilities differ.\n\nThe GA REST version `2026-04-01` covers minimal, extractive retrieval: you send a query, the knowledge base runs retrieval against the sources and returns grounding data and references, without an LLM planning step. The richer features, such as LLM query planning (decomposing a question into subqueries), answer synthesis, non-minimal reasoning effort and multi-turn messages, come with the preview version `2026-08-01-preview`.\n\nSo a team that needs LLM planning and answer synthesis must use the preview API and accept that preview features can change. The claim that GA includes everything is wrong, and an LLM is needed for planning and synthesis.\n\nDecision: if a production workload must stay on GA, use the minimal mode and do planning in your application; if you need the full feature set, plan for preview risk.", "src": ["https://learn.microsoft.com/en-us/azure/search/agentic-retrieval-overview"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A team analyzes only digital (not scanned) PDFs with a Content Understanding document analyzer and wants faster processing. Which configuration change helps?", "o": [{"t": "Set `returnDetails` to true", "c": false, "e": "It makes the response bigger."}, {"t": "Set `enableOcr` to false, because digital PDFs already contain text", "c": true, "e": "OCR defaults to true for scans and can be disabled for digital PDFs to go faster."}, {"t": "Turn on `enableFigureAnalysis`", "c": false, "e": "It is off by default and adds processing."}, {"t": "Set `enableLayout` to true", "c": false, "e": "It is already the default and adds structure, not speed."}], "concept": "Content Understanding document analyzers can run OCR on pages. OCR is needed for scanned documents and images, where text is only pixels. A digital PDF already contains a text layer, so reading the text directly is faster and more accurate than recognizing it from pixels.\n\nIf you process only digital PDFs, you can set `enableOcr` to false. The analyzer skips OCR work and finishes faster. If a scanned file appears later, OCR must be on, otherwise its text is not recognized.\n\n`enableLayout` adds structure detection such as tables and paragraphs; turning it on adds work, not speed. `returnDetails` returns more information, such as word-level details, and also adds output. `enableFigureAnalysis` analyzes charts and figures, which adds processing time.\n\nMemory aid: do not photocopy and re-read a typed page; read the typed text.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "A company has its own internal claim form that no prebuilt model recognizes, with the same layout every time. They can provide labeled sample forms. Which Document Intelligence option fits?", "o": [{"t": "A video analyzer", "c": false, "e": "It is for video."}, {"t": "The prebuilt invoice model", "c": false, "e": "It is designed for invoices."}, {"t": "Read only", "c": false, "e": "It returns text but not named fields."}, {"t": "A custom model trained on labeled examples of the form", "c": true, "e": "Custom models are for your own forms. Prebuilt models cover invoices, receipts and IDs."}], "concept": "Document Intelligence has prebuilt models and custom models. Prebuilt models (invoice, receipt, ID, tax forms and others) cover well-known document types. Read extracts text without fields.\n\nAn internal claim form is specific to the company, so no prebuilt model recognizes its fields. Because the layout is the same every time and labeled samples are available, a custom model is the right option. You label the fields in sample forms (in Document Intelligence Studio), train the model (a template model for a fixed layout, or a neural model for more variety), test accuracy, and call it from your application. The result is fields with confidence scores.\n\nThe prebuilt invoice model expects invoices. Read only would return text with no field names. A video analyzer is for video.\n\nMemory aid: prebuilt = ready-made suit for common sizes; custom = tailored to your form.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/document/overview"], "ref": ["content-understanding-and-document-intelligence"]}]};</script>
