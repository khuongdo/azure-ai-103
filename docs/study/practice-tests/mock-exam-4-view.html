<div id="app"></div>
<script>window.MOCK_EXAM = {"id": "mock-4", "title": "AI-103 Mock Exam 4", "shortTitle": "Mock exam 4", "description": "Full-length mock exam with 50 scenario questions. This test leans toward troubleshooting and security: reasoning-model settings, virtual network rules, quota and TPM limits, CI/CD pipelines, guardrail behavior, Speech and Translator customization, and Azure AI Search security.", "defaultMinutes": 120, "domains": [{"id": 1, "name": "Plan and manage an Azure AI solution", "weight": "25-30%", "count": 14}, {"id": 2, "name": "Implement generative AI and agentic solutions", "weight": "30-35%", "count": 16}, {"id": 3, "name": "Implement computer vision solutions", "weight": "10-15%", "count": 7}, {"id": 4, "name": "Implement text analysis solutions", "weight": "10-15%", "count": 7}, {"id": 5, "name": "Implement information extraction solutions", "weight": "10-15%", "count": 6}], "questions": [{"d": 1, "q": "A voice assistant uses a reasoning model for short intent classification, and users complain about a long pause before every answer. Accuracy is already high. Which change reduces latency the most?", "o": [{"t": "Set `reasoning_effort` to `none` for this latency-critical task", "c": true, "e": "Reasoning models produce hidden reasoning tokens before the first visible token. A lower effort (or `none`) removes most of that wait."}, {"t": "Move the deployment to Batch", "c": false, "e": "Batch is asynchronous with a 24-hour target."}, {"t": "Increase `max_output_tokens` to 100,000", "c": false, "e": "A larger cap does not make the model faster."}, {"t": "Add \"think step by step\" to the prompt", "c": false, "e": "This adds tokens and is not recommended for reasoning models."}], "concept": "Latency in a reasoning model comes mostly from the thinking phase. Before the first visible word, the model generates hidden reasoning tokens, and the user waits for them. The setting `reasoning_effort` controls how much it thinks.\n\nHigher effort helps with hard multi-step problems. Short intent classification is easy, and accuracy is already high, so the extra thinking buys nothing. Setting `reasoning_effort` to `none` (where the model supports it) removes or minimizes the reasoning step, so the first token arrives much sooner. If `none` is not available for the model, use the lowest supported level and test accuracy again.\n\n\"Think step by step\" does the opposite: it asks for more reasoning and is not needed for reasoning models. A bigger `max_output_tokens` only raises the cap. Batch is asynchronous with a 24-hour target, the opposite of low latency.\n\nMemory aid: do not ask a professor to deliberate for ten minutes about a yes or no question.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning"], "ref": ["model-and-service-selection", "capacity-cost-and-throttling"]}, {"d": 1, "q": "A product team plans to run a production workload on a model labeled Preview because it has the best benchmark results. Which risk should you point out, based on the model lifecycle?", "o": [{"t": "Models move from Preview to GA, then Deprecated and Retired; production workloads need a GA model and a replacement plan, with notices and pinned versions", "c": true, "e": "When a model retires, deployments stop working, as happened with `dall-e-3` on March 4, 2026."}, {"t": "Benchmarks are invalid for Preview models", "c": false, "e": "Benchmarks exist but do not replace testing on your own data."}, {"t": "Preview models cannot be deployed in Foundry", "c": false, "e": "They can be deployed, but they are not meant for production."}, {"t": "Preview models are always more expensive than GA models", "c": false, "e": "Price is not the lifecycle risk."}], "concept": "Models and features have a lifecycle. A model starts as Preview, becomes generally available (GA), is later marked Deprecated, and finally Retired, after which deployments stop working.\n\nPreview models can change, be limited in availability and quota, have no production SLA, and can be withdrawn with little time. A high benchmark score does not change that. Production workloads should run on a GA model, with a pinned version, an awareness of the retirement notices, and a plan for the replacement (evaluate the successor on your golden dataset before the retirement date).\n\nThe wrong statements: Preview models are not always more expensive, they can be deployed in Foundry, and benchmarks are not invalid for them.\n\nThis applies to any product: keep an inventory of models and features in use with their lifecycle stage and dates.\n\nMemory aid: a prototype car may be fast, but you do not use it as a taxi.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/foundry-models-overview"], "ref": ["model-and-service-selection"]}, {"d": 1, "q": "You prepare the virtual network subnet for agent runtime injection in a Foundry resource. Which TWO requirements apply?", "o": [{"t": "The subnet is delegated to `Microsoft.App/environments` and is dedicated to this Foundry resource", "c": true, "e": "Missing delegation causes provisioning failures, and the agent subnet cannot be shared between Foundry resources."}, {"t": "The subnet overlaps with the peered on-premises network", "c": false, "e": "Overlapping ranges with peered networks are not allowed."}, {"t": "The subnet is a /29 range", "c": false, "e": "A /24 is recommended and the minimum for portal injection is /27."}, {"t": "The Foundry resource is in the same region as the virtual network", "c": true, "e": "Other resources may be elsewhere, but the Foundry resource must match the VNet region."}, {"t": "The subnet is shared with the application's virtual machines to save address space", "c": false, "e": "The agent subnet is dedicated per Foundry resource."}], "concept": "Hosted agents and the agent runtime in a secured network use network injection: the runtime containers are placed into a subnet of your virtual network, so they can reach your private resources.\n\nThe subnet has strict requirements. It must be delegated to `Microsoft.App/environments`, which prepares it for the container environment, and it must be dedicated to one Foundry resource, since subnets cannot be shared between Foundry resources. The Foundry resource and the virtual network must be in the same region. The size matters too: /29 is far too small (the portal flow needs at least /27 and /24 is recommended), and the range must not overlap with peered or on-premises networks, because overlapping addresses cannot be routed.\n\nSharing the subnet with application virtual machines breaks the dedicated requirement.\n\nMemory aid: the agent subnet is a private car park reserved for one company, in the same city as its office.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A team plans hosted agents in a locked-down environment. After the Foundry account was created, they try to add network injection and find that it cannot be added. What is the rule?", "o": [{"t": "Hosted agents do not support any network configuration", "c": false, "e": "They support it, at account creation."}, {"t": "It is only possible with a new subscription", "c": false, "e": "The restriction is about account creation, not subscriptions."}, {"t": "For hosted agents, network injection must be set when the Foundry account is first created", "c": true, "e": "It cannot be added later, so plan the network design before creating the account."}, {"t": "Network injection can be added at any time in the portal", "c": false, "e": "Learn states that it must be set at creation for hosted agents."}], "concept": "Some network settings of a Foundry account are fixed at creation time. For hosted agents, network injection must be configured when the Foundry account is first created. It cannot be added later in the portal.\n\nThe consequence is planning: before you create the account for a locked-down environment, decide the network design (the virtual network, the delegated subnet, DNS, private endpoints) and create everything with infrastructure as code. If the account already exists without injection, you create a new account (and migrate your agents from code) rather than trying to change it.\n\nHosted agents do support network configuration, and a new subscription is not needed.\n\nThis also explains why production environments should be created by infrastructure as code: portal-created resources may not inherit the network controls you intended, and later changes may be impossible.\n\nMemory aid: some things are poured into the foundation, not added to the roof.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A chat application hits its tokens-per-minute limit at peak. Metrics show that most tokens are input tokens: a long system prompt, ten retrieved chunks and the full chat history are sent with every call. What should you do first?", "o": [{"t": "Increase `max_output_tokens`", "c": false, "e": "Output is not the problem here."}, {"t": "Retry every request three times", "c": false, "e": "More requests add more tokens and make throttling worse."}, {"t": "Buy Provisioned capacity immediately", "c": false, "e": "This is a larger commitment before checking the cheaper fix."}, {"t": "Shrink the prompt: shorten the system prompt, send fewer or smaller chunks and summarize old turns", "c": true, "e": "Prompt tokens are most of the traffic, and trimming them is cheaper than quota or PTU."}], "concept": "Tokens-per-minute (TPM) limits count input and output tokens. Metrics show that most tokens are input tokens: a long system prompt, ten retrieved chunks and the full chat history are sent with every call. The cheapest fix is to send fewer tokens.\n\nShrink the prompt: shorten the system prompt; send fewer or smaller chunks (a reranker can select the best three instead of ten); summarize old turns instead of resending the entire history. Each change lowers input tokens per call, which lowers cost and latency as well, and gives headroom under the same limit. Prompt caching can discount the repeated stable prefix.\n\nBuying provisioned capacity is a larger step and costs money every hour. Raising `max_output_tokens` increases the output cap, not input volume. Retrying makes more calls and consumes more tokens, which worsens throttling.\n\nMemory aid: before you rent a bigger truck, check whether you are packing empty boxes.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/quotas-limits"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "A new deployment fails, and the Quota page shows 0 available for the model and deployment type. Another deployment in the subscription holds quota but is unused. What should you do?", "o": [{"t": "Move quota from the unused deployment, or submit a quota increase request", "c": true, "e": "Both are documented ways to get more limit. Requests are evaluated individually."}, {"t": "Buy a reservation", "c": false, "e": "A reservation is a discount and does not add quota."}, {"t": "Add more custom headers to the request", "c": false, "e": "More than 10 custom headers returns HTTP 431."}, {"t": "Wait for the quota to reset at midnight", "c": false, "e": "Quota is an allocation, not a daily counter."}], "concept": "Quota is the amount of capacity your subscription may deploy for a model and deployment type in a region. When it shows 0 available, a new deployment cannot be created, even though the subscription's limit is shared with other deployments.\n\nThe quota is held by existing deployments. If another deployment holds quota but is unused, you can reduce its capacity or delete it, which frees the quota, and then give it to the new deployment. If the total is not enough, submit a quota increase request. Both are legitimate ways to get quota.\n\nA reservation is a billing discount and does not create quota or capacity. Custom headers are irrelevant. Quota does not reset at midnight; tokens-per-minute rate limits renew every minute, but the deployment quota is a fixed allocation.\n\nMemory aid: quota is a parking permit count. If all permits are in use, free one or ask for more.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/quotas-limits"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "A security team wants alerts when users try to jailbreak the company's AI services or when data may be leaking from them. Which service provides this?", "o": [{"t": "Microsoft Defender for AI services", "c": true, "e": "It raises alerts on jailbreak attempts and data leakage."}, {"t": "Azure Policy", "c": false, "e": "It enforces configuration rules and does not detect attacks."}, {"t": "Azure Bastion", "c": false, "e": "It gives secure remote access to virtual machines."}, {"t": "Content provenance detection", "c": false, "e": "It checks where content came from."}], "concept": "Microsoft Defender for Cloud includes a plan for AI workloads, called Microsoft Defender for AI services. It provides threat protection for Azure AI services: it detects attacks such as jailbreak attempts, prompt injection, suspicious access, data exfiltration and credential theft, and creates security alerts that your security team can use.\n\nAzure Policy enforces configuration rules, it does not detect attacks at run time. Azure Bastion gives secure remote access to virtual machines. Content provenance detection checks whether media has AI-origin signals; it is not a threat detection service.\n\nHow it relates: use Policy to prevent bad configuration, guardrails to filter content at run time, red teaming to find weaknesses before release, and Defender for AI services to detect suspicious behavior in production.\n\nMemory aid: policy is the building code, guardrails are locks on doors, Defender is the security camera with alarms.", "src": ["https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat"], "ref": ["platform-network-and-reliability", "agent-safety-and-identity"]}, {"d": 1, "q": "You want to evaluate whether an agent used its tools efficiently compared with an expected sequence of tool calls, accepting `exact_match`, `in_order_match` or `any_order_match`. Which evaluator and prerequisite apply?", "o": [{"t": "Intent Resolution, which needs a judge deployment only", "c": false, "e": "It checks whether the agent understood the user's intent."}, {"t": "Customer Satisfaction, which compares with the system prompt", "c": false, "e": "It rates helpfulness, tone and resolution from the user's view."}, {"t": "Tool Call Success, which needs no data", "c": false, "e": "It checks only whether a call technically succeeded."}, {"t": "Task Navigation Efficiency, which needs ground truth (the expected sequence)", "c": true, "e": "It compares the agent's tool steps with an expected sequence."}], "concept": "Agent evaluators measure different parts of the process. Some compare against expectations, so they need ground truth: a known correct answer or sequence.\n\nTask Navigation Efficiency compares the actual sequence of tool calls with an expected sequence that you provide. It supports matching modes: `exact_match` (same steps, same order, no extras), `in_order_match` (the expected steps appear in the correct order, extra steps allowed) and `any_order_match` (all expected steps appear, in any order). Because it checks against an expected path, the prerequisite is the ground truth.\n\nTool Call Success needs no expected data: it checks whether tool calls ran without technical errors. Intent Resolution uses a judge model to rate whether the agent understood the request. \"Customer Satisfaction\" is not a built-in evaluator.\n\nMemory aid: comparing with a route plan requires the route plan.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/agent-evaluators"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 1, "q": "Operations wants a live view of token consumption, latency, error rates and quality scores for production agents, with alerts when outputs fail quality thresholds. What should they use?", "o": [{"t": "The CI pipeline logs", "c": false, "e": "They show build results, not production behavior."}, {"t": "The Foundry observability dashboard integrated with Application Insights, plus Azure Monitor alerts", "c": true, "e": "It shows operational metrics and quality scores in real time and supports alerts."}, {"t": "Only the model catalog benchmarks", "c": false, "e": "Benchmarks describe models, not your production traffic."}, {"t": "A one-time evaluation before launch", "c": false, "e": "It does not monitor production."}], "concept": "Operating an AI application needs live visibility, not only pre-release tests. The Foundry observability dashboard, integrated with Application Insights, shows operational numbers such as token consumption, latency and error rates, and quality scores from evaluations of production traffic.\n\nAdd Azure Monitor alerts on top: rules that fire when a metric crosses a threshold, for example when groundedness falls below 4 or the error rate rises, and notify the on-call team through email, Teams or an incident system.\n\nModel catalog benchmarks are public numbers for model selection. A one-time evaluation before launch is a snapshot. CI pipeline logs show build and deployment results, not user traffic.\n\nCombine four sources: traces for individual requests, metrics for volume and latency, evaluations for quality, and alerts to wake someone up.\n\nMemory aid: a dashboard is the instrument panel of a car; alerts are the warning lights.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/observability"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 1, "q": "A GitHub Actions pipeline deploys a hosted agent with the Azure Developer CLI. Which TWO practices follow the guidance?", "o": [{"t": "Skip evaluation because deployment succeeded", "c": false, "e": "The pipeline should fail the run when scores fall below thresholds."}, {"t": "Store a service principal secret in the repository", "c": false, "e": "This is exactly what OIDC avoids."}, {"t": "Run deployment manually from a laptop to stay flexible", "c": false, "e": "A pipeline gives repeatability and review."}, {"t": "Authenticate with GitHub OIDC federated credentials so that no secret is stored", "c": true, "e": "Federated credentials remove stored secrets."}, {"t": "Use a concurrency group so that two runs never deploy at the same time", "c": true, "e": "It serializes deployments."}], "concept": "A reliable deployment pipeline has two requirements here.\n\nAuthentication with GitHub OIDC federated credentials: GitHub issues a short-lived identity token for the workflow, and Azure trusts it through a federated credential on an Entra app. There is no stored secret to leak or rotate. A service principal secret in the repository is the opposite.\n\nA concurrency group: a GitHub Actions setting that allows only one run of the named group at a time. Without it, two pushes in quick succession start two deployments against the same environment, which can overwrite each other or fail.\n\nSkipping evaluation because deployment succeeded confuses \"it deployed\" with \"it works well\": the agent may deploy successfully and still give worse answers. Deploying from a laptop removes review, repeatability and audit.\n\nTypical pipeline: `azd provision`, `azd deploy`, then `azd ai agent eval run --no-prompt` that fails the job when scores fall below thresholds.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/set-up-ci-cd-cli"], "ref": ["cicd-for-foundry-projects"]}, {"d": 1, "q": "A team wants to compare two agent versions with statistical confidence in a GitHub workflow and is worried about the cost of repeated evaluations. Which guidance applies to the evaluation GitHub Action?", "o": [{"t": "Pass only the agent name without a version", "c": false, "e": "Agents are identified as `agent-name:version`."}, {"t": "List both agents as `name:version`; the first is the baseline by default; do not run it on every commit, to control cost", "c": true, "e": "Learn advises against running it on every commit and suggests running full evaluations on release candidates."}, {"t": "It cannot compare agents", "c": false, "e": "Listing several agents compares them, with confidence intervals and pairwise comparisons."}, {"t": "Run it on every commit with the full dataset", "c": false, "e": "It increases cost."}], "concept": "The evaluation GitHub Action (preview, `microsoft/ai-agent-evals`) runs offline evaluations for Foundry agents inside a workflow. You identify agents as `agent-name:version`. Because versions are immutable, `support:3` and `support:4` are exact, comparable targets.\n\nWhen you list several agents, the Action compares them: the first one is the baseline by default. The run summary reports scores with confidence intervals and pairwise comparisons, so you can see whether a difference is real or only noise.\n\nEvaluations call a judge model and run many test cases, so they cost money and time. Microsoft advises not to run it on every commit. Run it on pull requests that change agent behavior, on a schedule, or before release.\n\nPassing only the agent name does not identify a version. And comparing agents is exactly what the Action is built for.\n\nMemory aid: a race needs a referee and a baseline runner, and you do not hold a race for every footstep.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluation-github-action"], "ref": ["cicd-for-foundry-projects"]}, {"d": 1, "q": "A music-lyrics assistant must be checked for output that reproduces copyrighted song lyrics, recipes or published articles. Which evaluator should you add?", "o": [{"t": "Code Vulnerability", "c": false, "e": "It looks for insecure patterns in generated code."}, {"t": "Ungrounded Attributes", "c": false, "e": "It detects inferring protected traits not present in the context."}, {"t": "Indirect Attack", "c": false, "e": "It detects hidden instructions in content."}, {"t": "Protected Materials", "c": true, "e": "It detects copyrighted text or code in the output, including lyrics, articles and recipes."}], "concept": "Protected Materials is a risk and safety evaluator for output that reproduces protected content. For text, it checks whether the model output contains copyrighted material such as song lyrics, recipes and published articles. A separate code variant looks for protected code (licensed code).\n\nFor a lyrics assistant this is the right evaluator. Use it on adversarial prompts too, such as \"write the full lyrics of ...\", to see how often the assistant complies.\n\nCode Vulnerability checks for insecure code in generated code. Ungrounded Attributes checks whether the answer infers sensitive attributes about people (such as emotional state) that the input does not support. Indirect Attack evaluates how an application behaves against indirect prompt injection.\n\nMemory aid: Protected Materials = \"did it recite someone else's work?\".", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators"], "ref": ["responsible-ai-governance"]}, {"d": 1, "q": "Which statement about the risk and safety evaluators for harm categories (hate and unfairness, sexual, violence, self-harm) is correct?", "o": [{"t": "Scores range from 0 to 7, the default threshold is 3, and a case passes if the score is less than or equal to the threshold", "c": true, "e": "A defect is a score above the threshold."}, {"t": "Scores range from 1 to 5 and 3 fails", "c": false, "e": "The 1 to 5 range belongs to many LLM-judge quality evaluators."}, {"t": "Scores are 0 or 1 only", "c": false, "e": "The harm evaluators return severity scores."}, {"t": "A case passes only if the score is higher than the threshold", "c": false, "e": "The direction is reversed. A lower score is safer."}], "concept": "Harm evaluators for Hate and unfairness, Sexual, Violence and Self-harm use a severity scale from 0 to 7. A higher score is worse.\n\nThe default threshold is 3. A case passes if its score is less than or equal to the threshold, and fails if it is greater. So a score of 3 passes, and 4 or more fails. This is easy to invert by mistake, because many quality scores (such as groundedness on a 1 to 5 scale) are better when higher.\n\nYou can change the threshold to match your risk tolerance. For a children's app you may use a lower threshold, such as 1, which fails anything above very low severity.\n\nRemember the units: defect rate = failed cases divided by total cases. The scale of 1 to 5 belongs to quality evaluators such as groundedness, and 0 or 1 is not used for these harm scores.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators"], "ref": ["responsible-ai-governance"]}, {"d": 1, "q": "A line-of-business application only needs to call published agent endpoints. Developers should be able to build in the project, and one lead should publish agents. Which role assignment follows least privilege?", "o": [{"t": "The Azure AI Developer role for the application", "c": false, "e": "This role is not recommended for Foundry projects."}, {"t": "Foundry Agent Consumer for the application, Foundry User for developers and Foundry Project Manager for the lead", "c": true, "e": "Consumer calls agents only, User builds in a project, and Project Manager can publish agents."}, {"t": "Foundry Owner for everyone", "c": false, "e": "This gives broad privileges to all."}, {"t": "Foundry Account Owner for developers", "c": false, "e": "Account Owner manages accounts and models but cannot build in projects."}], "concept": "Least privilege means each identity gets the smallest set of permissions for its job. Foundry has built-in roles with different reach.\n\nFoundry Agent Consumer allows interacting with published agent endpoints and nothing more. That is right for the application that only calls agents. Foundry User allows building and developing in the project (create and test agents, use models, run evaluations) without managing access, so it fits developers. Foundry Project Manager can also publish agents and assign roles within the project, so only the lead gets it. Owner roles give broad control, including access management, and are far more than needed.\n\nThe Azure AI Developer role is a broader developer role and gives the application too much access.\n\nMemory aid: customer at the counter (Consumer), staff in the workshop (User), shop manager with keys to the safe (Project Manager).", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry"], "ref": ["agent-safety-and-identity", "platform-network-and-reliability"]}, {"d": 2, "q": "A team wants hosted agents and multi-agent systems written in code (Python or .NET) that run in Foundry as hosted agents. Which SDK or framework should they use?", "o": [{"t": "OpenAI SDK for images", "c": false, "e": "It is for image calls."}, {"t": "Speech SDK", "c": false, "e": "It is for speech scenarios."}, {"t": "Foundry Tools SDK for Content Safety", "c": false, "e": "It is for content safety calls."}, {"t": "Microsoft Agent Framework", "c": true, "e": "It provides agents, graph-based workflows, middleware, tools and MCP clients, and its workflows can run in Foundry as a hosted agent."}], "concept": "Microsoft Agent Framework is the open-source SDK for building agents and multi-agent systems in code, in Python and .NET. It provides agents, tools, workflows with checkpoints, and orchestration patterns such as sequential, concurrent, handoff and Magentic. Agents built with it can run in Foundry as hosted agents, so Foundry provides the runtime and you provide the code.\n\nThe Speech SDK is for speech recognition and synthesis. The Foundry Tools SDK for Content Safety checks content. The OpenAI SDK for images generates images. None of them orchestrates agents.\n\nA useful comparison: a prompt agent needs no code (model, instructions, tools); a hosted agent runs your code; Agent Framework is a way to write that code.\n\nChoose code-first orchestration when you need control that configuration cannot express, such as custom steps, parallel work, approvals and checkpoints.", "src": ["https://learn.microsoft.com/en-us/agent-framework/overview/agent-framework-overview"], "ref": ["foundry-sdk-and-generative-apps", "building-agents-with-foundry"]}, {"d": 2, "q": "A prompt for a non-reasoning model asks it to decide which of three suppliers is cheapest after tax. Answers are sometimes wrong. Which technique should you add?", "o": [{"t": "Raise the temperature to 1.5", "c": false, "e": "More randomness reduces consistency."}, {"t": "Remove all instructions", "c": false, "e": "The model needs clear instructions."}, {"t": "Chain of thought: ask for step-by-step reasoning before the final answer, in a fixed format such as \"ANSWER is: <name>\"", "c": true, "e": "It reduces errors and makes review easier on non-reasoning models."}, {"t": "Use `reasoning_effort=max` on the same non-reasoning model", "c": false, "e": "This setting belongs to reasoning models."}], "concept": "Chain of thought is a prompting technique: ask the model to reason step by step before the final answer. For multi-step problems such as a price comparison after tax, writing the intermediate steps (compute tax for each supplier, then totals, then compare) makes errors less likely, because each step builds on visible text.\n\nPut the final answer in a fixed format such as \"ANSWER is: <name>\", so your code can parse it and the reasoning can be ignored or logged.\n\nRaising the temperature to 1.5 makes arithmetic less reliable. Removing instructions removes the task. And `reasoning_effort` applies to reasoning models, not to a non-reasoning model, so it cannot be set to max on it.\n\nReasoning models do this thinking internally, so for them the technique is not needed. That is the contrast the exam likes: classic chat model = ask for steps; reasoning model = keep the prompt short and goal-oriented.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering"], "ref": ["prompt-engineering-parameters-and-reflection"]}, {"d": 2, "q": "A fact-checking tool asks the model to \"fact-check this paragraph\" and the results are shallow. Which prompt-design change does Microsoft guidance suggest?", "o": [{"t": "Increase `max_output_tokens`", "c": false, "e": "A larger cap does not change how the task is structured."}, {"t": "Tell the model never to be wrong", "c": false, "e": "This is vague and has no effect."}, {"t": "Break the task into two steps: first extract the factual claims, then write a search query for each claim", "c": true, "e": "Each step is easier to perform and to inspect."}, {"t": "Make the prompt a single very long sentence", "c": false, "e": "Complexity hurts clarity."}], "concept": "Complex tasks are often handled better when split into smaller steps (task decomposition). \"Fact-check this paragraph\" is vague: it asks the model to find claims, search, judge and report in a single leap, and the result is shallow.\n\nA better design uses two prompts. Step 1: extract the factual claims from the paragraph, as a list. Step 2: for each claim, write a search query (and later check the evidence). Each step is simple, can be tested on its own, and the output of step 1 can be inspected and corrected.\n\nA single long sentence makes the instruction harder to follow. \"Never be wrong\" cannot be obeyed. `max_output_tokens` only limits length.\n\nThis is also the base of agent workflows: small steps with clear inputs and outputs, with code or tools between them.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering"], "ref": ["prompt-engineering-parameters-and-reflection"]}, {"d": 2, "q": "A knowledge assistant's instruction says \"Do not fabricate information\", but reviewers still find invented facts. Which instruction change is more effective?", "o": [{"t": "Remove the retrieved context", "c": false, "e": "The model then relies on memory."}, {"t": "Ask for inline citations next to each claim, so an invented statement needs a false claim and a false citation, and checking becomes easy", "c": true, "e": "Citations make fabrication harder and verification simple. Closer citations work better than a list at the end."}, {"t": "Raise the temperature", "c": false, "e": "This increases invention."}, {"t": "Repeat \"do not fabricate\" ten times", "c": false, "e": "Weak instructions do not become stronger by repetition."}], "concept": "\"Do not fabricate\" is a wish, not a mechanism. The model still tries to be helpful and can invent facts, and repeating the wish ten times does not give it a new ability.\n\nAsking for inline citations changes the task. Each claim must come with a reference to a source passage, for example `[doc2]`. To invent a fact the model would also have to invent a matching citation, which is harder and easier to catch. A reviewer (or an automated check) can look at the citation and verify the claim quickly. Missing citation is a clear signal to reject a statement.\n\nRemoving the retrieved context removes the facts and makes invention more likely. Raising the temperature increases randomness.\n\nCombine it with an \"out\" (\"if the sources do not contain the answer, say you don't know\") and a groundedness evaluation.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering"], "ref": ["prompt-engineering-parameters-and-reflection"]}, {"d": 2, "q": "Retrieval evaluators show low scores. Reading sample chunks, you find that each chunk covers many unrelated topics and ranks poorly for specific questions. Which step is at fault and what is the fix?", "o": [{"t": "Logging: store more traces", "c": false, "e": "Logs help diagnose but do not change retrieval."}, {"t": "Chunking: the chunks are too large and their meaning is blurred; tune the size and overlap (for example start from 512 tokens with 25% overlap)", "c": true, "e": "Large chunks produce a vector that blends topics and a prompt full of noise."}, {"t": "Generation: lower the temperature", "c": false, "e": "Generation cannot fix poor retrieval."}, {"t": "Reranking: disable the semantic ranker", "c": false, "e": "The ranker cannot rescue a chunk that blurs meaning."}], "concept": "When retrieval quality is low, find which stage fails. Reading sample chunks is the right first diagnostic step. Here each chunk mixes many unrelated topics. An embedding of such a chunk is an average of several meanings, so it does not match any specific question strongly. It then ranks poorly.\n\nThe fault is chunking. Reduce the chunk size, split by sections or headings, and add overlap so boundary facts are kept. A documented starting point is 512 tokens with 25% overlap; then tune using retrieval metrics on labeled questions.\n\nLowering temperature affects generation, which is not where the problem is. Disabling the semantic ranker removes a helpful stage. Storing more traces helps debugging but does not change retrieval.\n\nMemory aid: one chunk, one topic. A chunk that is a whole chapter is a bag of unrelated things.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-chunk-documents"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A RAG assistant should answer only when retrieval confidence is high and otherwise reply \"not found\". Semantic ranker scores range from 0 to 4. Which design is most appropriate?", "o": [{"t": "Use `orderby` to put the best document first", "c": false, "e": "Explicit sorting overrides relevance ranking."}, {"t": "Always answer and rely on a polite tone", "c": false, "e": "Low-confidence answers would still be shown."}, {"t": "Apply a score threshold on the reranker score (kept coarse, because score distributions can shift slightly) and return \"not found\" below it", "c": true, "e": "A relevance threshold raises precision at the cost of recall."}, {"t": "Set a very fine threshold such as 3.2137", "c": false, "e": "Scores can shift slightly with infrastructure or model updates, so fine-grained thresholds are fragile."}], "concept": "The semantic ranker gives each result a reranker score from 0 to 4. A threshold on this score is a simple confidence rule: if the best passage scores below the cut-off, there is probably no good answer, and the assistant replies \"not found\" instead of guessing.\n\nKeep the threshold coarse, for example 2.0 or 2.5. Score distributions can shift slightly as the model, the index or the data change, so a very fine value such as 3.2137 gives false precision and breaks easily. Test the cut-off on labeled questions, including questions with no answer, and tune the balance between wrongly refusing and wrongly answering.\n\nAlways answering and relying on tone invites hallucination. `orderby` sorts results but does not tell you whether the best one is good enough.\n\nMemory aid: set the pass mark at a round number and check it on real papers, not at 3.2137.", "src": ["https://learn.microsoft.com/en-us/azure/search/semantic-search-overview"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "Which similarity metric should you configure for a vector field that holds Azure OpenAI embeddings in Azure AI Search?", "o": [{"t": "`cosine`", "c": true, "e": "It is the recommended metric for Azure OpenAI embeddings. The vector score for cosine is `1 / (1 + cosine_distance)`."}, {"t": "Any metric, because the result is the same", "c": false, "e": "The metric must match how the embedding model was trained."}, {"t": "`hamming`", "c": false, "e": "It is for binary vectors."}, {"t": "`jaccard`", "c": false, "e": "It is a set similarity, not a vector metric in this configuration."}], "concept": "A similarity metric defines how \"closeness\" between two vectors is calculated. Common ones are cosine (the angle between vectors), Euclidean (straight-line distance) and dot product.\n\nEmbedding models are trained with a specific metric in mind. Azure OpenAI embeddings are normalized to unit length and designed for cosine similarity, so `cosine` is the right setting. For normalized vectors, dot product gives the same ranking, but cosine is the standard documented choice. Using a metric that does not match the model gives worse ranking.\n\nHamming is for binary vectors (bit strings), and Jaccard compares sets. They do not suit floating-point embeddings. The claim that every metric gives the same result is false.\n\nRemember also that query and document vectors must come from the same embedding model, and that the vector field needs matching dimensions.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-ranking"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A developer wants the model to return a text field that must match a regular expression and have a minimum length, using strict Structured Outputs. What should they do?", "o": [{"t": "Switch to JSON mode, which enforces patterns", "c": false, "e": "JSON mode only guarantees valid JSON."}, {"t": "Add `pattern` and `minLength` to the schema and trust the service to enforce them", "c": false, "e": "They are not supported in strict mode."}, {"t": "Increase the temperature so the model varies the text", "c": false, "e": "Randomness does not enforce patterns."}, {"t": "Enforce `pattern` and `minLength` in application code, because these keywords are not supported in the strict schema subset", "c": true, "e": "Unsupported keywords include `minLength`, `maxLength`, `pattern`, `format`, `minimum` and `maximum`."}], "concept": "Structured Outputs in strict mode support only a subset of JSON Schema. The reason is that the service compiles the schema into constraints for decoding, and not every keyword can be compiled.\n\nKeywords such as `pattern` (regular expression) and `minLength` are not supported in the strict subset, so the service does not enforce them. If you add them and trust the service, invalid values still appear. The correct design validates these business rules in application code: after parsing, check the regex and the length, and retry or reject if they fail.\n\nJSON mode only guarantees valid JSON, not patterns. Increasing temperature makes values less predictable.\n\nSummary of the contract: the schema gives structure (fields, types, enums, required), and your code gives value rules (patterns, ranges, cross-field checks).\n\nMemory aid: the schema guarantees the shape of the box; you inspect what is inside.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/structured-outputs"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "An engineer tries to add a function definition to a Foundry agent in the portal and cannot find the option. What is the situation?", "o": [{"t": "The agent type does not support functions", "c": false, "e": "Prompt agents support function tools."}, {"t": "The portal cannot add, edit or remove function definitions; use the SDK or REST API. The portal can run an agent that already has them, but it does not execute your function", "c": true, "e": "Function tools are defined in code and executed by your application."}, {"t": "The function must be written in the system prompt", "c": false, "e": "Prompts do not define callable functions."}, {"t": "A Provisioned deployment is required", "c": false, "e": "Deployment type is unrelated."}], "concept": "The Foundry portal is a good place to run and test agents, but it has limits for tools. It cannot add, edit or remove function definitions. A function tool is a contract between your application code and the model, and your app must run the code when the model asks. So function definitions are created with the SDK or the REST API, in the same code base that implements the functions.\n\nThe portal can run an agent that already has function definitions, but it does not execute your function. A call to the function will therefore appear as a pending `function_call` that nobody fulfills.\n\nThe agent type does support functions. A provisioned deployment is not required. Writing the function in the system prompt does not register a callable tool.\n\nPractice: keep agent definitions, including tool schemas, in source control and deploy them from a pipeline.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "A memory store keeps user profile facts. The privacy officer wants the extractor to avoid age, financial information, precise location and credentials, and old entries to expire automatically. Which settings apply?", "o": [{"t": "A shared static scope for all users", "c": false, "e": "It removes isolation."}, {"t": "`chat_summary_enabled` set to false", "c": false, "e": "This disables summaries, not sensitive profile data."}, {"t": "Put the rules in the system prompt only", "c": false, "e": "The extractor needs its own guidance, and prompts do not control retention."}, {"t": "`user_profile_details` with instructions on what to avoid, and `default_ttl_seconds` for retention", "c": true, "e": "These settings tell the extractor what not to store and set a default lifetime for new entries."}], "concept": "Memory stores personal facts, so they need privacy controls built in.\n\n`user_profile_details` is a setting where you tell the extractor what to focus on and what to avoid. You can write instructions such as \"do not store age, financial information, precise location or credentials\". The extractor then skips those details when it builds memories. `default_ttl_seconds` sets a default time to live for new entries, so old memories expire automatically, which supports data minimization and retention rules.\n\nSetting `chat_summary_enabled` to false only disables summary memory. A shared static scope puts everyone's memories together, which is worse for privacy. Rules only in the system prompt are weak, because the extraction is a separate step.\n\nAlso scope memory per user, support deletion requests, and treat retrieved memories as untrusted context.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/what-is-memory"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "A team asks in which order to add capabilities to a new customer agent. Which order follows the recommended build order?", "o": [{"t": "Publish first, test later", "c": false, "e": "Publishing before testing exposes users to problems."}, {"t": "Memory first, then a single tool", "c": false, "e": "Memory is useful after repeated users appear and the base works."}, {"t": "Multiple agents first, tools later", "c": false, "e": "Orchestration adds complexity before the basics work."}, {"t": "One agent with one or two tools and a golden test set, then retrieval, then memory, then approvals for risky tools, then tracing and evaluators, and only then multiple agents", "c": true, "e": "Add complexity step by step and measure after each."}], "concept": "Complexity should be added in small, measurable steps. Every added capability brings cost, latency and new failure modes, so earn each one.\n\nThe recommended order: (1) one agent with one or two tools and a golden test set, so you have a baseline. (2) Add retrieval if the agent lacks knowledge. (3) Add memory if repeated users need personalization. (4) Add approvals for risky tools. (5) Add tracing and evaluators for operations and regression. (6) Only then consider multiple agents, when specialist roles or parallel work clearly help.\n\nStarting with multiple agents creates coordination problems before you know that a single agent fails. Memory first, with no tool, lacks purpose. Publishing before testing leaves users as the testers.\n\nMemory aid: learn to walk before you run a relay race.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/overview"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "An agent worker looks up its agent by name at startup and creates it only if the lookup returns 404. Later, a call with the stored agent ID returns 404 although the ID worked yesterday. What is the correct handling?", "o": [{"t": "Rename the agent in the portal", "c": false, "e": "A saved agent's name cannot change, and renaming does not restore it."}, {"t": "Increase the deployment quota", "c": false, "e": "Quota errors are 429, not 404."}, {"t": "Treat the 404 for a previously valid ID as terminal: the agent was deleted, so recreate it (get-or-create) instead of retrying in a loop", "c": true, "e": "Retrying a deleted resource never succeeds. Define agents as code so they can be recreated reliably."}, {"t": "Retry with exponential backoff until the agent reappears", "c": false, "e": "Backoff is for throttling, and a deleted agent does not return."}], "concept": "An agent has a name and versions. An ID that worked yesterday and now returns 404 means the resource no longer exists, for example because someone deleted the agent.\n\nA 404 on a previously valid ID is terminal for that ID. Retrying with backoff will never succeed, because backoff is for temporary errors (429, 503). The right response is to recreate the agent from your source definition, using a get-or-create pattern: look up by name, and create only if it is missing. In production, also investigate why it was deleted, and add delete locks or restricted roles.\n\nIncreasing quota is unrelated to a missing resource, and renaming an agent in the portal does not restore an ID.\n\nMemory aid: knocking again on a door of a demolished house does not build the house. Rebuild it from the plans.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/development-lifecycle"], "ref": ["observability-and-agent-lifecycle", "building-agents-with-foundry"]}, {"d": 2, "q": "A guardrail has a Violence control in annotate-only mode. The response annotation shows `detected: true, filtered: false`. What does it mean?", "o": [{"t": "The content was safe", "c": false, "e": "Safe content is annotated but never filtered and is not flagged as detected."}, {"t": "The content was blocked", "c": false, "e": "A blocked item has `filtered: true`."}, {"t": "The content was detected at or above the threshold but allowed through; annotate mode is useful for tuning false positives before turning blocking on", "c": true, "e": "`detected` means seen, `filtered` means blocked."}, {"t": "The guardrail is not assigned", "c": false, "e": "Then there would be no annotation."}], "concept": "A guardrail control can take different actions. In annotate-only mode the service evaluates the content and reports the result in the response annotations, but does not block.\n\nThe annotation `detected: true, filtered: false` says: the content was detected at or above the severity threshold, but it was not filtered, because the mode is annotate only, so it passed through. If `filtered` were true, it would have been blocked.\n\nAnnotate mode is useful for tuning. You run it on real traffic, look at what would have been caught, and find false positives and false negatives before you turn blocking on. This avoids breaking the user experience with a threshold that is too strict.\n\nThe content was not blocked, the guardrail is assigned (otherwise there would be no annotation), and `detected: true` means it was not simply safe.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "You add a Groundedness control to a guardrail that is assigned to both a model deployment and an agent. The control works for the model but never blocks anything for the agent. Why?", "o": [{"t": "The agent's temperature is too low", "c": false, "e": "Temperature does not affect a guardrail."}, {"t": "Guardrails need a separate Azure Policy to run", "c": false, "e": "Guardrails are assigned directly."}, {"t": "Groundedness is not yet supported for agents; a control with an unsupported risk silently does not take effect for the agent", "c": true, "e": "Groundedness applies to models only, while the same guardrail still works for models."}, {"t": "The agent uses a Provisioned deployment", "c": false, "e": "Deployment type does not matter."}], "concept": "A guardrail is a list of controls. Not every risk is supported on every target. Groundedness checks whether an answer is supported by the context, and it is not yet supported for agents. When you add a control with an unsupported risk to an agent's guardrail, there is no error: it silently does not take effect for the agent. It works for the model deployment because the model supports it.\n\nThis is a common trap: you see a control in the guardrail and assume protection exists. Always check the supported risks for the target in the documentation, and test with real examples to confirm blocking happens.\n\nTemperature of the agent does not influence this, Provisioned deployment type is irrelevant, and guardrails do not need Azure Policy to run.\n\nFor agents, you can still measure groundedness with the evaluators in your evaluation pipeline, which is a different tool.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "You add tool call and tool response controls to an agent's guardrail. Which TWO statements are correct?", "o": [{"t": "They are GA for agents and models alike", "c": false, "e": "Tool call and tool response controls are preview and for agents only."}, {"t": "Each intervention point adds roughly 50 to 100 ms of latency", "c": true, "e": "It depends on content length and the number of controls."}, {"t": "They replace the need to enforce limits in tool code", "c": false, "e": "Prompts and filters guide, while code and permissions enforce."}, {"t": "They scan every tool, including all MCP servers", "c": false, "e": "Only tools that support moderation are covered."}, {"t": "They work only with tools that support moderation, such as Azure AI Search, Azure Functions, OpenAPI, SharePoint grounding, Fabric Data Agent, Bing grounding, Bing Custom Search and Browser Automation", "c": true, "e": "For other tools these controls do nothing."}], "concept": "Tool call and tool response intervention points inspect what goes into a tool and what comes back. They are Preview, and they only take effect for tools that support moderation, such as Azure AI Search, Azure Functions, OpenAPI, SharePoint grounding, Fabric Data Agent, Bing grounding, Bing Custom Search and Browser Automation. They do not scan every tool, so MCP servers and Code Interpreter are not guaranteed to be covered.\n\nEach intervention point adds a small cost in time: roughly 50 to 100 ms of latency per intervention point. Add them where the risk justifies it.\n\nThey do not replace limits in tool code. A guardrail detects patterns, while a limit such as \"transfers over $500 need approval\" is a business rule that you enforce in the tool and with permissions.\n\nMemory aid: guardrails are airport scanners at some gates, not every gate; the tool still needs its own lock.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A long-running Microsoft Agent Framework workflow must survive a process restart and resume from where it stopped. What should you use?", "o": [{"t": "Increase the model's context window", "c": false, "e": "Context size is not workflow state."}, {"t": "Workflow checkpoints, saved at the end of each superstep, resumed from a `checkpoint_id`, with Azure Cosmos DB as the production store", "c": true, "e": "A checkpoint captures executor state, pending messages and shared state."}, {"t": "Keep the state in a local variable", "c": false, "e": "It is lost on restart."}, {"t": "Use a higher `temperature`", "c": false, "e": "It does not preserve state."}], "concept": "Agent Framework workflows run in supersteps: rounds in which executors process messages. A checkpoint saves the workflow state at the end of each superstep. If the process crashes or is restarted, you can resume from a checkpoint: you provide the `checkpoint_id` of the saved state, and the workflow continues from there, not from the beginning.\n\nFor production, the checkpoint store must be durable and shared, so Azure Cosmos DB is used as the production store. A local variable disappears with the process. A bigger context window or a higher temperature has nothing to do with persistence.\n\nSteps should still be idempotent, because the step running at the moment of a crash may be repeated after the resume.\n\nWalkthrough: a provisioning workflow has four steps. It crashes in step three. On restart it loads the checkpoint saved after step two and continues with step three.", "src": ["https://learn.microsoft.com/en-us/agent-framework/workflows/checkpoints"], "ref": ["building-agents-with-foundry"]}, {"d": 3, "q": "A request for a photorealistic image of a minor is blocked by the image generation service. Which statement is correct?", "o": [{"t": "Photorealistic images of minors are blocked by default; access needs a request form (enterprise-tier customers are auto-approved)", "c": true, "e": "This is a built-in responsible AI control."}, {"t": "The request must be sent with `output_format=JPEG`", "c": false, "e": "The format is not related."}, {"t": "The block is a quota error that will clear after a few minutes", "c": false, "e": "This is a policy block, not a quota error."}, {"t": "The block disappears when you set `quality` to `low`", "c": false, "e": "Quality does not affect the policy."}], "concept": "Image generation services have safety policies beyond the general content filters. One of them restricts photorealistic images of minors. Such requests are blocked by default. Access requires a request form, and enterprise-tier customers are approved automatically.\n\nSo the block is a policy decision, not a technical fault. It will not clear after a few minutes (it is not a quota error), it does not depend on the `quality` setting, and the output format has no influence.\n\nHow to handle it in an application: catch the error, tell the user in plain words that the request cannot be fulfilled, do not retry, and use the access request process if your business has a legitimate case that needs this capability.\n\nMore generally, keep your prompts, outputs and decisions logged for audit, and apply the content safety checks to both the prompt and the generated media.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"], "ref": ["image-and-video-generation", "responsible-ai-for-multimodal-content"]}, {"d": 3, "q": "A designer asks for a logo with a transparent background and a small file for the web. Which TWO statements about gpt-image output options are correct?", "o": [{"t": "JPEG output supports a transparent background", "c": false, "e": "JPEG has no alpha channel."}, {"t": "`output_compression` (0 to 100) applies to JPEG only", "c": true, "e": "It does not change PNG output."}, {"t": "WEBP output is supported with `output_compression`", "c": false, "e": "WEBP is not supported."}, {"t": "The response returns a URL valid for one hour", "c": false, "e": "The gpt-image models return base64 in `b64_json`."}, {"t": "Transparent backgrounds need PNG output", "c": true, "e": "`background` can be `transparent` only with PNG."}], "concept": "The gpt-image models have output options that affect file format, size and transparency. In the study material, `output_format` accepts PNG (the default) or JPEG; WEBP is not supported.\n\nTransparency: a transparent background (`background` set to `transparent`) needs a format with an alpha channel, so it needs PNG. JPEG cannot store transparency. A logo that must sit on any web page background therefore uses PNG.\n\nCompression: `output_compression` is an integer from 0 to 100 (default 100) and it applies to JPEG only. It does not change PNG output, which is lossless. So choosing PNG gives transparency but gives you no compression control, while JPEG gives a smaller file but no transparency. A designer cannot have both from this setting, and must decide which matters more for each asset.\n\nThe response never returns a URL: the gpt-image models always return base64 in `b64_json`, so your code decodes and stores the file itself.\n\nMemory aid: PNG = transparent but heavy; JPEG = light but opaque.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"], "ref": ["image-and-video-generation"]}, {"d": 3, "q": "An e-commerce team wants to merge a product photo and three style reference images into one edited image. Which limits apply to the image edit endpoint?", "o": [{"t": "A mask with any size", "c": false, "e": "The mask must match the input dimensions."}, {"t": "Up to 16 input images in `image[]`, each under 50 MB and PNG or JPG; the mask must have the same dimensions as the input", "c": true, "e": "These are the documented edit limits."}, {"t": "Any image format, including WEBP and TIFF", "c": false, "e": "The documented formats are PNG and JPG."}, {"t": "Only one image per request, under 4 MB", "c": false, "e": "Multiple images are supported."}], "concept": "The image edit endpoint is multipart/form-data. It accepts up to 16 input images in `image[]`, each under 50 MB and in PNG or JPG format. So a product photo plus three style references fit into one request. If you supply a mask, it must be a PNG with the same dimensions as the input, and the fully transparent pixels (alpha = 0) are the areas to edit.\n\nThe statements with one image under 4 MB, any format such as TIFF or WEBP, and a mask of any size are all wrong.\n\nOther edit parameters: `input_fidelity` controls how closely style and features (especially faces) follow the input; it is not supported by gpt-image-1-mini. `quality`, `size`, `n` and streaming options work as in generation.\n\nAfter the call, decode `b64_json`, compare the result with the inputs, run content safety on the output, and store the prompt and parameters with the file.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"], "ref": ["image-and-video-generation"]}, {"d": 3, "q": "A Content Understanding analyzer for ads uses `enableSegment: true` to split videos into \"ads\" and \"game play\" segments. The team asks for three categories. What applies?", "o": [{"t": "Video supports up to 200 categories", "c": false, "e": "The 200-category limit is for document classification."}, {"t": "Segmentation works only for audio", "c": false, "e": "It works for video here."}, {"t": "For video only one content category is supported, and segmentation uses tokens, so it adds cost", "c": true, "e": "Video segmentation takes a single natural-language category description."}, {"t": "Segmentation is free and unlimited", "c": false, "e": "It uses tokens."}], "concept": "Content Understanding can split a long file into segments with `enableSegment: true`. Segmentation uses a content classification: you define categories, and the service assigns each segment to one.\n\nThe number of categories depends on the content type. For documents, a classifier can use many categories (up to 200). For video, only one content category is supported. The team asks for three, which is beyond the limit for video. Segmentation also uses tokens, so it adds cost.\n\nAlternatives for splitting ads from game play: use one category and describe the target segment, or process the video in two steps, first segmenting then classifying the extracted segments with a separate model or analyzer.\n\nSegmentation is neither free nor unlimited, and it is not limited to audio.\n\nMemory aid: documents can have many drawers (200 categories); a video gets one drawer.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/overview"], "ref": ["multimodal-understanding", "content-understanding-and-document-intelligence"]}, {"d": 3, "q": "A vision chat model describes details in a photo that are not actually visible (for example the brand of a blurry product). Which prompt change reduces this?", "o": [{"t": "Remove the question text", "c": false, "e": "The model needs a clear task."}, {"t": "Instruct it to describe only what is visible and to say \"not visible\" when something cannot be seen", "c": true, "e": "Giving the model an out reduces invented details. For small text, also provide a higher-resolution image."}, {"t": "Raise the temperature", "c": false, "e": "This increases invented details."}, {"t": "Ask it to guess brands from context", "c": false, "e": "Guessing increases errors."}], "concept": "A vision chat model combines image understanding with language generation. When details are not visible (a blurry product brand), the language part may fill the gap with a plausible guess. That is a hallucination about the image.\n\nReduce it with clear instructions: \"describe only what is visible in the image; if something cannot be seen clearly, write `not visible`\". Giving the model a permission to say it cannot see something makes the honest answer available. Ask for a fixed structure (for example alt text, long description, `not visible` list), and test with blurry or ambiguous images.\n\nRaising the temperature increases invention. Removing the question text leaves no task. Asking it to guess brands from context directly requests the unwanted behavior.\n\nAdd a human spot check on a sample, especially where brand or safety information matters.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/gpt-with-vision"], "ref": ["multimodal-understanding"]}, {"d": 3, "q": "A legacy application uses Image Analysis 4.0 for captions, tags and OCR. What should the team plan?", "o": [{"t": "Migration to Custom Translator", "c": false, "e": "That is a translation service."}, {"t": "No action, because retirement dates never apply to Azure features", "c": false, "e": "Retirement notices do apply."}, {"t": "Migration toward vision-capable models or Content Understanding before Image Analysis 4.0 retires on September 25, 2028", "c": true, "e": "It still works until then, but new work should use models or Content Understanding."}, {"t": "Immediate removal, because the feature is already retired", "c": false, "e": "It retires in 2028."}], "concept": "Azure services have lifecycle notices, and features can be retired. Image Analysis 4.0 (captions, tags, OCR and more) has a published retirement date: September 25, 2028.\n\nA legacy application that uses it works today, but should have a migration plan: move toward vision-capable language models or Content Understanding, which provide more flexible image understanding and structured output. Steps: inventory the features in use, choose the replacement for each, run both in parallel on a test set, compare results, and switch before the date.\n\nIt is not retired yet, so immediate removal is unnecessary. The claim that retirement dates never apply is false. Custom Translator is for text translation, and has nothing to do with image analysis.\n\nKeep a list of features with their retirement dates, and review it regularly.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/computer-vision/how-to/call-analyze-image-40"], "ref": ["multimodal-understanding"]}, {"d": 3, "q": "A team filters only the text prompt before sending it to an image generator and ships the images directly. Reviewers find an image with unwanted content produced from a harmless prompt. What is the gap?", "o": [{"t": "Image severity uses a scale from 0 to 100", "c": false, "e": "Image severity uses 0, 2, 4 and 6."}, {"t": "Filters must apply on both sides: the prompt going in and the generated media coming out", "c": true, "e": "A harmless prompt can still produce a flagged image, so the output needs its own filter and review."}, {"t": "The prompt filter threshold should be higher", "c": false, "e": "The input was harmless, so the gap is on the output side."}, {"t": "Filtering is not needed for images", "c": false, "e": "Content safety classifies text and images."}], "concept": "Generated media can be harmful even when the prompt looks harmless. A model can produce unexpected content from a neutral prompt, or the prompt may be phrased so that a filter does not catch it.\n\nTherefore filter on both sides. The input filter protects against harmful or attacking prompts and saves cost. The output filter examines the generated image (and any text in it) before anyone sees it. Content Safety returns severity levels, with the trimmed scale of 0, 2, 4 and 6 for images, and you block above your threshold.\n\nOnly filtering the prompt leaves the output unchecked, which is exactly the gap here. A higher prompt threshold does not close it. The image severity scale is not 0 to 100. And filtering is needed for images.\n\nAfter filtering, human review and provenance labeling complete the workflow.\n\nMemory aid: check the ingredients and taste the dish before serving.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/harm-categories"], "ref": ["responsible-ai-for-multimodal-content"]}, {"d": 4, "q": "Which feature is listed among the core Azure Language capabilities without a retirement notice, so it remains a good choice for a new project that must find and mask social security numbers?", "o": [{"t": "PII detection", "c": true, "e": "It is listed as a core feature, together with language detection, named entity recognition and text analytics for health."}, {"t": "Key phrase extraction", "c": false, "e": "It retires on March 31, 2029."}, {"t": "Conversational language understanding", "c": false, "e": "It retires on March 31, 2029."}, {"t": "Sentiment analysis", "c": false, "e": "It retires on March 31, 2029."}], "concept": "Azure Language has a set of features. Some have retirement notices: sentiment analysis, key phrase extraction and several others retire on March 31, 2029, and Microsoft directs new projects to Foundry models for them.\n\nPII detection is a core capability without such a notice in the study material, so it is a safe choice for a new project that must find and mask social security numbers. It detects personal data in text, conversations and documents, and returns redacted text and entities.\n\nConversational language understanding is not retired in this list but it also is not what the question asks: it predicts intents and entities for user utterances; masking SSNs is a PII task.\n\nAlways verify the current status of a feature on Microsoft Learn before you start a project, since notices change.\n\nMemory aid: for a new build, avoid features with a published sunset date unless you plan the migration.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "An insurer must extract policy numbers like `POL-2026-00417` from claim emails. The prebuilt NER categories (Person, Location, Organization, DateTime, Quantity) do not include them. Which option fits?", "o": [{"t": "Language detection", "c": false, "e": "It identifies languages only."}, {"t": "Sentiment analysis", "c": false, "e": "It labels sentiment."}, {"t": "Custom named entity recognition trained on labeled examples", "c": true, "e": "Use custom NER when prebuilt categories do not cover what you need."}, {"t": "Prebuilt NER with a larger confidence threshold", "c": false, "e": "The category does not exist, so a threshold does not help."}], "concept": "Named entity recognition (NER) finds and classifies entities in text. The prebuilt NER knows common categories such as Person, Location, Organization, DateTime and Quantity. A policy number like `POL-2026-00417` is not in those categories, and a threshold does not create a category.\n\nCustom NER lets you define your own entity types (for example PolicyNumber) and train a model on labeled examples: you annotate emails with the spans of policy numbers, train, evaluate, deploy and call it. Because policy numbers follow a pattern, a few dozen well-chosen examples may be enough; you review precision and recall on a test set.\n\nFor a very regular pattern, a regular expression in code can also work, and combining a regex with a model is common.\n\nLanguage detection and sentiment analysis do not extract entities.\n\nMemory aid: prebuilt NER knows common nouns; custom NER learns your own jargon.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A team wants to start with conversational language understanding quickly, with no labeled data. Which path is documented?", "o": [{"t": "Use batch transcription", "c": false, "e": "It converts audio to text."}, {"t": "Train a custom model first, then define the schema", "c": false, "e": "The custom path defines the schema first, then labels and trains."}, {"t": "Use Custom question answering because it extracts intents", "c": false, "e": "It answers questions from a knowledge base."}, {"t": "The LLM-powered quick deploy: define the schema with intent descriptions, deploy, then predict intents and prebuilt entities", "c": true, "e": "It skips labeling and training. The custom machine-learned path needs labeled utterances and training."}], "concept": "Conversational language understanding (CLU) predicts intents and entities. Traditionally you create labeled utterances for each intent and train a model. That requires data and time.\n\nThe LLM-powered quick deploy path lets you start without labeled data. You define the schema (the intents with short descriptions, and entities), deploy it, and then call the prediction API; the LLM predicts intents and uses prebuilt entities. This is good for a fast start. Later, if measurements show a need, you can add labeled data and train a custom model for better accuracy on your domain.\n\nTraining first and defining the schema later has the wrong order, since the schema defines what to train. Custom question answering finds answers in a knowledge base and does not extract intents. Batch transcription converts audio to text.\n\nMemory aid: quick deploy = describe, deploy and test; custom training = collect data, train and tune.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A batch transcription job must label speakers in a meeting with 6 participants, using mono audio. Which setting should you use?", "o": [{"t": "Diarization with minimum and maximum speaker counts (up to 35 speakers) instead of the simple two-speaker setting", "c": true, "e": "`diarizationEnabled` handles two speakers, and min/max settings handle three or more on mono audio."}, {"t": "Stereo audio with diarization", "c": false, "e": "Diarization needs mono audio."}, {"t": "`diarizationEnabled` only", "c": false, "e": "It is for two speakers."}, {"t": "Text to speech with six voices", "c": false, "e": "It produces audio and does not label speakers in a recording."}], "concept": "Diarization labels who spoke when. The simple setting `diarizationEnabled: true` is made for two speakers. For three or more, you add the diarization property with the minimum and maximum number of speakers (up to 35). For a meeting with 6 participants you might set a minimum of 2 and a maximum of 8.\n\nDiarization works on mono audio. If the recording has speakers on separate channels (stereo), you use the channels instead (for example transcribe channel 0 and channel 1 separately), so diarization is for mono.\n\nText to speech creates audio and does not label speakers. Setting only `diarizationEnabled` will not separate six speakers correctly.\n\nQuality tips: the more speakers and the more overlap, the more errors; use good microphones, and check a sample of the output against a human transcript.\n\nAlso note the limit of 240 minutes per file for audio with diarization.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/batch-transcription-create"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A call-center app translates live speech into four languages at the same time with the Speech service. Which statement is correct?", "o": [{"t": "Speech translation supports unlimited targets with no extra cost", "c": false, "e": "There is a limit of two direct targets."}, {"t": "Only Translator document translation can handle live audio", "c": false, "e": "Document translation handles files."}, {"t": "Speech translation cannot be used with custom speech models", "c": false, "e": "Custom speech models can be used with speech translation."}, {"t": "The Speech service translates directly into two target languages; for more, use a Foundry (multi-service) resource, where translation fees apply for each language beyond the second", "c": true, "e": "This is the documented limit for speech translation."}], "concept": "The Speech service can translate speech directly into up to two target languages in one request. This limit is part of the service design and cost model.\n\nFor four languages, use a Foundry (multi-service) resource. With it, additional target languages are possible, and translation fees apply for each language beyond the second. So the claims of unlimited targets at no extra cost are wrong.\n\nCustom speech models can be used with speech translation (they improve recognition of your vocabulary), so the claim that they cannot be used is wrong. Translator document translation works on documents, and not on live audio.\n\nFor live meetings, also remember Live Interpreter, which detects the spoken language automatically and switches.\n\nPlan costs: each extra target language increases cost per minute of audio, so confirm that all four are really needed.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/speech-translation"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A team has a large parallel corpus of English and German product text from a stable domain and wants a custom neural machine translation system that can be measured by BLEU. Which option fits?", "o": [{"t": "Adaptive custom translation with five pairs", "c": false, "e": "It adapts an LLM from 5 to 10,000 aligned pairs, which is not a trained NMT system."}, {"t": "Glossary only", "c": false, "e": "A glossary maps fixed terms and does not train a model."}, {"t": "Transliterate", "c": false, "e": "It converts script, not languages."}, {"t": "Custom Translator, which trains a custom NMT system from parallel documents and reports a BLEU score", "c": true, "e": "Gains of 5 to 10 BLEU points are common with suitable data."}], "concept": "Custom Translator trains a custom neural machine translation (NMT) system. You upload parallel documents (the same text in two languages, sentence-aligned), optional dictionaries, and tuning and test sets. After training, the portal reports a BLEU score. BLEU compares machine output with human reference translations: higher is better, and it should be compared on the same test set. You then publish the model and call translation with the custom model identifier.\n\nIt fits a large parallel corpus and a stable domain, as in the question, and it gives a measurable score.\n\nA glossary only forces fixed term mappings; it trains nothing and gives no BLEU. Adaptive custom translation with five pairs is for quick LLM adaptation with small
