<div id="app"></div>
<script>window.MOCK_EXAM = {"id": "mock-3", "title": "AI-103 Mock Exam 3", "shortTitle": "Mock exam 3", "description": "Full-length mock exam with 50 scenario questions. This test leans toward design decisions and calculations: PTU sizing, Reciprocal Rank Fusion, image size rules, resiliency, customer-managed keys, agent identity and the limits of Translator and Speech.", "defaultMinutes": 120, "domains": [{"id": 1, "name": "Plan and manage an Azure AI solution", "weight": "25-30%", "count": 14}, {"id": 2, "name": "Implement generative AI and agentic solutions", "weight": "30-35%", "count": 16}, {"id": 3, "name": "Implement computer vision solutions", "weight": "10-15%", "count": 7}, {"id": 4, "name": "Implement text analysis solutions", "weight": "10-15%", "count": 7}, {"id": 5, "name": "Implement information extraction solutions", "weight": "10-15%", "count": 6}], "questions": [{"d": 1, "q": "A team compares a model sold directly by Azure with a partner model from the Foundry catalog. Which TWO statements are correct?", "o": [{"t": "Benchmarks on the model card make testing on your own data unnecessary", "c": false, "e": "Benchmarks are averages. Your data decides."}, {"t": "Partner and community models are supported by the provider, billed through Azure Marketplace, and you should check the License tab and the provider's terms", "c": true, "e": "Wider choice comes with provider-specific support and license terms."}, {"t": "Every partner model supports quota increase requests", "c": false, "e": "Partner and community models generally do not, with Anthropic models as an exception."}, {"t": "Models sold directly by Azure are hosted, sold and supported by Microsoft and billed through Azure", "c": true, "e": "This category comes with Microsoft support and SLAs and a Responsible AI review."}, {"t": "Partner models are always covered by Microsoft SLAs", "c": false, "e": "The provider supports partner models."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/foundry-models-overview"], "ref": ["model-and-service-selection"]}, {"d": 1, "q": "You size a Data Zone Provisioned deployment. Peak load is 1,000 requests per minute, with an average prompt of 200 tokens and an average response of 20 tokens. For this model, one PTU provides 3,400 input TPM, the output-to-input ratio is 8, and deployments scale in increments of 5 PTUs. The model does not use normalized token accounting, and 50% of input tokens are served from the prompt cache. The formula is: Normalized TPM = Input TPM x (1 - cache rate) + ratio x Output TPM; PTUs = Normalized TPM / input TPM per PTU, rounded up to the increment. How many PTUs do you deploy?", "o": [{"t": "77 PTUs", "c": false, "e": "This is the unrounded value rounded up to the next integer. The deployment scales in steps of 5."}, {"t": "80 PTUs", "c": true, "e": "Input TPM = 200,000 and output TPM = 20,000. Normalized TPM = 100,000 + 8 x 20,000 = 260,000. 260,000 / 3,400 = 76.47, which rounds up to 80 with an increment of 5."}, {"t": "110 PTUs", "c": false, "e": "This is the result with a 0% cache rate (360,000 / 3,400 = 105.88, rounded up to 110)."}, {"t": "60 PTUs", "c": false, "e": "This ignores the output-token weight of 8, which dominates the calculation."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/provisioned-throughput"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "A team wants a one-year Azure Reservation to lower the cost of a provisioned deployment that will run at high utilization. In which order should they work?", "o": [{"t": "Request more quota instead of a reservation", "c": false, "e": "Quota is a deployment limit and is not a discount."}, {"t": "Use hourly billing and scale the PTUs up and down with the daily traffic curve", "c": false, "e": "Capacity may not be available when you scale back up, and continuous hourly billing at high use usually costs more."}, {"t": "Buy the reservation first, then create the deployment", "c": false, "e": "If capacity is short, the deployment fails and the reservation guarantees nothing."}, {"t": "Create the deployment, confirm that the capacity was allocated, then buy the reservation", "c": true, "e": "A reservation is a discount on the PTU meter and does not guarantee capacity."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/provisioned-throughput"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "Two teams build agents on one platform. Team A's agents must not see Team B's data, and production must be isolated from experiments in quota, policy and blast radius. Which structure fits?", "o": [{"t": "A separate Foundry resource for production and separate projects per team with project-level connections and scoped roles", "c": true, "e": "The resource is the boundary for networking, policy, RBAC and quota. Projects separate access patterns, and project-level connections avoid inheriting resource-level connections."}, {"t": "One Foundry resource and one project for everything, separated by naming conventions", "c": false, "e": "Names do not enforce access. All agents in a project share one managed identity."}, {"t": "One project per agent with all connections defined at resource level", "c": false, "e": "Resource-level connections are inherited by future projects."}, {"t": "Separate Azure subscriptions per agent", "c": false, "e": "This is far more than the requirement needs and complicates governance."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/what-is-foundry"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "An agent application uses a model deployment in a single region. During a regional incident, requests fail and nobody fails over to another deployment. What is true about Foundry in this situation?", "o": [{"t": "Provisioned deployments are always zone redundant", "c": false, "e": "Provisioned capacity gives consistent latency, not automatic failover."}, {"t": "Foundry automatically fails over standard deployments to a paired region", "c": false, "e": "Standard deployments are single-region and are not failed over automatically."}, {"t": "Foundry copies agents to a second region continuously", "c": false, "e": "Agent Service has no built-in backup or disaster recovery."}, {"t": "Foundry does not load-balance or fail over model deployments for you; use a gateway such as API Management and Data Zone or Global deployment types", "c": true, "e": "Resilience must be designed: routing, health checks and circuit breaking in a gateway, plus deployment types that are not tied to one region."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/high-availability-resiliency"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "You must be able to recover Foundry Agent Service state after the accidental deletion of a Cosmos DB database. Which TWO preparations should you make before an incident?", "o": [{"t": "Rely on Foundry's built-in point-in-time restore for agents", "c": false, "e": "Learn states there is no built-in backup, disaster recovery or point-in-time restore in Agent Service."}, {"t": "Use the basic agent setup, which has almost no recovery options for resource loss", "c": false, "e": "Standard setup, with your own resources, is the one with recovery options."}, {"t": "Enable Cosmos DB continuous backup with point-in-time restore", "c": true, "e": "Restore is not possible unless continuous backup was enabled beforehand."}, {"t": "Disable delete locks so that restores are easier", "c": false, "e": "Delete locks protect critical resources from accidental deletion."}, {"t": "Define agents as code in source control and deploy them from a pipeline", "c": true, "e": "Agent Service has no built-in backup, so agent definitions must be reproducible."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/high-availability-resiliency"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A regulated company wants to encrypt Foundry data with a key it controls in Azure Key Vault, using a managed identity of the Foundry resource. Which statement is correct?", "o": [{"t": "Hosted agents are fully covered, including the `$HOME` filesystem", "c": false, "e": "The `$HOME` filesystem is on platform-managed storage that is not encrypted with CMK."}, {"t": "CMK removes the need for a managed identity", "c": false, "e": "The managed identity is how the resource accesses the key."}, {"t": "Grant the managed identity permission to use the key (for Key Vault with Azure RBAC, the Key Vault Crypto User role), then enable customer-managed keys; prompt agents support CMK only with bring-your-own storage", "c": true, "e": "Customer-managed keys use Key Vault or Managed HSM. For prompt agents you configure CMK on your own Cosmos DB, Storage and AI Search."}, {"t": "Foundry encrypts with your key automatically when you create the key", "c": false, "e": "The resource must be granted access and CMK must be enabled."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/customer-managed-keys"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "Operations wants to know which deployment is being throttled and to report on the throttling over the last quarter, without writing KQL. Which TWO actions fit?", "o": [{"t": "Create a diagnostic setting that sends the metrics to a Log Analytics workspace or Storage for longer retention", "c": true, "e": "Platform metrics are kept for 93 days, so a quarterly report needs a copy."}, {"t": "In Azure Monitor metrics explorer, filter the status code to 429 and split by `ModelDeploymentName`", "c": true, "e": "Metrics need no query language, and splitting by deployment shows which one is throttled."}, {"t": "Enable continuous evaluation on production traffic", "c": false, "e": "Evaluators score quality and safety, not throttling."}, {"t": "Add tracing spans in each application", "c": false, "e": "This is code work and the traces do not aggregate the resource's 429 counts the same way."}, {"t": "Rely on platform metrics for a six-month history", "c": false, "e": "Platform metrics are stored for 93 days."}], "src": ["https://learn.microsoft.com/en-us/azure/azure-monitor/essentials/data-platform-metrics"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 1, "q": "A security review finds that agent traces in Application Insights contain customers' phone numbers and one API key that was placed in a tool argument. What should you do?", "o": [{"t": "Turn off tracing in production", "c": false, "e": "This removes the ability to debug and does not fix the practice of leaking secrets."}, {"t": "Redact or minimize personal data and never place secrets in prompts, tool arguments or span attributes; apply the same access control and retention as production logs", "c": true, "e": "Traces can contain user text, outputs and tool arguments, so privacy controls must be applied before data reaches telemetry."}, {"t": "Keep the data and shorten the retention to one day", "c": false, "e": "Secrets should not be recorded in the first place."}, {"t": "Move the traces to a public storage account", "c": false, "e": "This increases exposure."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/observability/concepts/trace-agent-concept"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 1, "q": "A team has not selected a model yet and must choose between two candidates for a new assistant. Which evaluation stage and tools apply?", "o": [{"t": "Pre-production: the AI red teaming agent only", "c": false, "e": "Red teaming tests attacks on a built system and does not compare models on quality."}, {"t": "Base model selection: use Foundry benchmarks and compare models, then run candidates on your own test prompts", "c": true, "e": "This is stage 1, which answers which model fits. Benchmarks are averages, so your own data decides."}, {"t": "Scheduled evaluation to detect drift", "c": false, "e": "Drift detection comes after deployment."}, {"t": "Post-production: continuous evaluation of sampled traffic", "c": false, "e": "There is no production traffic yet."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/observability"], "ref": ["observability-and-agent-lifecycle", "model-and-service-selection"]}, {"d": 1, "q": "A churn-prediction model deployed to an Azure Machine Learning online endpoint receives production data that gradually differs from the training data. You want a scheduled check and an alert when a threshold is exceeded. What should you configure?", "o": [{"t": "An Application Insights availability test", "c": false, "e": "It checks reachability, not data distribution."}, {"t": "Azure Machine Learning model monitoring with a data drift signal compared with a baseline, with alert notification", "c": true, "e": "Built-in signals are data drift, prediction drift and data quality, and a default alert email goes to the person who set up the monitor."}, {"t": "Foundry continuous evaluation with the Groundedness evaluator", "c": false, "e": "This evaluates LLM answers, not tabular model inputs."}, {"t": "A diagnostic setting for the Cognitive Services resource", "c": false, "e": "Logs do not compare distributions with a baseline."}], "src": ["https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-model-performance"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 1, "q": "An HR assistant program includes these activities: (1) a red team and risk evaluators run before launch, (2) a guardrail and grounding with citations are added, (3) a named owner, audit logs and an incident process are set up. Which mapping to Discover, Protect and Govern is correct?", "o": [{"t": "(1) Discover, (2) Govern, (3) Protect", "c": false, "e": "Guardrails and grounding are Protect, and ownership and audit are Govern."}, {"t": "(1) Govern, (2) Protect, (3) Discover", "c": false, "e": "Ownership and audit are Govern, not Discover."}, {"t": "(1) Discover, (2) Protect, (3) Govern", "c": true, "e": "Discover finds what can go wrong, Protect stops it at runtime, and Govern assigns accountability and proof."}, {"t": "(1) Protect, (2) Discover, (3) Govern", "c": false, "e": "Red teaming finds problems and is Discover. Guardrails are runtime protection."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/responsible-use-of-ai-overview"], "ref": ["responsible-ai-governance"]}, {"d": 1, "q": "A cloud governance team wants to prevent developers from creating expensive deployment types in the Foundry resources of the production subscription. Which mechanism should they use?", "o": [{"t": "Azure Policy that denies `sku.name` values on `Microsoft.CognitiveServices/accounts/deployments`", "c": true, "e": "Policy restricts deployment types for every resource in scope."}, {"t": "A content filter threshold", "c": false, "e": "Content filters control content, not deployment types."}, {"t": "A smaller `max_output_tokens`", "c": false, "e": "This caps output length per call and does not stop expensive deployments."}, {"t": "A written guideline in the team wiki", "c": false, "e": "It is not enforced."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types"], "ref": ["capacity-cost-and-throttling", "platform-network-and-reliability"]}, {"d": 1, "q": "A team built agents in a hub-based project. They now want to use the current Foundry experience. What should they expect?", "o": [{"t": "The old project is converted in place by changing the SDK package", "c": false, "e": "The package version does not convert resources."}, {"t": "Conversations are moved by renaming the project", "c": false, "e": "Renaming does not migrate data."}, {"t": "There is no direct upgrade path for agents, files, conversations or vector stores; model deployments and quota can be reused", "c": true, "e": "Hub-based projects are the classic experience, and the content must be recreated in a Foundry project."}, {"t": "Everything migrates automatically with one click", "c": false, "e": "There is no direct upgrade path for these items."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/what-is-foundry"], "ref": ["platform-network-and-reliability"]}, {"d": 2, "q": "A company has a large code base that uses the OpenAI Python SDK and wants to move it to Azure with the fewest changes, using Microsoft Entra ID instead of keys. Which approach fits?", "o": [{"t": "Point the OpenAI client at `https://<resource>.openai.azure.com/openai/v1/` and use an Entra token provider as the credential", "c": true, "e": "The OpenAI-compatible endpoint exposes the full OpenAI API surface, and tokens are preferred over keys."}, {"t": "Keep API keys because Entra is not supported on this endpoint", "c": false, "e": "Entra ID tokens are supported and preferred."}, {"t": "Use the Speech SDK against the Speech endpoint", "c": false, "e": "It is for speech scenarios."}, {"t": "Rewrite everything with the Foundry project endpoint and the Agent Framework", "c": false, "e": "This is more work than the requirement needs."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/sdk-overview"], "ref": ["foundry-sdk-and-generative-apps"]}, {"d": 2, "q": "A containerized service uses `DefaultAzureCredential()` with a Microsoft Entra service principal. How should the credential values be provided so that no secret appears in code?", "o": [{"t": "Inside the system prompt", "c": false, "e": "Secrets never belong in prompts."}, {"t": "As environment variables `AZURE_TENANT_ID`, `AZURE_CLIENT_ID` and `AZURE_CLIENT_SECRET`, which `DefaultAzureCredential` reads", "c": true, "e": "The credential tries several sources in order, including environment variables for a service principal."}, {"t": "Not needed, because `AIProjectClient` has an anonymous mode", "c": false, "e": "A credential object is always required."}, {"t": "Hard-coded in the constructor of `AIProjectClient`", "c": false, "e": "This puts a secret in code."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/sdk-overview"], "ref": ["foundry-sdk-and-generative-apps"]}, {"d": 2, "q": "Which TWO statements about few-shot examples are correct?", "o": [{"t": "They guarantee factual correctness of the output", "c": false, "e": "They improve format and consistency, not truth."}, {"t": "They permanently fine-tune the deployment", "c": false, "e": "Fine-tuning is a separate training process."}, {"t": "The order of examples can matter, and examples should show edge cases", "c": true, "e": "Examples shape the pattern the model continues, so their choice and order affect the result."}, {"t": "They are required for reasoning models", "c": false, "e": "Classic techniques such as these are not recommended for reasoning models."}, {"t": "They condition the model for the current call only and nothing is learned permanently", "c": true, "e": "Examples are part of the prompt, so they do not change the model."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering"], "ref": ["prompt-engineering-parameters-and-reflection"]}, {"d": 2, "q": "A team migrates a classification prompt from a chat model to a reasoning model. The old prompt has a long role description and \"think step by step\" instructions. What does Microsoft guidance recommend?", "o": [{"t": "Ask the model to output its raw reasoning", "c": false, "e": "Extracting reasoning other than through the reasoning summary setting is unsupported."}, {"t": "Set `temperature` to 2 to encourage more thinking", "c": false, "e": "Randomness does not control reasoning depth."}, {"t": "Keep the long prompt and add more examples of reasoning", "c": false, "e": "More scaffolding is not recommended for reasoning models."}, {"t": "Keep the prompt short and goal-oriented, use the developer message, control cost with `reasoning_effort` and token caps, and drop the classic step-by-step technique", "c": true, "e": "These techniques are not recommended for reasoning models."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning"], "ref": ["prompt-engineering-parameters-and-reflection", "model-and-service-selection"]}, {"d": 2, "q": "A hybrid search returns three documents. Reciprocal Rank Fusion uses `score = sum of 1 / (rank + k)` with k = 60. Document A ranks 1st in the keyword list and 5th in the vector list. Document B ranks 2nd in the keyword list and 1st in the vector list. Document C ranks 3rd in the keyword list and is not in the vector list. What is the final order?", "o": [{"t": "B, A, C", "c": true, "e": "B = 1/62 + 1/61 = 0.03252, A = 1/61 + 1/65 = 0.03178, C = 1/63 = 0.01587. A document that is high in both lists wins."}, {"t": "C, B, A", "c": false, "e": "C appears in only one list and scores about half as much."}, {"t": "A, B, C", "c": false, "e": "A was first in the keyword list, but B scores higher because it is high in both lists."}, {"t": "A, C, B", "c": false, "e": "B's score is not the lowest, since it ranks 1st in the vector list."}], "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-ranking"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "An enterprise search assistant must return only documents that the signed-in user is allowed to read. A developer proposes adding \"only show documents the user may read\" to the system prompt. What is the better design?", "o": [{"t": "Rerank with the semantic ranker so that private documents rank low", "c": false, "e": "Ranking is not authorization."}, {"t": "Apply security trimming at retrieval: filter on access information stored with each chunk, so unauthorized content never reaches the model", "c": true, "e": "Access information is collected when content is ingested, and filters are applied at query time."}, {"t": "Lower the temperature", "c": false, "e": "It does not enforce access."}, {"t": "Keep the prompt rule and trust the model", "c": false, "e": "A prompt rule can be bypassed, and the content has already reached the model."}], "src": ["https://learn.microsoft.com/en-us/azure/search/search-security-built-in"], "ref": ["rag-retrieval-and-grounding", "azure-ai-search-configuration"]}, {"d": 2, "q": "Users ask a very specific question about one clause. The answer is in a chunk that ranks 5th, but the application passes only `top_k = 3` chunks to the model, which answers \"not found\". What should you try first?", "o": [{"t": "Disable the prompt rule \"say you don't know\"", "c": false, "e": "This would make the model guess."}, {"t": "Raise `top_k` so that the right chunk reaches the prompt, and add keyword matching with hybrid search if exact names matter", "c": true, "e": "A very low `top_k` drops the right chunk before generation."}, {"t": "Increase `max_output_tokens`", "c": false, "e": "The prompt is missing the evidence, not the answer budget."}, {"t": "Change the embedding model", "c": false, "e": "This requires re-embedding and the chunk was already found."}], "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-ranking"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A relevance evaluation of a RAG assistant passes, yet a reviewer finds an answer that contains an invented date. Why did the evaluation not catch it, and which evaluator should be added?", "o": [{"t": "Add Response Completeness, which detects invented facts", "c": false, "e": "Completeness is recall of expected facts, not precision."}, {"t": "Add Document Retrieval, which checks the final answer", "c": false, "e": "It evaluates ranking against labels, not the answer text."}, {"t": "Relevance checks whether the answer addresses the question and can pass an answer that is fabricated; add Groundedness, which checks that claims stay inside the retrieved context", "c": true, "e": "Relevance and groundedness measure different things. Groundedness is the fabrication detector."}, {"t": "Relevance always fails on fabricated answers, so the reviewer is wrong", "c": false, "e": "A fluent, on-topic answer can score high on relevance."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A developer wants the SDK to build the JSON Schema from a Python class and return a typed object. Which call matches the Learn sample for the Responses API?\n```python\nclass AdverseEvent(BaseModel):\n    term: str\n    severity: str\n    onset_date: str | None\n```", "o": [{"t": "`client.embeddings.create(model=..., input=...)`", "c": false, "e": "This creates vectors."}, {"t": "`client.images.generate(model=..., prompt=...)`", "c": false, "e": "This is for images."}, {"t": "`client.responses.create(model=..., input=..., response_format=\"json\")`", "c": false, "e": "This asks for JSON only. It does not provide your schema or parsing."}, {"t": "`client.responses.parse(model=..., input=..., text_format=AdverseEvent)` and then read `response.output_parsed`", "c": true, "e": "The SDK converts the Pydantic model to a schema and parses the result. The optional field is emulated with null."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/structured-outputs"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A model sometimes omits the required `order_id` argument when it calls your function tool, and sometimes sends extra properties. The schema only lists `properties`. Which changes reduce these errors?", "o": [{"t": "Move the schema into the system prompt as prose", "c": false, "e": "A formal schema with required fields is more reliable."}, {"t": "Increase `max_output_tokens`", "c": false, "e": "Output length does not control argument shape."}, {"t": "Add `required: [\"order_id\"]` and `additionalProperties: false`, set `strict=True`, and give the parameter a clear description with an example", "c": true, "e": "The schema and descriptions are all the model knows about the function. Strict mode validates the call."}, {"t": "Switch the deployment to Batch", "c": false, "e": "Batch does not affect function-call accuracy."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "An agent has twelve tools. Two of them have overlapping descriptions (\"search customers\" and \"find customer records\"), and traces show the agent picks the wrong one about a third of the time. What is the best remedy?", "o": [{"t": "Increase the temperature", "c": false, "e": "Randomness makes selection less consistent."}, {"t": "Disable tracing", "c": false, "e": "Tracing shows the problem and is not its cause."}, {"t": "Keep the tool set small, merge or remove the overlap and write distinct descriptions, then measure with tool selection evaluators", "c": true, "e": "Each tool costs tokens and overlapping tools cause wrong selections."}, {"t": "Add more tools with similar names so that one fits every case", "c": false, "e": "This increases overlap."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "In the Responses API, which statement describes how to continue a multi-turn interaction?", "o": [{"t": "Store the state in the system prompt", "c": false, "e": "Prompts are not a state store."}, {"t": "Resend the whole history in every request because the service stores nothing", "c": false, "e": "A conversation or `previous_response_id` avoids resending the history."}, {"t": "Create a new agent version for every user message", "c": false, "e": "Versions are for changes to the agent, not for turns."}, {"t": "Continue from a previous response with `previous_response_id`, or use a conversation object that stores messages, tool calls and tool outputs", "c": true, "e": "A response is one execution. A conversation persists items across turns."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/runtime-components"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "A guardrail for an agent should inspect what the agent proposes to send to a tool (the tool name and arguments), and stop the action if it would send sensitive data. Which intervention point and behavior apply?", "o": [{"t": "User input, with annotate only", "c": false, "e": "User input is scanned before the model runs and does not see the tool arguments the agent creates."}, {"t": "Output, with annotate only", "c": false, "e": "Output is the final answer. Annotate-only does not block."}, {"t": "Tool call, with annotate and block: the call is not executed and the agent stops until there is another user input", "c": true, "e": "This point scans what the agent proposes to send to a tool. It is preview and for agents only."}, {"t": "Tool response, which stops the model from reading files", "c": false, "e": "Tool response scans what a tool sends back."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "An agent calls a protected MCP server with its agent identity. Role assignments on the target resource are correct, but the call fails. The token request used the URL of the MCP server as the audience. What is the cause?", "o": [{"t": "The audience must be the downstream service's resource identifier (for example `https://storage.azure.com`), not the URL of your MCP server", "c": true, "e": "A wrong audience fails even when role-based access control is correct."}, {"t": "Guardrails block all tool calls", "c": false, "e": "A guardrail does not change the token audience."}, {"t": "The model deployment has too little quota", "c": false, "e": "Quota would cause 429 responses."}, {"t": "The managed identity needs the role instead of the agent identity", "c": false, "e": "The managed identity authenticates the blueprint. The agent identity needs the role."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/overview"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A scheduling agent should only reach calendar data that the signed-in user is allowed to see. Which access pattern fits?", "o": [{"t": "A shared API key stored in the agent instructions", "c": false, "e": "Keys bypass role-based access and secrets do not belong in prompts."}, {"t": "Anonymous access to the calendar API", "c": false, "e": "There is no per-user access control."}, {"t": "Client credentials with a broad application role", "c": false, "e": "This gives the agent its own authority, which can exceed the user's permissions."}, {"t": "On-behalf-of (delegated, attended) access, so the agent can only reach what the user can reach", "c": true, "e": "The agent acts for the signed-in user and is limited by that user's permissions."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/overview"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A Foundry agent must call another team's agent that is exposed as an A2A endpoint. What is the setup?", "o": [{"t": "Create a project connection of category `RemoteA2A` to the remote agent's base URI with authentication, then add an `A2ATool` that points to the connection", "c": true, "e": "The orchestrator reads the remote agent card and calls it as a tool."}, {"t": "Add a `FunctionTool` and return the remote agent's answer as `function_call_output`", "c": false, "e": "This is a client-side function pattern, not the A2A tool."}, {"t": "Copy the remote agent's instructions into the local agent", "c": false, "e": "This duplicates the agent instead of calling it."}, {"t": "Use the classic Connected Agents tool", "c": false, "e": "It is not available in the new Foundry Agent Service."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/agent-to-agent"], "ref": ["building-agents-with-foundry"]}, {"d": 3, "q": "A team requests a custom image size from a GPT-Image-2 deployment. The size rules: both edges are multiples of 16, the long edge is at most 3,840 px, the aspect ratio is between 1:3 and 3:1, and total pixels are between 655,360 and 8,294,400. Which size is valid?", "o": [{"t": "1920x1080", "c": false, "e": "1080 is not a multiple of 16."}, {"t": "640x960", "c": false, "e": "Both edges are multiples of 16, but 614,400 pixels are below the 655,360 minimum."}, {"t": "1920x1088", "c": true, "e": "Both edges are multiples of 16 (1088 = 68 x 16), the aspect ratio is about 1.76, and the total of 2,088,960 pixels is in range."}, {"t": "3840x2400", "c": false, "e": "Both edges are multiples of 16, but 9,216,000 pixels exceed the 8,294,400 maximum."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"], "ref": ["image-and-video-generation"]}, {"d": 3, "q": "A design tool wants to show progressive previews while a high-quality image is still being generated, instead of a long blank wait. What should you use?", "o": [{"t": "Set `stream=true` and `partial_images` (0 to 3), and handle `image_generation.partial_image` events", "c": true, "e": "Each event carries `partial_image_index` and `b64_json` for an early preview."}, {"t": "Use `output_compression=0`", "c": false, "e": "This only affects JPEG compression."}, {"t": "Poll the job status endpoint every second", "c": false, "e": "Image generation does not use the Sora-style job lifecycle here."}, {"t": "Set `n=10` and show the images as they finish", "c": false, "e": "`n` creates several final images, not progressive previews."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"], "ref": ["image-and-video-generation"]}, {"d": 3, "q": "A marketing team has a finished Sora video and wants to change only the product color in one scene, without regenerating the whole clip. Which feature should they use?", "o": [{"t": "Content Understanding video analyzer", "c": false, "e": "It analyzes video and does not edit it."}, {"t": "`n_variants=4` on the original prompt", "c": false, "e": "Variants are new videos from the same prompt, not edits of the finished one."}, {"t": "Remix, which applies targeted edits to an existing video", "c": true, "e": "Remix changes an existing clip instead of generating everything again."}, {"t": "Image edit with a mask", "c": false, "e": "This edits still images."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/video-generation"], "ref": ["image-and-video-generation"]}, {"d": 3, "q": "A retailer must extract the same fields (count of empty slots, overall shelf condition from three allowed values) from 100,000 shelf photos, with typed JSON output. Which approach fits best?", "o": [{"t": "A Content Understanding custom image analyzer based on `prebuilt-image` with a `fieldSchema` (a number field and a `classify` field with an `enum`)", "c": true, "e": "Schema-driven analyzers return the same typed fields for every image and are built for repeatable extraction at scale."}, {"t": "Ask a vision chat model an open question for each photo", "c": false, "e": "Free-form answers drift between images and need extra prompting for typed output."}, {"t": "A text-only embedding model", "c": false, "e": "It cannot read images."}, {"t": "Image Analysis 4.0 tags", "c": false, "e": "Tags describe content generally and do not return your custom fields."}], "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers"], "ref": ["multimodal-understanding"]}, {"d": 3, "q": "A site must create a square avatar from user photos, cropped around the subject. Which Image Analysis 4.0 feature should you request?", "o": [{"t": "`tags`", "c": false, "e": "Tags describe content and return no crop rectangle."}, {"t": "`smartCrops` with an aspect ratio of 1.0, then apply the returned bounding box in your code", "c": true, "e": "Smart crops return one bounding box per requested aspect ratio (supported range 0.75 to 1.8)."}, {"t": "`objects`", "c": false, "e": "Object detection returns object boxes, not a crop for a target ratio."}, {"t": "`denseCaptions`", "c": false, "e": "It returns captions for regions, not a crop."}], "src": ["https://learn.microsoft.com/en-us/azure/ai-services/computer-vision/how-to/call-analyze-image-40"], "ref": ["multimodal-understanding"]}, {"d": 3, "q": "A publisher resizes AI-generated images with a tool that strips file metadata. Which provenance signal might still be detectable afterwards?", "o": [{"t": "The invisible watermark embedded in the content", "c": true, "e": "Content Credentials (C2PA) are metadata and are lost by many edits. An imperceptible watermark may survive."}, {"t": "The EXIF camera model", "c": false, "e": "AI-generated images have no camera and EXIF is metadata too."}, {"t": "The C2PA Content Credentials", "c": false, "e": "They are cryptographically signed metadata and are removed when metadata is stripped."}, {"t": "The file name", "c": false, "e": "File names are not a provenance signal."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/content-safety/provenance-disclosure"], "ref": ["responsible-ai-for-multimodal-content"]}, {"d": 3, "q": "A team reviews its workflow for publishing generated marketing images: filter the prompt, generate, filter the output, run automated brand checks. Which two steps must still be added before publishing, according to the review workflow?", "o": [{"t": "Human approval with the reviewer ID and time stored, and attaching provenance with a label to the final asset", "c": true, "e": "Public assets need human approval and provenance. The original with credentials is kept as the system of record."}, {"t": "Increasing the severity threshold to High to speed up approval", "c": false, "e": "It makes the filter more permissive."}, {"t": "A second generation to compare results, then delete the first image", "c": false, "e": "This is not a review step and loses the evidence."}, {"t": "Turning off output filtering because automated checks passed", "c": false, "e": "Filtering must apply on both input and output."}], "src": ["https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/content-safety/provenance-disclosure"], "ref": ["responsible-ai-for-multimodal-content"]}, {"d": 4, "q": "A pipeline must summarize support chats with an LLM while keeping risk low. The chats contain names, phone numbers and card numbers. Which design fits?", "o": [{"t": "Send the raw chats to the LLM and ask it to ignore personal data", "c": false, "e": "The model has already received the personal data."}, {"t": "Store the raw chats in the prompt cache", "c": false, "e": "The cache is not a privacy control."}, {"t": "Skip PII detection because the LLM is more accurate", "c": false, "e": "Purpose-built PII categories and offsets are auditable and run before data leaves the boundary."}, {"t": "Run Azure Language PII detection first, send only the redacted text to the LLM, and treat the text as untrusted input", "c": true, "e": "This hybrid pattern keeps cost and risk low and removes personal data before the model sees it."}], "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "You use an LLM to classify support tickets by urgency and need consistent, parseable labels. Which TWO practices apply?", "o": [{"t": "Skip evaluation because LLMs are accurate", "c": false, "e": "Evaluate accuracy per label on a labeled sample and compare with the Language feature."}, {"t": "Define each label in the prompt and include an `unknown` option for unclear text", "c": true, "e": "Definitions and an out reduce invented labels."}, {"t": "Use Structured Outputs so the app can parse the result, and set the temperature low (0 to 0.3)", "c": true, "e": "A schema keeps the shape fixed and a low temperature keeps labels consistent."}, {"t": "Let the model invent label names freely", "c": false, "e": "Labels outside the list break downstream logic."}, {"t": "Set the temperature to 1.5 to cover edge cases", "c": false, "e": "Higher randomness gives inconsistent labels."}], "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "An enterprise bot needs a calendar skill (intent and entity extraction) and an FAQ from product manuals, and must send each user utterance to the correct one. Which Azure Language capability routes between them?", "o": [{"t": "Orchestration workflow, which routes an utterance to the right CLU or custom question answering project", "c": true, "e": "It is designed for bots that combine a CLU skill with an FAQ."}, {"t": "Sentiment analysis", "c": false, "e": "It labels sentiment, not routing."}, {"t": "Named entity recognition", "c": false, "e": "It extracts entities only."}, {"t": "Language detection", "c": false, "e": "It identifies language, not intent routing."}], "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A team submits a batch transcription job for recordings in English, Spanish or French (the language of each file is unknown) and wants to be notified when the job finishes. Which options apply?", "o": [{"t": "Provide 25 candidate locales so that every file is covered", "c": false, "e": "Language identification supports 2 to 10 candidate locales."}, {"t": "Ignore the validation request and return an empty response", "c": false, "e": "The validation token must be echoed back."}, {"t": "Enable `languageIdentification` with 2 to 10 candidate locales and register a webhook, echoing the `validationToken` from the validation request as plain text", "c": true, "e": "These are the documented batch options for language identification and notifications."}, {"t": "Use fast transcription, because it supports webhooks", "c": false, "e": "Fast transcription is synchronous and returns results directly."}], "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/batch-transcription-create"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A company wants a branded synthetic voice for its app. Which TWO statements are correct?", "o": [{"t": "Visemes are available for every voice and language", "c": false, "e": "Visemes are listed for en-US neural voices only."}, {"t": "Custom voice is available to every customer without approval", "c": false, "e": "It is limited access."}, {"t": "Text to speech billing counts characters, including SSML markup (except `<speak>` and `<voice>`)", "c": true, "e": "Long SSML adds to the count, and each Chinese character counts as two."}, {"t": "Batch synthesis is for audio shorter than a minute", "c": false, "e": "The batch synthesis API is for audio longer than 10 minutes, such as audiobooks."}, {"t": "Custom voice is limited access, needs approval and consent from the voice talent, and requires disclosing the synthetic voice to listeners", "c": true, "e": "This is the responsible-use requirement for custom voices."}], "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/text-to-speech"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A bank must translate 800 PDF contracts nightly, preserving layout, using a glossary for approved terms. The Translator resource has a private endpoint and VNet access enabled. Which statement is correct?", "o": [{"t": "Use speech translation", "c": false, "e": "It handles audio."}, {"t": "Use synchronous document translation for all 800 files", "c": false, "e": "Synchronous translation handles one file and returns the result directly."}, {"t": "Use Transliterate", "c": false, "e": "It converts script, not languages."}, {"t": "Use batch document translation with Blob containers (managed identity preferred) and a glossary file, and call the custom endpoint, because access tokens cannot be used when VNet or private endpoints are enabled", "c": true, "e": "Batch handles many files, glossaries come as CSV, XLIFF or TSV, and private networking requires the custom endpoint."}], "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/overview"], "ref": ["translation"]}, {"d": 4, "q": "A localization app sends 120 text segments in one `2026-06-06` Translate request with an LLM deployment, and the request is rejected. What is the likely reason?", "o": [{"t": "The request must use the v3.0 format", "c": false, "e": "The latest GA version uses `inputs` and `value`."}, {"t": "The LLM path allows a maximum of 50 array elements (and 5,000 characters per element); the NMT path allows 1,000", "c": true, "e": "Split the batch into requests of 50 or fewer, or use NMT for high-volume baseline traffic."}, {"t": "The `inputs` array must contain exactly one element", "c": false, "e": "Multiple elements are allowed within the limits."}, {"t": "LLM translation does not support arrays", "c": false, "e": "It supports arrays of up to 50 elements."}], "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/overview"], "ref": ["translation"]}, {"d": 5, "q": "Which statement about the Azure AI Search indexer objects is correct?", "o": [{"t": "A skillset is required for every indexer", "c": false, "e": "Skillsets are optional."}, {"t": "One indexer can read several data sources and write to several indexes", "c": false, "e": "An indexer reads one data source and writes to one index."}, {"t": "The indexer creates the index schema automatically", "c": false, "e": "You create the index."}, {"t": "One indexer uses one data source and writes to one index; many indexers can write to the same index, and you create the index yourself", "c": true, "e": "The indexer connects the data source, optional skillset and index."}], "src": ["https://learn.microsoft.com/en-us/azure/search/search-indexer-overview"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "After changing the skillset (a new chunk size), the indexer finishes without errors, but old documents still show old chunks. What should you do, and which feature avoids repeating costly OCR on unchanged files?", "o": [{"t": "Delete the search service", "c": false, "e": "This is far beyond what is needed."}, {"t": "Reset the indexer before re-running, and use the enrichment cache (preview) to reuse skill outputs for unchanged documents", "c": true, "e": "A reset makes the indexer reprocess content, and the cache saves skill cost."}, {"t": "Enable the knowledge store", "c": false, "e": "It stores enrichment output for analytics and does not trigger reprocessing."}, {"t": "Increase the number of replicas", "c": false, "e": "Replicas add concurrency but do not reprocess documents."}], "src": ["https://learn.microsoft.com/en-us/azure/search/cognitive-search-concept-intro"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "Analysts want to use the enriched output of an indexer pipeline (extracted entities, OCR text) in Power BI, outside of search queries. Which skillset output serves this?", "o": [{"t": "A vectorizer", "c": false, "e": "It encodes queries at query time."}, {"t": "A knowledge store, which writes enriched content to blobs or tables in Azure Storage", "c": true, "e": "It is the optional output for analytics and Power BI."}, {"t": "The enrichment cache", "c": false, "e": "It exists to reuse skill outputs, not for reporting."}, {"t": "The search index only", "c": false, "e": "The index is for search queries and is required, but it is not the analytics output."}], "src": ["https://learn.microsoft.com/en-us/azure/search/cognitive-search-concept-intro"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A custom Web API skill calls an Azure Function that sometimes needs 4 minutes to respond. Records are dropped and the skill times out. Which statement is correct?", "o": [{"t": "Increase `degreeOfParallelism` to 10 to shorten each call", "c": false, "e": "Parallelism runs more calls at once. It does not shorten one call."}, {"t": "Set `timeout` to `PT10M`", "c": false, "e": "The maximum is 230 seconds."}, {"t": "Return the records in any order and omit `recordId`", "c": false, "e": "Each returned record needs its `recordId`, or it is dropped."}, {"t": "The skill `timeout` has a maximum of 230 seconds, so work that takes longer needs a different design (for example transcribe in advance and let the skill read the result)", "c": true, "e": "The default is 30 seconds and the maximum is 230 seconds."}], "src": ["https://learn.microsoft.com/en-us/azure/search/cognitive-search-custom-skill-web-api"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A Content Understanding analyzer extracts contract fields. The team wants to auto-approve values with high confidence and send uncertain ones to a reviewer, and to show where in the document each value came from. Which setting should they enable?", "o": [{"t": "`tableFormat` set to markdown", "c": false, "e": "It only changes the table output format."}, {"t": "`enableOcr` set to false", "c": false, "e": "This turns off OCR and does not add confidence."}, {"t": "`omitContent`", "c": false, "e": "It omits content from the output and does not add confidence."}, {"t": "`estimateFieldSourceAndConfidence`, which returns source location and confidence per field", "c": true, "e": "Confidence (0 to 1) and grounding allow routing between automatic approval and human review."}], "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "A RAG pipeline needs clean text with headings and tables preserved from varied PDFs, as input to chunking and an LLM. Which Content Understanding choice fits?", "o": [{"t": "Plain text output with tables flattened", "c": false, "e": "Flattened tables lose which value belongs to which column."}, {"t": "A `generate` field that returns the whole document as a string", "c": false, "e": "It costs tokens and loses the layout."}, {"t": "The RAG-oriented analyzer `prebuilt-documentSearch`, using the Markdown output", "c": true, "e": "Markdown keeps headings and tables and describes figures, which makes good LLM input."}, {"t": "`prebuilt-videoSearch`", "c": false, "e": "It is the RAG analyzer for video."}], "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/document/overview"], "ref": ["content-understanding-and-document-intelligence"]}]};</script>
