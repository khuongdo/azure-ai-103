<div id="app"></div>
<script>window.MOCK_EXAM = {"id": "mock-3", "title": "AI-103 Mock Exam 3", "shortTitle": "Mock exam 3", "description": "Full-length mock exam with 50 scenario questions. This test leans toward design decisions and calculations: PTU sizing, Reciprocal Rank Fusion, image size rules, resiliency, customer-managed keys, agent identity and the limits of Translator and Speech.", "defaultMinutes": 120, "domains": [{"id": 1, "name": "Plan and manage an Azure AI solution", "weight": "25-30%", "count": 14}, {"id": 2, "name": "Implement generative AI and agentic solutions", "weight": "30-35%", "count": 16}, {"id": 3, "name": "Implement computer vision solutions", "weight": "10-15%", "count": 7}, {"id": 4, "name": "Implement text analysis solutions", "weight": "10-15%", "count": 7}, {"id": 5, "name": "Implement information extraction solutions", "weight": "10-15%", "count": 6}], "questions": [{"d": 1, "q": "A team compares a model sold directly by Azure with a partner model from the Foundry catalog. Which TWO statements are correct?", "o": [{"t": "Benchmarks on the model card make testing on your own data unnecessary", "c": false, "e": "Benchmarks are averages. Your data decides."}, {"t": "Partner and community models are supported by the provider, billed through Azure Marketplace, and you should check the License tab and the provider's terms", "c": true, "e": "Wider choice comes with provider-specific support and license terms."}, {"t": "Every partner model supports quota increase requests", "c": false, "e": "Partner and community models generally do not, with Anthropic models as an exception."}, {"t": "Models sold directly by Azure are hosted, sold and supported by Microsoft and billed through Azure", "c": true, "e": "This category comes with Microsoft support and SLAs and a Responsible AI review."}, {"t": "Partner models are always covered by Microsoft SLAs", "c": false, "e": "The provider supports partner models."}], "concept": "The Foundry model catalog groups models by who sells and supports them, and this decides support, billing and legal terms.\n\nModels sold directly by Azure are hosted by Microsoft, sold under Microsoft product terms and billed through your Azure subscription. They come with Microsoft support and the Microsoft SLAs for the service. Partner and community models come from other providers. The provider is responsible for support and terms, billing for many of them goes through Azure Marketplace, and you should read the License tab on the model card and the provider's terms. Microsoft SLAs do not automatically cover them, and not every model allows quota increase requests.\n\nA benchmark on a model card is measured on public data. It helps you shortlist, but your documents, language and tasks are different, so test candidates on your own prompts before you decide.\n\nMemory aid: \"sold by Azure\" = Microsoft is the shop and the repair desk; partner model = Microsoft is the shopping mall, the brand repairs it.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/foundry-models-overview"], "ref": ["model-and-service-selection"]}, {"d": 1, "q": "You size a Data Zone Provisioned deployment. Peak load is 1,000 requests per minute, with an average prompt of 200 tokens and an average response of 20 tokens. For this model, one PTU provides 3,400 input TPM, the output-to-input ratio is 8, and deployments scale in increments of 5 PTUs. The model does not use normalized token accounting, and 50% of input tokens are served from the prompt cache. The formula is: Normalized TPM = Input TPM x (1 - cache rate) + ratio x Output TPM; PTUs = Normalized TPM / input TPM per PTU, rounded up to the increment. How many PTUs do you deploy?", "o": [{"t": "77 PTUs", "c": false, "e": "This is the unrounded value rounded up to the next integer. The deployment scales in steps of 5."}, {"t": "80 PTUs", "c": true, "e": "Input TPM = 200,000 and output TPM = 20,000. Normalized TPM = 100,000 + 8 x 20,000 = 260,000. 260,000 / 3,400 = 76.47, which rounds up to 80 with an increment of 5."}, {"t": "110 PTUs", "c": false, "e": "This is the result with a 0% cache rate (360,000 / 3,400 = 105.88, rounded up to 110)."}, {"t": "60 PTUs", "c": false, "e": "This ignores the output-token weight of 8, which dominates the calculation."}], "concept": "Provisioned deployments are sized in PTUs (provisioned throughput units). A PTU is a unit of reserved model processing capacity. To find how many you need, convert your traffic into normalized tokens per minute and divide by what one PTU can process.\n\nStep 1: tokens per minute. 1,000 requests/min x 200 prompt tokens = 200,000 input TPM. 1,000 x 20 response tokens = 20,000 output TPM.\n\nStep 2: the formula in the question. Output tokens are heavier than input tokens, so they are multiplied by the ratio 8. Cached input is cheaper: with a 50% cache rate only half of the input counts. Normalized TPM = 200,000 x (1 - 0.5) + 8 x 20,000 = 100,000 + 160,000 = 260,000.\n\nStep 3: divide by 3,400 per PTU: 260,000 / 3,400 = 76.47 PTUs. Deployments scale in increments of 5, so round up to 80.\n\nRounding down to 77 or 75 would under-provision, and the deployment would return 429 at peak.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/provisioned-throughput"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "A team wants a one-year Azure Reservation to lower the cost of a provisioned deployment that will run at high utilization. In which order should they work?", "o": [{"t": "Request more quota instead of a reservation", "c": false, "e": "Quota is a deployment limit and is not a discount."}, {"t": "Use hourly billing and scale the PTUs up and down with the daily traffic curve", "c": false, "e": "Capacity may not be available when you scale back up, and continuous hourly billing at high use usually costs more."}, {"t": "Buy the reservation first, then create the deployment", "c": false, "e": "If capacity is short, the deployment fails and the reservation guarantees nothing."}, {"t": "Create the deployment, confirm that the capacity was allocated, then buy the reservation", "c": true, "e": "A reservation is a discount on the PTU meter and does not guarantee capacity."}], "concept": "An Azure Reservation is a billing commitment: you promise to pay for a quantity of PTUs for one month or one year, and in return the hourly price is lower. It changes the price meter only. It does not reserve physical capacity in the region.\n\nCapacity is allocated when you create the deployment. If the region cannot provide enough PTUs, the deployment fails. If you had bought the reservation first, you would have paid for a discount on capacity that you cannot use.\n\nSo the safe order is: create the deployment, confirm that the capacity was allocated and the deployment works, then buy a reservation sized to the deployed PTUs. Reservations suit stable, high utilization; for uneven traffic, hourly billing with scaling can be cheaper.\n\nQuota is also not a substitute: it is the permission to deploy, not a price discount.\n\nMemory aid: first make sure the seat exists, then buy the season ticket.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/provisioned-throughput"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "Two teams build agents on one platform. Team A's agents must not see Team B's data, and production must be isolated from experiments in quota, policy and blast radius. Which structure fits?", "o": [{"t": "A separate Foundry resource for production and separate projects per team with project-level connections and scoped roles", "c": true, "e": "The resource is the boundary for networking, policy, RBAC and quota. Projects separate access patterns, and project-level connections avoid inheriting resource-level connections."}, {"t": "One Foundry resource and one project for everything, separated by naming conventions", "c": false, "e": "Names do not enforce access. All agents in a project share one managed identity."}, {"t": "One project per agent with all connections defined at resource level", "c": false, "e": "Resource-level connections are inherited by future projects."}, {"t": "Separate Azure subscriptions per agent", "c": false, "e": "This is far more than the requirement needs and complicates governance."}], "concept": "Foundry has levels of structure, and each level is a boundary for something different.\n\nA Foundry resource is the top boundary for administration, networking, policy, quota and monitoring. A project, inside a resource, is the working area for a team: its agents, files, connections and role assignments. Agents in a project share one managed identity (until published), and connections defined at project level are visible only to that project.\n\nTo isolate production from experiments in quota, policy and blast radius, use separate resources (production versus non-production). To keep Team A away from Team B's data, use separate projects, define connections at project level, and scope roles to each project.\n\nNaming conventions are not access control. Connections at resource level are inherited by all projects, which breaks isolation. A subscription per agent is heavy and unnecessary.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/what-is-foundry"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "An agent application uses a model deployment in a single region. During a regional incident, requests fail and nobody fails over to another deployment. What is true about Foundry in this situation?", "o": [{"t": "Provisioned deployments are always zone redundant", "c": false, "e": "Provisioned capacity gives consistent latency, not automatic failover."}, {"t": "Foundry automatically fails over standard deployments to a paired region", "c": false, "e": "Standard deployments are single-region and are not failed over automatically."}, {"t": "Foundry copies agents to a second region continuously", "c": false, "e": "Agent Service has no built-in backup or disaster recovery."}, {"t": "Foundry does not load-balance or fail over model deployments for you; use a gateway such as API Management and Data Zone or Global deployment types", "c": true, "e": "Resilience must be designed: routing, health checks and circuit breaking in a gateway, plus deployment types that are not tied to one region."}], "concept": "Reliability design must be explicit in Foundry. A model deployment lives in one region. If that region has an incident, calls to that deployment fail.\n\nFoundry does not load-balance or fail over model deployments for you, and it does not replicate agents to a second region automatically. Standard deployments do not fail over to a paired region, and provisioned deployments are not automatically zone redundant.\n\nWhat you do: use Data Zone or Global deployment types, which spread processing over several regions inside the routing scope, and put a gateway such as Azure API Management in front of two or more deployments. The gateway does health checks, retries, priority or weighted routing and circuit breaking, so a failing backend is skipped automatically.\n\nAlso keep agent definitions as code, so they can be redeployed in another region.\n\nMemory aid: the platform gives you roads; the gateway is the GPS that reroutes around a closed road.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/high-availability-resiliency"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "You must be able to recover Foundry Agent Service state after the accidental deletion of a Cosmos DB database. Which TWO preparations should you make before an incident?", "o": [{"t": "Rely on Foundry's built-in point-in-time restore for agents", "c": false, "e": "Learn states there is no built-in backup, disaster recovery or point-in-time restore in Agent Service."}, {"t": "Use the basic agent setup, which has almost no recovery options for resource loss", "c": false, "e": "Standard setup, with your own resources, is the one with recovery options."}, {"t": "Enable Cosmos DB continuous backup with point-in-time restore", "c": true, "e": "Restore is not possible unless continuous backup was enabled beforehand."}, {"t": "Disable delete locks so that restores are easier", "c": false, "e": "Delete locks protect critical resources from accidental deletion."}, {"t": "Define agents as code in source control and deploy them from a pipeline", "c": true, "e": "Agent Service has no built-in backup, so agent definitions must be reproducible."}], "concept": "Foundry Agent Service has no built-in point-in-time restore for agents. Recovery from accidental deletion has to be prepared before the incident.\n\nTwo preparations cover the two kinds of loss. Agent definitions (instructions, tools, model, settings) should be code in source control, deployed by a pipeline, so you can recreate them in minutes. The data (conversations, agent state) lives in Cosmos DB in the standard setup, so enable Cosmos DB continuous backup, which allows restoring the account or database to a chosen point in time. It must be enabled before the deletion; you cannot restore from a backup that was never turned on.\n\nAlso use delete locks and restricted roles to reduce the chance of deletion.\n\nThe basic agent setup keeps data in platform-managed storage, so it offers you almost no control over recovery. Disabling delete locks makes accidents more likely.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/high-availability-resiliency"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A regulated company wants to encrypt Foundry data with a key it controls in Azure Key Vault, using a managed identity of the Foundry resource. Which statement is correct?", "o": [{"t": "Hosted agents are fully covered, including the `$HOME` filesystem", "c": false, "e": "The `$HOME` filesystem is on platform-managed storage that is not encrypted with CMK."}, {"t": "CMK removes the need for a managed identity", "c": false, "e": "The managed identity is how the resource accesses the key."}, {"t": "Grant the managed identity permission to use the key (for Key Vault with Azure RBAC, the Key Vault Crypto User role), then enable customer-managed keys; prompt agents support CMK only with bring-your-own storage", "c": true, "e": "Customer-managed keys use Key Vault or Managed HSM. For prompt agents you configure CMK on your own Cosmos DB, Storage and AI Search."}, {"t": "Foundry encrypts with your key automatically when you create the key", "c": false, "e": "The resource must be granted access and CMK must be enabled."}], "concept": "Encryption at rest is on by default with Microsoft-managed keys. A regulated company may require customer-managed keys (CMK): keys it controls in Azure Key Vault or Managed HSM.\n\nThe setup has two parts. First, the identity that Foundry uses (a managed identity of the resource) must be allowed to use the key. With a Key Vault that uses Azure RBAC, the built-in role Key Vault Crypto User allows wrap and unwrap operations. Then you enable customer-managed keys on the resource and select the key.\n\nCMK does not happen automatically when you create a key, and it does not remove the need for a managed identity; the identity is how Foundry reaches the key. Coverage has limits: for prompt agents, CMK applies when you use bring-your-own storage (your own Cosmos DB, Storage and AI Search), and hosted agents do not cover every storage area such as the `$HOME` filesystem.\n\nCheck the current scope in the documentation before promising full coverage to auditors.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/customer-managed-keys"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "Operations wants to know which deployment is being throttled and to report on the throttling over the last quarter, without writing KQL. Which TWO actions fit?", "o": [{"t": "Create a diagnostic setting that sends the metrics to a Log Analytics workspace or Storage for longer retention", "c": true, "e": "Platform metrics are kept for 93 days, so a quarterly report needs a copy."}, {"t": "In Azure Monitor metrics explorer, filter the status code to 429 and split by `ModelDeploymentName`", "c": true, "e": "Metrics need no query language, and splitting by deployment shows which one is throttled."}, {"t": "Enable continuous evaluation on production traffic", "c": false, "e": "Evaluators score quality and safety, not throttling."}, {"t": "Add tracing spans in each application", "c": false, "e": "This is code work and the traces do not aggregate the resource's 429 counts the same way."}, {"t": "Rely on platform metrics for a six-month history", "c": false, "e": "Platform metrics are stored for 93 days."}], "concept": "Azure Monitor platform metrics are numbers over time that Azure collects automatically. For Azure OpenAI and Foundry Models they include token counts and request counts split by status code.\n\nTo see which deployment is throttled without writing KQL, open metrics explorer on the resource, filter the status code to 429, and split the chart by `ModelDeploymentName`. The lines that rise are the throttled deployments.\n\nPlatform metrics are kept for 93 days, so a quarterly or six-month report needs longer retention. A diagnostic setting sends the metrics to a Log Analytics workspace or to Storage, where you choose the retention.\n\nContinuous evaluation scores answer quality and has nothing to do with throttling. Adding tracing spans to every application is extra work and shows request behavior, not capacity limits.\n\nMemory aid: metrics explorer is the dashboard on the wall; a diagnostic setting is the filing cabinet where the history is kept.", "src": ["https://learn.microsoft.com/en-us/azure/azure-monitor/essentials/data-platform-metrics"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 1, "q": "A security review finds that agent traces in Application Insights contain customers' phone numbers and one API key that was placed in a tool argument. What should you do?", "o": [{"t": "Turn off tracing in production", "c": false, "e": "This removes the ability to debug and does not fix the practice of leaking secrets."}, {"t": "Redact or minimize personal data and never place secrets in prompts, tool arguments or span attributes; apply the same access control and retention as production logs", "c": true, "e": "Traces can contain user text, outputs and tool arguments, so privacy controls must be applied before data reaches telemetry."}, {"t": "Keep the data and shorten the retention to one day", "c": false, "e": "Secrets should not be recorded in the first place."}, {"t": "Move the traces to a public storage account", "c": false, "e": "This increases exposure."}], "concept": "Telemetry is a copy of your data. Traces can include prompts, tool arguments and results, so personal data and secrets can end up in Application Insights.\n\nThe rule is data minimization and secret hygiene. Do not place secrets (API keys, tokens, connection strings) in prompts, tool arguments or span attributes at all; use managed identity or a secret store, and let the tool fetch secrets itself. Redact or avoid recording personal data such as phone numbers, or record only what you need. Treat the telemetry store like production data: restrict access with roles, set retention, and consider the same compliance obligations as for the source data. If a key has already leaked into traces, rotate it.\n\nTurning tracing off in production gives up your best debugging tool. One-day retention keeps the data in the meantime. A public storage account is the opposite of control.\n\nMemory aid: logs are a diary; do not write passwords in it.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/observability/concepts/trace-agent-concept"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 1, "q": "A team has not selected a model yet and must choose between two candidates for a new assistant. Which evaluation stage and tools apply?", "o": [{"t": "Pre-production: the AI red teaming agent only", "c": false, "e": "Red teaming tests attacks on a built system and does not compare models on quality."}, {"t": "Base model selection: use Foundry benchmarks and compare models, then run candidates on your own test prompts", "c": true, "e": "This is stage 1, which answers which model fits. Benchmarks are averages, so your own data decides."}, {"t": "Scheduled evaluation to detect drift", "c": false, "e": "Drift detection comes after deployment."}, {"t": "Post-production: continuous evaluation of sampled traffic", "c": false, "e": "There is no production traffic yet."}], "concept": "AI evaluation happens at three stages, and each stage has its own question and tools.\n\nBase model selection comes first: you have not chosen a model, so you compare candidates. Use the Foundry model benchmarks and compare models, then run the finalists on your own test prompts, because public benchmarks do not reflect your data. Pre-production evaluation tests the assembled solution: evaluators on a test dataset, red teaming, and release gates. Post-production monitoring watches real traffic: continuous evaluation of samples, scheduled evaluation for drift, alerts, tracing.\n\nThe team has not selected a model, so it is at the first stage. Continuous evaluation and drift detection need a deployed system. The red teaming agent tests an application or model for attacks; it does not choose between models for quality or cost.\n\nMemory aid: choose the engine, test the car, monitor the road.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/observability"], "ref": ["observability-and-agent-lifecycle", "model-and-service-selection"]}, {"d": 1, "q": "A churn-prediction model deployed to an Azure Machine Learning online endpoint receives production data that gradually differs from the training data. You want a scheduled check and an alert when a threshold is exceeded. What should you configure?", "o": [{"t": "An Application Insights availability test", "c": false, "e": "It checks reachability, not data distribution."}, {"t": "Azure Machine Learning model monitoring with a data drift signal compared with a baseline, with alert notification", "c": true, "e": "Built-in signals are data drift, prediction drift and data quality, and a default alert email goes to the person who set up the monitor."}, {"t": "Foundry continuous evaluation with the Groundedness evaluator", "c": false, "e": "This evaluates LLM answers, not tabular model inputs."}, {"t": "A diagnostic setting for the Cognitive Services resource", "c": false, "e": "Logs do not compare distributions with a baseline."}], "concept": "Azure Machine Learning (Azure ML) is the platform for custom machine learning models, such as a churn predictor on an online endpoint. Its monitoring feature is called model monitoring.\n\nModel monitoring compares production data with a baseline, usually the training data, using signals. Data drift measures how the distribution of input features changes. Prediction drift measures output changes, data quality checks missing or invalid values, and there are signals for feature attribution drift and model performance. You schedule the monitor, set a threshold per signal, and configure notifications. By default an alert email goes to the user who created the monitor.\n\nFoundry continuous evaluation with Groundedness is for generative AI answers, not for a tabular churn model. An availability test checks that an endpoint responds. A diagnostic setting sends logs and metrics but does not compute drift.\n\nMemory aid: drift is the world changing away from what the model was trained on.", "src": ["https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-model-performance"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 1, "q": "An HR assistant program includes these activities: (1) a red team and risk evaluators run before launch, (2) a guardrail and grounding with citations are added, (3) a named owner, audit logs and an incident process are set up. Which mapping to Discover, Protect and Govern is correct?", "o": [{"t": "(1) Discover, (2) Govern, (3) Protect", "c": false, "e": "Guardrails and grounding are Protect, and ownership and audit are Govern."}, {"t": "(1) Govern, (2) Protect, (3) Discover", "c": false, "e": "Ownership and audit are Govern, not Discover."}, {"t": "(1) Discover, (2) Protect, (3) Govern", "c": true, "e": "Discover finds what can go wrong, Protect stops it at runtime, and Govern assigns accountability and proof."}, {"t": "(1) Protect, (2) Discover, (3) Govern", "c": false, "e": "Red teaming finds problems and is Discover. Guardrails are runtime protection."}], "concept": "Responsible AI work for generative apps is organized in three activities that answer three questions.\n\nDiscover asks \"what could go wrong?\": red teaming, risk evaluators, testing and inventory. Protect asks \"how do we stop harm at run time?\": guardrails and content filters, Prompt Shields, grounding with citations, limits on tools. Govern asks \"who is accountable and can we prove it?\": named owners, policies, approvals, audit logs, an incident process and compliance reporting.\n\nMapping the three items: (1) a red team and risk evaluators before launch find risks, so Discover. (2) A guardrail and grounding with citations reduce harm during use, so Protect. (3) A named owner, audit logs and an incident process give accountability, so Govern.\n\nThe three are a cycle, not a sequence: findings from Discover improve Protect, and Govern records the evidence and decides what is acceptable.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/responsible-use-of-ai-overview"], "ref": ["responsible-ai-governance"]}, {"d": 1, "q": "A cloud governance team wants to prevent developers from creating expensive deployment types in the Foundry resources of the production subscription. Which mechanism should they use?", "o": [{"t": "Azure Policy that denies `sku.name` values on `Microsoft.CognitiveServices/accounts/deployments`", "c": true, "e": "Policy restricts deployment types for every resource in scope."}, {"t": "A content filter threshold", "c": false, "e": "Content filters control content, not deployment types."}, {"t": "A smaller `max_output_tokens`", "c": false, "e": "This caps output length per call and does not stop expensive deployments."}, {"t": "A written guideline in the team wiki", "c": false, "e": "It is not enforced."}], "concept": "Guidelines can be ignored; policy can be enforced. Azure Policy evaluates resources against rules and can deny, audit or modify them, at the scope of a management group, subscription or resource group.\n\nDeployments of models are resources of type `Microsoft.CognitiveServices/accounts/deployments`, and each has a property `sku.name` that holds the deployment type (for example Standard, GlobalStandard or ProvisionedManaged). A policy that denies certain `sku.name` values stops anyone from creating, say, an expensive provisioned deployment in the production subscription, with an error at creation time.\n\nA wiki page is advice. A content filter threshold concerns harmful content, not cost. `max_output_tokens` limits the length of one answer and is unrelated to the deployment type.\n\nUse the same mechanism for other rules: deny public network access, require private endpoints, disable local (key) authentication, or require tags.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types"], "ref": ["capacity-cost-and-throttling", "platform-network-and-reliability"]}, {"d": 1, "q": "A team built agents in a hub-based project. They now want to use the current Foundry experience. What should they expect?", "o": [{"t": "The old project is converted in place by changing the SDK package", "c": false, "e": "The package version does not convert resources."}, {"t": "Conversations are moved by renaming the project", "c": false, "e": "Renaming does not migrate data."}, {"t": "There is no direct upgrade path for agents, files, conversations or vector stores; model deployments and quota can be reused", "c": true, "e": "Hub-based projects are the classic experience, and the content must be recreated in a Foundry project."}, {"t": "Everything migrates automatically with one click", "c": false, "e": "There is no direct upgrade path for these items."}], "concept": "Foundry has two project models. Hub-based projects belong to the classic experience, built on Azure Machine Learning hubs. The current Foundry experience uses a Foundry resource with Foundry projects, and agents there use the new Agent Service.\n\nThere is no direct upgrade path from hub-based to Foundry projects for agents, files, conversations and vector stores. You cannot move them with one click, by renaming, or by changing the SDK package. What you can reuse are model deployments and quota. The practical plan is to treat it as a migration: recreate the agents from code in the new project, re-upload files and rebuild vector stores, and decide how to handle old conversations (export or archive), then test and switch.\n\nThis is a good reason to keep agent definitions as code from the start.\n\nMemory aid: it is moving house, not renovating the same house; you can bring the furniture that is not bolted down (deployments, quota).", "src": ["https://learn.microsoft.com/en-us/azure/foundry/what-is-foundry"], "ref": ["platform-network-and-reliability"]}, {"d": 2, "q": "A company has a large code base that uses the OpenAI Python SDK and wants to move it to Azure with the fewest changes, using Microsoft Entra ID instead of keys. Which approach fits?", "o": [{"t": "Point the OpenAI client at `https://<resource>.openai.azure.com/openai/v1/` and use an Entra token provider as the credential", "c": true, "e": "The OpenAI-compatible endpoint exposes the full OpenAI API surface, and tokens are preferred over keys."}, {"t": "Keep API keys because Entra is not supported on this endpoint", "c": false, "e": "Entra ID tokens are supported and preferred."}, {"t": "Use the Speech SDK against the Speech endpoint", "c": false, "e": "It is for speech scenarios."}, {"t": "Rewrite everything with the Foundry project endpoint and the Agent Framework", "c": false, "e": "This is more work than the requirement needs."}], "concept": "Azure OpenAI supports an OpenAI-compatible API at the path `/openai/v1/`. That means code written with the OpenAI Python SDK can run on Azure with minimal changes: you create the client with `base_url` set to `https://<resource>.openai.azure.com/openai/v1/` and a credential, and your calls (`responses.create`, `chat.completions.create`) stay the same. The model parameter is now your deployment name.\n\nFor keyless access, use Microsoft Entra ID. `azure-identity` offers a token provider (`get_bearer_token_provider`) for the scope `https://cognitiveservices.azure.com/.default`, which you pass as the API key callable to the client. The token is short-lived and tied to an identity.\n\nRewriting to the project endpoint and Agent Framework is more work than needed. The Speech SDK is for speech. The claim that Entra is not supported on this endpoint is false.\n\nRule: fewest changes = keep the SDK, change the base URL and the credential.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/sdk-overview"], "ref": ["foundry-sdk-and-generative-apps"]}, {"d": 2, "q": "A containerized service uses `DefaultAzureCredential()` with a Microsoft Entra service principal. How should the credential values be provided so that no secret appears in code?", "o": [{"t": "Inside the system prompt", "c": false, "e": "Secrets never belong in prompts."}, {"t": "As environment variables `AZURE_TENANT_ID`, `AZURE_CLIENT_ID` and `AZURE_CLIENT_SECRET`, which `DefaultAzureCredential` reads", "c": true, "e": "The credential tries several sources in order, including environment variables for a service principal."}, {"t": "Not needed, because `AIProjectClient` has an anonymous mode", "c": false, "e": "A credential object is always required."}, {"t": "Hard-coded in the constructor of `AIProjectClient`", "c": false, "e": "This puts a secret in code."}], "concept": "`DefaultAzureCredential` tries several ways to get a token, in order. One of them is the environment credential, which reads three environment variables: `AZURE_TENANT_ID`, `AZURE_CLIENT_ID` and `AZURE_CLIENT_SECRET`. This is the standard way to run with a service principal in a container.\n\nThe values are supplied by the platform, not by the code: Kubernetes secrets, container app secrets or a CI/CD variable store. The code simply calls `DefaultAzureCredential()` and contains no secret. That is why you never hard-code values in the constructor or in prompts.\n\nWhen the container runs on Azure, an even better option is a managed identity, which needs no secret at all.\n\n`AIProjectClient` has no anonymous mode; it always needs a credential.\n\nMemory aid: the code asks \"who am I?\", and the environment answers. Secrets live in the environment, not in the source.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/sdk-overview"], "ref": ["foundry-sdk-and-generative-apps"]}, {"d": 2, "q": "Which TWO statements about few-shot examples are correct?", "o": [{"t": "They guarantee factual correctness of the output", "c": false, "e": "They improve format and consistency, not truth."}, {"t": "They permanently fine-tune the deployment", "c": false, "e": "Fine-tuning is a separate training process."}, {"t": "The order of examples can matter, and examples should show edge cases", "c": true, "e": "Examples shape the pattern the model continues, so their choice and order affect the result."}, {"t": "They are required for reasoning models", "c": false, "e": "Classic techniques such as these are not recommended for reasoning models."}, {"t": "They condition the model for the current call only and nothing is learned permanently", "c": true, "e": "Examples are part of the prompt, so they do not change the model."}], "concept": "Few-shot prompting adds a few examples of input and output to the prompt, so the model imitates the pattern. It is also called in-context learning.\n\nThe examples condition the model for the current call only. Nothing is stored, nothing is learned permanently, and the deployment is unchanged. That is the difference from fine-tuning, which changes the model's weights through training.\n\nPractical points: the order of examples can influence the answer (the last examples often have more weight), and examples should include edge cases, not only easy ones, so the model sees the boundaries. Examples improve format and style but do not guarantee facts; a model can copy the format and still be wrong.\n\nReasoning models usually work well with short, goal-oriented prompts, and heavy few-shot prompting is not required for them.\n\nMemory aid: few-shot is showing a new employee three sample cases before the shift. Fine-tuning is sending them to training school.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering"], "ref": ["prompt-engineering-parameters-and-reflection"]}, {"d": 2, "q": "A team migrates a classification prompt from a chat model to a reasoning model. The old prompt has a long role description and \"think step by step\" instructions. What does Microsoft guidance recommend?", "o": [{"t": "Ask the model to output its raw reasoning", "c": false, "e": "Extracting reasoning other than through the reasoning summary setting is unsupported."}, {"t": "Set `temperature` to 2 to encourage more thinking", "c": false, "e": "Randomness does not control reasoning depth."}, {"t": "Keep the long prompt and add more examples of reasoning", "c": false, "e": "More scaffolding is not recommended for reasoning models."}, {"t": "Keep the prompt short and goal-oriented, use the developer message, control cost with `reasoning_effort` and token caps, and drop the classic step-by-step technique", "c": true, "e": "These techniques are not recommended for reasoning models."}], "concept": "Reasoning models are trained to think before answering. Their guidance differs from classic chat models.\n\nKeep the prompt short and goal-oriented: say what you want and the constraints, not how to think. Use the developer message for instructions where it is supported. Do not add \"think step by step\"; the model already does that internally, and extra scaffolding can lower quality or waste tokens. Control the cost and time of thinking with `reasoning_effort` and a cap on output tokens (which include reasoning tokens). Do not ask for the raw reasoning, and note that temperature is often not configurable.\n\nA long role description is an old habit from chat models. Adding more reasoning examples repeats the old technique. Temperature 2 only adds randomness and is not a way to get more thinking.\n\nMemory aid: tell an expert the goal, not each step of how to do their job.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning"], "ref": ["prompt-engineering-parameters-and-reflection", "model-and-service-selection"]}, {"d": 2, "q": "A hybrid search returns three documents. Reciprocal Rank Fusion uses `score = sum of 1 / (rank + k)` with k = 60. Document A ranks 1st in the keyword list and 5th in the vector list. Document B ranks 2nd in the keyword list and 1st in the vector list. Document C ranks 3rd in the keyword list and is not in the vector list. What is the final order?", "o": [{"t": "B, A, C", "c": true, "e": "B = 1/62 + 1/61 = 0.03252, A = 1/61 + 1/65 = 0.03178, C = 1/63 = 0.01587. A document that is high in both lists wins."}, {"t": "C, B, A", "c": false, "e": "C appears in only one list and scores about half as much."}, {"t": "A, B, C", "c": false, "e": "A was first in the keyword list, but B scores higher because it is high in both lists."}, {"t": "A, C, B", "c": false, "e": "B's score is not the lowest, since it ranks 1st in the vector list."}], "concept": "Reciprocal Rank Fusion (RRF) merges ranked lists. Each document gets a score from each list where it appears: 1 / (rank + k), with k = 60 in the question. The scores are added, and documents are sorted by the sum.\n\nDocument A: 1st in keywords = 1/61 = 0.01639, 5th in vectors = 1/65 = 0.01538, sum = 0.03177.\nDocument B: 2nd in keywords = 1/62 = 0.01613, 1st in vectors = 1/61 = 0.01639, sum = 0.03252.\nDocument C: 3rd in keywords = 1/63 = 0.01587, absent from the vector list = 0, sum = 0.01587.\n\nOrder: B (0.03252), A (0.03177), C (0.01587).\n\nLesson: RRF rewards documents that are high in both lists. A is first in one list, but only fifth in the other, so B, which is first and second, beats it narrowly. A document found by one method only (C) still appears, but with a lower score.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-ranking"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "An enterprise search assistant must return only documents that the signed-in user is allowed to read. A developer proposes adding \"only show documents the user may read\" to the system prompt. What is the better design?", "o": [{"t": "Rerank with the semantic ranker so that private documents rank low", "c": false, "e": "Ranking is not authorization."}, {"t": "Apply security trimming at retrieval: filter on access information stored with each chunk, so unauthorized content never reaches the model", "c": true, "e": "Access information is collected when content is ingested, and filters are applied at query time."}, {"t": "Lower the temperature", "c": false, "e": "It does not enforce access."}, {"t": "Keep the prompt rule and trust the model", "c": false, "e": "A prompt rule can be bypassed, and the content has already reached the model."}], "concept": "Who may see a document is an access control problem, and access control must be enforced by code and data, not by a request to the model.\n\nA rule in the prompt is advice. If unauthorized chunks reach the model, it can quote them, summarize them, or be tricked into revealing them. The secure design is security trimming at retrieval: store access information with each chunk (for example group IDs or ACLs), and add a filter to every query based on the signed-in user's identity and groups, so unauthorized content is never returned by the search. In Azure AI Search this is a filter on a security field, or the permission-aware features for supported sources.\n\nThe semantic ranker only changes order; private documents would still be returned. Temperature has no effect on authorization.\n\nMemory aid: do not hand the secret to the model and ask it to keep quiet. Never hand it over.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-security-built-in"], "ref": ["rag-retrieval-and-grounding", "azure-ai-search-configuration"]}, {"d": 2, "q": "Users ask a very specific question about one clause. The answer is in a chunk that ranks 5th, but the application passes only `top_k = 3` chunks to the model, which answers \"not found\". What should you try first?", "o": [{"t": "Disable the prompt rule \"say you don't know\"", "c": false, "e": "This would make the model guess."}, {"t": "Raise `top_k` so that the right chunk reaches the prompt, and add keyword matching with hybrid search if exact names matter", "c": true, "e": "A very low `top_k` drops the right chunk before generation."}, {"t": "Increase `max_output_tokens`", "c": false, "e": "The prompt is missing the evidence, not the answer budget."}, {"t": "Change the embedding model", "c": false, "e": "This requires re-embedding and the chunk was already found."}], "concept": "RAG answers are limited by what reaches the prompt. `top_k` is the number of retrieved chunks that you pass to the model. If the right chunk is rank 5 and you pass only 3, the model never sees it and correctly (from its point of view) says \"not found\". The failure is in retrieval, not in generation.\n\nFirst try: raise `top_k` (for example to 5 to 10), watching the extra tokens and the risk of distractors. If the question contains exact names, clause numbers or codes, add keyword matching with hybrid search so the chunk ranks higher. A reranker can also move the right chunk up before you cut the list.\n\n`max_output_tokens` limits the answer length. Changing the embedding model requires re-indexing and is not the first step. Removing \"say you don't know\" would let the model guess, which is worse.\n\nCheck with the Retrieval and Document Retrieval metrics on a labeled question set.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-ranking"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A relevance evaluation of a RAG assistant passes, yet a reviewer finds an answer that contains an invented date. Why did the evaluation not catch it, and which evaluator should be added?", "o": [{"t": "Add Response Completeness, which detects invented facts", "c": false, "e": "Completeness is recall of expected facts, not precision."}, {"t": "Add Document Retrieval, which checks the final answer", "c": false, "e": "It evaluates ranking against labels, not the answer text."}, {"t": "Relevance checks whether the answer addresses the question and can pass an answer that is fabricated; add Groundedness, which checks that claims stay inside the retrieved context", "c": true, "e": "Relevance and groundedness measure different things. Groundedness is the fabrication detector."}, {"t": "Relevance always fails on fabricated answers, so the reviewer is wrong", "c": false, "e": "A fluent, on-topic answer can score high on relevance."}], "concept": "Different RAG evaluators answer different questions, so a pass on one does not prove the others.\n\nRelevance asks whether the answer addresses the question. An answer can be perfectly on topic and still contain an invented date; it still passes Relevance. Groundedness asks whether every claim in the answer is supported by the retrieved context. An invented date has no support in the context, so Groundedness fails it. That is the evaluator to add.\n\nResponse Completeness checks whether expected information is present (recall), not whether something extra is false. Document Retrieval evaluates the retrieval step using labeled documents, not the final answer.\n\nUse them together: Retrieval (did we find the right context), Groundedness (is the answer faithful), Completeness (is it complete) and Relevance (does it answer the question).\n\nMemory aid: relevance = on topic; groundedness = on the facts.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A developer wants the SDK to build the JSON Schema from a Python class and return a typed object. Which call matches the Learn sample for the Responses API?\n```python\nclass AdverseEvent(BaseModel):\n    term: str\n    severity: str\n    onset_date: str | None\n```", "o": [{"t": "`client.embeddings.create(model=..., input=...)`", "c": false, "e": "This creates vectors."}, {"t": "`client.images.generate(model=..., prompt=...)`", "c": false, "e": "This is for images."}, {"t": "`client.responses.create(model=..., input=..., response_format=\"json\")`", "c": false, "e": "This asks for JSON only. It does not provide your schema or parsing."}, {"t": "`client.responses.parse(model=..., input=..., text_format=AdverseEvent)` and then read `response.output_parsed`", "c": true, "e": "The SDK converts the Pydantic model to a schema and parses the result. The optional field is emulated with null."}], "concept": "The Responses API in the OpenAI Python SDK offers a helper for Structured Outputs with typed objects. You define the shape as a Pydantic class. The SDK converts the class into a JSON Schema, sends it with the request, and parses the response back into an object of that class.\n\nThe call is `client.responses.parse(model=..., input=..., text_format=AdverseEvent)`. The typed result is in `response.output_parsed`, so `output_parsed.term` and `output_parsed.severity` are normal Python attributes. Optional values are written as `str | None`, which becomes a union with null in the schema, as strict mode requires.\n\n`responses.create` with `response_format=\"json\"` is not the documented structured outputs pattern. `images.generate` creates images and `embeddings.create` creates vectors, so neither fits.\n\nRemember to check for a refusal before reading the parsed value, and note that structured outputs are not supported with Foundry Agent Service.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/structured-outputs"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A model sometimes omits the required `order_id` argument when it calls your function tool, and sometimes sends extra properties. The schema only lists `properties`. Which changes reduce these errors?", "o": [{"t": "Move the schema into the system prompt as prose", "c": false, "e": "A formal schema with required fields is more reliable."}, {"t": "Increase `max_output_tokens`", "c": false, "e": "Output length does not control argument shape."}, {"t": "Add `required: [\"order_id\"]` and `additionalProperties: false`, set `strict=True`, and give the parameter a clear description with an example", "c": true, "e": "The schema and descriptions are all the model knows about the function. Strict mode validates the call."}, {"t": "Switch the deployment to Batch", "c": false, "e": "Batch does not affect function-call accuracy."}], "concept": "A function tool definition is a contract. The model reads the JSON Schema of the parameters to decide what to send. A schema that only lists `properties` is loose: the model may omit a parameter, or send extra ones, because nothing says otherwise.\n\nTighten it in four ways. Add `required: [\"order_id\"]` so the field is mandatory. Add `additionalProperties: false` so unknown fields are not allowed. Set `strict=True` so the model's arguments are constrained to the schema. And write a clear description for the parameter with an example, such as \"Order number, for example 4711\". These steps remove most missing or extra arguments.\n\nIncreasing `max_output_tokens` is unrelated. Describing the schema in the prompt as prose is weaker than a real schema. Batch is a deployment type for offline jobs.\n\nEven with strict mode, validate the values in your function before using them (is this order owned by the user?).", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "An agent has twelve tools. Two of them have overlapping descriptions (\"search customers\" and \"find customer records\"), and traces show the agent picks the wrong one about a third of the time. What is the best remedy?", "o": [{"t": "Increase the temperature", "c": false, "e": "Randomness makes selection less consistent."}, {"t": "Disable tracing", "c": false, "e": "Tracing shows the problem and is not its cause."}, {"t": "Keep the tool set small, merge or remove the overlap and write distinct descriptions, then measure with tool selection evaluators", "c": true, "e": "Each tool costs tokens and overlapping tools cause wrong selections."}, {"t": "Add more tools with similar names so that one fits every case", "c": false, "e": "This increases overlap."}], "concept": "An agent chooses a tool by comparing the user request with the name and description of each tool. If two descriptions overlap, such as \"search customers\" and \"find customer records\", the model has no reason to prefer one, and picks wrongly a third of the time.\n\nThe remedy has three parts. Keep the tool set small: every tool costs prompt tokens and adds a chance of a wrong choice. Merge or remove duplicates, or write distinct descriptions that say when to use the tool and when not. Then measure with evaluators such as Tool Selection and Tool Input Accuracy on a test set, and use traces to see real failures.\n\nAdding more similar tools increases confusion. Temperature adds randomness, not accuracy. Disabling tracing removes the evidence you need.\n\nMemory aid: two buttons labelled almost the same will be pressed at random.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "In the Responses API, which statement describes how to continue a multi-turn interaction?", "o": [{"t": "Store the state in the system prompt", "c": false, "e": "Prompts are not a state store."}, {"t": "Resend the whole history in every request because the service stores nothing", "c": false, "e": "A conversation or `previous_response_id` avoids resending the history."}, {"t": "Create a new agent version for every user message", "c": false, "e": "Versions are for changes to the agent, not for turns."}, {"t": "Continue from a previous response with `previous_response_id`, or use a conversation object that stores messages, tool calls and tool outputs", "c": true, "e": "A response is one execution. A conversation persists items across turns."}], "concept": "A multi-turn interaction needs state: the earlier messages, tool calls and tool outputs. With the Responses API you have two ways to continue.\n\nOption 1: chain responses. Pass `previous_response_id` with the id of the last response, and the service links the new request to the earlier context. Option 2: use a conversation object. You create a conversation, send requests with its id, and the service stores the messages, tool calls and tool outputs in it, so the history is durable and shared across requests.\n\nYou do not have to resend the whole history in each request, and creating a new agent version for each message is wrong, because agent versions describe configuration, not conversation state. Putting state into the system prompt wastes tokens and mixes data with instructions.\n\nRemember that conversation data is user data: apply access checks so a user can only continue their own conversation.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/runtime-components"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "A guardrail for an agent should inspect what the agent proposes to send to a tool (the tool name and arguments), and stop the action if it would send sensitive data. Which intervention point and behavior apply?", "o": [{"t": "User input, with annotate only", "c": false, "e": "User input is scanned before the model runs and does not see the tool arguments the agent creates."}, {"t": "Output, with annotate only", "c": false, "e": "Output is the final answer. Annotate-only does not block."}, {"t": "Tool call, with annotate and block: the call is not executed and the agent stops until there is another user input", "c": true, "e": "This point scans what the agent proposes to send to a tool. It is preview and for agents only."}, {"t": "Tool response, which stops the model from reading files", "c": false, "e": "Tool response scans what a tool sends back."}], "concept": "A guardrail control has a risk, an intervention point and an action. The four intervention points are user input, tool call, tool response and output.\n\nThe tool call intervention point examines what the agent proposes to send to a tool: the tool name and the arguments, before the tool runs. If the arguments contain sensitive data, the control with annotate and block action stops the call. The call is not executed, and the agent stops until there is another user input.\n\nThe user input point sees only what the user typed. The output point sees only the final answer, after the tool already ran. The tool response point checks what comes back from a tool, which helps against indirect attacks but does not control what is sent out.\n\nTool call and tool response intervention points are Preview and work for tools that support moderation. Combine them with least privilege in the tool itself.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "An agent calls a protected MCP server with its agent identity. Role assignments on the target resource are correct, but the call fails. The token request used the URL of the MCP server as the audience. What is the cause?", "o": [{"t": "The audience must be the downstream service's resource identifier (for example `https://storage.azure.com`), not the URL of your MCP server", "c": true, "e": "A wrong audience fails even when role-based access control is correct."}, {"t": "Guardrails block all tool calls", "c": false, "e": "A guardrail does not change the token audience."}, {"t": "The model deployment has too little quota", "c": false, "e": "Quota would cause 429 responses."}, {"t": "The managed identity needs the role instead of the agent identity", "c": false, "e": "The managed identity authenticates the blueprint. The agent identity needs the role."}], "concept": "When an agent calls a protected service, it gets an access token from Microsoft Entra ID. A token is issued for one audience, the resource that is meant to accept it.\n\nRole assignments answer \"is this identity allowed?\". The audience answers \"is this token meant for this service?\". If the audience is the URL of the MCP server, the downstream Azure service (for example Storage) receives a token meant for another service and rejects it, even though roles are right. The audience must be the resource identifier of the downstream service, such as `https://storage.azure.com`.\n\nThe identity is correct (the agent identity holds the role). Quota would give 429, and guardrails would give a content-safety block, not an authorization failure.\n\nDebug order for \"role is right but it still fails\": which identity is calling, what audience is in the token, what scope is the role assigned at.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/overview"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A scheduling agent should only reach calendar data that the signed-in user is allowed to see. Which access pattern fits?", "o": [{"t": "A shared API key stored in the agent instructions", "c": false, "e": "Keys bypass role-based access and secrets do not belong in prompts."}, {"t": "Anonymous access to the calendar API", "c": false, "e": "There is no per-user access control."}, {"t": "Client credentials with a broad application role", "c": false, "e": "This gives the agent its own authority, which can exceed the user's permissions."}, {"t": "On-behalf-of (delegated, attended) access, so the agent can only reach what the user can reach", "c": true, "e": "The agent acts for the signed-in user and is limited by that user's permissions."}], "concept": "Agents can act in two ways. With client credentials (application permissions) the agent acts as itself, with whatever rights the application has. With on-behalf-of (delegated) access, the agent acts for the signed-in user: the user's token is exchanged for a token for the downstream API, and the API sees the user's identity and applies the user's permissions.\n\nFor a scheduling agent that should only reach calendar data that the user is allowed to see, delegated (attended) access is the right pattern: the agent cannot exceed the user's rights, and audit logs show the user.\n\nA broad application role would let the agent read every calendar, so a prompt injection or a bug could expose other people's data. A shared API key in the instructions leaks a secret to the model and logs. Anonymous access removes protection.\n\nUse application (unattended) identities only for background tasks that are not tied to a person, and keep their rights minimal.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/overview"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A Foundry agent must call another team's agent that is exposed as an A2A endpoint. What is the setup?", "o": [{"t": "Create a project connection of category `RemoteA2A` to the remote agent's base URI with authentication, then add an `A2ATool` that points to the connection", "c": true, "e": "The orchestrator reads the remote agent card and calls it as a tool."}, {"t": "Add a `FunctionTool` and return the remote agent's answer as `function_call_output`", "c": false, "e": "This is a client-side function pattern, not the A2A tool."}, {"t": "Copy the remote agent's instructions into the local agent", "c": false, "e": "This duplicates the agent instead of calling it."}, {"t": "Use the classic Connected Agents tool", "c": false, "e": "It is not available in the new Foundry Agent Service."}], "concept": "A2A (Agent2Agent) is an open protocol that lets one agent call another over HTTP, even if they were built by different teams or with different frameworks. Foundry supports it through the A2A tool.\n\nThe setup has two parts. First create a project connection of category `RemoteA2A` that holds the remote agent's base URI and its authentication, so credentials are managed in one place. Then add an `A2ATool` to your agent that points to the connection. The local agent can then call the remote agent like a tool and receive its response, while keeping control of the conversation.\n\nA `FunctionTool` would require you to write the glue code and return the answer as `function_call_output`. The classic Connected Agents tool is not available in the new Foundry Agent Service. Copying the remote agent's instructions duplicates and loses the remote agent's tools and data.\n\nRemember to secure the connection with least privilege.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/agent-to-agent"], "ref": ["building-agents-with-foundry"]}, {"d": 3, "q": "A team requests a custom image size from a GPT-Image-2 deployment. The size rules: both edges are multiples of 16, the long edge is at most 3,840 px, the aspect ratio is between 1:3 and 3:1, and total pixels are between 655,360 and 8,294,400. Which size is valid?", "o": [{"t": "1920x1080", "c": false, "e": "1080 is not a multiple of 16."}, {"t": "640x960", "c": false, "e": "Both edges are multiples of 16, but 614,400 pixels are below the 655,360 minimum."}, {"t": "1920x1088", "c": true, "e": "Both edges are multiples of 16 (1088 = 68 x 16), the aspect ratio is about 1.76, and the total of 2,088,960 pixels is in range."}, {"t": "3840x2400", "c": false, "e": "Both edges are multiples of 16, but 9,216,000 pixels exceed the 8,294,400 maximum."}], "concept": "GPT-Image-2 accepts custom sizes, but only if all rules hold. Check each rule for each candidate.\n\n1920x1088: both edges are multiples of 16 (1920 = 16 x 120, 1088 = 16 x 68), long edge 1920 is at most 3,840, aspect ratio about 1.76:1 is between 1:3 and 3:1, and total pixels 1920 x 1088 = 2,088,960, which is between 655,360 and 8,294,400. Valid.\n\n1920x1080: 1080 is not a multiple of 16 (1080 / 16 = 67.5). Invalid, even though it is the common HD size.\n\n3840x2400: the edges are multiples of 16, but 3840 x 2400 = 9,216,000 pixels, above the 8,294,400 maximum. Invalid.\n\n640x960: edges are multiples of 16, but 640 x 960 = 614,400 pixels, below the 655,360 minimum. Invalid.\n\nLesson: do the arithmetic for every rule; the common \"1080\" is a trap.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"], "ref": ["image-and-video-generation"]}, {"d": 3, "q": "A design tool wants to show progressive previews while a high-quality image is still being generated, instead of a long blank wait. What should you use?", "o": [{"t": "Set `stream=true` and `partial_images` (0 to 3), and handle `image_generation.partial_image` events", "c": true, "e": "Each event carries `partial_image_index` and `b64_json` for an early preview."}, {"t": "Use `output_compression=0`", "c": false, "e": "This only affects JPEG compression."}, {"t": "Poll the job status endpoint every second", "c": false, "e": "Image generation does not use the Sora-style job lifecycle here."}, {"t": "Set `n=10` and show the images as they finish", "c": false, "e": "`n` creates several final images, not progressive previews."}], "concept": "Image generation at high quality can take a long time. A user staring at a blank screen assumes the app is broken. Streaming solves this by delivering partial images while the model is still working.\n\nYou set `stream=true` and `partial_images` to a number from 0 to 3, which is how many partial images you want. The service sends events of type `image_generation.partial_image`, each with a `partial_image_index` and `b64_json`. Your user interface displays each partial image as a progressive preview and replaces it with the final image.\n\nPolling a job endpoint is the pattern for video generation, not for this feature. Setting `n=10` produces ten separate images, which is more waiting, not a preview. `output_compression` changes file size, not delivery.\n\nMemory aid: streaming is the sketch artist showing a rough drawing first, then the finished painting.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"], "ref": ["image-and-video-generation"]}, {"d": 3, "q": "A marketing team has a finished Sora video and wants to change only the product color in one scene, without regenerating the whole clip. Which feature should they use?", "o": [{"t": "Content Understanding video analyzer", "c": false, "e": "It analyzes video and does not edit it."}, {"t": "`n_variants=4` on the original prompt", "c": false, "e": "Variants are new videos from the same prompt, not edits of the finished one."}, {"t": "Remix, which applies targeted edits to an existing video", "c": true, "e": "Remix changes an existing clip instead of generating everything again."}, {"t": "Image edit with a mask", "c": false, "e": "This edits still images."}], "concept": "Sora offers a Remix capability that applies a targeted edit to an existing video, so you do not need to regenerate the whole clip. You reference the existing video and describe the change in the prompt (for example, \"change the product color to red in this scene\"), and the service produces a new version with that change.\n\nOther tools do something else. `n_variants` creates several different versions of the same prompt from scratch. Image edit with a mask edits still images, not video. A Content Understanding video analyzer analyzes video to extract fields and does not change it.\n\nRemix keeps the rest of the clip stable, which saves cost and preserves approved parts. After remixing, run your normal safety and brand checks again, and keep the prompt, parameters, model version and reviewer with the asset.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/video-generation"], "ref": ["image-and-video-generation"]}, {"d": 3, "q": "A retailer must extract the same fields (count of empty slots, overall shelf condition from three allowed values) from 100,000 shelf photos, with typed JSON output. Which approach fits best?", "o": [{"t": "A Content Understanding custom image analyzer based on `prebuilt-image` with a `fieldSchema` (a number field and a `classify` field with an `enum`)", "c": true, "e": "Schema-driven analyzers return the same typed fields for every image and are built for repeatable extraction at scale."}, {"t": "Ask a vision chat model an open question for each photo", "c": false, "e": "Free-form answers drift between images and need extra prompting for typed output."}, {"t": "A text-only embedding model", "c": false, "e": "It cannot read images."}, {"t": "Image Analysis 4.0 tags", "c": false, "e": "Tags describe content generally and do not return your custom fields."}], "concept": "When you need the same fields from many images, a Content Understanding custom image analyzer is the best fit. You start from a base such as `prebuilt-image` and define a `fieldSchema`: the list of fields with types and methods. Every photo then returns the same typed JSON.\n\nFor the shelf photos: a number field for the count of empty slots (extract or generate, depending on the task) and a `classify` field for the overall condition with an `enum` of three allowed values such as good, fair and poor. Because the classification must choose from a fixed list, the output is consistent and can be aggregated across 100,000 photos.\n\nAn open question to a chat model returns free text that differs from photo to photo. Image Analysis 4.0 tags describe generic content, not your business fields. A text-only embedding model cannot read pictures.\n\nMemory aid: the schema is a form, and every photo fills in the same form.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers"], "ref": ["multimodal-understanding"]}, {"d": 3, "q": "A site must create a square avatar from user photos, cropped around the subject. Which Image Analysis 4.0 feature should you request?", "o": [{"t": "`tags`", "c": false, "e": "Tags describe content and return no crop rectangle."}, {"t": "`smartCrops` with an aspect ratio of 1.0, then apply the returned bounding box in your code", "c": true, "e": "Smart crops return one bounding box per requested aspect ratio (supported range 0.75 to 1.8)."}, {"t": "`objects`", "c": false, "e": "Object detection returns object boxes, not a crop for a target ratio."}, {"t": "`denseCaptions`", "c": false, "e": "It returns captions for regions, not a crop."}], "concept": "Image Analysis 4.0 offers features that describe images: captions, dense captions, tags, objects, people, read (OCR) and smart crops.\n\n`smartCrops` suggests crop rectangles that keep the area of interest of the image. You give one or more aspect ratios (width divided by height, between 0.75 and 1.8). A square avatar has a ratio of 1.0. The service returns a bounding box (x, y, width, height) for each requested ratio. It does not crop the file; your code applies the box with an image library.\n\n`tags` returns labels of what is in the image. `objects` returns objects with boxes. `denseCaptions` returns captions for regions. They describe content but give no crop for a target shape.\n\nRemember to check consent and privacy rules before processing photos of people.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/computer-vision/how-to/call-analyze-image-40"], "ref": ["multimodal-understanding"]}, {"d": 3, "q": "A publisher resizes AI-generated images with a tool that strips file metadata. Which provenance signal might still be detectable afterwards?", "o": [{"t": "The invisible watermark embedded in the content", "c": true, "e": "Content Credentials (C2PA) are metadata and are lost by many edits. An imperceptible watermark may survive."}, {"t": "The EXIF camera model", "c": false, "e": "AI-generated images have no camera and EXIF is metadata too."}, {"t": "The C2PA Content Credentials", "c": false, "e": "They are cryptographically signed metadata and are removed when metadata is stripped."}, {"t": "The file name", "c": false, "e": "File names are not a provenance signal."}], "concept": "Provenance for supported Microsoft models has two layers. Content Credentials (C2PA) are metadata stored in the file. An invisible watermark is embedded in the content itself, in the pixels.\n\nTools that strip metadata, such as some resizing tools, remove the C2PA data and the EXIF fields. The file name is just text. The invisible watermark was designed to survive some transformations, because it is part of the image content, so it might still be detectable after a resize. It is not guaranteed to survive heavy editing, cropping or screenshotting.\n\nTherefore a missing Content Credential does not prove the image is not AI-generated, and a surviving watermark gives extra evidence.\n\nPractice: keep originals with metadata, check provenance when assets enter your system, and label AI content for your audience.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/content-safety/provenance-disclosure"], "ref": ["responsible-ai-for-multimodal-content"]}, {"d": 3, "q": "A team reviews its workflow for publishing generated marketing images: filter the prompt, generate, filter the output, run automated brand checks. Which two steps must still be added before publishing, according to the review workflow?", "o": [{"t": "Human approval with the reviewer ID and time stored, and attaching provenance with a label to the final asset", "c": true, "e": "Public assets need human approval and provenance. The original with credentials is kept as the system of record."}, {"t": "Increasing the severity threshold to High to speed up approval", "c": false, "e": "It makes the filter more permissive."}, {"t": "A second generation to compare results, then delete the first image", "c": false, "e": "This is not a review step and loses the evidence."}, {"t": "Turning off output filtering because automated checks passed", "c": false, "e": "Filtering must apply on both input and output."}], "concept": "Publishing generated marketing images needs controls before, during and after generation.\n\nBefore: filter the prompt (for example with Content Safety and Prompt Shields). During: generate with the right model and parameters. After: filter the output, and run automated checks for brand rules and quality. Automated checks are fast but do not carry responsibility, so two steps still follow.\n\nHuman approval: a person reviews the asset and the decision is recorded with the reviewer ID and time, together with the prompt, parameters and model version. This is the audit trail. Provenance and labeling: keep Content Credentials, and attach a label that says the asset is AI-generated, so audiences and downstream systems can see it.\n\nGenerating twice and deleting the first adds cost but no control. Raising the severity threshold to High loosens protection. Turning off output filtering removes a safety layer.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/content-safety/provenance-disclosure"], "ref": ["responsible-ai-for-multimodal-content"]}, {"d": 4, "q": "A pipeline must summarize support chats with an LLM while keeping risk low. The chats contain names, phone numbers and card numbers. Which design fits?", "o": [{"t": "Send the raw chats to the LLM and ask it to ignore personal data", "c": false, "e": "The model has already received the personal data."}, {"t": "Store the raw chats in the prompt cache", "c": false, "e": "The cache is not a privacy control."}, {"t": "Skip PII detection because the LLM is more accurate", "c": false, "e": "Purpose-built PII categories and offsets are auditable and run before data leaves the boundary."}, {"t": "Run Azure Language PII detection first, send only the redacted text to the LLM, and treat the text as untrusted input", "c": true, "e": "This hybrid pattern keeps cost and risk low and removes personal data before the model sees it."}], "concept": "Support chats often contain personal data. Sending raw chats to a language model spreads that data into prompts, logs and caches. The safe order is to detect and remove the personal data first.\n\nAzure Language PII detection finds names, phone numbers, card numbers and more, and returns the text with each value replaced by a mask or a label. Send only the redacted text to the LLM, so the model never sees the raw values. Treat the chat text as untrusted input too: it may contain instructions meant to manipulate the model, so keep it in a clearly separated data part of the prompt.\n\nAsking the LLM to \"ignore personal data\" does not remove it from the request. Skipping PII detection because the LLM is accurate misses the point: the goal is that the data never reaches the model. A prompt cache stores prompt prefixes, and raw chats would be stored there.\n\nEvaluate PII recall on a labeled sample.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "You use an LLM to classify support tickets by urgency and need consistent, parseable labels. Which TWO practices apply?", "o": [{"t": "Skip evaluation because LLMs are accurate", "c": false, "e": "Evaluate accuracy per label on a labeled sample and compare with the Language feature."}, {"t": "Define each label in the prompt and include an `unknown` option for unclear text", "c": true, "e": "Definitions and an out reduce invented labels."}, {"t": "Use Structured Outputs so the app can parse the result, and set the temperature low (0 to 0.3)", "c": true, "e": "A schema keeps the shape fixed and a low temperature keeps labels consistent."}, {"t": "Let the model invent label names freely", "c": false, "e": "Labels outside the list break downstream logic."}, {"t": "Set the temperature to 1.5 to cover edge cases", "c": false, "e": "Higher randomness gives inconsistent labels."}], "concept": "When a program needs to read a model's answer, the answer must be consistent and parseable.\n\nStructured Outputs force the response to follow a JSON schema, for example `urgency` as an enum of `low`, `medium`, `high`, `unknown`. A low temperature (0 to 0.3) reduces variation, so the same ticket gets the same label. Define each label in the prompt with a short rule and an example, and include an `unknown` option, so the model does not have to force an unclear ticket into a wrong class.\n\nLetting the model invent label names breaks aggregation. A high temperature of 1.5 adds randomness. Skipping evaluation is risky: build a labeled test set and measure accuracy and agreement with human labels, then recheck after prompt or model changes.\n\nAlso keep a human review for tickets that are marked unknown or have high business impact.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "An enterprise bot needs a calendar skill (intent and entity extraction) and an FAQ from product manuals, and must send each user utterance to the correct one. Which Azure Language capability routes between them?", "o": [{"t": "Orchestration workflow, which routes an utterance to the right CLU or custom question answering project", "c": true, "e": "It is designed for bots that combine a CLU skill with an FAQ."}, {"t": "Sentiment analysis", "c": false, "e": "It labels sentiment, not routing."}, {"t": "Named entity recognition", "c": false, "e": "It extracts entities only."}, {"t": "Language detection", "c": false, "e": "It identifies language, not intent routing."}], "concept": "An enterprise bot often combines several language projects. Conversational language understanding (CLU) predicts intent and entities for actions such as \"book a meeting with Dana at 3\". Custom question answering returns answers from a knowledge base such as product manuals.\n\nWhen an utterance arrives, something must decide which project should handle it. An orchestration workflow is the Azure Language project type for this. You connect the child projects (CLU and custom question answering), and train the workflow with examples of utterances for each. At run time it predicts which child project fits the utterance and routes it, returning that project's result.\n\nNamed entity recognition extracts entities from text, language detection returns the language, and sentiment analysis scores opinion. None routes between projects.\n\nMemory aid: the orchestration workflow is the receptionist who sends each visitor to the right department.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A team submit
