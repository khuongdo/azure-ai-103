s a batch transcription job for recordings in English, Spanish or French (the language of each file is unknown) and wants to be notified when the job finishes. Which options apply?", "o": [{"t": "Provide 25 candidate locales so that every file is covered", "c": false, "e": "Language identification supports 2 to 10 candidate locales."}, {"t": "Ignore the validation request and return an empty response", "c": false, "e": "The validation token must be echoed back."}, {"t": "Enable `languageIdentification` with 2 to 10 candidate locales and register a webhook, echoing the `validationToken` from the validation request as plain text", "c": true, "e": "These are the documented batch options for language identification and notifications."}, {"t": "Use fast transcription, because it supports webhooks", "c": false, "e": "Fast transcription is synchronous and returns results directly."}], "concept": "Batch transcription processes files asynchronously. Two features appear in the question.\n\nLanguage identification: when the language of each file is unknown, enable `languageIdentification` and list candidate locales. The service accepts 2 to 10 candidates, so you cannot provide 25. Pick the likely ones, here en-US, es-ES and fr-FR.\n\nWebhooks: instead of polling, register a webhook to be notified when a transcription finishes. When you register it, the service sends a validation request containing a `validationToken`. Your endpoint must reply with that token as plain text in the response, otherwise the registration fails. Ignoring the validation request or returning an empty response breaks the setup.\n\nFast transcription is a synchronous API for a single file; it has no webhook because it returns the result directly.\n\nMemory aid: the service rings the doorbell to check someone is home; you answer with the code it gave you.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/batch-transcription-create"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A company wants a branded synthetic voice for its app. Which TWO statements are correct?", "o": [{"t": "Visemes are available for every voice and language", "c": false, "e": "Visemes are listed for en-US neural voices only."}, {"t": "Custom voice is available to every customer without approval", "c": false, "e": "It is limited access."}, {"t": "Text to speech billing counts characters, including SSML markup (except `<speak>` and `<voice>`)", "c": true, "e": "Long SSML adds to the count, and each Chinese character counts as two."}, {"t": "Batch synthesis is for audio shorter than a minute", "c": false, "e": "The batch synthesis API is for audio longer than 10 minutes, such as audiobooks."}, {"t": "Custom voice is limited access, needs approval and consent from the voice talent, and requires disclosing the synthetic voice to listeners", "c": true, "e": "This is the responsible-use requirement for custom voices."}], "concept": "A custom voice gives your brand a unique synthetic voice. Because a realistic voice can be misused, it is a limited access feature: you apply for approval, you need the explicit consent of the voice talent, and you must disclose to listeners that the voice is synthetic.\n\nBilling for text to speech counts characters. SSML markup is also counted, except the `<speak>` and `<voice>` tags. So a heavily marked-up SSML text costs more than the same plain text.\n\nBatch synthesis is the API for long audio (longer than 10 minutes), not for short audio. Visemes (mouth shape timing for avatars and lip sync) are not available for every voice and language.\n\nMemory aid: a custom voice is like a signature. It needs the signer's consent, and people have the right to know it is a copy.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/text-to-speech"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A bank must translate 800 PDF contracts nightly, preserving layout, using a glossary for approved terms. The Translator resource has a private endpoint and VNet access enabled. Which statement is correct?", "o": [{"t": "Use speech translation", "c": false, "e": "It handles audio."}, {"t": "Use synchronous document translation for all 800 files", "c": false, "e": "Synchronous translation handles one file and returns the result directly."}, {"t": "Use Transliterate", "c": false, "e": "It converts script, not languages."}, {"t": "Use batch document translation with Blob containers (managed identity preferred) and a glossary file, and call the custom endpoint, because access tokens cannot be used when VNet or private endpoints are enabled", "c": true, "e": "Batch handles many files, glossaries come as CSV, XLIFF or TSV, and private networking requires the custom endpoint."}], "concept": "Document translation translates whole files while keeping layout and format. It has two modes. Batch (asynchronous) is for many or large files: the source and target are Blob containers, you prefer managed identity over SAS tokens, and you can attach a glossary file (CSV, XLIFF or TSV) for approved terms. Synchronous mode translates one file at a time and returns it directly; it needs no storage account.\n\nEight hundred PDF contracts each night are a batch job. Contracts need consistent approved terminology, so use a glossary.\n\nThe Translator resource has a private endpoint and VNet access. In that configuration the global endpoint and access tokens cannot be used. You call the resource's custom endpoint, and use key-based or other supported authentication.\n\nTransliterate converts scripts, not languages. Speech translation is for audio. Synchronous mode for 800 files would be slow and awkward.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/overview"], "ref": ["translation"]}, {"d": 4, "q": "A localization app sends 120 text segments in one `2026-06-06` Translate request with an LLM deployment, and the request is rejected. What is the likely reason?", "o": [{"t": "The request must use the v3.0 format", "c": false, "e": "The latest GA version uses `inputs` and `value`."}, {"t": "The LLM path allows a maximum of 50 array elements (and 5,000 characters per element); the NMT path allows 1,000", "c": true, "e": "Split the batch into requests of 50 or fewer, or use NMT for high-volume baseline traffic."}, {"t": "The `inputs` array must contain exactly one element", "c": false, "e": "Multiple elements are allowed within the limits."}, {"t": "LLM translation does not support arrays", "c": false, "e": "It supports arrays of up to 50 elements."}], "concept": "Translate requests in the `2026-06-06` API have limits that depend on the translation path. A standard NMT request allows up to 1,000 array elements, each up to 50,000 characters. An LLM request is more expensive per call, so the limits are tighter: up to 50 array elements, each up to 5,000 characters.\n\nThe request in the question has 120 segments in one call with an LLM deployment. That is more than 50, so it is rejected. The fix is to split the work into batches of 50 or fewer (and make sure that each element is at most 5,000 characters), or to send the bulk traffic to NMT.\n\nThe `inputs` array may contain many elements, not exactly one. LLM translation does support arrays. The v3.0 format is the older version and not required.\n\nDesign tip: keep high-volume baseline traffic on NMT and use the LLM only where tone or context matters; this also reduces cost.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/overview"], "ref": ["translation"]}, {"d": 5, "q": "Which statement about the Azure AI Search indexer objects is correct?", "o": [{"t": "A skillset is required for every indexer", "c": false, "e": "Skillsets are optional."}, {"t": "One indexer can read several data sources and write to several indexes", "c": false, "e": "An indexer reads one data source and writes to one index."}, {"t": "The indexer creates the index schema automatically", "c": false, "e": "You create the index."}, {"t": "One indexer uses one data source and writes to one index; many indexers can write to the same index, and you create the index yourself", "c": true, "e": "The indexer connects the data source, optional skillset and index."}], "concept": "Azure AI Search has four main objects: data source, skillset, index and indexer.\n\nAn indexer is the connector that does the work. It reads from exactly one data source and writes to exactly one index. Many indexers may write into the same index, which is how you combine several sources. The indexer does not create the index schema: you define the index yourself (fields, types, analyzers, vector settings), and the indexer maps source fields into it.\n\nA skillset is optional. A simple indexer that copies text fields does not need one. You add a skillset when you need enrichment such as OCR, chunking or embeddings.\n\nSo the claim \"one indexer reads several sources and writes several indexes\" is wrong, as are \"creates the schema automatically\" and \"skillset required\".\n\nMemory aid: indexer = one pipe from one source to one index.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-indexer-overview"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "After changing the skillset (a new chunk size), the indexer finishes without errors, but old documents still show old chunks. What should you do, and which feature avoids repeating costly OCR on unchanged files?", "o": [{"t": "Delete the search service", "c": false, "e": "This is far beyond what is needed."}, {"t": "Reset the indexer before re-running, and use the enrichment cache (preview) to reuse skill outputs for unchanged documents", "c": true, "e": "A reset makes the indexer reprocess content, and the cache saves skill cost."}, {"t": "Enable the knowledge store", "c": false, "e": "It stores enrichment output for analytics and does not trigger reprocessing."}, {"t": "Increase the number of replicas", "c": false, "e": "Replicas add concurrency but do not reprocess documents."}], "concept": "Indexers track which documents they have processed, so they do not reprocess unchanged ones. When you change the skillset (for example the chunk size), the indexer does not know that old documents need new enrichment, so they keep their old chunks. Reset the indexer to clear its tracking state, and then run it again so all documents are processed with the new skillset.\n\nReprocessing everything repeats expensive skills such as OCR. The enrichment cache (preview) stores intermediate skill outputs in Azure Storage. When you rerun, the indexer reuses cached outputs for documents and skills that have not changed, and only recomputes what is affected, which saves cost and time.\n\nDeleting the search service is unnecessary. Replicas increase query capacity, not enrichment. The knowledge store saves enriched data for other uses and is not a cache for reruns.\n\nMemory aid: reset says \"forget what you did\"; cache says \"but remember the expensive answers\".", "src": ["https://learn.microsoft.com/en-us/azure/search/cognitive-search-concept-intro"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "Analysts want to use the enriched output of an indexer pipeline (extracted entities, OCR text) in Power BI, outside of search queries. Which skillset output serves this?", "o": [{"t": "A vectorizer", "c": false, "e": "It encodes queries at query time."}, {"t": "A knowledge store, which writes enriched content to blobs or tables in Azure Storage", "c": true, "e": "It is the optional output for analytics and Power BI."}, {"t": "The enrichment cache", "c": false, "e": "It exists to reuse skill outputs, not for reporting."}, {"t": "The search index only", "c": false, "e": "The index is for search queries and is required, but it is not the analytics output."}], "concept": "An Azure AI Search index is optimized for search queries. Sometimes you also need the enriched data for other uses, such as analysis in Power BI, data science or another pipeline.\n\nA knowledge store is an output of a skillset. It writes the enriched content, such as extracted entities, key phrases, OCR text and normalized images, to Azure Storage as blobs (JSON or images) or tables. From there, tools like Power BI or Azure Data Factory can read it. You define projections in the skillset to shape the output.\n\nThe index serves queries, not analysis. The enrichment cache stores intermediate results to speed up reruns and is not meant as an analytics source. A vectorizer converts query text into a vector.\n\nMemory aid: the index is the shop window for search; the knowledge store is the warehouse for everything else.", "src": ["https://learn.microsoft.com/en-us/azure/search/cognitive-search-concept-intro"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A custom Web API skill calls an Azure Function that sometimes needs 4 minutes to respond. Records are dropped and the skill times out. Which statement is correct?", "o": [{"t": "Increase `degreeOfParallelism` to 10 to shorten each call", "c": false, "e": "Parallelism runs more calls at once. It does not shorten one call."}, {"t": "Set `timeout` to `PT10M`", "c": false, "e": "The maximum is 230 seconds."}, {"t": "Return the records in any order and omit `recordId`", "c": false, "e": "Each returned record needs its `recordId`, or it is dropped."}, {"t": "The skill `timeout` has a maximum of 230 seconds, so work that takes longer needs a different design (for example transcribe in advance and let the skill read the result)", "c": true, "e": "The default is 30 seconds and the maximum is 230 seconds."}], "concept": "A custom Web API skill lets an indexer call your own HTTP endpoint for each batch of records. The call is synchronous: the indexer waits for the answer. Therefore the skill has a timeout, and the maximum is 230 seconds.\n\nA function that sometimes needs 4 minutes (240 seconds) exceeds the maximum. The records fail or are dropped. Setting `timeout` to `PT10M` is not possible. Raising `degreeOfParallelism` increases the number of concurrent calls, not the speed of each call. Each request and response must contain the `recordId` so the results can be matched, so omitting it is an error.\n\nA better design avoids long synchronous work: do the slow processing in advance (for example transcribe audio in a separate pipeline) and let the skill only read the result. Or queue the work and index the result when ready.\n\nRule: skills are for quick transformations; long jobs belong in asynchronous steps.", "src": ["https://learn.microsoft.com/en-us/azure/search/cognitive-search-custom-skill-web-api"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A Content Understanding analyzer extracts contract fields. The team wants to auto-approve values with high confidence and send uncertain ones to a reviewer, and to show where in the document each value came from. Which setting should they enable?", "o": [{"t": "`tableFormat` set to markdown", "c": false, "e": "It only changes the table output format."}, {"t": "`enableOcr` set to false", "c": false, "e": "This turns off OCR and does not add confidence."}, {"t": "`omitContent`", "c": false, "e": "It omits content from the output and does not add confidence."}, {"t": "`estimateFieldSourceAndConfidence`, which returns source location and confidence per field", "c": true, "e": "Confidence (0 to 1) and grounding allow routing between automatic approval and human review."}], "concept": "Extraction is never perfect, so a good design records how sure the system is and where each value came from.\n\nIn a Content Understanding analyzer, the setting `estimateFieldSourceAndConfidence` makes the service return, for each field, the source location (where in the document the value was found) and a confidence score. With the confidence you can build a rule: values with high confidence are auto-approved, the others go to a human reviewer. With the source location the reviewer interface can highlight the exact place in the document, which makes checking quick and builds trust.\n\nThe other settings do something else: `enableOcr` set to false would turn off text recognition for scanned pages, `tableFormat` chooses how tables are written (HTML or Markdown), and `omitContent` leaves out the content part of the result.\n\nAlso add business rule checks, because a confident value can still be wrong.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "A RAG pipeline needs clean text with headings and tables preserved from varied PDFs, as input to chunking and an LLM. Which Content Understanding choice fits?", "o": [{"t": "Plain text output with tables flattened", "c": false, "e": "Flattened tables lose which value belongs to which column."}, {"t": "A `generate` field that returns the whole document as a string", "c": false, "e": "It costs tokens and loses the layout."}, {"t": "The RAG-oriented analyzer `prebuilt-documentSearch`, using the Markdown output", "c": true, "e": "Markdown keeps headings and tables and describes figures, which makes good LLM input."}, {"t": "`prebuilt-videoSearch`", "c": false, "e": "It is the RAG analyzer for video."}], "concept": "RAG needs text that is clean, ordered and structured. A table flattened into a line of numbers, or headings lost, makes chunks meaningless.\n\nContent Understanding offers RAG-oriented prebuilt analyzers. `prebuilt-documentSearch` converts documents into Markdown that preserves headings, lists and tables, and it adds useful extras such as figure descriptions. You then chunk the Markdown by section headings and send chunks to your embedding model and index. Pointing to the Markdown output is the key: it carries the structure that chunking needs.\n\nA `generate` field that returns the whole document as a string loses structure and can paraphrase or truncate. `prebuilt-videoSearch` is for video. Plain text with flattened tables loses the meaning of rows and columns.\n\nCheck the result with a few real documents, and compare retrieval quality before and after.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/document/overview"], "ref": ["content-understanding-and-document-intelligence"]}]};</script>
