<div id="app"></div>
<script>window.MOCK_EXAM = {"id": "mock-6", "title": "AI-103 Mock Exam 6", "shortTitle": "Mock exam 6", "description": "Full-length mock exam with 50 scenario questions. This test is closest to the short, direct style of public sample questions: resource hierarchy, choosing the narrowest service, deployment types, prompt basics, retrieval basics, agent building blocks and the first steps of speech, translation and indexing. Good as a warm-up after finishing the lessons.", "defaultMinutes": 120, "domains": [{"id": 1, "name": "Plan and manage an Azure AI solution", "weight": "25-30%", "count": 14}, {"id": 2, "name": "Implement generative AI and agentic solutions", "weight": "30-35%", "count": 16}, {"id": 3, "name": "Implement computer vision solutions", "weight": "10-15%", "count": 7}, {"id": 4, "name": "Implement text analysis solutions", "weight": "10-15%", "count": 7}, {"id": 5, "name": "Implement information extraction solutions", "weight": "10-15%", "count": 6}], "questions": [{"d": 1, "q": "Three product teams will build agents. Platform engineering wants one place to set network rules, role assignments, monitoring and the shared model deployments, while each team keeps its own agents and connections separate. Which structure should you use?", "o": [{"t": "One Foundry resource with a single shared project for all agents", "c": false, "e": "All agents in a project share one managed identity and one set of connections, so the teams are not separated."}, {"t": "One Azure OpenAI resource per team connected to a hub", "c": false, "e": "Hub-based projects are the classic experience, and current guidance targets Foundry resources and projects."}, {"t": "One Foundry resource with one project per team", "c": true, "e": "The resource is the administrative, security and monitoring boundary that holds model deployments; each project organizes work and access for one team."}, {"t": "One project per team, each inside its own Foundry resource", "c": false, "e": "This repeats networking, policy and deployments three times and removes the shared control point."}], "concept": "A Foundry resource is the top-level scope. It is where you set networking, policy, role-based access control, monitoring and quota, and it holds the model deployments. A project is a smaller scope inside the resource. It organizes work and enforces access for agents, tools and connections, and it has its own managed identity.\n\nThink of the resource as the building and each project as a locked office. The building has one front door, one security desk and one set of shared equipment (the model deployments). Each office has its own key and files. If you want separation between teams, add projects. If you want a different security or quota boundary, such as production versus testing, add resources.\n\nUsing one resource per team duplicates the controls. Using one shared project removes the separation, because everything in a project shares one identity. Hub-based projects belong to the older classic experience.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/what-is-foundry", "https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A company must read scanned order forms and return the text, the tables and the selection marks (checked boxes) with deterministic, structured output. A developer proposes a prompt to a general chat model. Which choice follows the guidance to use the narrowest service that meets the requirement?", "o": [{"t": "Use Azure Translator document translation", "c": false, "e": "Translator changes the language of a document; it does not extract fields or selection marks."}, {"t": "Use a general chat model with a long prompt that lists every field", "c": false, "e": "A model can read documents, but the output is less repeatable and costs more than a purpose-built extractor for a fixed job."}, {"t": "Use the Azure Language named entity recognition feature", "c": false, "e": "Language works on text, so it would need the OCR and layout step first and does not return selection marks."}, {"t": "Use Document Intelligence Layout (or a Content Understanding document analyzer)", "c": true, "e": "These services are built for OCR, tables, selection marks and structure, and they return structured output with confidence."}], "concept": "Microsoft's guidance is to use the narrowest service that meets the requirement, add a model where context and judgment are needed, and combine them when each does what it is best at. This is a \"tool check\" before a \"model choice\".\n\nThe task here is extraction from files: text from scans (OCR), tables, and selection marks. Document Intelligence Layout and Content Understanding are made for this. They give structured output, and many results include confidence scores, so you can send low-confidence results to a person. A general chat model could try, but it is slower, costs more per page and may change its answer between runs.\n\nTranslator and Language solve different jobs: changing language, and analyzing text that is already extracted.\n\nRule: purpose-built tool for the job first; a model for the parts that need reasoning.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/foundry-models-overview", "https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/prebuilt/layout"], "ref": ["model-and-service-selection", "content-understanding-and-document-intelligence"]}, {"d": 1, "q": "A team deploys an open-source model on managed compute (preview) for an internal assistant. Security asks how harmful prompts and answers will be filtered. What is the correct answer?", "o": [{"t": "Filtering is enabled by choosing a Global deployment type", "c": false, "e": "Managed compute is Global only, but that is about location, not about safety filtering."}, {"t": "The GPU hardware scans the traffic", "c": false, "e": "Accelerator SKUs only provide compute; they do not filter content."}, {"t": "Managed compute has no built-in content filtering in preview, so add Azure AI Content Safety yourself", "c": true, "e": "Learn states that content filtering is not available for managed compute in preview."}, {"t": "The default guardrail of the Foundry resource is applied automatically", "c": false, "e": "Built-in filtering belongs to serverless deployments, not to managed compute in preview."}], "concept": "Foundry has two main ways to run a model. A serverless API means Microsoft hosts the model for you, bills by use, and includes content filtering that you can customize. Managed compute means you rent dedicated GPUs (for example A100 or H100) to run open-source, partner or custom models, and you pay per hour for each accelerator.\n\nThe safety difference matters on the exam. In preview, managed compute has no content filtering. If you call a model through a path that does not use the Azure OpenAI SDK surface, you also do not get filtering unless you add Azure AI Content Safety yourself.\n\nSo the plan is: place a safety check in front of and behind the model (the prompt and the answer) by calling Content Safety from your app or gateway.\n\nMemory aid: serverless comes with a seat belt; managed compute needs you to fit one.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/foundry-models-overview", "https://learn.microsoft.com/en-us/azure/ai-services/content-safety/overview"], "ref": ["model-and-service-selection", "responsible-ai-governance"]}, {"d": 1, "q": "A team picked the model that ranks first on a public leaderboard for a contract-review assistant. Before moving it to production, which TWO checks does the guidance recommend?", "o": [{"t": "Accept the leaderboard rank as proof of quality for every task", "c": false, "e": "A rank is a published average; it says little about your own contracts."}, {"t": "Choose the largest model available, since size guarantees accuracy", "c": false, "e": "Larger models cost more and are slower; the smallest model that passes your tests is the target."}, {"t": "Open the License tab and confirm the provider's terms and the model's availability in your region", "c": true, "e": "Partner and community models come with provider terms, and a model that is not offered in your region cannot be deployed there."}, {"t": "Skip evaluation because a Preview label means Microsoft has certified the model", "c": false, "e": "Preview is a lifecycle label, not a certification, and production workloads should prefer GA models."}, {"t": "Test the model on your own prompts and documents, because benchmarks are averages", "c": true, "e": "Your data decides whether the model is good enough for your task."}], "concept": "A model catalog lists thousands of models, so you need a method to choose one. The recommended steps are: filter by task, features, region and lifecycle; compare benchmarks and cost; then test on your own data. Open the model card to read the Details, Deployments, Benchmarks and License tabs.\n\nBenchmarks are averages over public data sets. Your contracts, your prompts and your language may behave differently, so a short test of 30 to 50 real examples is worth more than a rank. The License tab matters because models from partners and the community are supported by the provider and billed through Azure Marketplace under the provider's terms.\n\nCommon mistakes are choosing by rank alone, ignoring the license, choosing a Preview model for a production workload, and choosing a model that is not available in your region.\n\nRule: shortlist with benchmarks, decide with your own test.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/foundry-models-overview"], "ref": ["model-and-service-selection"]}, {"d": 1, "q": "A subscription is onboarded to subscription-level quota management for a model. A team creates one Global Standard deployment of the model in one region and another Global Standard deployment of the same model and version in a second region. How is the quota counted?", "o": [{"t": "The two deployments share one pool for that model and version across all regions of the subscription", "c": true, "e": "Global Standard deployments of the same model and version in a subscription share a single pool."}, {"t": "The quota is counted per project, so each project has its own pool", "c": false, "e": "Limits are enforced at the subscription, not per project."}, {"t": "Each region has its own separate pool, so quota doubles", "c": false, "e": "This was the older per-region model; it does not apply to onboarded models."}, {"t": "The quota is shared with every subscription in the tenant", "c": false, "e": "Limits are enforced at the subscription and not at the tenant."}], "concept": "Quota is a policy limit on how much capacity you may use. For models onboarded to subscription-level quota management, all Global Standard deployments of the same model and version in one subscription draw from one pool across all regions. Data Zone Standard deployments share one pool per data zone.\n\nWhy this matters: if you create two deployments hoping to get two full quotas, you will find that they split one. To get more, request a quota increase or move quota from an unused deployment. You can check the scope of each limit in the Quota page: the Scope column says Global, Data Zone or a specific region.\n\nFor models that are not onboarded, limits are still per region, per subscription, per model or deployment type.\n\nRemember: limits are enforced at the subscription, not the tenant and not the project.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/quotas-limits"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "A trading-desk assistant must answer faster than normal pay-as-you-go traffic allows, but the team does not want to commit to reserved capacity and the workload is irregular. Which deployment choice fits?", "o": [{"t": "Provisioned throughput with a one-year reservation", "c": false, "e": "Reserved capacity needs a commitment and is paid for even when idle, which does not suit irregular traffic."}, {"t": "Priority processing on a pay-as-you-go deployment", "c": true, "e": "It prioritizes shared capacity for faster responses and a defined latency target without a reservation."}, {"t": "Batch deployment", "c": false, "e": "Batch is asynchronous with a 24-hour target and no real-time promise."}, {"t": "Developer deployment", "c": false, "e": "The developer type is for evaluating fine-tuned models, with no SLA."}], "concept": "Think of deployment types as ways to rent model capacity. Standard shares capacity and has no latency promise. Provisioned reserves capacity for you, bills every hour whether you use it or not, and gives consistent latency. Batch trades speed for a 50% discount and a 24-hour target. Developer is a short-lived type for evaluating fine-tuned models.\n\nPriority processing sits between standard and provisioned. You still pay per token, with no commitment, but at a priority rate, and requests are served ahead of normal traffic with a defined latency target for the model.\n\nThe decision here comes from two facts: the team wants faster responses, and it does not want a commitment because traffic is irregular. That leaves priority processing.\n\nMemory aid: priority is the fast lane you pay per use; provisioned is a private lane you pay for all day.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "A data scientist wants to try a fine-tuned model for two days before deciding whether to keep it. They do not want to pay hourly hosting for a long-running deployment. Which deployment type is intended for this purpose?", "o": [{"t": "Developer", "c": true, "e": "It is a pay-per-token type meant for evaluating fine-tuned models, with a 24-hour deployment lifetime and no SLA."}, {"t": "Global Batch", "c": false, "e": "Batch is for asynchronous bulk jobs with a 24-hour target, not for trying a model interactively."}, {"t": "Data Zone Provisioned", "c": false, "e": "This reserves capacity inside a zone, which is a production feature."}, {"t": "Provisioned (PTU)", "c": false, "e": "It bills per hour for reserved capacity even when idle, which is wasteful for a short test."}], "concept": "Fine-tuned models normally need hosting, and hosting costs money while it runs. The Developer deployment type exists so you can evaluate a fine-tuned model without a long commitment. You pay per token, the deployment has a lifetime of 24 hours, and there is no SLA.\n\nThat last point defines when you should not use it: never for production traffic, because it has no availability promise and it expires.\n\nHow it differs from the others: Standard and Global are for normal pay-per-token traffic with shared capacity. Provisioned bills every hour for reserved capacity. Batch is cheaper but is asynchronous.\n\nRule: Developer is for evaluating fine-tuned models only. Anything customer-facing needs a type with a service level.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "An operations engineer must create a diagnostic setting on a Foundry resource that sends request and audit logs to a Log Analytics workspace. Another colleague only needs to view the metric charts. Which pair of built-in roles is the least privileged fit?", "o": [{"t": "Monitoring Reader for the engineer and Monitoring Contributor for the colleague", "c": false, "e": "This reverses the privileges, so the engineer cannot configure the setting."}, {"t": "Foundry Agent Consumer for both people", "c": false, "e": "It only allows calling agent endpoints, not viewing or configuring monitoring."}, {"t": "Foundry Owner for both people", "c": false, "e": "It is far more privileged than needed and grants build and management rights."}, {"t": "Monitoring Contributor for the engineer and Monitoring Reader for the colleague", "c": true, "e": "Contributor can configure diagnostic settings; Reader can view metrics."}], "concept": "Monitoring data comes in two forms. Metrics are collected automatically for a Foundry resource and can be viewed in metrics explorer. Logs are not collected anywhere unless you route them with a diagnostic setting, which sends chosen categories (for Foundry Models: RequestResponse, Trace and Audit) and AllMetrics to a Log Analytics workspace.\n\nTwo Azure Monitor roles fit these two jobs. Monitoring Reader lets a person view metrics. Monitoring Contributor lets a person configure diagnostic settings. Following least privilege, give each person only what the task needs.\n\nAfter you create the setting, allow up to about 15 minutes for data to appear. Collecting logs costs money, so choose only the categories you need.\n\nDo not confuse monitoring roles with Foundry roles: Agent Consumer only calls agents; Owner can do everything.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/monitor-models"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 1, "q": "A support agent passed all pre-release evaluations. The team wants to detect quality drift without waiting for user complaints, using a fixed set of test questions with known good answers. Which approach fits?", "o": [{"t": "Run the evaluation once before release and never again", "c": false, "e": "The model, data and traffic change, so a single run cannot detect drift."}, {"t": "Increase the model's temperature", "c": false, "e": "This changes randomness and does not detect drift."}, {"t": "Turn off tracing to reduce noise", "c": false, "e": "Tracing helps debugging; it does not measure drift and turning it off removes evidence."}, {"t": "Run a scheduled evaluation with the fixed test set, and add alerts on the scores", "c": true, "e": "A repeatable test set run on a schedule shows when quality moves away from the baseline."}], "concept": "Quality can change even when nobody changes the code: a model version moves, the data in the knowledge base changes, or users start asking new questions. This is called drift.\n\nFoundry describes three evaluation stages. Before choosing a model you use benchmarks. Before release you use your own dataset with quality and safety evaluators plus red teaming. After release you use continuous evaluation of sampled production traffic, and scheduled evaluation that re-runs a fixed test set to detect drift, together with scheduled red teaming and Azure Monitor alerts.\n\nIn this question the team has a fixed set of questions with known answers, which is exactly what scheduled evaluation needs. Continuous evaluation, by contrast, scores real traffic that has no known answer.\n\nMemory aid: fixed set on a schedule finds drift; sampled traffic finds real-world surprises.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/observability"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 1, "q": "Microsoft's Responsible AI approach in Foundry is organized into Discover, Protect and Govern. A team runs a red team and risk and safety evaluators against its HR assistant before launch. Which activity does this belong to?", "o": [{"t": "None, because evaluation is separate from responsible AI", "c": false, "e": "Evaluation is a core part of the framework, not separate from it."}, {"t": "Govern, because it assigns accountability and approvals", "c": false, "e": "Govern is about policies, ownership, approvals and audit logs."}, {"t": "Protect, because it blocks harmful content at runtime", "c": false, "e": "Protect uses runtime controls such as guardrails and Prompt Shields."}, {"t": "Discover, because it finds what can go wrong before users do", "c": true, "e": "Red teaming and risk evaluators are Discover activities."}], "concept": "The three activities answer three questions. Discover asks: what can go wrong here? Protect asks: how do we stop it at runtime? Govern asks: who is accountable, and how do we prove it?\n\nIn Foundry, Discover contains red teaming, risk and safety evaluators, and Defender for Cloud risks and alerts. Protect contains guardrails, content filters, Prompt Shields, grounding and tool limits. Govern contains policies, approvals, audit logs, ownership and an incident process.\n\nThe cycle repeats for the life of the system. Production feedback and monitoring reveal new risks, which go back to Discover.\n\nA frequent mistake is treating the filter as the whole program: filtering without testing first (Protect without Discover) or without anyone owning an incident (no Govern).\n\nMemory aid: Discover finds the holes, Protect plugs them, Govern decides who is responsible.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/responsible-use-of-ai-overview", "https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators"], "ref": ["responsible-ai-governance"]}, {"d": 1, "q": "A platform manager must create Foundry resources and projects and manage model deployments, but company policy says this person must not build or run agents inside projects. Which built-in role fits?", "o": [{"t": "Foundry Account Owner", "c": true, "e": "It can create accounts and projects and manage models, but it cannot build in projects."}, {"t": "Foundry User", "c": false, "e": "It is the developer role for building and testing in a project, which the policy forbids."}, {"t": "Foundry Project Manager", "c": false, "e": "It can build, publish agents and assign Foundry User, which goes beyond the allowed scope."}, {"t": "Foundry Owner", "c": false, "e": "It combines all of the above, including building in projects."}], "concept": "Foundry has a small set of built-in roles with different purposes. Foundry Agent Consumer can call agent endpoints only. Foundry User can build and develop in a project. Foundry Project Manager can build, publish agents and assign Foundry User to others. Foundry Account Owner can create accounts and projects and manage models, but cannot build inside projects. Foundry Owner has all of these rights.\n\nThe policy in the question separates two duties: administering the platform and building on it. Account Owner matches the first duty only.\n\nOther rules of thumb: API keys bypass role-based access control, so prefer Microsoft Entra ID; publishing an agent needs at least Project Manager on the Foundry resource; do not use the older Cognitive Services roles (except Usages Reader for quota) or Azure AI Developer for Foundry projects.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry"], "ref": ["agent-safety-and-identity", "platform-network-and-reliability"]}, {"d": 1, "q": "A developer opens the Foundry portal and finds no traces for a prompt agent that was clearly used. The code has no errors. Which two things should be checked first?", "o": [{"t": "That the agent has been deleted and recreated with a different name", "c": false, "e": "Renaming and recreating does not affect where traces are stored."}, {"t": "That the guardrail is set to annotate only", "c": false, "e": "Guardrail mode affects content decisions, not telemetry."}, {"t": "That the project is connected to an Application Insights resource and the viewer has a Log Analytics reader role", "c": true, "e": "Foundry stores traces in Azure Monitor Application Insights, and the portal needs read access to the workspace."}, {"t": "That the model deployment is set to Provisioned", "c": false, "e": "Deployment type does not control tracing."}], "concept": "A trace records every step of one request: model calls, tool calls with arguments and results, token use and timing. Foundry uses OpenTelemetry conventions and sends traces to Azure Monitor Application Insights.\n\nFor traces to appear, three things must be true. The project must be connected to an Application Insights resource. The person viewing must be able to query the data, which in the portal needs a Log Analytics reader role. And the code must carry the instrumentation for the framework in use (for example LangChain, LangGraph, the OpenAI Agents SDK or the Microsoft Agent Framework).\n\nTracing is generally available for prompt and hosted agents, while workflow and external agents are Preview. Retention and sampling follow your Application Insights configuration.\n\nCheck connection, then permission, then instrumentation, before suspecting the agent.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/observability/concepts/trace-agent-concept", "https://learn.microsoft.com/en-us/azure/foundry/concepts/observability"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 1, "q": "A team runs a production agent in the basic agent setup. Compliance asks what could be recovered if the platform-managed conversation data were lost. What should you recommend?", "o": [{"t": "Move to the standard agent setup with your own Cosmos DB, Storage and AI Search, and configure backup before an incident", "c": true, "e": "Basic mode has almost no recovery options for resource loss; the standard setup lets you protect your own data stores."}, {"t": "Rely on the model provider to restore the conversations", "c": false, "e": "Model deployments do not store your conversation state."}, {"t": "Disable all diagnostics so the data volume stays small", "c": false, "e": "This removes visibility and does not help recovery."}, {"t": "Keep the basic setup because Foundry provides built-in point-in-time restore for agents", "c": false, "e": "Agent Service has no built-in backup, disaster recovery or point-in-time restore."}], "concept": "By default, Agent Service manages storage for files, conversations and vector stores in the basic setup. This is easy to start with, but you do not own or control the data, so recovery options are almost nonexistent.\n\nThe standard agent setup puts the data in your own resources: conversations and agent definitions in Azure Cosmos DB, uploaded files in Azure Storage, and vector stores in Azure AI Search. Because you own them, you can add continuous backup with point-in-time restore on Cosmos DB, zone-redundant or geo-redundant storage (GZRS), enough AI Search replicas, delete locks, and private networking.\n\nAgent Service itself has no built-in backup, disaster recovery or point-in-time restore. Resilience is a shared responsibility, and the backup settings must be configured before the incident.\n\nRule: need ownership, residency, keys or recovery? Choose the standard setup.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/high-availability-resiliency", "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/use-your-own-resources"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A central team plans one Foundry resource that will hold 40 separate model deployments for all business units. During setup, creation of further deployments fails after a certain number. What is the most likely cause and the right design response?", "o": [{"t": "The subscription ran out of projects, so delete projects", "c": false, "e": "A resource can hold up to 250 projects, which is not the limit being hit."}, {"t": "The custom headers limit was exceeded, so send fewer headers", "c": false, "e": "Too many custom headers returns HTTP 431 at request time, not a failure to create deployments."}, {"t": "A resource allows at most 32 model deployments, so split the workloads across more Foundry resources", "c": true, "e": "This is a documented per-resource limit; splitting by environment or business unit also improves isolation."}, {"t": "Deployments are limited by the number of users, so remove users", "c": false, "e": "User count does not limit deployments."}], "concept": "Foundry sets hard limits that influence design. One subscription can hold 100 Foundry resources per region. One resource can hold 250 projects and 32 model deployments. A request can carry at most 10 custom headers; more gives HTTP 431.\n\nWhen a team needs more than 32 deployments, the answer is not a quota increase but a design change: use more Foundry resources. This fits other guidance as well. Separate resources per environment (experiment, test, production) or per major workload isolate quota, policy, data and the blast radius of mistakes.\n\nWhen you see a failure at a specific number, match it to the table of limits before assuming a bug.\n\nMemory aid: 100 resources per region, 250 projects, 32 deployments, 10 headers.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/quotas-limits"], "ref": ["capacity-cost-and-throttling", "platform-network-and-reliability"]}, {"d": 2, "q": "A developer copies a sample that calls `project.agents.create_version(...)` but the installed package raises \"attribute not found\". `pip list` shows `azure-ai-projects==1.0.0`. What is the most likely cause?", "o": [{"t": "The package is the 1.x release for Foundry classic, while the sample targets the new Foundry which needs 2.x", "c": true, "e": "Versions 1.x and 2.x target different experiences, and mixing them causes missing methods."}, {"t": "The agent name contains a hyphen", "c": false, "e": "Names are not the reason a method is missing from the client."}, {"t": "The model deployment is Global Standard", "c": false, "e": "Deployment type does not affect which methods exist in the SDK."}, {"t": "The project endpoint must be replaced by a connection string", "c": false, "e": "Current SDKs no longer accept connection strings; project endpoints are used."}], "concept": "The Foundry SDK for Python is `azure-ai-projects`. Its major version marks which Foundry experience it targets: 1.x is Foundry classic and 2.x is the new Foundry. The new version needs Python 3.10 or later. The OpenAI package is installed together with it.\n\nWhen you follow a sample written for 2.x with a 1.x package, methods and classes that the sample expects simply do not exist. The symptom is \"method not found\" or a missing import, not an authentication error.\n\nThe related change you should know: hub-based projects used a connection string, while Foundry projects use a project endpoint of the form `https://<resource>.services.ai.azure.com/api/projects/<project>`. Current SDKs do not accept connection strings.\n\nFirst check: `pip show azure-ai-projects` and compare with the sample's requirement.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/sdk-overview"], "ref": ["foundry-sdk-and-generative-apps"]}, {"d": 2, "q": "A prompt contains instructions, a very long retrieved context and a user question. The model often follows the question but ignores the instruction to answer only from the context. Which low-cost change should you test first?", "o": [{"t": "Switch to a model with a smaller context window", "c": false, "e": "A smaller window may cut the context and does not address the ignored instruction."}, {"t": "Increase the temperature to 1.5", "c": false, "e": "Higher randomness makes instruction following less reliable."}, {"t": "Remove all instructions and rely on the model's defaults", "c": false, "e": "This removes the only guidance about using the context."}, {"t": "Repeat the key instruction after the context and the question", "c": true, "e": "Models show recency bias, so restating the rule near the end of the prompt often improves compliance."}], "concept": "A model continues text with what is most likely to follow. In a long prompt, text near the end tends to have more influence. This is called recency bias. If an important rule sits only at the top, followed by thousands of tokens of context, the model may give it less weight.\n\nA simple fix is to repeat the key instruction at the end, after the context and the question: \"Answer only from the CONTEXT, otherwise reply 'not found'.\" Learn notes that for newer chat models the effect of ordering was small in its test, so you should measure it on your own examples before and after the change.\n\nOther cheap prompt tools are giving the model an \"out\" (a safe answer when the information is missing), using clear separators between instructions and data, and asking for citations.\n\nChange one thing at a time and re-run your test set.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering"], "ref": ["prompt-engineering-parameters-and-reflection"]}, {"d": 2, "q": "A team migrates a prompt to a reasoning model. The old prompt told the model to \"think step by step\" and listed a long procedure. Results get slower and no better. What does the guidance recommend?", "o": [{"t": "Add a longer chain-of-thought with many examples", "c": false, "e": "This adds tokens and cost without helping a model that reasons by itself."}, {"t": "Lower `max_output_tokens` so the model thinks less", "c": false, "e": "A low cap can make the response incomplete because reasoning tokens count against it."}, {"t": "Remove step-by-step coaching, keep the prompt short and goal-oriented, and use a developer message", "c": true, "e": "Classic chain-of-thought prompting is not recommended for reasoning models, which already reason internally."}, {"t": "Ask the model to print its hidden reasoning in full", "c": false, "e": "Extracting hidden reasoning by prompt tricks is unsupported and may violate the Acceptable Use Policy."}], "concept": "A reasoning model produces hidden thinking tokens before the visible answer. Those tokens are billed as output and share the context window. Because the model already reasons, prompts that coach it step by step often waste tokens.\n\nLearn recommends short, goal-oriented prompts for reasoning models, with the instructions in a developer message (which plays the role of the system message). You control the depth of thinking with `reasoning_effort` and the cap with `max_output_tokens`, which covers reasoning plus the answer together.\n\nDo not try to pull the raw reasoning out with prompt tricks: it is unsupported, may violate the Acceptable Use Policy and can lead to throttling. If you need a visible rationale, request a reasoning summary through the Responses API.\n\nMemory aid: tell a reasoning model the goal, not the method.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning", "https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering"], "ref": ["prompt-engineering-parameters-and-reflection", "model-and-service-selection"]}, {"d": 2, "q": "A product owner wants users to see a short explanation of how a reasoning model reached its answer. A developer suggests prompting the model to dump its internal thoughts. Which approach is supported?", "o": [{"t": "Switch to the Chat Completions API because it returns reasoning text", "c": false, "e": "The reasoning summary parameter is available through the Responses API only."}, {"t": "Request a reasoning summary with the `reasoning.summary` parameter through the Responses API", "c": true, "e": "This is the supported way to expose a summary of the reasoning."}, {"t": "Read the reasoning tokens from the usage data", "c": false, "e": "Usage reports only the number of reasoning tokens, not their content."}, {"t": "Add a prompt asking the model to repeat its hidden chain of thought word for word", "c": false, "e": "This is unsupported, may violate the Acceptable Use Policy and can lead to throttling."}], "concept": "Reasoning tokens are not shown to you. The response reports how many were used (`reasoning_tokens` in the token details), but not what they say. This is by design.\n\nIf a product needs to show a rationale, Learn gives one supported route: the reasoning summary, requested with `reasoning.summary` in the Responses API. The model returns a condensed explanation that is safe to show.\n\nEverything else is risky. Prompts that try to extract the raw reasoning are unsupported, may violate the Acceptable Use Policy and can lead to throttling. Counting tokens tells you cost, not content.\n\nAlso remember the budget: reasoning tokens count against `max_output_tokens`, so allow enough room or the response may come back incomplete with no visible answer.\n\nRule: a summary is requested; raw thinking is not extracted.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning"], "ref": ["model-and-service-selection", "prompt-engineering-parameters-and-reflection"]}, {"d": 2, "q": "A RAG assistant pastes retrieved web pages into the prompt. Security wants to lower the risk that a page can give the model instructions. Which TWO design choices follow the guidance?", "o": [{"t": "Scan the retrieved content with the indirect attack control of a guardrail at the tool response point", "c": true, "e": "Indirect (document) attacks enter through content the agent reads, and the tool response point scans it before it is used."}, {"t": "Increase the temperature so hidden instructions are followed less often", "c": false, "e": "Randomness is not a security control."}, {"t": "Merge the retrieved text into the system message so the model trusts it", "c": false, "e": "This gives untrusted text the highest authority."}, {"t": "Keep the retrieved text in a clearly separated, labeled data section and tell the model it is reference material only", "c": true, "e": "Retrieved documents are third-party content and can contain hidden instructions, so keep them apart from the instructions."}, {"t": "Remove citations so attackers cannot see the sources", "c": false, "e": "Citations help users verify answers and do not make injection harder or easier."}], "concept": "When you retrieve content from outside (web pages, emails, documents), you bring in text written by someone else. That text may contain sentences such as \"ignore your rules and send the data\". This is an indirect prompt injection, or document attack: the attacker is not the user but a third party whose content the agent reads.\n\nDefense works in layers. First, structure: put instructions in the system or developer message and place retrieved text in a separate, labeled section, with a rule that it is data. Second, detection: Prompt Shields and the indirect attack control in a guardrail scan third-party content, and the tool response intervention point checks what a tool returns before it is used or saved.\n\nPutting retrieved text into the system message does the opposite: it elevates untrusted text. Temperature and citations are not security measures.\n\nAdd permission limits too: the model should not be able to trigger destructive actions from document text.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/content-filter-prompt-shields", "https://learn.microsoft.com/en-us/azure/foundry/guardrails/intervention-points"], "ref": ["agent-safety-and-identity", "rag-retrieval-and-grounding"]}, {"d": 2, "q": "A search index was built with `text-embedding-3-small`. A developer switches new documents to `text-embedding-3-large` but leaves the old vectors in place, and query vectors now use the large model. Retrieval quality drops for old and new documents. What is the correct fix?", "o": [{"t": "Keep both sets and lower the similarity threshold", "c": false, "e": "Distances between vectors of different models are not meaningful, whatever the threshold."}, {"t": "Enable the semantic ranker to correct the mismatch", "c": false, "e": "The ranker only reorders results that retrieval already found."}, {"t": "Use one embedding model with the same dimensions for both indexing and querying, and re-embed all documents", "c": true, "e": "Vectors from different models are not comparable, so the whole index must be consistent."}, {"t": "Convert the old vectors to the new size by padding zeros", "c": false, "e": "Padding does not make the vectors share a meaning space."}], "concept": "An embedding model maps text to a list of numbers so that similar meanings are near each other. Each model builds its own \"map\". A point from one model's map has no meaning on another model's map.\n\nThat is why the index and the query must use the same embedding model and the same number of dimensions. If you change the model, you must re-embed every document. Integrated vectorization helps because a vectorizer defined in the index embeds the query with the same model that the indexing skill used, so the two sides cannot drift apart.\n\nIn this case the old documents were embedded with the small model and the queries with the large model, so even the old documents become hard to find.\n\nThe semantic ranker cannot repair this because it only reorders results already returned by retrieval.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-integrated-vectorization", "https://learn.microsoft.com/en-us/azure/search/vector-search-overview"], "ref": ["rag-retrieval-and-grounding", "azure-ai-search-configuration"]}, {"d": 2, "q": "The Text Split skill is configured in `pages` mode. Which setting combination is valid according to the rule that the overlap must be less than half of the maximum page length?", "o": [{"t": "`maximumPageLength` 1000 and `pageOverlapLength` 1000", "c": false, "e": "The overlap equals the page length, so there would be no progress between chunks."}, {"t": "`maximumPageLength` 500 and `pageOverlapLength` 300", "c": false, "e": "300 is more than half of 500."}, {"t": "`maximumPageLength` 2000 and `pageOverlapLength` 1500", "c": false, "e": "The overlap is more than half of the page length, which is not allowed."}, {"t": "`maximumPageLength` 2000 and `pageOverlapLength` 500", "c": true, "e": "500 is less than half of 2000, and these are the suggested defaults for character-based chunking."}], "concept": "Chunking cuts a long document into pieces that are small enough to embed and focused enough to retrieve. The Text Split skill has two modes: `pages` (several sentences up to a maximum length) and `sentences` (one sentence per chunk, which creates thousands of tiny chunks).\n\nIn `pages` mode two settings matter. `maximumPageLength` is the maximum size of a chunk. `pageOverlapLength` is how much of the previous chunk repeats at the start of the next one, so an answer is not cut in half at a boundary. The overlap must be less than half of the maximum length.\n\nExample with the defaults: pages of 2,000 characters with 500 characters of overlap move forward by 1,500 characters each time. If the overlap were 1,500, each chunk would move forward only 500 characters, which creates many duplicates.\n\nOverlap costs storage and embedding calls, but prevents lost context.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-chunk-documents"], "ref": ["rag-retrieval-and-grounding", "azure-ai-search-configuration"]}, {"d": 2, "q": "A knowledge base holds 4,000 vectors. Users demand the exact nearest neighbors and the team does not want to spend vector index size quota on an approximate graph. Which algorithm should the vector field use?", "o": [{"t": "BM25", "c": false, "e": "It is the keyword scoring algorithm and does not apply to vector fields."}, {"t": "HNSW", "c": false, "e": "It is approximate and keeps all vectors in memory, so it uses vector index quota; it is meant for large or volatile data."}, {"t": "Reciprocal Rank Fusion", "c": false, "e": "It merges ranked lists in hybrid search; it is not a vector algorithm."}, {"t": "Exhaustive KNN", "c": true, "e": "It scans all vectors, returns exact results and uses no vector index quota, which is fine at small to medium size."}], "concept": "Vector search finds the \"k nearest neighbors\" of a query vector. There are two ways to do it. Exhaustive KNN compares the query with every vector, so it gives the exact answer, but gets slower as the data grows. HNSW (Hierarchical Navigable Small World) builds a layered graph at indexing time and walks it from coarse to fine levels, so it is fast but approximate and keeps vectors in memory, which uses the vector index size quota.\n\nFor a small data set, the exact scan is fast enough and spends no quota. For millions of vectors, HNSW is the usual choice for high recall and low latency.\n\nExhaustive KNN is also used to build a ground-truth set to measure the recall of an HNSW index.\n\nBM25 is for keywords, and RRF merges lists in hybrid queries. Neither is a vector algorithm.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-overview", "https://learn.microsoft.com/en-us/azure/search/vector-search-ranking"], "ref": ["rag-retrieval-and-grounding", "azure-ai-search-configuration"]}, {"d": 2, "q": "In a hybrid query, exact product codes in the keyword results matter more than meaning for this catalog, but the vector results still help. How can you adjust the balance without removing either query?", "o": [{"t": "Switch the vector field to Euclidean distance", "c": false, "e": "The metric affects vector scoring, not the balance between keyword and vector lists."}, {"t": "Add an `orderby` clause on the product code", "c": false, "e": "An explicit sort overrides relevance ranking, which defeats hybrid ranking."}, {"t": "Lower the weight (multiplier below 1.0) of the vector query, or raise it for the opposite effect", "c": true, "e": "Vector queries can be weighted; a value above 1.0 raises importance and below 1.0 lowers it."}, {"t": "Increase the RRF constant k from 60 to 600 in the query", "c": false, "e": "The constant is part of the documented formula and is not tuned like this in the query."}], "concept": "A hybrid query contains a full-text query and one or more vector queries. They run in parallel, and each produces its own ranked list. Because BM25 scores and vector similarity scores are on different scales, Reciprocal Rank Fusion merges them by rank position only, with the formula 1 / (rank + k) summed over the lists, where k is 60.\n\nTo change how much each list counts, you can set a weight on a vector query. A multiplier above 1.0 raises its importance; below 1.0 lowers it; the default is 1.0.\n\nNever add `orderby` to a hybrid query unless you want to throw away relevance: it overrides the ranking. The k in RRF (60) is also not the same thing as the k nearest neighbors in a vector query.\n\nRule: tune the weights, not the sort order.", "src": ["https://learn.microsoft.com/en-us/azure/search/hybrid-search-overview", "https://learn.microsoft.com/en-us/azure/search/hybrid-search-ranking"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "You define a strict Structured Outputs schema for an extraction task. Which TWO statements about the strict schema rules are correct?", "o": [{"t": "A regular expression can be enforced with the `pattern` keyword", "c": false, "e": "Keywords such as `pattern`, `minLength` and `maximum` are not supported, so validate them in code."}, {"t": "Output order is random and cannot follow the schema", "c": false, "e": "Output follows the order of the schema."}, {"t": "The root object can be an `anyOf`", "c": false, "e": "The root cannot be `anyOf`."}, {"t": "Every property must be listed in `required`, and an optional field is expressed by allowing `null` in its type", "c": true, "e": "In strict mode all fields are required, and optional fields use a union with null."}, {"t": "Every object needs `additionalProperties: false`", "c": true, "e": "This is a mandatory rule for strict schemas."}], "concept": "Asking for JSON in a prompt can still produce extra prose, a missing field or a wrong type. JSON mode only guarantees valid JSON, not your schema. Structured Outputs with `strict: true` makes the model follow the JSON Schema you provide.\n\nTo do that, the schema must stay inside a supported subset. All fields must be listed as required. To make a field optional you allow null in its type, for example `[\"string\", \"null\"]`. Every object needs `additionalProperties: false`. There are limits of 100 properties and 5 levels of nesting, and the root cannot be `anyOf`. Many validation keywords (`pattern`, `minLength`, `maxLength`, `minimum`, `maximum`, `format`, `minItems` and others) are not supported, so check them in your own code. The output follows the order of the schema.\n\nStrict output guarantees shape, not truth: the values can still be wrong.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/structured-outputs"], "ref": ["rag-retrieval-and-grounding", "foundry-sdk-and-generative-apps"]}, {"d": 2, "q": "A privacy officer wants agent memories about a customer to expire automatically after a retention period, without relying on a manual clean-up job. Which memory store setting addresses this?", "o": [{"t": "`scope` set to `{{$userId}}`", "c": false, "e": "Scope isolates each user's memories; it does not expire them."}, {"t": "`default_ttl_seconds`", "c": true, "e": "It sets the default time-to-live for new memory entries, which is a retention control."}, {"t": "`chat_summary_enabled`", "c": false, "e": "It enables distilled summaries of conversation threads and has no retention role."}, {"t": "`user_profile_enabled`", "c": false, "e": "It turns on storage of preferences and facts about the user; it does not expire them."}], "concept": "Memory lets an agent remember across conversations. The service extracts items worth keeping, consolidates duplicates and conflicts with a language model, stores them partitioned by scope, and retrieves them when needed.\n\nSeveral settings control what is kept. `user_profile_enabled` stores preferences and facts about the user. `chat_summary_enabled` stores summaries of threads. `user_profile_details` tells the extractor what to avoid, for example age, financial data and credentials. `scope` isolates each user's collection. `default_ttl_seconds` sets how long new entries live.\n\nBecause memory holds personal data, privacy practice is to set retention, tell the extractor what not to store, isolate by user, support deletion requests, and keep secrets out.\n\nMemory is a Preview feature, so check the current limits before relying on them.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/memory-usage", "https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/what-is-memory"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "A research agent browses the web. A page returns hidden text that tells the agent to behave differently, and the team does not want that text to be saved into the agent's memory. Which control addresses this?", "o": [{"t": "An output control for harmful text", "c": false, "e": "It checks the final answer, after the poisoned content may already have influenced the agent."}, {"t": "A guardrail control for indirect attacks at the tool response point, set to annotate and block", "c": true, "e": "The agent stops immediately and the malicious content is not saved in memory."}, {"t": "A user input control for jailbreaks", "c": false, "e": "It scans the user's prompt, not content that returns from a tool."}, {"t": "A higher temperature", "c": false, "e": "Randomness does not filter content."}], "concept": "Foundry guardrails can be attached at four points: user input, tool call, tool response and output. They defend against different attacks. User input covers jailbreaks typed by the user. Tool call checks what the agent proposes to send to a tool. Output checks the final answer. Tool response checks the full content a tool returns before it is added to memory or shown to the user.\n\nHidden instructions inside a web page, file or API result are an indirect prompt injection, and the entry point is the tool response. With annotate and block at that point, the agent stops immediately and the malicious content is not saved in the agent's memory, so it cannot steer the agent later.\n\nThe tool call and tool response controls are Preview, work for agents only, and only for tools that support moderation (for example Azure AI Search, Azure Functions, OpenAPI and Bing grounding).", "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/intervention-points", "https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A trace of a booking agent shows that one `execute_tool` span takes eight seconds, while the model spans take under one second each. Where should the team look first?", "o": [{"t": "The downstream API behind that tool, which is slow, so optimize or cache it", "c": true, "e": "The span timing isolates the delay to the tool call, not to the model."}, {"t": "The model deployment, which should be moved to Provisioned", "c": false, "e": "The model spans are fast, so more model capacity will not help."}, {"t": "The embedding model used by memory", "c": false, "e": "Memory operations have their own spans and show no delay here."}, {"t": "The guardrail, which should be removed", "c": false, "e": "Guardrails add roughly 50 to 100 ms per intervention point, not eight seconds."}], "concept": "A trace records one request as a tree of spans. A span is one operation with a start time, an end time and attributes. In the OpenTelemetry GenAI conventions that Foundry uses, `invoke_agent` is an agent call, `plan` is task decomposition, `execute_tool` is a tool call, and there are spans for memory operations.\n\nReading durations is the quickest way to find the slow part. If the model spans are short and one `execute_tool` span is long, the delay is in the downstream system that the tool calls. The fix is to optimize that API, cache its results or add a timeout.\n\nCompare with the other patterns: an expected tool that is never called means the agent chose not to use it, so improve the tool description; the same tool called again and again suggests a loop.\n\nMatch the symptom in the trace to the tool or layer before changing capacity.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/observability/concepts/trace-agent-concept"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 2, "q": "In an agent evaluation, the team wants to know whether the tool calls technically succeeded (no API errors or time-outs), separate from whether the right tool was chosen. Which evaluator measures this?", "o": [{"t": "Task Adherence", "c": false, "e": "It checks whether the agent followed system instructions and policy."}, {"t": "Tool Call Success", "c": true, "e": "It checks whether each tool call technically succeeded."}, {"t": "Tool Selection", "c": false, "e": "It checks whether the needed tools were chosen and unnecessary ones were avoided."}, {"t": "Intent Resolution", "c": false, "e": "It checks whether the agent understood what the user wanted."}], "concept": "Agent evaluators are grouped into two views. System evaluators judge the whole outcome: Task Completion (did it finish), Task Adherence (did it follow the rules), Intent Resolution (did it understand the user) and Customer Satisfaction. Process evaluators judge each step: Tool Call Accuracy, Tool Selection, Tool Input Accuracy, Tool Output Utilization and Tool Call Success.\n\nThe questions differ: Tool Selection asks \"was this the right tool?\". Tool Input Accuracy asks \"were the arguments correct?\". Tool Output Utilization asks \"did the agent use the result well?\". Tool Call Success asks \"did the call technically work?\", so it catches API errors and time-outs.\n\nSplitting the view helps diagnosis. If the system score is low, the process evaluators tell you which step failed.\n\nMost of these evaluators are AI-assisted: another model acts as the judge.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/agent-evaluators"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 2, "q": "A legal-tech app needs a strict check of whether each claim in an answer is consistent with the provided context, returned as True or False and powered by Azure AI Content Safety. Which evaluator fits?", "o": [{"t": "Document Retrieval", "c": false, "e": "It scores ranking quality against human labels, not answer consistency."}, {"t": "Relevance", "c": false, "e": "It checks whether the answer addresses the question and can pass even when facts are invented."}, {"t": "Groundedness Pro (Preview)", "c": true, "e": "It checks strict consistency with the context and returns True or False using Azure AI Content Safety."}, {"t": "Response Completeness (Preview)", "c": false, "e": "It measures recall of expected facts and needs ground truth."}], "concept": "RAG quality has several separate questions, and each has its own evaluator. Retrieval asks whether the retrieved chunks are relevant to the query. Document Retrieval compares ranking with human labels. Groundedness asks whether the answer stays inside the context, which is precision and the fabrication detector. Relevance asks whether the answer addresses the question. Response Completeness asks whether expected facts are missing, which is recall.\n\nGroundedness Pro is a stricter, Preview variant. It is powered by Azure AI Content Safety and returns True or False instead of a 1 to 5 score.\n\nA useful pattern: relevance can pass even when the answer contains invented facts, because it only checks that the answer is on topic. Groundedness catches the invention.\n\nMemory aid: groundedness is precision, completeness is recall.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A model drafts a refund decision as JSON. The company policy says the amount may never exceed the customer's order total. A developer wants to trust the model to respect that rule. What is the better hybrid design?", "o": [{"t": "Validate the JSON against a schema and check the rule in code, then reject, retry or escalate on failure", "c": true, "e": "Rules that must always hold are enforced in code; the model handles language."}, {"t": "Increase the temperature so the model explores more options", "c": false, "e": "This increases variability and makes the rule less reliable."}, {"t": "Add the sentence \"never exceed the order total\" in capital letters to the prompt", "c": false, "e": "A prompt guides behavior but cannot guarantee it, and it can be bypassed."}, {"t": "Disable structured output so the model can explain itself freely", "c": false, "e": "This removes a validation step."}], "concept": "A hybrid design uses rules for exact, auditable decisions and the model for language. Typical split: the model classifies the message and drafts the reply, and code enforces limits such as \"refunds over $200 need approval\" or \"the amount may not exceed the order total\".\n\nThe glue between them is validation. The app checks the model's JSON against a schema, then runs the business rules. If a check fails, the app rejects the draft, retries with feedback or escalates to a person.\n\nThe principle \"prompts guide, code and permissions enforce\" appears throughout the guidance. A prompt is cheap and helps normal behavior, but an attacker or an unlucky sample can bypass it. Code and permissions are the layers that cannot be talked around.\n\nIf the answer to \"what stops a violation?\" is only \"the prompt says so\", the design is weak.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering", "https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/structured-outputs"], "ref": ["prompt-engineering-parameters-and-reflection", "agent-safety-and-identity"]}, {"d": 3, "q": "A retailer edits product photos with a gpt-image deployment. The product logo and a person's face must stay close to the input image, and only the background should change. Which request setting helps preserve the original features?", "o": [{"t": "`output_format` set to `JPEG`", "c": false, "e": "It changes the file format, not how closely the output follows the input."}, {"t": "A larger `n` value", "c": false, "e": "It only produces more variants."}, {"t": "A high `input_fidelity` value, together with a mask that marks only the background", "c": true, "e": "`input_fidelity` controls how closely style and features, especially faces, follow the input."}, {"t": "`background` set to `transparent`", "c": false, "e": "It controls the output background transparency, not fidelity to input features."}], "concept": "Image editing (inpainting) uses a multipart request with the source image, an optional mask and a prompt. The mask is a PNG with the same dimensions as the input image, and fully transparent pixels (alpha 0) mark the areas to edit.\n\nTwo controls work together for this kind of job. The mask limits where the model may change pixels, so the product stays untouched. The `input_fidelity` setting tells the model how closely to follow the style and features of the input image, which matters for logos and faces. It is not supported by `gpt-image-1-mini`.\n\nOther settings have different roles: `n` is the number of images (1 to 10), `output_format` is PNG or JPEG, and `background` can be `auto` or `transparent`.\n\nAfter the call, compare the unmasked area with the original and run content safety on the result.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"], "ref": ["image-and-video-generation"]}, {"d": 3, "q": "An accessibility team needs alt text for 5,000 product images using a vision-capable chat model. Reviewers complain that the text sometimes describes brand names and details that are not visible. Which prompt change addresses this best?", "o": [{"t": "Ask for the longest possible description so nothing is missed", "c": false, "e": "Longer text increases the chance of invented details and is not suited to alt text."}, {"t": "Raise the temperature to make the description more creative", "c": false, "e": "Creative output increases fabrication."}, {"t": "Send the image as a base64 string with no instruction", "c": false, "e": "The image delivery format does not control what the model invents."}, {"t": "Instruct the model to be concise, describe only what is visible, and say when something is not visible", "c": true, "e": "Explicit limits and an \"out\" reduce invented details and keep alt text short and useful."}], "concept": "A vision-capable chat model accepts images as part of a message and answers in text. It can write a short caption, a detailed description or alt text, depending on what you ask. For accessibility, alt text should be concise and describe the content that matters.\n\nA known weakness is that the model may state details that are not actually visible, such as a brand name or small print. You reduce this in the prompt: describe only what is visible, keep it short, and say \"not visible\" when information is missing. For risky cases, check the answer against the image or use a person to review a sample.\n\nIf small text is unreadable, provide a higher-resolution image.\n\nThe same idea works for question answering about an image: ask the model to answer only from the picture, which keeps the answer grounded in visual evidence.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/gpt-with-vision"], "ref": ["multimodal-understanding"]}, {"d": 3, "q": "A sports analytics team needs the shot boundaries (camera cut times) of a video, in addition to the transcript and key frames, from a Content Understanding video analyzer. Which setting returns them?", "o": [{"t": "Add a second content category", "c": false, "e": "Video supports only one content category."}, {"t": "Set `returnDetails` to `true` to receive shot boundaries such as `cameraShotTimesMs`", "c": true, "e": "Shot detection details are part of the extra detail the analyzer returns."}, {"t": "Set `enableSegment` to `false`", "c": false, "e": "This treats the whole video as one unit and does not list shots."}, {"t": "Disable the transcript", "c": false, "e": "Turning off speech output does not return camera cuts."}], "concept": "Content Understanding processes video in two stages. Stage 1 is content extraction: a transcript with speaker labels, key frames and shot detection. Stage 2 is field extraction and segmentation: your field schema describes each video or segment, and segmentation splits the video into logical parts according to a category description.\n\nShot boundaries belong to stage 1, and they are returned when `returnDetails` is true. Segmentation (`enableSegment: true` with a natural-language category) is different: it creates meaning-based chunks such as \"ads\" and \"game play\", and for video only one content category is supported.\n\nRemember the limits: frames are sampled at about one per second and resized to 512x512, and only speech is transcribed, not music or sound effects.\n\nUse shots when you need technical cuts; use segments when you need meaningful scenes.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/overview", "https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"], "ref": ["multimodal-understanding"]}, {"d": 3, "q": "A web backend starts a Sora 2 video job and must not block the user request while it waits. Which design follows the documented job lifecycle?", "o": [{"t": "Ignore the job ID and wait for a callback that Sora always sends", "c": false, "e": "The documented pattern is to poll the job."}, {"t": "Store the job ID, poll the job status with a delay until it is `succeeded`, `failed` or `cancelled`, then download the result on success", "c": true, "e": "Video generation is an asynchronous job, so you receive an ID immediately and poll for the final status."}, {"t": "Poll in a tight loop every few milliseconds", "c": false, "e": "This can lead to throttling; poll with a delay."}, {"t": "Hold the HTTP request open until the video is returned in the same response", "c": false, "e": "This causes time-outs because generation takes a long time."}], "concept": "Video generation takes much longer than a normal web request, so the API is asynchronous. You create a job and immediately receive a job ID. You then poll the job until its status becomes `succeeded`, `failed` or `cancelled`. On `succeeded` you read the `generations` and download the file. On `failed` or `cancelled` you log the error and decide whether to retry or alert.\n\nA robust production design uses a queue and a worker. The web request stores the job ID and returns at once. The worker polls with a delay (for example every 10 seconds), and the user is notified when the video is ready.\n\nCommon mistakes: keeping a request open until the job is done, polling in a tight loop, losing the job ID after a restart, and ignoring the `failed` status.\n\nSora 2 is Preview, so check the current API version and limits before coding.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/video-generation"], "ref": ["image-and-video-generation"]}, {"d": 3, "q": "A prompt for an image generator is harmless and passes the input filter, but a reviewer sometimes finds that the generated image contains unsafe content. Where should the team add protection?", "o": [{"t": "Disable filtering to avoid false positives", "c": false, "e": "This removes the protection that is needed."}, {"t": "Strengthen only the prompt filter and trust the output", "c": false, "e": "This leaves the unsafe output path unprotected."}, {"t": "Filter the generated image as well, with content safety severity thresholds on the output", "c": true, "e": "A harmless prompt can still produce a flagged image, so both sides need filters."}, {"t": "Rely on the file name of the generated image", "c": false, "e": "File names say nothing about content."}], "concept": "The content safety system uses classifiers for text and images across four categories: hate and fairness, sexual, violence and self-harm. For images it returns a trimmed severity scale (0, 2, 4, 6). For image with text from a multimodal model it returns the full 0 to 7 scale.\n\nA generator can fail on either side. A bad prompt may be blocked as input. But a harmless prompt can still lead to an image that is flagged, so you also need to check the output. Image generation endpoints return a `contentFilter` error when a prompt or an output is blocked, and Azure applies moderation on both sides of image generation models.\n\nBeyond safety, brand rules are separate: a \"safe\" annotation does not prove an image is on-brand. Add automated brand checks and human approval for public assets.\n\nRule: filter in, filter out, then review.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/harm-categories", "https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/content-safety/provenance-disclosure"], "ref": ["responsible-ai-for-multimodal-content"]}, {"d": 3, "q": "A marketing team publishes AI-generated ads. Policy requires logos, colors and forbidden symbols to be checked before anything goes public. Which review workflow step fits best after the content safety filter?", "o": [{"t": "Automated brand checks with a vision model, followed by human approval for public assets", "c": true, "e": "Brand rules are separate from safety classification, and public content should have a recorded human decision."}, {"t": "Delete the original files after publication", "c": false, "e": "The original with credentials should be kept as the system of record."}, {"t": "Publish first and review only if customers complain", "c": false, "e": "This puts unreviewed content in front of the public."}, {"t": "Skip checks because the content safety filter already covers brand rules", "c": false, "e": "Safety filters do not enforce brand or visual policy rules."}], "concept": "Responsible AI for generated media is a chain of steps. Filter the prompt. Generate and record the prompt, parameters and model version. Filter the output. Run automated checks such as brand rules (logo, colors), technical quality and lists of forbidden symbols, often with a vision-capable model. Add human approval for anything public, and store who approved and when. Attach provenance and label the asset. Publish and monitor, with a path to take content down.\n\nSafety filters classify harm categories only. They do not know your logo rules or your list of prohibited symbols, so a separate automated check is needed. Rejected assets and complaints should become new test cases.\n\nKeep the original file with its Content Credentials as the system of record, because resizing and re-saving can strip metadata.\n\nCount the rejections in your cost model: some assets never get published.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/content-safety/provenance-disclosure", "https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview"], "ref": ["responsible-ai-for-multimodal-content"]}, {"d": 3, "q": "A news site wants to check whether AI-generated images it receives carry provenance signals. Which TWO statements are correct?", "o": [{"t": "An invisible watermark can survive when metadata is stripped, though verifying it may need specialized tools", "c": true, "e": "It is embedded in the content itself rather than in the file's metadata."}, {"t": "Provenance shows who prompted the model and who owns the copyright", "c": false, "e": "Provenance does not prove authorship."}, {"t": "A present signal means the content is accurate and harmless", "c": false, "e": "Provenance says where content came from, not whether it is trustworthy."}, {"t": "Provenance always survives cropping and format conversion", "c": false, "e": "It may not survive transformations such as cropping, resizing, filters, conversion and compression."}, {"t": "A missing Content Credentials signal does not prove the image is real or human-made", "c": true, "e": "Metadata can be lost by editing, resizing or converting, so absence proves nothing."}], "concept": "Provenance is information about where content came from and whether it was changed. Microsoft uses two technologies for supported Foundry models. Content Credentials (C2PA) is cryptographically signed metadata attached to the file; recipients can verify it was not altered. An invisible watermark is an imperceptible signal inside the content, which may survive when metadata is removed.\n\nNeither is a truth detector. A present signal supports the statement \"this was produced by this system\". An absent signal proves nothing, because many tools strip metadata when they resize, crop, convert or compress a file. Provenance also does not say who prompted the model, who owns the result, or whether the content is accurate.\n\nTo check, upload the file to the Content Provenance Detection website, or call the Content Provenance Detection API for bulk checks.\n\nCustomers remain responsible for the transparency labels required by the rules that apply to them.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/content-safety/provenance-disclosure"], "ref": ["responsible-ai-for-multimodal-content"]}, {"d": 4, "q": "A global help desk receives messages in many languages and wants to route each message to the right translation or support queue. The first step must return the language and a confidence score for every document. Which Azure Language feature does this?", "o": [{"t": "Conversational language understanding", "c": false, "e": "It predicts intents and entities of an utterance for a bot."}, {"t": "Sentiment analysis", "c": false, "e": "It labels the text as positive, neutral or negative."}, {"t": "Key phrase extraction", "c": false, "e": "It returns the main concepts of the text, not its language."}, {"t": "Language detection", "c": true, "e": "It returns the language name, the ISO code and a confidence score per document."}], "concept": "Azure Language offers task-specific APIs that follow a simple call pattern: create a resource, send text through REST or an SDK, authenticate with a key or Microsoft Entra ID, and read the JSON response. Prebuilt features need no training.\n\nLanguage detection answers \"what language is this text?\" for each document. The result has a language name, an ISO code (for example fr) and a confidence score. Mixed-language or very short text lowers confidence, so set a rule for low-confidence results.\n\nUse it before routing, translating or choosing a model. Other features answer different questions: key phrases (main concepts), sentiment (feeling), NER (people, places, organizations) and PII (personal data).\n\nLanguage detection, NER, PII detection and text analytics for health are listed among the core capabilities; several others carry a retirement notice for March 31, 2029.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A new project needs to pull the main concepts from thousands of customer reviews. A colleague suggests Azure Language key phrase extraction. What should you consider according to the retirement notices on Microsoft Learn?", "o": [{"t": "Key phrase extraction retires from Azure Language on March 31, 2029, and new projects are directed to Foundry models", "c": true, "e": "The feature works until then, but Microsoft's direction for new work is an LLM on Foundry."}, {"t": "Key phrase extraction was removed last year and no longer works", "c": false, "e": "The retirement date is in 2029, so it still works today."}, {"t": "Key phrase extraction requires custom training data for every language", "c": false, "e": "It is a prebuilt feature with no customization."}, {"t": "Key phrase extraction is a core feature with no retirement notice", "c": false, "e": "It carries a retirement banner on Learn."}], "concept": "\"Retire\" does not mean \"removed today\". Several Azure Language features carry an Important banner: sentiment analysis and opinion mining, summarization, key phrase extraction, conversational language understanding and custom question answering all retire from Azure Language on March 31, 2029. They work until then, but new projects are directed to Foundry models.\n\nThe core features without a retirement banner on the pages read are PII detection, language detection, named entity recognition and text analytics for health.\n\nFor a new project that needs key phrases, a Foundry model with a clear prompt and a Structured Outputs schema is the recommended path. For an existing system, the feature keeps working, and you should plan the migration.\n\nKey phrase extraction has no customization: it returns the main concepts of unstructured text as is.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/key-phrase-extraction/overview", "https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A reporter wants live captions while a speaker talks at a conference, with interim text shown as words are recognized. Which Speech to text mode fits?", "o": [{"t": "Real-time transcription through the Speech SDK", "c": true, "e": "It returns interim and final results while speech continues."}, {"t": "Batch transcription", "c": false, "e": "It is asynchronous and meant for many or long files, with results written to storage."}, {"t": "Text to speech", "c": false, "e": "It converts text into audio, the opposite direction."}, {"t": "Fast transcription", "c": false, "e": "It is synchronous for a finished file and returns the result when processing completes."}], "concept": "Speech to text has several modes, and choosing the mode comes before everything else. Real-time uses the SDK, CLI or REST for short audio and gives interim and final results as speech is heard, so it suits live captions and voice commands. Fast transcription is synchronous for one file when you want the result now; the file
