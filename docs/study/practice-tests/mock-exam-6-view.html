must be under about 2 hours and 300 MB. Batch transcription is an asynchronous REST job for many or long files, such as call archives, with results written to storage.\n\nCustom speech does not replace these modes; it improves the accuracy of any of them for domain words, accents and noise.\n\nAsk three questions: is the audio live or recorded? Do I need the result now? How many files are there? Live means real-time; one file now means fast; many files means batch.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/overview", "https://learn.microsoft.com/en-us/azure/ai-services/speech-service/batch-transcription-create"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A developer registers a webhook for batch transcription. The service sends a validation request containing a `validationToken`, and the registration fails. What must the endpoint do?", "o": [{"t": "Return the token inside a JSON object with an error code", "c": false, "e": "The token must be returned as plain text."}, {"t": "Return the validation token as plain text in the response", "c": true, "e": "The endpoint must echo the token back so the service can confirm that it owns the URL."}, {"t": "Return an empty response with status 200", "c": false, "e": "The service needs the token echoed back to validate the endpoint."}, {"t": "Store the token and return it only after the transcription finishes", "c": false, "e": "The validation happens at registration, not at completion."}], "concept": "Batch transcription is asynchronous. You submit a job with options such as `diarizationEnabled`, `languageIdentification` (2 to 10 candidate locales), `timeToLiveHours` (6 hours to 31 days) and a destination container, then you wait. You can poll the job, or register a webhook so the service calls you when the job finishes.\n\nWhen a webhook is registered, the service first checks that you control the endpoint. It sends a validation request with a `validationToken`, and your endpoint must reply with that token as plain text. If it does not, registration fails.\n\nThe result files contain text, timestamps and speaker labels. Remember the common failures: diarization on stereo files (it needs mono), more than 10 candidate locales, results deleted after the time-to-live, and storage permissions.\n\nA webhook saves polling traffic and gives a faster reaction.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/batch-transcription-create"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A call-center team hears the base model misrecognize product names. The team has not measured anything yet and wants to avoid training costs if possible. What should they do first?", "o": [{"t": "Switch from batch to real-time transcription to fix recognition", "c": false, "e": "The mode does not change accuracy for domain terms."}, {"t": "Convert the audio to text with the Translator service", "c": false, "e": "Translator changes language; it does not transcribe audio."}, {"t": "Train a custom model immediately because every domain needs one", "c": false, "e": "The base model fits most scenarios, and training costs time and money."}, {"t": "Measure the word error rate (WER) of the base model on real audio and train a custom model only if it is high", "c": true, "e": "Measuring first shows whether training is justified."}], "concept": "The base speech model (a Universal Language Model) fits most scenarios. A custom speech model is for cases where it mishears your vocabulary or your acoustic conditions. You can provide plain and structured text for domain words, pronunciation files, and audio with human-labeled transcripts.\n\nThe workflow is: create a project, upload test data, train, inspect quality, measure with word error rate (WER) and deploy to a custom endpoint. WER is the share of words that are wrong. A high WER on your real audio suggests training; a low WER means the base model is fine.\n\nOne saving to remember: batch transcription does not need a deployed custom endpoint, so hosting cost can be avoided there. A custom model works for real-time speech to text, speech translation and batch.\n\nRule: measure first, train second.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/custom-speech-overview"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A publisher plans text to speech for a long audiobook and for short app prompts. Which TWO statements about Azure Speech text to speech are correct?", "o": [{"t": "Billing counts characters, including SSML markup except the `<speak>` and `<voice>` tags, and each Chinese character counts as two", "c": true, "e": "This is how character billing is described for text to speech."}, {"t": "The batch synthesis API is intended for audio longer than 10 minutes, such as audiobooks", "c": true, "e": "Real-time synthesis suits short interactive speech, while batch handles long content."}, {"t": "Every SSML tag works with HD voices", "c": false, "e": "Some SSML tags are not supported for HD voices, personal voices and embedded voices."}, {"t": "Visemes are available for every voice in every language", "c": false, "e": "Visemes (lip-shape events) are available for en-US neural voices only."}, {"t": "A branded custom voice can be created without any approval", "c": false, "e": "Custom voice is limited access and needs approval, consent from voice talent and disclosure to listeners."}], "concept": "Text to speech converts text into audio. Standard neural voices cover 100+ languages and locales. HD voices and Azure OpenAI voices give higher quality, but some SSML tags are not supported on them. Custom voice is limited access for responsible use: it needs approval, consent from the voice talent and a disclosure that the voice is synthetic.\n\nChoose the interface by length. Real-time synthesis through the SDK or REST suits prompts and conversations. The batch synthesis API suits audio longer than 10 minutes, for example audiobooks.\n\nBilling is by character. SSML markup counts, except the `<speak>` and `<voice>` tags, and a Chinese character counts as two. Visemes give lip-shape events for facial animation and are available for en-US neural voices only.\n\nAlways check that each SSML tag you use is supported for the chosen voice.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/text-to-speech"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A security team states that the Translator resource key must not be stored in application settings. The team uses Azure-hosted compute. Which authentication approach is preferred for enterprise use?", "o": [{"t": "Anonymous access, because the Languages operation needs no authentication", "c": false, "e": "Only the Languages operation is open; Translate needs authentication."}, {"t": "Microsoft Entra ID with a managed identity, keyless", "c": true, "e": "It removes the stored secret and supports role-based control and auditing."}, {"t": "A resource key in an environment variable", "c": false, "e": "This still stores a secret that must be rotated and can leak."}, {"t": "A bearer token created from a shared key stored in a repository", "c": false, "e": "The underlying key is still a stored secret."}], "concept": "Azure text translation is a REST API for 100+ languages. The latest GA version is 2026-06-06, and v3.0 still exists. Operations include Languages (no authentication needed), Translate and Transliterate. Translate can use standard neural machine translation (NMT) or a supported LLM deployment, which needs a Foundry resource.\n\nFor authentication, three methods exist: the resource key in the `Ocp-Apim-Subscription-Key` header, a bearer token, and Microsoft Entra ID with managed identity. Enterprises prefer Entra ID because there is no secret to store, rotate or leak, and access is controlled by roles.\n\nKeys give broad access and cannot tell you who called. This is the same reasoning used across Foundry: keyless identity first.\n\nTroubleshooting hint: 401 means a bad or missing key; 403 means valid credentials but an unsupported operation or configuration.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/overview"], "ref": ["translation"]}, {"d": 5, "q": "An indexer with a skillset runs without errors, and the debug session shows OCR text in the enriched document. Yet the index field for that text is empty. What is the most likely missing piece?", "o": [{"t": "A larger indexer schedule interval", "c": false, "e": "Timing does not decide which fields are filled."}, {"t": "An output field mapping from the enriched node to the index field", "c": true, "e": "Enriched content reaches the index only when an output field mapping copies it there."}, {"t": "A second data source for the same indexer", "c": false, "e": "One indexer uses one data source."}, {"t": "A semantic configuration on the index", "c": false, "e": "Semantic ranking does not move enrichment output into fields."}], "concept": "An indexer works in stages. Document cracking opens the file and extracts text, metadata and images. Field mappings copy source fields to index fields. The skillset (optional) builds an enriched document, a tree of intermediate results such as OCR text or chunks. Output field mappings then choose which nodes of that tree go to which index fields.\n\nThe last step is required for any enriched content. If it is missing, the skill runs, the debug session shows the result in the tree, but the index field stays empty, and there may be no error.\n\nTo check, open a debug session, find the node path (for example `/document/transcriptText`) and confirm that an output field mapping targets it. Also confirm the index field type matches.\n\nField mappings (source to index) and output field mappings (enrichment tree to index) are two different mapping sets.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-indexer-overview", "https://learn.microsoft.com/en-us/azure/search/cognitive-search-concept-intro"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A skillset runs OCR on thousands of scanned images, and the team often changes only a later skill. Each run repeats the costly OCR step for unchanged documents. Which feature reduces the cost?", "o": [{"t": "A custom Web API skill", "c": false, "e": "It adds your own logic and does not cache results."}, {"t": "A faster indexer schedule", "c": false, "e": "Running more often repeats the work more often."}, {"t": "The enrichment cache (preview), which reuses outputs of skills that did not change", "c": true, "e": "Unchanged documents are not reprocessed through earlier skills, which saves OCR cost."}, {"t": "A knowledge store", "c": false, "e": "It saves enriched output to Storage for analytics and does not skip skill execution."}], "concept": "An AI enrichment pipeline has two kinds of outputs besides the search index. A knowledge store writes the enriched data into blobs or tables in Storage so you can analyze it elsewhere, for example in Power BI. An enrichment cache (preview) stores the outputs of skills so that unchanged documents are not reprocessed when you change the skillset.\n\nOCR is one of the most expensive skills, so the cache matters when you iterate on later steps such as chunking or embedding.\n\nThe cache is a Preview feature, and it is stored in your Storage account. Remember that data stays in the chosen geography unless the cache, knowledge store or debug sessions write to Storage in another region.\n\nAfter you change the pipeline, reset the indexer before re-running so that the new definition is applied.", "src": ["https://learn.microsoft.com/en-us/azure/search/cognitive-search-concept-intro"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "Agentic retrieval is billed partly by retrieval tokens and by model tokens for query planning. The team wants to lower cost without abandoning agentic retrieval. Which actions help?", "o": [{"t": "Use a higher reasoning effort for every lookup", "c": false, "e": "This increases planning tokens and latency."}, {"t": "Add more knowledge sources so the model finds answers faster", "c": false, "e": "Each added source adds work and cost."}, {"t": "Replace the knowledge base with an indexer schedule", "c": false, "e": "An indexer does not plan queries; it only loads content."}, {"t": "Use fewer knowledge sources and a lower reasoning effort", "c": true, "e": "Fewer sources and less planning reduce the retrieval and model tokens that are billed."}], "concept": "Agentic retrieval is a multi-query pipeline for complex questions. The app calls a knowledge base with conversation history. At low or medium reasoning effort an LLM splits the question into focused subqueries; at minimal this step is skipped. The subqueries run in parallel against knowledge sources, and each is semantically reranked. The merged content is returned, with optional references and an activity log.\n\nCosts have two parts. Azure AI Search bills retrieval tokens (with a free monthly allowance and then pay-as-you-go). Azure OpenAI bills tokens for planning and answer synthesis. To lower cost, use fewer knowledge sources and a lower reasoning effort.\n\nDecision: a single, simple lookup fits classic hybrid search; multi-part or context-dependent questions fit agentic retrieval, and you accept the extra latency.\n\nVersion note: REST 2026-04-01 is GA for minimal, extractive retrieval; 2026-08-01-preview adds LLM planning and synthesis.", "src": ["https://learn.microsoft.com/en-us/azure/search/agentic-retrieval-overview"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A Content Understanding classifier is configured with content categories for \"invoice\" and \"contract\". A pile of other documents (memos, photos of whiteboards) are mislabeled as invoices or contracts. What is the correct fix?", "o": [{"t": "Raise the number of categories to 200", "c": false, "e": "More categories do not fix the forced assignment of unrelated pages."}, {"t": "Add an `other` category so unrelated pages are not forced into a listed category", "c": true, "e": "Without it, every page is assigned to one of the listed categories."}, {"t": "Switch to a video analyzer", "c": false, "e": "Video supports only one content category and is for video content."}, {"t": "Turn off OCR", "c": false, "e": "This removes text recognition and makes classification worse."}], "concept": "Content Understanding can classify and split content inside an analyze call. You define `contentCategories` with a description for each, and no training data is needed. You can use up to 200 categories, categories can name an analyzer to run extraction, and `enableSegment: true` finds several documents inside one file.\n\nA classifier must always choose something. If the only choices are \"invoice\" and \"contract\", a memo has to be one of them. The fix is to include an `other` category, which gives unrelated pages a place to land and keeps your downstream extraction clean.\n\nThis is the same design rule as a catch-all class in any classifier. After classification, you can route only the matching pages to the right extraction analyzer.\n\nCheck results with labeled samples, and look at the confidence of low-scoring pages.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/classifier", "https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "A team only needs plain text and handwriting, with words, lines and detected languages, from scanned notes. They do not need tables, selection marks or document structure. Which Document Intelligence model is the simplest fit?", "o": [{"t": "Read", "c": true, "e": "It extracts text and handwriting, words, lines and languages."}, {"t": "A custom model trained on labeled forms", "c": false, "e": "This is for fixed forms of your own and needs training."}, {"t": "Layout", "c": false, "e": "It adds tables, selection marks, paragraphs, titles and structure that this job does not need."}, {"t": "A prebuilt invoice model", "c": false, "e": "It targets invoices and their fields."}], "concept": "Document Intelligence offers a ladder of models. Read extracts text and handwriting with words, lines and languages. Layout includes Read plus tables, selection marks, paragraphs, titles and section headings, headers and footers, and offers Markdown output that suits chunking by section. Prebuilt models (invoice, receipt, ID) extract fields from known document types. Custom models are trained on labeled examples of your own forms.\n\nChoose the lowest rung that meets the need. For scanned notes with only text and handwriting, Read is enough. If someone later asks for tables or headings for RAG, move to Layout.\n\nFor mixed content such as documents, images, audio and video in one pipeline, or for reasoning across several fields, Content Understanding is the multimodal option.\n\nSimple rule: text only is Read; text plus structure is Layout; known form type is prebuilt; your own form is custom.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/overview", "https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/prebuilt/layout"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "A custom Web API skill returns a response to the indexer. Which TWO requirements must the response meet?", "o": [{"t": "Each record must carry `data`, `errors` and `warnings`, where errors and warnings may be null", "c": true, "e": "This is the documented response shape."}, {"t": "It must be JSON containing a `values` array that returns the same `recordId` values it received", "c": true, "e": "The indexer matches output to input records by `recordId`; unknown or duplicate IDs are dropped."}, {"t": "It must be sent over HTTP rather than HTTPS to avoid certificate issues", "c": false, "e": "Only HTTPS is allowed for the skill URI."}, {"t": "Output names must be generated by the indexer at random", "c": false, "e": "Output names are the ones your endpoint returns and the skill definition declares."}, {"t": "It may return plain text as long as it is under 230 seconds", "c": false, "e": "The response must be JSON; 230 seconds is the maximum timeout, not a format rule."}], "concept": "The custom Web API skill (`Microsoft.Skills.Custom.WebApiSkill`) lets an indexer call your code, for example an Azure Function that starts Speech transcription, once per batch of documents.\n\nThe request is a JSON body with a `values` array. Each item has a unique `recordId` and a `data` object whose fields are the inputs you named. Your code must reply with `application/json` and a `values` array of the same records, each with `recordId`, `data`, `errors` and `warnings` (both may be null). Records with unknown or duplicate IDs are dropped.\n\nEach declared output is written into the enrichment tree at its `targetName`, and an output field mapping then copies it to an index field.\n\nSettings to remember: only HTTPS is allowed; timeout defaults to 30 seconds with a maximum of 230; `batchSize` defaults to 1000; `degreeOfParallelism` defaults to 5.", "src": ["https://learn.microsoft.com/en-us/azure/search/cognitive-search-custom-skill-web-api"], "ref": ["azure-ai-search-configuration"]}]};</script>
