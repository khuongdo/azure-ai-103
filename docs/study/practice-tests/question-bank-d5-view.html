<script>window.MOCK_EXAM = {"id": "bank-d5", "title": "Question bank: Implement information extraction solutions", "shortTitle": "Domain 5 bank", "description": "60 questions from mock exams 1 to 10, all in the domain \"Implement information extraction solutions\" (10-15% of the exam).", "defaultMinutes": 144, "domains": [{"id": 5, "name": "Implement information extraction solutions", "weight": "10-15%", "count": 60}], "questions": [{"d": 5, "q": "A skillset runs OCR on thousands of scanned images, and the team often changes only a later skill. Each run repeats the costly OCR step for unchanged documents. Which feature reduces the cost?", "o": [{"t": "A custom Web API skill", "c": false, "e": "It adds your own logic and does not cache results."}, {"t": "A faster indexer schedule", "c": false, "e": "Running more often repeats the work more often."}, {"t": "The enrichment cache (preview), which reuses outputs of skills that did not change", "c": true, "e": "Unchanged documents are not reprocessed through earlier skills, which saves OCR cost."}, {"t": "A knowledge store", "c": false, "e": "It saves enriched output to Storage for analytics and does not skip skill execution."}], "concept": "An AI enrichment pipeline has two kinds of outputs besides the search index. A knowledge store writes the enriched data into blobs or tables in Storage so you can analyze it elsewhere, for example in Power BI. An enrichment cache (preview) stores the outputs of skills so that unchanged documents are not reprocessed when you change the skillset.\n\nOCR is one of the most expensive skills, so the cache matters when you iterate on later steps such as chunking or embedding.\n\nThe cache is a Preview feature, and it is stored in your Storage account. Remember that data stays in the chosen geography unless the cache, knowledge store or debug sessions write to Storage in another region.\n\nAfter you change the pipeline, reset the indexer before re-running so that the new definition is applied.", "src": ["https://learn.microsoft.com/en-us/azure/search/cognitive-search-concept-intro"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A security review of Azure AI Search asks which controls you must configure yourself. Which TWO are correct?", "o": [{"t": "TLS 1.2/1.3 on port 443 and 256-bit AES at rest", "c": false, "e": "These are built in and need no action."}, {"t": "Restrict network access with an IP firewall or a private endpoint", "c": true, "e": "Network access is something you configure."}, {"t": "Resource logs record which user ran each query", "c": false, "e": "Resource logs record operations and query text but not user identity."}, {"t": "Prefer Microsoft Entra ID with role-based access control over API keys, and connect indexers to data sources with a managed identity", "c": true, "e": "Keyless, role-based access is the recommended pattern."}, {"t": "Search data is used by Microsoft to train models", "c": false, "e": "Microsoft does not use your data to train models."}], "concept": "Azure AI Search security has controls that Microsoft provides by default, and controls that you configure.\n\nProvided: encrypted traffic (TLS 1.2 or 1.3 on port 443) and encryption at rest with 256-bit AES. Search content is not used by Microsoft to train models. These are not tasks for you.\n\nConfigured by you: authentication and authorization (prefer Microsoft Entra ID with role-based access control over API keys, and connect indexers to data sources with a managed identity so no connection string with a secret is needed), and network access (an IP firewall or a private endpoint). You also decide about logging: resource logs for queries are available when you enable diagnostic settings, but they do not identify users by default.\n\nSo the two correct statements are the Entra ID with managed identity and the network restriction.\n\nMemory aid: the hotel provides the lock on the door; you decide who gets the key and which corridors are open.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-security-built-in"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "An indexer pipeline with several skills runs without errors, yet the index contains unexpected content in one field. The team wants to see the intermediate results of the enriched document, node by node. Which tool should they use?", "o": [{"t": "A debug session, which shows the enriched tree of the pipeline", "c": true, "e": "It lets you inspect intermediate skill outputs and the paths they use."}, {"t": "The Azure Monitor metrics chart for token usage", "c": false, "e": "Metrics show volumes, not the enriched tree."}, {"t": "The semantic ranker", "c": false, "e": "It reorders search results and does not show pipeline internals."}, {"t": "A larger indexer schedule", "c": false, "e": "Timing does not reveal content."}], "concept": "During an indexer run, skills build an enriched document, a tree of intermediate results such as `/document/content`, OCR text, chunks, or the output of a custom skill at its `targetName`. Output field mappings then choose which nodes go into which index fields.\n\nWhen the result looks wrong but there are no errors, you need to see the tree. Debug sessions show the enriched tree and the outputs of each skill, so you can check whether a node exists, what it contains and whether an output field mapping targets it. After changing the pipeline, reset the indexer before re-running so that the new definition applies.\n\nComplement this with the indexer execution history for skill errors, and with a query against the index to confirm the final fields.\n\nDebug first at the node, then at the mapping, then at the index field.", "src": ["https://learn.microsoft.com/en-us/azure/search/cognitive-search-concept-intro", "https://learn.microsoft.com/en-us/azure/search/search-indexer-overview"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A team asks which sources a search indexer can read from without using preview features. Which list contains only data sources the guidance names as generally supported?", "o": [{"t": "Blob Storage, ADLS Gen2, Cosmos DB, Azure SQL, Table Storage and OneLake", "c": true, "e": "These are listed as supported sources; SharePoint, Azure Files and MySQL are previews."}, {"t": "A local laptop folder and a USB drive", "c": false, "e": "Indexers pull from supported Azure data sources, not from local devices."}, {"t": "Any website, scraped automatically", "c": false, "e": "A web crawler is not an indexer data source."}, {"t": "SharePoint, Azure Files and MySQL", "c": false, "e": "These are listed as previews."}], "concept": "An indexer connects four objects. The data source is the connection to the origin: Blob, ADLS Gen2, Cosmos DB, SQL, Table and OneLake are generally supported, while sources such as SharePoint, Azure Files and MySQL appear as previews. The index is the destination schema, which you create yourself. The skillset is optional enrichment. The indexer is the crawler that connects the three and runs on demand or on a schedule, as often as every five minutes.\n\nOne indexer uses one data source and writes to one index; many indexers can write to the same index.\n\nWhen a source is not supported, or you need updates faster than every five minutes, use push indexing: your code sends JSON documents to the index through the SDK or REST API.\n\nPrefer GA features for production and mark preview ones clearly.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-indexer-overview"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A custom Web API skill returns a response to the indexer. Which TWO requirements must the response meet?", "o": [{"t": "Each record must carry `data`, `errors` and `warnings`, where errors and warnings may be null", "c": true, "e": "This is the documented response shape."}, {"t": "It must be JSON containing a `values` array that returns the same `recordId` values it received", "c": true, "e": "The indexer matches output to input records by `recordId`; unknown or duplicate IDs are dropped."}, {"t": "It must be sent over HTTP rather than HTTPS to avoid certificate issues", "c": false, "e": "Only HTTPS is allowed for the skill URI."}, {"t": "Output names must be generated by the indexer at random", "c": false, "e": "Output names are the ones your endpoint returns and the skill definition declares."}, {"t": "It may return plain text as long as it is under 230 seconds", "c": false, "e": "The response must be JSON; 230 seconds is the maximum timeout, not a format rule."}], "concept": "The custom Web API skill (`Microsoft.Skills.Custom.WebApiSkill`) lets an indexer call your code, for example an Azure Function that starts Speech transcription, once per batch of documents.\n\nThe request is a JSON body with a `values` array. Each item has a unique `recordId` and a `data` object whose fields are the inputs you named. Your code must reply with `application/json` and a `values` array of the same records, each with `recordId`, `data`, `errors` and `warnings` (both may be null). Records with unknown or duplicate IDs are dropped.\n\nEach declared output is written into the enrichment tree at its `targetName`, and an output field mapping then copies it to an index field.\n\nSettings to remember: only HTTPS is allowed; timeout defaults to 30 seconds with a maximum of 230; `batchSize` defaults to 1000; `degreeOfParallelism` defaults to 5.", "src": ["https://learn.microsoft.com/en-us/azure/search/cognitive-search-custom-skill-web-api"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A team calls the GA REST version `2026-04-01` of agentic retrieval and expects the model to plan sub-queries and synthesize an answer, but only minimal, extractive retrieval happens. What explains this?", "o": [{"t": "Reasoning effort is ignored when it is `low`", "c": false, "e": "At `low` or `medium`, an LLM does query planning in the version that supports it."}, {"t": "The knowledge base must be deleted first", "c": false, "e": "Deleting is not needed to use features."}, {"t": "GA `2026-04-01` covers minimal, extractive retrieval; LLM query planning, answer synthesis and non-minimal effort need `2026-08-01-preview`", "c": true, "e": "The planning and synthesis features are in the preview version."}, {"t": "Planning is available only for videos", "c": false, "e": "Agentic retrieval is a search feature for knowledge bases."}], "concept": "Agentic retrieval is a multi-query pipeline for complex questions. The app calls a knowledge base with a retrieve action and conversation history. At low or medium reasoning effort an LLM splits the question into focused subqueries; at minimal this step is skipped. The default effort is low. The subqueries run in parallel against knowledge sources, each is semantically reranked, and the merged content is returned with optional references and an activity log.\n\nThe API version decides which features exist. REST `2026-04-01` is GA for generally available source types with minimal, extractive retrieval. `2026-08-01-preview` adds LLM query planning, answer synthesis, non-minimal effort and multi-turn messages.\n\nSo a team on the GA version sees only minimal retrieval. To use planning and synthesis, move to the preview version and accept preview risk.\n\nRemember to prefer GA features for production and to mark preview ones clearly.", "src": ["https://learn.microsoft.com/en-us/azure/search/agentic-retrieval-overview", "https://learn.microsoft.com/en-us/azure/search/agentic-retrieval-how-to-migrate"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "Your documents are HTML and Markdown pages with clear headings, and users ask questions about specific sections. Which chunking approach is the best fit?", "o": [{"t": "Chunk by section (headings), with enough overlap to keep context for specific facts", "c": true, "e": "Documents with headings suit section-based chunking, and questions about specific facts benefit from larger chunks with overlap."}, {"t": "One chunk per file", "c": false, "e": "One large chunk blurs meaning and may exceed model limits."}, {"t": "No chunking, because the semantic ranker handles long text", "c": false, "e": "The ranker trims long text to 2,048 tokens and does not replace chunking."}, {"t": "Sentence-per-chunk splitting for every document", "c": false, "e": "This creates thousands of tiny chunks that lose context."}], "concept": "Chunking strategy should follow the structure of the content. HTML and Markdown pages have headings, and each section usually covers one topic. Questions about specific sections are best answered by retrieving the matching section.\n\nChunking by headings keeps a section together, so a passage has one clear subject and a meaningful embedding. Add some overlap (or include the heading path in each chunk) so that context such as the page title or parent heading is not lost for specific facts.\n\nSentence-per-chunk is too small: a single sentence rarely carries enough context. One chunk per file is too large for long pages and mixes topics. \"No chunking\" ignores the input limit of embedding models, and the semantic ranker only reorders the top 50 results, it does not process whole long documents.\n\nTune with evaluation: compare retrieval scores for heading-based chunks of different maximum sizes.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-chunk-documents"], "ref": ["rag-retrieval-and-grounding", "azure-ai-search-configuration"]}, {"d": 5, "q": "A custom Web API skill returns responses, but the indexer drops some records. Which TWO causes fit the documented behavior?", "o": [{"t": "The response was not JSON with a `values` array containing the same records", "c": true, "e": "The skill contract requires `application/json` with `values`."}, {"t": "The enrichment tree had too many nodes", "c": false, "e": "This is not named as a cause for dropped records."}, {"t": "The `batchSize` was set to the default of 1000", "c": false, "e": "The default is valid."}, {"t": "The endpoint returned a `recordId` that was not in the request, or the same `recordId` twice", "c": true, "e": "Records with unknown or duplicate IDs are dropped."}, {"t": "The skill used HTTPS instead of HTTP", "c": false, "e": "Only HTTPS is allowed."}], "concept": "A custom Web API skill lets the indexer call your code once per batch of documents. The indexer sends JSON with a `values` array; each item has a unique `recordId` and a `data` object whose fields are the inputs you declared. Your endpoint must reply with `application/json` and a `values` array of the same records, each with `recordId`, `data`, `errors` and `warnings` (both may be null).\n\nIf a returned record has an unknown or duplicate `recordId`, the indexer drops it. If the response is not shaped like this, the whole batch can fail.\n\nSettings to remember: only HTTPS; timeout default 30 seconds, minimum 1, maximum 230; `batchSize` default 1000; `degreeOfParallelism` default 5 (range 1 to 10). The indexer retries twice on 502, 503 and 429.\n\nCheck results with the indexer execution history and a debug session; treat inputs as untrusted data from documents.", "src": ["https://learn.microsoft.com/en-us/azure/search/cognitive-search-custom-skill-web-api"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "You created an index with a field `contentVector` of type `Collection(Edm.Single)`. Documents are rejected and vector queries fail. The vector search section defines an HNSW algorithm and a profile. Which two settings on the field should you check first?", "o": [{"t": "`facetable` and `filterable`", "c": false, "e": "They control facets and filters, not vector search."}, {"t": "`retrievable` and `sortable`", "c": false, "e": "These control returning and sorting values and have no role in vector configuration."}, {"t": "`analyzer` and `synonymMaps`", "c": false, "e": "They apply to text fields, not vectors."}, {"t": "`vectorSearchProfile` referencing the profile, and `dimensions` equal to the embedding model's output size", "c": true, "e": "A vector field needs a profile on the field and the correct number of dimensions. A mismatch makes the indexer reject documents."}], "concept": "A vector field stores embeddings in an index. Two settings make it usable.\n\n`dimensions` must equal the exact output length of the embedding model, for example 1536 for text-embedding-ada-002 or the dimension you configured for text-embedding-3. If it does not match, documents are rejected. `vectorSearchProfile` links the field to a profile in the vector search section, which names the algorithm (HNSW for approximate search, or exhaustive KNN for exact search) and optionally a vectorizer that turns query text into vectors at query time.\n\nThe type `Collection(Edm.Single)` is correct for vectors, but the type alone is not enough: without a profile the field does not know how to be searched, and without matching dimensions the data does not fit.\n\n`retrievable`, `sortable`, `analyzer`, `synonymMaps`, `facetable` and `filterable` are text-field settings and do not define how vectors work.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-create-index"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A security auditor asks for a report of which end user ran which search query on an Azure AI Search service, using the built-in resource logs. What should the team know?", "o": [{"t": "Resource logs record operations and query text but not the user identity, so log the user in your application if you need it", "c": true, "e": "Search logs cannot attribute queries to end users."}, {"t": "Auditing is impossible, and queries cannot be logged", "c": false, "e": "Operations and query text are recorded."}, {"t": "Search stores a full copy of each user's profile in the logs", "c": false, "e": "This is not how logs work."}, {"t": "Resource logs identify the end user of every query automatically", "c": false, "e": "They do not contain user identity."}], "concept": "Azure AI Search has built-in protections you do not configure: TLS 1.2 or 1.3 on port 443, 256-bit AES encryption at rest, Microsoft backbone traffic and compliance certifications. Same-region Storage traffic uses private IPs, so you cannot add a storage firewall for it. Microsoft does not use your data to train models.\n\nYou configure: network access (IP firewall, private endpoint), authentication (prefer Microsoft Entra ID with role-based access control over keys), indexer connections with managed identity, document-level permissions, monitoring, optional customer-managed keys as a second encryption layer, and confidential computing in limited regions.\n\nMonitoring has a limit: resource logs record operations and query text but not the user identity. If an audit needs \"who asked what\", the calling application must log the user together with the query, with suitable privacy controls.\n\nDo not put sensitive text in object names.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-security-built-in"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A product catalog changes constantly, and search results must reflect an updated price within seconds. Indexers can run at most every five minutes. What should you do?", "o": [{"t": "Run the indexer every second", "c": false, "e": "The minimum schedule interval is five minutes."}, {"t": "Add replicas", "c": false, "e": "Replicas add query and indexing concurrency but do not change the minimum schedule."}, {"t": "Enable the semantic ranker", "c": false, "e": "It changes ranking, not freshness."}, {"t": "Push the updated documents to the index with the SDK or REST API", "c": true, "e": "Indexers pull on a schedule of five minutes at best. Pushing documents is the way to get faster updates."}], "concept": "An Azure AI Search index can be filled in two ways: pull and push.\n\nAn indexer pulls data from a source on a schedule. The shortest schedule interval is five minutes, so changes can take minutes to appear, and running it more often is not allowed. Pushing means your own code sends documents to the index through the SDK or REST API as soon as the data changes. Documents become searchable almost immediately.\n\nFor price changes that must appear within seconds, push the updated documents (for example from the system that changes the price, or from a change feed). Replicas add query capacity and availability, not freshness. The semantic ranker improves ranking, not data freshness.\n\nMany solutions combine both: an indexer for the initial load and bulk updates, and push for urgent changes.\n\nMemory aid: pull = the postman collects mail at intervals; push = you hand-deliver the letter now.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-indexer-overview"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "Legal staff delete `contract-17.pdf` from a blob container, but Azure AI Search still returns the document. The indexer runs every 10 minutes. Why, and what is the fix?", "o": [{"t": "The indexer schedule is too slow. Run it every minute", "c": false, "e": "A faster schedule does not detect deletions."}, {"t": "Enable a high water mark change detection policy", "c": false, "e": "That policy is for databases such as Azure SQL, not for blobs."}, {"t": "Enable the enrichment cache", "c": false, "e": "The cache saves skill costs and does not remove documents."}, {"t": "Blob indexers do not detect deletions. Use a soft-delete detection policy (for example a custom `IsDeleted` metadata value), run the indexer, then delete the blob", "c": true, "e": "Changed blobs are detected by their timestamp, but deleted blobs leave orphan documents unless a deletion detection policy is configured before the first run."}], "concept": "An Azure AI Search indexer is a crawler that reads a data source and updates an index. It is good at finding new and changed items, but it does not notice that something disappeared. If a blob is deleted, nothing tells the indexer, so the search document remains.\n\nChange detection and deletion detection are different policies. High water mark detects changed rows in a database by a column that only increases. For blobs, the way to remove documents is a soft-delete detection policy: add a metadata property such as `IsDeleted`, define the policy with that column name and the marker value, set the property to true on the blob first, run the indexer so it removes the search document, and only then delete the blob.\n\nRunning the indexer more often still never sees a missing blob, and the enrichment cache only saves skill work.\n\nMemory aid: the indexer reads the guest list, so you must cross a name out before you remove the guest.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-indexer-overview"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A team creates a Content Understanding analyzer through the REST API and immediately submits a file for analysis, but the call fails because the analyzer is not ready. Which sequence is correct?", "o": [{"t": "Create the analyzer with a PUT (response 201 plus an `Operation-Location` header), track that operation until it completes, connect the models, then submit the file for the asynchronous analysis and poll the result", "c": true, "e": "Creation and analysis are separate asynchronous steps."}, {"t": "Skip model connection, because analyzers run with no model", "c": false, "e": "Generated fields need connected model deployments."}, {"t": "Analyze synchronously and expect the full result in the first response", "c": false, "e": "Analysis is asynchronous; you poll the operation."}, {"t": "Submit the file first and create the analyzer afterwards", "c": false, "e": "The analyzer defines how the file is processed."}], "concept": "Using Content Understanding has five steps. Create the analyzer: a PUT to `.../contentunderstanding/analyzers/{analyzerId}?api-version=...` with the JSON definition returns 201 and an `Operation-Location` header to track creation. Connect models: map the model names used in the analyzer to deployments on the resource. Analyze: submit the file (URL or bytes); the call is asynchronous, so poll the operation. Read the result: Markdown content, structured fields and optional segments. Validate against labeled samples and use confidence for routing.\n\nCommon failures: the model deployment is not connected; a deployment name is used where a model name is required; an `extract` field without source and confidence estimation; deep nesting that hurts accuracy; and guardrails on the deployment suppressing generated values.\n\nThe GA API version is `2025-11-01`. Preview features such as agentic mode and in-page segmentation use `2026-06-01-preview`.\n\nVersion analyzers, because changing a schema forces reprocessing.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference", "https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/overview"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "A search service stores 50 million vectors, and the vector index size quota is nearly exhausted. The data is queried by approximate search. Which statement about vector algorithms and quota is correct?", "o": [{"t": "A field indexed as `exhaustiveKnn` can use HNSW at query time", "c": false, "e": "It cannot."}, {"t": "HNSW uses no memory because it reads vectors from disk on every query", "c": false, "e": "HNSW stores vectors in memory."}, {"t": "Exhaustive KNN uses more quota than HNSW", "c": false, "e": "It uses none."}, {"t": "HNSW keeps all vectors in memory and uses vector index size quota, while exhaustive KNN uses none, but it scans all vectors and suits small to medium data", "c": true, "e": "Choose the algorithm by data size, accuracy need and quota."}], "concept": "Vector indexes need memory and disk, and the algorithm decides which. HNSW (Hierarchical Navigable Small World) is the approximate algorithm: it builds a graph of vectors that is kept in memory for fast traversal. Therefore HNSW vectors count against the vector index size quota of the search service. Exhaustive KNN does not build such an index in memory; it compares the query with every stored vector, so it uses none of that quota, but each query scans everything and becomes slow as data grows. It suits small to medium collections, or the use of ground-truth checks.\n\nWith 50 million vectors and a nearly exhausted quota, the choice is not trivial: moving to exhaustive KNN would make queries too slow, so you would look at compression (quantization), fewer dimensions, a larger service tier or partitioning.\n\nA field is configured for one algorithm in its profile. A field indexed for exhaustive KNN does not become HNSW at query time, and HNSW does not read vectors from disk on every query.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-ranking"], "ref": ["rag-retrieval-and-grounding", "azure-ai-search-configuration"]}, {"d": 5, "q": "Analysts need the Markdown from scanned reports to keep titles, section headings, headers and footers, tables and selection marks, so that chunks can follow sections. Which Document Intelligence model provides this?", "o": [{"t": "A prebuilt invoice model", "c": false, "e": "It targets invoice fields."}, {"t": "Read, because it already returns the whole structure", "c": false, "e": "Read returns text, handwriting, words, lines and languages only."}, {"t": "A custom model trained on audio", "c": false, "e": "Audio is not a document input."}, {"t": "Layout, which adds tables, selection marks, paragraphs, titles and section headings, and headers and footers to Read", "c": true, "e": "It also offers Markdown output suited to RAG chunking by section."}], "concept": "Document Intelligence models form a ladder. Read extracts text and handwriting, with words, lines and languages. Layout includes Read plus tables, selection marks, paragraphs, titles and section headings, headers and footers, and the structure of the document; it can output Markdown, which suits chunking by section. Prebuilt models (invoice, receipt, ID) extract fields from fixed document types. Custom models are trained on labeled examples of your own forms.\n\nFor RAG, structure is the key. If a table is flattened, the model cannot tell which number belongs to which column. Layout Markdown keeps headings and tables, so a chunker can split by section and keep each table whole.\n\nContent Understanding `prebuilt-documentSearch` offers similar Markdown optimized for retrieval, and is multimodal. The two services are complementary: Document Intelligence for deterministic extraction from structured documents, Content Understanding for complex, unstructured and multimodal content.\n\nChoose the lowest rung that meets the need.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/prebuilt/layout", "https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/overview"], "ref": ["content-understanding-and-document-intelligence", "rag-retrieval-and-grounding"]}, {"d": 5, "q": "A Content Understanding analyzer extracts contract fields. The team wants to auto-approve values with high confidence and send uncertain ones to a reviewer, and to show where in the document each value came from. Which setting should they enable?", "o": [{"t": "`tableFormat` set to markdown", "c": false, "e": "It only changes the table output format."}, {"t": "`enableOcr` set to false", "c": false, "e": "This turns off OCR and does not add confidence."}, {"t": "`omitContent`", "c": false, "e": "It omits content from the output and does not add confidence."}, {"t": "`estimateFieldSourceAndConfidence`, which returns source location and confidence per field", "c": true, "e": "Confidence (0 to 1) and grounding allow routing between automatic approval and human review."}], "concept": "Extraction is never perfect, so a good design records how sure the system is and where each value came from.\n\nIn a Content Understanding analyzer, the setting `estimateFieldSourceAndConfidence` makes the service return, for each field, the source location (where in the document the value was found) and a confidence score. With the confidence you can build a rule: values with high confidence are auto-approved, the others go to a human reviewer. With the source location the reviewer interface can highlight the exact place in the document, which makes checking quick and builds trust.\n\nThe other settings do something else: `enableOcr` set to false would turn off text recognition for scanned pages, `tableFormat` chooses how tables are written (HTML or Markdown), and `omitContent` leaves out the content part of the result.\n\nAlso add business rule checks, because a confident value can still be wrong.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "A team analyzes only digital (not scanned) PDFs with a Content Understanding document analyzer and wants faster processing. Which configuration change helps?", "o": [{"t": "Set `returnDetails` to true", "c": false, "e": "It makes the response bigger."}, {"t": "Set `enableOcr` to false, because digital PDFs already contain text", "c": true, "e": "OCR defaults to true for scans and can be disabled for digital PDFs to go faster."}, {"t": "Turn on `enableFigureAnalysis`", "c": false, "e": "It is off by default and adds processing."}, {"t": "Set `enableLayout` to true", "c": false, "e": "It is already the default and adds structure, not speed."}], "concept": "Content Understanding document analyzers can run OCR on pages. OCR is needed for scanned documents and images, where text is only pixels. A digital PDF already contains a text layer, so reading the text directly is faster and more accurate than recognizing it from pixels.\n\nIf you process only digital PDFs, you can set `enableOcr` to false. The analyzer skips OCR work and finishes faster. If a scanned file appears later, OCR must be on, otherwise its text is not recognized.\n\n`enableLayout` adds structure detection such as tables and paragraphs; turning it on adds work, not speed. `returnDetails` returns more information, such as word-level details, and also adds output. `enableFigureAnalysis` analyzes charts and figures, which adds processing time.\n\nMemory aid: do not photocopy and re-read a typed page; read the typed text.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "With integrated vectorization, the index is built with a skillset that embeds chunks using `text-embedding-3-large`. Queries are vectorized at query time by a vectorizer attached through the vector profile. Which rule applies?", "o": [{"t": "The vectorizer must be a custom Web API vectorizer in every case", "c": false, "e": "It must match the embedding skill you use."}, {"t": "The vectorizer must use the same embedding model as the embedding skill", "c": true, "e": "Index and query vectors must come from the same model, and the vectorizer type matches the skill (for example an Azure OpenAI vectorizer for the Azure OpenAI embedding skill)."}, {"t": "The vectorizer can use any model, because vectors are normalized", "c": false, "e": "Vectors from different models are not comparable."}, {"t": "The vectorizer is not needed, because the indexer embeds queries", "c": false, "e": "The indexer handles indexing. Query-time encoding needs a vectorizer or your own query vector."}], "concept": "Integrated vectorization lets Azure AI Search create embeddings itself: a skill embeds chunks at indexing time, and a vectorizer embeds query text at query time. The vectorizer is attached to the vector field through the vector search profile.\n\nVector similarity only works inside one embedding space. The chunk vectors were made by `text-embedding-3-large`, so the query vector must be made by the same model with the same dimensions. Otherwise the numbers are not comparable and quality collapses, with no error message.\n\nThe vectorizer is needed: the indexer only runs at indexing time and does not embed queries. It does not have to be a custom Web API vectorizer; for Azure OpenAI or Foundry models there are built-in kinds.\n\nPractical rule: when you change the embedding model, change the skill, the vectorizer and the field dimensions together, and re-index.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-integrated-vectorization"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A team enabled native blob soft delete and set `NativeBlobSoftDeleteDeletionDetectionPolicy` on the data source. Documents for deleted blobs still stay in the index. Which setup mistake explains this?", "o": [{"t": "Native soft delete works only for Azure SQL Database", "c": false, "e": "It is a Blob Storage feature."}, {"t": "The high water mark policy was enabled for the blob container", "c": false, "e": "That is a change-detection policy for databases, not a blob deletion fix."}, {"t": "The soft-delete retention period is shorter than the indexer interval, or blob versioning is on, so the indexer never sees the blob in the soft-deleted state", "c": true, "e": "The indexer removes a document only if it processes the blob while it is soft deleted, and versioning must be off."}, {"t": "The semantic configuration was missing", "c": false, "e": "Semantic ranking is unrelated to deletion detection."}], "concept": "An indexer does not track deletions in a data source. A deleted blob leaves an orphan document in the index unless you configure a deletion detection policy. There are two ways. Native blob soft delete (Blob Storage only) needs soft delete enabled on the storage account, a `NativeBlobSoftDeleteDeletionDetectionPolicy` on the data source, a retention period well above the indexer interval, and blob versioning turned off. The indexer removes a document only if it processes the blob while it is in the soft-deleted state. The alternative uses custom metadata, such as an `IsDeleted` key with a `SoftDeleteColumnDeletionDetectionPolicy`.\n\nIf the retention period is shorter than the interval between indexer runs, the blob is permanently removed before the indexer can see it as deleted.\n\nSet the policy before the first run. Documents deleted earlier stay in the index even after you add the policy.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-how-to-index-azure-blob-changed-deleted", "https://learn.microsoft.com/en-us/azure/search/search-indexer-overview"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "An integrated vectorization indexer calls an Azure OpenAI embedding deployment and often hits throttling. Which TWO actions follow the guidance?", "o": [{"t": "Schedule the indexer, for example every five minutes, so that throttled documents are retried in later runs", "c": true, "e": "Built-in batching and retry are not configurable, so scheduling catches the rest."}, {"t": "Use separate embedding deployments for indexing and for querying, because token limits are per model per subscription", "c": true, "e": "This protects query traffic from indexing load."}, {"t": "Route the embedding calls through a public internet proxy to avoid limits", "c": false, "e": "A proxy does not lift service limits and weakens security."}, {"t": "Increase the semantic ranker count", "c": false, "e": "The ranker is unrelated to embedding throughput."}, {"t": "Disable the embedding skill and index text only", "c": false, "e": "This removes vector search instead of solving throttling."}], "concept": "With integrated vectorization the indexer calls an embedding model for every chunk. Azure OpenAI limits tokens per minute per model per subscription, so a large indexing run can use up the limit and also slow down the embeddings needed at query time.\n\nThe guidance has two practical steps. First, create separate embedding deployments for indexing and for querying, so that bulk indexing does not starve user queries. Second, schedule the indexer, for example every five minutes. The built-in batching and retry logic are not configurable, and documents that were throttled are picked up in a later run.\n\nRelated facts: the vectorizer at query time must use the same embedding model as the skill, and shared private link works for Azure-to-Azure traffic only (group ID `openai_account` for Azure OpenAI).\n\nAlso watch total cost: overlap and small chunks increase the number of embedding calls.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-integrated-vectorization"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A team only needs plain text and handwriting, with words, lines and detected languages, from scanned notes. They do not need tables, selection marks or document structure. Which Document Intelligence model is the simplest fit?", "o": [{"t": "Read", "c": true, "e": "It extracts text and handwriting, words, lines and languages."}, {"t": "A custom model trained on labeled forms", "c": false, "e": "This is for fixed forms of your own and needs training."}, {"t": "Layout", "c": false, "e": "It adds tables, selection marks, paragraphs, titles and structure that this job does not need."}, {"t": "A prebuilt invoice model", "c": false, "e": "It targets invoices and their fields."}], "concept": "Document Intelligence offers a ladder of models. Read extracts text and handwriting with words, lines and languages. Layout includes Read plus tables, selection marks, paragraphs, titles and section headings, headers and footers, and offers Markdown output that suits chunking by section. Prebuilt models (invoice, receipt, ID) extract fields from known document types. Custom models are trained on labeled examples of your own forms.\n\nChoose the lowest rung that meets the need. For scanned notes with only text and handwriting, Read is enough. If someone later asks for tables or headings for RAG, move to Layout.\n\nFor mixed content such as documents, images, audio and video in one pipeline, or for reasoning across several fields, Content Understanding is the multimodal option.\n\nSimple rule: text only is Read; text plus structure is Layout; known form type is prebuilt; your own form is custom.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/overview", "https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/prebuilt/layout"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "Which statement about the Azure AI Search indexer objects is correct?", "o": [{"t": "A skillset is required for every indexer", "c": false, "e": "Skillsets are optional."}, {"t": "One indexer can read several data sources and write to several indexes", "c": false, "e": "An indexer reads one data source and writes to one index."}, {"t": "The indexer creates the index schema automatically", "c": false, "e": "You create the index."}, {"t": "One indexer uses one data source and writes to one index; many indexers can write to the same index, and you create the index yourself", "c": true, "e": "The indexer connects the data source, optional skillset and index."}], "concept": "Azure AI Search has four main objects: data source, skillset, index and indexer.\n\nAn indexer is the connector that does the work. It reads from exactly one data source and writes to exactly one index. Many indexers may write into the same index, which is how you combine several sources. The indexer does not create the index schema: you define the index yourself (fields, types, analyzers, vector settings), and the indexer maps source fields into it.\n\nA skillset is optional. A simple indexer that copies text fields does not need one. You add a skillset when you need enrichment such as OCR, chunking or embeddings.\n\nSo the claim \"one indexer reads several sources and writes several indexes\" is wrong, as are \"creates the schema automatically\" and \"skillset required\".\n\nMemory aid: indexer = one pipe from one source to one index.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-indexer-overview"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A company has its own internal claim form that no prebuilt model recognizes, with the same layout every time. They can provide labeled sample forms. Which Document Intelligence option fits?", "o": [{"t": "A video analyzer", "c": false, "e": "It is for video."}, {"t": "The prebuilt invoice model", "c": false, "e": "It is designed for invoices."}, {"t": "Read only", "c": false, "e": "It returns text but not named fields."}, {"t": "A custom model trained on labeled examples of the form", "c": true, "e": "Custom models are for your own forms. Prebuilt models cover invoices, receipts and IDs."}], "concept": "Document Intelligence has prebuilt models and custom models. Prebuilt models (invoice, receipt, ID, tax forms and others) cover well-known document types. Read extracts text without fields.\n\nAn internal claim form is specific to the company, so no prebuilt model recognizes its fields. Because the layout is the same every time and labeled samples are available, a custom model is the right option. You label the fields in sample forms (in Document Intelligence Studio), train the model (a template model for a fixed layout, or a neural model for more variety), test accuracy, and call it from your application. The result is fields with confidence scores.\n\nThe prebuilt invoice model expects invoices. Read only would return text with no field names. A video analyzer is for video.\n\nMemory aid: prebuilt = ready-made suit for common sizes; custom = tailored to your form.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/document/overview"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "A team wants agentic retrieval with LLM-based query planning, answer synthesis and non-minimal reasoning effort. The GA REST version `2026-04-01` is used. What should they know?", "o": [{"t": "The GA version covers minimal, extractive retrieval; LLM query planning, answer synthesis, non-minimal effort and multi-turn messages come with `2026-08-01-preview`", "c": true, "e": "Choose the API version that matches the needed features, and remember that preview features can change."}, {"t": "GA `2026-04-01` already includes all features", "c": false, "e": "The preview version adds the advanced ones."}, {"t": "Agentic retrieval needs no language model", "c": false, "e": "Planning and synthesis use an Azure OpenAI model."}, {"t": "Query planning is always skipped", "c": false, "e": "At `low` or `medium` effort an LLM plans subqueries; `minimal` skips it."}], "concept": "Agentic retrieval in Azure AI Search is available in a GA version and in newer preview versions, and the capabilities differ.\n\nThe GA REST version `2026-04-01` covers minimal, extractive retrieval: you send a query, the knowledge base runs retrieval against the sources and returns grounding data and references, without an LLM planning step. The richer features, such as LLM query planning (decomposing a question into subqueries), answer synthesis, non-minimal reasoning effort and multi-turn messages, come with the preview version `2026-08-01-preview`.\n\nSo a team that needs LLM planning and answer synthesis must use the preview API and accept that preview features can change. The claim that GA includes everything is wrong, and an LLM is needed for planning and synthesis.\n\nDecision: if a production workload must stay on GA, use the minimal mode and do planning in your application; if you need the full feature set, plan for preview risk.", "src": ["https://learn.microsoft.com/en-us/azure/search/agentic-retrieval-overview"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "After changing the skillset (a new chunk size), the indexer finishes without errors, but old documents still show old chunks. What should you do, and which feature avoids repeating costly OCR on unchanged files?", "o": [{"t": "Delete the search service", "c": false, "e": "This is far beyond what is needed."}, {"t": "Reset the indexer before re-running, and use the enrichment cache (preview) to reuse skill outputs for unchanged documents", "c": true, "e": "A reset makes the indexer reprocess content, and the cache saves skill cost."}, {"t": "Enable the knowledge store", "c": false, "e": "It stores enrichment output for analytics and does not trigger reprocessing."}, {"t": "Increase the number of replicas", "c": false, "e": "Replicas add concurrency but do not reprocess documents."}], "concept": "Indexers track which documents they have processed, so they do not reprocess unchanged ones. When you change the skillset (for example the chunk size), the indexer does not know that old documents need new enrichment, so they keep their old chunks. Reset the indexer to clear its tracking state, and then run it again so all documents are processed with the new skillset.\n\nReprocessing everything repeats expensive skills such as OCR. The enrichment cache (preview) stores intermediate skill outputs in Azure Storage. When you rerun, the indexer reuses cached outputs for documents and skills that have not changed, and only recomputes what is affected, which saves cost and time.\n\nDeleting the search service is unnecessary. Replicas increase query capacity, not enrichment. The knowledge store saves enriched data for other uses and is not a cache for reruns.\n\nMemory aid: reset says \"forget what you did\"; cache says \"but remember the expensive answers\".", "src": ["https://learn.microsoft.com/en-us/azure/search/cognitive-search-concept-intro"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "You create a Content Understanding analyzer and set `models.completion` to the name of your deployment `chat-prod`. Analysis fails. What is the problem?", "o": [{"t": "Analyzers cannot use LLM deployments", "c": false, "e": "Content Understanding uses model deployments for generation and embedding."}, {"t": "The analyzer id contains upper-case letters", "c": false, "e": "Naming style is not the cause described here."}, {"t": "The analyzer must use the Document Intelligence Read model", "c": false, "e": "This is a different service and is not required."}, {"t": "The `models` property takes model names from the catalog, which the service maps to deployments connected at resource level; it does not take deployment names", "c": true, "e": "Analyzer definitions reference model names, and the deployments are connected on the resource."}], "concept": "In a Content Understanding analyzer, the `models` property selects which language models the analyzer uses, for example a completion model and an embedding model.\n\nThe values are model names from the catalog (for example `gpt-4.1`), not the names of your deployments. At the resource level you connect the Content Understanding resource to your Foundry deployments once. The service then maps each model name to the deployment you connected. So `chat-prod` is a name that the service does not know as a model, and the analyzer definition is invalid.\n\nHow to debug: check the model names against the supported list, check the default deployments configured on the resource, check region and quota, then retry creation.\n\nThe other answers do not apply: analyzers can use LLM deployments, the Read model is unrelated, and upper-case letters in an analyzer ID are not the issue here.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "A Content Understanding classifier for scanned loan packets uses categories that point to other classifier analyzers, to form a tree. The team asks how deep a hierarchy can be and how many categories one classifier can have. What are the documented limits?", "o": [{"t": "Unlimited levels and unlimited categories", "c": false, "e": "Limits exist."}, {"t": "Ten levels for video and 20 categories for documents", "c": false, "e": "Video is limited to two levels."}, {"t": "One level only and 5 categories", "c": false, "e": "These numbers are too low."}, {"t": "Up to five nesting levels for documents and two for video, and up to 200 categories", "c": true, "e": "These are the documented limits."}], "concept": "Content Understanding can classify and split content inside the same analyze call. You define `contentCategories`, each with a description, and `enableSegment: true` when one file contains several documents (a loan package holding an application, a pay slip and a bank statement). No training data is needed.\n\nModes: classify only (the whole file gets one category); classify and analyze (each category can name an `analyzerId`, which is linked, not copied, to run extraction); classify and segment (finds multiple documents in one file, with a page as the minimum unit; in-page segmentation is preview); and hierarchical (categories point to classifier analyzers).\n\nLimits: up to five nesting levels for documents and two for video, up to 200 categories. Video supports segmentation only, with a single content category. Include an `other` category so unrelated pages are not forced into a listed one.\n\nCheck results on labeled samples and look at confidence.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/classifier"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "A RAG index must return the whole parent document when a chunk matches, while search runs over chunks. Which feature supports this pattern?", "o": [{"t": "Index projections, which create a secondary index of chunks while the parent index holds the whole document", "c": true, "e": "Matches in chunks return the parent, which is good for chat and RAG."}, {"t": "The enrichment cache", "c": false, "e": "It reuses skill outputs."}, {"t": "Knowledge store tables", "c": false, "e": "They are for analytics outputs."}, {"t": "A synonym map", "c": false, "e": "It expands search terms."}], "concept": "In RAG you often search small chunks but want to answer with larger context. Chunks give precise matching. The whole parent document (or section) gives the model enough context to answer.\n\nIndex projections solve this in Azure AI Search. A skillset splits each parent document into chunks and projects the chunks into a secondary index as separate documents, each with a field that points to the parent. The parent index keeps one record per whole document. Search runs over the chunk index; after a hit you use the parent key to fetch the parent document or its metadata.\n\nA knowledge store writes enriched data to storage for analytics and does not serve queries. The enrichment cache avoids repeated work during reruns. A synonym map expands search terms.\n\nMemory aid: look up the chapter in the index at the back of the book, then open the whole book at that page.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-integrated-vectorization"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A blob index uses one-to-many indexing, where one blob creates many search documents. The team configures a soft-delete deletion detection policy, but deleted blobs' child documents remain. What is the documented limitation and the workaround?", "o": [{"t": "The policy does not work for one-to-many indexing; delete those documents through the index API", "c": true, "e": "Deletion detection is not supported for this indexing pattern."}, {"t": "The policy works only on Mondays", "c": false, "e": "There is no such rule."}, {"t": "The high water mark policy handles it automatically", "c": false, "e": "That policy is for database change detection."}, {"t": "The policy needs a higher indexer schedule", "c": false, "e": "Schedule does not change the limitation."}], "concept": "Indexers detect new and changed blobs automatically by comparing the last-modified timestamp, but they do not detect deletions. A deleted blob leaves an orphan document in the index unless a deletion detection policy is set: native blob soft delete, or a custom metadata key such as `IsDeleted` with a `SoftDeleteColumnDeletionDetectionPolicy`. Set the policy before the first indexer run.\n\nOne limit matters in this scenario: the policy does not work for one-to-many indexing. When one blob produces many documents (for example one per chunk through index projections), the indexer cannot map a deleted blob to its child documents, so you must delete those documents through the index API.\n\nA practical design: remove the search documents first with the API, then delete the file.\n\nA high water mark is a change-detection policy for databases like Azure SQL and Cosmos DB, not a blob deletion fix.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-how-to-index-azure-blob-changed-deleted"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "An indexer with a skillset runs without errors, and the debug session shows OCR text in the enriched document. Yet the index field for that text is empty. What is the most likely missing piece?", "o": [{"t": "A larger indexer schedule interval", "c": false, "e": "Timing does not decide which fields are filled."}, {"t": "An output field mapping from the enriched node to the index field", "c": true, "e": "Enriched content reaches the index only when an output field mapping copies it there."}, {"t": "A second data source for the same indexer", "c": false, "e": "One indexer uses one data source."}, {"t": "A semantic configuration on the index", "c": false, "e": "Semantic ranking does not move enrichment output into fields."}], "concept": "An indexer works in stages. Document cracking opens the file and extracts text, metadata and images. Field mappings copy source fields to index fields. The skillset (optional) builds an enriched document, a tree of intermediate results such as OCR text or chunks. Output field mappings then choose which nodes of that tree go to which index fields.\n\nThe last step is required for any enriched content. If it is missing, the skill runs, the debug session shows the result in the tree, but the index field stays empty, and there may be no error.\n\nTo check, open a debug session, find the node path (for example `/document/transcriptText`) and confirm that an output field mapping targets it. Also confirm the index field type matches.\n\nField mappings (source to index) and output field mappings (enrichment tree to index) are two different mapping sets.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-indexer-overview", "https://learn.microsoft.com/en-us/azure/search/cognitive-search-concept-intro"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "Which description of the Content Understanding analyzer types is correct?", "o": [{"t": "All analyzers are custom and must be created from scratch", "c": false, "e": "Prebuilt analyzers exist."}, {"t": "Domain-specific analyzers are only for video", "c": false, "e": "`prebuilt-invoice` and similar are for documents."}, {"t": "RAG analyzers return only typed JSON fields and no Markdown", "c": false, "e": "They produce Markdown and descriptions optimized for retrieval."}, {"t": "Base analyzers (such as `prebuilt-document`) are starting points, RAG analyzers (such as `prebuilt-documentSearch`) are optimized for retrieval, domain-specific analyzers (such as `prebuilt-invoice`) cover common documents, and custom analyzers extend a base with a `fieldSchema`", "c": true, "e": "The analyzer `description` is used by the model as context, so write it clearly."}], "concept": "Content Understanding organizes analyzers in layers. Base analyzers, such as `prebuilt-document`, `prebuilt-audio`, `prebuilt-video` and `prebuilt-image`, are starting points that define the content type and basic processing. RAG analyzers, such as `prebuilt-documentSearch`, are optimized for retrieval: they produce Markdown with structure, and other helpful content. Domain-specific analyzers, such as `prebuilt-invoice`, cover common document types with predefined fields. Custom analyzers are created by you, usually starting from one of these, to add your own fields and rules.\n\nThe statement that all analyzers are custom is wrong, domain-specific analyzers are not only for video, and RAG analyzers return Markdown for retrieval, not only typed JSON.\n\nLearn advises copying a prebuilt analyzer into your own custom analyzer for production, so that a change in a prebuilt definition does not change your output.\n\nMemory aid: base = blank form, RAG = readable text for search, domain = a ready-filled form for a known document, custom = your own form.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "A team needs tables, selection marks, titles and section headings from forms in addition to the text, and wants Markdown that can be chunked by section for RAG. Which Document Intelligence model fits?", "o": [{"t": "Read", "c": false, "e": "Read extracts text, handwriting, words, lines and languages, without table and structure analysis."}, {"t": "Layout", "c": true, "e": "Layout adds tables, selection marks, paragraphs, titles and headings to Read and offers Markdown output suited to chunking."}, {"t": "Prebuilt receipt", "c": false, "e": "It extracts receipt fields only."}, {"t": "Custom model without labeled data", "c": false, "e": "A custom model needs labeled examples."}], "concept": "Document Intelligence has general-purpose models and specialized ones.\n\nRead extracts text (printed and handwritten) with language information, and nothing about structure beyond lines and words. Layout goes further: it returns text, tables, selection marks (checkboxes), titles and section headings, and can output Markdown. That Markdown keeps headings and tables, so you can chunk the document by section for RAG. Prebuilt models such as receipt return specific fields for one document type. A custom model needs labeled training data.\n\nThe requirement lists tables, selection marks, headings and Markdown for chunking by section. That is the Layout model.\n\nRead would give text but lose tables and sections. Prebuilt receipt is for receipts. A custom model without labeled data is not possible.\n\nMemory aid: Read = reads the words; Layout = reads the words and understands the page.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/prebuilt/layout"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "An indexer reads rows from Azure SQL Database. After the first run, edited rows are not picked up by later runs. What should you check?", "o": [{"t": "The vector profile", "c": false, "e": "It is unrelated to row changes."}, {"t": "The number of replicas", "c": false, "e": "Replicas affect concurrency."}, {"t": "Change detection must be enabled for Azure SQL and Cosmos DB sources (for example a high water mark policy); it is automatic only for blobs", "c": true, "e": "Without it, every run rereads everything or misses changes."}, {"t": "The semantic ranker", "c": false, "e": "It does not affect indexer change detection."}], "concept": "An indexer needs to know which source records are new or changed. For Azure Blob Storage this is automatic, because blobs have a last-modified timestamp that the indexer uses.\n\nFor Azure SQL Database and Azure Cosmos DB, change detection must be enabled by you. For SQL, you use a change detection policy such as a high water mark column (a column that only increases, such as a rowversion or timestamp) or SQL integrated change tracking. Without a policy, after the first run the indexer may not know which rows changed, so edited rows are not picked up as expected.\n\nThe semantic ranker, a vector profile and replicas are query-side features and do not affect which rows the indexer reads.\n\nRemember that deletions need a separate deletion detection policy (a soft-delete column), because change detection does not find removed rows.\n\nMemory aid: the high water mark is the line where the tide reached last time.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-indexer-overview"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "An accounts-payable team processes standard supplier invoices. They need deterministic, structured output for known fields with confidence scores, and they do not need summaries or reasoning. Which tool is the best fit?", "o": [{"t": "A video analyzer", "c": false, "e": "Video analyzers are for video content."}, {"t": "Azure AI Search skillset with Text Split", "c": false, "e": "Text Split chunks text. It does not extract invoice fields."}, {"t": "Document Intelligence prebuilt invoice model", "c": true, "e": "It is built for standard invoices and gives stable structured output with confidence."}, {"t": "Content Understanding agentic mode", "c": false, "e": "It is a preview mode for evidence-based answers, with more tokens and time, which is more than the task needs."}], "concept": "Document Intelligence and Content Understanding both extract data from documents, but they have different strengths.\n\nDocument Intelligence is a deterministic, specialized service. Prebuilt models (invoice, receipt, ID document and more) are trained for specific document types. For a standard supplier invoice it returns known fields (vendor, invoice number, dates, line items, totals) with a confidence score and location for each, in a predictable shape, at a predictable cost. No prompt is needed.\n\nContent Understanding is LLM-powered and multimodal: flexible schemas, summaries, reasoning across pages, video and audio. Agentic mode adds multi-step reasoning, which is more than a standard invoice needs. A video analyzer is for video. An AI Search skillset with Text Split prepares text for retrieval and does not extract invoice fields.\n\nRule of thumb: when the document type is known and the fields are fixed, use the narrowest tool, Document Intelligence prebuilt; use Content Understanding when content varies or you need generation and reasoning.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/document/overview"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "A RAG pipeline needs clean text with headings and tables preserved from varied PDFs, as input to chunking and an LLM. Which Content Understanding choice fits?", "o": [{"t": "Plain text output with tables flattened", "c": false, "e": "Flattened tables lose which value belongs to which column."}, {"t": "A `generate` field that returns the whole document as a string", "c": false, "e": "It costs tokens and loses the layout."}, {"t": "The RAG-oriented analyzer `prebuilt-documentSearch`, using the Markdown output", "c": true, "e": "Markdown keeps headings and tables and describes figures, which makes good LLM input."}, {"t": "`prebuilt-videoSearch`", "c": false, "e": "It is the RAG analyzer for video."}], "concept": "RAG needs text that is clean, ordered and structured. A table flattened into a line of numbers, or headings lost, makes chunks meaningless.\n\nContent Understanding offers RAG-oriented prebuilt analyzers. `prebuilt-documentSearch` converts documents into Markdown that preserves headings, lists and tables, and it adds useful extras such as figure descriptions. You then chunk the Markdown by section headings and send chunks to your embedding model and index. Pointing to the Markdown output is the key: it carries the structure that chunking needs.\n\nA `generate` field that returns the whole document as a string loses structure and can paraphrase or truncate. `prebuilt-videoSearch` is for video. Plain text with flattened tables loses the meaning of rows and columns.\n\nCheck the result with a few real documents, and compare retrieval quality before and after.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/document/overview"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "A company must keep all data in the EU. Its search indexer uses a knowledge store, an enrichment cache and debug sessions, whose Storage account is currently in another region. What is the correct statement about data residency?", "o": [{"t": "Data stays in the chosen geography unless you write to Storage in another region, as the knowledge store, enrichment cache and debug sessions do; place that Storage account in the EU too", "c": true, "e": "These features write to Storage you choose."}, {"t": "Only the semantic ranker stores data outside the region", "c": false, "e": "The relevant features are knowledge store, cache and debug sessions."}, {"t": "Search always copies data to the United States for debugging", "c": false, "e": "Data stays in the chosen geography unless Storage elsewhere is used."}, {"t": "Residency cannot be affected by any setting", "c": false, "e": "Storage location for these features does matter."}], "concept": "Azure AI Search keeps data in the geography where you create the service. Several optional features write to a Storage account that you choose: the knowledge store (enriched data in blobs or tables for analytics), the enrichment cache (preview, reused skill outputs), and debug sessions (the enriched tree for inspection).\n\nIf that Storage account is in another region, data crosses the boundary. For a residency requirement, put the Storage account in the same geography (here, the EU) and check the rest of the pipeline: the Foundry resource used for skills, the embedding model deployment and the deployment type (use a regional or Data Zone type if processing location matters).\n\nAlso do not put sensitive text in object names, and prefer managed identities for connections.\n\nResidency is a property of the whole path of the data, not of one service.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-security-built-in", "https://learn.microsoft.com/en-us/azure/search/cognitive-search-concept-intro"], "ref": ["azure-ai-search-configuration", "capacity-cost-and-throttling"]}, {"d": 5, "q": "Mixed content arrives: standard invoices, audio recordings of calls and product videos. The team wants to avoid maintaining several unrelated pipelines. Which choice fits?", "o": [{"t": "Document Intelligence for everything", "c": false, "e": "It does not handle audio and video."}, {"t": "Azure Language for everything", "c": false, "e": "It works on text."}, {"t": "Content Understanding for the multimodal content (audio, video, documents) and Document Intelligence only where deterministic extraction for standard forms is needed", "c": true, "e": "The services are complementary, and Document Intelligence is for documents only."}, {"t": "Azure Translator for everything", "c": false, "e": "It translates text and documents."}], "concept": "Different modalities need different tools, but too many separate pipelines are costly to maintain. Content Understanding is a multimodal service: one framework with analyzers for documents, images, audio and video, with schema-based fields, confidence and grounding. The team can use it for the call recordings and the product videos, and for varied documents.\n\nDocument Intelligence remains a good choice where deterministic, high-accuracy extraction from standard forms is needed. Standard invoices are such a case: a prebuilt invoice model returns known fields predictably. The two services are complementary.\n\nDocument Intelligence for everything cannot analyze audio or video. Azure Language works on text and does not read documents or audio by itself. Translator translates text and documents and is unrelated to extraction.\n\nMemory aid: one workshop for mixed jobs, plus a precision machine for the one job that is always the same.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/document/overview"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "An indexer pipeline runs OCR on images in PDFs. The skillset executes without errors and the debug session shows OCR text in the enriched tree, but the index fields for that text stay empty. What is missing?", "o": [{"t": "A second indexer reading the same data source", "c": false, "e": "One indexer is enough and a second one does not map the field."}, {"t": "An output field mapping that copies the enriched node to an index field", "c": true, "e": "Output field mappings are required for any enriched content that you want in the index."}, {"t": "A larger search service tier", "c": false, "e": "Capacity is not the issue."}, {"t": "A higher `batchSize` on the OCR skill", "c": false, "e": "Batch size affects throughput, not where results are written."}], "concept": "An indexer runs a skillset on each document. The skills write their results into an enrichment tree, a temporary in-memory structure with nodes such as `/document/normalized_images/*/text`. Nothing in the tree reaches the index automatically.\n\nAn output field mapping tells the indexer which node to copy into which index field. Without it, the skill runs successfully, the debug session shows the OCR text in the tree, and the index field stays empty. That matches the symptom exactly.\n\nFix: add an output field mapping from the OCR output node (for example the merged text) to the target field, and make sure the field exists in the index and is searchable.\n\nA higher `batchSize` changes how many records a skill gets per call. A larger tier changes capacity. A second indexer on the same data source would not map the node either.\n\nMemory aid: the skill puts the dish on the kitchen counter; the output field mapping carries it to the table.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-indexer-overview"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "In a Content Understanding custom analyzer you define three fields: the invoice number exactly as printed, a category chosen from a fixed list, and a two-sentence summary. Which TWO method assignments are correct?", "o": [{"t": "Summary: `classify`", "c": false, "e": "Classification selects from a fixed list. A summary is free text."}, {"t": "Invoice number: `generate`", "c": false, "e": "Generation can reinterpret or invent values. Use `extract` for values that exist in the file."}, {"t": "Category from a fixed list: `classify` with an `enum`", "c": true, "e": "`classify` picks one of the allowed values."}, {"t": "Category: `extract`", "c": false, "e": "Extract copies a value from the content and does not choose among categories."}, {"t": "Invoice number: `extract`; summary: `generate`", "c": true, "e": "`extract` returns the value as it appears in the content and `generate` creates free text such as a summary."}], "concept": "A Content Understanding analyzer defines what to extract. Each field in its schema has a method, which tells the service how to get the value.\n\n`extract` copies a value as it appears in the content, with its source location and confidence. Use it for the invoice number printed on the page. `classify` chooses one value from a fixed list that you define with an `enum`. Use it for a category. `generate` writes new text from the content, such as a short summary or description.\n\nSo the correct pairs are: invoice number is `extract`, category is `classify` with an enum, summary is `generate`. Using `generate` for the invoice number risks the model rewriting or hallucinating it; using `extract` for a category cannot work because the category is not written in the document; `classify` cannot produce free text.\n\nMemory aid: extract = copy, classify = pick from a menu, generate = write.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "A Content Understanding analyzer extracts \"ShipDate\" from shipping documents, but the model often returns the invoice date. The team wants to steer the extraction without changing code. Which setting does this?", "o": [{"t": "Write a precise `description` for the field, because it acts as a mini-prompt", "c": true, "e": "Field descriptions guide the model about what to extract."}, {"t": "Rename the analyzer", "c": false, "e": "The name does not influence extraction."}, {"t": "Set `enableBarcode` to false", "c": false, "e": "Barcode detection is unrelated to this field."}, {"t": "Increase the document `tableFormat` to markdown", "c": false, "e": "Table format changes output formatting, not which date is chosen."}], "concept": "A Content Understanding analyzer is a reusable configuration with an `analyzerId`, a `name`, a `description` (used by the model as context, so write it clearly), a base analyzer, `models`, `config` and a `fieldSchema`.\n\nThe `fieldSchema` lists fields with a type (`string`, `number`, `boolean`, `date`, `object`, `array`), a `description` that acts like a mini-prompt, and a `method`: `extract` (the value as it appears in the content), `classify` (pick from a fixed enum) or `generate` (free generation). Dates and numbers are normalized automatically.\n\nSo a vague description such as \"date\" invites the wrong date. A precise one such as \"The date the goods are shipped, not the invoice date; usually near the carrier name\" steers the extraction.\n\nAvoid nesting deeper than two or three levels, and use confidence and grounding (`estimateFieldSourceAndConfidence`) to route low-confidence values to review.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "A search indexer must turn complex PDFs with tables and headings into clean Markdown and chunks inside the skillset, instead of using a separate preprocessing job. Which skillset building block fits?", "o": [{"t": "A knowledge store", "c": false, "e": "It stores enriched output but does not extract."}, {"t": "The Text Split skill alone, with no extraction step", "c": false, "e": "It chunks text but does not read tables from PDFs."}, {"t": "The Content Understanding skill (or a Layout-based skill), which produces structured Markdown for chunking inside the pipeline", "c": true, "e": "It keeps extraction inside the indexer and preserves tables and headings."}, {"t": "The Translation skill", "c": false, "e": "It translates text and does not parse layout."}], "concept": "A good RAG answer starts with good text. Flattening a table into a run of text destroys the relation between a row and its header. Layout analysis and Content Understanding keep tables, sections and hierarchy, and output Markdown that keeps headings and tables, which is ideal for chunking by section.\n\nIn an Azure AI Search skillset, the Content Understanding skill (or a Document Intelligence Layout-based approach) can produce this Markdown inside the indexer pipeline. Then the Text Split skill chunks it, an embedding skill creates vectors, and output field mappings or index projections write them to the index. The skill is part of the built-in set that uses Foundry Tools.\n\nChoose by need: layout-aware Markdown for RAG (Document Intelligence Layout or `prebuilt-documentSearch`), typed fields for automation (Content Understanding fields or prebuilt models), mixed media (Content Understanding).\n\nCheck the result by reading the extracted text of a few real files.", "src": ["https://learn.microsoft.com/en-us/azure/search/cognitive-search-concept-intro", "https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/document/overview"], "ref": ["azure-ai-search-configuration", "content-understanding-and-document-intelligence"]}, {"d": 5, "q": "An indexer must read from a storage account in the same region as the search service, and the security team wants a storage firewall for the connection. Another indexer needs to call an Azure OpenAI embedding deployment over a private path. What should you know?", "o": [{"t": "Shared private link needs no group ID", "c": false, "e": "A group ID such as `openai_account` or `sites` is required."}, {"t": "Shared private link works for any internet address", "c": false, "e": "It works for Azure-to-Azure only."}, {"t": "Same-region storage traffic uses private IPs, so you cannot add a storage firewall for it; for Azure-to-Azure private access use a shared private link (for example `openai_account` for Azure OpenAI)", "c": true, "e": "Shared private link works for Azure-to-Azure only."}, {"t": "Same-region storage traffic always crosses the public internet", "c": false, "e": "It uses private IPs."}], "concept": "Search indexers often cross network boundaries, and Azure AI Search has rules for private connections.\n\nTraffic between a search service and a storage account in the same region uses private IP addresses on the Azure backbone. Because of that, a storage firewall rule cannot be used for that connection, as it cannot match the source. Cross-region traffic uses public addresses and can be controlled with IP rules.\n\nFor private access from the search service to other Azure services, such as an Azure OpenAI embedding deployment, you create a shared private link. It is a private endpoint managed by the search service for an outbound connection. You specify the
