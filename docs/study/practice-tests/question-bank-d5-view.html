target resource and a group ID that identifies the service type (for example `openai_account` for Azure OpenAI). A shared private link works for supported Azure resources, not for any internet address, and it always needs a group ID.\n\nAfter creating it, the resource owner must approve the private endpoint connection request.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-security-built-in"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A team stores values with an `extract` field method in a Content Understanding schema. Extraction fails validation. Which requirement applies to `extract` fields?", "o": [{"t": "They choose a value from a fixed list", "c": false, "e": "That is `classify`."}, {"t": "They need source and confidence estimation (`estimateFieldSourceAndConfidence`), and they apply to documents", "c": true, "e": "`extract` returns the value as written in the content and relies on source and confidence information."}, {"t": "They work only for audio", "c": false, "e": "They are for documents."}, {"t": "They can be used for free-form summaries", "c": false, "e": "Summaries use `generate`."}], "concept": "Content Understanding fields have a method: `extract`, `classify` or `generate`. Each has requirements.\n\n`extract` copies a value from the content, so it must be able to point to the place where the value appears and say how sure it is. For that, the analyzer needs source and confidence estimation (`estimateFieldSourceAndConfidence`). Also, `extract` applies to documents, where text positions exist.\n\nFree-form summaries are `generate` fields. Choosing a value from a fixed list is `classify` with an enum. The claim that `extract` works only for audio is wrong.\n\nIf validation fails for an `extract` field, check that the estimation setting is enabled and that the content type is a document. If the value is not literally in the content, change the method to `generate` (for a derived value) or `classify` (for a category).\n\nMemory aid: extract = copy and point to where you found it.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "Analysts want to use the enriched output of an indexer pipeline (extracted entities, OCR text) in Power BI, outside of search queries. Which skillset output serves this?", "o": [{"t": "A vectorizer", "c": false, "e": "It encodes queries at query time."}, {"t": "A knowledge store, which writes enriched content to blobs or tables in Azure Storage", "c": true, "e": "It is the optional output for analytics and Power BI."}, {"t": "The enrichment cache", "c": false, "e": "It exists to reuse skill outputs, not for reporting."}, {"t": "The search index only", "c": false, "e": "The index is for search queries and is required, but it is not the analytics output."}], "concept": "An Azure AI Search index is optimized for search queries. Sometimes you also need the enriched data for other uses, such as analysis in Power BI, data science or another pipeline.\n\nA knowledge store is an output of a skillset. It writes the enriched content, such as extracted entities, key phrases, OCR text and normalized images, to Azure Storage as blobs (JSON or images) or tables. From there, tools like Power BI or Azure Data Factory can read it. You define projections in the skillset to shape the output.\n\nThe index serves queries, not analysis. The enrichment cache stores intermediate results to speed up reruns and is not meant as an analytics source. A vectorizer converts query text into a vector.\n\nMemory aid: the index is the shop window for search; the knowledge store is the warehouse for everything else.", "src": ["https://learn.microsoft.com/en-us/azure/search/cognitive-search-concept-intro"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "An indexer must run the OCR skill on images embedded in PDFs. Which TWO statements about the configuration are correct?", "o": [{"t": "Set `imageAction` to `generateNormalizedImages` so that the skill receives `/document/normalized_images/*`", "c": true, "e": "Document cracking must hand the images to the skill."}, {"t": "The skill is bound to Foundry Tools and needs a billable resource beyond 20 documents per indexer per day", "c": true, "e": "Larger workloads require a billable resource."}, {"t": "OCR output is merged into the document content automatically without any skill", "c": false, "e": "A Merge skill puts OCR text back into the content at the right position."}, {"t": "The OCR skill returns audio transcripts for MP3 files", "c": false, "e": "There is no built-in audio-to-text skill."}, {"t": "The skill needs no extra setting and reads images even when `imageAction` is off", "c": false, "e": "Image extraction must be enabled in the indexer."}], "concept": "A scanned PDF has no text layer, so text must be read from page images. In an Azure AI Search skillset the OCR skill (`#Microsoft.Skills.Vision.OcrSkill`) reads printed and handwritten text from `.jpeg`, `.jpg`, `.png`, `.bmp` and `.tiff` files and from images embedded in PDFs or Office files.\n\nTo make it work, the indexer needs `imageAction: generateNormalizedImages` so document cracking passes images to the skill as `/document/normalized_images/*`. The skill outputs `text` and `layoutText` (lines, words and bounding boxes). Use a Merge skill to place OCR text back into the document text at the right position. Optional parameters are `defaultLanguageCode` and `lineEnding`; `detectOrientation` applies only to the legacy OCR v3.2 path.\n\nThe skill is bound to Foundry Tools and needs a billable resource beyond 20 documents per indexer per day.\n\nThere is no built-in skill for audio; use a custom Web API skill that calls a speech service.", "src": ["https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-ocr", "https://learn.microsoft.com/en-us/azure/search/cognitive-search-concept-intro"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A custom Web API skill calls an Azure Function that is protected with Microsoft Entra ID. The team wants the search service to authenticate with its managed identity instead of a function key. Which skill setting does this?", "o": [{"t": "`batchSize` set to 1000", "c": false, "e": "It sets records per call."}, {"t": "`timeout` set to `PT230S`", "c": false, "e": "It sets the time limit."}, {"t": "`authResourceId`, the application ID URI of the function's Entra app registration", "c": true, "e": "It lets the search service's managed identity authenticate to the protected function."}, {"t": "`httpMethod` set to `PUT`", "c": false, "e": "It chooses the method only."}], "concept": "The custom Web API skill (`Microsoft.Skills.Custom.WebApiSkill`) has these settings. `uri` is the HTTPS endpoint (only HTTPS is allowed). `httpMethod` is POST or PUT. `inputs` name the values taken from the enrichment tree. `outputs` name what your endpoint returns, written to the tree under `targetName`. `timeout` is an ISO 8601 duration, default 30 seconds, maximum 230. `batchSize` defaults to 1000. `degreeOfParallelism` defaults to 5 (range 1 to 10). `authResourceId` is optional: the application ID URI so the search service's managed identity authenticates to a function protected by Microsoft Entra ID.\n\nThis follows the keyless principle: a function key in `?code=` works but is a stored secret; the service redacts it when you read the skillset.\n\nShared private link can connect Search to custom skills on App Service or Functions in a private design, using the group ID `sites`.\n\nAlways treat inputs from documents as untrusted data.", "src": ["https://learn.microsoft.com/en-us/azure/search/cognitive-search-custom-skill-web-api"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A team plans a skillset for a document library with OCR on images, language detection, chunking and embeddings. Finance asks which of these built-in steps does not need a billable Foundry resource. Which one is free?", "o": [{"t": "The Azure OpenAI embedding skill", "c": false, "e": "Embeddings are billed as model tokens on your deployment."}, {"t": "The OCR skill", "c": false, "e": "It is bound to Foundry Tools and needs a billable resource beyond 20 documents per indexer per day."}, {"t": "The language detection skill", "c": false, "e": "It uses Foundry Tools and is billed beyond the free allowance."}, {"t": "The Text Split skill, which chunks text", "c": true, "e": "Chunking with Text Split is free, while skills that use Foundry Tools need a billable resource for larger workloads."}], "concept": "Skills come in two kinds. Built-in skills use Foundry Tools: OCR, image analysis, language detection, translation, entity recognition, key phrases, PII detection and sentiment, plus the Azure OpenAI embedding skill, Azure Vision multimodal embeddings (preview) and the Content Understanding skill. Larger workloads need a billable Foundry resource attached to the skillset. Custom skills are your own code behind a web API.\n\nThe Text Split skill is the exception in cost terms: chunking is free, because it is processed inside the search service without calling a model. It has two modes, `pages` and `sentences`, with suggested defaults of 2000 characters and 500 overlap.\n\nCosts to plan: OCR beyond 20 documents per indexer per day, enrichment skills on every document, embedding tokens for every chunk (overlap increases the number of chunks), and Azure AI Search itself.\n\nThe enrichment cache (preview) can reduce repeated skill costs when you change later steps.", "src": ["https://learn.microsoft.com/en-us/azure/search/cognitive-search-concept-intro", "https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-chunk-documents"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "You configure the Text Split skill in `pages` mode for character-based chunking with `maximumPageLength` of 2000 and a page overlap. Which overlap value is valid, given that the overlap must be less than half the maximum length?", "o": [{"t": "`pageOverlapLength` of 500", "c": true, "e": "500 is less than 1,000 (half of 2,000), and it is the suggested default."}, {"t": "`pageOverlapLength` of 1000", "c": false, "e": "The overlap must be less than half the maximum length."}, {"t": "`pageOverlapLength` of 2000", "c": false, "e": "It equals the page length."}, {"t": "`pageOverlapLength` of 1500", "c": false, "e": "It is more than half."}], "concept": "The Text Split skill in `pages` mode divides text into chunks. `maximumPageLength` sets the size of a chunk; `pageOverlapLength` sets how much text is repeated between consecutive chunks. The rule is that the overlap must be less than half of the maximum length.\n\nWith `maximumPageLength` of 2000, half is 1000, so the overlap must be below 1000. 500 is valid. 1000 is not less than half (it is exactly half), 1500 and 2000 are larger.\n\nWhy a limit exists: with too much overlap, each new chunk would add very little new text, and the number of chunks, embedding calls and index size would grow a lot for no benefit.\n\nPractical values: an overlap of 10 to 25% of the chunk size is typical. For 2000 characters, 500 is 25%. Remember that character-based chunking differs from token-based chunking, where Microsoft's starting point is 512 tokens with 128 tokens of overlap.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-chunk-documents"], "ref": ["azure-ai-search-configuration", "rag-retrieval-and-grounding"]}, {"d": 5, "q": "Agentic retrieval is billed partly by retrieval tokens and by model tokens for query planning. The team wants to lower cost without abandoning agentic retrieval. Which actions help?", "o": [{"t": "Use a higher reasoning effort for every lookup", "c": false, "e": "This increases planning tokens and latency."}, {"t": "Add more knowledge sources so the model finds answers faster", "c": false, "e": "Each added source adds work and cost."}, {"t": "Replace the knowledge base with an indexer schedule", "c": false, "e": "An indexer does not plan queries; it only loads content."}, {"t": "Use fewer knowledge sources and a lower reasoning effort", "c": true, "e": "Fewer sources and less planning reduce the retrieval and model tokens that are billed."}], "concept": "Agentic retrieval is a multi-query pipeline for complex questions. The app calls a knowledge base with conversation history. At low or medium reasoning effort an LLM splits the question into focused subqueries; at minimal this step is skipped. The subqueries run in parallel against knowledge sources, and each is semantically reranked. The merged content is returned, with optional references and an activity log.\n\nCosts have two parts. Azure AI Search bills retrieval tokens (with a free monthly allowance and then pay-as-you-go). Azure OpenAI bills tokens for planning and answer synthesis. To lower cost, use fewer knowledge sources and a lower reasoning effort.\n\nDecision: a single, simple lookup fits classic hybrid search; multi-part or context-dependent questions fit agentic retrieval, and you accept the extra latency.\n\nVersion note: REST 2026-04-01 is GA for minimal, extractive retrieval; 2026-08-01-preview adds LLM planning and synthesis.", "src": ["https://learn.microsoft.com/en-us/azure/search/agentic-retrieval-overview"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A security team asks whether customer-managed keys on Azure AI Search replace the service's built-in encryption. What is the correct statement?", "o": [{"t": "CMK is only needed to enable TLS", "c": false, "e": "TLS 1.2 and 1.3 on port 443 are built in."}, {"t": "Search does not encrypt data at rest unless you configure CMK", "c": false, "e": "It does encrypt by default."}, {"t": "Customer-managed keys replace built-in encryption, which is otherwise off", "c": false, "e": "Built-in encryption is always applied."}, {"t": "Customer-managed keys add a second encryption layer on top of the built-in 256-bit AES encryption at rest, which is always on", "c": true, "e": "CMK is optional and extra."}], "concept": "Azure AI Search applies some protections automatically: TLS 1.2 or 1.3 on port 443, 256-bit AES encryption at rest, Microsoft backbone traffic and compliance certifications. Microsoft does not use your data to train models. You do not configure these.\n\nWhat you do configure: network access (IP firewall, private endpoint); authentication (prefer Microsoft Entra ID with role-based access control over keys); indexer connections with managed identity; document-level permissions; monitoring; optional customer-managed keys as a second layer of encryption; and confidential computing (limited regions, higher cost).\n\nResource logs record operations and query text but not the user identity. Data stays in the chosen geography unless you write to Storage in another region (knowledge store, enrichment cache, debug sessions). Do not put sensitive text in object names.\n\nFor regulated workloads, combine CMK with private endpoints, managed identity and policy.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-security-built-in"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "An indexer must process scanned PDFs and MP3 recordings. Compliance requires that all processing stays inside the indexer pipeline. Which skillset design fits?", "o": [{"t": "Text Split skill only", "c": false, "e": "It chunks existing text. It cannot read images or audio."}, {"t": "Transcribe the audio outside the pipeline and load only the text", "c": false, "e": "This breaks the requirement that all processing stays in the indexer."}, {"t": "The built-in Translation skill for the MP3 files", "c": false, "e": "The Translation skill takes text, not audio."}, {"t": "The OCR skill for scanned pages with `imageAction` set to `generateNormalizedImages`, and a custom Web API skill that calls Azure Speech for the audio", "c": true, "e": "OCR reads scanned images, and no built-in skill turns audio into text, so a custom skill wraps the speech call."}], "concept": "A skillset is a pipeline of enrichment steps that an indexer runs while it processes each document. The steps write their results into an in-memory enrichment tree.\n\nFor scanned PDFs, the OCR skill reads text from images. The indexer must generate page images, which you control with `imageAction: generateNormalizedImages`. For audio, there is no built-in skill that turns MP3 into text. To keep everything inside the indexer, add a custom Web API skill: it sends the audio reference to an endpoint (for example a function that calls Azure Speech) and returns the transcript, which you map to a node and then to an index field.\n\nThe Translation skill takes text, not audio. Transcribing outside the pipeline breaks the compliance rule. A Text Split skill only chunks text that already exists.\n\nHow it relates: built-in skills for what Microsoft provides, custom Web API skills for the rest, all inside one repeatable pipeline.", "src": ["https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-ocr", "https://learn.microsoft.com/en-us/azure/search/cognitive-search-custom-skill-web-api"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A custom Web API skill calls an Azure Function that sometimes needs 4 minutes to respond. Records are dropped and the skill times out. Which statement is correct?", "o": [{"t": "Increase `degreeOfParallelism` to 10 to shorten each call", "c": false, "e": "Parallelism runs more calls at once. It does not shorten one call."}, {"t": "Set `timeout` to `PT10M`", "c": false, "e": "The maximum is 230 seconds."}, {"t": "Return the records in any order and omit `recordId`", "c": false, "e": "Each returned record needs its `recordId`, or it is dropped."}, {"t": "The skill `timeout` has a maximum of 230 seconds, so work that takes longer needs a different design (for example transcribe in advance and let the skill read the result)", "c": true, "e": "The default is 30 seconds and the maximum is 230 seconds."}], "concept": "A custom Web API skill lets an indexer call your own HTTP endpoint for each batch of records. The call is synchronous: the indexer waits for the answer. Therefore the skill has a timeout, and the maximum is 230 seconds.\n\nA function that sometimes needs 4 minutes (240 seconds) exceeds the maximum. The records fail or are dropped. Setting `timeout` to `PT10M` is not possible. Raising `degreeOfParallelism` increases the number of concurrent calls, not the speed of each call. Each request and response must contain the `recordId` so the results can be matched, so omitting it is an error.\n\nA better design avoids long synchronous work: do the slow processing in advance (for example transcribe audio in a separate pipeline) and let the skill only read the result. Or queue the work and index the result when ready.\n\nRule: skills are for quick transformations; long jobs belong in asynchronous steps.", "src": ["https://learn.microsoft.com/en-us/azure/search/cognitive-search-custom-skill-web-api"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A lender receives one PDF containing a loan application, a pay slip and a bank statement. You want Content Understanding to find each document inside the file and route it to a different analyzer. Which configuration fits?", "o": [{"t": "`contentCategories` with `enableSegment: true`, an `analyzerId` per category and an `other` category for pages that match none", "c": true, "e": "Classify and segment finds multiple documents in one file. Without `other`, every page is forced into a listed category."}, {"t": "A video analyzer with one content category", "c": false, "e": "Video segmentation supports a single category and is for video."}, {"t": "Document Intelligence Read model only", "c": false, "e": "Read returns text and handwriting and does not classify or split."}, {"t": "A single `extract` field named `documentType`", "c": false, "e": "One field cannot split the file or route pages to analyzers."}], "concept": "A single PDF can contain several different documents. To extract the right fields from each, the pipeline must first split the file and classify each part, then send each part to a suitable analyzer.\n\nIn Content Understanding this is configured on one analyzer. `enableSegment: true` turns on segmentation, which splits the file into page ranges. `contentCategories` lists the categories (loan application, pay slip, bank statement), each with a description and an `analyzerId` pointing to the analyzer that extracts fields for that category. Add an `other` category for pages that match none, otherwise every page is forced into a listed category. A classifier supports up to 200 categories.\n\nA video analyzer is the wrong modality. A single `extract` field named `documentType` classifies the whole file at best and cannot split it. The Read model returns text only.\n\nWalkthrough: pages 1-2 become a loan application and use the loan analyzer; page 3 becomes a pay slip; the rest becomes a bank statement.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/classifier"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "A team must run Content Understanding in production using only generally available features. Which choice is correct?", "o": [{"t": "Use the GA API version `2025-11-01` and avoid features that need `2026-06-01-preview`, such as agentic mode and in-page segmentation", "c": true, "e": "GA is preferred for production."}, {"t": "Use `2026-06-01-preview` for everything because it is newer", "c": false, "e": "Preview features can change."}, {"t": "No Content Understanding version is GA", "c": false, "e": "The page lists a GA version."}, {"t": "Agentic mode is GA and available in every version", "c": false, "e": "It is preview."}], "concept": "Content Understanding has a GA API version, `2025-11-01`, and a later preview, `2026-06-01-preview`, which adds agentic mode (`config.workflow` set to `agentic`, for documents, one input file per request), in-page segmentation (`allowInPageSegments`) and other items. The study guide says most questions cover GA features, and the exam may contain Preview features if they are commonly used.\n\nFor production, prefer GA, and clearly mark in design documents which parts rely on preview features so that you can plan for changes. Check the API version in every example before copying it.\n\nIn the same way, agentic retrieval has a GA REST version `2026-04-01` (minimal, extractive retrieval) and `2026-08-01-preview` (LLM query planning, answer synthesis, non-minimal effort and multi-turn messages).\n\nWhen a question includes a version, it often decides the answer: match the feature to the version that has it.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/overview", "https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "A private-network design requires the Azure AI Search indexer to reach an Azure OpenAI resource for embeddings through a shared private link. Which statement is correct?", "o": [{"t": "Shared private link works for Azure-to-Azure connections, using the `openai_account` group ID for Azure OpenAI", "c": true, "e": "This is the documented identifier for that connection."}, {"t": "Shared private link works for any external HTTP endpoint on the internet", "c": false, "e": "It works for Azure-to-Azure only."}, {"t": "The group ID for Azure OpenAI is `sites`", "c": false, "e": "`sites` is for custom skills hosted on App Service or Functions."}, {"t": "No group ID is needed, because Search reaches Azure OpenAI over the public internet in every configuration", "c": false, "e": "In private designs a shared private link is used."}], "concept": "In a network-secured design, Azure AI Search must call other Azure services (Azure OpenAI for embeddings, or an Azure Function for a custom skill) without crossing the public internet. A shared private link creates a managed private connection from the search service to the target resource.\n\nIt works for Azure-to-Azure connections only. The group ID names the type of target: `openai_account` for Azure OpenAI, and `sites` for custom skills on App Service or Functions. After creation, the owner of the target resource approves the connection.\n\nThe same pattern appears in the other direction: the data sources need private endpoints, and DNS zones must resolve names to private IPs. Same-region Storage traffic already uses private IPs, so a storage firewall cannot be added for it.\n\nUse managed identity for the indexer's connections, and prefer Microsoft Entra ID with role-based access control over keys.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-integrated-vectorization", "https://learn.microsoft.com/en-us/azure/search/search-security-built-in"], "ref": ["azure-ai-search-configuration", "platform-network-and-reliability"]}, {"d": 5, "q": "A Content Understanding analyzer generates a summary field. After the team attaches a deployment with a strict guardrail, the summary values are sometimes empty while the extracted content is still available. What is the most likely cause?", "o": [{"t": "The summary field uses the `extract` method", "c": false, "e": "A summary is generated and would use `generate`; the method is not the cause here."}, {"t": "The analyzer ID contains uppercase characters", "c": false, "e": "IDs do not blank out values."}, {"t": "`enableOcr` is set to true", "c": false, "e": "OCR does not suppress generated fields."}, {"t": "Guardrails on the model deployment can suppress generated values, although the content stays available", "c": true, "e": "The troubleshooting notes list this effect."}], "concept": "Content Understanding uses model deployments you connect to the resource: the analyzer's `models` setting uses model names from the catalog, and the service maps them to deployments (completion and embedding). Generated fields use the completion model.\n\nBecause the deployment is a normal Foundry model deployment, its guardrail applies to the content the model produces. A strict guardrail can suppress generated values, for example if the model's output is flagged. The content extracted from the file (Markdown, OCR text, layout) stays available, which is why the symptom is \"fields empty but content fine\".\n\nOther common problems: a model deployment not connected, using a deployment name where a model name is required, an `extract` field without source and confidence estimation, and deep nesting hurting accuracy.\n\nCheck the guardrail annotations on the deployment, and tune the thresholds for this use case.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference", "https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "A Content Understanding schema for loan documents nests objects and arrays six levels deep. Field accuracy is poor and results are hard to use. What does the guidance suggest?", "o": [{"t": "Use only the `generate` method for every field", "c": false, "e": "The method should match the field, and nesting remains the problem."}, {"t": "Disable normalization of dates and numbers", "c": false, "e": "Normalization helps, and it is not the cause here."}, {"t": "Add more levels to give the model more structure", "c": false, "e": "More nesting makes extraction harder."}, {"t": "Flatten the schema and avoid nesting deeper than about two to three levels", "c": true, "e": "Deep nesting hurts accuracy."}], "concept": "A `fieldSchema` lists the fields an analyzer should return. Types include `string`, `number`, `boolean`, `date`, `object` and `array`. Each field has a `description`, which acts as a mini-prompt, and a method: `extract` for values as written, `classify` for a fixed enum and `generate` for interpretation or summary.\n\nThe guidance is to avoid nesting deeper than two to three levels. A deep tree of objects in arrays is harder for the model to fill consistently, and hard for downstream code to use. Prefer flat fields, or split into a top-level array of simple objects, and run a second analyzer for sections that need their own schema.\n\nValues such as dates and numbers are normalized automatically. Use `estimateFieldSourceAndConfidence` to get confidence and grounding, and route low-confidence values to human review.\n\nValidate on labeled samples before scaling up.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "A team must produce a validated, calculated result from a single multi-page financial document, for example checking totals against line items. They accept higher token use and time. Which Content Understanding option is meant for answers built from evidence?", "o": [{"t": "Disable layout and OCR to speed up processing", "c": false, "e": "This removes information the calculation needs."}, {"t": "Use the `prebuilt-videoSearch` analyzer", "c": false, "e": "It is for video retrieval, not document calculations."}, {"t": "Use `enableSegment` with 200 categories", "c": false, "e": "Segmentation splits content; it does not reason across fields."}, {"t": "Set `config.workflow` to `agentic` on a document analyzer (preview), one input file per request", "c": true, "e": "Agentic mode is for calculations, validations and complex tables, with more tokens and the advanced contextualization rate."}], "concept": "Content Understanding analyzers can run in two workflows. The default workflow performs standard extraction. Agentic mode (preview, API `2026-06-01-preview`) is for answers that must be built from evidence: calculations, validations and complex tables. You set `config.workflow` to `agentic` on a document analyzer, with one input file per request. It uses more tokens and time and the advanced contextualization rate.\n\nThe skills outline mentions \"single-task and pro-mode\" pipelines. The current Learn pages do not use those exact terms. A working model is: standard (single-task) handles one analyzer, one schema and one result across modalities, while pro-style reasoning applies to documents only, across several documents or reference data. The closest documented feature today is agentic mode.\n\nDo not choose agentic mode for video or audio, and do not chain separate pipelines when one standard analyzer covers the content.\n\nCheck the outline wording again before the exam.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference", "https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/document/overview"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "A search service with one replica has 20 indexers scheduled every five minutes. Indexing jobs queue up and some run late. Which statement explains this and suggests a fix?", "o": [{"t": "Indexers always run in parallel without limit, so the delay must be a network problem", "c": false, "e": "Indexer concurrency is limited by search units."}, {"t": "Schedules shorter than five minutes fix the queue", "c": false, "e": "Five minutes is the minimum interval."}, {"t": "A search service runs one indexer job per search unit, so add replicas for concurrency; indexers also have no dedicated compute, so run times vary", "c": true, "e": "Concurrency depends on the number of search units."}, {"t": "Indexers use dedicated compute that you scale in the portal", "c": false, "e": "Indexers have no dedicated compute."}], "concept": "An indexer is the crawler that connects a data source, an optional skillset and an index. It runs on demand or on a schedule, as often as every five minutes. One indexer uses one data source and writes to one index, but many indexers can write to the same index.\n\nCapacity matters: a search service runs one indexer job per search unit, so add replicas to run more indexers at the same time. Indexers have no dedicated compute, so run times vary, and heavy indexing can cause query throttling.\n\nIf you need updates faster than every five minutes, use push indexing from your code with the SDK or REST API.\n\nTo monitor, check indexer status in the portal or with the Get Indexer Status API, and then run a query to verify results.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-indexer-overview"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A Content Understanding classifier is configured with content categories for \"invoice\" and \"contract\". A pile of other documents (memos, photos of whiteboards) are mislabeled as invoices or contracts. What is the correct fix?", "o": [{"t": "Raise the number of categories to 200", "c": false, "e": "More categories do not fix the forced assignment of unrelated pages."}, {"t": "Add an `other` category so unrelated pages are not forced into a listed category", "c": true, "e": "Without it, every page is assigned to one of the listed categories."}, {"t": "Switch to a video analyzer", "c": false, "e": "Video supports only one content category and is for video content."}, {"t": "Turn off OCR", "c": false, "e": "This removes text recognition and makes classification worse."}], "concept": "Content Understanding can classify and split content inside an analyze call. You define `contentCategories` with a description for each, and no training data is needed. You can use up to 200 categories, categories can name an analyzer to run extraction, and `enableSegment: true` finds several documents inside one file.\n\nA classifier must always choose something. If the only choices are \"invoice\" and \"contract\", a memo has to be one of them. The fix is to include an `other` category, which gives unrelated pages a place to land and keeps your downstream extraction clean.\n\nThis is the same design rule as a catch-all class in any classifier. After classification, you can route only the matching pages to the right extraction analyzer.\n\nCheck results with labeled samples, and look at the confidence of low-scoring pages.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/classifier", "https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"], "ref": ["content-understanding-and-document-intelligence"]}]};</script>
