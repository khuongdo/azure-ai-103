ier. Accepted file types include ALIGN, PDF, LCL, HTML, XLF, TMX, TXT, DOCX and XLSX. With the right data, gains of 5 to 10 BLEU points are common, and dictionary-only training is possible when no parallel data exists.\n\nBLEU compares machine output with a human reference translation. Higher is better, but a score is only meaningful against the same test set. Two scores from two different sets cannot be ranked.\n\nCompare options by their purpose. A glossary applies fixed term mappings in a document translation job. Adaptive custom translation adapts an LLM with 5 to 10,000 aligned pairs. Custom Translator suits a large parallel corpus in a stable domain.\n\nDo not confuse BLEU (translation) with word error rate (speech recognition).", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/custom-translator/overview"], "ref": ["translation"]}, {"d": 4, "q": "A bot must take spoken input from callers over the phone with low latency and allow barge-in. The team asks about Voice Live telephony options. Which statement is correct?", "o": [{"t": "Voice Live is a batch API for recorded calls", "c": false, "e": "It is a real-time API."}, {"t": "Voice Live needs a separate noise-suppression component", "c": false, "e": "It bundles noise suppression and echo cancellation."}, {"t": "Telephony works through Teams Phone extensibility or Twilio; direct SIP is not offered", "c": true, "e": "Voice Live is a managed WebSocket API for speech-to-speech conversation with interruption and end-of-turn detection."}, {"t": "Voice Live accepts direct SIP trunks", "c": false, "e": "Direct SIP is not offered."}], "concept": "Voice Live is a managed API for real-time voice agents. For telephony, the documented routes are Teams Phone extensibility and Twilio. Direct SIP trunking is not offered. So a team that wants phone callers to reach a Voice Live agent integrates through one of those two routes.\n\nVoice Live is not a batch API for recorded calls (that would be batch transcription). It bundles noise suppression and echo cancellation, so no separate noise-suppression component is needed.\n\nFor design, remember the pieces: Voice Live handles speech recognition, the model, speech synthesis, barge-in and end-of-turn detection; the telephony provider connects the phone network to it; your application handles identity verification, tools and handoff.\n\nCheck the current list of supported telephony options in the documentation before you commit to an architecture, as it can change.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/voice-live"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A manager uploads a 3-hour meeting recording and wants the transcript immediately in one synchronous call. Which statement about fast transcription is correct?", "o": [{"t": "Real-time transcription is the only option for files", "c": false, "e": "Batch and fast are file-based modes."}, {"t": "Fast transcription is for files under about 2 hours and 300 MB, so a 3-hour recording should use batch transcription", "c": true, "e": "The file exceeds the limit."}, {"t": "Text to speech converts the recording into text", "c": false, "e": "Text to speech does the opposite direction."}, {"t": "Fast transcription accepts files of any length", "c": false, "e": "It has limits on duration and size."}], "concept": "Speech to text has four routes. Real-time (SDK, CLI or REST short audio) gives interim and final results as speech is heard, for live captions and voice commands. Fast transcription is synchronous for one file when you want the result now; it is meant for files under about 2 hours and 300 MB. Batch transcription is an asynchronous REST job for many or long files, with results written to storage and optional webhooks. Custom speech improves accuracy for any of them.\n\nA 3-hour file is over the fast transcription limit, so batch is the route. Submit a job with options such as diarization (mono audio needed for 3 or more speakers, up to 35), poll or use a webhook, then read the result files with text, timestamps and speaker labels.\n\nRemember the result time-to-live between 6 hours and 31 days.\n\nDecide with three questions: live or recorded? result needed now? how many files, and how long?", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/overview", "https://learn.microsoft.com/en-us/azure/ai-services/speech-service/batch-transcription-create"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A localization app sends 120 text segments in one `2026-06-06` Translate request with an LLM deployment, and the request is rejected. What is the likely reason?", "o": [{"t": "The request must use the v3.0 format", "c": false, "e": "The latest GA version uses `inputs` and `value`."}, {"t": "The LLM path allows a maximum of 50 array elements (and 5,000 characters per element); the NMT path allows 1,000", "c": true, "e": "Split the batch into requests of 50 or fewer, or use NMT for high-volume baseline traffic."}, {"t": "The `inputs` array must contain exactly one element", "c": false, "e": "Multiple elements are allowed within the limits."}, {"t": "LLM translation does not support arrays", "c": false, "e": "It supports arrays of up to 50 elements."}], "concept": "Translate requests in the `2026-06-06` API have limits that depend on the translation path. A standard NMT request allows up to 1,000 array elements, each up to 50,000 characters. An LLM request is more expensive per call, so the limits are tighter: up to 50 array elements, each up to 5,000 characters.\n\nThe request in the question has 120 segments in one call with an LLM deployment. That is more than 50, so it is rejected. The fix is to split the work into batches of 50 or fewer (and make sure that each element is at most 5,000 characters), or to send the bulk traffic to NMT.\n\nThe `inputs` array may contain many elements, not exactly one. LLM translation does support arrays. The v3.0 format is the older version and not required.\n\nDesign tip: keep high-volume baseline traffic on NMT and use the LLM only where tone or context matters; this also reduces cost.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/overview"], "ref": ["translation"]}, {"d": 4, "q": "A community site must flag user comments that contain hate speech or self-harm content and receive a severity value for each category. Which service is purpose-built for this?", "o": [{"t": "Azure Language key phrase extraction", "c": false, "e": "It returns main concepts and has no harm severity."}, {"t": "Azure AI Content Safety text classification across hate, sexual, violence and self-harm with severity levels", "c": true, "e": "It returns a severity per category, and text severity can be the full 0 to 7 scale."}, {"t": "Azure Speech custom voice", "c": false, "e": "It creates synthetic voices."}, {"t": "Azure Translator transliteration", "c": false, "e": "It converts scripts and does not classify harm."}], "concept": "Detecting \"safety issues and sensitive content\" in text is a different job from sentiment or tone. Azure AI Content Safety uses classifiers for four categories: hate and fairness, sexual, violence and self-harm. For text it returns severity on a full 0 to 7 scale (it can be trimmed to 0, 2, 4, 6). For images the scale is trimmed (0, 2, 4, 6), and for images with text from a multimodal model it is the full 0 to 7.\n\nThe classifiers are trained and tested on English, German, Japanese, Spanish, French, Italian, Portuguese and Chinese. They can work in other languages with less reliability, so test your own languages.\n\nSensitive personal data is a separate problem handled by PII detection in Azure Language, which can return redacted text.\n\nSentiment and tone describe how the writer feels; Content Safety describes whether the content is harmful. A tool may need both.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/harm-categories", "https://learn.microsoft.com/en-us/azure/ai-services/content-safety/overview"], "ref": ["responsible-ai-governance", "text-analysis-language-and-llms"]}, {"d": 4, "q": "A smart-home assistant receives the utterance \"Turn off the living room lights\". You need to extract the intent `TurnOff` and the entity `Room = living room`. Which Azure Language capability is designed for this?", "o": [{"t": "Key phrase extraction", "c": false, "e": "It returns main concepts but not intents or typed entities."}, {"t": "Language detection", "c": false, "e": "It identifies the language of the text only."}, {"t": "Conversational language understanding (CLU)", "c": true, "e": "CLU predicts the intent of an utterance and extracts entities. It does not execute the action."}, {"t": "Custom question answering", "c": false, "e": "It answers questions from a knowledge base of FAQs and documents."}], "concept": "Conversational language understanding (CLU) turns a short user message into something a program can act on. It predicts an intent (what the user wants) and extracts entities (the details).\n\nFor \"Turn off the living room lights\" the intent is `TurnOff` and the entity is `Room = living room`. You define intents and entities, label example utterances, train a model, deploy it and call the prediction API. The result returns the top intent with confidence and the list of entities. Your code then maps the intent to an action, for example calling the lights service for the living room.\n\nCustom question answering matches a question to a stored answer in a knowledge base (an FAQ). Key phrase extraction lists the important phrases of a text. Language detection returns the language code. None of them returns an intent with entities.\n\nMemory aid: intent is the verb of the sentence (\"turn off\"); entities are the nouns and details (\"living room lights\").", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A law firm must redact personal data from call transcripts and from thousands of PDF and DOCX files before sending them to a language model. Which TWO statements about Azure Language PII detection are correct?", "o": [{"t": "To reduce risk, log and forward the redacted text, not just the entity list", "c": true, "e": "The entities array alone leaves the original text with the personal data in it."}, {"t": "It must be run after the text has been sent to the model", "c": false, "e": "It should run before data goes to a model, a log or an index."}, {"t": "Storing the `entities` array is enough, because the original text can be kept in the logs", "c": false, "e": "The original text would still contain the personal data."}, {"t": "It supports text, conversations (asynchronous) and documents (asynchronous; PDF, DOCX and TXT)", "c": true, "e": "These are the documented input types."}, {"t": "It supports only English plain text and cannot process documents", "c": false, "e": "Documents are supported."}], "concept": "PII detection finds personal data such as names, phone numbers and card numbers. It works on plain text, on conversations (asynchronous) and on documents (asynchronous; PDF, DOCX and TXT). It returns redacted text and the entity list, and you choose redaction policies and categories.\n\nThe important distinction is between the entity list and the redacted text. Flagging or storing the `entities` array still leaves the original text, with the social security number inside it. The redacted text replaces each entity with a mask or a category label, such as `[SSN]`, and that is the text to log, index or send to a model.\n\nRun PII detection before the data leaves your control: before a model call, a log write or an indexing step. The hybrid pattern is Language PII first, then an LLM on the redacted text, which keeps cost and risk low.\n\nPII detection is one of the core Language capabilities without a retirement notice.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/personally-identifiable-information/overview", "https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "An integration team receives different HTTP errors from the Translator service. Which TWO mappings between status code and likely cause are correct?", "o": [{"t": "429 means the rate limit was exceeded; 400 means an invalid payload or unsupported language", "c": true, "e": "These are also documented."}, {"t": "403 always means the key has expired", "c": false, "e": "403 means valid credentials with an unsupported operation or configuration."}, {"t": "400 means the service is down for maintenance", "c": false, "e": "400 relates to the request content."}, {"t": "401 means a bad or missing key; 403 means valid credentials but an unsupported operation or configuration", "c": true, "e": "These are the documented meanings."}, {"t": "401 means the rate limit was exceeded", "c": false, "e": "That is 429."}], "concept": "Translator troubleshooting starts with the status code. 401: the key or token is bad or missing, so check the header `Ocp-Apim-Subscription-Key` or the bearer token. 403: the credentials are valid, but the operation or configuration is not permitted, for example using an access token when a private endpoint is enabled (a custom endpoint is required), or an operation that the resource does not support. 429: the rate limit was exceeded, so back off and retry. 400: the payload is invalid or the language is unsupported.\n\nRequest limits also cause 400-type problems: for NMT a request can hold up to 1,000 array elements of up to 50,000 characters each; for LLM translation, 50 elements of up to 5,000 characters.\n\nUse Microsoft Entra ID with managed identity for keyless authentication in enterprises.\n\nAlways log the status code and the response body together.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/overview", "https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/reference/v3/reference"], "ref": ["translation"]}, {"d": 4, "q": "A marketing team uses LLM translation and wants a formal tone for German, a stable approved terminology, and low cost for unchanged text. Which design fits?", "o": [{"t": "Use the tone control and a glossary or adaptive reference translations, send high-risk content to human review, and cache results by source hash so unchanged text is not re-translated", "c": true, "e": "This combines the available controls with an efficient flow."}, {"t": "Skip human review for legal text", "c": false, "e": "High-risk content needs review."}, {"t": "Re-translate every segment on every release", "c": false, "e": "This wastes tokens."}, {"t": "Use temperature 2 for more natural wording", "c": false, "e": "Higher randomness harms consistency."}], "concept": "Good translation design controls quality, terminology, risk and cost.\n\nTone: the LLM translation path supports tone controls (formal, informal, neutral), so ask for formal German. Terminology: a glossary or adaptive reference translations keep approved terms stable across releases. Risk: high-risk content such as legal text should go to human review; do not skip review for it. Cost: cache translations by a hash of the source segment (plus target language, glossary and model version), so unchanged text is not translated again on the next release.\n\nRe-translating every segment every time wastes money and can change wording unnecessarily. Temperature 2 increases randomness and hurts consistency. Skipping human review for legal text is a compliance risk.\n\nMemory aid: tone dial, term list, human check for the dangerous parts, and a memory so you don't repeat work.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/overview"], "ref": ["translation"]}, {"d": 4, "q": "You use an LLM to classify support tickets by urgency and need consistent, parseable labels. Which TWO practices apply?", "o": [{"t": "Skip evaluation because LLMs are accurate", "c": false, "e": "Evaluate accuracy per label on a labeled sample and compare with the Language feature."}, {"t": "Define each label in the prompt and include an `unknown` option for unclear text", "c": true, "e": "Definitions and an out reduce invented labels."}, {"t": "Use Structured Outputs so the app can parse the result, and set the temperature low (0 to 0.3)", "c": true, "e": "A schema keeps the shape fixed and a low temperature keeps labels consistent."}, {"t": "Let the model invent label names freely", "c": false, "e": "Labels outside the list break downstream logic."}, {"t": "Set the temperature to 1.5 to cover edge cases", "c": false, "e": "Higher randomness gives inconsistent labels."}], "concept": "When a program needs to read a model's answer, the answer must be consistent and parseable.\n\nStructured Outputs force the response to follow a JSON schema, for example `urgency` as an enum of `low`, `medium`, `high`, `unknown`. A low temperature (0 to 0.3) reduces variation, so the same ticket gets the same label. Define each label in the prompt with a short rule and an example, and include an `unknown` option, so the model does not have to force an unclear ticket into a wrong class.\n\nLetting the model invent label names breaks aggregation. A high temperature of 1.5 adds randomness. Skipping evaluation is risky: build a labeled test set and measure accuracy and agreement with human labels, then recheck after prompt or model changes.\n\nAlso keep a human review for tickets that are marked unknown or have high business impact.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "Which request is best handled by an LLM on Foundry rather than by an Azure Language feature?", "o": [{"t": "Detect the language of short messages at very high volume and low cost", "c": false, "e": "Language detection is cheap and deterministic."}, {"t": "Detect sarcasm and subtle tone in long customer emails with multi-step reasoning", "c": true, "e": "Nuance, long context and reasoning are strengths of an LLM."}, {"t": "Mask phone numbers with auditable categories", "c": false, "e": "Language PII detection is purpose-built for this."}, {"t": "Extract Person and Location entities from text", "c": false, "e": "Prebuilt NER fits."}], "concept": "Azure Language features are specialized, fast, cheap and predictable for narrow tasks. LLMs on Foundry are better where the task needs reasoning, context and flexible judgment.\n\nDetecting sarcasm and subtle tone in long emails with multi-step reasoning is a judgment task over long context. A rule-like classifier would struggle, while an LLM can read the whole email, consider contrast between words and situation, and explain its decision.\n\nThe other tasks suit Language features. Masking phone numbers with auditable categories is PII detection: deterministic categories and offsets, easy to audit. Detecting the language of short messages at very high volume and low cost is language detection: cheap and fast. Extracting Person and Location entities is NER.\n\nDecision rule: use the narrowest specialized service when it meets the requirement, and an LLM when you need reasoning, free-form generation or nuance. Evaluate before you commit.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A company wants a branded synthetic voice for its app. Which TWO statements are correct?", "o": [{"t": "Visemes are available for every voice and language", "c": false, "e": "Visemes are listed for en-US neural voices only."}, {"t": "Custom voice is available to every customer without approval", "c": false, "e": "It is limited access."}, {"t": "Text to speech billing counts characters, including SSML markup (except `<speak>` and `<voice>`)", "c": true, "e": "Long SSML adds to the count, and each Chinese character counts as two."}, {"t": "Batch synthesis is for audio shorter than a minute", "c": false, "e": "The batch synthesis API is for audio longer than 10 minutes, such as audiobooks."}, {"t": "Custom voice is limited access, needs approval and consent from the voice talent, and requires disclosing the synthetic voice to listeners", "c": true, "e": "This is the responsible-use requirement for custom voices."}], "concept": "A custom voice gives your brand a unique synthetic voice. Because a realistic voice can be misused, it is a limited access feature: you apply for approval, you need the explicit consent of the voice talent, and you must disclose to listeners that the voice is synthetic.\n\nBilling for text to speech counts characters. SSML markup is also counted, except the `<speak>` and `<voice>` tags. So a heavily marked-up SSML text costs more than the same plain text.\n\nBatch synthesis is the API for long audio (longer than 10 minutes), not for short audio. Visemes (mouth shape timing for avatars and lip sync) are not available for every voice and language.\n\nMemory aid: a custom voice is like a signature. It needs the signer's consent, and people have the right to know it is a copy.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/text-to-speech"], "ref": ["speech-solutions"]}, {"d": 4, "q": "An app must translate live speech between two people who speak languages that are not known in advance, and the language can change during the conversation. Which capability should you use?", "o": [{"t": "Live Interpreter in the Speech service, which detects the spoken language continuously", "c": true, "e": "It needs no input language and switches languages mid-session."}, {"t": "Custom Translator", "c": false, "e": "It trains a custom text translation system and is not a live speech feature."}, {"t": "Standard speech translation with a fixed source language", "c": false, "e": "The standard API requires you to set the source and target languages."}, {"t": "Translator document translation", "c": false, "e": "It translates files, not live audio."}], "concept": "Speech translation turns spoken audio in one language into text or speech in another. In the standard version you set the source language in advance. If the speakers use unknown languages, or switch languages during the conversation, a fixed source language fails.\n\nLive Interpreter in the Speech service is designed for that case. It continuously detects the spoken language, switches languages when the speaker changes, and translates in real time. It can also render the translation with a voice that resembles the speaker's (personal voice).\n\nTranslator document translation works on files, not live speech. Custom Translator trains a custom text translation model and does not handle audio.\n\nRelated limit: the Speech service translates directly into up to two target languages per request. More targets need a Foundry resource and extra translation costs.\n\nMemory aid: standard speech translation is a translator who was told the languages in advance; Live Interpreter listens and figures them out.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/speech-translation"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A company builds a support FAQ bot from product manuals. Users ask follow-up questions such as \"and for the premium plan?\", and the team wants answers filtered by product line. Which custom question answering capabilities address these needs?", "o": [{"t": "Speech translation", "c": false, "e": "It translates spoken language and does not answer from manuals."}, {"t": "Multi-turn follow-up prompts and metadata filtering", "c": true, "e": "Both are listed capabilities of custom question answering."}, {"t": "Sentiment analysis and opinion mining", "c": false, "e": "These label feelings in text and do not answer questions from a knowledge base."}, {"t": "Language detection and PII redaction", "c": false, "e": "They do not build an FAQ knowledge base."}], "concept": "Custom question answering (CQA) builds a knowledge base from FAQs, manuals and documents. Key capabilities are automatic question-and-answer extraction, multi-turn follow-up prompts, metadata filtering, active learning, and deep-learning re-ranking over Azure AI Search. The flow is: create a project, test, deploy a REST endpoint, and integrate. Responses carry answers, confidence scores and follow-up prompts.\n\nThe two needs in the scenario map directly. A follow-up like \"and for the premium plan?\" depends on context, which multi-turn prompts handle. Filtering by product line uses metadata attached to the question-answer pairs.\n\nFor a bot that needs both an FAQ (CQA) and a calendar skill (CLU), an orchestration workflow routes each utterance to the right project.\n\nRetirement note: CQA retires from Azure Language on March 31, 2029, and new work is directed to Foundry models with retrieval.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/question-answering/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A support team stores call transcripts for later analytics. Compliance wants to reduce the risk of storing social security numbers. Which output of Azure Language PII detection should the pipeline store?", "o": [{"t": "The list of detected entities together with the original text", "c": false, "e": "The original text still contains the numbers."}, {"t": "The detected language codes", "c": false, "e": "Language detection is unrelated to removing personal data."}, {"t": "Only the confidence scores", "c": false, "e": "Scores do not remove the sensitive values from the text that is stored."}, {"t": "The redacted text, in which each entity is replaced by a mask or category label", "c": true, "e": "The redacted text no longer contains the sensitive values, so it is safe to log or index."}], "concept": "PII (personally identifiable information) detection in Azure Language finds personal data such as phone numbers, card numbers or social security numbers in text, conversations and documents. The result has two parts: an entities array (what was found, its category, offset and confidence) and the redacted text, in which each value is replaced by a mask or a label.\n\nIf the goal is to avoid storing SSNs, you must store the redacted text and not the original. The entities array alone does not change the original text, and storing it together with the original keeps the SSN. Confidence scores or language codes contain no useful transcript.\n\nPipeline order matters: detect and redact first, then summarize, analyze and store. Everything downstream is then safer to keep and share.\n\nCheck quality with a labeled sample: recall for PII matters most, because a missed number is worse than an over-redaction.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A batch document translation job must always translate a company name unchanged and use approved terms for 200 product phrases. Which input and format provide this?", "o": [{"t": "A text-to-speech lexicon", "c": false, "e": "Lexicons control pronunciation in speech synthesis."}, {"t": "A BLEU score report", "c": false, "e": "It evaluates quality after training; it does not enforce terms."}, {"t": "A glossary file in CSV, XLIFF or TSV format supplied with the document translation job", "c": true, "e": "Glossaries apply fixed term mappings during translation."}, {"t": "A Speech custom endpoint", "c": false, "e": "It affects speech recognition, not document translation."}], "concept": "Customization options for translation differ in effort and power. A glossary is a list of fixed term mappings applied to a document translation job, supplied as CSV, XLIFF or TSV; it is ideal for product names and approved terms. Adaptive custom translation adapts an LLM using a small bilingual set (5 to 10,000 aligned pairs of up to 500 characters each) in minutes. Custom Translator trains a custom NMT system from a large parallel corpus in a stable domain.\n\nFor this scenario, 200 phrases and a company name that must not change are exactly what a glossary is for.\n\nBatch document translation uses blob containers, access through SAS tokens or managed identity (identity is preferred), and glossary files. Layout and format are preserved, and scanned PDFs go through OCR. Content is processed in the region of the Translator resource.\n\nPick the lightest option that meets the need.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/document-translation/overview", "https://learn.microsoft.com/en-us/azure/ai-services/translator/custom-translator/overview"], "ref": ["translation"]}, {"d": 4, "q": "A developer submits a batch transcription job with `languageIdentification` listing 12 candidate locales, because the recordings could be in many languages. The job is rejected. What is the limit?", "o": [{"t": "Only one candidate locale is allowed", "c": false, "e": "Language identification needs at least two candidates."}, {"t": "Language identification accepts 2 to 10 candidate locales", "c": true, "e": "More than 10 candidates is not allowed."}, {"t": "It accepts between 12 and 20 locales", "c": false, "e": "The documented range is 2 to 10."}, {"t": "There is no limit, but results are slower", "c": false, "e": "A limit exists, and exceeding it fails the request."}], "concept": "Batch transcription is an asynchronous REST job. Options include `diarizationEnabled` for two speakers, or minimum and maximum speaker counts for three or more on mono audio (up to 35 speakers), `languageIdentification` with 2 to 10 candidate locales, `timeToLiveHours` from 6 hours to 31 days, and a destination container inside `properties`.\n\nLanguage identification lets the service decide which of your candidate languages is spoken in each file. Because it chooses among candidates, you must list at least two and at most ten. Choose candidates that you actually expect.\n\nCommon failures in batch jobs are diarization on stereo files (it needs mono), more than 10 candidate locales, results deleted after the time-to-live, and wrong storage permissions.\n\nWhen a language is known, set the locale directly, which improves quality and avoids candidate selection.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/batch-transcription-create"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A conference app uses live speech translation and a custom speech model for the speakers' technical vocabulary. Which TWO statements are correct?", "o": [{"t": "The standard API detects the spoken language continuously and needs no input language", "c": false, "e": "That describes Live Interpreter; the standard API needs a source language."}, {"t": "A custom speech model can be used with real-time speech to text, speech translation and batch transcription", "c": true, "e": "Custom models are not limited to one mode."}, {"t": "Custom speech models cannot be combined with speech translation", "c": false, "e": "They can be used with speech translation."}, {"t": "Speech translation only produces text and never synthesized speech", "c": false, "e": "Final results can be synthesized, giving speech-to-speech translation."}, {"t": "The Speech service translates directly into two target languages; more targets need a Foundry (multi-service) resource, with translation fees beyond the second", "c": true, "e": "This is the documented target limit."}], "concept": "Speech translation translates live audio. Speech to text and speech to speech translation work through the Speech SDK or CLI. Interim results arrive while speech continues, and final results can be synthesized. In the standard API you set the source language and the target languages. Live Interpreter detects the spoken language continuously, switches languages mid-session and supports bring-your-own personal voice.\n\nTargets: the Speech service translates into two target languages directly. For more, use a Foundry (multi-service) resource; translation fees then apply for each language beyond the second.\n\nCustom speech improves recognition of your vocabulary and conditions. A custom model works for real-time speech to text, speech translation and batch. Measure with word error rate before you train.\n\nFor documents or text, use Translator rather than Speech.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/speech-translation", "https://learn.microsoft.com/en-us/azure/ai-services/speech-service/custom-speech-overview"], "ref": ["speech-solutions"]}, {"d": 4, "q": "For the review \"The room was clean but the staff were rude\", a hotel wants to know that the room is positive and the staff are negative. Which capability provides this?", "o": [{"t": "Extractive summarization", "c": false, "e": "It selects important sentences and does not assign sentiment to aspects."}, {"t": "Language detection", "c": false, "e": "It returns the language of the text only."}, {"t": "Opinion mining (aspect-based sentiment analysis)", "c": true, "e": "It links sentiment to specific aspects of the text, such as room and staff, in addition to sentence and document sentiment."}, {"t": "Key phrase extraction", "c": false, "e": "It returns the main concepts (\"room\", \"staff\") but no sentiment."}], "concept": "Ordinary sentiment analysis gives one label (positive, neutral, negative) for a whole sentence or document. That cannot express \"the room is good, the staff are bad\" in the same sentence.\n\nOpinion mining, also called aspect-based sentiment analysis, goes deeper. It finds the targets (aspects) that people talk about, such as \"room\" and \"staff\", and the opinion words attached to them (\"clean\", \"rude\"), and assigns sentiment to each target. For the example: room is positive, staff is negative.\n\nKey phrase extraction lists the main phrases and does not score sentiment per target. Language detection returns the language. Extractive summarization selects important sentences.\n\nUse opinion mining when the business needs to know what exactly people like or dislike, for example to report on rooms, staff, location and price separately.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A team wants to start with conversational language understanding quickly, with no labeled data. Which path is documented?", "o": [{"t": "Use batch transcription", "c": false, "e": "It converts audio to text."}, {"t": "Train a custom model first, then define the schema", "c": false, "e": "The custom path defines the schema first, then labels and trains."}, {"t": "Use Custom question answering because it extracts intents", "c": false, "e": "It answers questions from a knowledge base."}, {"t": "The LLM-powered quick deploy: define the schema with intent descriptions, deploy, then predict intents and prebuilt entities", "c": true, "e": "It skips labeling and training. The custom machine-learned path needs labeled utterances and training."}], "concept": "Conversational language understanding (CLU) predicts intents and entities. Traditionally you create labeled utterances for each intent and train a model. That requires data and time.\n\nThe LLM-powered quick deploy path lets you start without labeled data. You define the schema (the intents with short descriptions, and entities), deploy it, and then call the prediction API; the LLM predicts intents and uses prebuilt entities. This is good for a fast start. Later, if measurements show a need, you can add labeled data and train a custom model for better accuracy on your domain.\n\nTraining first and defining the schema later has the wrong order, since the schema defines what to train. Custom question answering finds answers in a knowledge base and does not extract intents. Batch transcription converts audio to text.\n\nMemory aid: quick deploy = describe, deploy and test; custom training = collect data, train and tune.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A call-center application used a custom speech model through a deployed custom endpoint. Months later, the endpoint stops working although nobody changed it. Which fact from the custom speech guidance explains this?", "o": [{"t": "Models and endpoints are fixed until you change them but have a limited lifetime, so retrain or redeploy before expiry", "c": true, "e": "Custom models and endpoints expire under the model and endpoint lifecycle."}, {"t": "Endpoints stop when the word error rate drops below 5%", "c": false, "e": "WER does not stop endpoints."}, {"t": "Custom endpoints are billed per word and stop at a spending limit", "c": false, "e": "This is not the documented behavior."}, {"t": "Custom speech works only with batch transcription, which has no endpoint", "c": false, "e": "Custom models also work for real-time speech to text and speech translation."}], "concept": "Custom speech improves recognition for your vocabulary, accents and noise conditions. The workflow is: create a project, upload test data, train, inspect quality, measure with word error rate, and deploy to a custom endpoint. Batch transcription is an exception: it does not need a deployed endpoint, which saves hosting cost.\n\nModels and endpoints are stable once created, but have a limited lifetime. When a model reaches the end of its lifetime, the endpoint that uses it stops working. Check the model and endpoint lifecycle information, record expiry dates, and plan retraining and redeployment before then.\n\nA custom model works for real-time speech to text, speech translation and batch. When vocabularies differ strongly between areas of one domain, several custom models are recommended.\n\nPut expiry dates in your operations calendar and alert before they arrive.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/custom-speech-overview"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A team uses the Azure Language document summarization feature (Preview) for PDF and Word reports and asks about file types and how long results can be retrieved. What is the documented position?", "o": [{"t": "It accepts any file type, and results are retrievable for 24 days", "c": false, "e": "The retention is 24 hours."}, {"t": "It accepts txt, pdf and docx, and results are retrievable for 24 hours", "c": true, "e": "These are the documented details of document summarization."}, {"t": "It accepts only images, and results never expire", "c": false, "e": "It works on documents, and results expire."}, {"t": "It accepts only audio files and results last 30 days", "c": false, "e": "It is not an audio feature."}], "concept": "Summarization in Azure Language has several forms. Extractive summarization selects the most important original sentences with a rank score. Abstractive summarization writes new sentences. Conversation summaries produce aspects such as issue, resolution, chapter title, narrative and recap. Document summarization (Preview) accepts txt, pdf and docx, and the results are retrievable for 24 hours, so a pipeline must collect them within that time.\n\nRetirement note: summarization retires from Azure Language on March 31, 2029, with new projects directed to Foundry models. For an LLM-based design define a schema, use a low temperature, require citations when facts matter, and run PII redaction first.\n\nPreview features can change, so state the status clearly in the design.\n\nDesign implications: call the job, poll or collect results promptly, store the summary in your own storage, and handle expiry in the pipeline.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A developer calls the latest GA version of the Translator text translation API (`2026-06-06`) and wants to use an LLM deployment instead of standard neural machine translation. Which statement is correct?", "o": [{"t": "LLM translation allows 1,000 array elements per request", "c": false, "e": "That limit is for NMT. LLM translation allows 50 elements."}, {"t": "The request body uses an `inputs` array, the response returns a `value` array, and LLM translation needs a Foundry resource", "c": true, "e": "These are the changes in `2026-06-06` compared with v3.0."}, {"t": "The request body is a plain top-level array as in v3.0, and any Translator resource works for LLM translation", "c": false, "e": "The new version uses `inputs` and `value`, and LLM translation requires a Foundry resource."}, {"t": "LLM translation is available only through Custom Translator", "c": false, "e": "Custom Translator trains NMT systems. LLM translation is a model choice in the translate call."}], "concept": "Azure Translator has a REST text translation API. The latest GA version, `2026-06-06`, changed the shape of the messages compared with v3.0: the request uses an `inputs` array and the response returns a `value` array. v3.0 still exists and keeps its older shape.\n\nThe new version also lets you choose the translation model: standard neural machine translation (NMT) or a supported LLM deployment. LLM translation needs a Foundry resource, and it supports extras such as tone (formal, informal, neutral) and gender controls. The limits differ too: NMT allows up to 1,000 array elements per request, LLM only 50.\n\nBilling differs as well: NMT is billed per source character, LLM per input and output token. A sensible design keeps high-volume baseline traffic on NMT and sends to an LLM only where tone or context matters.\n\nCustom Translator trains custom NMT models; it is a separate feature and not the only door to LLM translation.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/overview"], "ref": ["translation"]}, {"d": 4, "q": "A security team states that the Translator resource key must not be stored in application settings. The team uses Azure-hosted compute. Which authentication approach is preferred for enterprise use?", "o": [{"t": "Anonymous access, because the Languages operation needs no authentication", "c": false, "e": "Only the Languages operation is open; Translate needs authentication."}, {"t": "Microsoft Entra ID with a managed identity, keyless", "c": true, "e": "It removes the stored secret and supports role-based control and auditing."}, {"t": "A resource key in an environment variable", "c": false, "e": "This still stores a secret that must be rotated and can leak."}, {"t": "A bearer token created from a shared key stored in a repository", "c": false, "e": "The underlying key is still a stored secret."}], "concept": "Azure text translation is a REST API for 100+ languages. The latest GA version is 2026-06-06, and v3.0 still exists. Operations include Languages (no authentication needed), Translate and Transliterate. Translate can use standard neural machine translation (NMT) or a supported LLM deployment, which needs a Foundry resource.\n\nFor authentication, three methods exist: the resource key in the `Ocp-Apim-Subscription-Key` header, a bearer token, and Microsoft Entra ID with managed identity. Enterprises prefer Entra ID because there is no secret to store, rotate or leak, and access is controlled by roles.\n\nKeys give broad access and cannot tell you who called. This is the same reasoning used across Foundry: keyless identity first.\n\nTroubleshooting hint: 401 means a bad or missing key; 403 means valid credentials but an unsupported operation or configuration.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/overview"], "ref": ["translation"]}, {"d": 4, "q": "A bank needs a voice assistant. It requires a custom speech model for product terms, a specific approved synthetic voice, and the ability to log and inspect the text at each stage. Latency is important but not the top priority. Which design fits?", "o": [{"t": "Batch transcription of the live call after it ends", "c": false, "e": "Batch is asynchronous and cannot support a live conversation."}, {"t": "Voice Live as a single managed API, because it always gives the most control over each stage", "c": false, "e": "Voice Live offers lower latency and fewer moving parts, but less control over each stage."}, {"t": "Translator text translation only", "c": false, "e": "It handles text translation, not speech."}, {"t": "A pipeline of speech to text (with the custom speech model), a model or agent, and text to speech (with the approved voice), so each stage can be controlled and logged", "c": true, "e": "This gives per-stage control, at the cost of more moving parts."}], "concept": "Speech can be an agent modality in two ways. Voice Live is a managed WebSocket API for speech-to-speech conversation. It bundles speech to text, a model, text to speech, noise suppression, echo cancellation, and interruption and end-of-turn detection. Its advantage is lower latency and fewer moving parts. Its cost is less control over each stage.\n\nThe alternative is your own pipeline: real-time speech to text, then your model or agent, then text to speech. You can use a custom speech model for domain vocabulary, choose the voice (custom voices need approval and disclosure), log the text between stages and apply guardrails to each step.\n\nThe decision follows the requirements. Per-stage control, custom models and detailed audit favor the pipeline. Fast time to market, natural interruptions and minimum latency favor Voice Live.\n\nMeasure word error rate before you train a custom speech model.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/voice-live", "https://learn.microsoft.com/en-us/azure/ai-services/speech-service/custom-speech-overview"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A voice assistant built on Voice Live must check an order's status while the caller speaks. Which Voice Live capability supports looking up data during the conversation?", "o": [{"t": "Direct SIP trunking", "c": false, "e": "Direct SIP is not offered."}, {"t": "Function calling, for example voice RAG or order lookups", "c": true, "e": "Voice Live supports function calling inside the speech-to-speech session."}, {"t": "Custom Translator training", "c": false, "e": "It trains translation systems."}, {"t": "Batch synthesis of audiobooks", "c": false, "e": "This is for text to speech of long content."}], "concept": "Voice Live is a managed WebSocket API that bundles speech to text, a model, text to speech, noise suppression, echo cancellation and interruption and end-of-turn detection. It supports function calling (for example voice RAG), avatars, 140+ speech-to-text locales and 600+ voices, with Pro, Standard and Lite tiers. Telephony works through Teams Phone extensibility or Twilio; direct SIP is not offered.\n\nFunction calling inside the session lets the model request a function (such as `get_order_status`), have your application run it, and speak the result. The same rules as for text agents apply: validate arguments as untrusted input, use least privilege and require confirmation for changes.\n\nVoice agents have monitoring and evaluation differences: monitoring cards need Application Insights and evaluation supports full-conversation runs only.\n\nUse it when you need natural interruptions and low latency; use a separate pipeline when you need per-stage control.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/voice-live", "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling"], "ref": ["speech-solutions", "building-agents-with-foundry"]}, {"d": 4, "q": "A team submitted batch transcription jobs with the default settings. A week later, the transcript files are gone from the output location, although the jobs had succeeded. Which setting explains this?", "o": [{"t": "`languageIdentification`, which limits file age", "c": false, "e": "It selects the spoken language among candidates."}, {"t": "`destinationContainerUrl`, which expires every Sunday", "c": false, "e": "The container does not expire on its own."}, {"t": "`diarizationEnabled`, which deletes results after speakers are labeled", "c": false, "e": "Diarization labels speakers and does not delete files."}, {"t": "`timeToLiveHours`, which controls how long results are kept (from 6 hours to 31 days)", "c": true, "e": "Results are deleted after the time-to-live."}], "concept": "Batch transcription is asynchronous: you submit a job, wait for it by polling or a webhook, and read result files that contain text, timestamps and speaker labels. Job options include diarization, language identification (2 to 10 candidate locales), a `destinationContainerUrl` inside `properties`, and `timeToLiveHours`.\n\n`timeToLiveHours` sets how long the service keeps the results, between 6 hours and 31 days. After that time, the results are deleted. If you need the transcripts permanently, copy them to your own storage right after the job completes, or write them to your own container with `destinationContainerUrl` and manage retention yourself.\n\nOther common batch failures are diarization on stereo files (it needs mono), more than 10 candidate locales, and wrong storage permissions.\n\nDesign the pipeline so that a webhook triggers the copy and indexing step.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/batch-transcription-create"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A reporter wants live captions while a speaker talks at a conference, with interim text shown as words are recognized. Which Speech to text mode fits?", "o": [{"t": "Real-time transcription through the Speech SDK", "c": true, "e": "It returns interim and final results while speech continues."}, {"t": "Batch transcription", "c": false, "e": "It is asynchronous and meant for many or long files, with results written to storage."}, {"t": "Text to speech", "c": false, "e": "It converts text into audio, the opposite direction."}, {"t": "Fast transcription", "c": false, "e": "It is synchronous for a finished file and returns the result when processing completes."}], "concept": "Speech to text has several modes, and choosing the mode comes before everything else. Real-time uses the SDK, CLI or REST for short audio and gives interim and final results as speech is heard, so it suits live captions and voice commands. Fast transcription is synchronous for one file when you want the result now; the file must be under about 2 hours and 300 MB. Batch transcription is an asynchronous REST job for many or long files, such as call archives, with results written to storage.\n\nCustom speech does not replace these modes; it improves the accuracy of any of them for domain words, accents and noise.\n\nAsk three questions: is the audio live or recorded? Do I need the result now? How many files are there? Live means real-time; one file now means fast; many files means batch.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/overview", "https://learn.microsoft.com/en-us/azure/ai-services/speech-service/batch-transcription-create"], "ref": ["speech-solutions"]}]};</script>
