<script>window.MOCK_EXAM = {"id": "bank-d4", "title": "Question bank: Implement text analysis solutions", "shortTitle": "Domain 4 bank", "description": "70 questions from mock exams 1 to 10, all in the domain \"Implement text analysis solutions\" (10-15% of the exam).", "defaultMinutes": 168, "domains": [{"id": 4, "name": "Implement text analysis solutions", "weight": "10-15%", "count": 70}], "questions": [{"d": 4, "q": "A publisher plans text to speech for a long audiobook and for short app prompts. Which TWO statements about Azure Speech text to speech are correct?", "o": [{"t": "Billing counts characters, including SSML markup except the `<speak>` and `<voice>` tags, and each Chinese character counts as two", "c": true, "e": "This is how character billing is described for text to speech."}, {"t": "The batch synthesis API is intended for audio longer than 10 minutes, such as audiobooks", "c": true, "e": "Real-time synthesis suits short interactive speech, while batch handles long content."}, {"t": "Every SSML tag works with HD voices", "c": false, "e": "Some SSML tags are not supported for HD voices, personal voices and embedded voices."}, {"t": "Visemes are available for every voice in every language", "c": false, "e": "Visemes (lip-shape events) are available for en-US neural voices only."}, {"t": "A branded custom voice can be created without any approval", "c": false, "e": "Custom voice is limited access and needs approval, consent from voice talent and disclosure to listeners."}], "concept": "Text to speech converts text into audio. Standard neural voices cover 100+ languages and locales. HD voices and Azure OpenAI voices give higher quality, but some SSML tags are not supported on them. Custom voice is limited access for responsible use: it needs approval, consent from the voice talent and a disclosure that the voice is synthetic.\n\nChoose the interface by length. Real-time synthesis through the SDK or REST suits prompts and conversations. The batch synthesis API suits audio longer than 10 minutes, for example audiobooks.\n\nBilling is by character. SSML markup counts, except the `<speak>` and `<voice>` tags, and a Chinese character counts as two. Visemes give lip-shape events for facial animation and are available for en-US neural voices only.\n\nAlways check that each SSML tag you use is supported for the chosen voice.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/text-to-speech"], "ref": ["speech-solutions"]}, {"d": 4, "q": "An insurer must extract policy numbers like `POL-2026-00417` from claim emails. The prebuilt NER categories (Person, Location, Organization, DateTime, Quantity) do not include them. Which option fits?", "o": [{"t": "Language detection", "c": false, "e": "It identifies languages only."}, {"t": "Sentiment analysis", "c": false, "e": "It labels sentiment."}, {"t": "Custom named entity recognition trained on labeled examples", "c": true, "e": "Use custom NER when prebuilt categories do not cover what you need."}, {"t": "Prebuilt NER with a larger confidence threshold", "c": false, "e": "The category does not exist, so a threshold does not help."}], "concept": "Named entity recognition (NER) finds and classifies entities in text. The prebuilt NER knows common categories such as Person, Location, Organization, DateTime and Quantity. A policy number like `POL-2026-00417` is not in those categories, and a threshold does not create a category.\n\nCustom NER lets you define your own entity types (for example PolicyNumber) and train a model on labeled examples: you annotate emails with the spans of policy numbers, train, evaluate, deploy and call it. Because policy numbers follow a pattern, a few dozen well-chosen examples may be enough; you review precision and recall on a test set.\n\nFor a very regular pattern, a regular expression in code can also work, and combining a regex with a model is common.\n\nLanguage detection and sentiment analysis do not extract entities.\n\nMemory aid: prebuilt NER knows common nouns; custom NER learns your own jargon.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A localization team translates 50 million characters a month of product pages, and about 2% of that is marketing copy where tone and context are critical. Which approach follows the guidance on NMT and LLM translation?", "o": [{"t": "Send everything to an LLM because it is always better", "c": false, "e": "This raises cost and is limited to 50 elements and 5,000 characters per element per request."}, {"t": "Use speech translation for the web pages", "c": false, "e": "Speech translation is for audio."}, {"t": "Send everything to NMT and ignore the tone requirement", "c": false, "e": "The marketing copy would lose tone control."}, {"t": "Keep the high-volume baseline on standard NMT and send only the tone-critical text to an LLM deployment", "c": true, "e": "NMT is cheap per character at volume; LLM translation adds tone and context where it matters."}], "concept": "The `2026-06-06` Translate operation can use standard neural machine translation (NMT) or a supported LLM deployment. NMT handles up to 1,000 array elements of up to 50,000 characters each and is billed per source character. LLM translation handles up to 50 elements of up to 5,000 characters each, is billed per input and output token, needs a Foundry resource, and supports tone (formal, informal, neutral), gender controls and adaptive custom translation with up to five reference translations.\n\nThe recommended decision: keep high-volume baseline traffic on NMT and send text to an LLM only where tone, context or adaptive behavior matters. This gives lower cost for the 98% and better results for the 2%.\n\nAdd customization as needed: a glossary for approved terms in document translation, adaptive custom translation for a small bilingual set, Custom Translator for a large parallel corpus in a stable domain.\n\nCheck the output for placeholders, numbers and glossary hits, and review high-risk text with a person.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/overview"], "ref": ["translation"]}, {"d": 4, "q": "A pipeline must summarize support chats with an LLM while keeping risk low. The chats contain names, phone numbers and card numbers. Which design fits?", "o": [{"t": "Send the raw chats to the LLM and ask it to ignore personal data", "c": false, "e": "The model has already received the personal data."}, {"t": "Store the raw chats in the prompt cache", "c": false, "e": "The cache is not a privacy control."}, {"t": "Skip PII detection because the LLM is more accurate", "c": false, "e": "Purpose-built PII categories and offsets are auditable and run before data leaves the boundary."}, {"t": "Run Azure Language PII detection first, send only the redacted text to the LLM, and treat the text as untrusted input", "c": true, "e": "This hybrid pattern keeps cost and risk low and removes personal data before the model sees it."}], "concept": "Support chats often contain personal data. Sending raw chats to a language model spreads that data into prompts, logs and caches. The safe order is to detect and remove the personal data first.\n\nAzure Language PII detection finds names, phone numbers, card numbers and more, and returns the text with each value replaced by a mask or a label. Send only the redacted text to the LLM, so the model never sees the raw values. Treat the chat text as untrusted input too: it may contain instructions meant to manipulate the model, so keep it in a clearly separated data part of the prompt.\n\nAsking the LLM to \"ignore personal data\" does not remove it from the request. Skipping PII detection because the LLM is accurate misses the point: the goal is that the data never reaches the model. A prompt cache stores prompt prefixes, and raw chats would be stored there.\n\nEvaluate PII recall on a labeled sample.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A global help desk receives messages in many languages and wants to route each message to the right translation or support queue. The first step must return the language and a confidence score for every document. Which Azure Language feature does this?", "o": [{"t": "Conversational language understanding", "c": false, "e": "It predicts intents and entities of an utterance for a bot."}, {"t": "Sentiment analysis", "c": false, "e": "It labels the text as positive, neutral or negative."}, {"t": "Key phrase extraction", "c": false, "e": "It returns the main concepts of the text, not its language."}, {"t": "Language detection", "c": true, "e": "It returns the language name, the ISO code and a confidence score per document."}], "concept": "Azure Language offers task-specific APIs that follow a simple call pattern: create a resource, send text through REST or an SDK, authenticate with a key or Microsoft Entra ID, and read the JSON response. Prebuilt features need no training.\n\nLanguage detection answers \"what language is this text?\" for each document. The result has a language name, an ISO code (for example fr) and a confidence score. Mixed-language or very short text lowers confidence, so set a rule for low-confidence results.\n\nUse it before routing, translating or choosing a model. Other features answer different questions: key phrases (main concepts), sentiment (feeling), NER (people, places, organizations) and PII (personal data).\n\nLanguage detection, NER, PII detection and text analytics for health are listed among the core capabilities; several others carry a retirement notice for March 31, 2029.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A developer registers a webhook for batch transcription. The service sends a validation request containing a `validationToken`, and the registration fails. What must the endpoint do?", "o": [{"t": "Return the token inside a JSON object with an error code", "c": false, "e": "The token must be returned as plain text."}, {"t": "Return the validation token as plain text in the response", "c": true, "e": "The endpoint must echo the token back so the service can confirm that it owns the URL."}, {"t": "Return an empty response with status 200", "c": false, "e": "The service needs the token echoed back to validate the endpoint."}, {"t": "Store the token and return it only after the transcription finishes", "c": false, "e": "The validation happens at registration, not at completion."}], "concept": "Batch transcription is asynchronous. You submit a job with options such as `diarizationEnabled`, `languageIdentification` (2 to 10 candidate locales), `timeToLiveHours` (6 hours to 31 days) and a destination container, then you wait. You can poll the job, or register a webhook so the service calls you when the job finishes.\n\nWhen a webhook is registered, the service first checks that you control the endpoint. It sends a validation request with a `validationToken`, and your endpoint must reply with that token as plain text. If it does not, registration fails.\n\nThe result files contain text, timestamps and speaker labels. Remember the common failures: diarization on stereo files (it needs mono), more than 10 candidate locales, results deleted after the time-to-live, and storage permissions.\n\nA webhook saves polling traffic and gives a faster reaction.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/batch-transcription-create"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A contact center must transcribe thousands of stereo call recordings stored in Blob Storage and label which speaker said what. Results can arrive later. Which approach should you use?", "o": [{"t": "Text to speech with a custom voice", "c": false, "e": "Text to speech creates audio from text."}, {"t": "Batch transcription with diarization enabled on mono audio", "c": true, "e": "Batch transcription is asynchronous and built for many or long files. Diarization needs mono audio, so convert the stereo files first."}, {"t": "Fast transcription, one synchronous call per file", "c": false, "e": "Fast transcription returns results immediately for a single file. For thousands of archived files where results can arrive later, asynchronous batch transcription is the better fit."}, {"t": "Real-time speech recognition with the Speech SDK", "c": false, "e": "Real-time recognition is meant for live audio and commands, not for archives."}], "concept": "Speech to text has three common modes.\n\nReal-time recognition processes a live audio stream and returns text as it arrives. Fast transcription is a synchronous API that returns the transcript of one file quickly, without the batch queue. Batch transcription is asynchronous: you submit many files (for example a Blob container), the service processes them in the background, and results are written to storage. When the results can arrive later and the volume is large, batch is the right choice.\n\nDiarization labels who spoke. It works on mono audio: the service separates speakers (two speakers with `diarizationEnabled`, three or more with min and max speaker counts). If the recording is stereo with each speaker on a separate channel, you can instead transcribe the channels separately, since the channel already identifies the speaker.\n\nText to speech goes in the opposite direction, from text to audio.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/batch-transcription-create"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A company uses batch document translation with a Translator resource that has a virtual network and private endpoints enabled. Calls fail when the application uses an access token against the regional endpoint. What is the correct approach?", "o": [{"t": "Use the custom domain endpoint, because access tokens cannot be used with VNet or private endpoints", "c": true, "e": "With VNet or private endpoints enabled, you must use the custom endpoint and cannot use an access token."}, {"t": "Disable layout preservation", "c": false, "e": "Layout does not influence the endpoint type."}, {"t": "Move the files to a public container", "c": false, "e": "Batch translation uses blob containers with SAS tokens or managed identity, and a public container does not solve the endpoint issue."}, {"t": "Switch to a bearer token with a longer lifetime", "c": false, "e": "Access tokens are not usable in this configuration."}], "concept": "Document translation has two modes. Batch (asynchronous) handles many or large files: the source and target are blob containers, access uses SAS tokens or managed identity (identity is preferred), and glossary files can be CSV, XLIFF or TSV. Synchronous translation handles one file and returns the result directly; it needs a custom-domain endpoint and no storage account.\n\nFormat and layout are preserved, and scanned PDFs go through OCR. Content is processed in the region of the Translator resource.\n\nWhen a virtual network or private endpoints are enabled on the Translator resource, you must use the custom endpoint and you cannot use an access token. The same custom-domain endpoint is required for synchronous translation.\n\nFor authentication in general, Microsoft Entra ID with a managed identity is preferred in enterprises because no secret has to be stored.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/document-translation/overview", "https://learn.microsoft.com/en-us/azure/ai-services/translator/overview"], "ref": ["translation"]}, {"d": 4, "q": "A router uses Azure Language detection on very short chat messages such as \"ok\" or \"ja/yes\". It frequently returns low-confidence results. What is the correct handling?", "o": [{"t": "Increase the search service replicas", "c": false, "e": "Replicas are unrelated."}, {"t": "Treat low-confidence results as uncertain, for example by falling back to the user's profile language or asking, because mixed or very short text lowers confidence", "c": true, "e": "The confidence score is part of the output and should drive a rule."}, {"t": "Ignore the confidence score and always trust the first result", "c": false, "e": "Short text is exactly where the score matters."}, {"t": "Replace language detection with sentiment analysis", "c": false, "e": "Sentiment does not identify language."}], "concept": "Language detection returns, for each document, the language name, an ISO code (for example fr) and a confidence score. \"Bonjour tout le monde\" returns fr with confidence 1.0. Mixed-language or very short text lowers confidence.\n\nThe score exists so that your application can act on uncertainty. Typical rules: above a threshold, route automatically; below it, use another signal such as the browser or profile language, ask the user, or use a longer piece of context such as the last few messages.\n\nLanguage detection is one of the core Azure Language capabilities without a retirement notice, together with PII detection, named entity recognition and text analytics for health.\n\nDetect the language before routing, translating or choosing a model, and log the confidence so that you can tune thresholds.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A legal team must redact personal data from thousands of PDF and DOCX documents asynchronously. Which Azure Language capability handles documents?", "o": [{"t": "Sentiment analysis", "c": false, "e": "It labels sentiment only."}, {"t": "PII detection for documents, which is asynchronous and supports PDF, DOCX and TXT", "c": true, "e": "PII detection works on text, conversations and documents."}, {"t": "Language detection", "c": false, "e": "It does not redact data."}, {"t": "Key phrase extraction", "c": false, "e": "It does not redact data."}], "concept": "Azure Language PII detection handles different inputs. For short text it can be called directly. For documents (PDF, DOCX and TXT files), PII detection for documents works asynchronously: you submit documents (typically from Blob Storage), the service processes them in the background, and you collect the redacted documents and results later.\n\nThis fits a legal team with thousands of PDF and DOCX files. The result contains the redacted text or document and the detected entities, and you can choose the redaction style (for example mask characters or entity labels).\n\nLanguage detection returns a language code. Key phrase extraction lists key phrases. Sentiment analysis scores opinion. None of them redacts personal data.\n\nProcess notes: check recall of PII detection on a labeled sample (a missed number is the main risk), restrict access to the output, and apply retention rules to both the originals and the redacted copies.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A localization pipeline sends 2,000 short text segments in one Translate request that uses standard neural machine translation (NMT). The request is rejected. What is the likely limit, and what is the fix?", "o": [{"t": "NMT accepts only 10 elements; send 200 requests", "c": false, "e": "The limit is 1,000, not 10."}, {"t": "There is no limit, so wait and retry", "c": false, "e": "The limit exists and retrying will not change it."}, {"t": "The LLM path accepts 5,000 elements, so switch to it", "c": false, "e": "The LLM path is stricter, with 50 elements."}, {"t": "NMT accepts up to 1,000 array elements per request, so split the batch into two requests", "c": true, "e": "2,000 exceeds the limit of 1,000 elements."}], "concept": "The Translate operation in the `2026-06-06` API takes an `inputs` array and returns a `value` array. The limits depend on the model path. With NMT (neural machine translation), you can send up to 1,000 array elements, each up to 50,000 characters. With an LLM deployment, you can send up to 50 elements, each up to 5,000 characters. LLM translation needs a Foundry resource.\n\nBilling also differs: NMT is billed per source character; LLM translation is billed per input and output token.\n\nA sensible decision is to keep high-volume baseline traffic on NMT and send text to an LLM only where tone, context or adaptive behavior matters. LLM options include tone (formal, informal, neutral), gender and adaptive custom translation with up to five reference translations.\n\nFor large jobs, chunk the array, handle each response, and keep a cache keyed by the source hash.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/overview"], "ref": ["translation"]}, {"d": 4, "q": "A team wants customers to talk to an agent by voice with low latency, natural interruptions (barge-in) and end-of-turn detection, and wants as few moving parts as possible. Which solution fits?", "o": [{"t": "Fast transcription with a custom voice", "c": false, "e": "Fast transcription is a synchronous single-file call."}, {"t": "Document translation with a glossary", "c": false, "e": "It translates files and is unrelated to voice interaction."}, {"t": "Batch transcription feeding a model and a separate synthesis call", "c": false, "e": "Batch is asynchronous, so it cannot support real-time conversation."}, {"t": "Voice Live, a managed WebSocket API that bundles speech to text, a model, text to speech, noise suppression and interruption detection", "c": true, "e": "It is the current path for low-latency voice agents."}], "concept": "A voice agent has several jobs: listen (speech to text), think (a model), speak (text to speech), and manage the conversation (detect when the person has finished, allow interruptions, suppress noise). Building these as separate parts means more integration, more latency and more failure points.\n\nVoice Live is a managed API over WebSocket that bundles all of this: speech recognition, a generative model (including native speech-to-speech models), text to speech, noise suppression and echo cancellation, interruption (barge-in) handling and end-of-turn detection. You stream audio in and receive audio out, with low latency and few moving parts.\n\nBatch transcription feeding a model and a separate synthesis call is slow and not live. Fast transcription with a custom voice still lacks conversation management. Document translation with a glossary is unrelated.\n\nChoose a cascaded design (separate speech to text, model, text to speech) only if you need explicit control of each stage, for example phrase lists or a specific text model.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/voice-live"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A developer sends SSML for text to speech that contains the text `Terms & Conditions apply`. The synthesis request fails with an XML error. What is the likely cause?", "o": [{"t": "SSML does not allow the word Terms", "c": false, "e": "Words are not the problem."}, {"t": "The voice is in the wrong region only if it is an HD voice", "c": false, "e": "Region problems return different errors."}, {"t": "The `&` character is not escaped, and SSML is XML", "c": true, "e": "Special characters such as `&` must be escaped (for example as `&amp;`)."}, {"t": "SSML requires all text to be uppercase", "c": false, "e": "There is no such rule."}], "concept": "SSML (Speech Synthesis Markup Language) is XML that controls speech: rate, pitch and volume with `prosody`, pauses with `break`, pronunciation with `phoneme` and lexicons, voice or style changes inside one document, and the language for multilingual voices.\n\nBecause SSML is XML, the text inside it must follow XML rules. A raw `&` or `<` breaks the document. Escape them as `&amp;` and `&lt;`. Typical SSML failures: a tag that is not supported for the chosen voice (some tags are not supported for HD voices, personal voices and embedded voices), a wrong voice name for the region, and unescaped characters.\n\nBilling counts characters, including SSML markup except `<speak>` and `<voice>`, so verbose markup costs money.\n\nValidate the SSML as XML before sending it.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/text-to-speech"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A legal team has 3,000 approved bilingual segment pairs and wants an LLM-based translation to follow their terminology within minutes, without training a new neural model. Which option should you use?", "o": [{"t": "Voice Live", "c": false, "e": "It is a real-time voice agent API."}, {"t": "Adaptive custom translation, which builds an index from 5 to 10,000 aligned pairs", "c": true, "e": "It adapts LLM translation style and terminology quickly with a small bilingual set."}, {"t": "Custom Translator trained as an NMT system", "c": false, "e": "This is for a large parallel corpus and needs training and BLEU evaluation."}, {"t": "Language detection", "c": false, "e": "It identifies the source language only."}], "concept": "Azure Translator can be customized in several ways, with different data needs and effort.\n\nAdaptive custom translation builds a small index from 5 to 10,000 aligned bilingual pairs (each up to 500 characters). At translation time, it finds the most similar approved pairs and gives them to a supported LLM as examples, so terminology and style follow your domain. It is ready in minutes because nothing is trained. 3,000 approved pairs fit the range.\n\nCustom Translator trains a full custom NMT (neural machine translation) system, which needs a larger parallel corpus, a training run, a BLEU score review and publishing. It is the right choice for a large corpus and a stable domain, not for a quick start.\n\nLanguage detection only identifies the language. Voice Live is a speech conversation API.\n\nGlossaries are a third tool: fixed term mappings for document translation, ideal for product names.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/overview"], "ref": ["translation"]}, {"d": 4, "q": "A company wants a voice agent that customers can reach by phone number. The team asks whether Voice Live offers a direct SIP connection to the telephone network. What is the documented position?", "o": [{"t": "Voice Live only works with web browsers and cannot use telephony", "c": false, "e": "Telephony is supported through Teams Phone extensibility or Twilio."}, {"t": "Direct SIP is not offered; telephony works through Teams Phone extensibility or Twilio", "c": true, "e": "Voice Live is a WebSocket API, and telephony is reached through those integrations."}, {"t": "Direct SIP trunking is built in and enabled by default", "c": false, "e": "Direct SIP is not offered."}, {"t": "Phone calls require replacing Voice Live with the Translator service", "c": false, "e": "Translator does not provide voice agent telephony."}], "concept": "Voice Live is a managed WebSocket API for speech-to-speech conversation. It bundles speech to text, a model, text to speech, noise suppression, echo cancellation, and interruption and end-of-turn detection. It supports function calling (for example voice RAG), avatars, 140+ speech-to-text locales and 600+ voices, with Pro, Standard and Lite tiers.\n\nFor telephony, the documented routes are Teams Phone extensibility or Twilio. A direct SIP connection is not offered. So a design that must receive phone calls adds a telephony bridge in front of Voice Live.\n\nWhy use Voice Live rather than wiring speech to text, a model and text to speech yourself: lower latency and fewer moving parts. The cost is less control over each stage.\n\nOlder material may mention Direct Line Speech; the Learn URL for it now redirects to the Voice Live overview, so Voice Live is the current path.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/voice-live"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A manager uploads one 40-minute recording and wants the transcript right away in a single synchronous call. The file is well under 2 hours and 300 MB. Which Speech to text mode fits?", "o": [{"t": "Fast transcription", "c": true, "e": "It is synchronous, returns the result for one file immediately and supports files under about 2 hours and 300 MB."}, {"t": "Text to speech", "c": false, "e": "It converts text to audio."}, {"t": "Real-time transcription with the Speech SDK", "c": false, "e": "It is for live audio that is heard as it is spoken."}, {"t": "Batch transcription", "c": false, "e": "It is asynchronous and meant for many or long files, with results written to storage."}], "concept": "Speech to text has three modes, and the choice depends on timing and volume.\n\nFast transcription is a synchronous API: you send one audio file and get the transcript in the same response, usually much faster than the audio length. It supports files up to about two hours and 300 MB, which fits a 40-minute recording. Batch transcription is asynchronous and meant for many or large files in storage, with results later. Real-time transcription processes a live stream and returns text as people speak. Text to speech goes the other direction.\n\nA manager with one file who wants the answer \"right away in a single call\" is exactly the fast transcription case. Batch would add a queue and polling. Real-time with the SDK is for live audio, not for a stored file.\n\nMemory aid: fast = one file, one call; batch = a pile of files, come back later; real-time = a live conversation.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/overview"], "ref": ["speech-solutions"]}, {"d": 4, "q": "Product names in your recordings are often misheard by the base speech model. You also use batch transcription for the work. What is the recommended approach?", "o": [{"t": "Measure the word error rate (WER) of the base model on real audio; if it is high, train a custom speech model. Batch transcription does not need a deployed custom endpoint", "c": true, "e": "Custom speech improves recognition for domain vocabulary. WER tells you whether training is worthwhile, and batch transcription can use the custom model without a hosted endpoint."}, {"t": "Always deploy a custom endpoint, because batch transcription requires one", "c": false, "e": "Batch transcription is the exception that does not need a deployed endpoint."}, {"t": "Use speech translation with two target languages", "c": false, "e": "Translation does not fix misheard words."}, {"t": "Switch to text to speech with SSML phonemes", "c": false, "e": "SSML is for speech synthesis, not recognition."}], "concept": "Custom speech lets you adapt recognition to your vocabulary, accents and noise by training on your own audio and text. It costs training time and, for real-time use, a hosted endpoint.\n\nA good process is measure first. Word error rate (WER) is the share of words that are wrong (substitutions, deletions, insertions) compared with a human reference transcript. Compute WER of the base model on real recordings. If it is low, you are done; if product names push it high, a lightweight step such as a phrase list may fix it, and if not, train a custom model.\n\nBatch transcription can use a custom model without a deployed endpoint, so you do not pay for hosting just to process files. A real-time application, by contrast, needs a deployed endpoint.\n\nText to speech with SSML phonemes controls pronunciation of output, not recognition. Speech translation changes language and does not repair misheard names.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/custom-speech-overview"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A developer gets HTTP 403 from the Translator service while the key is valid and other operations work. Which statement matches the troubleshooting guidance?", "o": [{"t": "403 means the key is missing", "c": false, "e": "That is 401."}, {"t": "403 means valid credentials but an unsupported operation or configuration; 401 means a bad or missing key, 429 means a rate limit and 400 means an invalid payload or unsupported language", "c": true, "e": "Read the status code to find the category of the problem."}, {"t": "403 means the request body is invalid", "c": false, "e": "That is 400."}, {"t": "403 means the rate limit was exceeded", "c": false, "e": "That is 429."}], "concept": "HTTP status codes tell you what kind of problem you have, and Translator troubleshooting guidance maps them clearly.\n\n401 Unauthorized: the key or token is missing or wrong. 403 Forbidden: the credentials are valid, but the operation or configuration is not supported or not allowed, for example a feature that your resource type, region or network setup does not allow. 429 Too Many Requests: a rate limit was exceeded, so retry with backoff. 400 Bad Request: the payload is invalid or the language is not supported.\n\nA valid key with a working different operation and a 403 on one operation points to a configuration or capability mismatch: for example, asking for LLM translation on a resource that is not a Foundry resource, or using the wrong endpoint with a private network.\n\nDebug steps: check the operation and API version, the resource type and region, the endpoint (custom endpoint for private networks), and the model choice.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/overview"], "ref": ["translation"]}, {"d": 4, "q": "A new project needs to pull the main concepts from thousands of customer reviews. A colleague suggests Azure Language key phrase extraction. What should you consider according to the retirement notices on Microsoft Learn?", "o": [{"t": "Key phrase extraction retires from Azure Language on March 31, 2029, and new projects are directed to Foundry models", "c": true, "e": "The feature works until then, but Microsoft's direction for new work is an LLM on Foundry."}, {"t": "Key phrase extraction was removed last year and no longer works", "c": false, "e": "The retirement date is in 2029, so it still works today."}, {"t": "Key phrase extraction requires custom training data for every language", "c": false, "e": "It is a prebuilt feature with no customization."}, {"t": "Key phrase extraction is a core feature with no retirement notice", "c": false, "e": "It carries a retirement banner on Learn."}], "concept": "\"Retire\" does not mean \"removed today\". Several Azure Language features carry an Important banner: sentiment analysis and opinion mining, summarization, key phrase extraction, conversational language understanding and custom question answering all retire from Azure Language on March 31, 2029. They work until then, but new projects are directed to Foundry models.\n\nThe core features without a retirement banner on the pages read are PII detection, language detection, named entity recognition and text analytics for health.\n\nFor a new project that needs key phrases, a Foundry model with a clear prompt and a Structured Outputs schema is the recommended path. For an existing system, the feature keeps working, and you should plan the migration.\n\nKey phrase extraction has no customization: it returns the main concepts of unstructured text as is.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/key-phrase-extraction/overview", "https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "An enterprise bot needs a calendar skill (intent and entity extraction) and an FAQ from product manuals, and must send each user utterance to the correct one. Which Azure Language capability routes between them?", "o": [{"t": "Orchestration workflow, which routes an utterance to the right CLU or custom question answering project", "c": true, "e": "It is designed for bots that combine a CLU skill with an FAQ."}, {"t": "Sentiment analysis", "c": false, "e": "It labels sentiment, not routing."}, {"t": "Named entity recognition", "c": false, "e": "It extracts entities only."}, {"t": "Language detection", "c": false, "e": "It identifies language, not intent routing."}], "concept": "An enterprise bot often combines several language projects. Conversational language understanding (CLU) predicts intent and entities for actions such as \"book a meeting with Dana at 3\". Custom question answering returns answers from a knowledge base such as product manuals.\n\nWhen an utterance arrives, something must decide which project should handle it. An orchestration workflow is the Azure Language project type for this. You connect the child projects (CLU and custom question answering), and train the workflow with examples of utterances for each. At run time it predicts which child project fits the utterance and routes it, returning that project's result.\n\nNamed entity recognition extracts entities from text, language detection returns the language, and sentiment analysis scores opinion. None routes between projects.\n\nMemory aid: the orchestration workflow is the receptionist who sends each visitor to the right department.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A call-center team wants a summary of each support call that states the customer's issue and how it was resolved, in separate fields. Which Azure Language capability is designed for this shape of output?", "o": [{"t": "Extractive summarization of a document", "c": false, "e": "It selects important original sentences and does not label issue and resolution."}, {"t": "Custom named entity recognition", "c": false, "e": "It extracts domain entities and does not summarize."}, {"t": "Language detection", "c": false, "e": "It identifies the language of text."}, {"t": "Conversation summarization with aspects such as issue and resolution", "c": true, "e": "It produces aspect-based summaries of conversations."}], "concept": "Summarization in Azure Language has several forms. Extractive summarization selects the most important original sentences, with a rank score and positions. Abstractive summarization writes new sentences. Conversation summaries produce aspects such as issue, resolution, chapter title, narrative and recap. Document summarization is in preview and accepts txt, pdf and docx, with results retrievable for 24 hours.\n\nFor a call center, the issue-and-resolution shape is the conversation aspect output. It is already organized into fields.\n\nRetirement note: summarization retires from Azure Language on March 31, 2029, and new projects are directed to Foundry models. With an LLM you would define a Structured Outputs schema with `issue` and `resolution` fields, a low temperature and an `unknown` option for unclear calls.\n\nRun PII detection first so that the summary does not carry personal data.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A voice assistant reads order confirmations aloud with Azure AI Speech. You must slow down only the phrase \"ships tomorrow\" and add a short pause after it. What should you use?", "o": [{"t": "SSML with a `prosody` element for the rate and a `break` element for the pause", "c": true, "e": "SSML is XML that controls synthesis. `prosody` changes rate, pitch and volume, and `break` inserts pauses."}, {"t": "Batch transcription with diarization", "c": false, "e": "This converts audio to text and has no effect on synthesis."}, {"t": "A custom speech model trained on order data", "c": false, "e": "Custom speech improves recognition (speech to text), not how text is spoken."}, {"t": "A lower `temperature` value on the synthesis request", "c": false, "e": "Temperature is a model sampling parameter and does not control speaking rate."}], "concept": "SSML (Speech Synthesis Markup Language) is an XML format that controls how text to speech sounds: voice, speed, pitch, pauses and pronunciation. You send SSML instead of plain text.\n\nTo change only a phrase you wrap it in a `<prosody>` element with a `rate` attribute (for example slower), and add a `<break time=\"500ms\"/>` element where you want a pause. Everything outside the element keeps the default delivery.\n\nWhy the others fail: a custom speech model is for recognition (speech to text), not for how output sounds; batch transcription with diarization turns audio into text; and `temperature` belongs to language models, not to speech synthesis.\n\nExample:\n```xml\n<speak version=\"1.0\" xml:lang=\"en-US\"><voice name=\"...\">Your order <prosody rate=\"-20%\">ships tomorrow<\/prosody><break time=\"400ms\"/>.<\/voice><\/speak>\n```\nMemory aid: SSML is stage directions for the voice actor.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/text-to-speech"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A call-center app translates live speech into four languages at the same time with the Speech service. Which statement is correct?", "o": [{"t": "Speech translation supports unlimited targets with no extra cost", "c": false, "e": "There is a limit of two direct targets."}, {"t": "Only Translator document translation can handle live audio", "c": false, "e": "Document translation handles files."}, {"t": "Speech translation cannot be used with custom speech models", "c": false, "e": "Custom speech models can be used with speech translation."}, {"t": "The Speech service translates directly into two target languages; for more, use a Foundry (multi-service) resource, where translation fees apply for each language beyond the second", "c": true, "e": "This is the documented limit for speech translation."}], "concept": "The Speech service can translate speech directly into up to two target languages in one request. This limit is part of the service design and cost model.\n\nFor four languages, use a Foundry (multi-service) resource. With it, additional target languages are possible, and translation fees apply for each language beyond the second. So the claims of unlimited targets at no extra cost are wrong.\n\nCustom speech models can be used with speech translation (they improve recognition of your vocabulary), so the claim that they cannot be used is wrong. Translator document translation works on documents, and not on live audio.\n\nFor live meetings, also remember Live Interpreter, which detects the spoken language automatically and switches.\n\nPlan costs: each extra target language increases cost per minute of audio, so confirm that all four are really needed.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/speech-translation"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A bank must translate 800 PDF contracts nightly, preserving layout, using a glossary for approved terms. The Translator resource has a private endpoint and VNet access enabled. Which statement is correct?", "o": [{"t": "Use speech translation", "c": false, "e": "It handles audio."}, {"t": "Use synchronous document translation for all 800 files", "c": false, "e": "Synchronous translation handles one file and returns the result directly."}, {"t": "Use Transliterate", "c": false, "e": "It converts script, not languages."}, {"t": "Use batch document translation with Blob containers (managed identity preferred) and a glossary file, and call the custom endpoint, because access tokens cannot be used when VNet or private endpoints are enabled", "c": true, "e": "Batch handles many files, glossaries come as CSV, XLIFF or TSV, and private networking requires the custom endpoint."}], "concept": "Document translation translates whole files while keeping layout and format. It has two modes. Batch (asynchronous) is for many or large files: the source and target are Blob containers, you prefer managed identity over SAS tokens, and you can attach a glossary file (CSV, XLIFF or TSV) for approved terms. Synchronous mode translates one file at a time and returns it directly; it needs no storage account.\n\nEight hundred PDF contracts each night are a batch job. Contracts need consistent approved terminology, so use a glossary.\n\nThe Translator resource has a private endpoint and VNet access. In that configuration the global endpoint and access tokens cannot be used. You call the resource's custom endpoint, and use key-based or other supported authentication.\n\nTransliterate converts scripts, not languages. Speech translation is for audio. Synchronous mode for 800 files would be slow and awkward.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/overview"], "ref": ["translation"]}, {"d": 4, "q": "A custom conversational language understanding (CLU) model trained on labeled utterances confuses two similar intents in production. Which factor does the guidance describe as the main driver of accuracy for the custom path?", "o": [{"t": "The quality and coverage of the labeled utterances, so add and correct labels for the confusing intents", "c": true, "e": "Data labeling quality is the main driver of accuracy."}, {"t": "The resolution of the audio input", "c": false, "e": "CLU works with text utterances."}, {"t": "The number of replicas of the search service", "c": false, "e": "CLU does not use search replicas."}, {"t": "The length of the project name", "c": false, "e": "Names do not affect accuracy."}], "concept": "Conversational language understanding predicts the intent of an utterance and extracts entities. It does not perform actions. There are two paths. The LLM-powered quick deploy path: define the schema with intents and descriptions, deploy, and predict intents and prebuilt entities. The custom machine-learned path: define the schema, label utterances, train, view the evaluation, improve, deploy and predict.\n\nIn the custom path, the quality of the labeled data drives the result. If two intents (for example \"cancel order\" and \"return item\") overlap, add varied, correctly labeled examples for each, check the evaluation view for confusion, and retrain.\n\nFor an enterprise bot with a calendar skill (CLU) and an FAQ (custom question answering), an orchestration workflow routes the utterance to the right project.\n\nRetirement note: CLU retires from Azure Language on March 31, 2029, and new projects are directed to Foundry models.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/conversational-language-understanding/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A product owner wants a summary made of the most important original sentences of a long support article, with a rank score and sentence positions, and no newly written text. Which type of summarization is this?", "o": [{"t": "Extractive summarization", "c": true, "e": "It selects the most important original sentences and returns rank scores and positions."}, {"t": "Opinion mining", "c": false, "e": "It assigns sentiment to aspects and does not summarize."}, {"t": "Abstractive summarization", "c": false, "e": "It writes new sentences."}, {"t": "Key phrase extraction", "c": false, "e": "It returns phrases, not sentences."}], "concept": "Summarization has two main styles.\n\nExtractive summarization selects the most important sentences from the original text and returns them unchanged. Each selected sentence comes with a rank score and its position (offset), so you can highlight it in the source. No new text is written, so nothing is invented.\n\nAbstractive summarization writes new sentences that paraphrase the content, like a human summary. It reads more smoothly but can introduce errors, and there is no sentence position to point to.\n\nKey phrase extraction returns short phrases, not sentences. Opinion mining returns sentiment about targets.\n\nThe requirement here is \"the most important original sentences\", \"rank score and sentence positions\" and \"no newly written text\". Each clue points to extractive summarization.\n\nMemory aid: extractive = highlighter pen; abstractive = write your own summary in your own words.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A practice question offers \"Direct Line Speech\" and \"Voice Live\" as ways to give a bot a low-latency voice channel with barge-in. The Learn page for Direct Line Speech now redirects to the Voice Live overview. How should you treat this?", "o": [{"t": "Assume Direct Line Speech is the only valid answer in every case", "c": false, "e": "The documentation now points to Voice Live."}, {"t": "Use batch transcription for the voice channel", "c": false, "e": "Batch is asynchronous."}, {"t": "Assume neither supports barge-in", "c": false, "e": "Voice Live supports interruption detection."}, {"t": "Treat Direct Line Speech as a legacy route and Voice Live as Microsoft's current path, and read which options the question actually offers", "c": true, "e": "Older exam material may still expect Direct Line Speech, so the wording of the options decides."}], "concept": "Products change, and exams test current guidance. Direct Line Speech was a way to give a Bot Framework bot a voice channel. Its Learn page now redirects to the Voice Live overview, which signals that Voice Live is Microsoft's current path for low-latency voice agents with barge-in.\n\nHow to answer a question that lists both: if the question asks for the current or recommended approach, choose Voice Live. If it explicitly describes a legacy Bot Framework solution, Direct Line Speech may still be the technical answer. Read what the question actually offers and requires; do not assume a single answer in every case.\n\nBatch transcription is for recorded files and is not a live voice channel. Both options can support barge-in in the scenario, so claiming that neither supports it is wrong.\n\nPractical habit: check the date and the status of a feature on Microsoft Learn before you design around it.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/voice-live"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A batch transcription job must label speakers in a meeting with 6 participants, using mono audio. Which setting should you use?", "o": [{"t": "Diarization with minimum and maximum speaker counts (up to 35 speakers) instead of the simple two-speaker setting", "c": true, "e": "`diarizationEnabled` handles two speakers, and min/max settings handle three or more on mono audio."}, {"t": "Stereo audio with diarization", "c": false, "e": "Diarization needs mono audio."}, {"t": "`diarizationEnabled` only", "c": false, "e": "It is for two speakers."}, {"t": "Text to speech with six voices", "c": false, "e": "It produces audio and does not label speakers in a recording."}], "concept": "Diarization labels who spoke when. The simple setting `diarizationEnabled: true` is made for two speakers. For three or more, you add the diarization property with the minimum and maximum number of speakers (up to 35). For a meeting with 6 participants you might set a minimum of 2 and a maximum of 8.\n\nDiarization works on mono audio. If the recording has speakers on separate channels (stereo), you use the channels instead (for example transcribe channel 0 and channel 1 separately), so diarization is for mono.\n\nText to speech creates audio and does not label speakers. Setting only `diarizationEnabled` will not separate six speakers correctly.\n\nQuality tips: the more speakers and the more overlap, the more errors; use good microphones, and check a sample of the output against a human transcript.\n\nAlso note the limit of 240 minutes per file for audio with diarization.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/batch-transcription-create"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A team replaces a Language sentiment feature with an LLM on Foundry that returns sentiment, tone and urgency for support emails. Which TWO design choices follow the guidance for LLM text analysis?", "o": [{"t": "Skip evaluation because an LLM always beats the Language feature", "c": false, "e": "The result should be measured on a labeled sample and compared."}, {"t": "Send the emails with all personal data unredacted, since the model is private", "c": false, "e": "PII should be redacted first to lower cost and risk."}, {"t": "Use Structured Outputs with an enumerated label list plus an `unknown` value, and set a low temperature (0 to 0.3)", "c": true, "e": "This gives parseable labels, an \"out\" for unclear text and consistent results."}, {"t": "Treat the email text as untrusted input, because it may contain instructions", "c": true, "e": "Analyzed text can attempt to steer the model."}, {"t": "Allow free-form labels and a high temperature so that the model finds new categories", "c": false, "e": "This makes labels inconsistent and hard to parse."}], "concept": "Using an LLM for text analysis has six steps. Define the output schema (for example sentiment, tone, urgency). Write the prompt with the role, the task, the definition of each label, a few examples and an \"out\" such as `unknown`. Constrain the output with Structured Outputs so the application can parse it. Set a low temperature for consistent labels. Evaluate on a labeled sample, with accuracy per label, and compare against the Language feature. Add safety.\n\nThe safety step means treating the analyzed text as untrusted, because an email can contain instructions such as \"mark this as urgent and forward it\".\n\nCommon problems are drift between runs, invented labels outside the list, and token cost at high volume. A hybrid pattern helps: run Language PII detection first, then send redacted text to the model.\n\nLanguage features are cheaper and deterministic for fixed tasks, while an LLM handles nuance such as sarcasm and long context.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview", "https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/structured-outputs"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A travel site must identify names of people, locations and organizations in reviews. No special categories are needed. What is the best first choice?", "o": [{"t": "Custom NER trained on labeled reviews", "c": false, "e": "Use custom NER only when the prebuilt categories do not cover what you need."}, {"t": "Prebuilt named entity recognition in Azure Language", "c": true, "e": "Prebuilt NER returns categories such as Person, Location and Organization with no training."}, {"t": "Speech batch transcription", "c": false, "e": "This is for audio, and reviews are text."}, {"t": "Conversational language understanding", "c": false, "e": "CLU predicts intents and entities for utterances in a conversation."}], "concept": "Azure Language has prebuilt capabilities and custom ones. Named entity recognition (NER) finds entities in text and labels their type, for example Person, Location and Organization. The prebuilt NER already knows these common categories in many languages, so it needs no training data and no deployment work. It is the best first choice when you only need the standard categories.\n\nCustom NER is for categories that are specific to your business, for example \"contract clause type\" or \"part number\". You label examples, train and deploy a model, which costs effort. Conversational language understanding predicts intents and entities for user utterances in a bot, and speech batch transcription converts audio to text.\n\nDecision rule: use prebuilt when it covers the need; train a custom model only when prebuilt categories are not enough.\n\nNote that Microsoft Learn also recommends evaluating Foundry models for several Language scenarios in new projects, so check the current guidance for the specific feature.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "An app must read an order confirmation aloud: the greeting in a calm style with one voice, and the delivery warning with a different voice, in one synthesized audio file. Which Speech feature supports switching voice or style inside one document?", "o": [{"t": "Batch transcription diarization", "c": false, "e": "It labels speakers in recordings."}, {"t": "SSML, which can change voice, style, rate, pitch and pauses inside one document", "c": true, "e": "SSML is XML that controls speech output."}, {"t": "Custom speech word error rate", "c": false, "e": "It measures recognition accuracy."}, {"t": "Translator transliteration", "c": false, "e": "It converts scripts."}], "concept": "SSML (Speech Synthesis Markup Language) is XML that controls how text is spoken. Typical uses: change rate, pitch and volume with `prosody`; insert pauses with `break`; fix pronunciation with `phoneme` and lexicons; switch voice or style inside one document with `voice` elements; and set the language for multilingual voices.\n\nFor this order confirmation, put each part in its own `voice` element or style, and add a `break` between them. Pick real voice names from the voice gallery for your region.\n\nPractical rules: SSML is XML, so escape `&` as `&amp;`; some tags are not supported for HD voices, personal voices and embedded voices; billing counts characters, including markup except `<speak>` and `<voice>`, and each Chinese character counts as two.\n\nCustom voices (professional voice fine-tuning, personal voice) are limited access and need approval, voice talent consent and disclosure to listeners.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/text-to-speech"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A voice team uses HD voices and wants to use all SSML tags they used with standard neural voices. What should they know?", "o": [{"t": "Some SSML tags are not supported for HD voices, personal voices and embedded voices, so test the markup with the chosen voice", "c": true, "e": "This is a documented limitation."}, {"t": "HD voices cannot be used with SSML at all", "c": false, "e": "Some SSML tags are supported."}, {"t": "SSML is only for speech recognition", "c": false, "e": "SSML controls speech synthesis."}, {"t": "All SSML tags work identically for all voices", "c": false, "e": "This is not true for HD voices."}], "concept": "SSML (Speech Synthesis Markup Language) controls speech synthesis: voice, rate, pitch, pauses, pronunciation, styles. Not every feature is available on every voice type.\n\nStandard neural voices support a broad set of SSML tags. HD voices, personal voices and embedded voices (voices that run on a device) do not support some tags. So if a team moves from standard neural voices to HD voices, some of the markup they relied on can be ignored or fail.\n\nThe right practice: check the documentation for the chosen voice type, and test the markup with that voice by listening to the result. Keep a small set of test sentences that exercise each tag.\n\nHD voices can be used with SSML, and SSML is for synthesis (text to speech), not for recognition.\n\nMemory aid: different instruments read the same sheet music a little differently; play it on the instrument you will perform with.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/text-to-speech"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A team builds an LLM-powered translation flow for product descriptions that contain placeholders such as `{order_id}` and prices. Which TWO steps follow the recommended flow?", "o": [{"t": "Skip all checks, because LLM output never changes placeholders", "c": false, "e": "Models can alter or drop placeholders."}, {"t": "Cache translations by source hash so unchanged text is not re-translated", "c": true, "e": "This saves cost and keeps stable output."}, {"t": "Set a high temperature to make wording more varied", "c": false, "e": "Translation needs a low temperature and consistent output."}, {"t": "Check the output for intact placeholders, numbers, glossary hits and length before using it", "c": true, "e": "Automated checks catch broken placeholders and number changes."}, {"t": "Send high-risk legal text to production without any human review", "c": false, "e": "High-risk content should be reviewed by a person."}], "concept": "An LLM translation flow has six steps. Detect the source language (Translator or Language detection). Build the prompt: target language, tone, audience, glossary and a \"do not translate\" list. Call the model with a low temperature, and request structured output when segments must align. Check the result: placeholders, numbers, glossary hits and length. Review high-risk content with a person. Cache by source hash so unchanged text is not re-translated.\n\nThe check step is where most production bugs are caught. A model may rewrite `{order_id}`, change a price format or drop a sentence. Automated tests compare placeholders and numbers between source and target.\n\nUse Translator's text translation API when you need scale, glossaries and predictable cost; use an LLM when tone, context or adaptive behavior matters. In the `2026-06-06` API, LLM translation has tone and gender controls and accepts up to 50 elements per request.\n\nKeep high-volume baseline traffic on neural machine translation.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/overview"], "ref": ["translation"]}, {"d": 4, "q": "A team starts a new project that needs sentiment analysis and document summarization. A colleague proposes the Azure Language sentiment and summarization features. What should you advise?", "o": [{"t": "Use Custom Translator for sentiment", "c": false, "e": "Custom Translator trains translation systems, not sentiment."}, {"t": "Wait until 2029 and then migrate", "c": false, "e": "Starting on a feature that is already scheduled to retire creates avoidable rework."}, {"t": "Use a Foundry model with a clear prompt and structured output, because these Language features retire on March 31, 2029 and new projects are directed to Foundry models", "c": true, "e": "The features still work until the date, but Learn directs new work to Foundry models."}, {"t": "Use the Language features, because they are the only supported option", "c": false, "e": "Microsoft's direction for new projects is Foundry models."}], "concept": "Microsoft Learn states that several older Azure Language features, for example sentiment analysis and summarization, retire on March 31, 2029, and directs new projects to Foundry models.\n\nA Foundry model (an LLM) handles these tasks with a prompt. For stable results, define the task and labels in the prompt, ask for structured output with a fixed JSON schema (for example `sentiment` as an enum and a short `summary`), set a low temperature, and evaluate against a labeled sample. This also gives you flexibility: new categories, languages and custom rules are a prompt change.\n\nStarting a new project on a feature with a known retirement date creates migration work later, so waiting until 2029 is not a plan. Custom Translator is for machine translation, not sentiment.\n\nExisting apps keep working until the retirement date, but new work should use the recommended path.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A team has a large parallel corpus of English and German product text from a stable domain and wants a custom neural machine translation system that can be measured by BLEU. Which option fits?", "o": [{"t": "Adaptive custom translation with five pairs", "c": false, "e": "It adapts an LLM from 5 to 10,000 aligned pairs, which is not a trained NMT system."}, {"t": "Glossary only", "c": false, "e": "A glossary maps fixed terms and does not train a model."}, {"t": "Transliterate", "c": false, "e": "It converts script, not languages."}, {"t": "Custom Translator, which trains a custom NMT system from parallel documents and reports a BLEU score", "c": true, "e": "Gains of 5 to 10 BLEU points are common with suitable data."}], "concept": "Custom Translator trains a custom neural machine translation (NMT) system. You upload parallel documents (the same text in two languages, sentence-aligned), optional dictionaries, and tuning and test sets. After training, the portal reports a BLEU score. BLEU compares machine output with human reference translations: higher is better, and it should be compared on the same test set. You then publish the model and call translation with the custom model identifier.\n\nIt fits a large parallel corpus and a stable domain, as in the question, and it gives a measurable score.\n\nA glossary only forces fixed term mappings; it trains nothing and gives no BLEU. Adaptive custom translation with five pairs is for quick LLM adaptation with small data and has no BLEU training report. Transliterate converts scripts.\n\nMemory aid: Custom Translator is the language school with exams (BLEU); adaptive is a cheat sheet of examples.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/custom-translator/overview"], "ref": ["translation"]}, {"d": 4, "q": "A web app translates a single short Word file and wants the translated file returned directly in the response, without creating storage containers. Which option fits?", "o": [{"t": "Batch document translation with SAS tokens", "c": false, "e": "It needs Blob containers."}, {"t": "Custom Translator", "c": false, "e": "It trains a model and does not translate a file."}, {"t": "Synchronous document translation, which needs a custom-domain endpoint and no storage account", "c": true, "e": "It handles one file and returns the result directly."}, {"t": "Transliterate", "c": false, "e": "It converts script only."}], "concept": "Document translation has two modes. The synchronous mode translates one file at a time and returns the translated file directly in the response. It needs a custom-domain endpoint for the Translator resource and no storage account, so there are no containers, SAS tokens or job polling.\n\nThe batch mode is for many or large files: source and target Blob containers, authorization by managed identity or SAS tokens, asynchronous processing and status polling.\n\nThe web app in the question translates a single short Word file and wants it returned directly. That is the synchronous mode. Custom Translator trains custom NMT models and does not translate files by itself. Transliterate converts a script to another script and does not translate the document.\n\nFormat and layout are preserved in both modes. Document content is processed in the region of the Translator resource, which matters for data residency.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/overview"], "ref": ["translation"]}, {"d": 4, "q": "A team submits a batch transcription job for recordings in English, Spanish or French (the language of each file is unknown) and wants to be notified when the job finishes. Which options apply?", "o": [{"t": "Provide 25 candidate locales so that every file is covered", "c": false, "e": "Language identification supports 2 to 10 candidate locales."}, {"t": "Ignore the validation request and return an empty response", "c": false, "e": "The validation token must be echoed back."}, {"t": "Enable `languageIdentification` with 2 to 10 candidate locales and register a webhook, echoing the `validationToken` from the validation request as plain text", "c": true, "e": "These are the documented batch options for language identification and notifications."}, {"t": "Use fast transcription, because it supports webhooks", "c": false, "e": "Fast transcription is synchronous and returns results directly."}], "concept": "Batch transcription processes files asynchronously. Two features appear in the question.\n\nLanguage identification: when the language of each file is unknown, enable `languageIdentification` and list candidate locales. The service accepts 2 to 10 candidates, so you cannot provide 25. Pick the likely ones, here en-US, es-ES and fr-FR.\n\nWebhooks: instead of polling, register a webhook to be notified when a transcription finishes. When you register it, the service sends a validation request containing a `validationToken`. Your endpoint must reply with that token as plain text in the response, otherwise the registration fails. Ignoring the validation request or returning an empty response breaks the setup.\n\nFast transcription is a synchronous API for a single file; it has no webhook because it returns the result directly.\n\nMemory aid: the service rings the doorbell to check someone is home; you answer with the code it gave you.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/batch-transcription-create"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A call-center team hears the base model misrecognize product names. The team has not measured anything yet and wants to avoid training costs if possible. What should they do first?", "o": [{"t": "Switch from batch to real-time transcription to fix recognition", "c": false, "e": "The mode does not change accuracy for domain terms."}, {"t": "Convert the audio to text with the Translator service", "c": false, "e": "Translator changes language; it does not transcribe audio."}, {"t": "Train a custom model immediately because every domain needs one", "c": false, "e": "The base model fits most scenarios, and training costs time and money."}, {"t": "Measure the word error rate (WER) of the base model on real audio and train a custom model only if it is high", "c": true, "e": "Measuring first shows whether training is justified."}], "concept": "The base speech model (a Universal Language Model) fits most scenarios. A custom speech model is for cases where it mishears your vocabulary or your acoustic conditions. You can provide plain and structured text for domain words, pronunciation files, and audio with human-labeled transcripts.\n\nThe workflow is: create a project, upload test data, train, inspect quality, measure with word error rate (WER) and deploy to a custom endpoint. WER is the share of words that are wrong. A high WER on your real audio suggests training; a low WER means the base model is fine.\n\nOne saving to remember: batch transcription does not need a deployed custom endpoint, so hosting cost can be avoided there. A custom model works for real-time speech to text, speech translation and batch.\n\nRule: measure first, train second.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/custom-speech-overview"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A developer wants sentiment, key phrases and entity recognition for each of 500 customer reviews, without making three separate request flows. What does the call pattern for Azure Language features allow?", "o": [{"t": "Build one request with several features and send it as an asynchronous call", "c": true, "e": "You can batch several features in one asynchronous call."}, {"t": "Features must be trained before use", "c": false, "e": "Prebuilt features run as is without training."}, {"t": "Each feature requires its own resource and a separate key", "c": false, "e": "One Language resource can serve the features."}, {"t": "Only one feature can be used per resource per day", "c": false, "e": "There is no such limit."}], "concept": "All Azure Language features follow the same four steps. Create an Azure Language (Foundry Tools) resource and get a key and endpoint. Build a request with the REST API or an SDK (C#, Java, JavaScript or Python); you can batch several features in one asynchronous call. Send the text, authenticating with a key or Microsoft Entra ID. Read the JSON response and store or stream it.\n\nPrebuilt features need no training. For example \"The food was delicious and the staff were wonderful.\" returns the key phrases \"food\" and \"wonderful staff\". Failures to expect: wrong region or endpoint, a document that is too large, an unsupported language code, or exceeding the request quota (HTTP 429).\n\nFor a new project, remember the retirement notices: sentiment, key phrases, summarization, CLU and custom question answering retire on March 31, 2029, while PII detection, language detection and NER are core capabilities without a notice.\n\nPrefer Microsoft Entra ID over keys in production.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview", "https://learn.microsoft.com/en-us/azure/ai-services/language-service/key-phrase-extraction/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A localization tool receives Serbian text written in Cyrillic and needs to show the same words in Latin script, without translating them into another language. Which Translator operation does this?", "o": [{"t": "Document translation", "c": false, "e": "It translates whole files and preserves layout."}, {"t": "Languages", "c": false, "e": "It lists supported languages and needs no authentication."}, {"t": "Translate", "c": false, "e": "It changes the language of the text."}, {"t": "Transliterate", "c": true, "e": "It converts text from one script to another, for example Cyrillic to Latin."}], "concept": "Translator's text translation API has three operations in version `2026-06-06`. Languages lists supported languages and needs no authentication. Translate takes a single POST with one or more target languages and returns translations. Transliterate converts script without changing the language, for example Cyrillic to Latin.\n\nThis difference matters. Translation maps meaning from one language to another. Transliteration maps characters from one writing system to another, so a person who reads Latin letters can pronounce Cyrillic words.\n\nThe latest GA version `2026-06-06` changed the request and response shape: the request array is `inputs`, and the response array is `value`. Translate can use standard neural machine translation or a supported LLM deployment (which needs a Foundry resource), with tone and gender controls for LLM translation.\n\nChoose the operation by the output you want: another language, another script, or a list.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/overview"], "ref": ["translation"]}, {"d": 4, "q": "A compliance team wants an LLM to summarize regulatory filings for auditors, with every statement tied to a clause number, and unclear passages flagged rather than guessed. Which design follows the guidance for customizing language model outputs for domain tasks?", "o": [{"t": "Ask for a free-form creative summary at a high temperature", "c": false, "e": "This increases invention and inconsistent format."}, {"t": "Summarize without citations to keep the text short", "c": false, "e": "Citations make verification possible."}, {"t": "Define a structured output schema with fields for summary, clause references and an `unknown` or flag value, use a low temperature, require citations, and review high-risk output with a person", "c": true, "e": "This constrains the shape, reduces invention and keeps accountability."}, {"t": "Run the model with no evaluation because compliance text is formal", "c": false, "e": "Evaluation on labeled samples is still required."}], "concept": "Customizing language model output for a domain task, such as compliance summarization or domain extraction, uses the same building blocks. First define the output schema: for example `summary`, `clauses` (with numbers) and `flags`. Write the prompt with the role, the task, the definition of each label, a few examples and an \"out\" such as `unknown` for unclear text. Constrain the output with Structured Outputs so the application can parse it. Set a low temperature for consistent results. Ask for inline citations, which force two errors for an invention (a false statement and a false citation) and make checking easy. Evaluate on a labeled sample and compare against a baseline. Treat the analyzed text as untrusted, because it may contain instructions.\n\nAdd a human review for high-risk output, and run PII detection or redaction first when the text includes personal data.\n\nFor narrow, high-volume, fixed tasks, a Language feature may be cheaper, but nuance and long context favor an LLM.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/structured-outputs", "https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering"], "ref": ["text-analysis-language-and-llms", "prompt-engineering-parameters-and-reflection"]}, {"d": 4, "q": "Which feature is listed among the core Azure Language capabilities without a retirement notice, so it remains a good choice for a new project that must find and mask social security numbers?", "o": [{"t": "PII detection", "c": true, "e": "It is listed as a core feature, together with language detection, named entity recognition and text analytics for health."}, {"t": "Key phrase extraction", "c": false, "e": "It retires on March 31, 2029."}, {"t": "Conversational language understanding", "c": false, "e": "It retires on March 31, 2029."}, {"t": "Sentiment analysis", "c": false, "e": "It retires on March 31, 2029."}], "concept": "Azure Language has a set of features. Some have retirement notices: sentiment analysis, key phrase extraction and several others retire on March 31, 2029, and Microsoft directs new projects to Foundry models for them.\n\nPII detection is a core capability without such a notice in the study material, so it is a safe choice for a new project that must find and mask social security numbers. It detects personal data in text, conversations and documents, and returns redacted text and entities.\n\nConversational language understanding is not retired in this list but it also is not what the question asks: it predicts intents and entities for user utterances; masking SSNs is a PII task.\n\nAlways verify the current status of a feature on Microsoft Learn before you start a project, since notices change.\n\nMemory aid: for a new build, avoid features with a published sunset date unless you plan the migration.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A team trains a Custom Translator system and gets a BLEU score of 41. A colleague reports 38 from another system on a different test set and concludes the first system is better. What is wrong with this comparison?", "o": [{"t": "A higher BLEU score always means a lower cost", "c": false, "e": "BLEU measures translation quality against references, not cost."}, {"t": "BLEU measures speech recognition errors", "c": false, "e": "That is word error rate for speech, not BLEU."}, {"t": "BLEU should be compared only on the same test set; scores from different sets are not comparable", "c": true, "e": "BLEU compares output with a human reference, so the reference set must be the same."}, {"t": "BLEU scores below 50 are always invalid", "c": false, "e": "There is no such rule."}], "concept": "Custom Translator trains a custom neural machine translation (NMT) system in its own portal. The steps are: create a workspace and project, upload parallel documents (and dictionaries), train, review the BLEU score, publish, and call text translation with the custom model identif
