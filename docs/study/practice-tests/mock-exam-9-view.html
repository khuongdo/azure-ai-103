<div id="app"></div>
<script>window.MOCK_EXAM = {"id": "mock-9", "title": "AI-103 Mock Exam 9", "shortTitle": "Mock exam 9", "description": "Full-length mock exam with 50 scenario questions. This test focuses on responsible AI, security and governance, and on agent and prompt design: safety evaluators, oversight, roles and identities, A2A and MCP tools, memory, guardrail behavior, prompt components, provenance, translation and speech details, and Search and Content Understanding configuration.", "defaultMinutes": 120, "domains": [{"id": 1, "name": "Plan and manage an Azure AI solution", "weight": "25-30%", "count": 14}, {"id": 2, "name": "Implement generative AI and agentic solutions", "weight": "30-35%", "count": 16}, {"id": 3, "name": "Implement computer vision solutions", "weight": "10-15%", "count": 7}, {"id": 4, "name": "Implement text analysis solutions", "weight": "10-15%", "count": 7}, {"id": 5, "name": "Implement information extraction solutions", "weight": "10-15%", "count": 6}], "questions": [{"d": 1, "q": "A risk and safety evaluation of a wellbeing chatbot shows the model sometimes infers a user's emotional state or other protected traits that the conversation never stated. Which evaluator is built to detect this?", "o": [{"t": "Violence", "c": false, "e": "It scores violent content in the output."}, {"t": "Code vulnerability", "c": false, "e": "It detects insecure patterns in generated code."}, {"t": "Ungrounded attributes", "c": true, "e": "It detects inferring protected traits, such as an emotional state, that are not present in the context."}, {"t": "Protected material", "c": false, "e": "It detects copyrighted text or code in the output."}], "concept": "Risk and safety evaluators run in the hosted Foundry Evaluation service, so you do not deploy a judge model. They cover several kinds of risk. Hate and unfairness, Sexual, Violence and Self-harm score harm categories from 0 to 7 (default threshold 3; a case passes if its score is at or below the threshold). Protected material finds copyrighted text or code. Code vulnerability finds insecure patterns in generated code. Ungrounded attributes finds inferences of protected traits that are not present in the context. Indirect attack finds attacks hidden in content. Prohibited actions and Sensitive data leakage (both Preview) are for agents.\n\nUngrounded attributes matches this case: the chatbot \"guessed\" something about the user that the conversation never said. The risk is both accuracy and fairness.\n\nMatch the symptom to the evaluator name before choosing: each one answers a different question.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators", "https://learn.microsoft.com/en-us/azure/foundry/concepts/built-in-evaluators"], "ref": ["responsible-ai-governance"]}, {"d": 1, "q": "A coding assistant generates SQL and shell snippets that developers paste into production scripts. A reviewer is worried that the generated code may contain insecure patterns. Which evaluator should be added to the pre-release safety suite?", "o": [{"t": "Groundedness", "c": false, "e": "It checks that answers stay inside the supplied context."}, {"t": "Customer Satisfaction", "c": false, "e": "It rates whether a user would be satisfied."}, {"t": "Code vulnerability", "c": true, "e": "It detects insecure patterns in generated code."}, {"t": "Task Navigation Efficiency", "c": false, "e": "It compares tool steps with an expected sequence."}], "concept": "Safety is more than offensive text. For an assistant that writes code, a major risk is that the code itself is unsafe, for example building SQL by string concatenation or running shell commands with unchecked input. The Code vulnerability evaluator looks for insecure patterns in generated code, and it is part of the risk and safety group together with Protected material, Ungrounded attributes, Indirect attack and the harm category evaluators.\n\nUse it in the pre-production stage: build a dataset with normal and adversarial requests (\"write a login query\"), run the evaluators and the red teaming agent, set a pass rule such as a maximum defect rate, and make it a release gate. A defect rate is the share of test cases that fail.\n\nAfter release, continue with sampled continuous evaluation and alerts. Code review by people remains important, because evaluators are aids and not guarantees.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators"], "ref": ["responsible-ai-governance"]}, {"d": 1, "q": "A research agent reads web pages and emails. Testers want an evaluator that detects attempts hidden in content, such as manipulated content, intrusion and information gathering. Which evaluator targets these?", "o": [{"t": "Indirect attack (XPIA)", "c": true, "e": "It detects attacks hidden in content that the system reads."}, {"t": "Hate and unfairness", "c": false, "e": "It scores hateful or unfair content."}, {"t": "Response Completeness", "c": false, "e": "It measures recall of expected facts."}, {"t": "Protected material", "c": false, "e": "It finds copyrighted material."}], "concept": "Two attack families matter for generative systems. A user prompt attack comes from the user: change the system rules, embed a fake conversation, role-play a persona without limits, or hide the request with encoding. An indirect (document) attack comes from a third party: a document, email, web page or tool result carries hidden commands. Its goals include manipulated content, intrusion (access to system infrastructure), information gathering, availability attacks, fraud and malware.\n\nFor measurement, the Indirect attack evaluator (XPIA) checks for such attempts. For prevention at runtime, Prompt Shields and the guardrail control for indirect attacks scan user input and tool responses. The AI Red Teaming Agent, which uses the PyRIT framework, generates attacks that the team did not think of.\n\nThe three pieces form a loop: Discover (evaluators and red team), Protect (guardrails) and Govern (policy and ownership).", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators", "https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/content-filter-prompt-shields"], "ref": ["responsible-ai-governance", "agent-safety-and-identity"]}, {"d": 1, "q": "A finance agent calls tools that return customer records. Reviewers worry that the agent may expose sensitive data in its replies or intermediate tool calls, and that judging only the final answer is not enough. Which evaluator (Preview) is meant for agents in this situation?", "o": [{"t": "Tool Output Utilization", "c": false, "e": "It checks whether the agent used the tool result correctly."}, {"t": "Task Completion", "c": false, "e": "It checks whether the task finished with a usable deliverable."}, {"t": "Fluency", "c": false, "e": "It scores the language quality of text."}, {"t": "Sensitive data leakage", "c": true, "e": "It checks whether an agent exposes sensitive data."}], "concept": "Agents add risks that plain chat does not have. They call tools, read third-party content and act. Two risk evaluators are made for agents and are in Preview: Prohibited actions (agent actions outside policy) and Sensitive data leakage (the agent exposing sensitive data).\n\nA common mistake is judging only the final answer. An agent can leak data in an intermediate tool call and then give a clean-looking final answer. Evaluating the full set of messages, including tool calls and results, finds this.\n\nCombine the evaluator with runtime controls: tool call controls in the guardrail look at what the agent proposes to send to a tool, least-privilege identities limit what it can reach, and approvals protect high-impact actions. Add the failing cases to the test suite so the gate stays strict.\n\nUse Preview features with care and re-check their status before relying on them.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators"], "ref": ["responsible-ai-governance", "agent-safety-and-identity"]}, {"d": 1, "q": "A team ran a red teaming exercise once before launch and considers the safety program finished. Which statement matches the guidance on the AI Red Teaming Agent?", "o": [{"t": "It only checks spelling mistakes", "c": false, "e": "It simulates attacks and scores results by risk category."}, {"t": "One run is enough because attacks never change", "c": false, "e": "Attackers adapt, so a single run goes stale."}, {"t": "It replaces all human review and needs no oversight", "c": false, "e": "It is best used with human review."}, {"t": "Run it before release and again on a schedule after release, together with continuous evaluation of sampled production traffic", "c": true, "e": "Attackers adapt, and models, prompts and data change, so testing must repeat."}], "concept": "A fixed evaluation dataset replays questions you already know. Attackers invent new ones. The AI Red Teaming Agent simulates attacks, using Microsoft's PyRIT framework (jailbreaks, prompt injection and more), and scores the target by risk category such as hate or violence. It is best used with human review.\n\nTiming matters. Run it before release. Then run it on a schedule after release (scheduled red teaming), and pair it with continuous evaluation of sampled production traffic and Azure Monitor alerts. Re-run it after any change to the model, the prompts, the tools or the guardrails, because each change can open a new gap.\n\nIn the Discover, Protect and Govern framework, red teaming belongs to Discover, and what it finds feeds Protect (new controls) and Govern (incident process and ownership).\n\nMemory aid: a fire drill once is not a fire safety program.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/observability", "https://learn.microsoft.com/en-us/azure/foundry/responsible-use-of-ai-overview"], "ref": ["agent-safety-and-identity", "responsible-ai-governance"]}, {"d": 1, "q": "A grocery chain lets an agent reorder low-risk stock automatically. Volume is high and each action is cheap to undo. Managers do not want to approve each action but want to be able to step in. Which oversight pattern fits?", "o": [{"t": "Human on the loop: monitor and intervene when needed", "c": true, "e": "This fits low-risk, high-volume actions."}, {"t": "Human after the fact only, with yearly audits", "c": false, "e": "A yearly audit is too slow for operational issues."}, {"t": "Human in the loop: approve every action before it runs", "c": false, "e": "This suits hard-to-reverse, high-impact actions and would not scale here."}, {"t": "No oversight at all", "c": false, "e": "Even low-risk automation needs monitoring and an escalation path."}], "concept": "Human oversight is not one setting. There are three patterns. Human in the loop means a person approves before the action runs; use it for hard-to-reverse or high-impact actions such as payments, access grants and messages to customers. Human on the loop means a person monitors and can intervene; use it when actions are low risk but volume is high. Human after the fact means periodic audits of samples; use it for low-risk content.\n\nWhatever the pattern, record the approver, the time and the evidence. Measure how often humans change or reject the system's proposals: a high change rate says autonomy should not increase yet.\n\nControls in Foundry support this: approval flows for risky tools, tracing for audit, alerts when outputs fail quality thresholds, and constraints and tool-access controls to limit what the agent can do.\n\nChoose the pattern by the cost of a mistake and the volume of actions.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/responsible-use-of-ai-overview", "https://learn.microsoft.com/en-us/azure/foundry/agents/overview"], "ref": ["responsible-ai-governance"]}, {"d": 1, "q": "A governance checklist for an AI application includes an incident process. According to the responsible AI guidance, which item belongs in that process when a team discovers a vulnerability in the model itself?", "o": [{"t": "Report the model vulnerability to the Microsoft Security Response Center (MSRC)", "c": true, "e": "The governance checklist names MSRC for model vulnerabilities."}, {"t": "Wait for the next yearly review", "c": false, "e": "Incidents need a defined, timely process."}, {"t": "Publish the exploit details on social media first", "c": false, "e": "This is not responsible disclosure."}, {"t": "Ignore it if the guardrail blocked the test prompt once", "c": false, "e": "A one-time block does not remove a vulnerability."}], "concept": "Govern is the part of the framework that answers \"who is accountable, and how do we prove it?\". A practical governance checklist contains: a named owner and escalation path; documented intended use and prohibited use; evaluation results stored with the release; change control for prompts, models, tools and guardrails; access control by role, with no shared keys; an incident process, including reporting a model vulnerability to the Microsoft Security Response Center (MSRC); and periodic review, at least on every model or major prompt change.\n\nWhy write it down: when something goes wrong at night, nobody should have to invent the process. The owner knows who decides, the incident process says whom to inform, and the stored evaluation results show what was tested before release.\n\nA common mistake is to treat the content filter as the whole program, with no owner and no review cycle.\n\nGovernance repeats for the life of the system.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/responsible-use-of-ai-overview"], "ref": ["responsible-ai-governance"]}, {"d": 1, "q": "A legal-research assistant answers questions from case documents. The product team lists transparency measures to implement. Which TWO items follow the transparency and explainability guidance?", "o": [{"t": "Keep traces of inputs, tool calls, outputs, model and version for audit", "c": true, "e": "Traces provide an audit trail."}, {"t": "Remove all limits statements to avoid discouraging users", "c": false, "e": "The system should state what it is for and what it should not be used for."}, {"t": "Assume model-explanation features exist for every Foundry model without checking", "c": false, "e": "Do not assume a specific feature; check what Learn documents."}, {"t": "Tell users they are talking to an AI and cite the sources used in grounded answers", "c": true, "e": "Disclosure and citations let users verify answers."}, {"t": "Hide the model version so that users cannot compare it with others", "c": false, "e": "Versions should be recorded, not hidden."}], "concept": "Transparency means users and auditors can understand what the system is and how it produced an answer. The guidance lists several practices. Disclose that the user is talking to AI. Cite sources in grounded answers so users can verify. State limits: what the system is for and what it should not be used for; Microsoft publishes transparency notes for its services, and your app should have its own. Keep traces for audit: inputs, tool calls, outputs, model and version.\n\nFor generated media, add provenance and labels, and remember that customers are responsible for meeting the transparency rules that apply to them.\n\nExplainability tooling needs care: do not assume that a particular model-explanation feature exists in Foundry. Use what is documented, for example citations, traces and evaluator results.\n\nTransparency also supports quality: a visible citation makes errors easier to spot.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/responsible-use-of-ai-overview", "https://learn.microsoft.com/en-us/azure/foundry/concepts/observability"], "ref": ["responsible-ai-governance"]}, {"d": 1, "q": "A Spanish-language and Vietnamese-language community app relies on Azure AI Content Safety text classifiers. The team asks how reliable they are in these languages. What is the correct guidance?", "o": [{"t": "They work equally well in every language without testing", "c": false, "e": "Coverage outside the eight languages is less reliable."}, {"t": "They only work in English", "c": false, "e": "Eight languages are listed."}, {"t": "The classifiers are trained and tested on eight languages (English, German, Japanese, Spanish, French, Italian, Portuguese and Chinese) and may work in others with less reliability, so test your own languages", "c": true, "e": "Spanish is covered; Vietnamese needs your own testing."}, {"t": "They cannot be used at all outside the United States", "c": false, "e": "Region is not the limit; language coverage is."}], "concept": "Content Safety classifies text and images into four categories: hate and fairness, sexual, violence and self-harm. The text classifiers are trained and tested on English, German, Japanese, Spanish, French, Italian, Portuguese and Chinese. They can work in other languages, but with less reliability.\n\nFor a product with other languages (here Vietnamese), do not assume: build a small test set with real and adversarial examples in that language, count false blocks and misses at your chosen thresholds, and adjust thresholds by category. Consider human review for borderline cases.\n\nRemember also that severity scales differ: text uses the full 0 to 7 scale (it can be trimmed to 0, 2, 4, 6), images use a trimmed scale of 0, 2, 4, 6, and image with text from a multimodal model uses the full 0 to 7.\n\nRe-test after every change and keep the results.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/harm-categories"], "ref": ["responsible-ai-governance"]}, {"d": 1, "q": "A developer holds the Foundry User role on a project. They build an agent successfully and then try to publish it as an agent application, but the action is denied. What is the least privileged role change that allows publishing?", "o": [{"t": "Assign Foundry Agent Consumer", "c": false, "e": "It only allows calling agent endpoints."}, {"t": "Assign Foundry Project Manager on the Foundry resource", "c": true, "e": "Publishing needs at least Project Manager."}, {"t": "Assign Cognitive Services Contributor", "c": false, "e": "Older Cognitive Services roles are not recommended for Foundry projects, except Usages Reader for quota."}, {"t": "Assign Azure AI Developer", "c": false, "e": "Learn advises not using this role for Foundry projects."}], "concept": "Foundry roles divide duties. Foundry Agent Consumer calls published agent endpoints only (a good fit for apps and end-user service principals). Foundry User builds and develops in a project, with reader access. Foundry Project Manager builds, publishes agents and assigns Foundry User to others. Foundry Account Owner creates accounts and projects and manages models but cannot build in projects. Foundry Owner has all rights.\n\nPublishing creates a stable endpoint and a distinct agent identity, so it is a more privileged act than building. It needs at least Project Manager on the Foundry resource.\n\nDo not use the older Cognitive Services roles (except Usages Reader for quota) or Azure AI Developer for Foundry projects. Keys bypass role-based access control, so prefer Microsoft Entra ID.\n\nAfter publishing, reassign the access the new agent identity needs: the permissions of the shared project identity do not transfer.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry", "https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/agent-identity"], "ref": ["agent-safety-and-identity"]}, {"d": 1, "q": "An administrator assigns a user a role scoped to a single published agent. The user then tries to open the project's other agents and manage the project's connections, and is denied. Why?", "o": [{"t": "Agent-scope role assignments only affect access to that agent's endpoints", "c": true, "e": "They do not give project-wide rights."}, {"t": "The user must be added to Microsoft Entra Global Administrators", "c": false, "e": "This is unrelated and over-privileged."}, {"t": "Agent-scope roles automatically inherit to all agents in the project", "c": false, "e": "They only apply to that agent's endpoints."}, {"t": "Agent-scope roles are ignored unless keys are enabled", "c": false, "e": "Keys are not needed and bypass role control."}], "concept": "Role-based access control can be assigned at several scopes: subscription, resource group, Foundry resource, project, and also a single agent. A narrower scope grants less access.\n\nLearn notes that agent-scope role assignments only affect access to that agent's endpoints. They are meant for giving an app or user permission to call one agent. They do not allow building, managing other agents or managing connections.\n\nThis supports least privilege. A line-of-business application that only calls a published agent should receive Foundry Agent Consumer (or an equivalent at agent scope), not Foundry User.\n\nRemember that API keys bypass these controls and cannot tell you who called, so use Microsoft Entra ID and managed identities.\n\nCheck the scope of a role assignment first when a person has the right role but still sees \"access denied\".", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry"], "ref": ["agent-safety-and-identity"]}, {"d": 1, "q": "A team grants developers the Cognitive Services Contributor role to work in Foundry projects because it worked for older Azure OpenAI resources. A reviewer objects. What does the guidance say?", "o": [{"t": "Use the Foundry roles (User, Project Manager, Account Owner, Owner, Agent Consumer) instead; the older Cognitive Services roles are not recommended, except Usages Reader for quota", "c": true, "e": "Foundry roles match the platform's duties."}, {"t": "Cognitive Services roles are the only supported roles for Foundry projects", "c": false, "e": "Foundry has its own roles."}, {"t": "Azure AI Developer is the recommended replacement", "c": false, "e": "Learn advises not using it for Foundry projects."}, {"t": "Roles are not needed because projects are public by default", "c": false, "e": "Access control applies."}], "concept": "Role names carry history. Older Azure OpenAI and Azure AI services used roles named Cognitive Services Contributor or User, and hub-based projects used Azure AI Developer. Current Foundry guidance defines its own roles for Foundry resources and projects: Agent Consumer, User, Project Manager, Account Owner and Owner.\n\nThe advice is to use the Foundry roles and not the older ones, with one exception: Usages Reader (from the Cognitive Services family) is used to view quota.\n\nWhy it matters: a broad old role can grant more (or different) rights than intended, and may not give the permissions that new features need. Review role assignments when migrating from older resources.\n\nAlso give the project's managed identity the Foundry User role on the Foundry resource, or some features fail silently, and use Azure Policy to turn off local (key) authentication.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry"], "ref": ["agent-safety-and-identity", "platform-network-and-reliability"]}, {"d": 1, "q": "A team deletes a Foundry project that contained the shared project identity and several unpublished agents, and separately deletes one published agent application. Which statement describes what is removed?", "o": [{"t": "Deleting a project leaves its shared identity in place forever", "c": false, "e": "The shared identity is removed with the project."}, {"t": "Deleting either one affects only the model deployments", "c": false, "e": "Model deployments belong to the Foundry resource."}, {"t": "Deleting a project removes its blueprint and shared identity; deleting an agent application removes its distinct identity", "c": true, "e": "These are the documented lifecycle effects."}, {"t": "Deleting an agent application removes the whole project identity", "c": false, "e": "It removes only the agent's distinct identity."}], "concept": "Foundry gives each agent a Microsoft Entra agent identity, a special service principal, so tools can authenticate without secrets in prompts or code. While an agent is in development, unpublished agents in a project share one project identity. When an agent is published, it gets its own distinct identity, created at publish time, with its own permissions, audit trail and lifecycle.\n\nThe identity lifecycle follows the objects. Deleting a project removes its blueprint (the template for a class of agents) and the shared identity. Deleting an agent application removes its distinct identity.\n\nIn the Entra admin center (Agent ID), administrators can inventory all agent identities and apply Conditional Access, identity protection, network controls and ownership and expiry governance.\n\nPractical consequence: role assignments given to a deleted identity disappear with it. Use a user-assigned managed identity for projects if you want role assignments to survive project recreation.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/agent-identity"], "ref": ["agent-safety-and-identity"]}, {"d": 1, "q": "A compliance team wants to keep traces in Application Insights for debugging but restrict who can see content that may include sensitive user text and tool arguments. Which approach fits the guidance?", "o": [{"t": "Put secrets in span attributes so they can be searched", "c": false, "e": "Do not put secrets in prompts, arguments or span attributes."}, {"t": "Redact or minimize personal data before it reaches telemetry, and route sensitive content to a dedicated table with restricted access", "c": true, "e": "Traces can contain user text, model output and tool arguments and need the same controls as production logs."}, {"t": "Turn off all access controls on the workspace to simplify debugging", "c": false, "e": "Traces can contain personal data and need protection."}, {"t": "Keep the data forever regardless of retention policy", "c": false, "e": "Apply the same access controls and retention as production logs."}], "concept": "A trace records user inputs, model outputs, tool calls with arguments and results, token use and timing. That makes it very useful for debugging and also a privacy risk. The privacy guidance has four parts: do not put secrets in prompts, tool arguments or span attributes; redact or minimize personal data before it reaches telemetry; apply the same access controls and retention as for production logs; and, where needed, route sensitive content to a dedicated table with restricted access.\n\nRetention and sampling follow your Application Insights configuration, and viewing traces in the portal needs a Log Analytics reader role.\n\nFor audit, use diagnostic settings to Log Analytics for questions like \"who called which deployment and when\". Allow for the cost of telemetry volume.\n\nDebugging value and privacy are balanced by design, not by turning off tracing.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/observability/concepts/trace-agent-concept", "https://learn.microsoft.com/en-us/azure/foundry/concepts/observability"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 2, "q": "A bank wants customers to talk to a prompt agent by voice, with natural interruptions, using the same agent definition as the text channel. Which agent type is intended for this?", "o": [{"t": "A hosted agent written only to transcribe files", "c": false, "e": "Hosted agents are custom code in a container, not specifically voice."}, {"t": "A voice-based prompt agent, which adds real-time speech through Voice Live", "c": true, "e": "It extends a prompt agent with voice."}, {"t": "A workflow agent with no speech support", "c": false, "e": "Workflows orchestrate agents; they do not provide speech."}, {"t": "A batch transcription job", "c": false, "e": "It transcribes recorded audio asynchronously."}], "concept": "Foundry offers several agent types. A prompt agent is configuration only: instructions, a model and tools. A voice-based prompt agent adds real-time speech through Voice Live. A hosted agent is your own code in a container, for example built with the Microsoft Agent Framework, used when you need custom orchestration or protocols. Workflows orchestrate several agents declaratively.\n\nChoosing the type is the first step of the agent lifecycle. The advice is to pick the simplest type that meets the need, because choosing wrongly early means a rewrite later.\n\nVoice Live is a managed WebSocket API for speech-to-speech conversation. It bundles speech to text, a model, text to speech, noise suppression, echo cancellation and interruption and end-of-turn detection. Monitoring cards for voice agents need Application Insights, and evaluation of voice agents supports full-conversation runs only.\n\nTelephony is possible through Teams Phone extensibility or Twilio, not direct SIP.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/development-lifecycle", "https://learn.microsoft.com/en-us/azure/ai-services/speech-service/voice-live"], "ref": ["observability-and-agent-lifecycle", "speech-solutions"]}, {"d": 2, "q": "A memory store keeps both `user_profile_enabled` facts and `chat_summary_enabled` summaries for an assistant. Which TWO statements about how they should be retrieved are correct?", "o": [{"t": "User profile items should be re-extracted on every message and never stored", "c": false, "e": "The store keeps them for later retrieval."}, {"t": "Both types must be retrieved at the end of every conversation only", "c": false, "e": "This does not match the guidance."}, {"t": "Chat summaries are retrieved dynamically, based on the current conversation", "c": true, "e": "They depend on the topic being discussed."}, {"t": "Chat summaries are retrieved once at deployment time of the model", "c": false, "e": "They are retrieved per conversation, not at deployment."}, {"t": "User profile items (preferences and facts) are retrieved once at the start of a conversation", "c": true, "e": "They are stable facts that personalize the whole conversation."}], "concept": "A memory store keeps durable knowledge that an agent extracts from conversations. After a conversation the system extracts items worth keeping, consolidates duplicates and conflicts with a language model, stores them partitioned by scope, and retrieves them at run time through the memory search tool or the store APIs.\n\nThere are different memory types. `user_profile_enabled` keeps preferences and facts about the user, such as a preferred name or a dietary restriction. Retrieve them once at the start of a conversation. `chat_summary_enabled` keeps distilled summaries of topics or threads. Retrieve them dynamically, based on the current conversation. `procedural_memory_enabled` appears in the latest preview.\n\nCreating a store needs a chat model deployment and an embedding model deployment. Use one store per agent, set `scope` to `{{$userId}}` for per-user isolation, and set `default_ttl_seconds` for retention.\n\nMemory is Preview, so check current limits.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/memory-usage", "https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/what-is-memory"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "A Foundry orchestrator agent must call another team's agent that exposes an A2A endpoint. In the setup, what is the first step?", "o": [{"t": "Publish the remote agent as a hosted container image", "c": false, "e": "The remote agent only needs an A2A-compatible endpoint."}, {"t": "Create a project connection of category `RemoteA2A` that targets the remote agent's base URI, with authentication", "c": true, "e": "The tool then points to this connection."}, {"t": "Create a Cosmos DB container for each remote agent", "c": false, "e": "Data containers are not required for the connection."}, {"t": "Add an embedding model deployment", "c": false, "e": "Embeddings are unrelated to A2A calls."}], "concept": "The A2A (agent-to-agent) tool lets a Foundry agent call any A2A-compatible endpoint, including another Foundry agent exposed as one. The sequence has four steps. First, create a project connection of category `RemoteA2A`, whose target is the remote agent's base URI, with authentication (for a Foundry target: the A2A base path and the audience `https://ai.azure.com`). Second, add an `A2ATool` to the orchestrator agent, pointing to that connection; the orchestrator reads the remote agent card to learn what the remote agent can do. Third, run the orchestrator; when the question fits, it calls the remote agent. Fourth, the orchestrator writes the final answer and keeps managing the conversation.\n\nA missing connection or wrong authentication shows up as call failures. Check with the trace or run output that the tool call happened.\n\nThe pattern keeps one agent in control, and each specialist call is auditable.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/agent-to-agent"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "A team compares the `a2a` and `a2a_preview` tool types for production use. Which TWO statements are correct?", "o": [{"t": "The A2A tool currently supports text modality only and no streaming", "c": true, "e": "These are documented limits."}, {"t": "`a2a_preview` replaced `a2a` as the GA version", "c": false, "e": "The reverse is true: `a2a` is GA."}, {"t": "The `a2a` tool type (protocol 1.0) is generally available, while `a2a_preview` (protocol 0.3) stays in preview", "c": true, "e": "GA features are preferred for production."}, {"t": "Both tool types support streaming and image inputs", "c": false, "e": "Streaming and non-text inputs are not supported."}, {"t": "The classic Connected Agents tool is the recommended replacement for A2A", "c": false, "e": "Connected Agents is not available in the new Foundry Agent Service."}], "concept": "In the new Foundry Agent Service, the replacements for the old Connected Agents tool are the A2A tool and workflows. The A2A tool type comes in two versions: `a2a`, protocol 1.0, which is generally available; and `a2a_preview`, protocol 0.3, which stays in preview. Prefer GA features for production, and mark preview ones clearly.\n\nLimits to remember: the A2A tool supports text modality only, with no streaming. If the use case needs images or streaming responses between agents, the tool is not a fit yet.\n\nThe target of an A2A tool can be any A2A-compatible endpoint, including another Foundry agent exposed as one. A workflow can orchestrate several agents declaratively (sequential, group chat, human-in-the-loop).\n\nOlder practice material may still talk about \"connected agents\" or `agent.as_tool`. Pick the option that matches the product named in the question.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/agent-to-agent"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "A remote MCP server gives an agent tools that can change data. Compliance requires that a person approves every MCP tool call before it runs. Which setting implements this?", "o": [{"t": "Disable tracing so approvals are not logged", "c": false, "e": "Approvals should be logged for high-risk actions."}, {"t": "Set `allowed_tools` to an empty list", "c": false, "e": "It limits which tools are exposed; an empty list would expose none or does not implement approval."}, {"t": "Raise the temperature to reduce risky calls", "c": false, "e": "Randomness is not a control."}, {"t": "Set `require_approval` to `always` for the MCP tool", "c": true, "e": "This requires approval for each call."}], "concept": "Remote Model Context Protocol (MCP) servers expose tools to agents. The risks: a server may expose many tools, tool descriptions and results come from a third party, and some tools change data.\n\nTwo settings control exposure and approval. `allowed_tools` limits which tools of the server the agent can use (for example only three read-only tools out of forty). `require_approval=\"always\"` requires a person to approve each call. Treat tool descriptions and results from remote servers as untrusted. Log approvals for high-risk actions.\n\nIn the Microsoft Agent Framework, `@tool(approval_mode=...)` controls approval for function tools. Learn's sample uses `never_require` for brevity and says to use `always_require` in production for human-in-the-loop.\n\nLayering matters: enforce limits in code and permissions, because prompts can be bypassed.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/model-context-protocol", "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling"], "ref": ["agent-safety-and-identity", "building-agents-with-foundry"]}, {"d": 2, "q": "A developer uses the Microsoft Agent Framework and marks a refund function with `@tool(approval_mode=\"never_require\")`, copied from a quickstart. Before production, a reviewer asks for human-in-the-loop control on refunds. What should change?", "o": [{"t": "Use `always_require` for tools that change data, so a person approves each call", "c": true, "e": "Learn's sample uses never_require for brevity and says to use always_require in production for human-in-the-loop."}, {"t": "Keep `never_require` and add a sentence to the prompt asking the model to be careful", "c": false, "e": "A prompt does not enforce approval."}, {"t": "Remove the refund tool and ask users to refund manually", "c": false, "e": "This removes the capability instead of controlling it."}, {"t": "Increase `max_output_tokens`", "c": false, "e": "Output length does not control approval."}], "concept": "Tools that act in the world need approval controls. In the Microsoft Agent Framework, a function tool declares an approval mode. `never_require` lets the agent run it without asking, which is convenient in samples. `always_require` pauses the run so that a person can approve or reject the call, which is human-in-the-loop.\n\nLearn's function calling sample says to use `always_require` in production. Apply it to tools with side effects: refunds, payments, access grants, sending messages. For low-risk read-only tools, approval can be skipped to avoid delay.\n\nCombine approval with other layers: the tool enforces limits in code (for example refunds over $200 need approval), the identity has least privilege, tool call controls in the guardrail inspect what is about to be sent, and the trace stores who approved and when.\n\nPrinciple: prompts guide; code and permissions enforce.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling", "https://learn.microsoft.com/en-us/azure/foundry/agents/overview"], "ref": ["agent-safety-and-identity", "building-agents-with-foundry"]}, {"d": 2, "q": "A team wants to authenticate an agent to a downstream service with its agent identity instead of storing secrets. Which tool types does agent identity authentication currently support?", "o": [{"t": "Every built-in tool, including all grounding tools", "c": false, "e": "Other tools may use key-based auth or OAuth identity passthrough."}, {"t": "Only the Code Interpreter tool", "c": false, "e": "It is not the supported set."}, {"t": "MCP and A2A tools", "c": true, "e": "Agent identity authentication currently works with these two."}, {"t": "Only function tools run by the application", "c": false, "e": "Function tools run in your code, with your credentials."}], "concept": "Foundry gives each agent a Microsoft Entra agent identity so tools can authenticate without secrets in prompts or code. At runtime there are four stages: the blueprint authenticates through a federated credential that trusts the project's managed identity; Entra issues a token for the specific agent identity; Agent Service requests an access token whose audience is the downstream service (for example `https://storage.azure.com`); and the call is made with that token, and the target checks the role assignments of the agent identity.\n\nSupport is limited today: agent identity authentication works with MCP and A2A tools. Other tools may use key-based authentication or OAuth identity passthrough; check each tool's documentation.\n\nTwo common failures: the wrong audience (it must be the service's resource identifier, not the URL of your MCP server) and roles on the wrong identity (the agent identity, not the managed identity, needs the role on the target).\n\nAccess can be delegated (on behalf of a signed-in user) or application-only (client credentials).", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/agent-identity"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A published agent has no custom guardrail assigned, but its model deployment has a custom guardrail with Violence set to Medium. What guardrail applies to the agent?", "o": [{"t": "The agent inherits the model deployment's guardrail", "c": true, "e": "Without an agent-level guardrail, the agent uses the model's."}, {"t": "The agent merges the model guardrail with a new empty one automatically", "c": false, "e": "There is no merging; an agent guardrail fully replaces the model's."}, {"t": "The agent always uses `Microsoft.DefaultV2` regardless of the model", "c": false, "e": "DefaultV2 is the default for models, and inheritance applies when the agent has none."}, {"t": "The agent runs with no guardrail until one is assigned", "c": false, "e": "It inherits the model's guardrail by default."}], "concept": "A guardrail is a named collection of controls. Each control is made of a risk, an intervention point and an action. A guardrail can be assigned to models and to agents.\n\nAssignment rules: `Microsoft.DefaultV2` is the default guardrail for models. A custom guardrail on the agent wins. If the agent has none, it inherits the guardrail of its model deployment. When an agent has its own guardrail, it fully replaces the model's: nothing is merged. A model's setting of High on user input does not carry over to an agent whose own guardrail says Low or defines no tool controls.\n\nThis is the most tested rule. Always check which guardrail is effective for the agent and not just for the model, and remember that guardrails apply to agents built in Foundry Agent Service, not to other agents merely registered elsewhere.\n\nRisks that agents do not support yet silently do nothing for the agent.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview", "https://learn.microsoft.com/en-us/azure/foundry/guardrails/intervention-points"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A team wants a guardrail control for an agent that only flags problematic content (annotate) without blocking, to tune false positives. What does the documentation say about the available actions?", "o": [{"t": "Both models and agents support only a third action called quarantine", "c": false, "e": "No such action is documented."}, {"t": "Agents support annotate-only, while models support only block", "c": false, "e": "This reverses the support."}, {"t": "Actions cannot be changed after a guardrail is created", "c": false, "e": "Actions are part of each control."}, {"t": "Annotate (flag without blocking) is for models; agents currently support annotate and block", "c": true, "e": "The annotate-only action is not available for agents."}], "concept": "A control chooses an action when its risk is detected. Annotate adds a flag to the response without blocking; it is available for models. Annotate and block stops the content; agents currently support annotate and block.\n\nAnnotations carry `detected` and `filtered` flags. `detected: true, filtered: false` means the content was seen but allowed, which is what annotate-only mode produces. This is useful on a model deployment to tune false positives before turning blocking on.\n\nFor agents, tuning needs another approach: test on a model deployment with the same guardrail first, use evaluation datasets with realistic prompts, and then apply annotate and block on the agent.\n\nBehavior of the block action: a tool call control with annotate and block means the tool call is not executed and the agent stops until there is another user input; a tool response control stops the agent immediately and does not save the content to memory.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview", "https://learn.microsoft.com/en-us/azure/foundry/guardrails/intervention-points"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A tool call control with annotate and block fires because the agent proposes to send a customer's card number to a tool. What happens?", "o": [{"t": "The tool runs, and the card number is removed from the log only", "c": false, "e": "The call is blocked before it runs."}, {"t": "The tool call is not executed, and the agent stops until there is another user input", "c": true, "e": "This is the documented behavior for annotate and block at the tool call point."}, {"t": "The agent retries the same call ten times automatically", "c": false, "e": "Retry is not documented behavior."}, {"t": "The control deletes the agent", "c": false, "e": "Controls do not delete agents."}], "concept": "Guardrails can inspect an agent at four points. The tool call point scans what the agent proposes to send to a tool, meaning the tool name and arguments. It defends against an agent about to send harmful or sensitive data, or to take an unintended action. It is a Preview feature for agents.\n\nWhen a tool call control is set to annotate and block and it fires, the tool call is not executed and the agent stops until there is another user input. This prevents the harmful call and leaves the next step to the user or the application.\n\nCompare with the tool response point: when it fires with annotate and block, the agent stops immediately and the malicious content is not saved in the agent's memory.\n\nRemember the limits: these controls work only with tools that support moderation (for example Azure AI Search, Azure Functions, OpenAPI, SharePoint grounding, Fabric Data Agent, Bing grounding and Browser Automation), and each point adds about 50 to 100 ms.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/intervention-points"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A prompt for a non-reasoning model asks it to decide which of three suppliers is cheapest including shipping, and the answers contain arithmetic mistakes. The team wants the model to show intermediate steps and end with a parseable line. Which technique and format fit?", "o": [{"t": "Use the same instruction for a reasoning model and request raw hidden reasoning", "c": false, "e": "Chain of thought is for non-reasoning models, and extracting hidden reasoning is unsupported."}, {"t": "Raise the temperature to 2", "c": false, "e": "More randomness makes arithmetic worse."}, {"t": "Chain of thought: ask for step-by-step reasoning first and a final line in a fixed format such as `ANSWER is: <name>`", "c": true, "e": "It reduces errors for non-reasoning models and makes review easier."}, {"t": "Ask for the answer only, with no steps, to save tokens", "c": false, "e": "Skipping steps increases the risk of arithmetic errors."}], "concept": "Chain of thought means asking the model to reason step by step before giving the final answer. For non-reasoning models it can reduce errors, because each step is generated and then used by the next, and it makes the output easier to review. Use a fixed format for the final answer, such as \"ANSWER is: <name>\", so that your code can parse it.\n\nDo not use this technique with reasoning models. They produce hidden reasoning tokens by themselves, and Learn recommends short, goal-oriented prompts for them. Extracting hidden reasoning by any means other than the reasoning summary parameter is unsupported and may violate the Acceptable Use Policy.\n\nFor exact arithmetic, a better design may use a tool: let the model call a function that does the calculation in code, then explain the result. That follows the principle of using rules and code for exact decisions.\n\nAlways test the prompt on examples that include edge cases.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering", "https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning"], "ref": ["prompt-engineering-parameters-and-reflection"]}, {"d": 2, "q": "A team wants a model to answer questions about current inventory. Instead of relying on the model's memory, the prompt technique allows the model to stop and request a search, then continues with the results. Which prompt technique and Foundry feature implement this?", "o": [{"t": "Few-shot examples only, because they store inventory permanently", "c": false, "e": "Examples condition the model for one call and do not store data."}, {"t": "A longer temperature schedule", "c": false, "e": "Temperature does not supply facts."}, {"t": "Prime the output with a cue such as \"Key Points:\"", "c": false, "e": "A cue steers form, not the source of facts."}, {"t": "Affordances (tools): in Foundry, tools and function calling let the model request a search that your system or the service runs", "c": true, "e": "The model asks for a tool, receives the result and answers."}], "concept": "Models do not know your live data. One of the prompt techniques is to use affordances, meaning tools the model can use. The simple form is a text protocol: the model emits something like `SEARCH(\"query\")`, the program stops, runs the search, pastes the results back and asks for the answer. In Foundry the same idea is implemented properly with tools and function calling: the model returns a `function_call` with a name and arguments, your application (or the service, for hosted tools) executes it, and the result goes back.\n\nCompare with other techniques. A cue primes the beginning of the answer. Few-shot examples teach format and conditioning for the current call only. Grounding context supplies data in the prompt, which is the basis of RAG. Break the task down splits a hard task into steps.\n\nFor live data, tools or retrieval are the right choice, and the answer should cite its sources.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering", "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling"], "ref": ["prompt-engineering-parameters-and-reflection", "building-agents-with-foundry"]}, {"d": 2, "q": "A prompt includes the current date, the user's stated preferences and a list of favorite topics. These help the model personalize its answer but are not themselves the text to be transformed. According to Learn's five components of a prompt, what are they called?", "o": [{"t": "Cue", "c": false, "e": "The start of the answer that steers its form."}, {"t": "Instructions", "c": false, "e": "What the model should do."}, {"t": "Supporting content", "c": true, "e": "Context that influences the output but is not the target of the task."}, {"t": "Primary content", "c": false, "e": "The text being transformed, such as the paragraph to summarize."}], "concept": "Learn splits a prompt into five components, and not all are needed every time. Instructions say what to do. Primary content is the text being transformed or analyzed, for example the paragraph to translate. Examples are input and output pairs; none means zero-shot, one means one-shot, several means few-shot. A cue is the start of the answer that steers its form, for example \"Key Points:\". Supporting content is context that influences the output but is not the target, such as the current date, user preferences or \"my important topics\".\n\nIn the Chat API, instructions go in the system message, and few-shot examples are sample user and assistant turns after it.\n\nKnowing the vocabulary helps in questions: \"give the model a starting phrase\" is a cue; \"the text to summarize\" is primary content; \"today's date and user preferences\" is supporting content.\n\nKeep prompts compact: they compete for the context window.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering"], "ref": ["prompt-engineering-parameters-and-reflection"]}, {"d": 2, "q": "A developer wants a classifier prompt to follow a labeling style the model gets wrong when given only instructions. They add three labeled sample inputs and outputs after the system message. What is this approach called, and how long does the effect last?", "o": [{"t": "Zero-shot prompting, because no examples are involved", "c": false, "e": "Zero-shot means no examples."}, {"t": "Fine-tuning, which permanently changes the model weights", "c": false, "e": "Examples in a prompt do not train the model."}, {"t": "Reinforcement training that persists across all customers", "c": false, "e": "Prompt examples do not affect other customers or later calls."}, {"t": "Few-shot prompting, which conditions the model for that call only; nothing is learned permanently", "c": true, "e": "Examples steer the current request and do not change the model."}], "concept": "In a prompt, examples are input and output pairs. With no example, the technique is zero-shot. With one, it is one-shot. With several, it is few-shot. They show the model the pattern you want, for example a label set or a format.\n\nThe effect is local: examples condition the model for this call only, and nothing is learned permanently. In the Chat API they appear as sample user and assistant turns after the system message. Choose examples that show edge cases, and note that their order can matter.\n\nFew-shot examples improve consistency of format, vocabulary and style, but they do not guarantee schema validity or factual correctness. For a guaranteed shape, add Structured Outputs.\n\nFine-tuning is different: it changes model behavior with training data, has training and hosting costs, and must be repeated when the base model changes. It is the last rung of the improvement ladder: prompt, ground, better model, then fine-tune.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering"], "ref": ["prompt-engineering-parameters-and-reflection", "model-and-service-selection"]}, {"d": 2, "q": "A retrieval-heavy prompt is hitting the context limit. The retrieved data is a list of product attributes for 40 items. Which space-saving tip from the guidance fits best?", "o": [{"t": "Duplicate the data at the start and at the end", "c": false, "e": "This doubles the token use."}, {"t": "Spell every number in words", "c": false, "e": "This can use more tokens, not fewer."}, {"t": "Add many consecutive spaces to align columns", "c": false, "e": "Consecutive spaces cost tokens."}, {"t": "Present tabular data compactly, for example as a table, and trim retrieved context to what matters", "c": true, "e": "Tables are compact for tabular data, and prompts compete for the context window."}], "concept": "A model has a context window, and everything in the prompt competes for it: instructions, examples, retrieved context, conversation history and the answer (for reasoning models, also hidden reasoning). Tokens cost money and add latency, so space efficiency matters.\n\nLearn's tips: tables are compact for tabular data; consecutive spaces cost tokens; spelling out a month can use fewer tokens than a fully numeric date; and trimming retrieved context to what matters helps most. For retrieval, keep the best few chunks that fit a token budget instead of everything.\n\nWhen tokens per minute becomes the bottleneck, shrink the prompt first (shorter system prompt, fewer or smaller chunks, a summary of old turns) before asking for more quota or moving to provisioned capacity. Check the split between input and output tokens with metrics.\n\nPrompt caching also lowers cost if the stable prefix is at least 1,024 tokens.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering", "https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/prompt-caching"], "ref": ["prompt-engineering-parameters-and-reflection", "capacity-cost-and-throttling"]}, {"d": 2, "q": "A team builds a GenAI app and wants to evaluate it at three points: when choosing a base model, before release with their own dataset and red teaming, and after release on real traffic. Which assignment of tools to stages is correct?", "o": [{"t": "Alerts for model selection and red teaming after release only", "c": false, "e": "Red teaming should also happen before release."}, {"t": "Benchmarks for model selection; own-dataset evaluators plus the AI red teaming agent before release; continuous and scheduled evaluation with alerts after release", "c": true, "e": "This matches the three evaluation stages."}, {"t": "Only manual testing at every stage", "c": false, "e": "Automated, repeatable evaluation is the recommended approach."}, {"t": "Continuous evaluation for model selection and benchmarks after release", "c": false, "e": "The stages are reversed."}], "concept": "Evaluation changes purpose across the lifecycle. Stage 1, base model selection, asks which model fits: use Foundry benchmarks on public data or your own data, and the Evaluation SDK on a model endpoint. Stage 2, pre-production, asks whether it is ready to ship: use your dataset with quality, safety and custom evaluators, the AI red teaming agent for attacks, and edge-case tests. Stage 3, post-production, asks whether it is still good: use continuous evaluation of sampled production traffic, scheduled evaluation with a test set to detect drift, scheduled red teaming and Azure Monitor alerts.\n\nEvaluators detect fabrications (groundedness), relevance, quality (coherence, fluency) and safety. Evaluation results can be analyzed with cluster analysis to group failures.\n\nRemember that evaluations in the agent playground are on by default and billed.\n\nRun the evaluation again after every meaningful change to catch regressions before users do.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/observability", "https://learn.microsoft.com/en-us/azure/foundry/concepts/built-in-evaluators"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 3, "q": "A moderation pipeline sends a meme image that contains overlaid text to a multimodal model, and then uses Content Safety to classify the combined content. Which severity scale does the service return for an image with text from a multimodal model?", "o": [{"t": "Only 0 to 3", "c": false, "e": "This range is not documented."}, {"t": "The full 0 to 7 scale (it can be trimmed on request)", "c": true, "e": "Image with text from a multimodal model uses the full scale."}, {"t": "Only 0, 2, 4, 6", "c": false, "e": "That is the trimmed scale returned for image-only content."}, {"t": "Only safe or unsafe", "c": false, "e": "The service returns severity levels."}], "concept": "Content Safety returns severity values for each of four categories: hate and fairness, sexual, violence and self-harm. The scale depends on content type. Text returns the full 0 to 7 (it can be trimmed to 0, 2, 4, 6 on request). Image-only content returns the trimmed scale of 0, 2, 4, 6. Image with text from a multimodal model returns the full 0 to 7 (trimmed on request).\n\nGuardrails present four levels (safe, low, medium and high). A threshold you set on a control flags content at that level and above. Content at the safe level is annotated but never filtered.\n\nWhen you design thresholds, apply filters on both sides: the prompt going in and the media coming out. Treat a \"safe\" annotation as a statement about harm categories only, not about brand or policy rules.\n\nTest the thresholds with real and adversarial examples, and adjust by category.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/harm-categories", "https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview"], "ref": ["responsible-ai-for-multimodal-content", "responsible-ai-governance"]}, {"d": 3, "q": "A weekly pipeline generates 1,000 marketing images. Filters block 2% of them; automated brand checks then fail 8% of the remaining images; reviewers reject another 5% of what remains after that. Each stage applies to the images left by the previous stage. About how many images are published?", "o": [{"t": "850", "c": false, "e": "This subtracts the percentages from 1,000 instead of applying them in sequence."}, {"t": "About 857", "c": true, "e": "1,000 x 0.98 = 980; 980 x 0.92 = 901.6; 901.6 x 0.95 = 856.5, so about 857."}, {"t": "902", "c": false, "e": "This stops after the brand check and ignores the reviewers."}, {"t": "980", "c": false, "e": "This counts only the safety filter."}], "concept": "Rejections in a review workflow compound, because each stage works on what the previous one let through. The workflow steps are: filter the prompt, generate, filter the output, run automated checks (brand rules, quality, forbidden content), human approval for public assets, attach provenance and label, publish and monitor, and learn from rejects.\n\nCalculation: 1,000 images. Safety filters block 2%, leaving 980. Brand checks fail 8% of those, leaving 980 x 0.92 = 901.6. Reviewers reject 5% of those, leaving 901.6 x 0.95 = 856.5, so about 857 are published and about 143 (roughly 14%) never reach the public.\n\nThe cost model must count the unpublished images, because they were paid for, and the team should study the top rejection reasons to improve prompts.\n\nKeep prompts, parameters and model versions with each asset, and keep the original with its Content Credentials as the system of record.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/content-safety/provenance-disclosure", "https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"], "ref": ["responsible-ai-for-multimodal-content", "image-and-video-generation"]}, {"d": 3, "q": "A team plans a new image generation feature and wants models that are generally available. According to the model table, which statement is correct?", "o": [{"t": "All gpt-image models are retired", "c": false, "e": "Several are GA and others are limited access."}, {"t": "`gpt-image-2`, `gpt-image-2.5-sunburst` and `gpt-image-2.5-flare` are GA, while `gpt-image-1.5`, `gpt-image-1` and `gpt-image-1-mini` are limited access", "c": true, "e": "GA models are preferred for production."}, {"t": "`dall-e-3` is the GA default and is recommended for new projects", "c": false, "e": "It was retired on March 4, 2026 and existing deployments no longer work."}, {"t": "Only Preview models can generate images", "c": false, "e": "GA models exist."}], "concept": "Model lifecycle goes Preview, GA, Deprecated and Retired. A retired model stops working: for example `dall-e-3` was retired on March 4, 2026, and deployments of it no longer work. A project that still targets it must migrate.\n\nFor image generation today, `gpt-image-2` and the Sunburst and Flare variants of `gpt-image-2.5` are GA, and `gpt-image-1.5`, `gpt-image-1` and `gpt-image-1-mini` are limited access. Quality values differ by family: GPT-Image-2 supports low, medium and high, while Sunburst and Flare also add xhigh and max, and the size rules also differ.\n\nExam guidance prefers GA features and wants Preview or limited-access options clearly marked. Before relying on a specific model, check the current model table, since lifecycle status changes.\n\nPin versions, subscribe to deprecation notices and plan replacements before retirement dates.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e", "https://learn.microsoft.com/en-us/azure/foundry/concepts/foundry-models-overview"], "ref": ["image-and-video-generation", "model-and-service-selection"]}, {"d": 3, "q": "A product team must analyze images of delivery packages, and the instructions about what to look for change every week as new damage types appear. The volume is low, and each question is different. Which tool fits better?", "o": [{"t": "A Content Understanding custom analyzer with a fixed field schema", "c": false, "e": "A schema is best when the same typed fields are needed from many images and instructions rarely change."}, {"t": "A vision-capable chat model with a prompt that is easy to edit", "c": true, "e": "One-off, open or often-changing questions suit a prompt-driven model."}, {"t": "An embedding model only", "c": false, "e": "It produces vectors and does not describe damage."}, {"t": "Azure Translator", "c": false, "e": "It translates text and does not analyze images."}], "concept": "Two tools analyze images. A vision-capable chat model accepts images as part of a message and answers in text. It is flexible and prompt-driven. A Content Understanding image analyzer is a reusable configuration with a field schema, so every image returns the same typed fields, with options for confidence.\n\nThe comparison: for a one-off, open question, a chat model is best and an analyzer is overkill. For the same fields from 100,000 images, an analyzer is best because a chat model can drift. For typed JSON with confidence, an analyzer has it built in, while a chat model needs extra prompting. For instructions that change often, a chat model is easy (edit the prompt), while an analyzer needs an update.\n\nIn this scenario, changing instructions and low volume point to the chat model. Once the damage types stabilize and volume grows, an analyzer becomes attractive.\n\nAlways tell the model to describe only what is visible and to say when something is not visible.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/gpt-with-vision", "https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/image/overview"], "ref": ["multimodal-understanding"]}, {"d": 3, "q": "A publisher wants captions and metadata for a large photo archive, optimized for use in a retrieval index, without designing a custom schema. Which Content Understanding analyzer is intended for this?", "o": [{"t": "`prebuilt-invoice`", "c": false, "e": "It is a domain analyzer for invoices."}, {"t": "`prebuilt-videoSearch`", "c": false, "e": "It is for video and produces per-segment records."}, {"t": "`prebuilt-audio`", "c": false, "e": "It is a base analyzer for audio."}, {"t": "`prebuilt-imageSearch`, which produces descriptions for retrieval", "c": true, "e": "It is the RAG-oriented analyzer for images."}], "concept": "Content Understanding provides prebuilt analyzers in four groups. Base analyzers (`prebuilt-document`, `prebuilt-audio`, `prebuilt-video`, `prebuilt-image`) are starting points for custom analyzers. RAG analyzers (`prebuilt-documentSearch`, `prebuilt-videoSearch` and the image equivalent `prebuilt-imageSearch`) produce Markdown and descriptions optimized for retrieval. Domain-specific analyzers (`prebuilt-invoice`, `prebuilt-receipt`, `prebuilt-idDocument`) cover common business documents. Custom analyzers extend a base with your own field schema.\n\nFor a photo archive that will feed search or RAG, the image search analyzer gives descriptions that can be embedded and indexed. If the team later needs the same typed fields from every image (for example product type and damage), they would create a custom analyzer based on `prebuilt-image`.\n\nImage analyzers are not optimized for text-primary content; pages of text should go to a document analyzer.\n\nChoose the narrowest prebuilt analyzer first.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers", "https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/image/overview"], "ref": ["multimodal-understanding", "content-understanding-and-document-intelligence"]}, {"d": 3, "q": "A Content Understanding video analyzer is used to build a subtitle file and a speaker-labeled transcript. In which form does the transcript appear in the output?", "o": [{"t": "As a PDF file attached to the response", "c": false, "e": "It is returned in Markdown and JSON."}, {"t": "Only as a list of music tracks and sound effects", "c": false, "e": "Only speech is transcribed."}, {"t": "As WEBVTT in the Markdown output, with speaker diarization and multilingual support", "c": true, "e": "The transcript, key frames and shot data come from the content extraction stage."}, {"t": "As a separate invoice-like JSON schema that you must define", "c": false, "e": "The transcript is part of the extracted content."}], "concept": "In the first stage of Content Understanding video processing, content extraction, the analyzer produces the raw material: a transcript with speaker diarization and multilingual support, key frames, and shot detection (shot boundaries are returned with `returnDetails: true`). The transcript appears as WEBVTT in the Markdown output. Only speech is transcribed, not music or sound effects.\n\nThe second stage adds field extraction (your `fieldSchema` fields with `generate` or `classify` methods) and segmentation (`enableSegment` with a category description). The output is Markdown (transcript and key frames) plus JSON (descriptions, segment boundaries, fields).\n\nWEBVTT is a subtitle format, which makes the transcript easy to align with video time. Set the locales where applicable to improve quality.\n\nLimits: about one frame per second is sampled, and frames are resized to 512x512.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/overview"], "ref": ["multimodal-understanding"]}, {"d": 3, "q": "A newsroom runs an uploaded image through Content Provenance Detection. The image shows a Microsoft invisible watermark signal, but no Content Credentials (C2PA) metadata. How should the result be interpreted?", "o": [{"t": "The watermark supports the claim that the content was produced by the system, and the missing metadata likely means it was lost in editing or conversion", "c": true, "e": "A present signal supports AI generation; metadata is often stripped by tools."}, {"t": "The image is definitely authentic and human-made because C2PA is missing", "c": false, "e": "An absent signal proves nothing."}, {"t": "The image must be rejected because both signals must always be present", "c": false, "e": "Either signal may be present alone."}, {"t": "Provenance proves who wrote the prompt and who owns the copyright", "c": false, "e": "Provenance does not prove authorship."}], "concept": "Foundry uses two provenance technologies for supported models. Content Credentials (C2PA) is signed metadata attached to the file; recipients can verify it was not altered. An invisible watermark is an imperceptible signal inside the content; it can survive when metadata is removed, though verifying it may need specialized tools.\n\nInterpretation rules: a present signal supports \"AI-generated by this system\"; an absent signal proves nothing; provenance does not decide trustworthiness or prove authorship; and signals may not survive cropping, resizing, filters, format conversion, transcoding or compression.\n\nHere the watermark is present and the metadata is gone. That is a typical outcome for an image resized by a tool that strips metadata. The correct reading is \"metadata lost in the workflow\", not \"not AI-generated\".\n\nCheck files with the Content Provenance Detection website or API, keep originals with their credentials, and use tools that preserve credentials.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/content-safety/provenance-disclosure"], "ref": ["responsible-ai-for-multimodal-content"]}, {"d": 4, "q": "A manager uploads a 3-hour meeting recording and wants the transcript immediately in one synchronous call. Which statement about fast transcription is correct?", "o": [{"t": "Real-time transcription is the only option for files", "c": false, "e": "Batch and fast are file-based modes."}, {"t": "Fast transcription is for files under about 2 hours and 300 MB, so a 3-hour recording should use batch transcription", "c": true, "e": "The file exceeds the limit."}, {"t": "Text to speech converts the recording into text", "c": false, "e": "Text to speech does the opposite direction."}, {"t": "Fast transcription accepts files of any length", "c": false, "e": "It has limits on duration and size."}], "concept": "Speech to text has four routes. Real-time (SDK, CLI or REST short audio) gives interim and final results as speech is heard, for live captions and voice commands. Fast transcription is synchronous for one file when you want the result now; it is meant for files under about 2 hours and 300 MB. Batch transcription is an asynchronous REST job for many or long files, with results written to storage and optional webhooks. Custom speech improves accuracy for any of them.\n\nA 3-hour file is over the fast transcription limit, so batch is the route. Submit a job with options such as diarization (mono audio needed for 3 or more speakers, up to 35), poll or use a webhook, then read the result files with text, timestamps and speaker labels.\n\nRemember the result time-to-live between 6 hours and 31 days.\n\nDecide with three questions: live or recorded? result needed now? how many files, and how long?", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/overview", "https://learn.microsoft.com/en-us/azure/ai-services/speech-service/batch-transcription-create"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A conference app uses live speech translation and a custom speech model for the speakers' technical vocabulary. Which TWO statements are correct?", "o": [{"t": "The standard API detects the spoken language continuously and needs no input language", "c": false, "e": "That describes Live Interpreter; the standard API needs a source language."}, {"t": "A custom speech model can be used with real-time speech to text, speech translation and batch transcription", "c": true, "e": "Custom models are not limited to one mode."}, {"t": "Custom speech models cannot be combined with speech translation", "c": false, "e": "They can be used with speech translation."}, {"t": "Speech translation only produces text and never synthesized speech", "c": false, "e": "Final results can be synthesized, giving speech-to-speech translation."}, {"t": "The Speech service translates directly into two target languages; more targets need a Foundry (multi-service) resource, with translation fees beyond the second", "c": true, "e": "This is the documented target limit."}], "concept": "Speech translation translates live audio. Speech to text and speech to speech translation work through the Speech SDK or CLI. Interim results arrive while speech continues, and final results can be synthesized. In the standard API you set the source language and the target languages. Live Interpreter detects the spoken language continuously, switches languages mid-session and supports bring-your-own personal voice.\n\nTargets: the Speech service translates into two target languages directly. For more, use a Foundry (multi-service) resource; translation fees then apply for each language beyond the second.\n\nCustom speech improves recognition of your vocabulary and conditions. A custom model works for real-time speech to text, speech translation and batch. Measure with word error rate before you train.\n\nFor documents or text, use Translator rather than Speech.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/speech-translation", "https://learn.microsoft.com/en-us/azure/ai-services/speech-service/custom-speech-overview"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A localization tool receives Serbian text written in Cyrillic and needs to show the same words in Latin script, without translating them into another language. Which Translator operation does this?", "o": [{"t": "Document translation", "c": false, "e": "It translates whole files and preserves layout."}, {"t": "Languages", "c": false, "e": "It lists supported languages and needs no authentication."}, {"t": "Translate", "c": false, "e": "It changes the language of the text."}, {"t": "Transliterate", "c": true, "e": "It converts text from one script to another, for example Cyrillic to Latin."}], "concept": "Translator's text translation API has three operations in version `2026-06-06`. Languages lists supported languages and needs no authentication. Translate takes a single POST with one or more target languages and returns translations. Transliterate converts script without changing the language, for example Cyrillic to Latin.\n\nThis difference matters. Translation maps meaning from one language to another. Transliteration maps characters from one writing system to another, so a person who reads Latin letters can pronounce Cyrillic words.\n\nThe latest GA version `2026-06-06` changed the request and response shape: the request array is `inputs`, and the response array is `value`. Translate can use standard neural machine translation or a supported LLM deployment (which needs a Foundry resource), with tone and gender controls for LLM translation.\n\nChoose the operation by the output you want: another language, another script, or a list.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/overview"], "ref": ["translation"]}, {"d": 4, "q": "A team trains a Custom Translator system and gets a BLEU score of 41. A colleague reports 38 from another system on a different test set and concludes the first system is better. What is wrong with this comparison?", "o": [{"t": "A higher BLEU score always means a lower
