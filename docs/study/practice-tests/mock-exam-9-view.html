cost", "c": false, "e": "BLEU measures translation quality against references, not cost."}, {"t": "BLEU measures speech recognition errors", "c": false, "e": "That is word error rate for speech, not BLEU."}, {"t": "BLEU should be compared only on the same test set; scores from different sets are not comparable", "c": true, "e": "BLEU compares output with a human reference, so the reference set must be the same."}, {"t": "BLEU scores below 50 are always invalid", "c": false, "e": "There is no such rule."}], "concept": "Custom Translator trains a custom neural machine translation (NMT) system in its own portal. The steps are: create a workspace and project, upload parallel documents (and dictionaries), train, review the BLEU score, publish, and call text translation with the custom model identifier. Accepted file types include ALIGN, PDF, LCL, HTML, XLF, TMX, TXT, DOCX and XLSX. With the right data, gains of 5 to 10 BLEU points are common, and dictionary-only training is possible when no parallel data exists.\n\nBLEU compares machine output with a human reference translation. Higher is better, but a score is only meaningful against the same test set. Two scores from two different sets cannot be ranked.\n\nCompare options by their purpose. A glossary applies fixed term mappings in a document translation job. Adaptive custom translation adapts an LLM with 5 to 10,000 aligned pairs. Custom Translator suits a large parallel corpus in a stable domain.\n\nDo not confuse BLEU (translation) with word error rate (speech recognition).", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/custom-translator/overview"], "ref": ["translation"]}, {"d": 4, "q": "A batch document translation job must always translate a company name unchanged and use approved terms for 200 product phrases. Which input and format provide this?", "o": [{"t": "A text-to-speech lexicon", "c": false, "e": "Lexicons control pronunciation in speech synthesis."}, {"t": "A BLEU score report", "c": false, "e": "It evaluates quality after training; it does not enforce terms."}, {"t": "A glossary file in CSV, XLIFF or TSV format supplied with the document translation job", "c": true, "e": "Glossaries apply fixed term mappings during translation."}, {"t": "A Speech custom endpoint", "c": false, "e": "It affects speech recognition, not document translation."}], "concept": "Customization options for translation differ in effort and power. A glossary is a list of fixed term mappings applied to a document translation job, supplied as CSV, XLIFF or TSV; it is ideal for product names and approved terms. Adaptive custom translation adapts an LLM using a small bilingual set (5 to 10,000 aligned pairs of up to 500 characters each) in minutes. Custom Translator trains a custom NMT system from a large parallel corpus in a stable domain.\n\nFor this scenario, 200 phrases and a company name that must not change are exactly what a glossary is for.\n\nBatch document translation uses blob containers, access through SAS tokens or managed identity (identity is preferred), and glossary files. Layout and format are preserved, and scanned PDFs go through OCR. Content is processed in the region of the Translator resource.\n\nPick the lightest option that meets the need.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/document-translation/overview", "https://learn.microsoft.com/en-us/azure/ai-services/translator/custom-translator/overview"], "ref": ["translation"]}, {"d": 4, "q": "A team builds an LLM-powered translation flow for product descriptions that contain placeholders such as `{order_id}` and prices. Which TWO steps follow the recommended flow?", "o": [{"t": "Skip all checks, because LLM output never changes placeholders", "c": false, "e": "Models can alter or drop placeholders."}, {"t": "Cache translations by source hash so unchanged text is not re-translated", "c": true, "e": "This saves cost and keeps stable output."}, {"t": "Set a high temperature to make wording more varied", "c": false, "e": "Translation needs a low temperature and consistent output."}, {"t": "Check the output for intact placeholders, numbers, glossary hits and length before using it", "c": true, "e": "Automated checks catch broken placeholders and number changes."}, {"t": "Send high-risk legal text to production without any human review", "c": false, "e": "High-risk content should be reviewed by a person."}], "concept": "An LLM translation flow has six steps. Detect the source language (Translator or Language detection). Build the prompt: target language, tone, audience, glossary and a \"do not translate\" list. Call the model with a low temperature, and request structured output when segments must align. Check the result: placeholders, numbers, glossary hits and length. Review high-risk content with a person. Cache by source hash so unchanged text is not re-translated.\n\nThe check step is where most production bugs are caught. A model may rewrite `{order_id}`, change a price format or drop a sentence. Automated tests compare placeholders and numbers between source and target.\n\nUse Translator's text translation API when you need scale, glossaries and predictable cost; use an LLM when tone, context or adaptive behavior matters. In the `2026-06-06` API, LLM translation has tone and gender controls and accepts up to 50 elements per request.\n\nKeep high-volume baseline traffic on neural machine translation.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/overview"], "ref": ["translation"]}, {"d": 4, "q": "A compliance team wants an LLM to summarize regulatory filings for auditors, with every statement tied to a clause number, and unclear passages flagged rather than guessed. Which design follows the guidance for customizing language model outputs for domain tasks?", "o": [{"t": "Ask for a free-form creative summary at a high temperature", "c": false, "e": "This increases invention and inconsistent format."}, {"t": "Summarize without citations to keep the text short", "c": false, "e": "Citations make verification possible."}, {"t": "Define a structured output schema with fields for summary, clause references and an `unknown` or flag value, use a low temperature, require citations, and review high-risk output with a person", "c": true, "e": "This constrains the shape, reduces invention and keeps accountability."}, {"t": "Run the model with no evaluation because compliance text is formal", "c": false, "e": "Evaluation on labeled samples is still required."}], "concept": "Customizing language model output for a domain task, such as compliance summarization or domain extraction, uses the same building blocks. First define the output schema: for example `summary`, `clauses` (with numbers) and `flags`. Write the prompt with the role, the task, the definition of each label, a few examples and an \"out\" such as `unknown` for unclear text. Constrain the output with Structured Outputs so the application can parse it. Set a low temperature for consistent results. Ask for inline citations, which force two errors for an invention (a false statement and a false citation) and make checking easy. Evaluate on a labeled sample and compare against a baseline. Treat the analyzed text as untrusted, because it may contain instructions.\n\nAdd a human review for high-risk output, and run PII detection or redaction first when the text includes personal data.\n\nFor narrow, high-volume, fixed tasks, a Language feature may be cheaper, but nuance and long context favor an LLM.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/structured-outputs", "https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering"], "ref": ["text-analysis-language-and-llms", "prompt-engineering-parameters-and-reflection"]}, {"d": 5, "q": "A team asks which sources a search indexer can read from without using preview features. Which list contains only data sources the guidance names as generally supported?", "o": [{"t": "Blob Storage, ADLS Gen2, Cosmos DB, Azure SQL, Table Storage and OneLake", "c": true, "e": "These are listed as supported sources; SharePoint, Azure Files and MySQL are previews."}, {"t": "A local laptop folder and a USB drive", "c": false, "e": "Indexers pull from supported Azure data sources, not from local devices."}, {"t": "Any website, scraped automatically", "c": false, "e": "A web crawler is not an indexer data source."}, {"t": "SharePoint, Azure Files and MySQL", "c": false, "e": "These are listed as previews."}], "concept": "An indexer connects four objects. The data source is the connection to the origin: Blob, ADLS Gen2, Cosmos DB, SQL, Table and OneLake are generally supported, while sources such as SharePoint, Azure Files and MySQL appear as previews. The index is the destination schema, which you create yourself. The skillset is optional enrichment. The indexer is the crawler that connects the three and runs on demand or on a schedule, as often as every five minutes.\n\nOne indexer uses one data source and writes to one index; many indexers can write to the same index.\n\nWhen a source is not supported, or you need updates faster than every five minutes, use push indexing: your code sends JSON documents to the index through the SDK or REST API.\n\nPrefer GA features for production and mark preview ones clearly.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-indexer-overview"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "An indexer must run the OCR skill on images embedded in PDFs. Which TWO statements about the configuration are correct?", "o": [{"t": "Set `imageAction` to `generateNormalizedImages` so that the skill receives `/document/normalized_images/*`", "c": true, "e": "Document cracking must hand the images to the skill."}, {"t": "The skill is bound to Foundry Tools and needs a billable resource beyond 20 documents per indexer per day", "c": true, "e": "Larger workloads require a billable resource."}, {"t": "OCR output is merged into the document content automatically without any skill", "c": false, "e": "A Merge skill puts OCR text back into the content at the right position."}, {"t": "The OCR skill returns audio transcripts for MP3 files", "c": false, "e": "There is no built-in audio-to-text skill."}, {"t": "The skill needs no extra setting and reads images even when `imageAction` is off", "c": false, "e": "Image extraction must be enabled in the indexer."}], "concept": "A scanned PDF has no text layer, so text must be read from page images. In an Azure AI Search skillset the OCR skill (`#Microsoft.Skills.Vision.OcrSkill`) reads printed and handwritten text from `.jpeg`, `.jpg`, `.png`, `.bmp` and `.tiff` files and from images embedded in PDFs or Office files.\n\nTo make it work, the indexer needs `imageAction: generateNormalizedImages` so document cracking passes images to the skill as `/document/normalized_images/*`. The skill outputs `text` and `layoutText` (lines, words and bounding boxes). Use a Merge skill to place OCR text back into the document text at the right position. Optional parameters are `defaultLanguageCode` and `lineEnding`; `detectOrientation` applies only to the legacy OCR v3.2 path.\n\nThe skill is bound to Foundry Tools and needs a billable resource beyond 20 documents per indexer per day.\n\nThere is no built-in skill for audio; use a custom Web API skill that calls a speech service.", "src": ["https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-ocr", "https://learn.microsoft.com/en-us/azure/search/cognitive-search-concept-intro"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A security auditor asks for a report of which end user ran which search query on an Azure AI Search service, using the built-in resource logs. What should the team know?", "o": [{"t": "Resource logs record operations and query text but not the user identity, so log the user in your application if you need it", "c": true, "e": "Search logs cannot attribute queries to end users."}, {"t": "Auditing is impossible, and queries cannot be logged", "c": false, "e": "Operations and query text are recorded."}, {"t": "Search stores a full copy of each user's profile in the logs", "c": false, "e": "This is not how logs work."}, {"t": "Resource logs identify the end user of every query automatically", "c": false, "e": "They do not contain user identity."}], "concept": "Azure AI Search has built-in protections you do not configure: TLS 1.2 or 1.3 on port 443, 256-bit AES encryption at rest, Microsoft backbone traffic and compliance certifications. Same-region Storage traffic uses private IPs, so you cannot add a storage firewall for it. Microsoft does not use your data to train models.\n\nYou configure: network access (IP firewall, private endpoint), authentication (prefer Microsoft Entra ID with role-based access control over keys), indexer connections with managed identity, document-level permissions, monitoring, optional customer-managed keys as a second encryption layer, and confidential computing in limited regions.\n\nMonitoring has a limit: resource logs record operations and query text but not the user identity. If an audit needs \"who asked what\", the calling application must log the user together with the query, with suitable privacy controls.\n\nDo not put sensitive text in object names.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-security-built-in"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A company must keep all data in the EU. Its search indexer uses a knowledge store, an enrichment cache and debug sessions, whose Storage account is currently in another region. What is the correct statement about data residency?", "o": [{"t": "Data stays in the chosen geography unless you write to Storage in another region, as the knowledge store, enrichment cache and debug sessions do; place that Storage account in the EU too", "c": true, "e": "These features write to Storage you choose."}, {"t": "Only the semantic ranker stores data outside the region", "c": false, "e": "The relevant features are knowledge store, cache and debug sessions."}, {"t": "Search always copies data to the United States for debugging", "c": false, "e": "Data stays in the chosen geography unless Storage elsewhere is used."}, {"t": "Residency cannot be affected by any setting", "c": false, "e": "Storage location for these features does matter."}], "concept": "Azure AI Search keeps data in the geography where you create the service. Several optional features write to a Storage account that you choose: the knowledge store (enriched data in blobs or tables for analytics), the enrichment cache (preview, reused skill outputs), and debug sessions (the enriched tree for inspection).\n\nIf that Storage account is in another region, data crosses the boundary. For a residency requirement, put the Storage account in the same geography (here, the EU) and check the rest of the pipeline: the Foundry resource used for skills, the embedding model deployment and the deployment type (use a regional or Data Zone type if processing location matters).\n\nAlso do not put sensitive text in object names, and prefer managed identities for connections.\n\nResidency is a property of the whole path of the data, not of one service.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-security-built-in", "https://learn.microsoft.com/en-us/azure/search/cognitive-search-concept-intro"], "ref": ["azure-ai-search-configuration", "capacity-cost-and-throttling"]}, {"d": 5, "q": "A Content Understanding classifier for scanned loan packets uses categories that point to other classifier analyzers, to form a tree. The team asks how deep a hierarchy can be and how many categories one classifier can have. What are the documented limits?", "o": [{"t": "Unlimited levels and unlimited categories", "c": false, "e": "Limits exist."}, {"t": "Ten levels for video and 20 categories for documents", "c": false, "e": "Video is limited to two levels."}, {"t": "One level only and 5 categories", "c": false, "e": "These numbers are too low."}, {"t": "Up to five nesting levels for documents and two for video, and up to 200 categories", "c": true, "e": "These are the documented limits."}], "concept": "Content Understanding can classify and split content inside the same analyze call. You define `contentCategories`, each with a description, and `enableSegment: true` when one file contains several documents (a loan package holding an application, a pay slip and a bank statement). No training data is needed.\n\nModes: classify only (the whole file gets one category); classify and analyze (each category can name an `analyzerId`, which is linked, not copied, to run extraction); classify and segment (finds multiple documents in one file, with a page as the minimum unit; in-page segmentation is preview); and hierarchical (categories point to classifier analyzers).\n\nLimits: up to five nesting levels for documents and two for video, up to 200 categories. Video supports segmentation only, with a single content category. Include an `other` category so unrelated pages are not forced into a listed one.\n\nCheck results on labeled samples and look at confidence.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/classifier"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "A team plans a skillset for a document library with OCR on images, language detection, chunking and embeddings. Finance asks which of these built-in steps does not need a billable Foundry resource. Which one is free?", "o": [{"t": "The Azure OpenAI embedding skill", "c": false, "e": "Embeddings are billed as model tokens on your deployment."}, {"t": "The OCR skill", "c": false, "e": "It is bound to Foundry Tools and needs a billable resource beyond 20 documents per indexer per day."}, {"t": "The language detection skill", "c": false, "e": "It uses Foundry Tools and is billed beyond the free allowance."}, {"t": "The Text Split skill, which chunks text", "c": true, "e": "Chunking with Text Split is free, while skills that use Foundry Tools need a billable resource for larger workloads."}], "concept": "Skills come in two kinds. Built-in skills use Foundry Tools: OCR, image analysis, language detection, translation, entity recognition, key phrases, PII detection and sentiment, plus the Azure OpenAI embedding skill, Azure Vision multimodal embeddings (preview) and the Content Understanding skill. Larger workloads need a billable Foundry resource attached to the skillset. Custom skills are your own code behind a web API.\n\nThe Text Split skill is the exception in cost terms: chunking is free, because it is processed inside the search service without calling a model. It has two modes, `pages` and `sentences`, with suggested defaults of 2000 characters and 500 overlap.\n\nCosts to plan: OCR beyond 20 documents per indexer per day, enrichment skills on every document, embedding tokens for every chunk (overlap increases the number of chunks), and Azure AI Search itself.\n\nThe enrichment cache (preview) can reduce repeated skill costs when you change later steps.", "src": ["https://learn.microsoft.com/en-us/azure/search/cognitive-search-concept-intro", "https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-chunk-documents"], "ref": ["azure-ai-search-configuration"]}]};</script>
