 problems are drift between runs, invented labels outside the list, and token cost at high volume. A hybrid pattern helps: run Language PII detection first, then send redacted text to the model.\n\nLanguage features are cheaper and deterministic for fixed tasks, while an LLM handles nuance such as sarcasm and long context.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview", "https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/structured-outputs"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A community site must flag user comments that contain hate speech or self-harm content and receive a severity value for each category. Which service is purpose-built for this?", "o": [{"t": "Azure Language key phrase extraction", "c": false, "e": "It returns main concepts and has no harm severity."}, {"t": "Azure AI Content Safety text classification across hate, sexual, violence and self-harm with severity levels", "c": true, "e": "It returns a severity per category, and text severity can be the full 0 to 7 scale."}, {"t": "Azure Speech custom voice", "c": false, "e": "It creates synthetic voices."}, {"t": "Azure Translator transliteration", "c": false, "e": "It converts scripts and does not classify harm."}], "concept": "Detecting \"safety issues and sensitive content\" in text is a different job from sentiment or tone. Azure AI Content Safety uses classifiers for four categories: hate and fairness, sexual, violence and self-harm. For text it returns severity on a full 0 to 7 scale (it can be trimmed to 0, 2, 4, 6). For images the scale is trimmed (0, 2, 4, 6), and for images with text from a multimodal model it is the full 0 to 7.\n\nThe classifiers are trained and tested on English, German, Japanese, Spanish, French, Italian, Portuguese and Chinese. They can work in other languages with less reliability, so test your own languages.\n\nSensitive personal data is a separate problem handled by PII detection in Azure Language, which can return redacted text.\n\nSentiment and tone describe how the writer feels; Content Safety describes whether the content is harmful. A tool may need both.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/harm-categories", "https://learn.microsoft.com/en-us/azure/ai-services/content-safety/overview"], "ref": ["responsible-ai-governance", "text-analysis-language-and-llms"]}, {"d": 4, "q": "A company uses batch document translation with a Translator resource that has a virtual network and private endpoints enabled. Calls fail when the application uses an access token against the regional endpoint. What is the correct approach?", "o": [{"t": "Use the custom domain endpoint, because access tokens cannot be used with VNet or private endpoints", "c": true, "e": "With VNet or private endpoints enabled, you must use the custom endpoint and cannot use an access token."}, {"t": "Disable layout preservation", "c": false, "e": "Layout does not influence the endpoint type."}, {"t": "Move the files to a public container", "c": false, "e": "Batch translation uses blob containers with SAS tokens or managed identity, and a public container does not solve the endpoint issue."}, {"t": "Switch to a bearer token with a longer lifetime", "c": false, "e": "Access tokens are not usable in this configuration."}], "concept": "Document translation has two modes. Batch (asynchronous) handles many or large files: the source and target are blob containers, access uses SAS tokens or managed identity (identity is preferred), and glossary files can be CSV, XLIFF or TSV. Synchronous translation handles one file and returns the result directly; it needs a custom-domain endpoint and no storage account.\n\nFormat and layout are preserved, and scanned PDFs go through OCR. Content is processed in the region of the Translator resource.\n\nWhen a virtual network or private endpoints are enabled on the Translator resource, you must use the custom endpoint and you cannot use an access token. The same custom-domain endpoint is required for synchronous translation.\n\nFor authentication in general, Microsoft Entra ID with a managed identity is preferred in enterprises because no secret has to be stored.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/document-translation/overview", "https://learn.microsoft.com/en-us/azure/ai-services/translator/overview"], "ref": ["translation"]}, {"d": 4, "q": "A developer submits a batch transcription job with `languageIdentification` listing 12 candidate locales, because the recordings could be in many languages. The job is rejected. What is the limit?", "o": [{"t": "Only one candidate locale is allowed", "c": false, "e": "Language identification needs at least two candidates."}, {"t": "Language identification accepts 2 to 10 candidate locales", "c": true, "e": "More than 10 candidates is not allowed."}, {"t": "It accepts between 12 and 20 locales", "c": false, "e": "The documented range is 2 to 10."}, {"t": "There is no limit, but results are slower", "c": false, "e": "A limit exists, and exceeding it fails the request."}], "concept": "Batch transcription is an asynchronous REST job. Options include `diarizationEnabled` for two speakers, or minimum and maximum speaker counts for three or more on mono audio (up to 35 speakers), `languageIdentification` with 2 to 10 candidate locales, `timeToLiveHours` from 6 hours to 31 days, and a destination container inside `properties`.\n\nLanguage identification lets the service decide which of your candidate languages is spoken in each file. Because it chooses among candidates, you must list at least two and at most ten. Choose candidates that you actually expect.\n\nCommon failures in batch jobs are diarization on stereo files (it needs mono), more than 10 candidate locales, results deleted after the time-to-live, and wrong storage permissions.\n\nWhen a language is known, set the locale directly, which improves quality and avoids candidate selection.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/batch-transcription-create"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A company wants a voice agent that customers can reach by phone number. The team asks whether Voice Live offers a direct SIP connection to the telephone network. What is the documented position?", "o": [{"t": "Voice Live only works with web browsers and cannot use telephony", "c": false, "e": "Telephony is supported through Teams Phone extensibility or Twilio."}, {"t": "Direct SIP is not offered; telephony works through Teams Phone extensibility or Twilio", "c": true, "e": "Voice Live is a WebSocket API, and telephony is reached through those integrations."}, {"t": "Direct SIP trunking is built in and enabled by default", "c": false, "e": "Direct SIP is not offered."}, {"t": "Phone calls require replacing Voice Live with the Translator service", "c": false, "e": "Translator does not provide voice agent telephony."}], "concept": "Voice Live is a managed WebSocket API for speech-to-speech conversation. It bundles speech to text, a model, text to speech, noise suppression, echo cancellation, and interruption and end-of-turn detection. It supports function calling (for example voice RAG), avatars, 140+ speech-to-text locales and 600+ voices, with Pro, Standard and Lite tiers.\n\nFor telephony, the documented routes are Teams Phone extensibility or Twilio. A direct SIP connection is not offered. So a design that must receive phone calls adds a telephony bridge in front of Voice Live.\n\nWhy use Voice Live rather than wiring speech to text, a model and text to speech yourself: lower latency and fewer moving parts. The cost is less control over each stage.\n\nOlder material may mention Direct Line Speech; the Learn URL for it now redirects to the Voice Live overview, so Voice Live is the current path.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/voice-live"], "ref": ["speech-solutions"]}, {"d": 5, "q": "A search service with one replica has 20 indexers scheduled every five minutes. Indexing jobs queue up and some run late. Which statement explains this and suggests a fix?", "o": [{"t": "Indexers always run in parallel without limit, so the delay must be a network problem", "c": false, "e": "Indexer concurrency is limited by search units."}, {"t": "Schedules shorter than five minutes fix the queue", "c": false, "e": "Five minutes is the minimum interval."}, {"t": "A search service runs one indexer job per search unit, so add replicas for concurrency; indexers also have no dedicated compute, so run times vary", "c": true, "e": "Concurrency depends on the number of search units."}, {"t": "Indexers use dedicated compute that you scale in the portal", "c": false, "e": "Indexers have no dedicated compute."}], "concept": "An indexer is the crawler that connects a data source, an optional skillset and an index. It runs on demand or on a schedule, as often as every five minutes. One indexer uses one data source and writes to one index, but many indexers can write to the same index.\n\nCapacity matters: a search service runs one indexer job per search unit, so add replicas to run more indexers at the same time. Indexers have no dedicated compute, so run times vary, and heavy indexing can cause query throttling.\n\nIf you need updates faster than every five minutes, use push indexing from your code with the SDK or REST API.\n\nTo monitor, check indexer status in the portal or with the Get Indexer Status API, and then run a query to verify results.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-indexer-overview"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A team enabled native blob soft delete and set `NativeBlobSoftDeleteDeletionDetectionPolicy` on the data source. Documents for deleted blobs still stay in the index. Which setup mistake explains this?", "o": [{"t": "Native soft delete works only for Azure SQL Database", "c": false, "e": "It is a Blob Storage feature."}, {"t": "The high water mark policy was enabled for the blob container", "c": false, "e": "That is a change-detection policy for databases, not a blob deletion fix."}, {"t": "The soft-delete retention period is shorter than the indexer interval, or blob versioning is on, so the indexer never sees the blob in the soft-deleted state", "c": true, "e": "The indexer removes a document only if it processes the blob while it is soft deleted, and versioning must be off."}, {"t": "The semantic configuration was missing", "c": false, "e": "Semantic ranking is unrelated to deletion detection."}], "concept": "An indexer does not track deletions in a data source. A deleted blob leaves an orphan document in the index unless you configure a deletion detection policy. There are two ways. Native blob soft delete (Blob Storage only) needs soft delete enabled on the storage account, a `NativeBlobSoftDeleteDeletionDetectionPolicy` on the data source, a retention period well above the indexer interval, and blob versioning turned off. The indexer removes a document only if it processes the blob while it is in the soft-deleted state. The alternative uses custom metadata, such as an `IsDeleted` key with a `SoftDeleteColumnDeletionDetectionPolicy`.\n\nIf the retention period is shorter than the interval between indexer runs, the blob is permanently removed before the indexer can see it as deleted.\n\nSet the policy before the first run. Documents deleted earlier stay in the index even after you add the policy.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-how-to-index-azure-blob-changed-deleted", "https://learn.microsoft.com/en-us/azure/search/search-indexer-overview"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "An integrated vectorization indexer calls an Azure OpenAI embedding deployment and often hits throttling. Which TWO actions follow the guidance?", "o": [{"t": "Schedule the indexer, for example every five minutes, so that throttled documents are retried in later runs", "c": true, "e": "Built-in batching and retry are not configurable, so scheduling catches the rest."}, {"t": "Use separate embedding deployments for indexing and for querying, because token limits are per model per subscription", "c": true, "e": "This protects query traffic from indexing load."}, {"t": "Route the embedding calls through a public internet proxy to avoid limits", "c": false, "e": "A proxy does not lift service limits and weakens security."}, {"t": "Increase the semantic ranker count", "c": false, "e": "The ranker is unrelated to embedding throughput."}, {"t": "Disable the embedding skill and index text only", "c": false, "e": "This removes vector search instead of solving throttling."}], "concept": "With integrated vectorization the indexer calls an embedding model for every chunk. Azure OpenAI limits tokens per minute per model per subscription, so a large indexing run can use up the limit and also slow down the embeddings needed at query time.\n\nThe guidance has two practical steps. First, create separate embedding deployments for indexing and for querying, so that bulk indexing does not starve user queries. Second, schedule the indexer, for example every five minutes. The built-in batching and retry logic are not configurable, and documents that were throttled are picked up in a later run.\n\nRelated facts: the vectorizer at query time must use the same embedding model as the skill, and shared private link works for Azure-to-Azure traffic only (group ID `openai_account` for Azure OpenAI).\n\nAlso watch total cost: overlap and small chunks increase the number of embedding calls.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-integrated-vectorization"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "A private-network design requires the Azure AI Search indexer to reach an Azure OpenAI resource for embeddings through a shared private link. Which statement is correct?", "o": [{"t": "Shared private link works for Azure-to-Azure connections, using the `openai_account` group ID for Azure OpenAI", "c": true, "e": "This is the documented identifier for that connection."}, {"t": "Shared private link works for any external HTTP endpoint on the internet", "c": false, "e": "It works for Azure-to-Azure only."}, {"t": "The group ID for Azure OpenAI is `sites`", "c": false, "e": "`sites` is for custom skills hosted on App Service or Functions."}, {"t": "No group ID is needed, because Search reaches Azure OpenAI over the public internet in every configuration", "c": false, "e": "In private designs a shared private link is used."}], "concept": "In a network-secured design, Azure AI Search must call other Azure services (Azure OpenAI for embeddings, or an Azure Function for a custom skill) without crossing the public internet. A shared private link creates a managed private connection from the search service to the target resource.\n\nIt works for Azure-to-Azure connections only. The group ID names the type of target: `openai_account` for Azure OpenAI, and `sites` for custom skills on App Service or Functions. After creation, the owner of the target resource approves the connection.\n\nThe same pattern appears in the other direction: the data sources need private endpoints, and DNS zones must resolve names to private IPs. Same-region Storage traffic already uses private IPs, so a storage firewall cannot be added for it.\n\nUse managed identity for the indexer's connections, and prefer Microsoft Entra ID with role-based access control over keys.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-integrated-vectorization", "https://learn.microsoft.com/en-us/azure/search/search-security-built-in"], "ref": ["azure-ai-search-configuration", "platform-network-and-reliability"]}, {"d": 5, "q": "A Content Understanding analyzer extracts \"ShipDate\" from shipping documents, but the model often returns the invoice date. The team wants to steer the extraction without changing code. Which setting does this?", "o": [{"t": "Write a precise `description` for the field, because it acts as a mini-prompt", "c": true, "e": "Field descriptions guide the model about what to extract."}, {"t": "Rename the analyzer", "c": false, "e": "The name does not influence extraction."}, {"t": "Set `enableBarcode` to false", "c": false, "e": "Barcode detection is unrelated to this field."}, {"t": "Increase the document `tableFormat` to markdown", "c": false, "e": "Table format changes output formatting, not which date is chosen."}], "concept": "A Content Understanding analyzer is a reusable configuration with an `analyzerId`, a `name`, a `description` (used by the model as context, so write it clearly), a base analyzer, `models`, `config` and a `fieldSchema`.\n\nThe `fieldSchema` lists fields with a type (`string`, `number`, `boolean`, `date`, `object`, `array`), a `description` that acts like a mini-prompt, and a `method`: `extract` (the value as it appears in the content), `classify` (pick from a fixed enum) or `generate` (free generation). Dates and numbers are normalized automatically.\n\nSo a vague description such as \"date\" invites the wrong date. A precise one such as \"The date the goods are shipped, not the invoice date; usually near the carrier name\" steers the extraction.\n\nAvoid nesting deeper than two or three levels, and use confidence and grounding (`estimateFieldSourceAndConfidence`) to route low-confidence values to review.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "A team must produce a validated, calculated result from a single multi-page financial document, for example checking totals against line items. They accept higher token use and time. Which Content Understanding option is meant for answers built from evidence?", "o": [{"t": "Disable layout and OCR to speed up processing", "c": false, "e": "This removes information the calculation needs."}, {"t": "Use the `prebuilt-videoSearch` analyzer", "c": false, "e": "It is for video retrieval, not document calculations."}, {"t": "Use `enableSegment` with 200 categories", "c": false, "e": "Segmentation splits content; it does not reason across fields."}, {"t": "Set `config.workflow` to `agentic` on a document analyzer (preview), one input file per request", "c": true, "e": "Agentic mode is for calculations, validations and complex tables, with more tokens and the advanced contextualization rate."}], "concept": "Content Understanding analyzers can run in two workflows. The default workflow performs standard extraction. Agentic mode (preview, API `2026-06-01-preview`) is for answers that must be built from evidence: calculations, validations and complex tables. You set `config.workflow` to `agentic` on a document analyzer, with one input file per request. It uses more tokens and time and the advanced contextualization rate.\n\nThe skills outline mentions \"single-task and pro-mode\" pipelines. The current Learn pages do not use those exact terms. A working model is: standard (single-task) handles one analyzer, one schema and one result across modalities, while pro-style reasoning applies to documents only, across several documents or reference data. The closest documented feature today is agentic mode.\n\nDo not choose agentic mode for video or audio, and do not chain separate pipelines when one standard analyzer covers the content.\n\nCheck the outline wording again before the exam.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference", "https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/document/overview"], "ref": ["content-understanding-and-document-intelligence"]}]};</script>
