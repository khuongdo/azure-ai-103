<div id="app"></div>
<script>window.MOCK_EXAM = {"id": "mock-7", "title": "AI-103 Mock Exam 7", "shortTitle": "Mock exam 7", "description": "Full-length mock exam with 50 scenario questions. This test focuses on architecture, operations and calculations: PTU sizing, Cosmos DB throughput, private DNS, recovery, locks and policy, CI/CD, guardrail settings, retrieval tuning, evaluators, image editing requests, speech and translation operations, and indexer design.", "defaultMinutes": 120, "domains": [{"id": 1, "name": "Plan and manage an Azure AI solution", "weight": "25-30%", "count": 14}, {"id": 2, "name": "Implement generative AI and agentic solutions", "weight": "30-35%", "count": 16}, {"id": 3, "name": "Implement computer vision solutions", "weight": "10-15%", "count": 7}, {"id": 4, "name": "Implement text analysis solutions", "weight": "10-15%", "count": 7}, {"id": 5, "name": "Implement information extraction solutions", "weight": "10-15%", "count": 6}], "questions": [{"d": 1, "q": "A company runs a customer copilot on a Provisioned deployment. To save money, an engineer proposes scaling the PTUs up every morning at 8:00 and down every evening at 18:00 with a scheduled job. What is the main risk of this plan?", "o": [{"t": "Provisioned deployments cannot be changed after creation", "c": false, "e": "PTUs can be changed, but doing it daily is not a safe plan."}, {"t": "PTUs lose their quota each time they are scaled down", "c": false, "e": "Quota is a policy limit and is not consumed by scaling; capacity is the problem."}, {"t": "Scaling PTUs up and down is blocked by Azure Policy by default", "c": false, "e": "No such default block exists; the risk is capacity, not policy."}, {"t": "Capacity is not guaranteed when you scale back up, so the deployment may fail to scale at 8:00; use steady provisioned capacity with spillover for bursts instead", "c": true, "e": "Scaling down releases capacity back to the pool, and there is no promise you can get it back."}], "concept": "A PTU (provisioned throughput unit) is a normalized slice of model capacity. Foundry reserves it for you and bills it hourly whether or not you send requests. Two ideas must be kept apart. Quota is a free policy limit on how many PTUs you may deploy. Capacity is the real hardware available right now for a model version. Having quota does not guarantee capacity.\n\nWhen you delete or scale down, capacity returns to a shared pool. If you later scale up, the capacity may not be there, and the operation fails. That is why Learn advises against planning to scale up and down with daily traffic. Continuous hourly billing at high use also usually costs more than a reservation.\n\nBetter design: size provisioned capacity for the steady base load, and let spillover send bursts to a standard deployment.\n\nMemory aid: quota is permission to rent; capacity is a car actually on the lot.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/provisioned-throughput", "https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "A provisioned deployment returns HTTP 429 when it is full. The team enables spillover. Which statement describes how spillover works?", "o": [{"t": "Overflow requests are sent to any deployment in any subscription of the tenant", "c": false, "e": "The target is a standard deployment in the same Foundry resource."}, {"t": "Overflow requests are redirected to a standard deployment in the same Foundry resource, for all requests or per request with the `x-ms-spillover-deployment` header", "c": true, "e": "This is the documented behavior for Azure OpenAI models."}, {"t": "Spillover doubles the PTUs of the deployment automatically", "c": false, "e": "It redirects traffic; it does not change PTU capacity."}, {"t": "Spillover works for every model, including Llama and DeepSeek deployments from other providers", "c": false, "e": "Those deployments currently do not support spillover."}], "concept": "A provisioned deployment has fixed capacity. When it is full it returns a non-200 status such as 429. The Provisioned Utilization metric (PTUs consumed divided by PTUs deployed) tells you when it is at or above 100%.\n\nSpillover handles the overflow. When enabled, requests that the provisioned deployment cannot take are redirected to a standard (pay-per-token) deployment in the same Foundry resource. You can enable it for all requests or for one request with the `x-ms-spillover-deployment` header, which names the target.\n\nThis gives you a predictable base (provisioned, consistent latency) and an elastic top (standard, pay per use). Azure OpenAI models support it. Deployments of DeepSeek and Llama from other providers currently do not.\n\nSpillover is a routing feature; it does not add capacity to the provisioned deployment.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/provisioned-throughput", "https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "You size a Data Zone Provisioned deployment for `gpt-5.2`. Learn lists Input TPM per PTU = 3,400, output-to-input ratio = 8 and a scale increment of 5. Peak load is 600 requests per minute, with an average prompt of 500 tokens and an average response of 50 tokens. Forty percent of input tokens are served from the prompt cache. How many PTUs should you deploy?", "o": [{"t": "124", "c": false, "e": "This is the rounded value of 123.5 but not a valid size, because deployments scale in steps of 5."}, {"t": "55", "c": false, "e": "This counts only the uncached input (180,000 / 3,400 = 52.9) and forgets the weighted output tokens."}, {"t": "160", "c": false, "e": "This ignores the cache rate (300,000 + 240,000 = 540,000; 540,000 / 3,400 = 158.8, rounded to 160)."}, {"t": "125", "c": true, "e": "Input TPM 300,000 and output TPM 30,000. Normalized TPM = 300,000 x 0.6 + 8 x 30,000 = 420,000. 420,000 / 3,400 = 123.5, rounded up to the next increment of 5."}], "concept": "The documented formulas for sizing are:\n\nInput TPM = peak RPM x average prompt size. Output TPM = peak RPM x average response size. Normalized TPM = Input TPM x (1 - cache rate) + output-to-input ratio x Output TPM. PTUs = Normalized TPM / Input TPM per PTU, then round up to the scale increment.\n\nHere: Input TPM = 600 x 500 = 300,000. Output TPM = 600 x 50 = 30,000. Cached input is removed: 300,000 x 0.6 = 180,000. Output counts eight times: 8 x 30,000 = 240,000. Normalized = 420,000. Divide by 3,400 = 123.5. The increment is 5, so the answer is 125.\n\nNotice that output tokens are the larger part (240,000 of 420,000) although there are ten times fewer of them. Newer model families use normalized token accounting where cached tokens consume capacity, so always read the sizing page for the model.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/provisioned-throughput-sizing"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "A bank uses the standard agent setup. Three projects use Responses API agents and a fourth project uses only classic (Assistants-style) agents. All projects use the same Azure Cosmos DB account. Each Responses project needs 5 containers and the classic project needs 3 containers, each container with 1,000 RU/s. What total throughput must be provisioned for the agent data?", "o": [{"t": "18,000 RU/s", "c": true, "e": "3 projects x 5 containers x 1,000 = 15,000, plus 1 project x 3 containers x 1,000 = 3,000."}, {"t": "20,000 RU/s", "c": false, "e": "This treats every project as Responses (4 x 5 x 1,000)."}, {"t": "12,000 RU/s", "c": false, "e": "This treats every project as classic (4 x 3 x 1,000)."}, {"t": "3,000 RU/s", "c": false, "e": "This is only the minimum account throughput, not the requirement for these projects."}], "concept": "In the standard agent setup, conversations, agent definitions and run state live in your Azure Cosmos DB for NoSQL account. Each project needs 3 to 5 containers of 1,000 RU/s each. Three containers are created at provisioning, and up to two more appear when Responses API agents are used.\n\nThe rule gives a simple calculation. A project with Responses API agents needs 5 x 1,000 = 5,000 RU/s. A project with only classic agents needs 3 x 1,000 = 3,000 RU/s. Add them: 3 x 5,000 + 1 x 3,000 = 18,000 RU/s.\n\nToo little throughput causes provisioning failures. The minimum account throughput is 3,000 RU/s, and both provisioned and serverless modes are supported.\n\nKeep the Azure OpenAI resource, the Foundry account and the project in the same region, and give the Foundry account's managed identity the right Cosmos DB data-plane roles.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/use-your-own-resources"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "You create a private endpoint for a Foundry resource and want names such as `myresource.openai.azure.com` and `myresource.services.ai.azure.com` to resolve to the private IP address inside your virtual network. Which set of private DNS zones do you link for the Foundry resource?", "o": [{"t": "`privatelink.blob.core.windows.net` for all three endpoints", "c": false, "e": "That zone is for blob storage and does not resolve Foundry names."}, {"t": "Only `privatelink.search.windows.net`", "c": false, "e": "That zone is for Azure AI Search."}, {"t": "`privatelink.cognitiveservices.azure.com`, `privatelink.openai.azure.com` and `privatelink.services.ai.azure.com`", "c": true, "e": "These are the three zones listed for a Foundry resource."}, {"t": "Only `privatelink.documents.azure.com`", "c": false, "e": "That zone is for Azure Cosmos DB for NoSQL."}], "concept": "A private endpoint gives a service a private IP address inside your virtual network. But applications use names, not IP addresses. If the name still resolves to the public IP, traffic does not use the private endpoint. So private networking has two halves: the private endpoint, and DNS that returns the private address.\n\nEach Azure service has its own private DNS zone names. For Foundry these are `privatelink.cognitiveservices.azure.com`, `privatelink.openai.azure.com` and `privatelink.services.ai.azure.com`. For Azure AI Search it is `privatelink.search.windows.net`, for Cosmos DB `privatelink.documents.azure.com`, and for blob storage `privatelink.blob.core.windows.net`.\n\nLink each zone to the virtual network. If you use a custom DNS server, forward those zones to the Azure DNS virtual server `168.63.129.16`.\n\nTest with `nslookup` from a VM inside the network: it must return a private address.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks", "https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A team moves to a network-secured setup and wants to use the File Search tool with files stored in Blob Storage, and the Code Interpreter tool with file upload. Which statement about tool support in a private setup is correct?", "o": [{"t": "File Search with Blob Storage is the only supported option in private setups", "c": false, "e": "It is listed as not supported."}, {"t": "All tools work identically in private and public setups", "c": false, "e": "Learn lists specific limits for private setups."}, {"t": "Bing grounding works in every region in a private setup", "c": false, "e": "It is limited to the listed regions."}, {"t": "Blob Storage files with the File Search tool are not supported, and Code Interpreter works without file upload and download unless a container is pre-created through the SDK", "c": true, "e": "These are the documented limits in a private setup."}], "concept": "Network isolation changes what some tools can do. In the network-secured standard setup, the agent runtime is injected into a delegated subnet, data stores are reached through private endpoints, and traffic stays off the public internet.\n\nLearn lists limits for tools in that setup. Files in Blob Storage used with the File Search tool are not supported. Code Interpreter works without file upload and download unless you pre-create a container through the SDK. Bing grounding is limited to listed regions.\n\nSo a design review must check each planned tool against the private-setup limits before committing to the architecture. A tool that works in the playground of a public project may fail in a locked-down one.\n\nRelated rules: the Foundry resource must be in the same region as the virtual network, and the agent subnet is dedicated to one Foundry resource.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "After a database incident, a team wants to restore the Cosmos DB account used by the Agent Service. A restore creates a new account with the original name, but the restore fails. Which preparation was missing?", "o": [{"t": "A larger virtual network address space", "c": false, "e": "Address space does not affect the name used by a restore."}, {"t": "A unique, organization-specific account name, with continuous backup enabled before the incident", "c": true, "e": "A restore fails if the original name is taken, and point-in-time restore is unavailable unless continuous backup was enabled beforehand."}, {"t": "A system-assigned managed identity on the Foundry project", "c": false, "e": "Learn recommends a user-assigned identity, but this does not cause a restore name conflict."}, {"t": "A Provisioned deployment for the chat model", "c": false, "e": "Model capacity has nothing to do with restoring the data store."}], "concept": "Foundry Agent Service has no built-in backup or point-in-time restore, so recovery depends on settings you configure before an incident. For Azure Cosmos DB: enable continuous backup (retention tiers of 7, 30 or 35 days) with point-in-time restore, which is unavailable unless it was enabled beforehand. Use a unique, organization-specific account name, because a restore creates a new account with the original name and fails if that name is taken. Add read replication to a failover region with service-managed failover.\n\nThe same name rule applies to Azure AI Search: use a unique, organization-specific service name. For storage, use GZRS for customer-managed failover. Use a user-assigned managed identity for the project so role assignments survive recreation, and the standard agent setup.\n\nThese checks are done in advance, not during the incident.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/high-availability-resiliency"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A team put delete locks on its Cosmos DB account, Storage account and AI Search service. A few weeks later, an engineer with the Foundry User role deletes all conversation threads through the Agent Service API. Why did the locks not prevent this?", "o": [{"t": "Locks are removed automatically after 30 days", "c": false, "e": "Locks stay until someone removes them."}, {"t": "Delete locks only work on Sundays", "c": false, "e": "Locks have no schedule."}, {"t": "Foundry User cannot delete anything, so the report must be wrong", "c": false, "e": "Even built-in roles such as Foundry User can delete operational data through the Agent Service APIs."}, {"t": "Locks protect the Azure resources, not the data inside containers, indexes or individual agents and threads; no built-in role is read-only for these operations", "c": true, "e": "Operational data can be deleted through the API, so standing delete permissions should not be granted."}], "concept": "A delete lock stops someone from deleting an Azure resource, for example the whole Cosmos DB account. It does not stop someone from deleting data inside the resource: documents in containers, entries in an index, or agents and threads removed through the Agent Service APIs.\n\nLearn notes that even built-in roles such as Foundry User can delete operational data through those APIs, and no built-in AI role is read-only for them. So in production you should grant standing delete permissions to no one, use Azure Policy `denyAction` and delete locks on critical resources, keep continuous backup, and define agents as code so they can be recreated.\n\nLocks need Owner to create. They are one layer of several.\n\nThink of a lock as a padlock on the filing cabinet: it does not stop someone who has the key from shredding the papers inside.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/high-availability-resiliency"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A regulated company uses hosted agents and requires customer-managed keys for all data. Which statement about customer-managed key (CMK) coverage is correct?", "o": [{"t": "Hosted agents are only partly covered, because the `$HOME` filesystem is on platform-managed storage that is not encrypted with CMK", "c": true, "e": "Prompt agents support CMK only with bring-your-own storage, and hosted agents have this gap."}, {"t": "Hosted agents are fully covered by CMK once the Foundry resource has a key", "c": false, "e": "Learn lists the `$HOME` filesystem as not encrypted with CMK."}, {"t": "CMK for agents is configured only on the model deployment", "c": false, "e": "For agents, CMK is configured on the data stores such as Cosmos DB, Storage and AI Search."}, {"t": "CMK replaces the need for Key Vault", "c": false, "e": "Keys are held in Azure Key Vault or Azure Managed HSM."}], "concept": "Foundry supports customer-managed keys held in Azure Key Vault or Azure Managed HSM. You create or import a key, give the Foundry resource's managed identity permission to use it (with Azure RBAC on Key Vault this is the Key Vault Crypto User role), and then enable CMK on the resource, either at creation or later.\n\nFor agents the details matter. Prompt agents support CMK only with bring-your-own (customer-managed) storage, so you also configure CMK on Cosmos DB, Storage and AI Search. Hosted agents are only partly covered, because the `$HOME` filesystem is on platform-managed storage that is not encrypted with CMK.\n\nIf a compliance rule says \"all data\", the hosted-agent gap must be documented or a different design chosen.\n\nRead the coverage list for the agent type you use before promising full CMK coverage.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/customer-managed-keys"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A security review finds a Foundry project that was created in the portal without private networking, while the approved design requires private endpoints. How do you prevent this in the future?", "o": [{"t": "Disable the network rules so that every project behaves the same", "c": false, "e": "This removes isolation instead of enforcing it."}, {"t": "Ask developers to be careful when using the portal", "c": false, "e": "A process request is not an enforced control."}, {"t": "Create resources, projects, agents and connections from infrastructure as code, treat project creation as privileged, and enforce rules with Azure Policy", "c": true, "e": "Portal-created projects do not inherit network controls, and portal actions can bypass constraints."}, {"t": "Give every developer the Owner role so they can fix settings", "c": false, "e": "Broad rights make unreviewed changes more likely."}], "concept": "Governance works best when the setup is repeatable and enforced. Infrastructure as code (IaC) describes resources, projects, agents and connections in files that are reviewed and deployed by a pipeline. Learn gives reasons: portal actions run under a service identity and can bypass constraints, portal-created projects do not inherit network controls, and untracked portal edits cannot be reproduced.\n\nSo treat project creation as a privileged action, and combine IaC with Azure Policy. Policy can require private endpoints and network security groups, customer-managed keys and allowed regions, disable local (key) authentication, and restrict deployment types by denying `sku.name` on deployments.\n\nFor a locked-down environment, run the deployment pipeline from a self-hosted runner inside the network.\n\nRule: the portal is for exploring; code and policy are for production.", "src": ["https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat", "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks"], "ref": ["platform-network-and-reliability", "cicd-for-foundry-projects"]}, {"d": 1, "q": "An Application Gateway with WAF is the only internet-facing entry point to a chat application. The WAF blocks many legitimate chat messages as false positives because the text looks like attack patterns. What is the recommended handling?", "o": [{"t": "Disable all managed rules for the whole application", "c": false, "e": "This is too broad and weakens security."}, {"t": "Scope WAF exclusions to the chat message field, instead of disabling the rules", "c": true, "e": "This avoids false positives for that field while keeping protection elsewhere."}, {"t": "Turn the WAF off completely", "c": false, "e": "This removes protection from the only internet-facing entry point."}, {"t": "Move the chat application to a service endpoint", "c": false, "e": "A network type change does not solve false positives in a WAF."}], "concept": "In the reference architecture, only an Application Gateway with a web application firewall (WAF), plus DDoS protection, faces the internet. Everything behind it uses private endpoints.\n\nA chat input field is free text, so it can legitimately contain words and symbols that look like SQL, scripts or other attack patterns. A WAF may flag them. The recommended approach is to add exclusions that are scoped to the chat message field only. The rules stay active for headers, URLs and other fields, while that one field is excluded from the matching rules.\n\nThe wrong answers weaken the whole entry point. Security is a balance: reduce false positives precisely and keep the rest of the rules.\n\nOther parts of the same design: a dedicated agent subnet with a user-defined route to Azure Firewall and FQDN rules for egress control.", "src": ["https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A security architect wants to stop a compromised agent from sending data to arbitrary internet addresses. The agent runs in an injected subnet. Which network design implements egress control?", "o": [{"t": "Removing the network security group from the subnet", "c": false, "e": "This removes a layer of control."}, {"t": "Public network access enabled on every dependency", "c": false, "e": "This opens more paths, not fewer."}, {"t": "A dedicated agent subnet with a user-defined route to Azure Firewall and FQDN allow rules", "c": true, "e": "Outbound traffic is forced through a firewall that permits only approved destinations."}, {"t": "A shared subnet used by all workloads in the company", "c": false, "e": "The agent subnet is dedicated to one Foundry resource and cannot be shared."}], "concept": "Network isolation has an inbound side and an outbound side. Inbound traffic reaches Foundry through private endpoints with public access disabled. Outbound traffic from the agent runtime uses virtual network injection into a delegated subnet (delegated to `Microsoft.App/environments`).\n\nEgress control limits where the agent may send data. The recommended design is a dedicated agent subnet with a user-defined route (UDR) that sends traffic to Azure Firewall, plus fully qualified domain name (FQDN) rules that allow only approved destinations such as Microsoft Entra endpoints. Network security groups on the subnet need matching outbound rules. Do not perform TLS inspection on agent traffic, because a substituted certificate breaks connections.\n\nThis is a defense for the case where the model is tricked: even if the agent tries to send data out, the firewall refuses.\n\nHosted agents also have network egress controls (Preview) with an allow-list of destinations.", "src": ["https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat", "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks"], "ref": ["platform-network-and-reliability", "agent-safety-and-identity"]}, {"d": 1, "q": "A GitHub Actions workflow deploys Foundry agents with the Azure Developer CLI. The current version stores a service principal secret as a repository secret and sometimes two runs deploy at the same time. Which two changes follow the recommended pattern?", "o": [{"t": "Use the project's API key in the workflow and run deployments in parallel for speed", "c": false, "e": "Keys bypass role-based access control, and parallel deployments can collide."}, {"t": "Keep the secret but rotate it yearly, and let runs overlap", "c": false, "e": "The secret remains a stored credential, and overlapping runs can conflict."}, {"t": "Store the secret in the agent instructions so it is available at deploy time", "c": false, "e": "Secrets must never be placed in prompts or instructions."}, {"t": "Use GitHub OIDC federated credentials with `azure/login` and add a concurrency group that serializes deployments", "c": true, "e": "Federation removes the stored secret, and the concurrency group prevents two simultaneous deployments."}], "concept": "The template workflow for hosted agents runs on a push to `main` and executes `azd provision` and then `azd deploy`. Two details make it safer.\n\nAuthentication uses OpenID Connect (OIDC) federation. The workflow gets a short-lived token from Microsoft Entra ID through a federated credential, so no secret is stored in GitHub. In the workflow this needs `permissions: id-token: write` and the `azure/login` action.\n\nA concurrency group gives each deployment a queue. Only one run of the group executes at a time, so two pushes in quick succession do not provision or deploy at once.\n\nIn a private Foundry, the runner must be able to reach the network, so use a self-hosted runner inside the virtual network.\n\nUse least-privilege roles for the pipeline identity, and keep infrastructure code and agent definitions in source control.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/set-up-ci-cd-cli", "https://learn.microsoft.com/en-us/azure/foundry/agents/quickstarts/set-up-cicd-hosted-agent"], "ref": ["cicd-for-foundry-projects"]}, {"d": 1, "q": "A team's pipeline runs the full evaluation suite of 2,000 test cases with an LLM judge on every commit to every pull request. Costs rise and the pipeline slows down. Which change follows the guidance?", "o": [{"t": "Run the full suite on every commit but use a smaller judge model with no testing", "c": false, "e": "The judge model must be validated; the cost problem is the frequency."}, {"t": "Remove evaluation from the pipeline entirely", "c": false, "e": "Evaluation is the gate that catches regressions."}, {"t": "Run a small fast set (about a dozen cases) on every pull request and the full set only for release candidates", "c": true, "e": "This controls cost and still gates the release."}, {"t": "Replace the dataset with five easy cases", "c": false, "e": "A dataset that is too easy hides regressions."}], "concept": "AI apps need evaluation as a gate in the pipeline, because quality can change without any code change. But evaluation costs money (model calls for the system and for the judge) and takes time.\n\nLearn advises not running the evaluation Action on every commit, to control cost. A balanced design has two levels. A small, fast set of about a dozen cases runs on every pull request to catch obvious breaks. The full dataset runs on release candidates, before promotion to production.\n\nDataset hygiene helps both: version the dataset with the code, and add every production incident as a new case. A dataset that is too small or too easy produces a gate that always passes.\n\nA gate should combine an absolute floor (for example safety defect rate at or below 1%) and a rule relative to the baseline.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluation-github-action", "https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/azure-developer-cli-evaluation"], "ref": ["cicd-for-foundry-projects"]}, {"d": 2, "q": "A team improves a prompt by editing five things at once: wording, examples, the output format, the temperature and the model. The score rises, and nobody knows why. Which approach does the prompt-improvement loop recommend?", "o": [{"t": "Write a test set first, record a baseline, change one thing at a time, and keep a change only if the metric improves", "c": true, "e": "Single changes show cause and effect, and the baseline gives a reference."}, {"t": "Tune only on the examples you can see in the prompt", "c": false, "e": "This overfits to the visible examples."}, {"t": "Skip refusals in the test set to keep the score high", "c": false, "e": "A test for refusals is part of a good set."}, {"t": "Keep all five changes because the score went up", "c": false, "e": "You cannot tell which change helped or hurt, and some may fail on other inputs."}], "concept": "Prompt engineering is experimental work, so it needs a method. The loop has six steps. First, write the test: 30 to 50 real inputs with expected outcomes, including a few that should be refused. Second, run the simple prompt and record the baseline. Third, change one thing, such as adding an \"out\", adding two examples or adding a cue. Fourth, re-run and compare, keeping the change only if the metric improves. Fifth, review failures by hand, since each failure suggests the next change. Sixth, lock the prompt in version control together with its test results.\n\nIf you change five things together, you cannot tell which one helped, and one may have hidden a regression. Tuning on the visible examples only also overfits.\n\nCommon mistakes: no test for refusals, several changes at once, and judging by a few hand-picked examples.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering"], "ref": ["prompt-engineering-parameters-and-reflection"]}, {"d": 2, "q": "A retrieval team compares chunking strategies for two content types: highly structured product specification tables and long narrative customer stories. Which guidance on overlap fits?", "o": [{"t": "Never use overlap, because it only creates duplicates", "c": false, "e": "Overlap prevents an answer from being cut in half at a boundary, at the cost of extra storage and embedding calls."}, {"t": "Use more overlap for structured data and none for narrative text", "c": false, "e": "This reverses the guidance."}, {"t": "Use less overlap for highly structured data and more overlap for conversational or narrative text", "c": true, "e": "Narrative text depends on context across boundaries, while structured data usually stands alone."}, {"t": "Use the same maximum overlap for every content type", "c": false, "e": "The guidance differs by content type."}], "concept": "Chunking cuts text into pieces to stay under model token limits, to avoid one vector blurring many topics, and to return a focused passage to the model. The documented starting point is 512 tokens with 25% overlap (128 tokens).\n\nOverlap is a trade-off. It repeats part of the previous chunk so that an idea that crosses a boundary is still intact in one chunk. This costs extra storage and embedding calls: with a 10,000-token document, 512-token chunks and 128 overlap, you get about 26 chunks instead of about 20.\n\nThe decision guide: larger chunks with overlap for questions about specific facts; less overlap for highly structured data; more overlap for conversational or narrative text; chunk by section for documents with headings; use semantic chunking with Content Understanding Markdown when you need meaning-preserving chunks across pages.\n\nAlways measure with retrieval evaluators on your own questions.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-chunk-documents"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A team asks when the semantic ranker is charged. They run many diagnostic queries with `search=*` and many production queries with `queryType=semantic` and a non-empty search string. Which queries generate semantic ranker charges?", "o": [{"t": "Only queries with `queryType=semantic` and a non-empty search string", "c": true, "e": "The semantic ranker is a billed feature charged for those queries; an empty search is not charged."}, {"t": "No queries, because the semantic ranker is free in every plan", "c": false, "e": "It is billed, with a monthly allowance on the free plan."}, {"t": "Only queries that return captions", "c": false, "e": "Charging depends on the query type and search string, not on captions."}, {"t": "All queries, including `search=*`", "c": false, "e": "An empty search is not charged."}], "concept": "The semantic ranker is a second-stage reranker. It takes the top 50 results of BM25 or Reciprocal Rank Fusion, builds a summary string of up to 2,048 tokens for each from the fields of the semantic configuration, and scores each from 0 to 4 in `@search.rerankerScore`. It can also return captions and answers, which are always text copied from your index.\n\nIt is a billed feature. Charges apply when `queryType=semantic` and the search string is not empty. An empty search such as `search=*` is not charged. The free plan has a monthly allowance.\n\nBecause it only reorders what retrieval already found, it cannot rescue a document that is not in the first 50. Field order in the semantic configuration matters, since long text is trimmed. It works best on prose.\n\nDo not set very fine thresholds on the reranker score: the distribution can shift with model updates.", "src": ["https://learn.microsoft.com/en-us/azure/search/semantic-search-overview"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A vector field is indexed with HNSW. For one compliance audit the team wants exact nearest neighbors for a single query, without rebuilding the index. What can they do?", "o": [{"t": "Lower `efConstruction` to 100", "c": false, "e": "That lowers the build-time quality of the graph, which is the opposite of the goal."}, {"t": "Set `exhaustive` to true on that vector query", "c": true, "e": "A field indexed for HNSW can still be queried exhaustively."}, {"t": "Change the similarity metric to Euclidean", "c": false, "e": "The metric changes how distance is measured, not whether the search is exact."}, {"t": "Rebuild the field as HNSW with a lower `m`", "c": false, "e": "This is an indexing parameter that does not make search exact."}], "concept": "Vector search finds the nearest neighbors of a query vector. HNSW builds a layered graph at indexing time and walks it at query time, so it is fast but approximate. Exhaustive KNN scans every vector, so it is exact but slower.\n\nHNSW has tuning parameters. `m` is how many neighbors each node links to. `efConstruction` is how many candidates are considered while building the graph (default 400, range 100 to 1,000). `efSearch` is the size of the candidate queue at query time. Higher values improve recall at a cost in time.\n\nA field indexed for HNSW can still be queried exhaustively with `\"exhaustive\": true` on the vector query. The opposite is not possible: a field indexed as `exhaustiveKnn` cannot use HNSW.\n\nThis gives you a fast default and an exact option for audits or for building a ground-truth set to measure HNSW recall.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-ranking", "https://learn.microsoft.com/en-us/azure/search/vector-search-overview"], "ref": ["rag-retrieval-and-grounding", "azure-ai-search-configuration"]}, {"d": 2, "q": "A developer filters pure vector results with `@search.score >= 0.2` using the cosine metric, expecting to remove poor matches. Almost nothing is removed. What explains this?", "o": [{"t": "For cosine the vector score is 1 / (1 + cosine_distance), which ranges from 0.333 to 1.0, so a threshold of 0.2 never filters anything", "c": true, "e": "The score always decreases as similarity gets worse but never goes below 0.333."}, {"t": "Cosine scores range from -1 to 1 and 0.2 is always high", "c": false, "e": "That is the raw cosine similarity, not the reported search score."}, {"t": "The index must be rebuilt as exhaustive KNN", "c": false, "e": "The algorithm does not change the score formula."}, {"t": "The semantic ranker already removed all poor matches", "c": false, "e": "The ranker is not mentioned and cannot change this range."}], "concept": "Search scores are for ordering, and each retrieval method has its own scale. For a vector query with the cosine metric, Azure AI Search reports `@search.score = 1 / (1 + cosine_distance)`. The cosine distance ranges from 0 to 2, so the score ranges from 0.333 to 1.0 and always decreases as similarity gets worse.\n\nA threshold must be chosen inside this range. A value of 0.2 is below the minimum possible score, so nothing is cut.\n\nScores from different methods cannot be added: BM25, vector and reranker scores are on different scales. Hybrid search merges ranked lists with Reciprocal Rank Fusion using ranks only, and hybrid scores are small numbers that are meaningful only for ordering.\n\nUse cosine for Azure OpenAI embeddings. Calibrate thresholds on real queries, and avoid very fine thresholds on the semantic reranker score.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-ranking", "https://learn.microsoft.com/en-us/azure/search/hybrid-search-ranking"], "ref": ["rag-retrieval-and-grounding"]}, {"d": 2, "q": "A team builds integrated vectorization and uses a custom skill, behind a web API, to create embeddings during indexing. Which vectorizer must the vector profile use to embed query text at search time?", "o": [{"t": "An Azure OpenAI vectorizer with a different embedding model", "c": false, "e": "A different model makes query and index vectors incompatible."}, {"t": "A custom Web API vectorizer that calls the same embedding model as the skill", "c": true, "e": "The vectorizer type should match the embedding skill, and both must use the same model."}, {"t": "No vectorizer, because query vectors are created by the semantic ranker", "c": false, "e": "The ranker does not create vectors."}, {"t": "An Azure Vision vectorizer", "c": false, "e": "That one pairs with the Azure Vision multimodal embedding skill."}], "concept": "Integrated vectorization adds vector encoding at indexing time and at query time with no separate pipeline. At indexing, a skillset chunks the text and an embedding skill creates the vectors. At query time, a vectorizer defined in the index and assigned to the vector field through a vector profile turns the query text into a vector.\n\nThe two must use the same embedding model. The pairs are: Azure OpenAI Embedding skill with the Azure OpenAI vectorizer; a custom skill with a Custom Web API vectorizer; the Azure Vision multimodal skill (preview) with the Azure Vision vectorizer; and an Azure Machine Learning skill from the catalog with the Foundry model catalog vectorizer (preview).\n\nIf the two sides differ, queries and documents live in different vector spaces, and retrieval quality collapses.\n\nA complete vector field needs the `vectorSearch` profile, the field's `vectorSearchProfile` and the right `dimensions`.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-integrated-vectorization", "https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-create-index"], "ref": ["azure-ai-search-configuration"]}, {"d": 2, "q": "An agent has a function tool `get_order_status(order_id)`. Security reviews the code that runs when the model returns a `function_call`. Which TWO practices follow the guidance?", "o": [{"t": "Return the full database row, including internal secrets, so the model has more context", "c": false, "e": "Tool output must not contain secrets; return only what the model needs."}, {"t": "Run the function with a least-privilege identity and require explicit confirmation for actions that change data", "c": true, "e": "This limits damage if the arguments or the model's decision are wrong."}, {"t": "Pass the raw argument string directly into a database query for speed", "c": false, "e": "This invites injection and invalid values."}, {"t": "Skip returning `function_call_output` and let the agent guess the result", "c": false, "e": "The app must return the output with the same `call_id`."}, {"t": "Parse and validate the arguments before use, because the model's arguments are untrusted input", "c": true, "e": "A model can produce unexpected values, and an attacker can influence them through content."}], "concept": "A function tool is only a request: the model returns a `function_call` item with a name, JSON `arguments` and a `call_id`. Your application executes the function and returns a `function_call_output` with the same `call_id`. Because your code does the work, your code also owns the safety.\n\nLearn's guidance: treat arguments and outputs as untrusted input and validate them before use; do not put secrets in tool output; use least privilege for the identity that your code uses; avoid side effects unless intended; and require explicit confirmation for actions that change data. In the Agent Framework, approval modes such as `always_require` support human-in-the-loop for production.\n\nWhy untrusted: the model decides the arguments, and an attacker can influence the model through documents or messages.\n\nRuns also expire 10 minutes after creation, so slow work should return a status and be polled.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling"], "ref": ["building-agents-with-foundry", "agent-safety-and-identity"]}, {"d": 2, "q": "A process needs several agents in a declared order, with a human approval step before the final answer. The team prefers declarative orchestration rather than writing the control logic. Which Foundry feature fits?", "o": [{"t": "A single prompt agent with a longer instruction", "c": false, "e": "One agent cannot declare a multi-agent order with approval steps."}, {"t": "The classic Connected Agents tool", "c": false, "e": "It is not available in the new Foundry Agent Service."}, {"t": "An embedding model deployment", "c": false, "e": "Embeddings represent text as vectors and do not orchestrate agents."}, {"t": "A workflow, which orchestrates several agents in patterns such as sequential, group chat and human-in-the-loop", "c": true, "e": "Workflows are declarative orchestration in the new Foundry Agent Service."}], "concept": "Multi-agent solutions need a way to pass work between agents and keep control. In the new Foundry Agent Service the replacements for the classic Connected Agents tool are the A2A tool and workflows.\n\nThe A2A tool lets a Foundry agent call any A2A-compatible endpoint, including another Foundry agent exposed as one. Workflows are declarative orchestration of several agents: sequential, group chat and human-in-the-loop. A workflow is the better match when the order and the approval step are part of the design.\n\nIn hosted agents written with the Microsoft Agent Framework you can also expose one agent as a function tool of another, in process, and long-running workflows can resume from checkpoints.\n\nPractice material may still call the pattern \"connected agents\". Choose the option that matches the product the question names.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/workflow", "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/agent-to-agent"], "ref": ["building-agents-with-foundry"]}, {"d": 2, "q": "A developer edits an agent in the portal playground and tests it for an hour, but never saves it. The team then tries to view the conversation history, monitor the agent and run a full evaluation, and cannot. What is the reason?", "o": [{"t": "Unsaved changes are temporary; saving creates an immutable version (`name:version`), which is needed for history, monitoring and full evaluation", "c": true, "e": "Without a saved version the platform has nothing stable to attach history and evaluations to."}, {"t": "The playground disables all features for one hour", "c": false, "e": "There is no such behavior."}, {"t": "Evaluations only work on hosted agents", "c": false, "e": "Evaluations work for prompt agents as well."}, {"t": "The agent name must first be changed to include a version number", "c": false, "e": "A saved agent's name cannot change; the version is created by saving."}], "concept": "The agent lifecycle in Foundry has nine steps: choose the type, create and test, add tools and data, save versions, debug with tracing, evaluate, optimize (Preview, hosted agents), publish, and monitor and iterate.\n\nSaving is the step that makes the rest possible. Every save creates a new, immutable version identified as `<agent_name>:<version>`. You can compare setup, chat output and YAML between versions and send requests to a specific version, which makes rollout and rollback controlled. Without saving you cannot see conversation history, monitor performance or run full evaluations. A saved agent's name cannot change.\n\nA tool that needs authentication must also be configured successfully before you can save, so a half-configured tool does not fail later in production.\n\nThe order matters: trace before evaluate, evaluate before publish, and monitor after publish.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/development-lifecycle"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 2, "q": "In a trace review, a booking agent calls the right tool, but the `check_in` argument is written as \"next Friday\" instead of an ISO date, which the API rejects. Which evaluator targets exactly this problem?", "o": [{"t": "Tool Input Accuracy", "c": true, "e": "It checks that every parameter is correct: grounded, right type and format, required fields present, no extras and a sensible value."}, {"t": "Task Navigation Efficiency", "c": false, "e": "It compares the sequence of tool steps with an expected sequence and needs ground truth."}, {"t": "Tool Selection", "c": false, "e": "It checks whether the right tools were chosen, which was already correct here."}, {"t": "Customer Satisfaction", "c": false, "e": "It rates the overall user experience, not argument formats."}], "concept": "Process evaluators look at each step of an agent run. Tool Selection asks whether the agent chose the needed tools without unnecessary ones. Tool Call Accuracy asks whether the right tools were used with the right parameters and no redundancy. Tool Input Accuracy zooms in on parameters: grounded in the conversation, correct type and format, required fields present, no extras and sensible values. Tool Output Utilization asks whether the agent used the result correctly. Tool Call Success asks whether the call technically succeeded.\n\nIn the scenario the tool choice was right, but one argument had the wrong format, which is exactly what Tool Input Accuracy examines.\n\nThe fix in the agent is usually a clearer schema and description with an example of the format, plus `strict` validation.\n\nPick the narrowest evaluator to locate the cause; composite evaluators tell you that something failed, components tell you what.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/agent-evaluators"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 2, "q": "A team evaluates an agent whose main tool is Azure AI Search and wants to use `tool_call_accuracy` and `groundedness` in its evaluation. What does Learn advise?", "o": [{"t": "Use them freely, because all evaluators support all tools", "c": false, "e": "Learn lists limited support for several tool types."}, {"t": "Disable evaluation until the tool is deprecated", "c": false, "e": "Evaluation should continue with suitable evaluators."}, {"t": "Avoid these evaluators for that tool because support is limited, and use evaluators that fully support the tool types such as File Search, function tools and MCP", "c": true, "e": "Agent evaluators fully support File Search, function tools, MCP and knowledge-based MCP."}, {"t": "Replace the Azure AI Search tool with Code Interpreter", "c": false, "e": "Code Interpreter is also on the limited-support list."}], "concept": "Evaluators are not equally supported for every tool. Agent evaluators fully support File Search, function tools, MCP and knowledge-based MCP. For Azure AI Search, Bing grounding, SharePoint, Code Interpreter, Fabric Data Agent and Web Search, Learn advises avoiding `tool_call_accuracy`, Tool Input Accuracy, Tool Output Utilization, Tool Call Success and `groundedness`, because support is limited.\n\nThis does not mean you cannot evaluate those agents. You can use system-level evaluators such as Task Completion, Task Adherence and Intent Resolution, safety evaluators, and custom evaluators for domain rules, and review traces for the process.\n\nWhy this is exam-relevant: a low or odd score may come from limited support rather than from a bad agent. Check the support table before trusting a metric.\n\nAlso remember that most evaluators are AI-assisted and use a judge model deployment.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/agent-evaluators"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 2, "q": "A finance team notices an unexpected monthly charge related to evaluations. Developers have been chatting with agents in the agent playground. What is the likely cause and fix?", "o": [{"t": "Guardrails charge per blocked request", "c": false, "e": "This is not the documented cause."}, {"t": "Agent versions are billed monthly", "c": false, "e": "Versions are not billed that way."}, {"t": "Evaluations in the agent playground are on by default and billed by consumption; unselect the evaluators to turn them off", "c": true, "e": "This is documented behavior for playground evaluations."}, {"t": "Tracing causes a per-span fee, so tracing must be removed", "c": false, "e": "Telemetry costs depend on Application Insights volume, and evaluations are the cause here."}], "concept": "Evaluation uses model calls, so it costs money. Many evaluators are AI-assisted, which means a judge model is called for every scored item. In the agent playground, evaluations are on by default and billed by consumption, so casual testing can create a steady cost without anyone noticing.\n\nTo stop it, unselect the evaluators in the playground. For planned evaluations, control cost with a small fast set for pull requests and the full set for release candidates, and avoid evaluating on every commit.\n\nCost control is part of the \"Manage\" domain: set budgets, watch token and evaluation consumption, restrict playground use in production, and use pre-production environments for experiments.\n\nAlso remember that telemetry costs depend on Application Insights volume and retention, which follow your Application Insights configuration.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/observability", "https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat"], "ref": ["observability-and-agent-lifecycle", "capacity-cost-and-throttling"]}, {"d": 2, "q": "A medical-education app blocks legitimate anatomy descriptions because the Violence control is too strict, but the team must keep strict settings for hate content. How should the guardrail thresholds be set?", "o": [{"t": "Turn all categories Off", "c": false, "e": "Off is only for customers approved for modified guardrails."}, {"t": "Remove the guardrail and rely on the model's training", "c": false, "e": "This removes the runtime protection."}, {"t": "Raise every category to High at once", "c": false, "e": "This weakens protection for categories that should stay strict."}, {"t": "Adjust the threshold by category: relax Violence (for example to Medium or High) and keep Hate at a strict level, then re-test", "c": true, "e": "Thresholds are set per category, and each change is tested on real and adversarial prompts."}], "concept": "A guardrail control combines a risk, an intervention point and an action. For the four harm categories (hate, sexual, self-harm and violence) you choose a severity threshold. Low flags Low severity and above, which is the strictest. Medium flags from medium up. High flags only the most severe content, which is the most permissive. Off is only for customers approved for modified guardrails.\n\nChoosing a threshold is an experiment: start from the audience, run real and adversarial prompts at the default, count false blocks and misses, adjust by category rather than globally, and re-test after every change. A medical app may need more tolerance for violence-related words than for hate.\n\nAnnotate-only mode is useful to tune: `detected: true` with `filtered: false` means \"seen but allowed\", so you can review false positives before turning blocking on.\n\nContent at the safe level is annotated but never filtered.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview", "https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/harm-categories"], "ref": ["responsible-ai-governance", "agent-safety-and-identity"]}, {"d": 2, "q": "A latency budget allows about 250 ms of extra overhead for safety checks. The team plans guardrail controls at the user input point and the output point of a model deployment. Using the documented per-point overhead, what is a reasonable expectation?", "o": [{"t": "No overhead, because the content filter is part of the network", "c": false, "e": "Each intervention point adds latency."}, {"t": "About 5 ms in total, because guardrails run in parallel for free", "c": false, "e": "The documented overhead is much higher."}, {"t": "About 100 to 200 ms in total, since each intervention point adds roughly 50 to 100 ms", "c": true, "e": "Two points at 50 to 100 ms each fit within the 250 ms budget."}, {"t": "About 2 seconds in total, because each point calls a large model", "c": false, "e": "This is far above the documented range."}], "concept": "Guardrails can be attached at four intervention points: user input, tool call, tool response and output. Each point adds latency, roughly 50 to 100 ms per point, depending on content length and the number of controls.\n\nFor a model deployment with controls at input and output, the overhead is about 2 x 50 = 100 ms at best and 2 x 100 = 200 ms at worst, so 100 to 200 ms. That fits inside a 250 ms budget. For an agent that also scans every tool call and tool response, the number of scanned points grows with the number of tool calls, and the overhead grows too.\n\nThis is a design trade-off: more intervention points give more protection but add latency, so apply the points that match the real attack paths.\n\nTool call and tool response controls are Preview, apply to agents, and only for tools that support moderation.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/intervention-points", "https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "A team evaluates Spotlighting (Preview) to reduce the effect of hidden instructions in third-party documents. Which TWO statements are correct?", "o": [{"t": "It is off by default, available through Chat Completions, and not available for agents", "c": true, "e": "These are the documented limits."}, {"t": "It adds no tokens, because base64 text is shorter than the original", "c": false, "e": "Base64 increases length, so more tokens are used and the input limit may be exceeded."}, {"t": "It is enabled automatically for every agent in Foundry Agent Service", "c": false, "e": "It is not available for agents."}, {"t": "It marks third-party documents as lower trust by base64-encoding them, which increases the token count", "c": true, "e": "Encoding makes the model less likely to treat the text as instructions, at the cost of more tokens."}, {"t": "It removes the need for any other protection against injection", "c": false, "e": "It is one layer, and other controls remain needed."}], "concept": "Indirect (document) attacks hide instructions in content the model reads. Prompt Shields detect such attacks. Spotlighting (Preview) is a different, complementary technique: it transforms third-party documents so the model recognizes them as data of lower trust. The transformation is base64 encoding.\n\nCosts and limits: there is no direct fee, but base64 increases the token count, so cost rises and the input may exceed the limit. It is available only through Chat Completions, it is off by default, and it is not available for agents. The model may also mention that content is \"base64 encoded\" in its answer.\n\nIt is not a replacement for the other layers: structure the prompt, scan with Prompt Shields, limit tool permissions and keep humans in the loop for sensitive actions.\n\nStandalone Prompt Shields API: it takes a `userPrompt` and up to five `documents` and returns `attackDetected` for each.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/content-filter-prompt-shields"], "ref": ["agent-safety-and-identity"]}, {"d": 2, "q": "An application wants to check a user's chat message and four retrieved documents for attacks in one call to the standalone Azure AI Content Safety Prompt Shields API before building the prompt. How should the request be shaped?", "o": [{"t": "Send everything concatenated in a single `userPrompt` and read one flag", "c": false, "e": "This loses the per-document result and mixes user and third-party content."}, {"t": "Send the user's text as `userPrompt` and the four retrieved items in `documents` (up to five), and read `attackDetected` for each", "c": true, "e": "The API takes one user prompt and up to five documents and reports each result separately."}, {"t": "Send the documents only, because the user prompt cannot be checked", "c": false, "e": "The user prompt is checked as a separate field."}, {"t": "Send five separate API calls with no `documents` field", "c": false, "e": "The API is designed to accept the documents in one call."}], "concept": "Prompt Shields protects against two attack families. A user prompt attack comes from the user: change system rules, embed a fake conversation, role-play as a persona without limits, or hide the request with encoding tricks. A document attack comes from a third party through content the model reads, and its goals include manipulated content, access to system infrastructure, information gathering, availability attacks, fraud and malware.\n\nThe standalone API in Azure AI Content Safety checks both in one call. You pass the user's text as `userPrompt` and up to five `documents`, and the response includes an `attackDetected` result for each. Keeping them separate is useful: you can tell whether the user or a document is the source.\n\nIn Foundry guardrails the same protections are applied at intervention points. User prompt attacks are scanned at user input; document attacks at user input and at the tool response.\n\nFor troubleshooting, check the guardrail is assigned, the point matches where the attack enters, and read `detected` versus `filtered`.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/content-filter-prompt-shields", "https://learn.microsoft.com/en-us/azure/ai-services/content-safety/overview"], "ref": ["agent-safety-and-identity"]}, {"d": 3, "q": "A developer calls the image edit endpoint with a JSON body containing the image as a base64 string and a text prompt. The request is rejected as malformed. What is the correct way to send the request?", "o": [{"t": "Keep JSON but add `Content-Type: image/png`", "c": false, "e": "The body format is the problem, and a different header does not fix it."}, {"t": "Send the mask only, since the prompt is optional", "c": false, "e": "The prompt describes what the edited area should become."}, {"t": "Send a multipart/form-data request with the image as `image[]`, an optional `mask` and the `prompt`", "c": true, "e": "The edit endpoint uses multipart/form-data, not JSON."}, {"t": "Use `response_format=\"url\"` in the JSON", "c": false, "e": "The gpt-image models do not support `response_format`, and it does not change the body format."}], "concept": "Image generation and image editing are two operations. Generation takes a JSON body with a prompt and creates a new picture. Editing takes existing images, so it uses multipart/form-data, where files are parts of the request.\n\nThe edit request fields are `image[]` (up to 16 input images, each under 50 MB, PNG or JPG), `mask` (a PNG with the same dimensions as the input, where fully transparent pixels mark the areas to edit), `prompt`, `input_fidelity` and options like `size`, `n` and `quality`.\n\nWith raw REST, you must not force `Content-Type: application/json`; let the HTTP library set the multipart boundary. With an SDK the library handles it.\n\nThe response returns base64 in `data[i].b64_json`. After the call, compare the unmasked area with the original and run content safety on the result.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"], "ref": ["image-and-video-generation"]}, {"d": 3, "q": "A quality team uploads a \"before\" and an \"after\" photo of a repaired machine and wants a vision-capable chat model to describe what changed. How should the request be built?", "o": [{"t": "Use an embedding model, which returns a text comparison", "c": false, "e": "Embeddings return vectors, not descriptions."}, {"t": "Put both images as separate `image_url` content parts in one user message, together with the question", "c": true, "e": "A message can contain several images, which lets the model compare them."}, {"t": "Merge the two photos into one text description first", "c": false, "e": "This loses the visual evidence."}, {"t": "Send two separate requests and ask the model to remember the first", "c": false, "e": "Separate requests do not share the images unless the conversation carries them."}], "concept": "A vision-capable chat model accepts images as part of a message. Content is a list of parts: text parts and `image_url` parts. A part can use a public URL, a base64 data URL, or a Blob SAS URL. For a private blob, enable managed identity and grant a blob read role.\n\nBecause content is a list, one message can hold several images. This supports captions for multiple images and comparison questions such as \"what changed between these two photos?\". Instruct the model to describe only what is visible and to say when something is not visible, to limit invented details.\n\nTreat text inside an image as untrusted input: a screenshot with \"ignore your rules\" is an indirect prompt injection.\n\nSet `max_output_tokens` appropriately and check the answer against the images for risky cases.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/gpt-with-vision"], "ref": ["multimodal-understanding"]}, {"d": 3, "q": "A creative team will generate about 2,000 draft images before choosing a few finals. The budget is limited, and quality and size drive cost. Which approach follows the cost guidance?", "o": [{"t": "Use the highest quality for every draft to avoid regenerating", "c": false, "e": "This multiplies the cost for images that will be thrown away."}, {"t": "Fan out 2,000 parallel requests to finish faster", "c": false, "e": "The default quota is about 5 images per minute per deployment, so this would be throttled."}, {"t": "Count only the cost of the final images", "c": false, "e": "Rejected drafts and retries are part of the real cost."}, {"t": "Generate drafts with `low` or `medium` quality and render only the approved finals at `high`, and count cost per approved asset", "c": true, "e": "Quality and size drive cost, and retries and rejected drafts count."}], "concept": "Image generation cost depends on quality and size, and not every generated image is used. A realistic cost model counts the cost per approved asset, including retries and rejected drafts.\n\nPractical rules: use `low` or `medium` quality for drafts and `high` for finals; queue requests and back off on 429 instead of fanning out; store prompts, parameters and model versions; keep provenance on finals; alert on quota errors and filter blocks.\n\nQuota matters for planning. The default is about 5 images per minute per deployment for the gpt-image models, so 2,000 drafts would take about 400 minutes on one deployment. Options are to spread across deployments, request more quota, or run off-hours queues.\n\nQuality values depend on the model: GPT-Image-2 supports low, medium and high, while the Sunburst and Flare models also add xhigh and max.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"], "ref": ["image-and-video-generation"]}, {"d": 3, "q": "A developer requests images with `output_format=\"webp\"` to reduce size. The request is rejected. Which formats and settings are supported for gpt-image output?", "o": [{"t": "`PNG` (default) or `JPEG`, with `output_compression` from 0 to 100 for JPEG", "c": true, "e": "WEBP is not supported; compression applies to JPEG only."}, {"t": "`WEBP` with `output_compression` from 0 to 100", "c": false, "e": "WEBP is not supported."}, {"t": "Only `PNG`, with no compression setting at all", "c": false, "e": "JPEG is supported and has a compression setting."}, {"t": "`GIF` for animated drafts", "c": false, "e": "GIF is not a supported output format."}], "concept": "The image generation request has several output controls. `output_format` is `PNG` (default) or `JPEG`; WEBP is not supported. `output_compression` is an integer from 0 to 100 (default 100) and applies to JPEG only. `background` can be `auto` or `transparent`, and transparency needs PNG. `n` is the number of images, from 1 to 10. `size` for the gpt-image-1 family is 1024x1024, 1024x1536 or 1536x1024, while GPT-Image-2 and the Sunburst and Flare models accept custom sizes within documented rules.\n\nThe response always returns base64 in `data[i].b64_json`; the gpt-image models do not support `response_format`.\n\nIf a team needs WEBP, generate PNG or JPEG and convert the file afterward in their own pipeline.\n\nWhen a request fails with `InvalidPayload`, check the `prompt`, `size` and `n` fields first.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"], "ref": ["image-and-video-generation"]}, {"d": 3, "q": "A media company processes 50,000 long videos with a Content Understanding video analyzer and wants lower cost. Their analysis needs only one description per whole video, not scene-level records. Which setting reduces cost?", "o": [{"t": "Set `enableSegment` to `true` with ten content categories", "c": false, "e": "Video supports only one content category, and segmentation adds cost."}, {"t": "Switch to a document analyzer for the videos", "c": false, "e": "Document analyzers do not process video."}, {"t": "Disable the transcript so that audio is skipped, and also segment the video", "c": false, "e": "This does not remove the cost of segmentation."}, {"t": "Set `enableSegment` to `false` so the whole video is treated as one unit, since segmentation uses tokens", "c": true, "e": "Segmentation adds cost, and the requirement does not need it."}], "concept": "Content Understanding processes video in two stages. Stage 1 is content extraction: transcript with speaker labels, key frames and shot detection. Stage 2 is field extraction and segmentation. With `enableSegment: true` and a natural-language category, the analyzer splits the video into logical segments. With `enableSegment: false`, the whole video is one unit.\n\nSegmentation uses tokens, so it costs money. Use it when users need to jump to a moment, as in a searchable library with `prebuilt-videoSearch`, which produces per-segment records. Skip it when a single description per video is enough.\n\nFor video only one content category is supported. Video also has limits: about one frame per second is sampled and resized to 512x512, and only speech is transcribed.\n\nVersion the analyzer, and batch the backfill if the schema changes, because reprocessing a whole library is expensive.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/overview", "https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"], "ref": ["multimodal-understanding"]}, {"d": 3, "q": "A company wants to attribute image generation requests to individual end users for abuse investigations, without sending personal data. Which request field can carry a per-user identifier?", "o": [{"t": "`user`, which accepts any string for tracking", "c": true, "e": "It is the documented field for tracking, and an opaque identifier avoids personal data."}, {"t": "`background`, which controls transparency", "c": false, "e": "It is a rendering option."}, {"t": "`output_compression`, which sets JPEG quality", "c": false, "e": "It controls file size."}, {"t": "`n`, which sets the number of images", "c": false, "e": "It is a count, not an identifier."}], "concept": "Azure applies input and output moderation and abuse monitoring to image generation models. To help with investigation and operations, the request has a `user` field that accepts any string for tracking.\n\nUse an opaque identifier, such as a hashed internal user ID, so that your logs and the service can group requests by end user without exposing names or emails. Combine it with your own logging: store the prompt, the parameters, the model version and the result of safety checks with the asset.\n\nOther request fields have different jobs: `prompt` is the description, `n` is the number of images (1 to 10), `size` sets dimensions, `quality` sets the level of detail, `output_format` selects PNG or JPEG and `background` can be transparent.\n\nAlso keep alerts on quota errors and on `contentFilter` blocks.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"], "ref": ["image-and-video-generation"]}, {"d": 3, "q": "A design tool streams progressive previews while a gpt-image deployment renders a large image. Which TWO statements about streaming are correct?", "o": [{"t": "Events of type `image_generation.partial_image` carry `partial_image_index` and `b64_json`", "c": true, "e": "The UI can display each preview as it arrives."}, {"t": "Set `partial_images` to 8 to receive eight previews", "c": false, "e": "The allowed range is 0 to 3."}, {"t": "Streaming removes the need for content safety checks on the final image", "c": false, "e": "The final output still needs filtering."}, {"t": "Partial results are returned as hosted URLs only", "c": false, "e": "Results are base64 in `b64_json`."}, {"t": "Set `stream` to true and `partial_images` to a value from 0 to 3", "c": true, "e": "These are the documented controls for partial results."}], "concept": "Image generation can take a while. With streaming, the service sends partial results so the user sees progress instead of a blank wait. You turn it on with `stream: true` and choose how many previews with `partial_images`, an integer from 0 to 3.\n\nEach preview arrives as an event of type `image_generation.partial_image`. The event carries `partial_image_index` (the order of the preview) and `b64_json` (the base64 image data). A user interface can decode each one and show a progressively sharper picture.\n\nStreaming only changes how results are delivered. Moderation still applies, and your own checks on the final output (content safety, brand rules, human approval for public assets) are still needed.\n\nThe image edit endpoint supports `stream` and `partial_images` too.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"], "ref": ["image-and-video-generation"]}, {"d": 4, "q": "A call-center team wants a summary of each support call that states the customer's issue and how it was resolved, in separate fields. Which Azure Language capability is designed for this shape of output?", "o": [{"t": "Extractive summarization of a document", "c": false, "e": "It selects important original sentences and does not label issue and resolution."}, {"t": "Custom named entity recognition", "c": false, "e": "It extracts domain entities and does not summarize."}, {"t": "Language detection", "c": false, "e": "It identifies the language of text."}, {"t": "Conversation summarization with aspects such as issue and resolution", "c": true, "e": "It produces aspect-based summaries of conversations."}], "concept": "Summarization in Azure Language has several forms. Extractive summarization selects the most important original sentences, with a rank score and positions. Abstractive summarization writes new sentences. Conversation summaries produce aspects such as issue, resolution, chapter title, narrative and recap. Document summarization is in preview and accepts txt, pdf and docx, with results retrievable for 24 hours.\n\nFor a call center, the issue-and-resolution shape is the conversation aspect output. It is already organized into fields.\n\nRetirement note: summarization retires from Azure Language on March 31, 2029, and new projects are directed to Foundry models. With an LLM you would define a Structured Outputs schema with `issue` and `resolution` fields, a low temperature and an `unknown` option for unclear calls.\n\nRun PII detection first so that the summary does not carry personal data.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A company builds a support FAQ bot from product manuals. Users ask follow-up questions such as \"and for the premium plan?\", and the team wants answers filtered by product line. Which custom question answering capabilities address these needs?", "o": [{"t": "Speech translation", "c": false, "e": "It translates spoken language and does not answer from manuals."}, {"t": "Multi-turn follow-up prompts and metadata filtering", "c": true, "e": "Both are listed capabilities of custom question answering."}, {"t": "Sentiment analysis and opinion mining", "c": false, "e": "These label feelings in text and do not answer questions from a knowledge base."}, {"t": "Language detection and PII redaction", "c": false, "e": "They do not build an FAQ knowledge base."}], "concept": "Custom question answering (CQA) builds a knowledge base from FAQs, manuals and documents. Key capabilities are automatic question-and-answer extraction, multi-turn follow-up prompts, metadata filtering, active learning, and deep-learning re-ranking over Azure AI Search. The flow is: create a project, test, deploy a REST endpoint, and integrate. Responses carry answers, confidence scores and follow-up prompts.\n\nThe two needs in the scenario map directly. A follow-up like \"and for the premium plan?\" depends on context, which multi-turn prompts handle. Filtering by product line uses metadata attached to the question-answer pairs.\n\nFor a bot that needs both an FAQ (CQA) and a calendar skill (CLU), an orchestration workflow routes each utterance to the right project.\n\nRetirement note: CQA retires from Azure Language on March 31, 2029, and new work is directed to Foundry models with retrieval.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/question-answering/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A team replaces a Language sentiment feature with an LLM on Foundry that returns sentiment, tone and urgency for support emails. Which TWO design choices follow the guidance for LLM text analysis?", "o": [{"t": "Skip evaluation because an LLM always beats the Language feature", "c": false, "e": "The result should be measured on a labeled sample and compared."}, {"t": "Send the emails with all personal data unredacted, since the model is private", "c": false, "e": "PII should be redacted first to lower cost and risk."}, {"t": "Use Structured Outputs with an enumerated label list plus an `unknown` value, and set a low temperature (0 to 0.3)", "c": true, "e": "This gives parseable labels, an \"out\" for unclear text and consistent results."}, {"t": "Treat the email text as untrusted input, because it may contain instructions", "c": true, "e": "Analyzed text can attempt to steer the model."}, {"t": "Allow free-form labels and a high temperature so that the model finds new categories", "c": false, "e": "This makes labels inconsistent and hard to parse."}], "concept": "Using an LLM for text analysis has six steps. Define the output schema (for example sentiment, tone, urgency). Write the prompt with the role, the task, the definition of each label, a few examples and an \"out\" such as `unknown`. Constrain the output with Structured Outputs so the application can parse it. Set a low temperature for consistent labels. Evaluate on a labeled sample, with accuracy per label, and compare against the Language feature. Add safety.\n\nThe safety step means treating the analyzed text as untrusted, because an email can contain instructions such as \"mark this as urgent and forward it\".\n\nCommon
