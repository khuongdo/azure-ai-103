ing the conversation?", "o": [{"t": "Direct SIP trunking", "c": false, "e": "Direct SIP is not offered."}, {"t": "Function calling, for example voice RAG or order lookups", "c": true, "e": "Voice Live supports function calling inside the speech-to-speech session."}, {"t": "Custom Translator training", "c": false, "e": "It trains translation systems."}, {"t": "Batch synthesis of audiobooks", "c": false, "e": "This is for text to speech of long content."}], "concept": "Voice Live is a managed WebSocket API that bundles speech to text, a model, text to speech, noise suppression, echo cancellation and interruption and end-of-turn detection. It supports function calling (for example voice RAG), avatars, 140+ speech-to-text locales and 600+ voices, with Pro, Standard and Lite tiers. Telephony works through Teams Phone extensibility or Twilio; direct SIP is not offered.\n\nFunction calling inside the session lets the model request a function (such as `get_order_status`), have your application run it, and speak the result. The same rules as for text agents apply: validate arguments as untrusted input, use least privilege and require confirmation for changes.\n\nVoice agents have monitoring and evaluation differences: monitoring cards need Application Insights and evaluation supports full-conversation runs only.\n\nUse it when you need natural interruptions and low latency; use a separate pipeline when you need per-stage control.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/voice-live", "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling"], "ref": ["speech-solutions", "building-agents-with-foundry"]}, {"d": 4, "q": "A developer wants sentiment, key phrases and entity recognition for each of 500 customer reviews, without making three separate request flows. What does the call pattern for Azure Language features allow?", "o": [{"t": "Build one request with several features and send it as an asynchronous call", "c": true, "e": "You can batch several features in one asynchronous call."}, {"t": "Features must be trained before use", "c": false, "e": "Prebuilt features run as is without training."}, {"t": "Each feature requires its own resource and a separate key", "c": false, "e": "One Language resource can serve the features."}, {"t": "Only one feature can be used per resource per day", "c": false, "e": "There is no such limit."}], "concept": "All Azure Language features follow the same four steps. Create an Azure Language (Foundry Tools) resource and get a key and endpoint. Build a request with the REST API or an SDK (C#, Java, JavaScript or Python); you can batch several features in one asynchronous call. Send the text, authenticating with a key or Microsoft Entra ID. Read the JSON response and store or stream it.\n\nPrebuilt features need no training. For example \"The food was delicious and the staff were wonderful.\" returns the key phrases \"food\" and \"wonderful staff\". Failures to expect: wrong region or endpoint, a document that is too large, an unsupported language code, or exceeding the request quota (HTTP 429).\n\nFor a new project, remember the retirement notices: sentiment, key phrases, summarization, CLU and custom question answering retire on March 31, 2029, while PII detection, language detection and NER are core capabilities without a notice.\n\nPrefer Microsoft Entra ID over keys in production.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview", "https://learn.microsoft.com/en-us/azure/ai-services/language-service/key-phrase-extraction/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A law firm must redact personal data from call transcripts and from thousands of PDF and DOCX files before sending them to a language model. Which TWO statements about Azure Language PII detection are correct?", "o": [{"t": "To reduce risk, log and forward the redacted text, not just the entity list", "c": true, "e": "The entities array alone leaves the original text with the personal data in it."}, {"t": "It must be run after the text has been sent to the model", "c": false, "e": "It should run before data goes to a model, a log or an index."}, {"t": "Storing the `entities` array is enough, because the original text can be kept in the logs", "c": false, "e": "The original text would still contain the personal data."}, {"t": "It supports text, conversations (asynchronous) and documents (asynchronous; PDF, DOCX and TXT)", "c": true, "e": "These are the documented input types."}, {"t": "It supports only English plain text and cannot process documents", "c": false, "e": "Documents are supported."}], "concept": "PII detection finds personal data such as names, phone numbers and card numbers. It works on plain text, on conversations (asynchronous) and on documents (asynchronous; PDF, DOCX and TXT). It returns redacted text and the entity list, and you choose redaction policies and categories.\n\nThe important distinction is between the entity list and the redacted text. Flagging or storing the `entities` array still leaves the original text, with the social security number inside it. The redacted text replaces each entity with a mask or a category label, such as `[SSN]`, and that is the text to log, index or send to a model.\n\nRun PII detection before the data leaves your control: before a model call, a log write or an indexing step. The hybrid pattern is Language PII first, then an LLM on the redacted text, which keeps cost and risk low.\n\nPII detection is one of the core Language capabilities without a retirement notice.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/personally-identifiable-information/overview", "https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "An app must read an order confirmation aloud: the greeting in a calm style with one voice, and the delivery warning with a different voice, in one synthesized audio file. Which Speech feature supports switching voice or style inside one document?", "o": [{"t": "Batch transcription diarization", "c": false, "e": "It labels speakers in recordings."}, {"t": "SSML, which can change voice, style, rate, pitch and pauses inside one document", "c": true, "e": "SSML is XML that controls speech output."}, {"t": "Custom speech word error rate", "c": false, "e": "It measures recognition accuracy."}, {"t": "Translator transliteration", "c": false, "e": "It converts scripts."}], "concept": "SSML (Speech Synthesis Markup Language) is XML that controls how text is spoken. Typical uses: change rate, pitch and volume with `prosody`; insert pauses with `break`; fix pronunciation with `phoneme` and lexicons; switch voice or style inside one document with `voice` elements; and set the language for multilingual voices.\n\nFor this order confirmation, put each part in its own `voice` element or style, and add a `break` between them. Pick real voice names from the voice gallery for your region.\n\nPractical rules: SSML is XML, so escape `&` as `&amp;`; some tags are not supported for HD voices, personal voices and embedded voices; billing counts characters, including markup except `<speak>` and `<voice>`, and each Chinese character counts as two.\n\nCustom voices (professional voice fine-tuning, personal voice) are limited access and need approval, voice talent consent and disclosure to listeners.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/text-to-speech"], "ref": ["speech-solutions"]}, {"d": 5, "q": "A team creates a Content Understanding analyzer through the REST API and immediately submits a file for analysis, but the call fails because the analyzer is not ready. Which sequence is correct?", "o": [{"t": "Create the analyzer with a PUT (response 201 plus an `Operation-Location` header), track that operation until it completes, connect the models, then submit the file for the asynchronous analysis and poll the result", "c": true, "e": "Creation and analysis are separate asynchronous steps."}, {"t": "Skip model connection, because analyzers run with no model", "c": false, "e": "Generated fields need connected model deployments."}, {"t": "Analyze synchronously and expect the full result in the first response", "c": false, "e": "Analysis is asynchronous; you poll the operation."}, {"t": "Submit the file first and create the analyzer afterwards", "c": false, "e": "The analyzer defines how the file is processed."}], "concept": "Using Content Understanding has five steps. Create the analyzer: a PUT to `.../contentunderstanding/analyzers/{analyzerId}?api-version=...` with the JSON definition returns 201 and an `Operation-Location` header to track creation. Connect models: map the model names used in the analyzer to deployments on the resource. Analyze: submit the file (URL or bytes); the call is asynchronous, so poll the operation. Read the result: Markdown content, structured fields and optional segments. Validate against labeled samples and use confidence for routing.\n\nCommon failures: the model deployment is not connected; a deployment name is used where a model name is required; an `extract` field without source and confidence estimation; deep nesting that hurts accuracy; and guardrails on the deployment suppressing generated values.\n\nThe GA API version is `2025-11-01`. Preview features such as agentic mode and in-page segmentation use `2026-06-01-preview`.\n\nVersion analyzers, because changing a schema forces reprocessing.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference", "https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/overview"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "A team must run Content Understanding in production using only generally available features. Which choice is correct?", "o": [{"t": "Use the GA API version `2025-11-01` and avoid features that need `2026-06-01-preview`, such as agentic mode and in-page segmentation", "c": true, "e": "GA is preferred for production."}, {"t": "Use `2026-06-01-preview` for everything because it is newer", "c": false, "e": "Preview features can change."}, {"t": "No Content Understanding version is GA", "c": false, "e": "The page lists a GA version."}, {"t": "Agentic mode is GA and available in every version", "c": false, "e": "It is preview."}], "concept": "Content Understanding has a GA API version, `2025-11-01`, and a later preview, `2026-06-01-preview`, which adds agentic mode (`config.workflow` set to `agentic`, for documents, one input file per request), in-page segmentation (`allowInPageSegments`) and other items. The study guide says most questions cover GA features, and the exam may contain Preview features if they are commonly used.\n\nFor production, prefer GA, and clearly mark in design documents which parts rely on preview features so that you can plan for changes. Check the API version in every example before copying it.\n\nIn the same way, agentic retrieval has a GA REST version `2026-04-01` (minimal, extractive retrieval) and `2026-08-01-preview` (LLM query planning, answer synthesis, non-minimal effort and multi-turn messages).\n\nWhen a question includes a version, it often decides the answer: match the feature to the version that has it.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/overview", "https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "A search indexer must turn complex PDFs with tables and headings into clean Markdown and chunks inside the skillset, instead of using a separate preprocessing job. Which skillset building block fits?", "o": [{"t": "A knowledge store", "c": false, "e": "It stores enriched output but does not extract."}, {"t": "The Text Split skill alone, with no extraction step", "c": false, "e": "It chunks text but does not read tables from PDFs."}, {"t": "The Content Understanding skill (or a Layout-based skill), which produces structured Markdown for chunking inside the pipeline", "c": true, "e": "It keeps extraction inside the indexer and preserves tables and headings."}, {"t": "The Translation skill", "c": false, "e": "It translates text and does not parse layout."}], "concept": "A good RAG answer starts with good text. Flattening a table into a run of text destroys the relation between a row and its header. Layout analysis and Content Understanding keep tables, sections and hierarchy, and output Markdown that keeps headings and tables, which is ideal for chunking by section.\n\nIn an Azure AI Search skillset, the Content Understanding skill (or a Document Intelligence Layout-based approach) can produce this Markdown inside the indexer pipeline. Then the Text Split skill chunks it, an embedding skill creates vectors, and output field mappings or index projections write them to the index. The skill is part of the built-in set that uses Foundry Tools.\n\nChoose by need: layout-aware Markdown for RAG (Document Intelligence Layout or `prebuilt-documentSearch`), typed fields for automation (Content Understanding fields or prebuilt models), mixed media (Content Understanding).\n\nCheck the result by reading the extracted text of a few real files.", "src": ["https://learn.microsoft.com/en-us/azure/search/cognitive-search-concept-intro", "https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/document/overview"], "ref": ["azure-ai-search-configuration", "content-understanding-and-document-intelligence"]}, {"d": 5, "q": "A custom Web API skill calls an Azure Function that is protected with Microsoft Entra ID. The team wants the search service to authenticate with its managed identity instead of a function key. Which skill setting does this?", "o": [{"t": "`batchSize` set to 1000", "c": false, "e": "It sets records per call."}, {"t": "`timeout` set to `PT230S`", "c": false, "e": "It sets the time limit."}, {"t": "`authResourceId`, the application ID URI of the function's Entra app registration", "c": true, "e": "It lets the search service's managed identity authenticate to the protected function."}, {"t": "`httpMethod` set to `PUT`", "c": false, "e": "It chooses the method only."}], "concept": "The custom Web API skill (`Microsoft.Skills.Custom.WebApiSkill`) has these settings. `uri` is the HTTPS endpoint (only HTTPS is allowed). `httpMethod` is POST or PUT. `inputs` name the values taken from the enrichment tree. `outputs` name what your endpoint returns, written to the tree under `targetName`. `timeout` is an ISO 8601 duration, default 30 seconds, maximum 230. `batchSize` defaults to 1000. `degreeOfParallelism` defaults to 5 (range 1 to 10). `authResourceId` is optional: the application ID URI so the search service's managed identity authenticates to a function protected by Microsoft Entra ID.\n\nThis follows the keyless principle: a function key in `?code=` works but is a stored secret; the service redacts it when you read the skillset.\n\nShared private link can connect Search to custom skills on App Service or Functions in a private design, using the group ID `sites`.\n\nAlways treat inputs from documents as untrusted data.", "src": ["https://learn.microsoft.com/en-us/azure/search/cognitive-search-custom-skill-web-api"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "Analysts need the Markdown from scanned reports to keep titles, section headings, headers and footers, tables and selection marks, so that chunks can follow sections. Which Document Intelligence model provides this?", "o": [{"t": "A prebuilt invoice model", "c": false, "e": "It targets invoice fields."}, {"t": "Read, because it already returns the whole structure", "c": false, "e": "Read returns text, handwriting, words, lines and languages only."}, {"t": "A custom model trained on audio", "c": false, "e": "Audio is not a document input."}, {"t": "Layout, which adds tables, selection marks, paragraphs, titles and section headings, and headers and footers to Read", "c": true, "e": "It also offers Markdown output suited to RAG chunking by section."}], "concept": "Document Intelligence models form a ladder. Read extracts text and handwriting, with words, lines and languages. Layout includes Read plus tables, selection marks, paragraphs, titles and section headings, headers and footers, and the structure of the document; it can output Markdown, which suits chunking by section. Prebuilt models (invoice, receipt, ID) extract fields from fixed document types. Custom models are trained on labeled examples of your own forms.\n\nFor RAG, structure is the key. If a table is flattened, the model cannot tell which number belongs to which column. Layout Markdown keeps headings and tables, so a chunker can split by section and keep each table whole.\n\nContent Understanding `prebuilt-documentSearch` offers similar Markdown optimized for retrieval, and is multimodal. The two services are complementary: Document Intelligence for deterministic extraction from structured documents, Content Understanding for complex, unstructured and multimodal content.\n\nChoose the lowest rung that meets the need.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/prebuilt/layout", "https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/overview"], "ref": ["content-understanding-and-document-intelligence", "rag-retrieval-and-grounding"]}, {"d": 5, "q": "A security team asks whether customer-managed keys on Azure AI Search replace the service's built-in encryption. What is the correct statement?", "o": [{"t": "CMK is only needed to enable TLS", "c": false, "e": "TLS 1.2 and 1.3 on port 443 are built in."}, {"t": "Search does not encrypt data at rest unless you configure CMK", "c": false, "e": "It does encrypt by default."}, {"t": "Customer-managed keys replace built-in encryption, which is otherwise off", "c": false, "e": "Built-in encryption is always applied."}, {"t": "Customer-managed keys add a second encryption layer on top of the built-in 256-bit AES encryption at rest, which is always on", "c": true, "e": "CMK is optional and extra."}], "concept": "Azure AI Search applies some protections automatically: TLS 1.2 or 1.3 on port 443, 256-bit AES encryption at rest, Microsoft backbone traffic and compliance certifications. Microsoft does not use your data to train models. You do not configure these.\n\nWhat you do configure: network access (IP firewall, private endpoint); authentication (prefer Microsoft Entra ID with role-based access control over keys); indexer connections with managed identity; document-level permissions; monitoring; optional customer-managed keys as a second layer of encryption; and confidential computing (limited regions, higher cost).\n\nResource logs record operations and query text but not the user identity. Data stays in the chosen geography unless you write to Storage in another region (knowledge store, enrichment cache, debug sessions). Do not put sensitive text in object names.\n\nFor regulated workloads, combine CMK with private endpoints, managed identity and policy.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-security-built-in"], "ref": ["azure-ai-search-configuration"]}]};</script>
