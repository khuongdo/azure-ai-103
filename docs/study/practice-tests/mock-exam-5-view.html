 unnecessarily. Temperature 2 increases randomness and hurts consistency. Skipping human review for legal text is a compliance risk.\n\nMemory aid: tone dial, term list, human check for the dangerous parts, and a memory so you don't repeat work.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/overview"], "ref": ["translation"]}, {"d": 4, "q": "A web app translates a single short Word file and wants the translated file returned directly in the response, without creating storage containers. Which option fits?", "o": [{"t": "Batch document translation with SAS tokens", "c": false, "e": "It needs Blob containers."}, {"t": "Custom Translator", "c": false, "e": "It trains a model and does not translate a file."}, {"t": "Synchronous document translation, which needs a custom-domain endpoint and no storage account", "c": true, "e": "It handles one file and returns the result directly."}, {"t": "Transliterate", "c": false, "e": "It converts script only."}], "concept": "Document translation has two modes. The synchronous mode translates one file at a time and returns the translated file directly in the response. It needs a custom-domain endpoint for the Translator resource and no storage account, so there are no containers, SAS tokens or job polling.\n\nThe batch mode is for many or large files: source and target Blob containers, authorization by managed identity or SAS tokens, asynchronous processing and status polling.\n\nThe web app in the question translates a single short Word file and wants it returned directly. That is the synchronous mode. Custom Translator trains custom NMT models and does not translate files by itself. Transliterate converts a script to another script and does not translate the document.\n\nFormat and layout are preserved in both modes. Document content is processed in the region of the Translator resource, which matters for data residency.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/overview"], "ref": ["translation"]}, {"d": 5, "q": "A search service stores 50 million vectors, and the vector index size quota is nearly exhausted. The data is queried by approximate search. Which statement about vector algorithms and quota is correct?", "o": [{"t": "A field indexed as `exhaustiveKnn` can use HNSW at query time", "c": false, "e": "It cannot."}, {"t": "HNSW uses no memory because it reads vectors from disk on every query", "c": false, "e": "HNSW stores vectors in memory."}, {"t": "Exhaustive KNN uses more quota than HNSW", "c": false, "e": "It uses none."}, {"t": "HNSW keeps all vectors in memory and uses vector index size quota, while exhaustive KNN uses none, but it scans all vectors and suits small to medium data", "c": true, "e": "Choose the algorithm by data size, accuracy need and quota."}], "concept": "Vector indexes need memory and disk, and the algorithm decides which. HNSW (Hierarchical Navigable Small World) is the approximate algorithm: it builds a graph of vectors that is kept in memory for fast traversal. Therefore HNSW vectors count against the vector index size quota of the search service. Exhaustive KNN does not build such an index in memory; it compares the query with every stored vector, so it uses none of that quota, but each query scans everything and becomes slow as data grows. It suits small to medium collections, or the use of ground-truth checks.\n\nWith 50 million vectors and a nearly exhausted quota, the choice is not trivial: moving to exhaustive KNN would make queries too slow, so you would look at compression (quantization), fewer dimensions, a larger service tier or partitioning.\n\nA field is configured for one algorithm in its profile. A field indexed for exhaustive KNN does not become HNSW at query time, and HNSW does not read vectors from disk on every query.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-ranking"], "ref": ["rag-retrieval-and-grounding", "azure-ai-search-configuration"]}, {"d": 5, "q": "An indexer must read from a storage account in the same region as the search service, and the security team wants a storage firewall for the connection. Another indexer needs to call an Azure OpenAI embedding deployment over a private path. What should you know?", "o": [{"t": "Shared private link needs no group ID", "c": false, "e": "A group ID such as `openai_account` or `sites` is required."}, {"t": "Shared private link works for any internet address", "c": false, "e": "It works for Azure-to-Azure only."}, {"t": "Same-region storage traffic uses private IPs, so you cannot add a storage firewall for it; for Azure-to-Azure private access use a shared private link (for example `openai_account` for Azure OpenAI)", "c": true, "e": "Shared private link works for Azure-to-Azure only."}, {"t": "Same-region storage traffic always crosses the public internet", "c": false, "e": "It uses private IPs."}], "concept": "Search indexers often cross network boundaries, and Azure AI Search has rules for private connections.\n\nTraffic between a search service and a storage account in the same region uses private IP addresses on the Azure backbone. Because of that, a storage firewall rule cannot be used for that connection, as it cannot match the source. Cross-region traffic uses public addresses and can be controlled with IP rules.\n\nFor private access from the search service to other Azure services, such as an Azure OpenAI embedding deployment, you create a shared private link. It is a private endpoint managed by the search service for an outbound connection. You specify the target resource and a group ID that identifies the service type (for example `openai_account` for Azure OpenAI). A shared private link works for supported Azure resources, not for any internet address, and it always needs a group ID.\n\nAfter creating it, the resource owner must approve the private endpoint connection request.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-security-built-in"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "You configure the Text Split skill in `pages` mode for character-based chunking with `maximumPageLength` of 2000 and a page overlap. Which overlap value is valid, given that the overlap must be less than half the maximum length?", "o": [{"t": "`pageOverlapLength` of 500", "c": true, "e": "500 is less than 1,000 (half of 2,000), and it is the suggested default."}, {"t": "`pageOverlapLength` of 1000", "c": false, "e": "The overlap must be less than half the maximum length."}, {"t": "`pageOverlapLength` of 2000", "c": false, "e": "It equals the page length."}, {"t": "`pageOverlapLength` of 1500", "c": false, "e": "It is more than half."}], "concept": "The Text Split skill in `pages` mode divides text into chunks. `maximumPageLength` sets the size of a chunk; `pageOverlapLength` sets how much text is repeated between consecutive chunks. The rule is that the overlap must be less than half of the maximum length.\n\nWith `maximumPageLength` of 2000, half is 1000, so the overlap must be below 1000. 500 is valid. 1000 is not less than half (it is exactly half), 1500 and 2000 are larger.\n\nWhy a limit exists: with too much overlap, each new chunk would add very little new text, and the number of chunks, embedding calls and index size would grow a lot for no benefit.\n\nPractical values: an overlap of 10 to 25% of the chunk size is typical. For 2000 characters, 500 is 25%. Remember that character-based chunking differs from token-based chunking, where Microsoft's starting point is 512 tokens with 128 tokens of overlap.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-chunk-documents"], "ref": ["azure-ai-search-configuration", "rag-retrieval-and-grounding"]}, {"d": 5, "q": "Which description of the Content Understanding analyzer types is correct?", "o": [{"t": "All analyzers are custom and must be created from scratch", "c": false, "e": "Prebuilt analyzers exist."}, {"t": "Domain-specific analyzers are only for video", "c": false, "e": "`prebuilt-invoice` and similar are for documents."}, {"t": "RAG analyzers return only typed JSON fields and no Markdown", "c": false, "e": "They produce Markdown and descriptions optimized for retrieval."}, {"t": "Base analyzers (such as `prebuilt-document`) are starting points, RAG analyzers (such as `prebuilt-documentSearch`) are optimized for retrieval, domain-specific analyzers (such as `prebuilt-invoice`) cover common documents, and custom analyzers extend a base with a `fieldSchema`", "c": true, "e": "The analyzer `description` is used by the model as context, so write it clearly."}], "concept": "Content Understanding organizes analyzers in layers. Base analyzers, such as `prebuilt-document`, `prebuilt-audio`, `prebuilt-video` and `prebuilt-image`, are starting points that define the content type and basic processing. RAG analyzers, such as `prebuilt-documentSearch`, are optimized for retrieval: they produce Markdown with structure, and other helpful content. Domain-specific analyzers, such as `prebuilt-invoice`, cover common document types with predefined fields. Custom analyzers are created by you, usually starting from one of these, to add your own fields and rules.\n\nThe statement that all analyzers are custom is wrong, domain-specific analyzers are not only for video, and RAG analyzers return Markdown for retrieval, not only typed JSON.\n\nLearn advises copying a prebuilt analyzer into your own custom analyzer for production, so that a change in a prebuilt definition does not change your output.\n\nMemory aid: base = blank form, RAG = readable text for search, domain = a ready-filled form for a known document, custom = your own form.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "A team stores values with an `extract` field method in a Content Understanding schema. Extraction fails validation. Which requirement applies to `extract` fields?", "o": [{"t": "They choose a value from a fixed list", "c": false, "e": "That is `classify`."}, {"t": "They need source and confidence estimation (`estimateFieldSourceAndConfidence`), and they apply to documents", "c": true, "e": "`extract` returns the value as written in the content and relies on source and confidence information."}, {"t": "They work only for audio", "c": false, "e": "They are for documents."}, {"t": "They can be used for free-form summaries", "c": false, "e": "Summaries use `generate`."}], "concept": "Content Understanding fields have a method: `extract`, `classify` or `generate`. Each has requirements.\n\n`extract` copies a value from the content, so it must be able to point to the place where the value appears and say how sure it is. For that, the analyzer needs source and confidence estimation (`estimateFieldSourceAndConfidence`). Also, `extract` applies to documents, where text positions exist.\n\nFree-form summaries are `generate` fields. Choosing a value from a fixed list is `classify` with an enum. The claim that `extract` works only for audio is wrong.\n\nIf validation fails for an `extract` field, check that the estimation setting is enabled and that the content type is a document. If the value is not literally in the content, change the method to `generate` (for a derived value) or `classify` (for a category).\n\nMemory aid: extract = copy and point to where you found it.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "Mixed content arrives: standard invoices, audio recordings of calls and product videos. The team wants to avoid maintaining several unrelated pipelines. Which choice fits?", "o": [{"t": "Document Intelligence for everything", "c": false, "e": "It does not handle audio and video."}, {"t": "Azure Language for everything", "c": false, "e": "It works on text."}, {"t": "Content Understanding for the multimodal content (audio, video, documents) and Document Intelligence only where deterministic extraction for standard forms is needed", "c": true, "e": "The services are complementary, and Document Intelligence is for documents only."}, {"t": "Azure Translator for everything", "c": false, "e": "It translates text and documents."}], "concept": "Different modalities need different tools, but too many separate pipelines are costly to maintain. Content Understanding is a multimodal service: one framework with analyzers for documents, images, audio and video, with schema-based fields, confidence and grounding. The team can use it for the call recordings and the product videos, and for varied documents.\n\nDocument Intelligence remains a good choice where deterministic, high-accuracy extraction from standard forms is needed. Standard invoices are such a case: a prebuilt invoice model returns known fields predictably. The two services are complementary.\n\nDocument Intelligence for everything cannot analyze audio or video. Azure Language works on text and does not read documents or audio by itself. Translator translates text and documents and is unrelated to extraction.\n\nMemory aid: one workshop for mixed jobs, plus a precision machine for the one job that is always the same.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/document/overview"], "ref": ["content-understanding-and-document-intelligence"]}]};</script>
