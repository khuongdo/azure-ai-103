ine.\n\nWhen a request fails with `InvalidPayload`, check the `prompt`, `size` and `n` fields first.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"], "ref": ["image-and-video-generation"]}, {"d": 3, "q": "A developer sends `quality=\"xhigh\"` to a `gpt-image-2` deployment, and the request is rejected. The quality values documented for GPT-Image-2 are low, medium and high. What should they do?", "o": [{"t": "Use `low`, `medium` or `high`; `xhigh`, `max` and `auto` belong to the Sunburst and Flare models", "c": true, "e": "Supported quality values depend on the model."}, {"t": "Switch to the `webp` output format", "c": false, "e": "WEBP is not supported."}, {"t": "Use a custom size above 4000 pixels", "c": false, "e": "This breaks the size rules."}, {"t": "Add `n=10` to the request", "c": false, "e": "`n` is the image count."}], "concept": "Quality settings are specific to the model family. GPT-Image-2 supports `low`, `medium` and `high`. The values `xhigh`, `max` and `auto` belong to the Sunburst and Flare models. Sending `quality=\"xhigh\"` to a GPT-Image-2 deployment is an invalid value, so the request is rejected.\n\nThe fix is to use a value that this model supports, or choose a deployment of a model that supports the higher quality levels. Adding `n=10`, switching output format or using a bigger size will not change the validity of the quality value. Also remember that WEBP is not supported and custom sizes have rules (multiples of 16, limits on edge length, aspect ratio and total pixels).\n\nPractical habit: read the parameter table for the model you deploy, and keep model-specific settings in configuration so that a model change does not silently send unsupported values.\n\nHigher quality costs more time and money, so choose the lowest quality that meets the need.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"], "ref": ["image-and-video-generation"]}, {"d": 3, "q": "An image generation call fails with `InvalidPayload`. According to the error table, which fields should the team check first?", "o": [{"t": "The guardrail threshold for Violence", "c": false, "e": "Safety blocks return `contentFilter`, not `InvalidPayload`."}, {"t": "The `prompt`, `size` and `n` fields of the request", "c": true, "e": "`InvalidPayload` indicates a bad value in those fields."}, {"t": "The quota page of the subscription", "c": false, "e": "Quota problems return 429."}, {"t": "The firewall rules of the Storage account", "c": false, "e": "Storage firewalls cause different errors."}], "concept": "Error codes help you place the problem. For image generation, Learn lists: `contentFilter` when the safety system blocks a prompt or an output (change the prompt, do not retry the same text); `DeploymentNotFound` when the deployment name is wrong; 401 for bad credentials; 429 for quota (retry with exponential backoff); `content_policy_violation` for a policy problem (modify the prompt); and `InvalidPayload` for a bad `prompt`, `size` or `n`.\n\nValid values: `n` is 1 to 10; `size` for the gpt-image-1 family is 1024x1024, 1024x1536 or 1536x1024, and for GPT-Image-2 and the Sunburst and Flare models custom sizes follow rules (multiples of 16, long edge at most 3,840 pixels, aspect ratio between 1:3 and 3:1, total pixels between 655,360 and 8,294,400).\n\nLog the full request for failed calls so that invalid values are easy to see.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"], "ref": ["image-and-video-generation"]}, {"d": 3, "q": "A prompt for an image generator is harmless and passes the input filter, but a reviewer sometimes finds that the generated image contains unsafe content. Where should the team add protection?", "o": [{"t": "Disable filtering to avoid false positives", "c": false, "e": "This removes the protection that is needed."}, {"t": "Strengthen only the prompt filter and trust the output", "c": false, "e": "This leaves the unsafe output path unprotected."}, {"t": "Filter the generated image as well, with content safety severity thresholds on the output", "c": true, "e": "A harmless prompt can still produce a flagged image, so both sides need filters."}, {"t": "Rely on the file name of the generated image", "c": false, "e": "File names say nothing about content."}], "concept": "The content safety system uses classifiers for text and images across four categories: hate and fairness, sexual, violence and self-harm. For images it returns a trimmed severity scale (0, 2, 4, 6). For image with text from a multimodal model it returns the full 0 to 7 scale.\n\nA generator can fail on either side. A bad prompt may be blocked as input. But a harmless prompt can still lead to an image that is flagged, so you also need to check the output. Image generation endpoints return a `contentFilter` error when a prompt or an output is blocked, and Azure applies moderation on both sides of image generation models.\n\nBeyond safety, brand rules are separate: a \"safe\" annotation does not prove an image is on-brand. Add automated brand checks and human approval for public assets.\n\nRule: filter in, filter out, then review.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/harm-categories", "https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/content-safety/provenance-disclosure"], "ref": ["responsible-ai-for-multimodal-content"]}, {"d": 3, "q": "A Sora 2 job ends with the status `failed`. The web application currently shows the user a blank page. How should the backend handle this status?", "o": [{"t": "Poll the same job forever until it changes", "c": false, "e": "Final states do not change."}, {"t": "Treat `failed` as `succeeded` and download the file", "c": false, "e": "There is no file to download."}, {"t": "Create thousands of identical jobs at once", "c": false, "e": "This risks throttling and repeated failures."}, {"t": "Log the error and decide whether to retry or alert, and tell the user that the video could not be created", "c": true, "e": "`failed` and `cancelled` are final states that need a decision."}], "concept": "A video generation job moves through states until it reaches a final one: `succeeded`, `failed` or `cancelled`. Polling continues until one of these is returned.\n\nOn `succeeded`, the backend reads `generations` and downloads the file. On `failed` or `cancelled`, it logs the error, then decides: retry (if the error is temporary), change the prompt (if moderation blocked it) or alert an operator. The user must be told, because a silent failure looks like a bug.\n\nA production design stores the job ID so that a restart does not lose it, polls with a delay rather than in a tight loop, and uses a queue with a worker that notifies the user when the job is done.\n\nAzure applies input and output moderation to media generation, so a failure can come from a safety block.\n\nSora 2 is Preview, so check current limits.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/video-generation"], "ref": ["image-and-video-generation"]}, {"d": 3, "q": "A catalog team must generate 600 image variants. The deployment allows about 5 images per minute. Which approach is most appropriate?", "o": [{"t": "Fan out 100 parallel requests and let the service absorb them", "c": false, "e": "This would trigger 429 responses because the limit is per deployment."}, {"t": "Queue the requests, back off on 429, and request more quota or spread the load across deployments", "c": true, "e": "At 5 per minute, 600 images take about 120 minutes on one deployment. A queue with backoff handles the limit, and more quota or deployments shorten the time."}, {"t": "Set `n` to 600 in a single request", "c": false, "e": "`n` allows 1 to 10 images per request."}, {"t": "Switch to `output_format=JPEG` to raise the rate", "c": false, "e": "The output format does not change the rate limit."}], "concept": "Image generation is rate limited per deployment, and the default is small (about 5 images per minute for the gpt-image models). 600 images at 5 per minute need 120 minutes if you do nothing else.\n\nA robust batch design uses a queue. Workers take requests from the queue at a controlled pace. When the service answers 429, the worker backs off (waits and retries with exponential delay) instead of failing. If the deadline is too tight, request more quota or spread the load over more deployments or regions.\n\nWhat does not work: fanning out 100 parallel requests only produces 429 errors; asking for `n` = 600 in one request is not allowed (the number of images per request is small); and changing the file format does not change the rate limit.\n\nHow it relates: this is the same throttling pattern as for text models, with a queue added because image jobs are slow and batchy. Also store the prompt, parameters and model version with every generated asset.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"], "ref": ["image-and-video-generation"]}, {"d": 3, "q": "A legacy application uses Image Analysis 4.0 for captions, tags and OCR. What should the team plan?", "o": [{"t": "Migration to Custom Translator", "c": false, "e": "That is a translation service."}, {"t": "No action, because retirement dates never apply to Azure features", "c": false, "e": "Retirement notices do apply."}, {"t": "Migration toward vision-capable models or Content Understanding before Image Analysis 4.0 retires on September 25, 2028", "c": true, "e": "It still works until then, but new work should use models or Content Understanding."}, {"t": "Immediate removal, because the feature is already retired", "c": false, "e": "It retires in 2028."}], "concept": "Azure services have lifecycle notices, and features can be retired. Image Analysis 4.0 (captions, tags, OCR and more) has a published retirement date: September 25, 2028.\n\nA legacy application that uses it works today, but should have a migration plan: move toward vision-capable language models or Content Understanding, which provide more flexible image understanding and structured output. Steps: inventory the features in use, choose the replacement for each, run both in parallel on a test set, compare results, and switch before the date.\n\nIt is not retired yet, so immediate removal is unnecessary. The claim that retirement dates never apply is false. Custom Translator is for text translation, and has nothing to do with image analysis.\n\nKeep a list of features with their retirement dates, and review it regularly.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/computer-vision/how-to/call-analyze-image-40"], "ref": ["multimodal-understanding"]}, {"d": 3, "q": "A team uses a Content Understanding image analyzer to extract the full text of scanned multi-page contracts and gets poor results. Which statement explains this?", "o": [{"t": "Contracts cannot be analyzed by any Azure service", "c": false, "e": "Document analyzers and Document Intelligence handle them."}, {"t": "Only video analyzers can read scanned pages", "c": false, "e": "Video analyzers process video."}, {"t": "Image analyzers are the preferred choice for contracts", "c": false, "e": "They are designed for photos and visual characteristics."}, {"t": "Image analyzers are not optimized for text-primary analysis; use a document analyzer or Document Intelligence for pages of text", "c": true, "e": "Learn says to use a document analyzer for text-heavy pages."}], "concept": "Content Understanding has analyzers for different content types. Image analyzers (base `prebuilt-image`, `prebuilt-imageSearch` for retrieval descriptions) extract visual characteristics and return the same fields for every image through a field schema, for example counting empty shelf slots or rating a condition. Learn says they are not optimized for text-primary analysis.\n\nPages of text, such as contracts, are the job of document analyzers (`prebuilt-document`, `prebuilt-documentSearch` for Markdown optimized for retrieval) or of Document Intelligence Read and Layout. These handle OCR, layout, tables and structure and return Markdown or fields.\n\nA simple routing rule: photos of things go to an image analyzer; pages of text go to a document analyzer; video goes to a video analyzer; mixed content can be classified first and routed.\n\nUse the narrowest tool for the content type.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/image/overview", "https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers"], "ref": ["multimodal-understanding", "content-understanding-and-document-intelligence"]}, {"d": 3, "q": "A batch job fans out many image requests and receives HTTP 429 from the deployment. Which TWO actions fit the guidance?", "o": [{"t": "Queue the work and retry with exponential backoff instead of sending all requests at once", "c": true, "e": "The default quota is about 5 images per minute per deployment, so bursts are throttled."}, {"t": "Spread the load over several deployments or request more quota", "c": true, "e": "Capacity is limited per deployment, and quota can be increased by request."}, {"t": "Resend the same request in a tight loop until it succeeds", "c": false, "e": "This increases throttling."}, {"t": "Switch to a smaller prompt, because prompt length sets the image quota", "c": false, "e": "Quota is counted in images per minute, not prompt length."}, {"t": "Disable content safety to speed up processing", "c": false, "e": "Safety filtering is not a quota control and should stay on."}], "concept": "A quota is a ceiling on how much work a deployment accepts per minute. For the gpt-image models the default is about 5 images per minute per deployment. A job that needs 600 variants therefore needs about 120 minutes on a single deployment, and a design that assumes instant results will time out.\n\nWhen 429 appears, plan for it: put the requests in a queue, retry with exponential backoff, ramp up gradually, spread across deployments, request more quota, or use off-hours queues. Store prompts, parameters and model versions so retries are reproducible, and alert on quota errors and filter blocks.\n\nFor draft work, use `low` or `medium` quality to reduce cost, and render finals at `high`.\n\nNever fan out 100 parallel requests, and never keep safety on pause to gain speed.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"], "ref": ["image-and-video-generation", "capacity-cost-and-throttling"]}, {"d": 3, "q": "A publisher resizes AI-generated images with a tool that strips file metadata. Which provenance signal might still be detectable afterwards?", "o": [{"t": "The invisible watermark embedded in the content", "c": true, "e": "Content Credentials (C2PA) are metadata and are lost by many edits. An imperceptible watermark may survive."}, {"t": "The EXIF camera model", "c": false, "e": "AI-generated images have no camera and EXIF is metadata too."}, {"t": "The C2PA Content Credentials", "c": false, "e": "They are cryptographically signed metadata and are removed when metadata is stripped."}, {"t": "The file name", "c": false, "e": "File names are not a provenance signal."}], "concept": "Provenance for supported Microsoft models has two layers. Content Credentials (C2PA) are metadata stored in the file. An invisible watermark is embedded in the content itself, in the pixels.\n\nTools that strip metadata, such as some resizing tools, remove the C2PA data and the EXIF fields. The file name is just text. The invisible watermark was designed to survive some transformations, because it is part of the image content, so it might still be detectable after a resize. It is not guaranteed to survive heavy editing, cropping or screenshotting.\n\nTherefore a missing Content Credential does not prove the image is not AI-generated, and a surviving watermark gives extra evidence.\n\nPractice: keep originals with metadata, check provenance when assets enter your system, and label AI content for your audience.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/content-safety/provenance-disclosure"], "ref": ["responsible-ai-for-multimodal-content"]}, {"d": 3, "q": "A media company processes 50,000 long videos with a Content Understanding video analyzer and wants lower cost. Their analysis needs only one description per whole video, not scene-level records. Which setting reduces cost?", "o": [{"t": "Set `enableSegment` to `true` with ten content categories", "c": false, "e": "Video supports only one content category, and segmentation adds cost."}, {"t": "Switch to a document analyzer for the videos", "c": false, "e": "Document analyzers do not process video."}, {"t": "Disable the transcript so that audio is skipped, and also segment the video", "c": false, "e": "This does not remove the cost of segmentation."}, {"t": "Set `enableSegment` to `false` so the whole video is treated as one unit, since segmentation uses tokens", "c": true, "e": "Segmentation adds cost, and the requirement does not need it."}], "concept": "Content Understanding processes video in two stages. Stage 1 is content extraction: transcript with speaker labels, key frames and shot detection. Stage 2 is field extraction and segmentation. With `enableSegment: true` and a natural-language category, the analyzer splits the video into logical segments. With `enableSegment: false`, the whole video is one unit.\n\nSegmentation uses tokens, so it costs money. Use it when users need to jump to a moment, as in a searchable library with `prebuilt-videoSearch`, which produces per-segment records. Skip it when a single description per video is enough.\n\nFor video only one content category is supported. Video also has limits: about one frame per second is sampled and resized to 512x512, and only speech is transcribed.\n\nVersion the analyzer, and batch the backfill if the schema changes, because reprocessing a whole library is expensive.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/overview", "https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"], "ref": ["multimodal-understanding"]}, {"d": 3, "q": "A Content Understanding analyzer for ads uses `enableSegment: true` to split videos into \"ads\" and \"game play\" segments. The team asks for three categories. What applies?", "o": [{"t": "Video supports up to 200 categories", "c": false, "e": "The 200-category limit is for document classification."}, {"t": "Segmentation works only for audio", "c": false, "e": "It works for video here."}, {"t": "For video only one content category is supported, and segmentation uses tokens, so it adds cost", "c": true, "e": "Video segmentation takes a single natural-language category description."}, {"t": "Segmentation is free and unlimited", "c": false, "e": "It uses tokens."}], "concept": "Content Understanding can split a long file into segments with `enableSegment: true`. Segmentation uses a content classification: you define categories, and the service assigns each segment to one.\n\nThe number of categories depends on the content type. For documents, a classifier can use many categories (up to 200). For video, only one content category is supported. The team asks for three, which is beyond the limit for video. Segmentation also uses tokens, so it adds cost.\n\nAlternatives for splitting ads from game play: use one category and describe the target segment, or process the video in two steps, first segmenting then classifying the extracted segments with a separate model or analyzer.\n\nSegmentation is neither free nor unlimited, and it is not limited to audio.\n\nMemory aid: documents can have many drawers (200 categories); a video gets one drawer.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/overview"], "ref": ["multimodal-understanding", "content-understanding-and-document-intelligence"]}, {"d": 3, "q": "A designer asks for a logo with a transparent background and a small file for the web. Which TWO statements about gpt-image output options are correct?", "o": [{"t": "JPEG output supports a transparent background", "c": false, "e": "JPEG has no alpha channel."}, {"t": "`output_compression` (0 to 100) applies to JPEG only", "c": true, "e": "It does not change PNG output."}, {"t": "WEBP output is supported with `output_compression`", "c": false, "e": "WEBP is not supported."}, {"t": "The response returns a URL valid for one hour", "c": false, "e": "The gpt-image models return base64 in `b64_json`."}, {"t": "Transparent backgrounds need PNG output", "c": true, "e": "`background` can be `transparent` only with PNG."}], "concept": "The gpt-image models have output options that affect file format, size and transparency. In the study material, `output_format` accepts PNG (the default) or JPEG; WEBP is not supported.\n\nTransparency: a transparent background (`background` set to `transparent`) needs a format with an alpha channel, so it needs PNG. JPEG cannot store transparency. A logo that must sit on any web page background therefore uses PNG.\n\nCompression: `output_compression` is an integer from 0 to 100 (default 100) and it applies to JPEG only. It does not change PNG output, which is lossless. So choosing PNG gives transparency but gives you no compression control, while JPEG gives a smaller file but no transparency. A designer cannot have both from this setting, and must decide which matters more for each asset.\n\nThe response never returns a URL: the gpt-image models always return base64 in `b64_json`, so your code decodes and stores the file itself.\n\nMemory aid: PNG = transparent but heavy; JPEG = light but opaque.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"], "ref": ["image-and-video-generation"]}, {"d": 3, "q": "A moderation team reads severity values from the content safety classifier for an image-only input (no text in the request). Which values can be returned?", "o": [{"t": "0, 2, 4 or 6", "c": true, "e": "Images use the trimmed severity scale. The full 0 to 7 scale applies to text and to image-with-text input handled by a multimodal model."}, {"t": "Any integer from 0 to 7", "c": false, "e": "The full scale is returned for text and for multimodal image-with-text content, not for image-only classification."}, {"t": "Only safe or unsafe", "c": false, "e": "Content Safety returns severity levels, not a binary result."}, {"t": "Percentages from 0 to 100", "c": false, "e": "Severity is a level, not a percentage."}], "concept": "Azure AI Content Safety returns a severity level for each harm category (hate, sexual, violence, self-harm). The scale depends on the type of input.\n\nFor text, the model can return a full scale from 0 to 7 (or a trimmed scale on request). For images, the service returns a trimmed scale with four levels: 0, 2, 4 and 6. For image with text, the multimodal model returns the full 0 to 7 scale.\n\nThis matters when you set thresholds. A rule such as \"block at 4 or higher\" works on both scales, but a rule such as \"block at 3 or higher\" would never see a value of 3 for an image-only request. Always set thresholds against the right scale.\n\nThe other answers are wrong because the service does not return a plain safe or unsafe flag, and it does not return percentages for severity.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/harm-categories"], "ref": ["responsible-ai-for-multimodal-content"]}, {"d": 3, "q": "A web backend starts a Sora 2 video job and must not block the user request while it waits. Which design follows the documented job lifecycle?", "o": [{"t": "Ignore the job ID and wait for a callback that Sora always sends", "c": false, "e": "The documented pattern is to poll the job."}, {"t": "Store the job ID, poll the job status with a delay until it is `succeeded`, `failed` or `cancelled`, then download the result on success", "c": true, "e": "Video generation is an asynchronous job, so you receive an ID immediately and poll for the final status."}, {"t": "Poll in a tight loop every few milliseconds", "c": false, "e": "This can lead to throttling; poll with a delay."}, {"t": "Hold the HTTP request open until the video is returned in the same response", "c": false, "e": "This causes time-outs because generation takes a long time."}], "concept": "Video generation takes much longer than a normal web request, so the API is asynchronous. You create a job and immediately receive a job ID. You then poll the job until its status becomes `succeeded`, `failed` or `cancelled`. On `succeeded` you read the `generations` and download the file. On `failed` or `cancelled` you log the error and decide whether to retry or alert.\n\nA robust production design uses a queue and a worker. The web request stores the job ID and returns at once. The worker polls with a delay (for example every 10 seconds), and the user is notified when the video is ready.\n\nCommon mistakes: keeping a request open until the job is done, polling in a tight loop, losing the job ID after a restart, and ignoring the `failed` status.\n\nSora 2 is Preview, so check the current API version and limits before coding.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/video-generation"], "ref": ["image-and-video-generation"]}, {"d": 3, "q": "A Content Understanding video analyzer is used to build a subtitle file and a speaker-labeled transcript. In which form does the transcript appear in the output?", "o": [{"t": "As a PDF file attached to the response", "c": false, "e": "It is returned in Markdown and JSON."}, {"t": "Only as a list of music tracks and sound effects", "c": false, "e": "Only speech is transcribed."}, {"t": "As WEBVTT in the Markdown output, with speaker diarization and multilingual support", "c": true, "e": "The transcript, key frames and shot data come from the content extraction stage."}, {"t": "As a separate invoice-like JSON schema that you must define", "c": false, "e": "The transcript is part of the extracted content."}], "concept": "In the first stage of Content Understanding video processing, content extraction, the analyzer produces the raw material: a transcript with speaker diarization and multilingual support, key frames, and shot detection (shot boundaries are returned with `returnDetails: true`). The transcript appears as WEBVTT in the Markdown output. Only speech is transcribed, not music or sound effects.\n\nThe second stage adds field extraction (your `fieldSchema` fields with `generate` or `classify` methods) and segmentation (`enableSegment` with a category description). The output is Markdown (transcript and key frames) plus JSON (descriptions, segment boundaries, fields).\n\nWEBVTT is a subtitle format, which makes the transcript easy to align with video time. Set the locales where applicable to improve quality.\n\nLimits: about one frame per second is sampled, and frames are resized to 512x512.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/overview"], "ref": ["multimodal-understanding"]}, {"d": 3, "q": "A design tool wants to show progressive previews while a high-quality image is still being generated, instead of a long blank wait. What should you use?", "o": [{"t": "Set `stream=true` and `partial_images` (0 to 3), and handle `image_generation.partial_image` events", "c": true, "e": "Each event carries `partial_image_index` and `b64_json` for an early preview."}, {"t": "Use `output_compression=0`", "c": false, "e": "This only affects JPEG compression."}, {"t": "Poll the job status endpoint every second", "c": false, "e": "Image generation does not use the Sora-style job lifecycle here."}, {"t": "Set `n=10` and show the images as they finish", "c": false, "e": "`n` creates several final images, not progressive previews."}], "concept": "Image generation at high quality can take a long time. A user staring at a blank screen assumes the app is broken. Streaming solves this by delivering partial images while the model is still working.\n\nYou set `stream=true` and `partial_images` to a number from 0 to 3, which is how many partial images you want. The service sends events of type `image_generation.partial_image`, each with a `partial_image_index` and `b64_json`. Your user interface displays each partial image as a progressive preview and replaces it with the final image.\n\nPolling a job endpoint is the pattern for video generation, not for this feature. Setting `n=10` produces ten separate images, which is more waiting, not a preview. `output_compression` changes file size, not delivery.\n\nMemory aid: streaming is the sketch artist showing a rough drawing first, then the finished painting.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"], "ref": ["image-and-video-generation"]}, {"d": 3, "q": "A marketing team publishes AI-generated ads. Policy requires logos, colors and forbidden symbols to be checked before anything goes public. Which review workflow step fits best after the content safety filter?", "o": [{"t": "Automated brand checks with a vision model, followed by human approval for public assets", "c": true, "e": "Brand rules are separate from safety classification, and public content should have a recorded human decision."}, {"t": "Delete the original files after publication", "c": false, "e": "The original with credentials should be kept as the system of record."}, {"t": "Publish first and review only if customers complain", "c": false, "e": "This puts unreviewed content in front of the public."}, {"t": "Skip checks because the content safety filter already covers brand rules", "c": false, "e": "Safety filters do not enforce brand or visual policy rules."}], "concept": "Responsible AI for generated media is a chain of steps. Filter the prompt. Generate and record the prompt, parameters and model version. Filter the output. Run automated checks such as brand rules (logo, colors), technical quality and lists of forbidden symbols, often with a vision-capable model. Add human approval for anything public, and store who approved and when. Attach provenance and label the asset. Publish and monitor, with a path to take content down.\n\nSafety filters classify harm categories only. They do not know your logo rules or your list of prohibited symbols, so a separate automated check is needed. Rejected assets and complaints should become new test cases.\n\nKeep the original file with its Content Credentials as the system of record, because resizing and re-saving can strip metadata.\n\nCount the rejections in your cost model: some assets never get published.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/content-safety/provenance-disclosure", "https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview"], "ref": ["responsible-ai-for-multimodal-content"]}, {"d": 3, "q": "A design tool streams progressive previews while a gpt-image deployment renders a large image. Which TWO statements about streaming are correct?", "o": [{"t": "Events of type `image_generation.partial_image` carry `partial_image_index` and `b64_json`", "c": true, "e": "The UI can display each preview as it arrives."}, {"t": "Set `partial_images` to 8 to receive eight previews", "c": false, "e": "The allowed range is 0 to 3."}, {"t": "Streaming removes the need for content safety checks on the final image", "c": false, "e": "The final output still needs filtering."}, {"t": "Partial results are returned as hosted URLs only", "c": false, "e": "Results are base64 in `b64_json`."}, {"t": "Set `stream` to true and `partial_images` to a value from 0 to 3", "c": true, "e": "These are the documented controls for partial results."}], "concept": "Image generation can take a while. With streaming, the service sends partial results so the user sees progress instead of a blank wait. You turn it on with `stream: true` and choose how many previews with `partial_images`, an integer from 0 to 3.\n\nEach preview arrives as an event of type `image_generation.partial_image`. The event carries `partial_image_index` (the order of the preview) and `b64_json` (the base64 image data). A user interface can decode each one and show a progressively sharper picture.\n\nStreaming only changes how results are delivered. Moderation still applies, and your own checks on the final output (content safety, brand rules, human approval for public assets) are still needed.\n\nThe image edit endpoint supports `stream` and `partial_images` too.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"], "ref": ["image-and-video-generation"]}, {"d": 3, "q": "A product team must analyze images of delivery packages, and the instructions about what to look for change every week as new damage types appear. The volume is low, and each question is different. Which tool fits better?", "o": [{"t": "A Content Understanding custom analyzer with a fixed field schema", "c": false, "e": "A schema is best when the same typed fields are needed from many images and instructions rarely change."}, {"t": "A vision-capable chat model with a prompt that is easy to edit", "c": true, "e": "One-off, open or often-changing questions suit a prompt-driven model."}, {"t": "An embedding model only", "c": false, "e": "It produces vectors and does not describe damage."}, {"t": "Azure Translator", "c": false, "e": "It translates text and does not analyze images."}], "concept": "Two tools analyze images. A vision-capable chat model accepts images as part of a message and answers in text. It is flexible and prompt-driven. A Content Understanding image analyzer is a reusable configuration with a field schema, so every image returns the same typed fields, with options for confidence.\n\nThe comparison: for a one-off, open question, a chat model is best and an analyzer is overkill. For the same fields from 100,000 images, an analyzer is best because a chat model can drift. For typed JSON with confidence, an analyzer has it built in, while a chat model needs extra prompting. For instructions that change often, a chat model is easy (edit the prompt), while an analyzer needs an update.\n\nIn this scenario, changing instructions and low volume point to the chat model. Once the damage types stabilize and volume grows, an analyzer becomes attractive.\n\nAlways tell the model to describe only what is visible and to say when something is not visible.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/gpt-with-vision", "https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/image/overview"], "ref": ["multimodal-understanding"]}, {"d": 3, "q": "A shop wants customers to search a catalog of product photos by uploading a picture or typing a text description, with both kinds of input compared in one vector space. Which approach fits?", "o": [{"t": "Image generation", "c": false, "e": "It creates new images."}, {"t": "Keyword search on file names", "c": false, "e": "File names do not capture the image content."}, {"t": "Azure Vision multimodal embeddings (a preview skill in Azure AI Search) that embed text and images in the same space", "c": true, "e": "One embedding space allows text-to-image and image-to-image search."}, {"t": "A text-only embedding model for the captions of the images", "c": false, "e": "It cannot compare an uploaded picture with the catalog images directly."}], "concept": "A search where a customer uploads a picture or types a description needs text and images to be comparable. That requires a multimodal embedding model that places both in the same vector space, so the distance between a text vector and an image vector means something.\n\nAzure Vision multimodal embeddings do this. In Azure AI Search there is a preview skill that uses Azure Vision multimodal embeddings, so the index can hold image vectors and the query (text or image) is embedded into the same space. Hybrid or vector search over those vectors returns visually or semantically similar products.\n\nA text-only embedding of captions loses visual detail and cannot embed an uploaded image directly. Keyword search on file names finds nothing meaningful. Image generation creates pictures and does not help retrieval.\n\nNote the preview status: plan for changes, and test relevance with real shopper queries.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-integrated-vectorization"], "ref": ["multimodal-understanding", "azure-ai-search-configuration"]}, {"d": 3, "q": "A factory wants to identify the components visible in each product photo (for example connector, screw, label) and receive the same typed fields for every image, with a path to production quality control. Which solution fits, and which legacy option should be avoided for new work?", "o": [{"t": "Azure Translator with a glossary", "c": false, "e": "It translates text."}, {"t": "A document analyzer, because photos are documents", "c": false, "e": "Image analyzers are for visual content."}, {"t": "A Content Understanding custom image analyzer based on `prebuilt-image` with a field schema; avoid building new work on Image Analysis 4.0, which retires on September 25, 2028", "c": true, "e": "A schema gives repeatable typed output, and the older API is on a retirement path."}, {"t": "Image Analysis 4.0 as the long-term choice for new work", "c": false, "e": "It retires on September 25, 2028."}], "concept": "Identifying objects, components or regions in images can be done with a vision-capable chat model (flexible, prompt-driven) or with a Content Understanding image analyzer (schema-driven and repeatable). A custom analyzer based on `prebuilt-image` defines a `fieldSchema`, so every image returns the same fields: for example a list of components (method `generate`), a count of missing parts, or a condition (method `classify` with an enum).\n\nUse image analyzers for retail shelf checks, manufacturing quality control, and building captions and metadata for retrieval or business intelligence. They are not optimized for text-primary content.\n\nImage Analysis 4.0 (captions, tags, OCR, object detection) retires on September 25, 2028, so plan migration for new work toward models or Content Understanding.\n\nFor one-off, changing questions use a chat model; for the same fields over thousands of images use an analyzer.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/image/overview", "https://learn.microsoft.com/en-us/azure/ai-services/computer-vision/how-to/call-analyze-image-40"], "ref": ["multimodal-understanding"]}, {"d": 3, "q": "A retailer must extract the same fields (count of empty slots, overall shelf condition from three allowed values) from 100,000 shelf photos, with typed JSON output. Which approach fits best?", "o": [{"t": "A Content Understanding custom image analyzer based on `prebuilt-image` with a `fieldSchema` (a number field and a `classify` field with an `enum`)", "c": true, "e": "Schema-driven analyzers return the same typed fields for every image and are built for repeatable extraction at scale."}, {"t": "Ask a vision chat model an open question for each photo", "c": false, "e": "Free-form answers drift between images and need extra prompting for typed output."}, {"t": "A text-only embedding model", "c": false, "e": "It cannot read images."}, {"t": "Image Analysis 4.0 tags", "c": false, "e": "Tags describe content generally and do not return your custom fields."}], "concept": "When you need the same fields from many images, a Content Understanding custom image analyzer is the best fit. You start from a base such as `prebuilt-image` and define a `fieldSchema`: the list of fields with types and methods. Every photo then returns the same typed JSON.\n\nFor the shelf photos: a number field for the count of empty slots (extract or generate, depending on the task) and a `classify` field for the overall condition with an `enum` of three allowed values such as good, fair and poor. Because the classification must choose from a fixed list, the output is consistent and can be aggregated across 100,000 photos.\n\nAn open question to a chat model returns free text that differs from photo to photo. Image Analysis 4.0 tags describe generic content, not your business fields. A text-only embedding model cannot read pictures.\n\nMemory aid: the schema is a form, and every photo fills in the same form.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers"], "ref": ["multimodal-understanding"]}, {"d": 3, "q": "A retailer edits product photos with a gpt-image deployment. The product logo and a person's face must stay close to the input image, and only the background should change. Which request setting helps preserve the original features?", "o": [{"t": "`output_format` set to `JPEG`", "c": false, "e": "It changes the file format, not how closely the output follows the input."}, {"t": "A larger `n` value", "c": false, "e": "It only produces more variants."}, {"t": "A high `input_fidelity` value, together with a mask that marks only the background", "c": true, "e": "`input_fidelity` controls how closely style and features, especially faces, follow the input."}, {"t": "`background` set to `transparent`", "c": false, "e": "It controls the output background transparency, not fidelity to input features."}], "concept": "Image editing (inpainting) uses a multipart request with the source image, an optional mask and a prompt. The mask is a PNG with the same dimensions as the input image, and fully transparent pixels (alpha 0) mark the areas to edit.\n\nTwo controls work together for this kind of job. The mask limits where the model may change pixels, so the product stays untouched. The `input_fidelity` setting tells the model how closely to follow the style and features of the input image, which matters for logos and faces. It is not supported by `gpt-image-1-mini`.\n\nOther settings have different roles: `n` is the number of images (1 to 10), `output_format` is PNG or JPEG, and `background` can be `auto` or `transparent`.\n\nAfter the call, compare the unmasked area with the original and run content safety on the result.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"], "ref": ["image-and-video-generation"]}, {"d": 3, "q": "A video analyzer splits ad breaks and program content, but the segment boundaries are inconsistent from one video to another. The content category description is \"interesting parts\". What should the team change?", "o": [{"t": "Set `enableSegment` to false and expect segments", "c": false, "e": "This turns segmentation off."}, {"t": "Write a more specific natural-language description of the category, because vague descriptions give inconsistent boundaries", "c": true, "e": "Segmentation follows the category description."}, {"t": "Add a second content category for video", "c": false, "e": "Video supports only one content category."}, {"t": "Reduce the video frame rate to 0.1 fps", "c": false, "e": "Frame rate is fixed by the service, about 1 fps."}], "concept": "Segmentation splits a video into logical chunks based on a natural-language description of a content category. With `enableSegment: true`, the analyzer uses the description to decide where a segment starts and ends. For video only one content category is supported, and segmentation uses tokens (cost).\n\nA vague description such as \"interesting parts\" leaves the model to guess, and the guesses differ between videos. A precise description names what defines a segment: \"an advertisement break that begins with a brand logo or jingle and ends when the program resumes\".\n\nTest the description on a small labeled set of videos, compare the boundaries with human judgment, and refine. Remember the other limitations: about one frame per second is sampled, so very fast actions may be missed.\n\nVersion the analyzer and batch backfills when you change it.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/overview", "https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"], "ref": ["multimodal-understanding"]}, {"d": 3, "q": "A vision-capable chat model cannot read the small serial numbers printed on an uploaded equipment photo. The model replies with plausible but wrong digits. What is the recommended first improvement?", "o": [{"t": "Convert the photo to text with a translation service", "c": false, "e": "Translator does not read images."}, {"t": "Provide a higher-resolution image (or a crop of the label) and instruct the model to say when text is not readable", "c": true, "e": "Unreadable small text needs better input, and an explicit \"out\" prevents guessed digits."}, {"t": "Ask the model to always provide an answer, even if unsure", "c": false, "e": "This increases invented details."}, {"t": "Increase the temperature to get more varied digits", "c": false, "e": "More randomness increases wrong answers."}], "concept": "Vision-capable models answer questions about images, but they can invent details that are not visible. Typical causes are unreadable small text, a low-resolution image, or a prompt that forces an answer.\n\nImprovements: provide a higher-resolution image or crop the region that matters; tell the model to describe only what is visible and to say \"not readable\" or \"not visible\" when it cannot read something; and for critical values (serial numbers, amounts), verify with a purpose-built OCR step such as Document Intelligence Read or Content Understanding, which return text with confidence.\n\nAlso check that the image URL is reachable by the service: a private Blob needs a managed identity with a blob read role or a SAS URL.\n\nWhere the cost of an error is high, add a human review.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/gpt-with-vision"], "ref": ["multimodal-understanding"]}, {"d": 3, "q": "A Content Understanding video analyzer produces poor transcripts for recordings in several languages. The audio quality is good. Which configuration should the team review?", "o": [{"t": "Set the spoken language (`locales`) where applicable, because an unset language lowers transcript quality", "c": true, "e": "The analyzer transcribes speech and benefits from the correct locale."}, {"t": "Turn on `enableBarcode` for videos", "c": false, "e": "Barcode reading applies to documents."}, {"t": "Use a document analyzer instead", "c": false, "e": "Document analyzers do not process video."}, {"t": "Set `tableFormat` to markdown", "c": false, "e": "This is a document table setting."}], "concept": "Stage 1 of Content Understanding video processing is content extraction. It produces a transcript with speaker diarization and multilingual support, key frames and shot detection. Only speech is transcribed, not music or sound effects.\n\nTranscript quality depends on the language setting. When the spoken language is not set, quality can drop, so set `locales` where applicable. Other limits matter too: about one frame per second is sampled and frames are resized to 512x512, so very fast actions can be missed.\n\nFor libraries in many languages, group videos by language and configure locales per group, and evaluate with a few labeled samples.\n\nOutput is Markdown (the transcript as WEBVTT and key frames) plus JSON for fields and segments. `prebuilt-videoSearch` produces per-segment records for retrieval.\n\nVersion the analyzer, because changing the schema forces reprocessing.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/overview"], "ref": ["multimodal-understanding"]}, {"d": 3, "q": "A developer calls a gpt-image deployment with `response_format=\"url\"` to get a link to the image. The call fails. Which statement is correct?", "o": [{"t": "The deployment must be Global Provisioned to return URLs", "c": false, "e": "Deployment type does not change the response shape."}, {"t": "URLs are supported only for JPEG output", "c": false, "e": "The output format does not create URLs."}, {"t": "The gpt-image models do not support `response_format`; the response always returns the image as base64 in `data[i].b64_json`", "c": true, "e": "Decode `b64_json` and save the file."}, {"t": "`response_format` accepts `url` only when `quality` is `high`", "c": false, "e": "There is no such dependency."}], "concept": "Older image models could return a URL to the generated image. The gpt-image models changed this: the response always returns the image as base64 text in `data[i].b64_json`, and the `response_format` parameter is not supported. Sending it makes the call fail.\n\nThe code must decode the base64 string into bytes and save them, for example to a file or to Blob Storage, and then serve it from your own storage if you need a link.\n\nOther settings do not change this behavior: `quality` only controls detail, the output format (PNG, JPEG, WebP) is chosen separately with `output_format`, and the deployment type (Global Provisioned) is a billing and capacity matter.\n\nStreaming adds another option: with `stream=true` and `partial_images`, you receive partial images as events, which lets a user interface show progress for a long generation.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"], "ref": ["image-and-video-generation"]}]};</script>
