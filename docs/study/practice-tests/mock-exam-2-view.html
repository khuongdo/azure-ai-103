nt sentences from the original text and returns them unchanged. Each selected sentence comes with a rank score and its position (offset), so you can highlight it in the source. No new text is written, so nothing is invented.\n\nAbstractive summarization writes new sentences that paraphrase the content, like a human summary. It reads more smoothly but can introduce errors, and there is no sentence position to point to.\n\nKey phrase extraction returns short phrases, not sentences. Opinion mining returns sentiment about targets.\n\nThe requirement here is \"the most important original sentences\", \"rank score and sentence positions\" and \"no newly written text\". Each clue points to extractive summarization.\n\nMemory aid: extractive = highlighter pen; abstractive = write your own summary in your own words.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview"], "ref": ["text-analysis-language-and-llms"]}, {"d": 4, "q": "A manager uploads one 40-minute recording and wants the transcript right away in a single synchronous call. The file is well under 2 hours and 300 MB. Which Speech to text mode fits?", "o": [{"t": "Fast transcription", "c": true, "e": "It is synchronous, returns the result for one file immediately and supports files under about 2 hours and 300 MB."}, {"t": "Text to speech", "c": false, "e": "It converts text to audio."}, {"t": "Real-time transcription with the Speech SDK", "c": false, "e": "It is for live audio that is heard as it is spoken."}, {"t": "Batch transcription", "c": false, "e": "It is asynchronous and meant for many or long files, with results written to storage."}], "concept": "Speech to text has three modes, and the choice depends on timing and volume.\n\nFast transcription is a synchronous API: you send one audio file and get the transcript in the same response, usually much faster than the audio length. It supports files up to about two hours and 300 MB, which fits a 40-minute recording. Batch transcription is asynchronous and meant for many or large files in storage, with results later. Real-time transcription processes a live stream and returns text as people speak. Text to speech goes the other direction.\n\nA manager with one file who wants the answer \"right away in a single call\" is exactly the fast transcription case. Batch would add a queue and polling. Real-time with the SDK is for live audio, not for a stored file.\n\nMemory aid: fast = one file, one call; batch = a pile of files, come back later; real-time = a live conversation.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/overview"], "ref": ["speech-solutions"]}, {"d": 4, "q": "An app must translate live speech between two people who speak languages that are not known in advance, and the language can change during the conversation. Which capability should you use?", "o": [{"t": "Live Interpreter in the Speech service, which detects the spoken language continuously", "c": true, "e": "It needs no input language and switches languages mid-session."}, {"t": "Custom Translator", "c": false, "e": "It trains a custom text translation system and is not a live speech feature."}, {"t": "Standard speech translation with a fixed source language", "c": false, "e": "The standard API requires you to set the source and target languages."}, {"t": "Translator document translation", "c": false, "e": "It translates files, not live audio."}], "concept": "Speech translation turns spoken audio in one language into text or speech in another. In the standard version you set the source language in advance. If the speakers use unknown languages, or switch languages during the conversation, a fixed source language fails.\n\nLive Interpreter in the Speech service is designed for that case. It continuously detects the spoken language, switches languages when the speaker changes, and translates in real time. It can also render the translation with a voice that resembles the speaker's (personal voice).\n\nTranslator document translation works on files, not live speech. Custom Translator trains a custom text translation model and does not handle audio.\n\nRelated limit: the Speech service translates directly into up to two target languages per request. More targets need a Foundry resource and extra translation costs.\n\nMemory aid: standard speech translation is a translator who was told the languages in advance; Live Interpreter listens and figures them out.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/speech-translation"], "ref": ["speech-solutions"]}, {"d": 4, "q": "A legal team has 3,000 approved bilingual segment pairs and wants an LLM-based translation to follow their terminology within minutes, without training a new neural model. Which option should you use?", "o": [{"t": "Voice Live", "c": false, "e": "It is a real-time voice agent API."}, {"t": "Adaptive custom translation, which builds an index from 5 to 10,000 aligned pairs", "c": true, "e": "It adapts LLM translation style and terminology quickly with a small bilingual set."}, {"t": "Custom Translator trained as an NMT system", "c": false, "e": "This is for a large parallel corpus and needs training and BLEU evaluation."}, {"t": "Language detection", "c": false, "e": "It identifies the source language only."}], "concept": "Azure Translator can be customized in several ways, with different data needs and effort.\n\nAdaptive custom translation builds a small index from 5 to 10,000 aligned bilingual pairs (each up to 500 characters). At translation time, it finds the most similar approved pairs and gives them to a supported LLM as examples, so terminology and style follow your domain. It is ready in minutes because nothing is trained. 3,000 approved pairs fit the range.\n\nCustom Translator trains a full custom NMT (neural machine translation) system, which needs a larger parallel corpus, a training run, a BLEU score review and publishing. It is the right choice for a large corpus and a stable domain, not for a quick start.\n\nLanguage detection only identifies the language. Voice Live is a speech conversation API.\n\nGlossaries are a third tool: fixed term mappings for document translation, ideal for product names.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/overview"], "ref": ["translation"]}, {"d": 4, "q": "A team wants customers to talk to an agent by voice with low latency, natural interruptions (barge-in) and end-of-turn detection, and wants as few moving parts as possible. Which solution fits?", "o": [{"t": "Fast transcription with a custom voice", "c": false, "e": "Fast transcription is a synchronous single-file call."}, {"t": "Document translation with a glossary", "c": false, "e": "It translates files and is unrelated to voice interaction."}, {"t": "Batch transcription feeding a model and a separate synthesis call", "c": false, "e": "Batch is asynchronous, so it cannot support real-time conversation."}, {"t": "Voice Live, a managed WebSocket API that bundles speech to text, a model, text to speech, noise suppression and interruption detection", "c": true, "e": "It is the current path for low-latency voice agents."}], "concept": "A voice agent has several jobs: listen (speech to text), think (a model), speak (text to speech), and manage the conversation (detect when the person has finished, allow interruptions, suppress noise). Building these as separate parts means more integration, more latency and more failure points.\n\nVoice Live is a managed API over WebSocket that bundles all of this: speech recognition, a generative model (including native speech-to-speech models), text to speech, noise suppression and echo cancellation, interruption (barge-in) handling and end-of-turn detection. You stream audio in and receive audio out, with low latency and few moving parts.\n\nBatch transcription feeding a model and a separate synthesis call is slow and not live. Fast transcription with a custom voice still lacks conversation management. Document translation with a glossary is unrelated.\n\nChoose a cascaded design (separate speech to text, model, text to speech) only if you need explicit control of each stage, for example phrase lists or a specific text model.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/voice-live"], "ref": ["speech-solutions"]}, {"d": 5, "q": "A product catalog changes constantly, and search results must reflect an updated price within seconds. Indexers can run at most every five minutes. What should you do?", "o": [{"t": "Run the indexer every second", "c": false, "e": "The minimum schedule interval is five minutes."}, {"t": "Add replicas", "c": false, "e": "Replicas add query and indexing concurrency but do not change the minimum schedule."}, {"t": "Enable the semantic ranker", "c": false, "e": "It changes ranking, not freshness."}, {"t": "Push the updated documents to the index with the SDK or REST API", "c": true, "e": "Indexers pull on a schedule of five minutes at best. Pushing documents is the way to get faster updates."}], "concept": "An Azure AI Search index can be filled in two ways: pull and push.\n\nAn indexer pulls data from a source on a schedule. The shortest schedule interval is five minutes, so changes can take minutes to appear, and running it more often is not allowed. Pushing means your own code sends documents to the index through the SDK or REST API as soon as the data changes. Documents become searchable almost immediately.\n\nFor price changes that must appear within seconds, push the updated documents (for example from the system that changes the price, or from a change feed). Replicas add query capacity and availability, not freshness. The semantic ranker improves ranking, not data freshness.\n\nMany solutions combine both: an indexer for the initial load and bulk updates, and push for urgent changes.\n\nMemory aid: pull = the postman collects mail at intervals; push = you hand-deliver the letter now.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-indexer-overview"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "An indexer pipeline runs OCR on images in PDFs. The skillset executes without errors and the debug session shows OCR text in the enriched tree, but the index fields for that text stay empty. What is missing?", "o": [{"t": "A second indexer reading the same data source", "c": false, "e": "One indexer is enough and a second one does not map the field."}, {"t": "An output field mapping that copies the enriched node to an index field", "c": true, "e": "Output field mappings are required for any enriched content that you want in the index."}, {"t": "A larger search service tier", "c": false, "e": "Capacity is not the issue."}, {"t": "A higher `batchSize` on the OCR skill", "c": false, "e": "Batch size affects throughput, not where results are written."}], "concept": "An indexer runs a skillset on each document. The skills write their results into an enrichment tree, a temporary in-memory structure with nodes such as `/document/normalized_images/*/text`. Nothing in the tree reaches the index automatically.\n\nAn output field mapping tells the indexer which node to copy into which index field. Without it, the skill runs successfully, the debug session shows the OCR text in the tree, and the index field stays empty. That matches the symptom exactly.\n\nFix: add an output field mapping from the OCR output node (for example the merged text) to the target field, and make sure the field exists in the index and is searchable.\n\nA higher `batchSize` changes how many records a skill gets per call. A larger tier changes capacity. A second indexer on the same data source would not map the node either.\n\nMemory aid: the skill puts the dish on the kitchen counter; the output field mapping carries it to the table.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-indexer-overview"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "With integrated vectorization, the index is built with a skillset that embeds chunks using `text-embedding-3-large`. Queries are vectorized at query time by a vectorizer attached through the vector profile. Which rule applies?", "o": [{"t": "The vectorizer must be a custom Web API vectorizer in every case", "c": false, "e": "It must match the embedding skill you use."}, {"t": "The vectorizer must use the same embedding model as the embedding skill", "c": true, "e": "Index and query vectors must come from the same model, and the vectorizer type matches the skill (for example an Azure OpenAI vectorizer for the Azure OpenAI embedding skill)."}, {"t": "The vectorizer can use any model, because vectors are normalized", "c": false, "e": "Vectors from different models are not comparable."}, {"t": "The vectorizer is not needed, because the indexer embeds queries", "c": false, "e": "The indexer handles indexing. Query-time encoding needs a vectorizer or your own query vector."}], "concept": "Integrated vectorization lets Azure AI Search create embeddings itself: a skill embeds chunks at indexing time, and a vectorizer embeds query text at query time. The vectorizer is attached to the vector field through the vector search profile.\n\nVector similarity only works inside one embedding space. The chunk vectors were made by `text-embedding-3-large`, so the query vector must be made by the same model with the same dimensions. Otherwise the numbers are not comparable and quality collapses, with no error message.\n\nThe vectorizer is needed: the indexer only runs at indexing time and does not embed queries. It does not have to be a custom Web API vectorizer; for Azure OpenAI or Foundry models there are built-in kinds.\n\nPractical rule: when you change the embedding model, change the skill, the vectorizer and the field dimensions together, and re-index.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-integrated-vectorization"], "ref": ["azure-ai-search-configuration"]}, {"d": 5, "q": "Your documents are HTML and Markdown pages with clear headings, and users ask questions about specific sections. Which chunking approach is the best fit?", "o": [{"t": "Chunk by section (headings), with enough overlap to keep context for specific facts", "c": true, "e": "Documents with headings suit section-based chunking, and questions about specific facts benefit from larger chunks with overlap."}, {"t": "One chunk per file", "c": false, "e": "One large chunk blurs meaning and may exceed model limits."}, {"t": "No chunking, because the semantic ranker handles long text", "c": false, "e": "The ranker trims long text to 2,048 tokens and does not replace chunking."}, {"t": "Sentence-per-chunk splitting for every document", "c": false, "e": "This creates thousands of tiny chunks that lose context."}], "concept": "Chunking strategy should follow the structure of the content. HTML and Markdown pages have headings, and each section usually covers one topic. Questions about specific sections are best answered by retrieving the matching section.\n\nChunking by headings keeps a section together, so a passage has one clear subject and a meaningful embedding. Add some overlap (or include the heading path in each chunk) so that context such as the page title or parent heading is not lost for specific facts.\n\nSentence-per-chunk is too small: a single sentence rarely carries enough context. One chunk per file is too large for long pages and mixes topics. \"No chunking\" ignores the input limit of embedding models, and the semantic ranker only reorders the top 50 results, it does not process whole long documents.\n\nTune with evaluation: compare retrieval scores for heading-based chunks of different maximum sizes.", "src": ["https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-chunk-documents"], "ref": ["rag-retrieval-and-grounding", "azure-ai-search-configuration"]}, {"d": 5, "q": "A lender receives one PDF containing a loan application, a pay slip and a bank statement. You want Content Understanding to find each document inside the file and route it to a different analyzer. Which configuration fits?", "o": [{"t": "`contentCategories` with `enableSegment: true`, an `analyzerId` per category and an `other` category for pages that match none", "c": true, "e": "Classify and segment finds multiple documents in one file. Without `other`, every page is forced into a listed category."}, {"t": "A video analyzer with one content category", "c": false, "e": "Video segmentation supports a single category and is for video."}, {"t": "Document Intelligence Read model only", "c": false, "e": "Read returns text and handwriting and does not classify or split."}, {"t": "A single `extract` field named `documentType`", "c": false, "e": "One field cannot split the file or route pages to analyzers."}], "concept": "A single PDF can contain several different documents. To extract the right fields from each, the pipeline must first split the file and classify each part, then send each part to a suitable analyzer.\n\nIn Content Understanding this is configured on one analyzer. `enableSegment: true` turns on segmentation, which splits the file into page ranges. `contentCategories` lists the categories (loan application, pay slip, bank statement), each with a description and an `analyzerId` pointing to the analyzer that extracts fields for that category. Add an `other` category for pages that match none, otherwise every page is forced into a listed category. A classifier supports up to 200 categories.\n\nA video analyzer is the wrong modality. A single `extract` field named `documentType` classifies the whole file at best and cannot split it. The Read model returns text only.\n\nWalkthrough: pages 1-2 become a loan application and use the loan analyzer; page 3 becomes a pay slip; the rest becomes a bank statement.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/classifier"], "ref": ["content-understanding-and-document-intelligence"]}, {"d": 5, "q": "A team needs tables, selection marks, titles and section headings from forms in addition to the text, and wants Markdown that can be chunked by section for RAG. Which Document Intelligence model fits?", "o": [{"t": "Read", "c": false, "e": "Read extracts text, handwriting, words, lines and languages, without table and structure analysis."}, {"t": "Layout", "c": true, "e": "Layout adds tables, selection marks, paragraphs, titles and headings to Read and offers Markdown output suited to chunking."}, {"t": "Prebuilt receipt", "c": false, "e": "It extracts receipt fields only."}, {"t": "Custom model without labeled data", "c": false, "e": "A custom model needs labeled examples."}], "concept": "Document Intelligence has general-purpose models and specialized ones.\n\nRead extracts text (printed and handwritten) with language information, and nothing about structure beyond lines and words. Layout goes further: it returns text, tables, selection marks (checkboxes), titles and section headings, and can output Markdown. That Markdown keeps headings and tables, so you can chunk the document by section for RAG. Prebuilt models such as receipt return specific fields for one document type. A custom model needs labeled training data.\n\nThe requirement lists tables, selection marks, headings and Markdown for chunking by section. That is the Layout model.\n\nRead would give text but lose tables and sections. Prebuilt receipt is for receipts. A custom model without labeled data is not possible.\n\nMemory aid: Read = reads the words; Layout = reads the words and understands the page.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/prebuilt/layout"], "ref": ["content-understanding-and-document-intelligence"]}]};</script>
