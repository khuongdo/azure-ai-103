<div id="app"></div>
<script>window.MOCK_EXAM = {"id": "bank-d1", "title": "Question bank: Plan and manage an Azure AI solution", "shortTitle": "Domain 1 bank", "description": "140 questions from mock exams 1 to 10, all in the domain \"Plan and manage an Azure AI solution\" (25-30% of the exam).", "defaultMinutes": 336, "domains": [{"id": 1, "name": "Plan and manage an Azure AI solution", "weight": "25-30%", "count": 140}], "questions": [{"d": 1, "q": "An executive asks why the company's resilience design for model deployments uses Data Zone and Global types instead of plain Standard. Which answer is correct?", "o": [{"t": "Standard deployments replicate to every region automatically", "c": false, "e": "They are single-region."}, {"t": "Standard deployments are single-region with no availability-zone support, while Data Zone and Global types spread processing over more capacity", "c": true, "e": "Resilience also needs a gateway and spillover, because Foundry does not fail deployments over by itself."}, {"t": "Global types guarantee that data at rest is stored in any region", "c": false, "e": "Data at rest stays in the designated geography. Only inference processing location differs."}, {"t": "Data Zone types remove the need for any gateway", "c": false, "e": "Foundry does not load-balance deployments, so a gateway is still recommended."}], "concept": "Resilience depends on where a deployment runs. A Standard deployment is tied to a single region and does not support availability zones. If that region has a problem, capacity runs out, or traffic spikes, the deployment has nowhere to move to.\n\nData Zone and Global deployment types route requests across more capacity: Data Zone inside a geography such as the EU or the US, Global over all supported regions. That adds headroom and availability and lowers the chance of throttling. Global does not mean storage everywhere: data at rest is tied to the resource location. Standard does not replicate to every region automatically.\n\nEven with those types, you still need a gateway for health checks, failover to another deployment and circuit breaking, because Foundry does not load-balance or fail over deployments for you. So Data Zone does not remove the need for a gateway.\n\nMemory aid: Standard is one road; Data Zone and Global are a road network.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types"], "ref": ["capacity-cost-and-throttling", "platform-network-and-reliability"]}, {"d": 1, "q": "A platform engineer runs `az role assignment create` to give the Foundry account's managed identity the \"Cosmos DB Built-in Data Reader\" role on a Cosmos DB account. The command fails to grant data access. What is the correct approach?", "o": [{"t": "Use `az cosmosdb sql role assignment create`, because it is a Cosmos DB data-plane role, not an Azure RBAC role", "c": true, "e": "Cosmos DB data-plane roles are assigned with the Cosmos CLI."}, {"t": "Enable local key authentication instead", "c": false, "e": "Keys are not the recommended approach and bypass role control."}, {"t": "Retry `az role assignment create` with the Owner role", "c": false, "e": "The data-plane role is not an Azure RBAC role, so Owner does not apply."}, {"t": "Assign the role to the developer, not to the identity", "c": false, "e": "The runtime identity needs the data-plane role."}], "concept": "Azure has two layers of access control. The control plane (Azure RBAC) manages resources: creating or deleting an account. The data plane governs reading and writing the data. Cosmos DB for NoSQL has its own data-plane role system, and its roles such as \"Cosmos DB Built-in Data Reader\" are assigned with `az cosmosdb sql role assignment create`, not with `az role assignment create`.\n\nFor bring-your-own resources, two identities are involved. The person or pipeline that provisions needs roles such as Storage Blob Data Contributor and Cosmos DB Operator. The Foundry account's or project's managed identity needs data-plane roles at runtime. A very common failure is granting only the first set.\n\nSymptom: provisioning succeeds, but agents fail when they try to read or write data.\n\nCheck which layer the role belongs to before choosing the command.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/use-your-own-resources"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "Microsoft's Responsible AI approach in Foundry is organized into Discover, Protect and Govern. A team runs a red team and risk and safety evaluators against its HR assistant before launch. Which activity does this belong to?", "o": [{"t": "None, because evaluation is separate from responsible AI", "c": false, "e": "Evaluation is a core part of the framework, not separate from it."}, {"t": "Govern, because it assigns accountability and approvals", "c": false, "e": "Govern is about policies, ownership, approvals and audit logs."}, {"t": "Protect, because it blocks harmful content at runtime", "c": false, "e": "Protect uses runtime controls such as guardrails and Prompt Shields."}, {"t": "Discover, because it finds what can go wrong before users do", "c": true, "e": "Red teaming and risk evaluators are Discover activities."}], "concept": "The three activities answer three questions. Discover asks: what can go wrong here? Protect asks: how do we stop it at runtime? Govern asks: who is accountable, and how do we prove it?\n\nIn Foundry, Discover contains red teaming, risk and safety evaluators, and Defender for Cloud risks and alerts. Protect contains guardrails, content filters, Prompt Shields, grounding and tool limits. Govern contains policies, approvals, audit logs, ownership and an incident process.\n\nThe cycle repeats for the life of the system. Production feedback and monitoring reveal new risks, which go back to Discover.\n\nA frequent mistake is treating the filter as the whole program: filtering without testing first (Protect without Discover) or without anyone owning an incident (no Govern).\n\nMemory aid: Discover finds the holes, Protect plugs them, Govern decides who is responsible.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/responsible-use-of-ai-overview", "https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators"], "ref": ["responsible-ai-governance"]}, {"d": 1, "q": "A team moves to a network-secured setup and wants to use the File Search tool with files stored in Blob Storage, and the Code Interpreter tool with file upload. Which statement about tool support in a private setup is correct?", "o": [{"t": "File Search with Blob Storage is the only supported option in private setups", "c": false, "e": "It is listed as not supported."}, {"t": "All tools work identically in private and public setups", "c": false, "e": "Learn lists specific limits for private setups."}, {"t": "Bing grounding works in every region in a private setup", "c": false, "e": "It is limited to the listed regions."}, {"t": "Blob Storage files with the File Search tool are not supported, and Code Interpreter works without file upload and download unless a container is pre-created through the SDK", "c": true, "e": "These are the documented limits in a private setup."}], "concept": "Network isolation changes what some tools can do. In the network-secured standard setup, the agent runtime is injected into a delegated subnet, data stores are reached through private endpoints, and traffic stays off the public internet.\n\nLearn lists limits for tools in that setup. Files in Blob Storage used with the File Search tool are not supported. Code Interpreter works without file upload and download unless you pre-create a container through the SDK. Bing grounding is limited to listed regions.\n\nSo a design review must check each planned tool against the private-setup limits before committing to the architecture. A tool that works in the playground of a public project may fail in a locked-down one.\n\nRelated rules: the Foundry resource must be in the same region as the virtual network, and the agent subnet is dedicated to one Foundry resource.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A team has not selected a model yet and must choose between two candidates for a new assistant. Which evaluation stage and tools apply?", "o": [{"t": "Pre-production: the AI red teaming agent only", "c": false, "e": "Red teaming tests attacks on a built system and does not compare models on quality."}, {"t": "Base model selection: use Foundry benchmarks and compare models, then run candidates on your own test prompts", "c": true, "e": "This is stage 1, which answers which model fits. Benchmarks are averages, so your own data decides."}, {"t": "Scheduled evaluation to detect drift", "c": false, "e": "Drift detection comes after deployment."}, {"t": "Post-production: continuous evaluation of sampled traffic", "c": false, "e": "There is no production traffic yet."}], "concept": "AI evaluation happens at three stages, and each stage has its own question and tools.\n\nBase model selection comes first: you have not chosen a model, so you compare candidates. Use the Foundry model benchmarks and compare models, then run the finalists on your own test prompts, because public benchmarks do not reflect your data. Pre-production evaluation tests the assembled solution: evaluators on a test dataset, red teaming, and release gates. Post-production monitoring watches real traffic: continuous evaluation of samples, scheduled evaluation for drift, alerts, tracing.\n\nThe team has not selected a model, so it is at the first stage. Continuous evaluation and drift detection need a deployed system. The red teaming agent tests an application or model for attacks; it does not choose between models for quality or cost.\n\nMemory aid: choose the engine, test the car, monitor the road.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/observability"], "ref": ["observability-and-agent-lifecycle", "model-and-service-selection"]}, {"d": 1, "q": "After an evaluation run on 1,500 agent conversations, 90 fail. The team wants to understand which kinds of failures are most common instead of reading all 90 one by one. Which capability helps?", "o": [{"t": "Deleting the 90 conversations", "c": false, "e": "This removes the evidence and the future test cases."}, {"t": "Cluster analysis of evaluation results, which groups failures by pattern", "c": true, "e": "Grouping shows the dominant failure types for error analysis."}, {"t": "Disabling the judge model", "c": false, "e": "Without a judge there would be no scores."}, {"t": "Raising the pass threshold to 5", "c": false, "e": "This changes how many cases fail, not why."}], "concept": "Evaluation tells you that something failed. Error analysis tells you why. When many conversations fail, reading them one by one is slow and biased toward the first few. Foundry evaluation results can be analyzed with cluster analysis, which groups failures by pattern, for example \"the tool is never called\", \"wrong date format\" or \"policy refusal\".\n\nUse the clusters in a loop. Pick the largest cluster, open example traces to find the cause (tool description, instruction, retrieval, argument format), fix it in a new version, and re-run the evaluation against the baseline. Add representative failures to the dataset so they stay fixed.\n\nPair this with tracing (what happened in one request), process evaluators (which step failed) and system evaluators (what the outcome was).\n\nVersion the dataset with the code and keep the clusters in the release notes.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/observability"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 1, "q": "A team wants to find prompt-injection and jailbreak weaknesses in its agent that nobody has thought of, before release and again every month afterward. What should they use?", "o": [{"t": "The AI Red Teaming Agent (PyRIT-based), run before release and on a schedule", "c": true, "e": "It generates adversarial attacks and scores the target by risk category. Attackers adapt, so scheduled runs after release matter too."}, {"t": "A fixed evaluation dataset of known questions, run once", "c": false, "e": "It only replays known cases and cannot find new attack paths."}, {"t": "A diagnostic setting on the resource", "c": false, "e": "Logs record what happened. They do not probe for weaknesses."}, {"t": "A higher guardrail threshold on the output", "c": false, "e": "This reduces what is shown but does not discover weaknesses."}], "concept": "Evaluation with a fixed dataset only finds problems that someone already imagined. Attackers are creative, so you also need a tool that invents new attacks.\n\nThe AI Red Teaming Agent is built on PyRIT, Microsoft's open-source framework for red teaming generative AI. It generates adversarial prompts across risk categories, transforms them with attack strategies (for example encodings, character flipping or multi-turn pressure), sends them to your agent or model, and scores the answers with safety evaluators. The result is an attack success rate per category. Run it before release and then on a schedule, for example monthly, because the agent, the model and the attacks change. Add human red teaming for creative, domain-specific tests.\n\nA fixed dataset run once is a snapshot. A higher output threshold does not find weaknesses. A diagnostic setting only records logs.\n\nMemory aid: a fixed test is a fire drill; a red team is a friendly arsonist.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/observability"], "ref": ["agent-safety-and-identity", "responsible-ai-governance"]}, {"d": 1, "q": "The FinOps team wants to reduce the cost footprint of a Foundry agent workload without hurting quality. Which TWO actions fit?", "o": [{"t": "Delete unused agents and stale conversations on a schedule, and keep only the tools the task needs", "c": true, "e": "Stale data keeps using storage and RUs, and every connected tool costs tokens and can be chosen wrongly."}, {"t": "Choose the largest model for every task", "c": false, "e": "A smaller model lowers price and latency when evaluations pass."}, {"t": "Cap output with `max_output_tokens` where you run the orchestration, and keep resources in one region", "c": true, "e": "Output caps bound tokens per response, and one region avoids cross-region bandwidth charges."}, {"t": "Allow unrestricted playground use in production", "c": false, "e": "This causes unplanned spend."}, {"t": "Scale PTUs up and down with each day's traffic curve", "c": false, "e": "Capacity may not return, and hourly billing at high use costs more than a reservation."}], "concept": "Cost control for agents means paying for what is useful. Two groups of actions reduce the footprint without lowering quality.\n\nHousekeeping: unused agents, stale conversations, vector stores and files cost storage and clutter, and old data is also a privacy risk. Delete them on a schedule. Give each agent only the tools it needs: every tool definition adds tokens to the prompt and chances of wrong tool choice.\n\nLimits and placement: cap output with `max_output_tokens` where you run the orchestration, so a runaway answer cannot burn tokens, and keep resources in one region to avoid cross-region data transfer and latency.\n\nScaling PTUs with each day's traffic curve is not practical, since provisioned capacity is a commitment billed hourly. Unrestricted playground use in production lets people spend without governance. The largest model for every task wastes money where a small one passes evaluation.\n\nMeasure cost per conversation and per successful outcome.", "src": ["https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "An agent in production must survive a single availability-zone failure. Which set of dependency settings fits the guidance?", "o": [{"t": "Zone-redundant Cosmos DB, ZRS or GZRS storage and at least three Azure AI Search replicas", "c": true, "e": "These are the zone-resilient settings for the three dependencies of the standard agent setup."}, {"t": "One Cosmos DB region, locally redundant storage and one search replica", "c": false, "e": "Each is a single point of failure for the zone."}, {"t": "Public network access enabled", "c": false, "e": "Network exposure does not provide zone resilience."}, {"t": "Basic agent setup with platform storage", "c": false, "e": "Basic mode has almost no recovery options."}], "concept": "Availability zones are separate datacenters inside a region. A zone failure should not take the agent down, so every dependency must be zone-aware.\n\nThe guidance for Agent Service dependencies: Azure Cosmos DB with zone redundancy (data and requests are spread across zones), Azure Storage with ZRS or GZRS (zone-redundant copies, and GZRS also adds a secondary region), and Azure AI Search with at least three replicas (replicas are spread over zones for query availability, with a service tier that supports zones).\n\nOne Cosmos DB region, locally redundant storage and one search replica are all single points of failure in one datacenter. The basic setup with platform storage gives you no control over redundancy. Public network access is a network setting, not a resilience one.\n\nRemember that zone redundancy is not a backup. You still need continuous backup and delete locks to recover from deletion or corruption.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/high-availability-resiliency"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A security review finds a Foundry project that was created in the portal without private networking, while the approved design requires private endpoints. How do you prevent this in the future?", "o": [{"t": "Disable the network rules so that every project behaves the same", "c": false, "e": "This removes isolation instead of enforcing it."}, {"t": "Ask developers to be careful when using the portal", "c": false, "e": "A process request is not an enforced control."}, {"t": "Create resources, projects, agents and connections from infrastructure as code, treat project creation as privileged, and enforce rules with Azure Policy", "c": true, "e": "Portal-created projects do not inherit network controls, and portal actions can bypass constraints."}, {"t": "Give every developer the Owner role so they can fix settings", "c": false, "e": "Broad rights make unreviewed changes more likely."}], "concept": "Governance works best when the setup is repeatable and enforced. Infrastructure as code (IaC) describes resources, projects, agents and connections in files that are reviewed and deployed by a pipeline. Learn gives reasons: portal actions run under a service identity and can bypass constraints, portal-created projects do not inherit network controls, and untracked portal edits cannot be reproduced.\n\nSo treat project creation as a privileged action, and combine IaC with Azure Policy. Policy can require private endpoints and network security groups, customer-managed keys and allowed regions, disable local (key) authentication, and restrict deployment types by denying `sku.name` on deployments.\n\nFor a locked-down environment, run the deployment pipeline from a self-hosted runner inside the network.\n\nRule: the portal is for exploring; code and policy are for production.", "src": ["https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat", "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks"], "ref": ["platform-network-and-reliability", "cicd-for-foundry-projects"]}, {"d": 1, "q": "A finance agent calls tools that return customer records. Reviewers worry that the agent may expose sensitive data in its replies or intermediate tool calls, and that judging only the final answer is not enough. Which evaluator (Preview) is meant for agents in this situation?", "o": [{"t": "Tool Output Utilization", "c": false, "e": "It checks whether the agent used the tool result correctly."}, {"t": "Task Completion", "c": false, "e": "It checks whether the task finished with a usable deliverable."}, {"t": "Fluency", "c": false, "e": "It scores the language quality of text."}, {"t": "Sensitive data leakage", "c": true, "e": "It checks whether an agent exposes sensitive data."}], "concept": "Agents add risks that plain chat does not have. They call tools, read third-party content and act. Two risk evaluators are made for agents and are in Preview: Prohibited actions (agent actions outside policy) and Sensitive data leakage (the agent exposing sensitive data).\n\nA common mistake is judging only the final answer. An agent can leak data in an intermediate tool call and then give a clean-looking final answer. Evaluating the full set of messages, including tool calls and results, finds this.\n\nCombine the evaluator with runtime controls: tool call controls in the guardrail look at what the agent proposes to send to a tool, least-privilege identities limit what it can reach, and approvals protect high-impact actions. Add the failing cases to the test suite so the gate stays strict.\n\nUse Preview features with care and re-check their status before relying on them.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators"], "ref": ["responsible-ai-governance", "agent-safety-and-identity"]}, {"d": 1, "q": "A cloud governance team wants to prevent developers from creating expensive deployment types in the Foundry resources of the production subscription. Which mechanism should they use?", "o": [{"t": "Azure Policy that denies `sku.name` values on `Microsoft.CognitiveServices/accounts/deployments`", "c": true, "e": "Policy restricts deployment types for every resource in scope."}, {"t": "A content filter threshold", "c": false, "e": "Content filters control content, not deployment types."}, {"t": "A smaller `max_output_tokens`", "c": false, "e": "This caps output length per call and does not stop expensive deployments."}, {"t": "A written guideline in the team wiki", "c": false, "e": "It is not enforced."}], "concept": "Guidelines can be ignored; policy can be enforced. Azure Policy evaluates resources against rules and can deny, audit or modify them, at the scope of a management group, subscription or resource group.\n\nDeployments of models are resources of type `Microsoft.CognitiveServices/accounts/deployments`, and each has a property `sku.name` that holds the deployment type (for example Standard, GlobalStandard or ProvisionedManaged). A policy that denies certain `sku.name` values stops anyone from creating, say, an expensive provisioned deployment in the production subscription, with an error at creation time.\n\nA wiki page is advice. A content filter threshold concerns harmful content, not cost. `max_output_tokens` limits the length of one answer and is unrelated to the deployment type.\n\nUse the same mechanism for other rules: deny public network access, require private endpoints, disable local (key) authentication, or require tags.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types"], "ref": ["capacity-cost-and-throttling", "platform-network-and-reliability"]}, {"d": 1, "q": "You run a safety evaluation with 300 adversarial prompts. The Violence evaluator uses the default threshold of 3, and a case passes when its score is less than or equal to the threshold. Nine outputs score 4 or higher, and three outputs score exactly 3. The release rule says the defect rate must be 2% or lower. What is the result?", "o": [{"t": "The defect rate is 3% (9 of 300), so the release gate fails", "c": true, "e": "A defect is a score above the threshold. Scores of exactly 3 pass, so only the nine outputs at 4 or higher count: 9 / 300 = 3%."}, {"t": "The defect rate is 1% (3 of 300), so the release gate passes", "c": false, "e": "This counts only the outputs at the threshold and ignores the nine that exceed it."}, {"t": "The defect rate is 4% (12 of 300), so the release gate fails", "c": false, "e": "This wrongly counts the three outputs with score 3. A score equal to the threshold passes."}, {"t": "A defect rate cannot be computed without human labeling", "c": false, "e": "The evaluator already returns a score per case, so the rate is computed from those scores and the threshold."}], "concept": "A defect rate is the share of test cases that fail the quality bar: defects divided by total cases.\n\nSafety evaluators for harm categories (Violence, Sexual, Self-harm, Hate and unfairness) return a severity score from 0 to 7. The default threshold is 3, and a case passes when its score is less than or equal to the threshold. So a score of exactly 3 still passes, and only scores of 4 or higher are defects.\n\nHere: 9 outputs scored 4 or higher, so 9 defects out of 300 cases. 9 / 300 = 0.03, which is 3%. The three outputs at exactly 3 pass and must not be counted. The release rule allows 2% or lower, so 3% fails the gate.\n\nThe most common mistake is to count the boundary value as a failure (12 of 300 = 4%). Always read whether the rule says \"less than\" or \"less than or equal to\". Evaluator output can be computed automatically, so no human labeling is needed to get the number.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators"], "ref": ["responsible-ai-governance"]}, {"d": 1, "q": "An agent passed all pre-release evaluations. Three months later users complain about worse answers, although no code or prompt changed. Which practice would have detected this earlier?", "o": [{"t": "Increasing the model's temperature", "c": false, "e": "Randomness does not detect problems."}, {"t": "Continuous evaluation of sampled production traffic and scheduled evaluation against a test set, with Azure Monitor alerts", "c": true, "e": "Quality can drift even when nothing changed, for example when data or the model behavior changes. Ongoing evaluation and alerts catch it."}, {"t": "Running the pre-release evaluation again manually once a year", "c": false, "e": "The drift went unnoticed for months. A yearly check is too slow."}, {"t": "Turning off sampling to reduce cost", "c": false, "e": "Without sampling there is nothing to evaluate in production."}], "concept": "Quality can fall without any code change: source documents become outdated, user questions shift, or a model version changes. This is called drift. Pre-release testing proves quality at one point in time and cannot see later changes.\n\nPost-production monitoring has several layers. Continuous evaluation scores a sample of real production traffic all the time. Scheduled evaluation runs a fixed test set on a schedule (for example weekly), so results are comparable over time. Scheduled red teaming repeats attack tests. Azure Monitor alerts fire when a score crosses a threshold, so a person is told before users complain.\n\nAn annual manual run is far too rare. Temperature has no relationship to monitoring. Turning off sampling removes the data you need.\n\nExample: the weekly golden-set run shows groundedness falling from 4.6 to 4.2 after the knowledge base was updated; the alert opens a ticket in week one instead of month three.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/observability"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 1, "q": "A search team wants to track relevance over time as it changes chunk size and the number of results returned. It has human-labeled relevant documents for 300 test queries. Which evaluator supports this kind of comparison?", "o": [{"t": "Groundedness, which scores ranking quality", "c": false, "e": "Groundedness checks that answers stay inside the context."}, {"t": "Task Navigation Efficiency", "c": false, "e": "It compares agent tool steps with an expected sequence."}, {"t": "Document Retrieval, which compares ranking with human labels using metrics such as Fidelity, NDCG, XDCG, Max Relevance and Holes", "c": true, "e": "It needs ground-truth labels and suits parameter sweeps."}, {"t": "Relevance, which needs no labels and measures retrieval ranking", "c": false, "e": "Relevance scores whether an answer addresses the question."}], "concept": "Relevance monitoring for search asks whether the right documents are ranked high. Foundry evaluators separate this from answer quality. The Retrieval evaluator asks whether the retrieved chunks are relevant to the query and needs no ground truth. The Document Retrieval evaluator compares the ranking with human labels and reports metrics such as Fidelity, NDCG, XDCG, Max Relevance and Holes. It requires ground-truth labels and is meant for parameter sweeps: generate retrieval results for several settings (vector or semantic, `top_k`, chunk size), score each setting, and keep the best.\n\nGroundedness measures precision of the answer against the context, Response Completeness measures recall, and Relevance measures whether the answer addresses the question.\n\nRun the same labeled queries regularly, and add new failures from production to the set.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"], "ref": ["rag-retrieval-and-grounding", "observability-and-agent-lifecycle"]}, {"d": 1, "q": "A grocery chain lets an agent reorder low-risk stock automatically. Volume is high and each action is cheap to undo. Managers do not want to approve each action but want to be able to step in. Which oversight pattern fits?", "o": [{"t": "Human on the loop: monitor and intervene when needed", "c": true, "e": "This fits low-risk, high-volume actions."}, {"t": "Human after the fact only, with yearly audits", "c": false, "e": "A yearly audit is too slow for operational issues."}, {"t": "Human in the loop: approve every action before it runs", "c": false, "e": "This suits hard-to-reverse, high-impact actions and would not scale here."}, {"t": "No oversight at all", "c": false, "e": "Even low-risk automation needs monitoring and an escalation path."}], "concept": "Human oversight is not one setting. There are three patterns. Human in the loop means a person approves before the action runs; use it for hard-to-reverse or high-impact actions such as payments, access grants and messages to customers. Human on the loop means a person monitors and can intervene; use it when actions are low risk but volume is high. Human after the fact means periodic audits of samples; use it for low-risk content.\n\nWhatever the pattern, record the approver, the time and the evidence. Measure how often humans change or reject the system's proposals: a high change rate says autonomy should not increase yet.\n\nControls in Foundry support this: approval flows for risky tools, tracing for audit, alerts when outputs fail quality thresholds, and constraints and tool-access controls to limit what the agent can do.\n\nChoose the pattern by the cost of a mistake and the volume of actions.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/responsible-use-of-ai-overview", "https://learn.microsoft.com/en-us/azure/foundry/agents/overview"], "ref": ["responsible-ai-governance"]}, {"d": 1, "q": "A team decommissions a test environment and tries to delete its virtual network. The delete fails because the agent subnet still has a service association link. What is the correct order of cleanup?", "o": [{"t": "Delete the virtual network first and the Foundry resource afterward", "c": false, "e": "The subnet cannot be deleted while the link exists."}, {"t": "Remove the private DNS zones and retry", "c": false, "e": "DNS zones are unrelated to the association link."}, {"t": "Purge the Foundry resource first, and then delete the virtual network", "c": true, "e": "Otherwise the subnet keeps the service association link."}, {"t": "Delete only the Cosmos DB account", "c": false, "e": "The link belongs to the Foundry resource, not Cosmos DB."}], "concept": "When agent runtime is injected into a delegated subnet, the Foundry resource creates a service association link on that subnet. Azure will not delete a subnet that still has such a link.\n\nThe documented cleanup order is: purge the Foundry resource before deleting the virtual network. Deleting a Foundry resource normally soft-deletes it, so a purge is needed to release the subnet.\n\nRemember related rules for the subnet: it is dedicated to one Foundry resource (it cannot be shared), delegated to `Microsoft.App/environments`, uses a private address range with a recommended size of /24, and must not overlap with peered networks.\n\nWhen you design infrastructure as code for temporary environments, include the purge step in the teardown script so repeated create-and-destroy cycles do not fail.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A Spanish-language and Vietnamese-language community app relies on Azure AI Content Safety text classifiers. The team asks how reliable they are in these languages. What is the correct guidance?", "o": [{"t": "They work equally well in every language without testing", "c": false, "e": "Coverage outside the eight languages is less reliable."}, {"t": "They only work in English", "c": false, "e": "Eight languages are listed."}, {"t": "The classifiers are trained and tested on eight languages (English, German, Japanese, Spanish, French, Italian, Portuguese and Chinese) and may work in others with less reliability, so test your own languages", "c": true, "e": "Spanish is covered; Vietnamese needs your own testing."}, {"t": "They cannot be used at all outside the United States", "c": false, "e": "Region is not the limit; language coverage is."}], "concept": "Content Safety classifies text and images into four categories: hate and fairness, sexual, violence and self-harm. The text classifiers are trained and tested on English, German, Japanese, Spanish, French, Italian, Portuguese and Chinese. They can work in other languages, but with less reliability.\n\nFor a product with other languages (here Vietnamese), do not assume: build a small test set with real and adversarial examples in that language, count false blocks and misses at your chosen thresholds, and adjust thresholds by category. Consider human review for borderline cases.\n\nRemember also that severity scales differ: text uses the full 0 to 7 scale (it can be trimmed to 0, 2, 4, 6), images use a trimmed scale of 0, 2, 4, 6, and image with text from a multimodal model uses the full 0 to 7.\n\nRe-test after every change and keep the results.", "src": ["https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/harm-categories"], "ref": ["responsible-ai-governance"]}, {"d": 1, "q": "A reasoning-model call needs a long answer. A developer wants to know what budget to start with so that the answer is not cut by reasoning. What does Learn suggest?", "o": [{"t": "Exactly the expected visible answer length", "c": false, "e": "Hidden reasoning tokens are extra."}, {"t": "Reserve at least 25,000 tokens for reasoning plus output at first, then tune down from measured `reasoning_tokens`", "c": true, "e": "The cap covers reasoning and visible output together, and logging the 95th percentile of reasoning tokens tells you the cap to set."}, {"t": "No cap at all in production", "c": false, "e": "Caps bound cost and should be set from measurements."}, {"t": "256 tokens, because answers are short", "c": false, "e": "Reasoning would consume the cap."}], "concept": "Reasoning models spend tokens on thinking before they write. Both thinking and the visible answer count toward the output token cap. If the cap is too small, the model may use it all on reasoning and return an incomplete or empty answer.\n\nLearn suggests starting with a generous budget: at least 25,000 tokens reserved for reasoning plus output. Then run real requests, read `reasoning_tokens` in the usage details, and tune the cap down to a level with comfortable headroom above what you actually see.\n\nA cap of 256 tokens is sized for visible short answers and would be consumed by reasoning. A cap equal to the expected visible answer length ignores the hidden part. No cap in production risks very large bills and long waits if a request goes wrong.\n\nAlso control the amount of thinking with `reasoning_effort`: lower effort uses fewer tokens and is faster.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning"], "ref": ["model-and-service-selection"]}, {"d": 1, "q": "A support agent proposes refunds that humans approve. Over a month, humans change or reject 40% of the proposals. The product manager wants to let the agent approve refunds without human review. What does the guidance suggest?", "o": [{"t": "Remove the approval and monitor only the cost", "c": false, "e": "Cost does not measure correctness."}, {"t": "Ask the model to rate its own proposals instead", "c": false, "e": "Self-rating is not an independent measure."}, {"t": "A high change rate means autonomy should not increase yet; keep human approval and improve the agent first", "c": true, "e": "Measuring how often humans change or reject proposals shows whether the system is ready for more autonomy."}, {"t": "Increase autonomy because humans are slow", "c": false, "e": "The data shows that the proposals are often wrong."}], "concept": "Autonomy should be earned by measured accuracy. When humans review an agent's proposals, the change or rejection rate is a direct measure of how often the agent is wrong or unacceptable. If humans change or reject 40% of refund proposals, the agent is not ready: removing the human would let four of ten refunds be wrong.\n\nThe guidance is to keep approval and improve the agent first: analyze the changed cases, fix instructions, tools or data, add them to the golden dataset, and measure again. Use an autonomy ladder: start with approval for everything risky, then relax step by step as measured accuracy and cost of errors support it, perhaps starting with small amounts only.\n\n\"Humans are slow\" is not an argument for risk. Monitoring only cost ignores correctness. Asking the model to rate its own proposals is not an independent check.\n\nMemory aid: a trainee driver gets the solo licence when the instructor stops grabbing the wheel.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/responsible-use-of-ai-overview"], "ref": ["responsible-ai-governance"]}, {"d": 1, "q": "You create private endpoints for a Foundry resource and an Azure AI Search service and disable public access. From a VM in the virtual network, `nslookup` still returns public IP addresses for both service names and calls fail. What is the most likely cause?", "o": [{"t": "The network security group blocks outbound port 443", "c": false, "e": "A blocked port causes timeouts. It does not change the IP address that a name resolves to."}, {"t": "The agent subnet is not delegated to `Microsoft.App/environments`", "c": false, "e": "Delegation affects provisioning of the agent runtime subnet. It does not change how names resolve."}, {"t": "The private DNS zones are not linked to the virtual network (or a custom DNS server does not forward to 168.63.129.16)", "c": true, "e": "Private endpoints only work when names resolve to the private IPs. That needs the `privatelink` DNS zones linked to the VNet, or a forwarder to the Azure DNS virtual server."}, {"t": "Key-based authentication is disabled on the resource", "c": false, "e": "That would produce 401 or 403 errors after a successful connection, not wrong DNS answers."}], "concept": "A private endpoint only works if the name resolves to the private IP. Name resolution is DNS, and this is the most common reason private networking \"does not work\".\n\nWhen you create a private endpoint, Azure expects a private DNS zone for that service, for example `privatelink.cognitiveservices.azure.com` or `privatelink.search.windows.net`. The zone holds an A record that maps the service name to the private IP. The zone must be linked to the virtual network, otherwise machines in that network keep asking the normal public DNS and get the public IP back. If your network uses a custom DNS server, it must forward queries to Azure DNS at 168.63.129.16 so that private zones are consulted.\n\nHow to check: run `nslookup` from a machine inside the network. A private IP (for example 10.x.x.x) is good. A public IP means the zone link or the forwarder is missing.\n\nThe other options are real settings but do not explain a public answer from `nslookup`: delegation is for the agent subnet, key-based auth is about credentials, and an NSG block would not change DNS answers.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A support agent passed all pre-release evaluations. The team wants to detect quality drift without waiting for user complaints, using a fixed set of test questions with known good answers. Which approach fits?", "o": [{"t": "Run the evaluation once before release and never again", "c": false, "e": "The model, data and traffic change, so a single run cannot detect drift."}, {"t": "Increase the model's temperature", "c": false, "e": "This changes randomness and does not detect drift."}, {"t": "Turn off tracing to reduce noise", "c": false, "e": "Tracing helps debugging; it does not measure drift and turning it off removes evidence."}, {"t": "Run a scheduled evaluation with the fixed test set, and add alerts on the scores", "c": true, "e": "A repeatable test set run on a schedule shows when quality moves away from the baseline."}], "concept": "Quality can change even when nobody changes the code: a model version moves, the data in the knowledge base changes, or users start asking new questions. This is called drift.\n\nFoundry describes three evaluation stages. Before choosing a model you use benchmarks. Before release you use your own dataset with quality and safety evaluators plus red teaming. After release you use continuous evaluation of sampled production traffic, and scheduled evaluation that re-runs a fixed test set to detect drift, together with scheduled red teaming and Azure Monitor alerts.\n\nIn this question the team has a fixed set of questions with known answers, which is exactly what scheduled evaluation needs. Continuous evaluation, by contrast, scores real traffic that has no known answer.\n\nMemory aid: fixed set on a schedule finds drift; sampled traffic finds real-world surprises.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/observability"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 1, "q": "A regulated company wants to encrypt Foundry data with a key it controls in Azure Key Vault, using a managed identity of the Foundry resource. Which statement is correct?", "o": [{"t": "Hosted agents are fully covered, including the `$HOME` filesystem", "c": false, "e": "The `$HOME` filesystem is on platform-managed storage that is not encrypted with CMK."}, {"t": "CMK removes the need for a managed identity", "c": false, "e": "The managed identity is how the resource accesses the key."}, {"t": "Grant the managed identity permission to use the key (for Key Vault with Azure RBAC, the Key Vault Crypto User role), then enable customer-managed keys; prompt agents support CMK only with bring-your-own storage", "c": true, "e": "Customer-managed keys use Key Vault or Managed HSM. For prompt agents you configure CMK on your own Cosmos DB, Storage and AI Search."}, {"t": "Foundry encrypts with your key automatically when you create the key", "c": false, "e": "The resource must be granted access and CMK must be enabled."}], "concept": "Encryption at rest is on by default with Microsoft-managed keys. A regulated company may require customer-managed keys (CMK): keys it controls in Azure Key Vault or Managed HSM.\n\nThe setup has two parts. First, the identity that Foundry uses (a managed identity of the resource) must be allowed to use the key. With a Key Vault that uses Azure RBAC, the built-in role Key Vault Crypto User allows wrap and unwrap operations. Then you enable customer-managed keys on the resource and select the key.\n\nCMK does not happen automatically when you create a key, and it does not remove the need for a managed identity; the identity is how Foundry reaches the key. Coverage has limits: for prompt agents, CMK applies when you use bring-your-own storage (your own Cosmos DB, Storage and AI Search), and hosted agents do not cover every storage area such as the `$HOME` filesystem.\n\nCheck the current scope in the documentation before promising full coverage to auditors.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/customer-managed-keys"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A single Foundry resource hosts the development, test and production workloads of an agent platform. A load test in development uses up the quota and production calls get 429 errors. What design change is recommended?", "o": [{"t": "Give production the Owner role on the development project", "c": false, "e": "Roles do not separate quota."}, {"t": "Use separate Foundry resources for experimentation, testing and production, and a dedicated resource for major production workloads", "c": true, "e": "Separate resources isolate quota, policy, data and the blast radius."}, {"t": "Keep one resource and ask developers to test only at night", "c": false, "e": "This is a process request, not isolation."}, {"t": "Move everything to Batch", "c": false, "e": "Production chat cannot use a 24-hour target."}], "concept": "A Foundry resource is the administrative, security and monitoring boundary, and also a scope for quota and policy. If development and production share a resource and the same deployments or quota, they compete.\n\nThe design guidance: use separate Foundry resources per environment (experimentation, testing, production), and a dedicated resource for one high-value production workload, to isolate quota, compliance scope and mistakes. Use one project per distinct access pattern inside a resource, because all agents in a project share one managed identity. For teams that must not see each other's data, use separate projects with scoped roles and project-level connections.\n\nRemember the limits: 100 Foundry resources per region per subscription, 250 projects per resource and 32 model deployments per resource.\n\nCreate all of this from infrastructure as code so that environments stay consistent.", "src": ["https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat", "https://learn.microsoft.com/en-us/azure/foundry/foundry-models/quotas-limits"], "ref": ["platform-network-and-reliability", "capacity-cost-and-throttling"]}, {"d": 1, "q": "A team deletes a Foundry project that contained the shared project identity and several unpublished agents, and separately deletes one published agent application. Which statement describes what is removed?", "o": [{"t": "Deleting a project leaves its shared identity in place forever", "c": false, "e": "The shared identity is removed with the project."}, {"t": "Deleting either one affects only the model deployments", "c": false, "e": "Model deployments belong to the Foundry resource."}, {"t": "Deleting a project removes its blueprint and shared identity; deleting an agent application removes its distinct identity", "c": true, "e": "These are the documented lifecycle effects."}, {"t": "Deleting an agent application removes the whole project identity", "c": false, "e": "It removes only the agent's distinct identity."}], "concept": "Foundry gives each agent a Microsoft Entra agent identity, a special service principal, so tools can authenticate without secrets in prompts or code. While an agent is in development, unpublished agents in a project share one project identity. When an agent is published, it gets its own distinct identity, created at publish time, with its own permissions, audit trail and lifecycle.\n\nThe identity lifecycle follows the objects. Deleting a project removes its blueprint (the template for a class of agents) and the shared identity. Deleting an agent application removes its distinct identity.\n\nIn the Entra admin center (Agent ID), administrators can inventory all agent identities and apply Conditional Access, identity protection, network controls and ownership and expiry governance.\n\nPractical consequence: role assignments given to a deleted identity disappear with it. Use a user-assigned managed identity for projects if you want role assignments to survive project recreation.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/agent-identity"], "ref": ["agent-safety-and-identity"]}, {"d": 1, "q": "A trading-desk assistant must answer faster than normal pay-as-you-go traffic allows, but the team does not want to commit to reserved capacity and the workload is irregular. Which deployment choice fits?", "o": [{"t": "Provisioned throughput with a one-year reservation", "c": false, "e": "Reserved capacity needs a commitment and is paid for even when idle, which does not suit irregular traffic."}, {"t": "Priority processing on a pay-as-you-go deployment", "c": true, "e": "It prioritizes shared capacity for faster responses and a defined latency target without a reservation."}, {"t": "Batch deployment", "c": false, "e": "Batch is asynchronous with a 24-hour target and no real-time promise."}, {"t": "Developer deployment", "c": false, "e": "The developer type is for evaluating fine-tuned models, with no SLA."}], "concept": "Think of deployment types as ways to rent model capacity. Standard shares capacity and has no latency promise. Provisioned reserves capacity for you, bills every hour whether you use it or not, and gives consistent latency. Batch trades speed for a 50% discount and a 24-hour target. Developer is a short-lived type for evaluating fine-tuned models.\n\nPriority processing sits between standard and provisioned. You still pay per token, with no commitment, but at a priority rate, and requests are served ahead of normal traffic with a defined latency target for the model.\n\nThe decision here comes from two facts: the team wants faster responses, and it does not want a commitment because traffic is irregular. That leaves priority processing.\n\nMemory aid: priority is the fast lane you pay per use; provisioned is a private lane you pay for all day.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "Operations wants to know which deployment is being throttled and to report on the throttling over the last quarter, without writing KQL. Which TWO actions fit?", "o": [{"t": "Create a diagnostic setting that sends the metrics to a Log Analytics workspace or Storage for longer retention", "c": true, "e": "Platform metrics are kept for 93 days, so a quarterly report needs a copy."}, {"t": "In Azure Monitor metrics explorer, filter the status code to 429 and split by `ModelDeploymentName`", "c": true, "e": "Metrics need no query language, and splitting by deployment shows which one is throttled."}, {"t": "Enable continuous evaluation on production traffic", "c": false, "e": "Evaluators score quality and safety, not throttling."}, {"t": "Add tracing spans in each application", "c": false, "e": "This is code work and the traces do not aggregate the resource's 429 counts the same way."}, {"t": "Rely on platform metrics for a six-month history", "c": false, "e": "Platform metrics are stored for 93 days."}], "concept": "Azure Monitor platform metrics are numbers over time that Azure collects automatically. For Azure OpenAI and Foundry Models they include token counts and request counts split by status code.\n\nTo see which deployment is throttled without writing KQL, open metrics explorer on the resource, filter the status code to 429, and split the chart by `ModelDeploymentName`. The lines that rise are the throttled deployments.\n\nPlatform metrics are kept for 93 days, so a quarterly or six-month report needs longer retention. A diagnostic setting sends the metrics to a Log Analytics workspace or to Storage, where you choose the retention.\n\nContinuous evaluation scores answer quality and has nothing to do with throttling. Adding tracing spans to every application is extra work and shows request behavior, not capacity limits.\n\nMemory aid: metrics explorer is the dashboard on the wall; a diagnostic setting is the filing cabinet where the history is kept.", "src": ["https://learn.microsoft.com/en-us/azure/azure-monitor/essentials/data-platform-metrics"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 1, "q": "A team deploys an open-source model on managed compute (preview) for an internal assistant. Security asks how harmful prompts and answers will be filtered. What is the correct answer?", "o": [{"t": "Filtering is enabled by choosing a Global deployment type", "c": false, "e": "Managed compute is Global only, but that is about location, not about safety filtering."}, {"t": "The GPU hardware scans the traffic", "c": false, "e": "Accelerator SKUs only provide compute; they do not filter content."}, {"t": "Managed compute has no built-in content filtering in preview, so add Azure AI Content Safety yourself", "c": true, "e": "Learn states that content filtering is not available for managed compute in preview."}, {"t": "The default guardrail of the Foundry resource is applied automatically", "c": false, "e": "Built-in filtering belongs to serverless deployments, not to managed compute in preview."}], "concept": "Foundry has two main ways to run a model. A serverless API means Microsoft hosts the model for you, bills by use, and includes content filtering that you can customize. Managed compute means you rent dedicated GPUs (for example A100 or H100) to run open-source, partner or custom models, and you pay per hour for each accelerator.\n\nThe safety difference matters on the exam. In preview, managed compute has no content filtering. If you call a model through a path that does not use the Azure OpenAI SDK surface, you also do not get filtering unless you add Azure AI Content Safety yourself.\n\nSo the plan is: place a safety check in front of and behind the model (the prompt and the answer) by calling Content Safety from your app or gateway.\n\nMemory aid: serverless comes with a seat belt; managed compute needs you to fit one.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/foundry-models-overview", "https://learn.microsoft.com/en-us/azure/ai-services/content-safety/overview"], "ref": ["model-and-service-selection", "responsible-ai-governance"]}, {"d": 1, "q": "A trace of a support agent shows that for the question \"Where is my order 4711?\" the agent never called the `get_order_status` tool and answered generically. The tool is attached to the agent. What should you do?", "o": [{"t": "Increase the temperature so the agent explores more tools", "c": false, "e": "Randomness does not make a model understand when a tool applies and lowers consistency."}, {"t": "Enable spillover to a standard deployment", "c": false, "e": "Spillover handles capacity limits. It has no effect on tool selection."}, {"t": "Raise `max_output_tokens`", "c": false, "e": "Output length is not the problem. The tool was never requested."}, {"t": "Improve the tool description and the agent instructions so the model selects the tool, then re-evaluate with a tool selection evaluator", "c": true, "e": "When an expected tool is never called, the agent chose not to use it. Clearer names, descriptions and instructions are the first fix, and evaluators confirm the change."}], "concept": "A trace is a recorded timeline of one request: each model call, each tool call with its arguments and result, and timing. It is the first place to look when an agent behaves oddly.\n\nAn agent chooses tools by reading the tool name, the description and the parameter descriptions, together with the agent instructions. If the model never calls `get_order_status`, the usual cause is that the description is vague (\"handles orders\") or the instructions do not say when to use it. The fix is to write a clear description (\"Returns the shipping status of one order. Use when the user asks where an order is\"), add a line in the instructions, and then measure again with a tool selection evaluator on a set of test questions.\n\nWhy the other options fail: temperature only adds randomness; spillover is a capacity feature for provisioned deployments; and `max_output_tokens` limits answer length, not tool choice.\n\nHow it relates: tracing shows the symptom, evaluators confirm and measure it, and prompt or description changes are the treatment.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/observability/concepts/trace-agent-concept"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 1, "q": "You run a safety evaluation with 400 adversarial prompts. A case passes if its score is at or below the default threshold of 3. Results: Violence has 5 failures, Hate and unfairness has 4 failures and Self-harm has 3 failures. The release rule is that no category may have a defect rate above 1%. Which categories block the release?", "o": [{"t": "Violence and Hate and unfairness, because 1% counts as above 1%", "c": false, "e": "Exactly 1% is not above 1%."}, {"t": "None, because the average defect rate is under 1%", "c": false, "e": "The rule applies per category, not on the average."}, {"t": "Only Violence, because 5/400 = 1.25% is above 1%, while Hate and unfairness is exactly 1% and Self-harm is 0.75%", "c": true, "e": "Defect rate is failures divided by cases, and the rule says above 1%."}, {"t": "All three categories, because any failure blocks a release", "c": false, "e": "The rule allows up to 1%."}], "concept": "Risk and safety evaluators score harm categories from 0 to 7. The default threshold is 3, and a case passes if its score is at or below the threshold. A failing case is called a defect. The defect rate is the share of test cases that fail, in each category.\n\nCalculate for each category: Violence 5/400 = 1.25%. Hate and unfairness 4/400 = 1.00%. Self-harm 3/400 = 0.75%. The release rule says \"no category above 1%\". Only Violence exceeds it. Hate and unfairness is exactly at the limit, which is not above it. The average (about 1.0%) is not the rule.\n\nWhen a category fails the rule, the team strengthens the guardrail, grounding or tool limits, and re-runs the evaluation. Set pass rules per risk, make them a release gate, and keep the results with the release.\n\nRead rules literally: above, at least, and at most are different.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators"], "ref": ["responsible-ai-governance"]}, {"d": 1, "q": "A security architect reviews outbound rules for an agent subnet. The firewall team proposes TLS inspection on all agent traffic. What should you advise?", "o": [{"t": "Block all Entra endpoints to reduce exposure", "c": false, "e": "Agents need Entra for authentication."}, {"t": "Enable TLS inspection and trust the firewall certificate in the agent runtime", "c": false, "e": "Learn advises not to inspect agent traffic."}, {"t": "Do not perform TLS inspection on agent traffic, because a substituted certificate breaks connections; allow Microsoft Entra endpoints (or the AzureActiveDirectory service tag) instead", "c": true, "e": "This is documented guidance for firewalls in front of the agent runtime."}, {"t": "Disable the firewall for the agent subnet", "c": false, "e": "Egress control is a requirement against data exfiltration."}], "concept": "Agent subnets carry traffic from the agent runtime to Microsoft services and your resources. A firewall team often wants TLS inspection (decrypting and re-encrypting traffic to look inside). With TLS inspection, the firewall presents its own certificate instead of the service's certificate. The agent runtime does not trust that substituted certificate, so connections fail.\n\nThe guidance is therefore: do not perform TLS inspection on agent traffic. For security you can still control the traffic by destination: allow the Microsoft Entra endpoints (or the `AzureActiveDirectory` service tag), which the agent needs to obtain tokens, and restrict other outbound traffic with allow-lists.\n\nBlocking Entra endpoints would stop token acquisition, and the agent could not authenticate at all. Disabling the firewall removes control instead of tuning it. Trusting the firewall certificate inside the agent runtime is not a supported option.\n\nMemory aid: let the courier carry sealed envelopes; checking by destination is fine, opening them breaks the seal.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A governance checklist for an AI application includes an incident process. According to the responsible AI guidance, which item belongs in that process when a team discovers a vulnerability in the model itself?", "o": [{"t": "Report the model vulnerability to the Microsoft Security Response Center (MSRC)", "c": true, "e": "The governance checklist names MSRC for model vulnerabilities."}, {"t": "Wait for the next yearly review", "c": false, "e": "Incidents need a defined, timely process."}, {"t": "Publish the exploit details on social media first", "c": false, "e": "This is not responsible disclosure."}, {"t": "Ignore it if the guardrail blocked the test prompt once", "c": false, "e": "A one-time block does not remove a vulnerability."}], "concept": "Govern is the part of the framework that answers \"who is accountable, and how do we prove it?\". A practical governance checklist contains: a named owner and escalation path; documented intended use and prohibited use; evaluation results stored with the release; change control for prompts, models, tools and guardrails; access control by role, with no shared keys; an incident process, including reporting a model vulnerability to the Microsoft Security Response Center (MSRC); and periodic review, at least on every model or major prompt change.\n\nWhy write it down: when something goes wrong at night, nobody should have to invent the process. The owner knows who decides, the incident process says whom to inform, and the stored evaluation results show what was tested before release.\n\nA common mistake is to treat the content filter as the whole program, with no owner and no review cycle.\n\nGovernance repeats for the life of the system.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/responsible-use-of-ai-overview"], "ref": ["responsible-ai-governance"]}, {"d": 1, "q": "A client application sends requests to a model endpoint and receives HTTP 431. The network, the quota and the credentials are all fine. Which cause fits this status code?", "o": [{"t": "The deployment name does not exist", "c": false, "e": "That gives a not-found style error, not 431."}, {"t": "The tokens-per-minute limit was exceeded", "c": false, "e": "That gives HTTP 429."}, {"t": "The request carries more than 10 custom headers", "c": true, "e": "A request may carry at most 10 custom headers; more returns HTTP 431."}, {"t": "The key or token is invalid", "c": false, "e": "That gives 401."}], "concept": "HTTP status codes tell you which layer failed, so learn the common ones. 401 means a bad or missing credential. 403 means valid credentials but the operation or configuration is not allowed. 429 means a rate limit (tokens or requests per minute) was exceeded. 431 means the request has too many custom headers: the limit is 10. 503 can appear during peaks, so monitor 429 and 503 together.\n\nThe 431 case is easy to cause with a gateway or a proxy that adds many tracing or routing headers. The fix is to send ten or fewer custom headers.\n\nOther fixed limits worth remembering: 100 Foundry resources per region per subscription, 250 projects per resource and 32 model deployments per resource.\n\nWhen you see an unusual status code, check the troubleshooting table before changing capacity.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/quotas-limits"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "A GitHub Actions workflow deploys Foundry agents with the Azure Developer CLI. The current version stores a service principal secret as a repository secret and sometimes two runs deploy at the same time. Which two changes follow the recommended pattern?", "o": [{"t": "Use the project's API key in the workflow and run deployments in parallel for speed", "c": false, "e": "Keys bypass role-based access control, and parallel deployments can collide."}, {"t": "Keep the secret but rotate it yearly, and let runs overlap", "c": false, "e": "The secret remains a stored credential, and overlapping runs can conflict."}, {"t": "Store the secret in the agent instructions so it is available at deploy time", "c": false, "e": "Secrets must never be placed in prompts or instructions."}, {"t": "Use GitHub OIDC federated credentials with `azure/login` and add a concurrency group that serializes deployments", "c": true, "e": "Federation removes the stored secret, and the concurrency group prevents two simultaneous deployments."}], "concept": "The template workflow for hosted agents runs on a push to `main` and executes `azd provision` and then `azd deploy`. Two details make it safer.\n\nAuthentication uses OpenID Connect (OIDC) federation. The workflow gets a short-lived token from Microsoft Entra ID through a federated credential, so no secret is stored in GitHub. In the workflow this needs `permissions: id-token: write` and the `azure/login` action.\n\nA concurrency group gives each deployment a queue. Only one run of the group executes at a time, so two pushes in quick succession do not provision or deploy at once.\n\nIn a private Foundry, the runner must be able to reach the network, so use a self-hosted runner inside the virtual network.\n\nUse least-privilege roles for the pipeline identity, and keep infrastructure code and agent definitions in source control.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/set-up-ci-cd-cli", "https://learn.microsoft.com/en-us/azure/foundry/agents/quickstarts/set-up-cicd-hosted-agent"], "ref": ["cicd-for-foundry-projects"]}, {"d": 1, "q": "You prepare the virtual network subnet for agent runtime injection in a Foundry resource. Which TWO requirements apply?", "o": [{"t": "The subnet is delegated to `Microsoft.App/environments` and is dedicated to this Foundry resource", "c": true, "e": "Missing delegation causes provisioning failures, and the agent subnet cannot be shared between Foundry resources."}, {"t": "The subnet overlaps with the peered on-premises network", "c": false, "e": "Overlapping ranges with peered networks are not allowed."}, {"t": "The subnet is a /29 range", "c": false, "e": "A /24 is recommended and the minimum for portal injection is /27."}, {"t": "The Foundry resource is in the same region as the virtual network", "c": true, "e": "Other resources may be elsewhere, but the Foundry resource must match the VNet region."}, {"t": "The subnet is shared with the application's virtual machines to save address space", "c": false, "e": "The agent subnet is dedicated per Foundry resource."}], "concept": "Hosted agents and the agent runtime in a secured network use network injection: the runtime containers are placed into a subnet of your virtual network, so they can reach your private resources.\n\nThe subnet has strict requirements. It must be delegated to `Microsoft.App/environments`, which prepares it for the container environment, and it must be dedicated to one Foundry resource, since subnets cannot be shared between Foundry resources. The Foundry resource and the virtual network must be in the same region. The size matters too: /29 is far too small (the portal flow needs at least /27 and /24 is recommended), and the range must not overlap with peered or on-premises networks, because overlapping addresses cannot be routed.\n\nSharing the subnet with application virtual machines breaks the dedicated requirement.\n\nMemory aid: the agent subnet is a private car park reserved for one company, in the same city as its office.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A team's pipeline runs the full evaluation suite of 2,000 test cases with an LLM judge on every commit to every pull request. Costs rise and the pipeline slows down. Which change follows the guidance?", "o": [{"t": "Run the full suite on every commit but use a smaller judge model with no testing", "c": false, "e": "The judge model must be validated; the cost problem is the frequency."}, {"t": "Remove evaluation from the pipeline entirely", "c": false, "e": "Evaluation is the gate that catches regressions."}, {"t": "Run a small fast set (about a dozen cases) on every pull request and the full set only for release candidates", "c": true, "e": "This controls cost and still gates the release."}, {"t": "Replace the dataset with five easy cases", "c": false, "e": "A dataset that is too easy hides regressions."}], "concept": "AI apps need evaluation as a gate in the pipeline, because quality can change without any code change. But evaluation costs money (model calls for the system and for the judge) and takes time.\n\nLearn advises not running the evaluation Action on every commit, to control cost. A balanced design has two levels. A small, fast set of about a dozen cases runs on every pull request to catch obvious breaks. The full dataset runs on release candidates, before promotion to production.\n\nDataset hygiene helps both: version the dataset with the code, and add every production incident as a new case. A dataset that is too small or too easy produces a gate that always passes.\n\nA gate should combine an absolute floor (for example safety defect rate at or below 1%) and a rule relative to the baseline.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluation-github-action", "https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/azure-developer-cli-evaluation"], "ref": ["cicd-for-foundry-projects"]}, {"d": 1, "q": "Which statement about the risk and safety evaluators for harm categories (hate and unfairness, sexual, violence, self-harm) is correct?", "o": [{"t": "Scores range from 0 to 7, the default threshold is 3, and a case passes if the score is less than or equal to the threshold", "c": true, "e": "A defect is a score above the threshold."}, {"t": "Scores range from 1 to 5 and 3 fails", "c": false, "e": "The 1 to 5 range belongs to many LLM-judge quality evaluators."}, {"t": "Scores are 0 or 1 only", "c": false, "e": "The harm evaluators return severity scores."}, {"t": "A case passes only if the score is higher than the threshold", "c": false, "e": "The direction is reversed. A lower score is safer."}], "concept": "Harm evaluators for Hate and unfairness, Sexual, Violence and Self-harm use a severity scale from 0 to 7. A higher score is worse.\n\nThe default threshold is 3. A case passes if its score is less than or equal to the threshold, and fails if it is greater. So a score of 3 passes, and 4 or more fails. This is easy to invert by mistake, because many quality scores (such as groundedness on a 1 to 5 scale) are better when higher.\n\nYou can change the threshold to match your risk tolerance. For a children's app you may use a lower threshold, such as 1, which fails anything above very low severity.\n\nRemember the units: defect rate = failed cases divided by total cases. The scale of 1 to 5 belongs to quality evaluators such as groundedness, and 0 or 1 is not used for these harm scores.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators"], "ref": ["responsible-ai-governance"]}, {"d": 1, "q": "A team maintains an evaluation dataset for the CI gate. Which practice follows the guidance on dataset hygiene?", "o": [{"t": "Use only polite prompts so the pipeline always passes", "c": false, "e": "A dataset without adversarial and failing cases hides regressions."}, {"t": "Run the full dataset on every commit to be safe", "c": false, "e": "This drives up cost, and the guidance is to run it on release candidates."}, {"t": "Version the dataset with the code, add every production incident as a new test case, and keep a small fast set for each pull request and the full set for release candidates", "c": true, "e": "This keeps the gate relevant and affordable."}, {"t": "Keep the dataset in a personal folder and update it yearly", "c": false, "e": "It is not versioned or shared."}], "concept": "An evaluation dataset is the test suite for an AI system, and it needs the same care as code.\n\nVersion it with the code, so every result can be tied to the dataset that produced it. Add every production incident as a new test case, so the same failure is never missed twice. Use two sizes: a small, fast set for every pull request (minutes, low cost) and the full set for release candidates (thorough, higher cost).\n\nA dataset in a personal folder updated yearly goes stale. Using only polite, easy prompts makes the pipeline pass but hides weaknesses; include adversarial, edge and no-answer cases. Running the whole dataset on every commit is expensive and slow, and Microsoft's own guidance for the evaluation Action is to avoid evaluating every commit.\n\nMemory aid: a good test set is a growing collection of the mistakes you have already made.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluation-github-action"], "ref": ["cicd-for-foundry-projects"]}, {"d": 1, "q": "A new project's agents cannot use several features and fail without clear errors. The team granted the developers Foundry User, but nothing was assigned to the project's own managed identity. What should they do?", "o": [{"t": "Delete and recreate the project", "c": false, "e": "This is unnecessary, and the new identity would again need the role."}, {"t": "Give the developers the Owner role at subscription scope", "c": false, "e": "Developer roles do not fix a missing role for the project identity."}, {"t": "Give the project's managed identity the Foundry User role on the Foundry resource", "c": true, "e": "Some features fail silently when the project identity lacks this role."}, {"t": "Switch every connection to API keys", "c": false, "e": "Keys bypass role-based access control and are not the recommended fix."}], "concept": "Foundry roles apply to people and also to identities used by the platform. Each project has a managed identity, and agents in the project use it to reach resources. The rule is: give the project's managed identity the Foundry User role on the Foundry resource too, or some features fail silently.\n\n\"Silently\" is the key word: the portal does not always show a clear authorization error, so the symptom is features that do not work.\n\nThe roles at a glance: Foundry Agent Consumer (call agents only), Foundry User (build and test), Foundry Project Manager (publish agents and assign Foundry User), Foundry Account Owner (accounts and models) and Foundry Owner (all).\n\nDesign tip: use a user-assigned managed identity for projects when role assignments must survive project recreation. And remember that provisioning and runtime use different identities with different roles.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry"], "ref": ["platform-network-and-reliability", "agent-safety-and-identity"]}, {"d": 1, "q": "An Application Gateway with WAF is the only internet-facing entry point to a chat application. The WAF blocks many legitimate chat messages as false positives because the text looks like attack patterns. What is the recommended handling?", "o": [{"t": "Disable all managed rules for the whole application", "c": false, "e": "This is too broad and weakens security."}, {"t": "Scope WAF exclusions to the chat message field, instead of disabling the rules", "c": true, "e": "This avoids false positives for that field while keeping protection elsewhere."}, {"t": "Turn the WAF off completely", "c": false, "e": "This removes protection from the only internet-facing entry point."}, {"t": "Move the chat application to a service endpoint", "c": false, "e": "A network type change does not solve false positives in a WAF."}], "concept": "In the reference architecture, only an Application Gateway with a web application firewall (WAF), plus DDoS protection, faces the internet. Everything behind it uses private endpoints.\n\nA chat input field is free text, so it can legitimately contain words and symbols that look like SQL, scripts or other attack patterns. A WAF may flag them. The recommended approach is to add exclusions that are scoped to the chat message field only. The rules stay active for headers, URLs and other fields, while that one field is excluded from the matching rules.\n\nThe wrong answers weaken the whole entry point. Security is a balance: reduce false positives precisely and keep the rest of the rules.\n\nOther parts of the same de
