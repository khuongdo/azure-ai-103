sign: a dedicated agent subnet with a user-defined route to Azure Firewall and FQDN rules for egress control.", "src": ["https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A team wants a regional (geography-based) Provisioned deployment of a model for which the minimum is 50 PTUs and the scale step is 50. They request 60 PTUs and the request is rejected. What is the correct way to resolve this?", "o": [{"t": "Request 15 PTUs, because all provisioned types have the same minimum", "c": false, "e": "Global and Data Zone have a minimum of 15; regional minimums are larger for several models."}, {"t": "Switch to Batch, because it uses PTUs", "c": false, "e": "Batch is pay-per-token."}, {"t": "Request 50 or 100 PTUs, because regional provisioned deployments scale in steps of 50 from the minimum", "c": true, "e": "60 is not a valid size for that model."}, {"t": "Request 60 PTUs with a support ticket marked urgent", "c": false, "e": "The limit is a deployment rule, not a support policy."}], "concept": "PTUs are a normalized unit of provisioned capacity. They are model-independent in quota terms, but region-specific and separated by deployment type: Global, Data Zone and Regional Provisioned are separate quota pools. Each model has a minimum PTU count and a scale increment.\n\nGlobal and Data Zone provisioned deployments have a minimum of 15 PTUs and scale in steps of 5 for most current models. Regional provisioned minimums are larger: for example 50 PTUs with steps of 50 for several models. A valid size is the minimum plus whole steps, so 50, 100, 150 and so on.\n\nSizing therefore ends with rounding up to a valid size. Compute the needed PTUs from the formula, then choose the next valid size, and compare the cost of the larger regional step with a Data Zone or Global option if residency allows.\n\nAlways check the sizing page for the specific model.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/provisioned-throughput-sizing", "https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/provisioned-throughput"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "A bank's agent was told never to give investment advice. Reviewers find that in some conversations it recommends funds. Which evaluator measures whether the agent followed its system instructions and policy?", "o": [{"t": "Tool Call Success", "c": false, "e": "It checks whether a tool call technically succeeded, such as API errors and timeouts."}, {"t": "Task Navigation Efficiency", "c": false, "e": "It compares tool steps with an expected sequence to find needless calls."}, {"t": "Task Adherence", "c": true, "e": "It checks that the agent follows its system instructions and policy, and catches advice the agent was told not to give."}, {"t": "Tool Call Accuracy", "c": false, "e": "It checks whether the right tools were called with the right parameters."}], "concept": "Agent evaluators check different parts of an agent's behavior, so you must pick the one that matches the question.\n\nTask Adherence asks: did the agent follow its assigned task, instructions and policy constraints? Recommending funds when the system prompt forbids investment advice is a policy violation, so this is the right evaluator. Tool Call Accuracy and Tool Call Success look at tool calls: whether the calls were correct and whether they ran without technical errors. Task Navigation Efficiency compares the sequence of steps with an expected path and needs ground truth.\n\nOther useful evaluators are Intent Resolution (did it understand the request), Task Completion (was the task finished) and Tool Output Utilization (did it use tool results correctly).\n\nHow it relates: run these on a test set before release, and on sampled production traffic after release, so rule-breaking behavior is caught as a number rather than by a customer complaint.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/agent-evaluators"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 1, "q": "A company runs a customer copilot on a Provisioned deployment. To save money, an engineer proposes scaling the PTUs up every morning at 8:00 and down every evening at 18:00 with a scheduled job. What is the main risk of this plan?", "o": [{"t": "Provisioned deployments cannot be changed after creation", "c": false, "e": "PTUs can be changed, but doing it daily is not a safe plan."}, {"t": "PTUs lose their quota each time they are scaled down", "c": false, "e": "Quota is a policy limit and is not consumed by scaling; capacity is the problem."}, {"t": "Scaling PTUs up and down is blocked by Azure Policy by default", "c": false, "e": "No such default block exists; the risk is capacity, not policy."}, {"t": "Capacity is not guaranteed when you scale back up, so the deployment may fail to scale at 8:00; use steady provisioned capacity with spillover for bursts instead", "c": true, "e": "Scaling down releases capacity back to the pool, and there is no promise you can get it back."}], "concept": "A PTU (provisioned throughput unit) is a normalized slice of model capacity. Foundry reserves it for you and bills it hourly whether or not you send requests. Two ideas must be kept apart. Quota is a free policy limit on how many PTUs you may deploy. Capacity is the real hardware available right now for a model version. Having quota does not guarantee capacity.\n\nWhen you delete or scale down, capacity returns to a shared pool. If you later scale up, the capacity may not be there, and the operation fails. That is why Learn advises against planning to scale up and down with daily traffic. Continuous hourly billing at high use also usually costs more than a reservation.\n\nBetter design: size provisioned capacity for the steady base load, and let spillover send bursts to a standard deployment.\n\nMemory aid: quota is permission to rent; capacity is a car actually on the lot.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/provisioned-throughput", "https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "An HR assistant program includes these activities: (1) a red team and risk evaluators run before launch, (2) a guardrail and grounding with citations are added, (3) a named owner, audit logs and an incident process are set up. Which mapping to Discover, Protect and Govern is correct?", "o": [{"t": "(1) Discover, (2) Govern, (3) Protect", "c": false, "e": "Guardrails and grounding are Protect, and ownership and audit are Govern."}, {"t": "(1) Govern, (2) Protect, (3) Discover", "c": false, "e": "Ownership and audit are Govern, not Discover."}, {"t": "(1) Discover, (2) Protect, (3) Govern", "c": true, "e": "Discover finds what can go wrong, Protect stops it at runtime, and Govern assigns accountability and proof."}, {"t": "(1) Protect, (2) Discover, (3) Govern", "c": false, "e": "Red teaming finds problems and is Discover. Guardrails are runtime protection."}], "concept": "Responsible AI work for generative apps is organized in three activities that answer three questions.\n\nDiscover asks \"what could go wrong?\": red teaming, risk evaluators, testing and inventory. Protect asks \"how do we stop harm at run time?\": guardrails and content filters, Prompt Shields, grounding with citations, limits on tools. Govern asks \"who is accountable and can we prove it?\": named owners, policies, approvals, audit logs, an incident process and compliance reporting.\n\nMapping the three items: (1) a red team and risk evaluators before launch find risks, so Discover. (2) A guardrail and grounding with citations reduce harm during use, so Protect. (3) A named owner, audit logs and an incident process give accountability, so Govern.\n\nThe three are a cycle, not a sequence: findings from Discover improve Protect, and Govern records the evidence and decides what is acceptable.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/responsible-use-of-ai-overview"], "ref": ["responsible-ai-governance"]}, {"d": 1, "q": "A FinOps review of an agent platform finds rising Cosmos DB throughput costs and storage use, although traffic is flat. The platform has thousands of old test agents and conversations that nobody uses. Which lever applies?", "o": [{"t": "Convert all deployments to Provisioned", "c": false, "e": "This changes model billing, not stored data."}, {"t": "Raise the temperature of the models", "c": false, "e": "Temperature does not affect storage."}, {"t": "Increase the number of connected tools", "c": false, "e": "More tools raise cost and risk."}, {"t": "Delete unused agents and conversations on a schedule, because stale data keeps using storage and request units", "c": true, "e": "This is a listed cost lever."}], "concept": "Cost for an agent workload is not only model tokens. In the standard agent setup, conversations, agent definitions and run state live in your Cosmos DB account, files in Storage and vector stores in AI Search. Old data keeps using storage and request units.\n\nLearn lists cost levers: smaller models, the right deployment type, fewer connected tools (the agent may invoke any of them on each request), capped output, prompt caching, batch for non-urgent work, deleting unused agents and conversations, keeping resources in one region to avoid cross-region charges, restricting playground use in production, and Azure Policy to block expensive deployment types.\n\nFor stale data, set a schedule or a retention policy, such as memory TTL for stored memories. Check that deletion respects audit and compliance requirements before you delete.\n\nCost is measured per approved outcome, not per call.", "src": ["https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat", "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/use-your-own-resources"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "A chat application stores conversations through Foundry Agent Service. A tester discovers that changing the conversation ID in a request returns another user's conversation. What is missing?", "o": [{"t": "Public network access on the Foundry resource", "c": false, "e": "This opens more access and does not add ownership checks."}, {"t": "A longer conversation ID", "c": false, "e": "IDs are identifiers, not a security control."}, {"t": "A stronger model deployment", "c": false, "e": "Model strength has nothing to do with authorization."}, {"t": "An application-level check that the caller owns the conversation; Foundry does not enforce per-user access to conversations", "c": true, "e": "Without ownership checks the application has a broken object-level authorization flaw."}], "concept": "Authentication proves who the caller is. Authorization decides what that caller may access. Foundry Agent Service enforces access to the project and its agents with roles, but it does not know which of your end users owns which conversation.\n\nIf the app lets the browser send a conversation ID and the backend simply forwards it, a user can change the ID and read someone else's data. This is an insecure direct object reference (IDOR). The fix is in your application: store which user owns each conversation, and before every call check that the signed-in user owns the ID. Better, never accept raw IDs from the client; look them up from the user session on the server.\n\nA stronger model does not enforce access. Public network access makes it worse. A longer ID only hides it and is not a control.\n\nMemory aid: the hotel gives every guest a room key, but it is the front desk logic that checks you are going to your own room.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "Operations has an alert for HTTP 429 but users still report failures at peak hours that the alert does not catch. Dashboards show many 503 responses. What should the team change?", "o": [{"t": "Lower the prompt length to 10 tokens", "c": false, "e": "The cause is capacity at peak, and this makes the application unusable."}, {"t": "Ignore 503 because only 429 is related to load", "c": false, "e": "503 is part of the peak-load picture."}, {"t": "Disable alerts to avoid noise", "c": false, "e": "This removes visibility."}, {"t": "Monitor 429 and 503 together, and add a gateway or capacity measures for the peaks", "c": true, "e": "503 can also appear during peaks, so throttling and overload are watched as a pair."}], "concept": "Two statuses show load problems. 429 means you exceeded a limit (tokens or requests per minute) and the right reaction is retry with exponential backoff, honor the Retry-After header, ramp load gradually and add quota. 503 can appear when the service is under pressure during peaks. Learn advises monitoring both together.\n\nFor production, a single deployment is not enough. Foundry does not load-balance or fail over model deployments for you. Put a gateway such as Azure API Management in front for routing, health checks and circuit breaking across deployments or regions. Prefer Data Zone or Global deployment types for resilience, use spillover from provisioned to standard, and keep models in the same region as the agents.\n\nMetrics are in Azure Monitor: chart total calls, filter by status code and split by `ModelDeploymentName`.\n\nAlert design: cover every status that means \"user did not get an answer\".", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/quotas-limits", "https://learn.microsoft.com/en-us/azure/foundry/how-to/high-availability-resiliency"], "ref": ["capacity-cost-and-throttling", "platform-network-and-reliability"]}, {"d": 1, "q": "A back-end service calls a reasoning model without streaming. Complex requests fail after exactly 60 seconds with a client timeout, although the service responds correctly in tests with a longer timeout. What is the best fix?", "o": [{"t": "Set the client timeout explicitly, since reasoning models can take much longer (up to about 29 minutes), and tune it to your traffic", "c": true, "e": "Library defaults may not match the service, and reasoning happens before the first output token."}, {"t": "Disable reasoning by lowering the temperature", "c": false, "e": "Temperature does not control reasoning, and the effort setting is the relevant control."}, {"t": "Add more custom headers to keep the connection alive", "c": false, "e": "This risks HTTP 431 and does not extend timeouts."}, {"t": "Switch the deployment to Batch for interactive use", "c": false, "e": "Batch is asynchronous with a 24-hour target and is not for live responses."}], "concept": "Client timeouts are your responsibility. Learn's guidance: non-reasoning streaming calls up to 60 seconds; non-streaming calls or reasoning models up to 29 minutes, set lower and tuned to your traffic. Set them explicitly, because a library default may not match the service.\n\nReasoning models generate and summarize all reasoning tokens before the first visible output token, so even a streaming call shows a long wait at the start. The `reasoning_effort` parameter controls how many reasoning tokens are produced, so a lower effort shortens the wait for tasks that do not need deep thinking.\n\nTo decide a good timeout, log latency percentiles for a day. Pick a value above the 95th percentile and keep user-facing interfaces responsive with progress messages.\n\nFor work that can wait, use a Batch deployment, not a longer timeout.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/quotas-limits", "https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning"], "ref": ["capacity-cost-and-throttling", "model-and-service-selection"]}, {"d": 1, "q": "A pipeline gate has two rules: task adherence must be at least 4.0, and it must not be lower than production by more than 0.1. Production scores 4.6. A candidate version scores 4.45, with higher helpfulness. What is the gate decision and the reason?", "o": [{"t": "Pass, because helpfulness improved", "c": false, "e": "Another metric improving does not offset a task adherence regression."}, {"t": "Fail, because 4.6 - 4.45 = 0.15, which is more than 0.1 below production, even though 4.45 is above the floor", "c": true, "e": "The relative rule is violated."}, {"t": "Fail, because 4.45 is below 4.5", "c": false, "e": "There is no rule about 4.5."}, {"t": "Pass, because 4.45 is above 4.0", "c": false, "e": "The absolute floor passes, but the relative rule fails."}], "concept": "An evaluation gate should combine different kinds of rules. An absolute floor sets a minimum (for example task adherence of at least 4.0, or every safety evaluator defect rate at or below 1%). A relative rule compares with the baseline (not lower than production by more than 0.1). Must-pass cases require specific critical scenarios to pass. A budget limits cost, for example median tokens per conversation within production plus 10%.\n\nAn absolute threshold alone hides regressions: with production at 4.6, a floor of 4.0 would allow a drop to 4.0. The relative rule catches it.\n\nHere: floor test 4.45 >= 4.0 passes. Relative test: 4.6 - 4.45 = 0.15 > 0.1, so it fails. A gate fails if any critical rule fails, even if another metric improved.\n\nUse confidence intervals when comparing versions, and keep the dataset versioned with the code.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluation-github-action", "https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/azure-developer-cli-evaluation"], "ref": ["cicd-for-foundry-projects"]}, {"d": 1, "q": "A subscription is onboarded to subscription-level quota management for a model. A team creates one Global Standard deployment of the model in one region and another Global Standard deployment of the same model and version in a second region. How is the quota counted?", "o": [{"t": "The two deployments share one pool for that model and version across all regions of the subscription", "c": true, "e": "Global Standard deployments of the same model and version in a subscription share a single pool."}, {"t": "The quota is counted per project, so each project has its own pool", "c": false, "e": "Limits are enforced at the subscription, not per project."}, {"t": "Each region has its own separate pool, so quota doubles", "c": false, "e": "This was the older per-region model; it does not apply to onboarded models."}, {"t": "The quota is shared with every subscription in the tenant", "c": false, "e": "Limits are enforced at the subscription and not at the tenant."}], "concept": "Quota is a policy limit on how much capacity you may use. For models onboarded to subscription-level quota management, all Global Standard deployments of the same model and version in one subscription draw from one pool across all regions. Data Zone Standard deployments share one pool per data zone.\n\nWhy this matters: if you create two deployments hoping to get two full quotas, you will find that they split one. To get more, request a quota increase or move quota from an unused deployment. You can check the scope of each limit in the Quota page: the Scope column says Global, Data Zone or a specific region.\n\nFor models that are not onboarded, limits are still per region, per subscription, per model or deployment type.\n\nRemember: limits are enforced at the subscription, not the tenant and not the project.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/quotas-limits"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "A team wants a one-year Azure Reservation to lower the cost of a provisioned deployment that will run at high utilization. In which order should they work?", "o": [{"t": "Request more quota instead of a reservation", "c": false, "e": "Quota is a deployment limit and is not a discount."}, {"t": "Use hourly billing and scale the PTUs up and down with the daily traffic curve", "c": false, "e": "Capacity may not be available when you scale back up, and continuous hourly billing at high use usually costs more."}, {"t": "Buy the reservation first, then create the deployment", "c": false, "e": "If capacity is short, the deployment fails and the reservation guarantees nothing."}, {"t": "Create the deployment, confirm that the capacity was allocated, then buy the reservation", "c": true, "e": "A reservation is a discount on the PTU meter and does not guarantee capacity."}], "concept": "An Azure Reservation is a billing commitment: you promise to pay for a quantity of PTUs for one month or one year, and in return the hourly price is lower. It changes the price meter only. It does not reserve physical capacity in the region.\n\nCapacity is allocated when you create the deployment. If the region cannot provide enough PTUs, the deployment fails. If you had bought the reservation first, you would have paid for a discount on capacity that you cannot use.\n\nSo the safe order is: create the deployment, confirm that the capacity was allocated and the deployment works, then buy a reservation sized to the deployed PTUs. Reservations suit stable, high utilization; for uneven traffic, hourly billing with scaling can be cheaper.\n\nQuota is also not a substitute: it is the permission to deploy, not a price discount.\n\nMemory aid: first make sure the seat exists, then buy the season ticket.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/provisioned-throughput"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "A voice assistant uses a reasoning model for short intent classification, and users complain about a long pause before every answer. Accuracy is already high. Which change reduces latency the most?", "o": [{"t": "Set `reasoning_effort` to `none` for this latency-critical task", "c": true, "e": "Reasoning models produce hidden reasoning tokens before the first visible token. A lower effort (or `none`) removes most of that wait."}, {"t": "Move the deployment to Batch", "c": false, "e": "Batch is asynchronous with a 24-hour target."}, {"t": "Increase `max_output_tokens` to 100,000", "c": false, "e": "A larger cap does not make the model faster."}, {"t": "Add \"think step by step\" to the prompt", "c": false, "e": "This adds tokens and is not recommended for reasoning models."}], "concept": "Latency in a reasoning model comes mostly from the thinking phase. Before the first visible word, the model generates hidden reasoning tokens, and the user waits for them. The setting `reasoning_effort` controls how much it thinks.\n\nHigher effort helps with hard multi-step problems. Short intent classification is easy, and accuracy is already high, so the extra thinking buys nothing. Setting `reasoning_effort` to `none` (where the model supports it) removes or minimizes the reasoning step, so the first token arrives much sooner. If `none` is not available for the model, use the lowest supported level and test accuracy again.\n\n\"Think step by step\" does the opposite: it asks for more reasoning and is not needed for reasoning models. A bigger `max_output_tokens` only raises the cap. Batch is asynchronous with a 24-hour target, the opposite of low latency.\n\nMemory aid: do not ask a professor to deliberate for ten minutes about a yes or no question.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning"], "ref": ["model-and-service-selection", "capacity-cost-and-throttling"]}, {"d": 1, "q": "An application calls a reasoning model through the Responses API with `max_output_tokens=2000`. The input is short, but responses come back with status `incomplete` and an empty `output_text`. What should you do first?", "o": [{"t": "Ask the model to print its raw reasoning so you can debug", "c": false, "e": "Extracting raw reasoning by prompting is unsupported, may violate the Acceptable Use Policy and can lead to throttling. Use the reasoning summary setting instead."}, {"t": "Raise `max_output_tokens`, because hidden reasoning tokens count toward the cap", "c": true, "e": "Reasoning tokens are billed as output and share the output budget with the visible answer. If reasoning alone uses the 2,000 tokens, no answer is produced. Learn suggests reserving a large budget first and tuning down from measured `reasoning_tokens`."}, {"t": "Lower the temperature", "c": false, "e": "Temperature does not change how many reasoning tokens consume the output cap."}, {"t": "Add \"think step by step\" to the prompt", "c": false, "e": "Classic chain-of-thought prompting is not recommended for reasoning models and does not free any output budget."}], "concept": "A reasoning model \"thinks\" before it answers. That thinking is made of reasoning tokens. You do not see them in the output, but the service counts them as output tokens.\n\n`max_output_tokens` is a cap on all output tokens together: reasoning tokens plus the visible answer. If the model spends the whole cap on thinking, generation stops with status `incomplete` and there is no visible text. This is why a short prompt can still produce an empty answer: the input size is not the problem, the output budget is.\n\nFix it by raising the cap (leave generous headroom, often thousands of tokens) or by lowering the reasoning effort so the model thinks less. You can confirm the diagnosis in the usage details, where the reasoning token count is close to the cap.\n\nHow it relates: chat models spend almost all of the cap on visible text, so people carry that habit to reasoning models and set it too low. Techniques like \"think step by step\" or asking for raw reasoning are not needed and are not recommended for reasoning models.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning"], "ref": ["model-and-service-selection"]}, {"d": 1, "q": "A European company requires that inference for its model is processed only within the EU, while it wants pay-per-token pricing and better quota than a single-region deployment. Which deployment type should you choose?", "o": [{"t": "Developer", "c": false, "e": "It has no residency commitment and is not for production."}, {"t": "Global Batch", "c": false, "e": "Global processing may leave the EU, and Batch is asynchronous."}, {"t": "Global Standard", "c": false, "e": "Global may process requests in any Azure region."}, {"t": "Data Zone Standard (EU)", "c": true, "e": "Data Zone types process requests only within the zone and follow the EU Data Boundary for the EU, with pay-per-token billing."}], "concept": "Deployment types combine two choices: how you pay (standard per token, provisioned, batch) and where processing may happen (Global, Data Zone, Regional).\n\nGlobal routing may process in any region, which gives the best availability and quota but cannot satisfy a rule \"only inside the EU\". Data Zone keeps processing inside a geography such as the EU or the US; Data Zone Standard bills per token and has a larger shared quota than a single region. Regional keeps everything in one region.\n\nSo for \"processed only in the EU\", \"pay-per-token\" and \"better quota than single-region\", the answer is Data Zone Standard (EU). Global Standard and Global Batch break the residency rule. Developer is for testing fine-tuned models.\n\nRemember that where data is stored at rest depends on the resource location, while the deployment type controls where inference is processed.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "Operations wants a live view of token consumption, latency, error rates and quality scores for production agents, with alerts when outputs fail quality thresholds. What should they use?", "o": [{"t": "The CI pipeline logs", "c": false, "e": "They show build results, not production behavior."}, {"t": "The Foundry observability dashboard integrated with Application Insights, plus Azure Monitor alerts", "c": true, "e": "It shows operational metrics and quality scores in real time and supports alerts."}, {"t": "Only the model catalog benchmarks", "c": false, "e": "Benchmarks describe models, not your production traffic."}, {"t": "A one-time evaluation before launch", "c": false, "e": "It does not monitor production."}], "concept": "Operating an AI application needs live visibility, not only pre-release tests. The Foundry observability dashboard, integrated with Application Insights, shows operational numbers such as token consumption, latency and error rates, and quality scores from evaluations of production traffic.\n\nAdd Azure Monitor alerts on top: rules that fire when a metric crosses a threshold, for example when groundedness falls below 4 or the error rate rises, and notify the on-call team through email, Teams or an incident system.\n\nModel catalog benchmarks are public numbers for model selection. A one-time evaluation before launch is a snapshot. CI pipeline logs show build and deployment results, not user traffic.\n\nCombine four sources: traces for individual requests, metrics for volume and latency, evaluations for quality, and alerts to wake someone up.\n\nMemory aid: a dashboard is the instrument panel of a car; alerts are the warning lights.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/observability"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 1, "q": "A new deployment fails, and the Quota page shows 0 available for the model and deployment type. Another deployment in the subscription holds quota but is unused. What should you do?", "o": [{"t": "Move quota from the unused deployment, or submit a quota increase request", "c": true, "e": "Both are documented ways to get more limit. Requests are evaluated individually."}, {"t": "Buy a reservation", "c": false, "e": "A reservation is a discount and does not add quota."}, {"t": "Add more custom headers to the request", "c": false, "e": "More than 10 custom headers returns HTTP 431."}, {"t": "Wait for the quota to reset at midnight", "c": false, "e": "Quota is an allocation, not a daily counter."}], "concept": "Quota is the amount of capacity your subscription may deploy for a model and deployment type in a region. When it shows 0 available, a new deployment cannot be created, even though the subscription's limit is shared with other deployments.\n\nThe quota is held by existing deployments. If another deployment holds quota but is unused, you can reduce its capacity or delete it, which frees the quota, and then give it to the new deployment. If the total is not enough, submit a quota increase request. Both are legitimate ways to get quota.\n\nA reservation is a billing discount and does not create quota or capacity. Custom headers are irrelevant. Quota does not reset at midnight; tokens-per-minute rate limits renew every minute, but the deployment quota is a fixed allocation.\n\nMemory aid: quota is a parking permit count. If all permits are in use, free one or ask for more.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/quotas-limits"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "Your subscription has enough Provisioned Throughput quota for 100 PTUs in a region. Creating a 50-PTU provisioned deployment fails with an insufficient capacity error. What explains this, and what should you do?", "o": [{"t": "Quota is only a limit on what you may deploy; real capacity can be short. Try fewer PTUs, another region, or retry later", "c": true, "e": "Having quota does not guarantee capacity. Capacity is allocated when the deployment is created, and the failure means none was available at that moment."}, {"t": "Switch the deployment to hourly billing", "c": false, "e": "The billing method does not affect whether capacity can be allocated."}, {"t": "Buy a one-year reservation first so the capacity is guaranteed", "c": false, "e": "A reservation is a billing discount and does not guarantee capacity. Create the deployment and confirm capacity before buying."}, {"t": "You must request a quota increase", "c": false, "e": "Quota is already sufficient. More quota would not create capacity."}], "concept": "Two ideas are easy to mix up: quota and capacity.\n\nQuota is a limit that Azure gives your subscription: \"you may deploy up to 100 PTUs in this region\". It is a policy number and it costs nothing. Capacity is the real hardware that the region has available at this moment. Demand changes during the day, so the capacity can be lower than the sum of everyone's quotas.\n\nA provisioned deployment reserves real capacity, so creation can fail with an insufficient capacity error even when you have quota. The practical responses are to ask for fewer PTUs, try another region or a Global or Data Zone type, or retry later. A quota increase does not help because you already have enough quota.\n\nA reservation is a billing discount for committing to PTUs for a period. It does not guarantee capacity, so the correct order is: create the deployment first to prove capacity exists, then buy the reservation.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/provisioned-throughput"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "A platform manager must create Foundry resources and projects and manage model deployments, but company policy says this person must not build or run agents inside projects. Which built-in role fits?", "o": [{"t": "Foundry Account Owner", "c": true, "e": "It can create accounts and projects and manage models, but it cannot build in projects."}, {"t": "Foundry User", "c": false, "e": "It is the developer role for building and testing in a project, which the policy forbids."}, {"t": "Foundry Project Manager", "c": false, "e": "It can build, publish agents and assign Foundry User, which goes beyond the allowed scope."}, {"t": "Foundry Owner", "c": false, "e": "It combines all of the above, including building in projects."}], "concept": "Foundry has a small set of built-in roles with different purposes. Foundry Agent Consumer can call agent endpoints only. Foundry User can build and develop in a project. Foundry Project Manager can build, publish agents and assign Foundry User to others. Foundry Account Owner can create accounts and projects and manage models, but cannot build inside projects. Foundry Owner has all of these rights.\n\nThe policy in the question separates two duties: administering the platform and building on it. Account Owner matches the first duty only.\n\nOther rules of thumb: API keys bypass role-based access control, so prefer Microsoft Entra ID; publishing an agent needs at least Project Manager on the Foundry resource; do not use the older Cognitive Services roles (except Usages Reader for quota) or Azure AI Developer for Foundry projects.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry"], "ref": ["agent-safety-and-identity", "platform-network-and-reliability"]}, {"d": 1, "q": "A music-lyrics assistant must be checked for output that reproduces copyrighted song lyrics, recipes or published articles. Which evaluator should you add?", "o": [{"t": "Code Vulnerability", "c": false, "e": "It looks for insecure patterns in generated code."}, {"t": "Ungrounded Attributes", "c": false, "e": "It detects inferring protected traits not present in the context."}, {"t": "Indirect Attack", "c": false, "e": "It detects hidden instructions in content."}, {"t": "Protected Materials", "c": true, "e": "It detects copyrighted text or code in the output, including lyrics, articles and recipes."}], "concept": "Protected Materials is a risk and safety evaluator for output that reproduces protected content. For text, it checks whether the model output contains copyrighted material such as song lyrics, recipes and published articles. A separate code variant looks for protected code (licensed code).\n\nFor a lyrics assistant this is the right evaluator. Use it on adversarial prompts too, such as \"write the full lyrics of ...\", to see how often the assistant complies.\n\nCode Vulnerability checks for insecure code in generated code. Ungrounded Attributes checks whether the answer infers sensitive attributes about people (such as emotional state) that the input does not support. Indirect Attack evaluates how an application behaves against indirect prompt injection.\n\nMemory aid: Protected Materials = \"did it recite someone else's work?\".", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators"], "ref": ["responsible-ai-governance"]}, {"d": 1, "q": "Every night an indexer loads about 20,000 documents into Azure AI Search. Users report that new documents are sometimes missing from results. Which monitoring step gives the quickest view of ingestion quality?", "o": [{"t": "Compare the number of documents found with the number indexed, and review the failed-document list in the indexer status or execution history", "c": true, "e": "Counts and failures show whether documents were skipped or rejected."}, {"t": "Increase the temperature of the chat model", "c": false, "e": "Generation settings do not affect ingestion."}, {"t": "Add more replicas of the chat model deployment", "c": false, "e": "Chat capacity is unrelated to indexing."}, {"t": "Turn on the semantic ranker", "c": false, "e": "Ranking does not reveal missing documents."}], "concept": "A RAG system has an offline pipeline that collects, extracts, enriches, chunks, embeds and indexes content. Monitoring this pipeline is separate from monitoring the model. The first step is counts: how many documents were found in the source and how many were indexed, plus the list of failed documents with their errors.\n\nIn Azure AI Search, check the indexer status in the portal or with the Get Indexer Status API, review the execution history for skill errors, and then run a query to verify the results. Use a debug session to see the enriched tree when content looks wrong. A search service runs one indexer job per search unit and indexers have no dedicated compute, so run times vary and heavy indexing can throttle queries.\n\nAlso watch embedding throttling: documents that were throttled are caught by the next scheduled run.\n\nFix the pipeline first; no model setting can bring back a document that was never indexed.", "src": ["https://learn.microsoft.com/en-us/azure/search/search-indexer-overview", "https://learn.microsoft.com/en-us/azure/search/cognitive-search-concept-intro"], "ref": ["azure-ai-search-configuration", "rag-retrieval-and-grounding"]}, {"d": 1, "q": "A compliance team wants to keep traces in Application Insights for debugging but restrict who can see content that may include sensitive user text and tool arguments. Which approach fits the guidance?", "o": [{"t": "Put secrets in span attributes so they can be searched", "c": false, "e": "Do not put secrets in prompts, arguments or span attributes."}, {"t": "Redact or minimize personal data before it reaches telemetry, and route sensitive content to a dedicated table with restricted access", "c": true, "e": "Traces can contain user text, model output and tool arguments and need the same controls as production logs."}, {"t": "Turn off all access controls on the workspace to simplify debugging", "c": false, "e": "Traces can contain personal data and need protection."}, {"t": "Keep the data forever regardless of retention policy", "c": false, "e": "Apply the same access controls and retention as production logs."}], "concept": "A trace records user inputs, model outputs, tool calls with arguments and results, token use and timing. That makes it very useful for debugging and also a privacy risk. The privacy guidance has four parts: do not put secrets in prompts, tool arguments or span attributes; redact or minimize personal data before it reaches telemetry; apply the same access controls and retention as for production logs; and, where needed, route sensitive content to a dedicated table with restricted access.\n\nRetention and sampling follow your Application Insights configuration, and viewing traces in the portal needs a Log Analytics reader role.\n\nFor audit, use diagnostic settings to Log Analytics for questions like \"who called which deployment and when\". Allow for the cost of telemetry volume.\n\nDebugging value and privacy are balanced by design, not by turning off tracing.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/observability/concepts/trace-agent-concept", "https://learn.microsoft.com/en-us/azure/foundry/concepts/observability"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 1, "q": "A central team plans one Foundry resource that will hold 40 separate model deployments for all business units. During setup, creation of further deployments fails after a certain number. What is the most likely cause and the right design response?", "o": [{"t": "The subscription ran out of projects, so delete projects", "c": false, "e": "A resource can hold up to 250 projects, which is not the limit being hit."}, {"t": "The custom headers limit was exceeded, so send fewer headers", "c": false, "e": "Too many custom headers returns HTTP 431 at request time, not a failure to create deployments."}, {"t": "A resource allows at most 32 model deployments, so split the workloads across more Foundry resources", "c": true, "e": "This is a documented per-resource limit; splitting by environment or business unit also improves isolation."}, {"t": "Deployments are limited by the number of users, so remove users", "c": false, "e": "User count does not limit deployments."}], "concept": "Foundry sets hard limits that influence design. One subscription can hold 100 Foundry resources per region. One resource can hold 250 projects and 32 model deployments. A request can carry at most 10 custom headers; more gives HTTP 431.\n\nWhen a team needs more than 32 deployments, the answer is not a quota increase but a design change: use more Foundry resources. This fits other guidance as well. Separate resources per environment (experiment, test, production) or per major workload isolate quota, policy, data and the blast radius of mistakes.\n\nWhen you see a failure at a specific number, match it to the table of limits before assuming a bug.\n\nMemory aid: 100 resources per region, 250 projects, 32 deployments, 10 headers.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/quotas-limits"], "ref": ["capacity-cost-and-throttling", "platform-network-and-reliability"]}, {"d": 1, "q": "A security architect wants to stop a compromised agent from sending data to arbitrary internet addresses. The agent runs in an injected subnet. Which network design implements egress control?", "o": [{"t": "Removing the network security group from the subnet", "c": false, "e": "This removes a layer of control."}, {"t": "Public network access enabled on every dependency", "c": false, "e": "This opens more paths, not fewer."}, {"t": "A dedicated agent subnet with a user-defined route to Azure Firewall and FQDN allow rules", "c": true, "e": "Outbound traffic is forced through a firewall that permits only approved destinations."}, {"t": "A shared subnet used by all workloads in the company", "c": false, "e": "The agent subnet is dedicated to one Foundry resource and cannot be shared."}], "concept": "Network isolation has an inbound side and an outbound side. Inbound traffic reaches Foundry through private endpoints with public access disabled. Outbound traffic from the agent runtime uses virtual network injection into a delegated subnet (delegated to `Microsoft.App/environments`).\n\nEgress control limits where the agent may send data. The recommended design is a dedicated agent subnet with a user-defined route (UDR) that sends traffic to Azure Firewall, plus fully qualified domain name (FQDN) rules that allow only approved destinations such as Microsoft Entra endpoints. Network security groups on the subnet need matching outbound rules. Do not perform TLS inspection on agent traffic, because a substituted certificate breaks connections.\n\nThis is a defense for the case where the model is tricked: even if the agent tries to send data out, the firewall refuses.\n\nHosted agents also have network egress controls (Preview) with an allow-list of destinations.", "src": ["https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat", "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks"], "ref": ["platform-network-and-reliability", "agent-safety-and-identity"]}, {"d": 1, "q": "A team wants to host an open-source model that is not available as a serverless API, on dedicated GPUs, and bills per hour. Which statement about this option is correct?", "o": [{"t": "It uses a serverless standard deployment and bills per token", "c": false, "e": "Serverless APIs bill per use. Managed compute bills for the GPU time."}, {"t": "It uses managed compute, which is billed per hour per accelerator SKU, and content filtering is not available in the preview", "c": true, "e": "Managed compute is for open-source, partner or custom models on dedicated GPUs. Learn notes that there is no content filtering in the preview, so you add your own safety layer."}, {"t": "It inherits the default guardrail `Microsoft.DefaultV2` automatically", "c": false, "e": "Content filtering is not available for managed compute in preview, so there is no guardrail unless you add one."}, {"t": "It uses the Foundry Agent Service hosted agent runtime", "c": false, "e": "A hosted agent runs your code. It is not a way to host a model."}], "concept": "Foundry offers several ways to run a model. Serverless (standard) deployments are hosted by Azure and billed per token. Managed compute is different: you rent virtual machines with GPUs that host the model for you.\n\nManaged compute is used for open-source or custom models that are not offered as serverless APIs. You choose an accelerator SKU (the GPU VM size), and you pay per hour for each instance while it exists, whether or not requests arrive. You also need VM core quota for that SKU. In the preview described in the study material, content filtering (and so the default guardrail) is not applied automatically, so you add your own safety layer, for example by calling Content Safety.\n\nHosted agents are a different feature: a runtime for agent code that you build, not a way to host a model. Per-token billing belongs to serverless deployments.\n\nMemory aid: serverless is a taxi (pay per ride); managed compute is a rented car (pay per day, even when parked).", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/foundry-models-overview"], "ref": ["model-and-service-selection"]}, {"d": 1, "q": "A global news app wants lower cost for large, delay-tolerant processing on a Global Standard deployment and, in other flows, faster responses without a capacity commitment. Which request-level options match these needs?", "o": [{"t": "Flex processing for delay-tolerant work, and priority processing for faster responses on pay-as-you-go", "c": true, "e": "Both are request-level options on Global Standard, and priority is also available on Data Zone Standard."}, {"t": "Provisioned for both needs", "c": false, "e": "It is a commitment and is billed when idle."}, {"t": "Developer for faster responses", "c": false, "e": "It has no SLA and is meant for evaluating fine-tuned models."}, {"t": "Batch for faster responses", "c": false, "e": "Batch is asynchronous with a 24-hour target."}], "concept": "Pay-as-you-go deployments offer request-level options for different priorities.\n\nFlex processing is for work that can wait. You accept slower or variable processing and, in return, get a lower price. It fits large, delay-tolerant processing such as classifying a backlog. Priority processing is for latency-sensitive requests: you pay a higher rate and get faster, more predictable responses without committing to reserved capacity.\n\nProvisioned is a different model, a capacity commitment billed by the hour, and does not give both needs at pay-as-you-go. Developer is for evaluating fine-tuned models, with no SLA. Batch is cheaper for offline jobs, but responses take up to 24 hours, so it is not for faster responses.\n\nSo the news app uses Flex for the delay-tolerant flows and Priority where speed matters, on the same Global Standard deployment.\n\nMemory aid: flex = economy shipping; priority = express shipping; provisioned = your own delivery van.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "A regulated company uses hosted agents and requires customer-managed keys for all data. Which statement about customer-managed key (CMK) coverage is correct?", "o": [{"t": "Hosted agents are only partly covered, because the `$HOME` filesystem is on platform-managed storage that is not encrypted with CMK", "c": true, "e": "Prompt agents support CMK only with bring-your-own storage, and hosted agents have this gap."}, {"t": "Hosted agents are fully covered by CMK once the Foundry resource has a key", "c": false, "e": "Learn lists the `$HOME` filesystem as not encrypted with CMK."}, {"t": "CMK for agents is configured only on the model deployment", "c": false, "e": "For agents, CMK is configured on the data stores such as Cosmos DB, Storage and AI Search."}, {"t": "CMK replaces the need for Key Vault", "c": false, "e": "Keys are held in Azure Key Vault or Azure Managed HSM."}], "concept": "Foundry supports customer-managed keys held in Azure Key Vault or Azure Managed HSM. You create or import a key, give the Foundry resource's managed identity permission to use it (with Azure RBAC on Key Vault this is the Key Vault Crypto User role), and then enable CMK on the resource, either at creation or later.\n\nFor agents the details matter. Prompt agents support CMK only with bring-your-own (customer-managed) storage, so you also configure CMK on Cosmos DB, Storage and AI Search. Hosted agents are only partly covered, because the `$HOME` filesystem is on platform-managed storage that is not encrypted with CMK.\n\nIf a compliance rule says \"all data\", the hosted-agent gap must be documented or a different design chosen.\n\nRead the coverage list for the agent type you use before promising full CMK coverage.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/customer-managed-keys"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A team plans hosted agents in a locked-down environment. After the Foundry account was created, they try to add network injection and find that it cannot be added. What is the rule?", "o": [{"t": "Hosted agents do not support any network configuration", "c": false, "e": "They support it, at account creation."}, {"t": "It is only possible with a new subscription", "c": false, "e": "The restriction is about account creation, not subscriptions."}, {"t": "For hosted agents, network injection must be set when the Foundry account is first created", "c": true, "e": "It cannot be added later, so plan the network design before creating the account."}, {"t": "Network injection can be added at any time in the portal", "c": false, "e": "Learn states that it must be set at creation for hosted agents."}], "concept": "Some network settings of a Foundry account are fixed at creation time. For hosted agents, network injection must be configured when the Foundry account is first created. It cannot be added later in the portal.\n\nThe consequence is planning: before you create the account for a locked-down environment, decide the network design (the virtual network, the delegated subnet, DNS, private endpoints) and create everything with infrastructure as code. If the account already exists without injection, you create a new account (and migrate your agents from code) rather than trying to change it.\n\nHosted agents do support network configuration, and a new subscription is not needed.\n\nThis also explains why production environments should be created by infrastructure as code: portal-created resources may not inherit the network controls you intended, and later changes may be impossible.\n\nMemory aid: some things are poured into the foundation, not added to the roof.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "You create a private endpoint for a Foundry resource and want names such as `myresource.openai.azure.com` and `myresource.services.ai.azure.com` to resolve to the private IP address inside your virtual network. Which set of private DNS zones do you link for the Foundry resource?", "o": [{"t": "`privatelink.blob.core.windows.net` for all three endpoints", "c": false, "e": "That zone is for blob storage and does not resolve Foundry names."}, {"t": "Only `privatelink.search.windows.net`", "c": false, "e": "That zone is for Azure AI Search."}, {"t": "`privatelink.cognitiveservices.azure.com`, `privatelink.openai.azure.com` and `privatelink.services.ai.azure.com`", "c": true, "e": "These are the three zones listed for a Foundry resource."}, {"t": "Only `privatelink.documents.azure.com`", "c": false, "e": "That zone is for Azure Cosmos DB for NoSQL."}], "concept": "A private endpoint gives a service a private IP address inside your virtual network. But applications use names, not IP addresses. If the name still resolves to the public IP, traffic does not use the private endpoint. So private networking has two halves: the private endpoint, and DNS that returns the private address.\n\nEach Azure service has its own private DNS zone names. For Foundry these are `privatelink.cognitiveservices.azure.com`, `privatelink.openai.azure.com` and `privatelink.services.ai.azure.com`. For Azure AI Search it is `privatelink.search.windows.net`, for Cosmos DB `privatelink.documents.azure.com`, and for blob storage `privatelink.blob.core.windows.net`.\n\nLink each zone to the virtual network. If you use a custom DNS server, forward those zones to the Azure DNS virtual server `168.63.129.16`.\n\nTest with `nslookup` from a VM inside the network: it must return a private address.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks", "https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "Even built-in roles such as Foundry User can delete operational data through the Agent Service APIs, and accidental deletion of dependencies could cause catastrophic loss. Which combination of controls is recommended?", "o": [{"t": "Delete locks on critical resources, Azure Policy `denyAction`, and no standing delete permissions for anyone in production", "c": true, "e": "Locks need Owner to create, and they do not protect data inside containers, indexes or individual agents and threads, so permissions matter too."}, {"t": "Delete locks only, because they protect data inside containers", "c": false, "e": "Locks do not protect the data inside containers, indexes, agents or threads."}, {"t": "Disable diagnostic logs to reduce storage", "c": false, "e": "Logs support audit and do not prevent deletion."}, {"t": "Give every developer the Foundry Owner role so that mistakes can be fixed quickly", "c": false, "e": "This increases the risk."}], "concept": "Roles control what an identity can do, and several built-in roles allow deleting agents, files or conversations through the Agent Service APIs. Accidental deletion of dependencies (Cosmos DB, Storage, Search) could remove all agent data.\n\nA layered control set works best. Delete locks (CanNotDelete) on critical resources prevent deletion of the resource itself, but they do not protect data inside containers, which can still be deleted through data-plane operations. Azure Policy with the `denyAction` effect blocks deletion operations by rule. And in production nobody should hold standing permission to delete: use just-in-time elevation when a deletion is really needed.\n\nLocks alone are not enough, as stated. Giving everyone Owner makes accidents more likely. Disabling diagnostic logs removes audit evidence.\n\nCombine them with backups: Cosmos DB continuous backup and agent definitions in source control.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/high-availability-resiliency"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "You must be able to recover Foundry Agent Service state after the accidental deletion of a Cosmos DB database. Which TWO preparations should you make before an incident?", "o": [{"t": "Rely on Foundry's built-in point-in-time restore for agents", "c": false, "e": "Learn states there is no built-in backup, disaster recovery or point-in-time restore in Agent Service."}, {"t": "Use the basic agent setup, which has almost no recovery options for resource loss", "c": false, "e": "Standard setup, with your own resources, is the one with recovery options."}, {"t": "Enable Cosmos DB continuous backup with point-in-time restore", "c": true, "e": "Restore is not possible unless continuous backup was enabled beforehand."}, {"t": "Disable delete locks so that restores are easier", "c": false, "e": "Delete locks protect critical resources from accidental deletion."}, {"t": "Define agents as code in source control and deploy them from a pipeline", "c": true, "e": "Agent Service has no built-in backup, so agent definitions must be reproducible."}], "concept": "Foundry Agent Service has no built-in point-in-time restore for agents. Recovery from accidental deletion has to be prepared before the incident.\n\nTwo preparations cover the two kinds of loss. Agent definitions (instructions, tools, model, settings) should be code in source control, deployed by a pipeline, so you can recreate them in minutes. The data (conversations, agent state) lives in Cosmos DB in the standard setup, so enable Cosmos DB continuous backup, which allows restoring the account or database to a chosen point in time. It must be enabled before the deletion; you cannot restore from a backup that was never turned on.\n\nAlso use delete locks and restricted roles to reduce the chance of deletion.\n\nThe basic agent setup keeps data in platform-managed storage, so it offers you almost no control over recovery. Disabling delete locks makes accidents more likely.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/high-availability-resiliency"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A data scientist wants to try a fine-tuned model for two days before deciding whether to keep it. They do not want to pay hourly hosting for a long-running deployment. Which deployment type is intended for this purpose?", "o": [{"t": "Developer", "c": true, "e": "It is a pay-per-token type meant for evaluating fine-tuned models, with a 24-hour deployment lifetime and no SLA."}, {"t": "Global Batch", "c": false, "e": "Batch is for asynchronous bulk jobs with a 24-hour target, not for trying a model interactively."}, {"t": "Data Zone Provisioned", "c": false, "e": "This reserves capacity inside a zone, which is a production feature."}, {"t": "Provisioned (PTU)", "c": false, "e": "It bills per hour for reserved capacity even when idle, which is wasteful for a short test."}], "concept": "Fine-tuned models normally need hosting, and hosting costs money while it runs. The Developer deployment type exists so you can evaluate a fine-tuned model without a long commitment. You pay per token, the deployment has a lifetime of 24 hours, and there is no SLA.\n\nThat last point defines when you should not use it: never for production traffic, because it has no availability promise and it expires.\n\nHow it differs from the others: Standard and Global are for normal pay-per-token traffic with shared capacity. Provisioned bills every hour for reserved capacity. Batch is cheaper but is asynchronous.\n\nRule: Developer is for evaluating fine-tuned models only. Anything customer-facing needs a type with a service level.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "A finance application must read supplier invoices and return the invoice number, due date and total for each file, with a confidence score for every field. Which choice follows the rule \"use the narrowest service that meets the requirement\"?", "o": [{"t": "Document Intelligence prebuilt invoice model, or a Content Understanding analyzer with field extraction", "c": true, "e": "Both are purpose-built for field extraction from documents and return structured values with confidence."}, {"t": "Azure Translator document translation", "c": false, "e": "Translation changes the language of a document and does not extract fields."}, {"t": "A general chat model prompted with the page images", "c": false, "e": "A model can read pages, but fields drift between calls and there is no built-in confidence per field."}, {"t": "Azure Language named entity recognition", "c": false, "e": "NER works on text and returns generic categories. It does not know invoice fields and cannot read scanned files."}], "concept": "The rule \"use the narrowest service that meets the requirement\" means choosing the most specialized tool that fully covers the need, because it is usually cheaper, faster, more predictable and easier to govern than a general model.\n\nFor invoices the need is: known fields (invoice number, due date, total), structured output, and a confidence score per field. Document Intelligence has a prebuilt invoice model that returns exactly these fields with confidence and the location of each value. Content Understanding can do the same with a field-extraction analyzer, and also adds more flexible schemas.\n\nA general chat model reading page images can also extract fields, but it is less deterministic, gives no built-in per-field confidence, and costs more tokens. Azure Language named entity recognition finds generic entities in text, not invoice fields. Translator translates; it does not extract.\n\nMemory aid: use a screwdriver for a screw. A multi-tool works, but the screwdriver is faster and fits better.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/foundry-models-overview"], "ref": ["model-and-service-selection", "content-understanding-and-document-intelligence"]}, {"d": 1, "q": "Three months after launch, a team notices that its pipeline gate has passed on every single release, even though users report regressions. Which action addresses the root cause?", "o": [{"t": "Remove the must-pass cases so the gate is simpler", "c": false, "e": "This makes the gate weaker."}, {"t": "Raise the judge model's temperature to make scores vary", "c": false, "e": "Randomness makes results noisy and does not improve coverage."}, {"t": "Add failing conversations from production as new test cases and examine the confidence intervals, because the dataset is probably too easy or too small", "c": true, "e": "Each production incident becomes a test case that the gate must pass."}, {"t": "Evaluate only the first message of every conversation", "c": false, "e": "This narrows coverage further."}], "concept": "A gate is only as good as its test data. If the dataset contains only polite, easy, familiar questions, every release looks fine. The symptom \"gate always passes\" in Learn's troubleshooting table has the cause \"dataset too easy or too small\", and the check is to add failures from production and look at the confidence interval.\n\nGood dataset hygiene: version the dataset with the code; add every production incident as a new test case; keep a small fast set (about a dozen cases) for every pull request and the full set for release candidates; include must-pass scenarios such as a refund limit or a privacy request.\n\nA worked example in the lesson: production task adherence is 4.6 and a candidate scores 4.4 with a 95% interval of 4.3 to 4.5. The interval lies entirely below the baseline, so the gate should fail even though 4.4 is above an absolute floor of 4.0.\n\nUse both an absolute and a relative rule.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluation-github-action", "https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/azure-developer-cli-evaluation"], "ref": ["cicd-for-foundry-projects"]}, {"d": 1, "q": "Application Insights costs rise after a team enables tracing for all agents. Traces are essential in production. Which statement is correct about the cost and how to manage it?", "o": [{"t": "Telemetry cost depends on Application Insights volume, and retention and sampling follow your Application Insights configuration, so tune those and avoid logging unneeded content", "c": true, "e": "Cost control sits in the Application Insights settings."}, {"t": "Tracing has a fixed free allowance that cannot be exceeded", "c": false, "e": "Costs depend on volume and retention."}, {"t": "Turn off tracing and rely on user complaints", "c": false, "e": "This removes the evidence needed for debugging and audit."}, {"t": "Sampling is not possible for traces", "c": false, "e": "Sampling follows your configuration."}], "concept": "Tracing records each step of a request: model calls, tool calls with arguments and results, token use and timing. Foundry exports traces to Azure Monitor Application Insights. The volume therefore depends on traffic and on how much content each span carries.\n\nLearn states that retention and sampling follow your Application Insights configuration and that telemetry costs depend on volume and retention. To control cost: use sampling where acceptable, set retention to what you need, avoid putting large content into attributes, and redact or minimize personal data (which also reduces risk). Route sensitive content to a dedicated, restricted table.\n\nTracing is generally available for prompt and hosted agents; workflow and external agents are Preview.\n\nKeep the telemetry that gives the most value: failures, slow spans and tool calls. Balance cost, privacy and the ability to debug.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/observability/concepts/trace-agent-concept", "https://learn.microsoft.com/en-us/azure/foundry/concepts/observability"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 1, "q": "In a CI/CD pipeline, a candidate agent version has a task adherence score of 4.4 with a 95% confidence interval of 4.3 to 4.5. The production version scores 4.6. The absolute floor in the gate is 4.0. What should the gate decide?", "o": [{"t": "Pass, because helpfulness improved", "c": false, "e": "One improved metric does not offset a regression in a critical one."}, {"t": "Fail, because the whole interval lies below the production baseline, even though the score is above the floor", "c": true, "e": "A relative-to-baseline rule catches regressions that an absolute floor hides."}, {"t": "Skip the gate, because the interval is wide", "c": false, "e": "The interval is narrow and entirely below the baseline."}, {"t": "Pass, because 4.4 is above the floor of 4.0", "c": false, "e": "This uses only the absolute rule and hides the regression."}], "concept": "A release gate should not rely only on an absolute number. It should combine an absolute floor with a comparison against the current production version, using statistics.\n\nTask adherence is scored on a scale (here about 1 to 5). The candidate's mean score is 4.4 and the 95% confidence interval is 4.3 to 4.5. A confidence interval is the range in which the true value probably lies. Production scores 4.6, which is above the whole interval, so the candidate is very probably worse. It passes the floor of 4.0, but a floor alone would let a real regression through.\n\nSo the gate fails. An improvement in a different metric such as helpfulness does not cancel a regression in a critical metric. A wide interval is a reason to run more test cases, not to skip the gate.\n\nMemory aid: the floor stops disasters; the baseline comparison stops slow decline.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluation-github-action"], "ref": ["cicd-for-foundry-projects"]}, {"d": 1, "q": "A customer-facing copilot runs 24 hours a day with high, steady traffic and a strict latency objective. Occasional bursts exceed the reserved capacity, and those requests must not fail. Which design fits best?", "o": [{"t": "A Provisioned deployment with spillover to a Standard deployment in the same Foundry resource", "c": true, "e": "Provisioned gives reserved capacity and consistent latency for steady load. When it is full and returns 429, spillover sends the overflow to a standard deployment."}, {"t": "A Batch deployment", "c": false, "e": "Batch is asynchronous with a 24-hour target and cannot serve interactive traffic."}, {"t": "A Global Standard deployment only", "c": false, "e": "Shared capacity is best effort. Heavy sustained use can show more latency variability and there is no latency target."}, {"t": "A Developer deployment", "c": false, "e": "It has no SLA and is meant only for evaluating fine-tuned models."}], "concept": "Provisioned deployments reserve dedicated capacity, measured in PTUs (provisioned throughput units). The reservation gives predictable latency and throughput for steady traffic, but it has a fixed ceiling. When requests arrive faster than the reserved capacity can serve, the deployment answers 429 instead of queueing them.\n\nSpillover solves the ceiling. You configure a standard (pay-per-token) deployment in the same Foundry resource as the overflow target. When the provisioned deployment is full, requests that would be rejected are served by the standard deployment instead. You can enable it for all requests on the deployment, or per request with the `x-ms-spillover-deployment` header. Clients keep calling the same endpoint, so no code changes.\n\nThe result is a cost-efficient design: the baseline load runs on reserved, predictable capacity, and only the bursts pay per token.\n\nA Global Standard deployment alone gives no latency guarantee. Batch is asynchronous. Developer is for evaluating fine-tuned models and has no SLA.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/provisioned-throughput"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "A compliance team requires that a Foundry resource cannot be reached over the public internet. Applications in a virtual network and users on-premises (over VPN) must still be able to call it. Which configuration meets the requirement?", "o": [{"t": "Application Gateway with WAF in front of the resource", "c": false, "e": "A gateway adds a public front door. It does not make the resource itself private."}, {"t": "A private endpoint for the resource in your virtual network, with public network access set to Disabled", "c": true, "e": "A private endpoint gives the resource a private IP in your VNet, works from peered networks and from on-premises over VPN or ExpressRoute, and disabling public access removes the internet path."}, {"t": "A service endpoint on the application subnet with a firewall rule", "c": false, "e": "The resource keeps its public IP and DNS still resolves to it. Service endpoints are not reachable from on-premises by default."}, {"t": "An IP firewall that allows only the corporate egress addresses", "c": false, "e": "The endpoint is still publicly addressable. An allow list restricts callers, but the service is not private."}], "concept": "Azure services are reachable by default through a public endpoint. Network isolation means giving the service a private path and turning the public path off.\n\nA private endpoint creates a network interface with a private IP address from your virtual network and connects it to one specific resource (Azure Private Link). Names such as `myresource.cognitiveservices.azure.com` then resolve to that private IP. Once it works, you set public network access to Disabled, so the public endpoint stops answering. Traffic from the virtual network, and from on-premises networks connected through VPN or ExpressRoute, can reach it; the internet cannot.\n\nA service endpoint is different. It keeps the public IP and only tells the service to accept traffic that comes from a given subnet. An IP firewall allows listed public addresses. Application Gateway with WAF protects web apps, not the access path to a Foundry resource.\n\nMemory aid: a private endpoint is a private door built inside your own building; a service endpoint is a guest list at the public front door.", "src": ["https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview", "https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "In a network-secured setup, the Agents page in the Foundry portal shows a timeout when loading, although the model deployments work. Which cause is most likely?", "o": [{"t": "The agent has too many versions", "c": false, "e": "Versions do not cause a network timeout."}, {"t": "The guardrail is in annotate-only mode", "c": false, "e": "Guardrail mode affects content decisions."}, {"t": "The model deployment is Global Standard", "c": false, "e": "Deployment type does not affect the Agents page."}, {"t": "The portal cannot reach Azure Cosmos DB, because of a missing private endpoint or DNS configuration", "c": true, "e": "The Agents page reads agent data from Cosmos DB, and unreachable private resources cause timeouts."}], "concept": "In the standard agent setup, conversations, agent definitions and run state live in your Azure Cosmos DB account, files in Storage and vector stores in Azure AI Search. With network isolation, all of these are reached through private endpoints, and names must resolve to private IPs through linked private DNS zones.\n\nThe symptom \"timeout loading the Agents page\" points to Cosmos DB: either its private endpoint is missing, or the DNS zone `privatelink.documents.azure.com` is not linked, or the person's network cannot reach the private endpoint. The model deployments can still work because they use a different path.\n\nTo diagnose, run `nslookup` from a machine in the network. A private IP means DNS is right. To use the portal against a locked-down project, use a VPN gateway, ExpressRoute, or Azure Bastion to a jump box inside the network.\n\nName resolution failures are the most common private networking problem.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "The security team wants to audit which identity called which model deployment and when, query the history with KQL, and make no code changes in the applications. What should you configure?", "o": [{"t": "An evaluation run on production traffic", "c": false, "e": "Evaluations score quality and safety. They do not record who called a deployment."}, {"t": "Metrics explorer charts on the resource", "c": false, "e": "Metrics show aggregated numbers (tokens, calls, status codes) but not the per-request detail needed for an audit trail."}, {"t": "A diagnostic setting on the Foundry resource that sends the log categories (such as RequestResponse and Audit) to a Log Analytics workspace", "c": true, "e": "Platform logs are routed with a diagnostic setting and queried with KQL. No application change is needed."}, {"t": "OpenTelemetry tracing added to each application", "c": false, "e": "Tracing needs instrumentation code, which the requirement rules out, and it is aimed at debugging runs."}], "concept": "Azure produces two kinds of monitoring data: metrics (numbers over time, such as token counts) and resource logs (records of events, such as who called what). Auditing \"who called which deployment and when\" needs logs.\n\nFoundry Models resources write logs in categories such as RequestResponse, Trace and Audit. By default they go nowhere. A diagnostic setting is the routing rule that sends chosen categories to a destination: a Log Analytics workspace (query with KQL), a storage account (cheap archive) or Event Hubs (streaming). It is configured on the resource, so applications do not change at all.\n\nWhy the other options fail: metrics explorer shows aggregated numbers, not individual calls with identities; OpenTelemetry tracing needs code changes in each app and shows app-level behavior; an evaluation run scores quality, not access.\n\nHow it relates: logs answer \"who and when\" for security, traces answer \"what happened inside one request\" for debugging, and evaluations answer \"how good\" for quality.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/monitor-models"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 1, "q": "A bank needs a network-secured Foundry Agent Service in which it owns the conversation data, uploaded files and vector stores. Which resources are required for the standard agent setup?", "o": [{"t": "No extra resources, because the basic setup is already private", "c": false, "e": "The basic setup uses platform-managed storage and gives no ownership."}, {"t": "Azure Cosmos DB for NoSQL, Azure Storage and Azure AI Search, all with private endpoints", "c": true, "e": "Conversations and agent state go to Cosmos DB, files to Storage and file-search vector stores to AI Search. A network-secured standard setup requires all three."}, {"t": "Azure SQL Database and Azure Cache for Redis", "c": false, "e": "These are not the BYO resources of the Agent Service standard setup."}, {"t": "Only Azure Storage, because it can hold files and state", "c": false, "e": "Conversation state needs Cosmos DB and vector stores need AI Search."}], "concept": "Foundry Agent Service needs places to keep state. In the basic setup Microsoft manages that storage. In the standard setup you bring your own resources, so you own the data and can secure it with your own network rules and keys.\n\nThere are three dependencies, each for a different kind of data: Azure Cosmos DB for NoSQL stores conversations and agent state, Azure Storage stores uploaded files, and Azure AI Search stores vector stores for retrieval. For a network-secured setup, each of the three gets a private endpoint, and the private DNS zones must resolve them inside the virtual network.\n\nStorage alone cannot hold the conversation database or a search index. SQL Database and Redis are not the supported dependencies. The basic setup is not the \"own your data\" option, so \"no extra resources\" does not meet the bank's requirement.\n\nRemember also the roles: the project's managed identity needs data-plane roles on all three resources.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/use-your-own-resources"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A security review finds that agent traces in Application Insights contain customers' phone numbers and one API key that was placed in a tool argument. What should you do?", "o": [{"t": "Turn off tracing in production", "c": false, "e": "This removes the ability to debug and does not fix the practice of leaking secrets."}, {"t": "Redact or minimize personal data and never place secrets in prompts, tool arguments or span attributes; apply the same access control and retention as production logs", "c": true, "e": "Traces can c
