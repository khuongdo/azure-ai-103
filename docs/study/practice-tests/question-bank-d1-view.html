om/en-us/azure/foundry/concepts/built-in-evaluators"], "ref": ["responsible-ai-governance"]}, {"d": 1, "q": "Creating the capability host for a standard agent setup fails with an error about connections. The team supplied a Cosmos DB account and a Storage account. What is the most likely missing piece?", "o": [{"t": "A second Foundry resource in another region", "c": false, "e": "The three data resources are required, not another Foundry resource."}, {"t": "A Provisioned model deployment", "c": false, "e": "Capacity does not affect the capability host."}, {"t": "The Azure AI Search resource, because a network-secured standard setup requires all three bring-your-own resources", "c": true, "e": "Cosmos DB, Storage and AI Search are all needed."}, {"t": "A public IP address for the agent runtime", "c": false, "e": "The goal is the opposite: private networking."}], "concept": "The standard agent setup puts your agent data in your own resources: conversations, agent definitions and run state in Azure Cosmos DB for NoSQL, uploaded files in Azure Storage and vector stores for file search in Azure AI Search. A network-secured standard setup requires all three. If one is missing, creation of the capability host fails with an error about connections.\n\nThis is listed in the troubleshooting symptoms: \"Capability host creation error about connections: one of the three BYO resources is missing\".\n\nOther setup facts: keep the Azure OpenAI resource, the Foundry account and the project in the same region; the Foundry resource must be in the same region as the virtual network; the agent subnet is delegated to `Microsoft.App/environments` and dedicated to one Foundry resource; and the provisioning identity and the runtime identity need different roles.\n\nCheck the list of three resources first when a creation error mentions connections.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/use-your-own-resources", "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A team wants to compare two agent versions with statistical confidence in a GitHub workflow and is worried about the cost of repeated evaluations. Which guidance applies to the evaluation GitHub Action?", "o": [{"t": "Pass only the agent name without a version", "c": false, "e": "Agents are identified as `agent-name:version`."}, {"t": "List both agents as `name:version`; the first is the baseline by default; do not run it on every commit, to control cost", "c": true, "e": "Learn advises against running it on every commit and suggests running full evaluations on release candidates."}, {"t": "It cannot compare agents", "c": false, "e": "Listing several agents compares them, with confidence intervals and pairwise comparisons."}, {"t": "Run it on every commit with the full dataset", "c": false, "e": "It increases cost."}], "concept": "The evaluation GitHub Action (preview, `microsoft/ai-agent-evals`) runs offline evaluations for Foundry agents inside a workflow. You identify agents as `agent-name:version`. Because versions are immutable, `support:3` and `support:4` are exact, comparable targets.\n\nWhen you list several agents, the Action compares them: the first one is the baseline by default. The run summary reports scores with confidence intervals and pairwise comparisons, so you can see whether a difference is real or only noise.\n\nEvaluations call a judge model and run many test cases, so they cost money and time. Microsoft advises not to run it on every commit. Run it on pull requests that change agent behavior, on a schedule, or before release.\n\nPassing only the agent name does not identify a version. And comparing agents is exactly what the Action is built for.\n\nMemory aid: a race needs a referee and a baseline runner, and you do not hold a race for every footstep.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluation-github-action"], "ref": ["cicd-for-foundry-projects"]}, {"d": 1, "q": "A team ran a red teaming exercise once before launch and considers the safety program finished. Which statement matches the guidance on the AI Red Teaming Agent?", "o": [{"t": "It only checks spelling mistakes", "c": false, "e": "It simulates attacks and scores results by risk category."}, {"t": "One run is enough because attacks never change", "c": false, "e": "Attackers adapt, so a single run goes stale."}, {"t": "It replaces all human review and needs no oversight", "c": false, "e": "It is best used with human review."}, {"t": "Run it before release and again on a schedule after release, together with continuous evaluation of sampled production traffic", "c": true, "e": "Attackers adapt, and models, prompts and data change, so testing must repeat."}], "concept": "A fixed evaluation dataset replays questions you already know. Attackers invent new ones. The AI Red Teaming Agent simulates attacks, using Microsoft's PyRIT framework (jailbreaks, prompt injection and more), and scores the target by risk category such as hate or violence. It is best used with human review.\n\nTiming matters. Run it before release. Then run it on a schedule after release (scheduled red teaming), and pair it with continuous evaluation of sampled production traffic and Azure Monitor alerts. Re-run it after any change to the model, the prompts, the tools or the guardrails, because each change can open a new gap.\n\nIn the Discover, Protect and Govern framework, red teaming belongs to Discover, and what it finds feeds Protect (new controls) and Govern (incident process and ownership).\n\nMemory aid: a fire drill once is not a fire safety program.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/observability", "https://learn.microsoft.com/en-us/azure/foundry/responsible-use-of-ai-overview"], "ref": ["agent-safety-and-identity", "responsible-ai-governance"]}, {"d": 1, "q": "An agent can issue payments of any size to suppliers. Payments cannot be reversed. The risk team asks for a human oversight pattern. Which pattern fits best?", "o": [{"t": "Human after the fact: audit a sample of payments each month", "c": false, "e": "Sampling later detects problems but cannot prevent a bad payment."}, {"t": "Human in the loop: a person approves each payment before it is executed", "c": true, "e": "The action is high impact and hard to reverse, so approval must happen before the action. Record the approver, the time and the evidence."}, {"t": "Human on the loop: a person monitors a dashboard and intervenes if needed", "c": false, "e": "Monitoring after the fact is too late for an irreversible payment."}, {"t": "No human step, because a guardrail already scans the output", "c": false, "e": "A content guardrail checks harmful content, not whether a payment is allowed."}], "concept": "Human oversight patterns differ by how early the person acts.\n\nHuman in the loop means a person must approve an action before it happens. Human on the loop means a person supervises and can step in, but the system acts first. Human after the fact means people review results later, for example by sampling.\n\nChoose by the cost of a mistake. A payment that cannot be reversed is high impact and irreversible, so the approval must come before execution: human in the loop. Monitoring a dashboard (on the loop) or a monthly audit (after the fact) would discover a bad payment only after the money has left.\n\nA guardrail is a different layer: it detects harmful content or attacks in text, but it does not know your payment policy. Business limits belong in the tool code and the approval step, not in a content filter.\n\nMemory aid: in the loop = signature before the cheque is sent; on the loop = watching the cameras; after the fact = checking the books at month end.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/responsible-use-of-ai-overview"], "ref": ["responsible-ai-governance"]}, {"d": 1, "q": "A team grants developers the Cognitive Services Contributor role to work in Foundry projects because it worked for older Azure OpenAI resources. A reviewer objects. What does the guidance say?", "o": [{"t": "Use the Foundry roles (User, Project Manager, Account Owner, Owner, Agent Consumer) instead; the older Cognitive Services roles are not recommended, except Usages Reader for quota", "c": true, "e": "Foundry roles match the platform's duties."}, {"t": "Cognitive Services roles are the only supported roles for Foundry projects", "c": false, "e": "Foundry has its own roles."}, {"t": "Azure AI Developer is the recommended replacement", "c": false, "e": "Learn advises not using it for Foundry projects."}, {"t": "Roles are not needed because projects are public by default", "c": false, "e": "Access control applies."}], "concept": "Role names carry history. Older Azure OpenAI and Azure AI services used roles named Cognitive Services Contributor or User, and hub-based projects used Azure AI Developer. Current Foundry guidance defines its own roles for Foundry resources and projects: Agent Consumer, User, Project Manager, Account Owner and Owner.\n\nThe advice is to use the Foundry roles and not the older ones, with one exception: Usages Reader (from the Cognitive Services family) is used to view quota.\n\nWhy it matters: a broad old role can grant more (or different) rights than intended, and may not give the permissions that new features need. Review role assignments when migrating from older resources.\n\nAlso give the project's managed identity the Foundry User role on the Foundry resource, or some features fail silently, and use Azure Policy to turn off local (key) authentication.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry"], "ref": ["agent-safety-and-identity", "platform-network-and-reliability"]}, {"d": 1, "q": "Security requires that nobody uses API keys to call a Foundry resource and that every call can be traced to a caller. Which TWO actions meet the requirement?", "o": [{"t": "Give every developer the Foundry Owner role", "c": false, "e": "This grants broad privileges and does not remove key access."}, {"t": "Use Azure Policy to disable key-based (local) authentication", "c": true, "e": "Policy enforces the rule for every resource, so keys cannot be used even by mistake."}, {"t": "Store the keys in Azure Key Vault and rotate them monthly", "c": false, "e": "Keys are still shared full-access credentials that cannot identify who called."}, {"t": "Share one key per team in a pipeline variable", "c": false, "e": "A shared key cannot tell individuals apart and gives full access."}, {"t": "Use Microsoft Entra ID with managed identities and role assignments for callers", "c": true, "e": "Entra gives per-caller identity and role-based limits, with no secret to leak or rotate."}], "concept": "Authentication answers \"who is calling\". With API keys, anyone who holds the key is the caller, and nothing in the request says which person or app it was. With Microsoft Entra ID, each caller is an identity (user, app or managed identity), receives a short-lived token, and is allowed only what its role assignments permit. Logs then show the identity.\n\nMeeting both requirements, no keys and traceable calls, needs two things. Use Entra ID with managed identities and give each caller a role (for example Azure AI User) at the right scope. And enforce the rule with Azure Policy, which can deny or audit resources that still have key-based (local) authentication enabled, across a whole subscription.\n\nKeys in Key Vault with monthly rotation are better stored, but they are still keys and still shared secrets. One key per team in a pipeline variable is the opposite of traceable. Foundry Owner for everyone breaks least privilege.\n\nMemory aid: a key is a house key anyone can copy; a role assignment is a named badge.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A provisioned deployment returns HTTP 429 when it is full. The team enables spillover. Which statement describes how spillover works?", "o": [{"t": "Overflow requests are sent to any deployment in any subscription of the tenant", "c": false, "e": "The target is a standard deployment in the same Foundry resource."}, {"t": "Overflow requests are redirected to a standard deployment in the same Foundry resource, for all requests or per request with the `x-ms-spillover-deployment` header", "c": true, "e": "This is the documented behavior for Azure OpenAI models."}, {"t": "Spillover doubles the PTUs of the deployment automatically", "c": false, "e": "It redirects traffic; it does not change PTU capacity."}, {"t": "Spillover works for every model, including Llama and DeepSeek deployments from other providers", "c": false, "e": "Those deployments currently do not support spillover."}], "concept": "A provisioned deployment has fixed capacity. When it is full it returns a non-200 status such as 429. The Provisioned Utilization metric (PTUs consumed divided by PTUs deployed) tells you when it is at or above 100%.\n\nSpillover handles the overflow. When enabled, requests that the provisioned deployment cannot take are redirected to a standard (pay-per-token) deployment in the same Foundry resource. You can enable it for all requests or for one request with the `x-ms-spillover-deployment` header, which names the target.\n\nThis gives you a predictable base (provisioned, consistent latency) and an elastic top (standard, pay per use). Azure OpenAI models support it. Deployments of DeepSeek and Llama from other providers currently do not.\n\nSpillover is a routing feature; it does not add capacity to the provisioned deployment.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/provisioned-throughput", "https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "A team runs a production agent in the basic agent setup. Compliance asks what could be recovered if the platform-managed conversation data were lost. What should you recommend?", "o": [{"t": "Move to the standard agent setup with your own Cosmos DB, Storage and AI Search, and configure backup before an incident", "c": true, "e": "Basic mode has almost no recovery options for resource loss; the standard setup lets you protect your own data stores."}, {"t": "Rely on the model provider to restore the conversations", "c": false, "e": "Model deployments do not store your conversation state."}, {"t": "Disable all diagnostics so the data volume stays small", "c": false, "e": "This removes visibility and does not help recovery."}, {"t": "Keep the basic setup because Foundry provides built-in point-in-time restore for agents", "c": false, "e": "Agent Service has no built-in backup, disaster recovery or point-in-time restore."}], "concept": "By default, Agent Service manages storage for files, conversations and vector stores in the basic setup. This is easy to start with, but you do not own or control the data, so recovery options are almost nonexistent.\n\nThe standard agent setup puts the data in your own resources: conversations and agent definitions in Azure Cosmos DB, uploaded files in Azure Storage, and vector stores in Azure AI Search. Because you own them, you can add continuous backup with point-in-time restore on Cosmos DB, zone-redundant or geo-redundant storage (GZRS), enough AI Search replicas, delete locks, and private networking.\n\nAgent Service itself has no built-in backup, disaster recovery or point-in-time restore. Resilience is a shared responsibility, and the backup settings must be configured before the incident.\n\nRule: need ownership, residency, keys or recovery? Choose the standard setup.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/high-availability-resiliency", "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/use-your-own-resources"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A published agent calls an Azure Storage account. The agent worked during testing, because the Foundry project's managed identity had the Storage Blob Data Reader role. After publishing, access fails. Which action restores access following least privilege?", "o": [{"t": "Delete the published agent and use the shared project identity again", "c": false, "e": "A published agent has its own identity."}, {"t": "Assign Owner on the subscription to the project managed identity", "c": false, "e": "It is excessive and does not apply to the new identity."}, {"t": "Switch the storage account to public access", "c": false, "e": "It removes the security boundary instead of fixing the role."}, {"t": "Assign the required role to the published agent's distinct agent identity, and only the access the agent needs", "c": true, "e": "Publishing creates a new identity, and permissions of the project identity do not transfer."}], "concept": "Publishing an agent creates a distinct agent identity. Roles given to the shared project managed identity during testing do not transfer. After publishing, the agent calls Storage with its new identity, which has no role, so access fails.\n\nThe least-privilege fix is to assign the required role (here, Storage Blob Data Reader at the narrowest useful scope, such as the container) to the published agent's identity, and nothing more. Add this step to your publishing checklist and verify with a smoke test.\n\nOwner on the subscription is a huge over-grant and does not even target the right identity. Deleting the published agent and using the shared identity again gives up the benefit of separate identities (per-agent audit and control). Public access removes protection.\n\nMemory aid: the new employee badge starts empty; you must load it with only the doors that employee needs.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/overview"], "ref": ["agent-safety-and-identity", "observability-and-agent-lifecycle"]}, {"d": 1, "q": "An application sends a 3,000-token policy document plus a 40-token question on every request. The first message starts with a timestamp, and `cached_tokens` is always 0. How should you change the prompt to benefit from prompt caching?", "o": [{"t": "Increase the quota", "c": false, "e": "Quota changes how much you can send, not how input tokens are billed."}, {"t": "Switch to a Batch deployment", "c": false, "e": "Batch is cheaper but asynchronous. It does not make the prefix cacheable."}, {"t": "Put the stable content (system message, policy document) first and the variable content (question, timestamp) last", "c": true, "e": "Caching needs an identical prefix of at least 1,024 tokens. A timestamp at the top changes the prefix on every call."}, {"t": "Make the prompt shorter than 1,024 tokens", "c": false, "e": "A prompt must be at least 1,024 tokens to be cached."}], "concept": "Prompt caching saves cost and latency when many requests start with the same text. The service remembers the already processed prefix of a prompt, and a later request that begins with an identical prefix of at least 1,024 tokens reuses that work. You can see it in the usage details: `cached_tokens` is above 0 on a hit.\n\nThe cache matches from the very first token. If the first message starts with a changing timestamp, the prefix is different on every request, so there is never a hit and `cached_tokens` stays 0. The fix is ordering: put stable content (system message, instructions, the 3,000-token policy) at the beginning, and variable content (the question, the timestamp) at the end.\n\nMaking the prompt shorter than 1,024 tokens disables caching. Batch is asynchronous and unrelated. More quota changes limits, not caching.\n\nResult: the policy part becomes a cached discounted prefix, and only the 40-token question and timestamp are processed fresh.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/prompt-caching"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "A team compares a model sold directly by Azure with a partner model from the Foundry catalog. Which TWO statements are correct?", "o": [{"t": "Benchmarks on the model card make testing on your own data unnecessary", "c": false, "e": "Benchmarks are averages. Your data decides."}, {"t": "Partner and community models are supported by the provider, billed through Azure Marketplace, and you should check the License tab and the provider's terms", "c": true, "e": "Wider choice comes with provider-specific support and license terms."}, {"t": "Every partner model supports quota increase requests", "c": false, "e": "Partner and community models generally do not, with Anthropic models as an exception."}, {"t": "Models sold directly by Azure are hosted, sold and supported by Microsoft and billed through Azure", "c": true, "e": "This category comes with Microsoft support and SLAs and a Responsible AI review."}, {"t": "Partner models are always covered by Microsoft SLAs", "c": false, "e": "The provider supports partner models."}], "concept": "The Foundry model catalog groups models by who sells and supports them, and this decides support, billing and legal terms.\n\nModels sold directly by Azure are hosted by Microsoft, sold under Microsoft product terms and billed through your Azure subscription. They come with Microsoft support and the Microsoft SLAs for the service. Partner and community models come from other providers. The provider is responsible for support and terms, billing for many of them goes through Azure Marketplace, and you should read the License tab on the model card and the provider's terms. Microsoft SLAs do not automatically cover them, and not every model allows quota increase requests.\n\nA benchmark on a model card is measured on public data. It helps you shortlist, but your documents, language and tasks are different, so test candidates on your own prompts before you decide.\n\nMemory aid: \"sold by Azure\" = Microsoft is the shop and the repair desk; partner model = Microsoft is the shopping mall, the brand repairs it.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/foundry-models-overview"], "ref": ["model-and-service-selection"]}, {"d": 1, "q": "A children's learning app must apply the strictest filtering for the violence category in its guardrail. Which severity threshold setting should you choose?", "o": [{"t": "Off, because the model is already safe", "c": false, "e": "Off is only available to customers approved for modified guardrails and removes protection."}, {"t": "Medium, because it is the default for all apps", "c": false, "e": "Medium flags Medium and above, which is less strict than Low."}, {"t": "Low, which flags Low severity and above", "c": true, "e": "The threshold flags content at that level and above, so Low flags the most content and is the strictest setting."}, {"t": "High, which flags only the most severe content", "c": false, "e": "High is the most permissive setting."}], "concept": "Guardrail controls for harm categories have a severity threshold. The threshold says from which severity level the content is flagged and acted upon. Severity runs from safe through Low, Medium and High.\n\nA lower threshold is stricter. \"Low\" flags content of Low severity and above, so it catches almost everything, including mild content. \"Medium\" flags Medium and High. \"High\" flags only the most severe content and lets the rest through. \"Off\" removes the check.\n\nA children's app wants the strictest filtering, so it selects the lowest threshold, Low. The cost is more false positives: some harmless content may be blocked, which is an acceptable trade-off for this audience.\n\nThe default setting is not the same for all apps, and \"the model is already safe\" is not a basis for turning controls off. Always test the chosen thresholds with real examples to find a balance between safety and usability.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview"], "ref": ["responsible-ai-governance", "agent-safety-and-identity"]}, {"d": 1, "q": "A chat application hits its tokens-per-minute limit at peak. Metrics show that most tokens are input tokens: a long system prompt, ten retrieved chunks and the full chat history are sent with every call. What should you do first?", "o": [{"t": "Increase `max_output_tokens`", "c": false, "e": "Output is not the problem here."}, {"t": "Retry every request three times", "c": false, "e": "More requests add more tokens and make throttling worse."}, {"t": "Buy Provisioned capacity immediately", "c": false, "e": "This is a larger commitment before checking the cheaper fix."}, {"t": "Shrink the prompt: shorten the system prompt, send fewer or smaller chunks and summarize old turns", "c": true, "e": "Prompt tokens are most of the traffic, and trimming them is cheaper than quota or PTU."}], "concept": "Tokens-per-minute (TPM) limits count input and output tokens. Metrics show that most tokens are input tokens: a long system prompt, ten retrieved chunks and the full chat history are sent with every call. The cheapest fix is to send fewer tokens.\n\nShrink the prompt: shorten the system prompt; send fewer or smaller chunks (a reranker can select the best three instead of ten); summarize old turns instead of resending the entire history. Each change lowers input tokens per call, which lowers cost and latency as well, and gives headroom under the same limit. Prompt caching can discount the repeated stable prefix.\n\nBuying provisioned capacity is a larger step and costs money every hour. Raising `max_output_tokens` increases the output cap, not input volume. Retrying makes more calls and consumes more tokens, which worsens throttling.\n\nMemory aid: before you rent a bigger truck, check whether you are packing empty boxes.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/quotas-limits"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "After a database incident, a team wants to restore the Cosmos DB account used by the Agent Service. A restore creates a new account with the original name, but the restore fails. Which preparation was missing?", "o": [{"t": "A larger virtual network address space", "c": false, "e": "Address space does not affect the name used by a restore."}, {"t": "A unique, organization-specific account name, with continuous backup enabled before the incident", "c": true, "e": "A restore fails if the original name is taken, and point-in-time restore is unavailable unless continuous backup was enabled beforehand."}, {"t": "A system-assigned managed identity on the Foundry project", "c": false, "e": "Learn recommends a user-assigned identity, but this does not cause a restore name conflict."}, {"t": "A Provisioned deployment for the chat model", "c": false, "e": "Model capacity has nothing to do with restoring the data store."}], "concept": "Foundry Agent Service has no built-in backup or point-in-time restore, so recovery depends on settings you configure before an incident. For Azure Cosmos DB: enable continuous backup (retention tiers of 7, 30 or 35 days) with point-in-time restore, which is unavailable unless it was enabled beforehand. Use a unique, organization-specific account name, because a restore creates a new account with the original name and fails if that name is taken. Add read replication to a failover region with service-managed failover.\n\nThe same name rule applies to Azure AI Search: use a unique, organization-specific service name. For storage, use GZRS for customer-managed failover. Use a user-assigned managed identity for the project so role assignments survive recreation, and the standard agent setup.\n\nThese checks are done in advance, not during the incident.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/high-availability-resiliency"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "An operations engineer must create a diagnostic setting on a Foundry resource that sends request and audit logs to a Log Analytics workspace. Another colleague only needs to view the metric charts. Which pair of built-in roles is the least privileged fit?", "o": [{"t": "Monitoring Reader for the engineer and Monitoring Contributor for the colleague", "c": false, "e": "This reverses the privileges, so the engineer cannot configure the setting."}, {"t": "Foundry Agent Consumer for both people", "c": false, "e": "It only allows calling agent endpoints, not viewing or configuring monitoring."}, {"t": "Foundry Owner for both people", "c": false, "e": "It is far more privileged than needed and grants build and management rights."}, {"t": "Monitoring Contributor for the engineer and Monitoring Reader for the colleague", "c": true, "e": "Contributor can configure diagnostic settings; Reader can view metrics."}], "concept": "Monitoring data comes in two forms. Metrics are collected automatically for a Foundry resource and can be viewed in metrics explorer. Logs are not collected anywhere unless you route them with a diagnostic setting, which sends chosen categories (for Foundry Models: RequestResponse, Trace and Audit) and AllMetrics to a Log Analytics workspace.\n\nTwo Azure Monitor roles fit these two jobs. Monitoring Reader lets a person view metrics. Monitoring Contributor lets a person configure diagnostic settings. Following least privilege, give each person only what the task needs.\n\nAfter you create the setting, allow up to about 15 minutes for data to appear. Collecting logs costs money, so choose only the categories you need.\n\nDo not confuse monitoring roles with Foundry roles: Agent Consumer only calls agents; Owner can do everything.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/monitor-models"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 1, "q": "A team needs more quota for a partner model from the catalog and submits a quota increase request. Support says such requests are usually not available for that model. Which statement matches the quota guidance?", "o": [{"t": "Increases are granted automatically to every request", "c": false, "e": "Priority goes to customers who already use their quota."}, {"t": "All catalog models support increases within one hour", "c": false, "e": "Requests are evaluated individually and some models do not support increases."}, {"t": "Partner and community models generally do not support quota increases (Anthropic models are an exception); an alternative is moving quota from an unused deployment", "c": true, "e": "This is the documented position."}, {"t": "Quota can be bought as a reservation for any model", "c": false, "e": "Reservations apply to provisioned capacity and do not add quota."}], "concept": "Quota is a policy limit on how much of a model you may deploy. To raise it, submit the quota increase request form, which is also available in the portal's Quota page. Requests are evaluated individually, and priority goes to customers who already use their quota. You can also move quota from an unused deployment.\n\nA special rule applies to partner and community models: they generally do not support increases, with Anthropic models as an exception.\n\nPlanning consequence: if a design depends on a partner model with high volume, check the quota options before committing, and prepare a fallback (another model, or another deployment type).\n\nRemember what quota is not: it does not guarantee capacity, and having quota does not make a deployment succeed if capacity is short. Quota limits are enforced at the subscription, not the tenant.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/quotas-limits"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "A model provider announces a new version of the model used by a production feature that parses the model output as strict JSON. How should you adopt the new version?", "o": [{"t": "Enable automatic upgrade so the deployment follows the latest version", "c": false, "e": "An automatic upgrade can change tone or format and break the JSON parser without any test."}, {"t": "Keep the current version pinned, deploy the new version beside it, evaluate both on the same golden dataset, then switch traffic by configuration", "c": true, "e": "Pinning avoids silent behavior changes. A side-by-side evaluation checks quality, safety, latency and cost before the switch, and the old deployment stays for rollback."}, {"t": "Delete the old deployment as soon as the new one is created", "c": false, "e": "Without the old deployment you cannot roll back if the evaluation reveals a regression."}, {"t": "Replace the production deployment in place on Friday and watch the logs", "c": false, "e": "This skips evaluation and gives no rollback path."}], "concept": "A model deployment is tied to a model name and a version. New versions can change tone, formatting, tool use and, for strict parsers, the exact shape of the output. A change you did not test is a production risk.\n\nSafe adoption has four steps. Pin the current version, so nothing changes by itself (set the upgrade option to no auto-upgrade). Deploy the new version beside the old one as a separate deployment. Run both on the same golden dataset (a fixed set of representative questions with expected results) and compare the scores, including the check that the output still parses as JSON. If the new version passes your release gate, switch traffic by configuration, and keep the old deployment for a while so rollback is a configuration change.\n\nWhy the others fail: automatic upgrade lets an untested version reach users; replacing in place on Friday has no comparison and no quick rollback; deleting the old deployment removes your safety net.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/foundry-models-overview"], "ref": ["model-and-service-selection"]}, {"d": 1, "q": "An administrator assigns a user a role scoped to a single published agent. The user then tries to open the project's other agents and manage the project's connections, and is denied. Why?", "o": [{"t": "Agent-scope role assignments only affect access to that agent's endpoints", "c": true, "e": "They do not give project-wide rights."}, {"t": "The user must be added to Microsoft Entra Global Administrators", "c": false, "e": "This is unrelated and over-privileged."}, {"t": "Agent-scope roles automatically inherit to all agents in the project", "c": false, "e": "They only apply to that agent's endpoints."}, {"t": "Agent-scope roles are ignored unless keys are enabled", "c": false, "e": "Keys are not needed and bypass role control."}], "concept": "Role-based access control can be assigned at several scopes: subscription, resource group, Foundry resource, project, and also a single agent. A narrower scope grants less access.\n\nLearn notes that agent-scope role assignments only affect access to that agent's endpoints. They are meant for giving an app or user permission to call one agent. They do not allow building, managing other agents or managing connections.\n\nThis supports least privilege. A line-of-business application that only calls a published agent should receive Foundry Agent Consumer (or an equivalent at agent scope), not Foundry User.\n\nRemember that API keys bypass these controls and cannot tell you who called, so use Microsoft Entra ID and managed identities.\n\nCheck the scope of a role assignment first when a person has the right role but still sees \"access denied\".", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry"], "ref": ["agent-safety-and-identity"]}, {"d": 1, "q": "An app sends a 5,000-token shared policy prefix on every request. Cache hits are high during the day, but the first request after a quiet night is slow and costly, and a staging environment in another subscription never benefits from the production cache. Which statement explains both observations?", "o": [{"t": "Caches are shared across all subscriptions of a tenant", "c": false, "e": "They are not shared between subscriptions."}, {"t": "In-memory prompt caches are usually cleared after 5 to 10 minutes of inactivity, and caches are not shared between Azure subscriptions", "c": true, "e": "Idle time clears the cache, and each subscription has its own cache."}, {"t": "Caching only works on Provisioned deployments", "c": false, "e": "It applies to Standard deployments as well, with a discount on cached input."}, {"t": "Prompt caching is permanent once a prefix is seen", "c": false, "e": "In-memory caches are cleared after inactivity and always within one hour of last use."}], "concept": "Prompt caching keeps processed input tokens temporarily, so a request that starts with the same content as an earlier one is cheaper and faster. It requires a prompt of at least 1,024 tokens whose first 1,024 tokens are identical, with further hits in 128-token increments on GPT-5.5 and earlier. It changes only latency and cost, never the output.\n\nLifetime rules: in-memory caches are usually cleared after 5 to 10 minutes of inactivity and always within one hour of last use. Extended retention on selected models can keep prefixes up to 24 hours. Caches are not shared between Azure subscriptions.\n\nSo the first call after a quiet period is a miss, and a staging subscription warms its own cache. Check the `cached_tokens` value in `prompt_tokens_details`.\n\nPut stable content first (system message, tool definitions, reference text) and variable content last.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/prompt-caching"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "Which log categories can a diagnostic setting on a Foundry resource send for Foundry Models, and which roles are needed to view metrics and to configure the setting?", "o": [{"t": "Only `AllMetrics`; the Owner role is required", "c": false, "e": "Logs and metrics are separate, and the roles named are the least-privilege ones."}, {"t": "RequestResponse, Trace and Audit; Monitoring Reader to view metrics and Monitoring Contributor to configure the diagnostic setting", "c": true, "e": "RequestResponse records each inference request with status and latency, Trace gives detailed debugging, and Audit records administrative events."}, {"t": "Evaluation and Safety; Foundry User", "c": false, "e": "These are not the log categories."}, {"t": "RequestResponse only; Foundry Account Owner", "c": false, "e": "There are three categories."}], "concept": "Monitoring data for Foundry Models comes in two forms: metrics and resource logs. A diagnostic setting can send resource log categories: RequestResponse (calls), Trace and Audit. It can also send AllMetrics.\n\nRoles control who may do what with monitoring. To view metrics you need the Monitoring Reader role. To create or edit a diagnostic setting you need Monitoring Contributor. Owner is much broader than required. Foundry roles such as Foundry User or Foundry Account Owner are about using or managing Foundry, not about monitoring settings.\n\nPractical flow: the platform team has Monitoring Contributor to define the setting once, sending the three categories to a Log Analytics workspace, and operations staff have Monitoring Reader on the resource and Log Analytics Reader on the workspace to query.\n\nMetrics are kept for 93 days; logs and longer history need the diagnostic setting.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/monitor-models"], "ref": ["observability-and-agent-lifecycle"]}]};</script>
