ontain user text, outputs and tool arguments, so privacy controls must be applied before data reaches telemetry."}, {"t": "Keep the data and shorten the retention to one day", "c": false, "e": "Secrets should not be recorded in the first place."}, {"t": "Move the traces to a public storage account", "c": false, "e": "This increases exposure."}], "concept": "Telemetry is a copy of your data. Traces can include prompts, tool arguments and results, so personal data and secrets can end up in Application Insights.\n\nThe rule is data minimization and secret hygiene. Do not place secrets (API keys, tokens, connection strings) in prompts, tool arguments or span attributes at all; use managed identity or a secret store, and let the tool fetch secrets itself. Redact or avoid recording personal data such as phone numbers, or record only what you need. Treat the telemetry store like production data: restrict access with roles, set retention, and consider the same compliance obligations as for the source data. If a key has already leaked into traces, rotate it.\n\nTurning tracing off in production gives up your best debugging tool. One-day retention keeps the data in the meantime. A public storage account is the opposite of control.\n\nMemory aid: logs are a diary; do not write passwords in it.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/observability/concepts/trace-agent-concept"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 1, "q": "A compliance officer asks to enable content filtering on an embedding model deployment, so that harmful input texts are blocked before they are vectorized. What is the correct answer?", "o": [{"t": "Use a Provisioned deployment, which filters embeddings automatically", "c": false, "e": "Deployment type does not add filtering."}, {"t": "Enable the Violence control on the embedding deployment guardrail", "c": false, "e": "Embedding deployments do not support content filtering."}, {"t": "Convert the embedding into text and send it to the model", "c": false, "e": "Embeddings are numeric vectors and cannot be converted back to meaningful text for filtering."}, {"t": "Content filtering is not available for embedding models; screen the text earlier with Azure AI Content Safety if needed", "c": true, "e": "Learn lists embedding and time-series models as not supported for content filtering."}], "concept": "Content filtering is built into serverless model deployments and can be customized. There are exceptions that Learn calls out: filtering is not available for embedding models and time-series models. Also, if you call a serverless model through an API that is not the Azure OpenAI SDK surface, you do not get filtering unless you add Azure AI Content Safety yourself.\n\nFor an embedding pipeline, put the safety check before the embedding call: scan the text with Content Safety, or filter documents at ingestion, then embed. Remember also that retrieved text is untrusted when it later reaches a chat model, so the indirect attack control at the tool response point and prompt structure matter there.\n\nAn embedding is just a list of numbers, so there is no readable output to filter.\n\nPlan filtering at the stages that produce or consume text: ingestion, prompt, tool response and output.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/foundry-models-overview", "https://learn.microsoft.com/en-us/azure/ai-services/content-safety/overview"], "ref": ["model-and-service-selection", "responsible-ai-governance"]}, {"d": 1, "q": "A company must read scanned order forms and return the text, the tables and the selection marks (checked boxes) with deterministic, structured output. A developer proposes a prompt to a general chat model. Which choice follows the guidance to use the narrowest service that meets the requirement?", "o": [{"t": "Use Azure Translator document translation", "c": false, "e": "Translator changes the language of a document; it does not extract fields or selection marks."}, {"t": "Use a general chat model with a long prompt that lists every field", "c": false, "e": "A model can read documents, but the output is less repeatable and costs more than a purpose-built extractor for a fixed job."}, {"t": "Use the Azure Language named entity recognition feature", "c": false, "e": "Language works on text, so it would need the OCR and layout step first and does not return selection marks."}, {"t": "Use Document Intelligence Layout (or a Content Understanding document analyzer)", "c": true, "e": "These services are built for OCR, tables, selection marks and structure, and they return structured output with confidence."}], "concept": "Microsoft's guidance is to use the narrowest service that meets the requirement, add a model where context and judgment are needed, and combine them when each does what it is best at. This is a \"tool check\" before a \"model choice\".\n\nThe task here is extraction from files: text from scans (OCR), tables, and selection marks. Document Intelligence Layout and Content Understanding are made for this. They give structured output, and many results include confidence scores, so you can send low-confidence results to a person. A general chat model could try, but it is slower, costs more per page and may change its answer between runs.\n\nTranslator and Language solve different jobs: changing language, and analyzing text that is already extracted.\n\nRule: purpose-built tool for the job first; a model for the parts that need reasoning.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/foundry-models-overview", "https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/prebuilt/layout"], "ref": ["model-and-service-selection", "content-understanding-and-document-intelligence"]}, {"d": 1, "q": "A GitHub Actions workflow that deploys agents runs on GitHub-hosted runners. It fails with 403 and connection errors against a Foundry resource that uses private endpoints and has public access disabled. The same commands work from a jump box inside the network. What should you do?", "o": [{"t": "Run the job on a self-hosted runner inside the virtual network", "c": true, "e": "A private Foundry blocks data-plane calls from public runners. A runner that has a route to the private endpoint can reach it."}, {"t": "Replace Microsoft Entra authentication with an API key", "c": false, "e": "A key does not help when the network path is blocked, and keys bypass role-based access control."}, {"t": "Add retry with exponential backoff to the deploy step", "c": false, "e": "Retries cannot fix a network path that is blocked by design."}, {"t": "Re-enable public network access on the resource", "c": false, "e": "This removes the isolation the security requirement asked for."}], "concept": "Azure resources have a control plane and a data plane. The control plane creates and configures resources (through Azure Resource Manager). The data plane is what you call to use the resource: create agents, upload files, send prompts.\n\nWhen a Foundry resource has private endpoints and public access disabled, the data plane is reachable only from inside the connected network. A GitHub-hosted runner is a machine on the public internet, so its data-plane calls fail with 403 or connection errors, while a jump box inside the network works. The fix is a self-hosted runner (a VM, container or scale set that you register with GitHub) placed in or peered to the virtual network, with private DNS resolving the private endpoints.\n\nOther options do not fit: enabling public access removes the isolation you were asked to keep; an API key changes authentication but not network reachability; and retries cannot fix a route that does not exist.\n\nMemory aid: the building is locked from the street, so the delivery person must be inside the building (self-hosted runner) to reach the room.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/set-up-ci-cd-cli"], "ref": ["cicd-for-foundry-projects"]}, {"d": 1, "q": "An agent application uses a model deployment in a single region. During a regional incident, requests fail and nobody fails over to another deployment. What is true about Foundry in this situation?", "o": [{"t": "Provisioned deployments are always zone redundant", "c": false, "e": "Provisioned capacity gives consistent latency, not automatic failover."}, {"t": "Foundry automatically fails over standard deployments to a paired region", "c": false, "e": "Standard deployments are single-region and are not failed over automatically."}, {"t": "Foundry copies agents to a second region continuously", "c": false, "e": "Agent Service has no built-in backup or disaster recovery."}, {"t": "Foundry does not load-balance or fail over model deployments for you; use a gateway such as API Management and Data Zone or Global deployment types", "c": true, "e": "Resilience must be designed: routing, health checks and circuit breaking in a gateway, plus deployment types that are not tied to one region."}], "concept": "Reliability design must be explicit in Foundry. A model deployment lives in one region. If that region has an incident, calls to that deployment fail.\n\nFoundry does not load-balance or fail over model deployments for you, and it does not replicate agents to a second region automatically. Standard deployments do not fail over to a paired region, and provisioned deployments are not automatically zone redundant.\n\nWhat you do: use Data Zone or Global deployment types, which spread processing over several regions inside the routing scope, and put a gateway such as Azure API Management in front of two or more deployments. The gateway does health checks, retries, priority or weighted routing and circuit breaking, so a failing backend is skipped automatically.\n\nAlso keep agent definitions as code, so they can be redeployed in another region.\n\nMemory aid: the platform gives you roads; the gateway is the GPS that reroutes around a closed road.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/high-availability-resiliency"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A research agent reads web pages and emails. Testers want an evaluator that detects attempts hidden in content, such as manipulated content, intrusion and information gathering. Which evaluator targets these?", "o": [{"t": "Indirect attack (XPIA)", "c": true, "e": "It detects attacks hidden in content that the system reads."}, {"t": "Hate and unfairness", "c": false, "e": "It scores hateful or unfair content."}, {"t": "Response Completeness", "c": false, "e": "It measures recall of expected facts."}, {"t": "Protected material", "c": false, "e": "It finds copyrighted material."}], "concept": "Two attack families matter for generative systems. A user prompt attack comes from the user: change the system rules, embed a fake conversation, role-play a persona without limits, or hide the request with encoding. An indirect (document) attack comes from a third party: a document, email, web page or tool result carries hidden commands. Its goals include manipulated content, intrusion (access to system infrastructure), information gathering, availability attacks, fraud and malware.\n\nFor measurement, the Indirect attack evaluator (XPIA) checks for such attempts. For prevention at runtime, Prompt Shields and the guardrail control for indirect attacks scan user input and tool responses. The AI Red Teaming Agent, which uses the PyRIT framework, generates attacks that the team did not think of.\n\nThe three pieces form a loop: Discover (evaluators and red team), Protect (guardrails) and Govern (policy and ownership).", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators", "https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/content-filter-prompt-shields"], "ref": ["responsible-ai-governance", "agent-safety-and-identity"]}, {"d": 1, "q": "A legal-research assistant answers questions from case documents. The product team lists transparency measures to implement. Which TWO items follow the transparency and explainability guidance?", "o": [{"t": "Keep traces of inputs, tool calls, outputs, model and version for audit", "c": true, "e": "Traces provide an audit trail."}, {"t": "Remove all limits statements to avoid discouraging users", "c": false, "e": "The system should state what it is for and what it should not be used for."}, {"t": "Assume model-explanation features exist for every Foundry model without checking", "c": false, "e": "Do not assume a specific feature; check what Learn documents."}, {"t": "Tell users they are talking to an AI and cite the sources used in grounded answers", "c": true, "e": "Disclosure and citations let users verify answers."}, {"t": "Hide the model version so that users cannot compare it with others", "c": false, "e": "Versions should be recorded, not hidden."}], "concept": "Transparency means users and auditors can understand what the system is and how it produced an answer. The guidance lists several practices. Disclose that the user is talking to AI. Cite sources in grounded answers so users can verify. State limits: what the system is for and what it should not be used for; Microsoft publishes transparency notes for its services, and your app should have its own. Keep traces for audit: inputs, tool calls, outputs, model and version.\n\nFor generated media, add provenance and labels, and remember that customers are responsible for meeting the transparency rules that apply to them.\n\nExplainability tooling needs care: do not assume that a particular model-explanation feature exists in Foundry. Use what is documented, for example citations, traces and evaluator results.\n\nTransparency also supports quality: a visible citation makes errors easier to spot.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/responsible-use-of-ai-overview", "https://learn.microsoft.com/en-us/azure/foundry/concepts/observability"], "ref": ["responsible-ai-governance"]}, {"d": 1, "q": "A security team wants alerts when users try to jailbreak the company's AI services or when data may be leaking from them. Which service provides this?", "o": [{"t": "Microsoft Defender for AI services", "c": true, "e": "It raises alerts on jailbreak attempts and data leakage."}, {"t": "Azure Policy", "c": false, "e": "It enforces configuration rules and does not detect attacks."}, {"t": "Azure Bastion", "c": false, "e": "It gives secure remote access to virtual machines."}, {"t": "Content provenance detection", "c": false, "e": "It checks where content came from."}], "concept": "Microsoft Defender for Cloud includes a plan for AI workloads, called Microsoft Defender for AI services. It provides threat protection for Azure AI services: it detects attacks such as jailbreak attempts, prompt injection, suspicious access, data exfiltration and credential theft, and creates security alerts that your security team can use.\n\nAzure Policy enforces configuration rules, it does not detect attacks at run time. Azure Bastion gives secure remote access to virtual machines. Content provenance detection checks whether media has AI-origin signals; it is not a threat detection service.\n\nHow it relates: use Policy to prevent bad configuration, guardrails to filter content at run time, red teaming to find weaknesses before release, and Defender for AI services to detect suspicious behavior in production.\n\nMemory aid: policy is the building code, guardrails are locks on doors, Defender is the security camera with alarms.", "src": ["https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat"], "ref": ["platform-network-and-reliability", "agent-safety-and-identity"]}, {"d": 1, "q": "A bank uses the standard agent setup. Three projects use Responses API agents and a fourth project uses only classic (Assistants-style) agents. All projects use the same Azure Cosmos DB account. Each Responses project needs 5 containers and the classic project needs 3 containers, each container with 1,000 RU/s. What total throughput must be provisioned for the agent data?", "o": [{"t": "18,000 RU/s", "c": true, "e": "3 projects x 5 containers x 1,000 = 15,000, plus 1 project x 3 containers x 1,000 = 3,000."}, {"t": "20,000 RU/s", "c": false, "e": "This treats every project as Responses (4 x 5 x 1,000)."}, {"t": "12,000 RU/s", "c": false, "e": "This treats every project as classic (4 x 3 x 1,000)."}, {"t": "3,000 RU/s", "c": false, "e": "This is only the minimum account throughput, not the requirement for these projects."}], "concept": "In the standard agent setup, conversations, agent definitions and run state live in your Azure Cosmos DB for NoSQL account. Each project needs 3 to 5 containers of 1,000 RU/s each. Three containers are created at provisioning, and up to two more appear when Responses API agents are used.\n\nThe rule gives a simple calculation. A project with Responses API agents needs 5 x 1,000 = 5,000 RU/s. A project with only classic agents needs 3 x 1,000 = 3,000 RU/s. Add them: 3 x 5,000 + 1 x 3,000 = 18,000 RU/s.\n\nToo little throughput causes provisioning failures. The minimum account throughput is 3,000 RU/s, and both provisioned and serverless modes are supported.\n\nKeep the Azure OpenAI resource, the Foundry account and the project in the same region, and give the Foundry account's managed identity the right Cosmos DB data-plane roles.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/use-your-own-resources"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "You size a Data Zone Provisioned deployment for `gpt-5.2`. Learn lists Input TPM per PTU = 3,400, output-to-input ratio = 8 and a scale increment of 5. Peak load is 600 requests per minute, with an average prompt of 500 tokens and an average response of 50 tokens. Forty percent of input tokens are served from the prompt cache. How many PTUs should you deploy?", "o": [{"t": "124", "c": false, "e": "This is the rounded value of 123.5 but not a valid size, because deployments scale in steps of 5."}, {"t": "55", "c": false, "e": "This counts only the uncached input (180,000 / 3,400 = 52.9) and forgets the weighted output tokens."}, {"t": "160", "c": false, "e": "This ignores the cache rate (300,000 + 240,000 = 540,000; 540,000 / 3,400 = 158.8, rounded to 160)."}, {"t": "125", "c": true, "e": "Input TPM 300,000 and output TPM 30,000. Normalized TPM = 300,000 x 0.6 + 8 x 30,000 = 420,000. 420,000 / 3,400 = 123.5, rounded up to the next increment of 5."}], "concept": "The documented formulas for sizing are:\n\nInput TPM = peak RPM x average prompt size. Output TPM = peak RPM x average response size. Normalized TPM = Input TPM x (1 - cache rate) + output-to-input ratio x Output TPM. PTUs = Normalized TPM / Input TPM per PTU, then round up to the scale increment.\n\nHere: Input TPM = 600 x 500 = 300,000. Output TPM = 600 x 50 = 30,000. Cached input is removed: 300,000 x 0.6 = 180,000. Output counts eight times: 8 x 30,000 = 240,000. Normalized = 420,000. Divide by 3,400 = 123.5. The increment is 5, so the answer is 125.\n\nNotice that output tokens are the larger part (240,000 of 420,000) although there are ten times fewer of them. Newer model families use normalized token accounting where cached tokens consume capacity, so always read the sizing page for the model.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/provisioned-throughput-sizing"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "A GitHub Actions pipeline deploys a hosted agent with the Azure Developer CLI. Which TWO practices follow the guidance?", "o": [{"t": "Skip evaluation because deployment succeeded", "c": false, "e": "The pipeline should fail the run when scores fall below thresholds."}, {"t": "Store a service principal secret in the repository", "c": false, "e": "This is exactly what OIDC avoids."}, {"t": "Run deployment manually from a laptop to stay flexible", "c": false, "e": "A pipeline gives repeatability and review."}, {"t": "Authenticate with GitHub OIDC federated credentials so that no secret is stored", "c": true, "e": "Federated credentials remove stored secrets."}, {"t": "Use a concurrency group so that two runs never deploy at the same time", "c": true, "e": "It serializes deployments."}], "concept": "A reliable deployment pipeline has two requirements here.\n\nAuthentication with GitHub OIDC federated credentials: GitHub issues a short-lived identity token for the workflow, and Azure trusts it through a federated credential on an Entra app. There is no stored secret to leak or rotate. A service principal secret in the repository is the opposite.\n\nA concurrency group: a GitHub Actions setting that allows only one run of the named group at a time. Without it, two pushes in quick succession start two deployments against the same environment, which can overwrite each other or fail.\n\nSkipping evaluation because deployment succeeded confuses \"it deployed\" with \"it works well\": the agent may deploy successfully and still give worse answers. Deploying from a laptop removes review, repeatability and audit.\n\nTypical pipeline: `azd provision`, `azd deploy`, then `azd ai agent eval run --no-prompt` that fails the job when scores fall below thresholds.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/set-up-ci-cd-cli"], "ref": ["cicd-for-foundry-projects"]}, {"d": 1, "q": "Every night, a job must classify 2 million support tickets. Results are needed by the next morning, and cost matters more than latency. Which deployment type should you use?", "o": [{"t": "Provisioned", "c": false, "e": "Reserved capacity is billed even when idle, and the job runs only a few hours per day."}, {"t": "Developer", "c": false, "e": "It is for evaluating fine-tuned models, not for production batch work."}, {"t": "Priority processing", "c": false, "e": "It costs more to get faster responses, which the job does not need."}, {"t": "Batch (Global or Data Zone)", "c": true, "e": "Batch is asynchronous, has a 24-hour target and is billed at a discount of 50%, which fits large non-urgent jobs."}], "concept": "Batch deployments process large amounts of requests asynchronously. You upload a file where each line is one request, the service works through it in the background with a 24-hour target, and you download the results. In return you get a discount (about half the price) and a separate enqueued-token quota that does not use the quota of your online deployments.\n\nTwo million tickets overnight with the result needed the next morning is the textbook case: no user is waiting, volume is large, and cost matters more than speed. Global Batch may process anywhere; Data Zone Batch keeps processing in a zone when residency matters.\n\nProvisioned reserves expensive capacity and is billed every hour, which is wasteful for a nightly job. Priority processing is a faster, higher-priced option for latency-sensitive calls. Developer is for evaluating fine-tuned models.\n\nMemory aid: batch is the overnight freight train, cheap and slow; standard is the taxi; provisioned is a private driver on retainer.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "Three product teams will build agents. Platform engineering wants one place to set network rules, role assignments, monitoring and the shared model deployments, while each team keeps its own agents and connections separate. Which structure should you use?", "o": [{"t": "One Foundry resource with a single shared project for all agents", "c": false, "e": "All agents in a project share one managed identity and one set of connections, so the teams are not separated."}, {"t": "One Azure OpenAI resource per team connected to a hub", "c": false, "e": "Hub-based projects are the classic experience, and current guidance targets Foundry resources and projects."}, {"t": "One Foundry resource with one project per team", "c": true, "e": "The resource is the administrative, security and monitoring boundary that holds model deployments; each project organizes work and access for one team."}, {"t": "One project per team, each inside its own Foundry resource", "c": false, "e": "This repeats networking, policy and deployments three times and removes the shared control point."}], "concept": "A Foundry resource is the top-level scope. It is where you set networking, policy, role-based access control, monitoring and quota, and it holds the model deployments. A project is a smaller scope inside the resource. It organizes work and enforces access for agents, tools and connections, and it has its own managed identity.\n\nThink of the resource as the building and each project as a locked office. The building has one front door, one security desk and one set of shared equipment (the model deployments). Each office has its own key and files. If you want separation between teams, add projects. If you want a different security or quota boundary, such as production versus testing, add resources.\n\nUsing one resource per team duplicates the controls. Using one shared project removes the separation, because everything in a project shares one identity. Hub-based projects belong to the older classic experience.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/what-is-foundry", "https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A chat application receives HTTP 429 responses from a standard deployment during traffic peaks. Which TWO actions should you take?", "o": [{"t": "Increase the client timeout to 29 minutes", "c": false, "e": "A longer timeout does nothing about a rate limit. Timeouts are for slow responses, not for 429."}, {"t": "Retry immediately in a tight loop until the call succeeds", "c": false, "e": "This adds load while the limit is still exceeded, so it prolongs the throttling."}, {"t": "Disable content filtering to reduce latency", "c": false, "e": "Content filtering is not the cause of 429 and removing it breaks safety requirements."}, {"t": "Ramp load up gradually and give the deployment more quota", "c": true, "e": "Sharp jumps in load trigger throttling. More quota (moved from an unused deployment or by request) raises the limit itself."}, {"t": "Retry with exponential backoff and honor the `Retry-After` header", "c": true, "e": "429 means TPM or RPM was exceeded. Waiting longer after each failure and respecting `Retry-After` is the documented client behavior."}], "concept": "HTTP 429 means \"too many requests\": you went past a rate limit on requests or tokens per minute. It is an expected, temporary signal, not a bug.\n\nThe documented response has three parts. First, retry with exponential backoff: wait a short time, then double the wait after each failure, and add a little random jitter so many clients do not retry at the same instant. Second, honor the `Retry-After` header, which tells you how long the service wants you to wait. Third, avoid sharp jumps in load by ramping traffic up gradually, and if the real demand is higher than your limit, request more quota.\n\nWhat does not help: retrying immediately in a loop adds load and keeps you throttled; turning off content filtering is unrelated to rate limits; a longer client timeout only makes the client wait longer for the same limit.\n\nMemory aid: when a shop says \"queue is full, come back in 30 seconds\", you wait and come back politely, you do not run in circles at the door.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/quotas-limits"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "A team wants to improve the quality of an assistant and has listed four options. According to the recommended improvement ladder, in which order should they try them?", "o": [{"t": "Choose a larger model, fine-tune, improve the prompt, then ground with retrieval", "c": false, "e": "A bigger model costs more per token and does not fix missing private knowledge. Cheap changes come first."}, {"t": "Improve the prompt, ground the answers with retrieval, choose a better or larger model, then fine-tune", "c": true, "e": "Climb one rung at a time and measure after each. Fine-tuning costs training and hosting and must be redone when the base model changes, so it is the last rung."}, {"t": "Ground with retrieval, fine-tune, choose a larger model, then improve the prompt", "c": false, "e": "The prompt is the cheapest lever and should be tuned first. Fine-tuning comes after the model choice, not before it."}, {"t": "Fine-tune, then ground with retrieval, then improve the prompt, then change the model", "c": false, "e": "Fine-tuning first is the most expensive and least flexible option, and it cannot add private facts reliably."}], "concept": "Quality problems are fixed cheapest-first. The recommended improvement ladder moves from the cheapest, fastest and most reversible change to the most expensive one.\n\n1. Improve the prompt. It costs nothing but time, you can test it in minutes, and it fixes many problems such as format, tone and missing instructions.\n2. Ground the answers with retrieval (RAG). If the model lacks facts, give it your data at question time. This fixes stale or private knowledge without changing the model.\n3. Choose a better or larger model. It costs more per call and adds latency, so use it when the first two steps are not enough.\n4. Fine-tune. It needs labeled data, training time and ongoing maintenance, and it teaches style or behavior, not new up-to-date facts.\n\nWhy this order: each later step is slower, costlier and harder to undo. Teams that start with fine-tuning often discover that a better prompt or retrieval would have solved the issue.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/foundry-models-overview"], "ref": ["model-and-service-selection"]}, {"d": 1, "q": "A team tries to create a deployment of a model with the Batch deployment type, but the type is not offered for that model in the chosen region. What is the correct way to resolve this?", "o": [{"t": "Restart the Foundry resource", "c": false, "e": "This does not change which types a model supports."}, {"t": "Enable key-based authentication", "c": false, "e": "Authentication does not control available deployment types."}, {"t": "Check the availability of the model by deployment type and region, then pick a supported type or region", "c": true, "e": "Not every model supports every deployment type in every region."}, {"t": "Request a quota increase until the type appears", "c": false, "e": "Quota does not add a deployment type to a model."}], "concept": "A deployment type is a combination of billing and processing scope: Standard, Provisioned, Batch, Developer and Priority, each with Global, Data Zone or regional variants. Models differ in which combinations they support. Geography-based types usually arrive last for new models, and there is no guaranteed availability date.\n\nWhen the portal or an API says the type is not available, the cause is nearly always availability, not permission or quota. The troubleshooting table lists it as \"deployment type unavailable: the model does not support that type; check availability by type and region\".\n\nCheck the model card's Deployments tab and the regions. Then decide: choose another type (for example Global Standard), another region, or another model.\n\nThe quota page shows the limit by scope; if it shows 0 available, move quota or request an increase. That is a different symptom.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types", "https://learn.microsoft.com/en-us/azure/foundry/foundry-models/quotas-limits"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "A team put delete locks on its Cosmos DB account, Storage account and AI Search service. A few weeks later, an engineer with the Foundry User role deletes all conversation threads through the Agent Service API. Why did the locks not prevent this?", "o": [{"t": "Locks are removed automatically after 30 days", "c": false, "e": "Locks stay until someone removes them."}, {"t": "Delete locks only work on Sundays", "c": false, "e": "Locks have no schedule."}, {"t": "Foundry User cannot delete anything, so the report must be wrong", "c": false, "e": "Even built-in roles such as Foundry User can delete operational data through the Agent Service APIs."}, {"t": "Locks protect the Azure resources, not the data inside containers, indexes or individual agents and threads; no built-in role is read-only for these operations", "c": true, "e": "Operational data can be deleted through the API, so standing delete permissions should not be granted."}], "concept": "A delete lock stops someone from deleting an Azure resource, for example the whole Cosmos DB account. It does not stop someone from deleting data inside the resource: documents in containers, entries in an index, or agents and threads removed through the Agent Service APIs.\n\nLearn notes that even built-in roles such as Foundry User can delete operational data through those APIs, and no built-in AI role is read-only for them. So in production you should grant standing delete permissions to no one, use Azure Policy `denyAction` and delete locks on critical resources, keep continuous backup, and define agents as code so they can be recreated.\n\nLocks need Owner to create. They are one layer of several.\n\nThink of a lock as a padlock on the filing cabinet: it does not stop someone who has the key from shredding the papers inside.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/high-availability-resiliency"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "Two teams build agents on one platform. Team A's agents must not see Team B's data, and production must be isolated from experiments in quota, policy and blast radius. Which structure fits?", "o": [{"t": "A separate Foundry resource for production and separate projects per team with project-level connections and scoped roles", "c": true, "e": "The resource is the boundary for networking, policy, RBAC and quota. Projects separate access patterns, and project-level connections avoid inheriting resource-level connections."}, {"t": "One Foundry resource and one project for everything, separated by naming conventions", "c": false, "e": "Names do not enforce access. All agents in a project share one managed identity."}, {"t": "One project per agent with all connections defined at resource level", "c": false, "e": "Resource-level connections are inherited by future projects."}, {"t": "Separate Azure subscriptions per agent", "c": false, "e": "This is far more than the requirement needs and complicates governance."}], "concept": "Foundry has levels of structure, and each level is a boundary for something different.\n\nA Foundry resource is the top boundary for administration, networking, policy, quota and monitoring. A project, inside a resource, is the working area for a team: its agents, files, connections and role assignments. Agents in a project share one managed identity (until published), and connections defined at project level are visible only to that project.\n\nTo isolate production from experiments in quota, policy and blast radius, use separate resources (production versus non-production). To keep Team A away from Team B's data, use separate projects, define connections at project level, and scope roles to each project.\n\nNaming conventions are not access control. Connections at resource level are inherited by all projects, which breaks isolation. A subscription per agent is heavy and unnecessary.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/what-is-foundry"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A churn-prediction model deployed to an Azure Machine Learning online endpoint receives production data that gradually differs from the training data. You want a scheduled check and an alert when a threshold is exceeded. What should you configure?", "o": [{"t": "An Application Insights availability test", "c": false, "e": "It checks reachability, not data distribution."}, {"t": "Azure Machine Learning model monitoring with a data drift signal compared with a baseline, with alert notification", "c": true, "e": "Built-in signals are data drift, prediction drift and data quality, and a default alert email goes to the person who set up the monitor."}, {"t": "Foundry continuous evaluation with the Groundedness evaluator", "c": false, "e": "This evaluates LLM answers, not tabular model inputs."}, {"t": "A diagnostic setting for the Cognitive Services resource", "c": false, "e": "Logs do not compare distributions with a baseline."}], "concept": "Azure Machine Learning (Azure ML) is the platform for custom machine learning models, such as a churn predictor on an online endpoint. Its monitoring feature is called model monitoring.\n\nModel monitoring compares production data with a baseline, usually the training data, using signals. Data drift measures how the distribution of input features changes. Prediction drift measures output changes, data quality checks missing or invalid values, and there are signals for feature attribution drift and model performance. You schedule the monitor, set a threshold per signal, and configure notifications. By default an alert email goes to the user who created the monitor.\n\nFoundry continuous evaluation with Groundedness is for generative AI answers, not for a tabular churn model. An availability test checks that an endpoint responds. A diagnostic setting sends logs and metrics but does not compute drift.\n\nMemory aid: drift is the world changing away from what the model was trained on.", "src": ["https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-model-performance"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 1, "q": "A team has an existing Azure OpenAI resource with deployments, keys and state, and wants the current Foundry experience without changing the endpoint that applications use. Which statement is correct?", "o": [{"t": "There is no way to keep the endpoint, so every application must be rewritten", "c": false, "e": "An upgrade path exists."}, {"t": "You can upgrade the Azure OpenAI resource to a Foundry resource while keeping its endpoint, keys and state", "c": true, "e": "Learn documents this upgrade path."}, {"t": "Upgrading deletes all deployments, which must be recreated", "c": false, "e": "Deployments are kept."}, {"t": "The upgrade requires moving to a hub-based project", "c": false, "e": "Hub-based projects are the classic experience."}], "concept": "Foundry has changed shape over time. Older setups used hub-based projects (a hub, an Azure OpenAI resource and AI Services) and the classic experience. The current model uses a Foundry resource with projects. There is no direct upgrade path for agents, files, conversations or vector stores from hub-based projects to Foundry projects, nor from Azure OpenAI Assistants to Foundry agents, although you can reuse model deployments and quota.\n\nA different case is an Azure OpenAI resource: you can upgrade it to a Foundry resource while keeping the endpoint, keys and state. This is the lowest-risk way to adopt the new experience for applications that already call the Azure OpenAI endpoint.\n\nSDK note: hub-based projects used a connection string, and Foundry projects use a project endpoint; current SDKs no longer accept connection strings. Package version 1.x targets classic and 2.x targets the new Foundry.\n\nPlan the migration of agents separately, since their state does not move.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/what-is-foundry", "https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/sdk-overview"], "ref": ["platform-network-and-reliability", "foundry-sdk-and-generative-apps"]}, {"d": 1, "q": "A line-of-business application only needs to call published agent endpoints. Developers should be able to build in the project, and one lead should publish agents. Which role assignment follows least privilege?", "o": [{"t": "The Azure AI Developer role for the application", "c": false, "e": "This role is not recommended for Foundry projects."}, {"t": "Foundry Agent Consumer for the application, Foundry User for developers and Foundry Project Manager for the lead", "c": true, "e": "Consumer calls agents only, User builds in a project, and Project Manager can publish agents."}, {"t": "Foundry Owner for everyone", "c": false, "e": "This gives broad privileges to all."}, {"t": "Foundry Account Owner for developers", "c": false, "e": "Account Owner manages accounts and models but cannot build in projects."}], "concept": "Least privilege means each identity gets the smallest set of permissions for its job. Foundry has built-in roles with different reach.\n\nFoundry Agent Consumer allows interacting with published agent endpoints and nothing more. That is right for the application that only calls agents. Foundry User allows building and developing in the project (create and test agents, use models, run evaluations) without managing access, so it fits developers. Foundry Project Manager can also publish agents and assign roles within the project, so only the lead gets it. Owner roles give broad control, including access management, and are far more than needed.\n\nThe Azure AI Developer role is a broader developer role and gives the application too much access.\n\nMemory aid: customer at the counter (Consumer), staff in the workshop (User), shop manager with keys to the safe (Project Manager).", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry"], "ref": ["agent-safety-and-identity", "platform-network-and-reliability"]}, {"d": 1, "q": "You size a Data Zone Provisioned deployment. Peak load is 1,000 requests per minute, with an average prompt of 200 tokens and an average response of 20 tokens. For this model, one PTU provides 3,400 input TPM, the output-to-input ratio is 8, and deployments scale in increments of 5 PTUs. The model does not use normalized token accounting, and 50% of input tokens are served from the prompt cache. The formula is: Normalized TPM = Input TPM x (1 - cache rate) + ratio x Output TPM; PTUs = Normalized TPM / input TPM per PTU, rounded up to the increment. How many PTUs do you deploy?", "o": [{"t": "77 PTUs", "c": false, "e": "This is the unrounded value rounded up to the next integer. The deployment scales in steps of 5."}, {"t": "80 PTUs", "c": true, "e": "Input TPM = 200,000 and output TPM = 20,000. Normalized TPM = 100,000 + 8 x 20,000 = 260,000. 260,000 / 3,400 = 76.47, which rounds up to 80 with an increment of 5."}, {"t": "110 PTUs", "c": false, "e": "This is the result with a 0% cache rate (360,000 / 3,400 = 105.88, rounded up to 110)."}, {"t": "60 PTUs", "c": false, "e": "This ignores the output-token weight of 8, which dominates the calculation."}], "concept": "Provisioned deployments are sized in PTUs (provisioned throughput units). A PTU is a unit of reserved model processing capacity. To find how many you need, convert your traffic into normalized tokens per minute and divide by what one PTU can process.\n\nStep 1: tokens per minute. 1,000 requests/min x 200 prompt tokens = 200,000 input TPM. 1,000 x 20 response tokens = 20,000 output TPM.\n\nStep 2: the formula in the question. Output tokens are heavier than input tokens, so they are multiplied by the ratio 8. Cached input is cheaper: with a 50% cache rate only half of the input counts. Normalized TPM = 200,000 x (1 - 0.5) + 8 x 20,000 = 100,000 + 160,000 = 260,000.\n\nStep 3: divide by 3,400 per PTU: 260,000 / 3,400 = 76.47 PTUs. Deployments scale in increments of 5, so round up to 80.\n\nRounding down to 77 or 75 would under-provision, and the deployment would return 429 at peak.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/provisioned-throughput"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "An evaluation gate in a pipeline sometimes passes and sometimes fails for the same agent version, with a small dataset of 15 cases and an LLM judge. What is the most likely cause and the right response?", "o": [{"t": "The pipeline needs a lower threshold so that it always passes", "c": false, "e": "Lowering the gate hides regressions."}, {"t": "The agent code changes every time the pipeline runs", "c": false, "e": "The version is the same, so the code does not change."}, {"t": "Evaluation cannot be repeatable, so remove the gate", "c": false, "e": "Gates can be made stable with a better dataset."}, {"t": "Judge variance with a tiny sample; run the evaluation twice and widen the dataset", "c": true, "e": "A small sample and judge variability make results noisy."}], "concept": "An evaluation gate is a pass or fail decision that blocks a release. For it to be useful it must be stable. Learn's troubleshooting lists the causes: a flaky gate comes from judge variance and a tiny sample. Most evaluators are AI-assisted, so a judge model scores each case, and a judge can vary a little from run to run.\n\nPractical fixes: run the evaluation twice and compare, widen the dataset (keep a small fast set for pull requests and the full set for release candidates), and use confidence intervals when comparing versions. A gate should combine an absolute floor, a rule relative to the baseline, must-pass cases and a budget.\n\nThe opposite problem, a gate that always passes, comes from a dataset that is too easy or too small: add real failures from production.\n\nVersion the dataset with the code.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluation-github-action", "https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/azure-developer-cli-evaluation"], "ref": ["cicd-for-foundry-projects"]}, {"d": 1, "q": "You size a Global Provisioned deployment for a model with Input TPM per PTU = 3,400, output-to-input ratio = 8 and a scale increment of 5. Peak load is 2,000 requests per minute, with an average prompt of 300 tokens and an average response of 30 tokens. There is no caching. How many PTUs should you deploy?", "o": [{"t": "230", "c": false, "e": "This assumes a 50% cache rate that the question does not give (780,000 / 3,400 = 229.4, rounded to 230)."}, {"t": "318", "c": false, "e": "This rounds the result but not to a valid increment of 5."}, {"t": "180", "c": false, "e": "This ignores the weighted output tokens (600,000 / 3,400 = 176.5, rounded to 180)."}, {"t": "320", "c": true, "e": "Input TPM = 600,000 and output TPM = 60,000. Normalized = 600,000 + 8 x 60,000 = 1,080,000. 1,080,000 / 3,400 = 317.6, rounded up to the next step of 5."}], "concept": "Provisioned sizing uses a fixed recipe. Input TPM = peak RPM x average prompt size. Output TPM = peak RPM x average response size. Normalized TPM = Input TPM x (1 - cache rate) + output-to-input ratio x Output TPM. PTUs = Normalized TPM / Input TPM per PTU, rounded up to the scale increment.\n\nStep by step: 2,000 x 300 = 600,000 input TPM. 2,000 x 30 = 60,000 output TPM. With no cache, nothing is removed from the input. Output counts eight times, so 8 x 60,000 = 480,000. Normalized = 600,000 + 480,000 = 1,080,000. Divide by 3,400 = 317.6. Round up to a multiple of 5: 320.\n\nGlobal and Data Zone provisioned deployments have a minimum of 15 PTUs and scale in steps of 5 for most current models. The portal has a capacity calculator, and benchmarking with representative traffic is the most accurate check.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/provisioned-throughput-sizing"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "A European insurer runs a claims assistant 24 hours a day with steady high traffic and a strict latency target. Regulation requires inference processing to stay in the EU, but any EU country is acceptable. Which design best balances residency, consistency and burst handling?", "o": [{"t": "A Global Batch deployment", "c": false, "e": "Batch is asynchronous with a 24-hour target."}, {"t": "A Global Standard deployment, because it has the highest quota", "c": false, "e": "Global may process in any region and has no latency promise."}, {"t": "A regional Standard deployment only", "c": false, "e": "Standard is single-region, shared and best effort, which does not meet a strict latency target."}, {"t": "A Data Zone Provisioned deployment with spillover to a Data Zone Standard deployment, behind an API Management gateway", "c": true, "e": "Data Zone keeps processing in the EU, provisioned gives consistent latency and spillover absorbs bursts."}], "concept": "Deployment choice comes from two questions: pay per token or reserve capacity, and where may data be processed. Global may process in any Azure region. Data Zone processes only within the zone (US, EU or APAC), following the Azure EU Data Boundary for the EU. A type without a prefix is tied to the geography you pick. Data at rest always stays in the designated geography.\n\nHere: steady, high, strict latency suggests Provisioned, which reserves capacity and gives consistent latency. EU residency suggests Data Zone. Add spillover to a Data Zone Standard deployment in the same Foundry resource so bursts do not fail with 429.\n\nFoundry does not load-balance or fail over deployments by itself, so put a gateway such as API Management in front for routing, health checks and circuit breaking. Data Zone and Global types are also preferred for resilience over a single-region Standard deployment.\n\nReservations discount provisioned cost but do not guarantee capacity: create the deployment first.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types", "https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/provisioned-throughput"], "ref": ["capacity-cost-and-throttling", "platform-network-and-reliability"]}, {"d": 1, "q": "You want to evaluate whether an agent used its tools efficiently compared with an expected sequence of tool calls, accepting `exact_match`, `in_order_match` or `any_order_match`. Which evaluator and prerequisite apply?", "o": [{"t": "Intent Resolution, which needs a judge deployment only", "c": false, "e": "It checks whether the agent understood the user's intent."}, {"t": "Customer Satisfaction, which compares with the system prompt", "c": false, "e": "It rates helpfulness, tone and resolution from the user's view."}, {"t": "Tool Call Success, which needs no data", "c": false, "e": "It checks only whether a call technically succeeded."}, {"t": "Task Navigation Efficiency, which needs ground truth (the expected sequence)", "c": true, "e": "It compares the agent's tool steps with an expected sequence."}], "concept": "Agent evaluators measure different parts of the process. Some compare against expectations, so they need ground truth: a known correct answer or sequence.\n\nTask Navigation Efficiency compares the actual sequence of tool calls with an expected sequence that you provide. It supports matching modes: `exact_match` (same steps, same order, no extras), `in_order_match` (the expected steps appear in the correct order, extra steps allowed) and `any_order_match` (all expected steps appear, in any order). Because it checks against an expected path, the prerequisite is the ground truth.\n\nTool Call Success needs no expected data: it checks whether tool calls ran without technical errors. Intent Resolution uses a judge model to rate whether the agent understood the request. \"Customer Satisfaction\" is not a built-in evaluator.\n\nMemory aid: comparing with a route plan requires the route plan.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/agent-evaluators"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 1, "q": "A team picked the model that ranks first on a public leaderboard for a contract-review assistant. Before moving it to production, which TWO checks does the guidance recommend?", "o": [{"t": "Accept the leaderboard rank as proof of quality for every task", "c": false, "e": "A rank is a published average; it says little about your own contracts."}, {"t": "Choose the largest model available, since size guarantees accuracy", "c": false, "e": "Larger models cost more and are slower; the smallest model that passes your tests is the target."}, {"t": "Open the License tab and confirm the provider's terms and the model's availability in your region", "c": true, "e": "Partner and community models come with provider terms, and a model that is not offered in your region cannot be deployed there."}, {"t": "Skip evaluation because a Preview label means Microsoft has certified the model", "c": false, "e": "Preview is a lifecycle label, not a certification, and production workloads should prefer GA models."}, {"t": "Test the model on your own prompts and documents, because benchmarks are averages", "c": true, "e": "Your data decides whether the model is good enough for your task."}], "concept": "A model catalog lists thousands of models, so you need a method to choose one. The recommended steps are: filter by task, features, region and lifecycle; compare benchmarks and cost; then test on your own data. Open the model card to read the Details, Deployments, Benchmarks and License tabs.\n\nBenchmarks are averages over public data sets. Your contracts, your prompts and your language may behave differently, so a short test of 30 to 50 real examples is worth more than a rank. The License tab matters because models from partners and the community are supported by the provider and billed through Azure Marketplace under the provider's terms.\n\nCommon mistakes are choosing by rank alone, ignoring the license, choosing a Preview model for a production workload, and choosing a model that is not available in your region.\n\nRule: shortlist with benchmarks, decide with your own test.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/foundry-models-overview"], "ref": ["model-and-service-selection"]}, {"d": 1, "q": "A team built agents in a hub-based project. They now want to use the current Foundry experience. What should they expect?", "o": [{"t": "The old project is converted in place by changing the SDK package", "c": false, "e": "The package version does not convert resources."}, {"t": "Conversations are moved by renaming the project", "c": false, "e": "Renaming does not migrate data."}, {"t": "There is no direct upgrade path for agents, files, conversations or vector stores; model deployments and quota can be reused", "c": true, "e": "Hub-based projects are the classic experience, and the content must be recreated in a Foundry project."}, {"t": "Everything migrates automatically with one click", "c": false, "e": "There is no direct upgrade path for these items."}], "concept": "Foundry has two project models. Hub-based projects belong to the classic experience, built on Azure Machine Learning hubs. The current Foundry experience uses a Foundry resource with Foundry projects, and agents there use the new Agent Service.\n\nThere is no direct upgrade path from hub-based to Foundry projects for agents, files, conversations and vector stores. You cannot move them with one click, by renaming, or by changing the SDK package. What you can reuse are model deployments and quota. The practical plan is to treat it as a migration: recreate the agents from code in the new project, re-upload files and rebuild vector stores, and decide how to handle old conversations (export or archive), then test and switch.\n\nThis is a good reason to keep agent definitions as code from the start.\n\nMemory aid: it is moving house, not renovating the same house; you can bring the furniture that is not bolted down (deployments, quota).", "src": ["https://learn.microsoft.com/en-us/azure/foundry/what-is-foundry"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "Two projects in one Foundry resource both use Responses API agents with the standard agent setup. Each project needs 3 to 5 Cosmos DB containers of 1,000 RU/s; three are created at provisioning and two more appear when Responses API agents are used. What is the minimum provisioned throughput to plan for?", "o": [{"t": "10,000 RU/s", "c": true, "e": "5 containers x 1,000 RU/s x 2 projects = 10,000 RU/s."}, {"t": "3,000 RU/s", "c": false, "e": "This is the minimum account throughput, not the requirement for these two projects."}, {"t": "6,000 RU/s", "c": false, "e": "This counts only the three provisioning-time containers, which applies to projects with classic agents only."}, {"t": "5,000 RU/s", "c": false, "e": "This is the figure for one project, not two."}], "concept": "Cosmos DB throughput is provisioned in request units per second (RU/s). Each project that uses the standard agent setup creates containers in your Cosmos DB account, and each container is provisioned at 1,000 RU/s.\n\nFor Responses API agents a project can have up to five containers: three are created at provisioning and two more appear when Responses API agents are used. The planning number for one project is therefore 5 x 1,000 = 5,000 RU/s. For two projects: 2 x 5,000 = 10,000 RU/s.\n\nThe wrong answers each use a different container count: 3,000 = 3 containers for one project, 6,000 = 3 containers for two projects, and 5,000 = 5 containers for one project. When the question says \"minimum to plan for\" and \"both projects use Responses API agents\", use the maximum container count and multiply by the number of projects.\n\nIf the account is under-provisioned, conversation reads and writes are throttled with 429 responses, which users feel as failing chats.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/use-your-own-resources"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "You configure private networking for a Foundry resource, Azure AI Search and Azure Cosmos DB. Which TWO statements about private DNS are correct?", "o": [{"t": "Private endpoints work without any DNS configuration", "c": false, "e": "Name resolution must return the private IP."}, {"t": "Link private DNS zones such as `privatelink.search.windows.net` and `privatelink.documents.azure.com` to the virtual network", "c": true, "e": "Without linked zones, names still resolve to public IPs."}, {"t": "A custom DNS server should forward these zones to the Azure DNS virtual server `168.63.129.16`", "c": true, "e": "This lets custom DNS resolve the private endpoint addresses."}, {"t": "One private DNS zone name works for every service", "c": false, "e": "Each service has its own zone name."}, {"t": "Private endpoints for Storage, AI Search and Cosmos DB are created automatically by the standard agent setup", "c": false, "e": "They are not auto-created, so you create them yourself."}], "concept": "Private networking has two halves: the private endpoint (a private IP for the service) and DNS (the name that resolves to that IP). DNS is where most setups break.\n\nEach Azure service has its own private DNS zone name, for example `privatelink.search.windows.net` for Azure AI Search and `privatelink.documents.azure.com` for Cosmos DB (NoSQL). You must create these zones and link them to the virtual network, so that machines in the network resolve the service names to private IPs. If you use a custom DNS server, it should forward queries for those zones to the Azure-provided DNS at `168.63.129.16`, which knows the private zones.\n\nPrivate endpoints for dependencies are not created automatically; you create them. There is no single zone name for all services. And without DNS configuration, the name still resolves to the public IP, so the private endpoint is not used.\n\nTest: `nslookup` from a VM in the network should return a private address.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks"], "ref": ["platform-network-and-reliability"]}, {"d": 1, "q": "A coding assistant generates SQL and shell snippets that developers paste into production scripts. A reviewer is worried that the generated code may contain insecure patterns. Which evaluator should be added to the pre-release safety suite?", "o": [{"t": "Groundedness", "c": false, "e": "It checks that answers stay inside the supplied context."}, {"t": "Customer Satisfaction", "c": false, "e": "It rates whether a user would be satisfied."}, {"t": "Code vulnerability", "c": true, "e": "It detects insecure patterns in generated code."}, {"t": "Task Navigation Efficiency", "c": false, "e": "It compares tool steps with an expected sequence."}], "concept": "Safety is more than offensive text. For an assistant that writes code, a major risk is that the code itself is unsafe, for example building SQL by string concatenation or running shell commands with unchecked input. The Code vulnerability evaluator looks for insecure patterns in generated code, and it is part of the risk and safety group together with Protected material, Ungrounded attributes, Indirect attack and the harm category evaluators.\n\nUse it in the pre-production stage: build a dataset with normal and adversarial requests (\"write a login query\"), run the evaluators and the red teaming agent, set a pass rule such as a maximum defect rate, and make it a release gate. A defect rate is the share of test cases that fail.\n\nAfter release, continue with sampled continuous evaluation and alerts. Code review by people remains important, because evaluators are aids and not guarantees.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators"], "ref": ["responsible-ai-governance"]}, {"d": 1, "q": "A product team plans to run a production workload on a model labeled Preview because it has the best benchmark results. Which risk should you point out, based on the model lifecycle?", "o": [{"t": "Models move from Preview to GA, then Deprecated and Retired; production workloads need a GA model and a replacement plan, with notices and pinned versions", "c": true, "e": "When a model retires, deployments stop working, as happened with `dall-e-3` on March 4, 2026."}, {"t": "Benchmarks are invalid for Preview models", "c": false, "e": "Benchmarks exist but do not replace testing on your own data."}, {"t": "Preview models cannot be deployed in Foundry", "c": false, "e": "They can be deployed, but they are not meant for production."}, {"t": "Preview models are always more expensive than GA models", "c": false, "e": "Price is not the lifecycle risk."}], "concept": "Models and features have a lifecycle. A model starts as Preview, becomes generally available (GA), is later marked Deprecated, and finally Retired, after which deployments stop working.\n\nPreview models can change, be limited in availability and quota, have no production SLA, and can be withdrawn with little time. A high benchmark score does not change that. Production workloads should run on a GA model, with a pinned version, an awareness of the retirement notices, and a plan for the replacement (evaluate the successor on your golden dataset before the retirement date).\n\nThe wrong statements: Preview models are not always more expensive, they can be deployed in Foundry, and benchmarks are not invalid for them.\n\nThis applies to any product: keep an inventory of models and features in use with their lifecycle stage and dates.\n\nMemory aid: a prototype car may be fast, but you do not use it as a taxi.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/foundry-models-overview"], "ref": ["model-and-service-selection"]}, {"d": 1, "q": "A locked-down environment includes jump boxes and self-hosted build agents with direct access to the data plane of the Foundry project. The security team asks whether their activity needs logging. What does the guidance say?", "o": [{"t": "No, because only end-user activity matters", "c": false, "e": "Privileged paths are the ones that most need an audit trail."}, {"t": "Yes, log activity on jump boxes and build agents, because they have direct data-plane access", "c": true, "e": "These hosts can reach data without passing the normal application path."}, {"t": "Only log them if keys are enabled", "c": false, "e": "Logging does not depend on key use."}, {"t": "Only log model token counts", "c": false, "e": "Token counts do not show who touched the data plane."}], "concept": "Monitoring is not only about model calls. In a locked-down environment, administrators reach the project through VPN, ExpressRoute or a jump box (for example with Azure Bastion), and pipelines run on self-hosted runners inside the network. These machines have direct data-plane access.\n\nLearn's guidance is to log activity on jump boxes and build agents. Together with diagnostic settings to Log Analytics (who called which deployment and when, with KQL), Azure Monitor alerts and Defender for AI services alerts on jailbreak attempts and data leakage, this gives an audit trail.\n\nRemember the log categories for Foundry Models: RequestResponse, Trace and Audit, and the roles Monitoring Reader to view and Monitoring Contributor to configure.\n\nCollecting logs costs money, so choose categories deliberately, but never skip the privileged paths.", "src": ["https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat", "https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/monitor-models"], "ref": ["observability-and-agent-lifecycle", "platform-network-and-reliability"]}, {"d": 1, "q": "Your company runs an internal HR question-and-answer bot. It is used only during office hours, traffic is low, and bursts are unpredictable. There is no data residency requirement. The team wants to pay only for what it uses. Which deployment type should you choose?", "o": [{"t": "Developer", "c": false, "e": "The Developer type is meant for evaluating fine-tuned models, has no SLA and a 24-hour lifetime. It is not for a production bot."}, {"t": "Batch", "c": false, "e": "Batch is asynchronous with a 24-hour target. It cannot serve an interactive chat bot."}, {"t": "Global Standard (pay-per-token)", "c": true, "e": "Standard deployments bill per token with no commitment, Global Standard is the documented default, and idle time costs nothing. That fits low and spiky traffic."}, {"t": "Provisioned (PTU)", "c": false, "e": "Provisioned capacity is billed per PTU per hour even when idle and is sized for the peak, so most of it would be wasted on low, bursty traffic."}], "concept": "A deployment type decides how the model is hosted, how you are billed, and where the data may be processed. Think of it as choosing how to buy electricity.\n\nStandard (pay-per-token) is like a normal meter: you pay only for the tokens you send and receive, and nothing when the app is idle. It shares capacity with other customers, so it is best effort, which is fine for variable or low traffic. Provisioned (PTU) is like renting a dedicated generator: you reserve capacity and pay every hour whether or not anyone uses it, in return for predictable latency. Batch is for large offline jobs with a 24-hour target and a discount. Developer is only for evaluating fine-tuned models, with no SLA.\n\nGlobal means the request may be processed in any region, which is the cheapest and most available routing. Data Zone and Regional restrict where processing happens.\n\nHow they relate: first decide the traffic shape (spiky and low, or steady and high), then the residency rule, then pick the type. An office-hours bot with no residency rule is a spiky, low-volume case, so pay-per-token Global Standard has zero idle cost.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types"], "ref": ["capacity-cost-and-throttling"]}, {"d": 1, "q": "A retail chatbot must serve 10,000 concurrent chat sessions with low latency and low cost. Answers are short FAQ-style replies, and there is no residency requirement. Which design is the best starting point?", "o": [{"t": "A small model on a Global Standard (or Standard) pay-per-token deployment", "c": true, "e": "A smaller model reduces both latency and cost per token, and pay-per-token fits a workload that has not shown a need for reserved capacity."}, {"t": "The largest available model on Provisioned capacity", "c": false, "e": "It raises cost and latency, and PTU pays off only for steady, high, proven volume."}, {"t": "A Batch deployment", "c": false, "e": "Batch has a 24-hour target and cannot serve live chat."}, {"t": "A reasoning model with `reasoning_effort=high`", "c": false, "e": "Hidden reasoning tokens add latency and cost to simple FAQ replies."}], "concept": "Choose a model and deployment type from the workload, not from the biggest numbers. The workload here has many concurrent users, short FAQ-style answers, a need for low latency and low cost, and no residency requirement.\n\nSmall models are faster and cheaper per token, and they are good enough for short, well-defined replies, especially with retrieval for the facts. A Global Standard (or Standard) pay-per-token deployment charges only for use and scales with a shared pool, which suits a retail pattern with peaks. If the load later becomes steady and high, or the latency target becomes strict, evaluate Provisioned.\n\nThe largest model on Provisioned is expensive and unnecessary for FAQ answers. A reasoning model with high effort adds hidden thinking, latency and cost. Batch is asynchronous, so a live chat cannot use it.\n\nRule: start with the smallest model that passes your evaluation, and move up only when measurements show a gap.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types"], "ref": ["capacity-cost-and-throttling", "model-and-service-selection"]}, {"d": 1, "q": "A company classifies 3 million short support tickets per day into twelve categories. A team lead proposes the largest available reasoning model \"to be safe\". The team has a labeled sample of 2,000 tickets. Which approach follows the guidance on choosing a model for each task?", "o": [{"t": "Use the largest reasoning model because quality is always worth the cost", "c": false, "e": "This raises cost and latency for a simple, high-volume task."}, {"t": "Evaluate a small language model on the labeled sample and choose the smallest model that passes the quality bar, moving up only if measurements show a gap", "c": true, "e": "Small models cut latency and cost per token for well-defined tasks."}, {"t": "Choose a multimodal model because it can also read images", "c": false, "e": "The tickets are short text, so multimodal capability adds nothing."}, {"t": "Fine-tune first, before trying any prompt or smaller model", "c": false, "e": "Fine-tuning is the last rung of the improvement ladder."}], "concept": "Choosing a model is five small decisions: which service, which model, which deployment option, which settings, and how you will keep it stable. For the model, the catalog offers large language models, small language models, multimodal models and purpose-built Foundry Tools.\n\nThe rule is to use the smallest model that passes your quality tests. A small model is faster and cheaper per token, which matters at 3 million requests a day. A multimodal model is needed only when the input includes images, audio or video. Reasoning models add hidden thinking tokens, so they cost more and respond more slowly; use them for multistep reasoning, not for simple labeling.\n\nTest with your own labeled sample, not with a leaderboard. If the small model falls short, climb one rung at a time: better prompt, grounding, a larger model, and fine-tuning last.\n\nPin the version and re-test before any upgrade.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/foundry-models-overview", "https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning"], "ref": ["model-and-service-selection"]}, {"d": 1, "q": "A developer holds the Foundry User role on a project. They build an agent successfully and then try to publish it as an agent application, but the action is denied. What is the least privileged role change that allows publishing?", "o": [{"t": "Assign Foundry Agent Consumer", "c": false, "e": "It only allows calling agent endpoints."}, {"t": "Assign Foundry Project Manager on the Foundry resource", "c": true, "e": "Publishing needs at least Project Manager."}, {"t": "Assign Cognitive Services Contributor", "c": false, "e": "Older Cognitive Services roles are not recommended for Foundry projects, except Usages Reader for quota."}, {"t": "Assign Azure AI Developer", "c": false, "e": "Learn advises not using this role for Foundry projects."}], "concept": "Foundry roles divide duties. Foundry Agent Consumer calls published agent endpoints only (a good fit for apps and end-user service principals). Foundry User builds and develops in a project, with reader access. Foundry Project Manager builds, publishes agents and assigns Foundry User to others. Foundry Account Owner creates accounts and projects and manages models but cannot build in projects. Foundry Owner has all rights.\n\nPublishing creates a stable endpoint and a distinct agent identity, so it is a more privileged act than building. It needs at least Project Manager on the Foundry resource.\n\nDo not use the older Cognitive Services roles (except Usages Reader for quota) or Azure AI Developer for Foundry projects. Keys bypass role-based access control, so prefer Microsoft Entra ID.\n\nAfter publishing, reassign the access the new agent identity needs: the permissions of the shared project identity do not transfer.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry", "https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/agent-identity"], "ref": ["agent-safety-and-identity"]}, {"d": 1, "q": "A developer opens the Foundry portal and finds no traces for a prompt agent that was clearly used. The code has no errors. Which two things should be checked first?", "o": [{"t": "That the agent has been deleted and recreated with a different name", "c": false, "e": "Renaming and recreating does not affect where traces are stored."}, {"t": "That the guardrail is set to annotate only", "c": false, "e": "Guardrail mode affects content decisions, not telemetry."}, {"t": "That the project is connected to an Application Insights resource and the viewer has a Log Analytics reader role", "c": true, "e": "Foundry stores traces in Azure Monitor Application Insights, and the portal needs read access to the workspace."}, {"t": "That the model deployment is set to Provisioned", "c": false, "e": "Deployment type does not control tracing."}], "concept": "A trace records every step of one request: model calls, tool calls with arguments and results, token use and timing. Foundry uses OpenTelemetry conventions and sends traces to Azure Monitor Application Insights.\n\nFor traces to appear, three things must be true. The project must be connected to an Application Insights resource. The person viewing must be able to query the data, which in the portal needs a Log Analytics reader role. And the code must carry the instrumentation for the framework in use (for example LangChain, LangGraph, the OpenAI Agents SDK or the Microsoft Agent Framework).\n\nTracing is generally available for prompt and hosted agents, while workflow and external agents are Preview. Retention and sampling follow your Application Insights configuration.\n\nCheck connection, then permission, then instrumentation, before suspecting the agent.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/observability/concepts/trace-agent-concept", "https://learn.microsoft.com/en-us/azure/foundry/concepts/observability"], "ref": ["observability-and-agent-lifecycle"]}, {"d": 1, "q": "A team has two immutable agent versions in production, `support:7` and `support:8`. After the release of version 8, task adherence drops. They want to return to the previous behavior quickly. Which statement is correct?", "o": [{"t": "Versions are immutable, so rollback means pointing traffic back at `support:7`; canary and blue-green routing need a routing layer that you build", "c": true, "e": "Foundry does not provide canary routing, and an existing version never changes."}, {"t": "Foundry shifts 5% of traffic to the new version automatically", "c": false, "e": "Canary routing must be built by you."}, {"t": "Delete the agent and recreate it with the same name", "c": false, "e": "A saved agent's name cannot change, and deleting loses history."}, {"t": "Edit version 7 in place and redeploy it as 9", "c": false, "e": "Versions never change. A change creates a new version."}], "concept": "Agent versions are immutable: any change creates a new version, referenced as `name:version`. The old version remains available. That makes rollback simple: point your callers back at `support:7`. You do not edit version 7 in place (it cannot be edited), and you do not delete the agent, which would lose history and invalidate IDs.\n\nFoundry does not shift traffic gradually between versions by itself. Canary releases (for example 5% on version 8, 95% on version 7) and blue-green switching need a routing layer that you build, such as an API gateway or application logic with configuration for the version name.\n\nProcedure after the drop in task adherence: switch traffic to version 7, keep version 8 for investigation, compare the two on the same golden dataset to find what regressed, fix and release as version 9.\n\nMemory aid: versions are saved photographs; rollback is hanging the old photograph back on the wall.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/development-lifecycle"], "ref": ["observability-and-agent-lifecycle", "cicd-for-foundry-projects"]}, {"d": 1, "q": "A risk and safety evaluation of a wellbeing chatbot shows the model sometimes infers a user's emotional state or other protected traits that the conversation never stated. Which evaluator is built to detect this?", "o": [{"t": "Violence", "c": false, "e": "It scores violent content in the output."}, {"t": "Code vulnerability", "c": false, "e": "It detects insecure patterns in generated code."}, {"t": "Ungrounded attributes", "c": true, "e": "It detects inferring protected traits, such as an emotional state, that are not present in the context."}, {"t": "Protected material", "c": false, "e": "It detects copyrighted text or code in the output."}], "concept": "Risk and safety evaluators run in the hosted Foundry Evaluation service, so you do not deploy a judge model. They cover several kinds of risk. Hate and unfairness, Sexual, Violence and Self-harm score harm categories from 0 to 7 (default threshold 3; a case passes if its score is at or below the threshold). Protected material finds copyrighted text or code. Code vulnerability finds insecure patterns in generated code. Ungrounded attributes finds inferences of protected traits that are not present in the context. Indirect attack finds attacks hidden in content. Prohibited actions and Sensitive data leakage (both Preview) are for agents.\n\nUngrounded attributes matches this case: the chatbot \"guessed\" something about the user that the conversation never said. The risk is both accuracy and fairness.\n\nMatch the symptom to the evaluator name before choosing: each one answers a different question.", "src": ["https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators", "https://learn.microsoft.c
